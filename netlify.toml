# Netlify build for Differential (Quartz 5)
[build]
  command = "npx quartz plugin install && npx quartz build"
  publish = "public"

[build.environment]
  NODE_VERSION = "22"

# Quiz and flowchart pages are plain HTML. Let them load inside the site's iframes.
[[headers]]
  for = "/static/pages/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    Cache-Control = "public, max-age=300"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
