<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Block 1 Practice Test 2</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;600;700&display=swap">
<style>
/* Nexus quiz page. Matches the site: neutral greys, one typeface, and the block's colour as --accent. */
:root{
  --bg:#f5f6f8;--paper:#ffffff;--ink:#15181d;--muted:#4d5560;--faint:#7b828d;--line:#e0e3e8;
  --accent:#0b7a75;--soft:#eef0f3;
  --ok:#1d7a46;--okw:#e7f4ec;--bad:#b42318;--badw:#fcecea;--tick:#dfe2e7;
  --display:"Atkinson Hyperlegible Next","Segoe UI",system-ui,-apple-system,sans-serif;
  --body:"Atkinson Hyperlegible Next","Segoe UI",system-ui,-apple-system,sans-serif;
  --r:8px;
}
:root[data-b="2"]{--accent:#4f46c8}:root[data-b="3"]{--accent:#a3246b}:root[data-b="4"]{--accent:#a35f08}
:root[data-theme="dark"]{
  --bg:#14161a;--paper:#1b1e24;--ink:#eceef2;--muted:#b3bac5;--faint:#8a919c;--line:#2d323b;
  --accent:#45c2b8;--soft:#252930;
  --ok:#5ccf8f;--okw:#13301f;--bad:#f2877c;--badw:#3a1c1a;--tick:#30353e;color-scheme:dark}
:root[data-theme="dark"][data-b="2"]{--accent:#a49df6}:root[data-theme="dark"][data-b="3"]{--accent:#ef8ec0}:root[data-theme="dark"][data-b="4"]{--accent:#e3a548}
.btn:hover:not(:disabled){filter:brightness(.92)}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55}
.wrap{max-width:820px;margin:0 auto;padding-block:28px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:20px}

/* Header */
header{display:flex;flex-direction:column;gap:10px}
.context{margin:0;color:var(--faint);font-size:14px;font-weight:600}
h1{font-family:var(--display);font-weight:700;font-size:clamp(28px,5vw,40px);line-height:1.05;letter-spacing:-.02em;margin:0;text-wrap:balance}
.stats{display:flex;flex-wrap:wrap;gap:6px 22px;font-size:15px;color:var(--muted);font-variant-numeric:tabular-nums}
.stats b{color:var(--ink);font-weight:700}
.bar{height:6px;border-radius:999px;background:var(--tick);overflow:hidden}
.bar span{display:block;height:100%;width:0;background:var(--accent);border-radius:999px;transition:width .25s ease}
.map summary{cursor:pointer;color:var(--accent);font-weight:600;font-size:14px;width:max-content;list-style:none;padding:2px 0}
.map summary::-webkit-details-marker{display:none}
.map summary::before{content:"▸";display:inline-block;margin-right:6px;transition:transform .15s ease}
.map[open] summary::before{transform:rotate(90deg)}
.map summary:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:4px}
.ticks{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}
.tick{width:14px;height:14px;border:0;border-radius:4px;background:var(--tick);padding:0;cursor:pointer}
.tick:hover{background:var(--faint)}
.tick.ok{background:var(--ok)}.tick.bad{background:var(--bad)}
.tick.cur{outline:2px solid var(--accent);outline-offset:2px}
.tick.redo{box-shadow:inset 0 -3px 0 var(--accent)}
.tick:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.save{font-size:13px;color:var(--faint)}
.save.ok{color:var(--ok)}.save.bad{color:var(--bad)}

/* Question card */
.card{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:26px;display:flex;flex-direction:column;gap:18px}
.chead{display:flex;justify-content:space-between;align-items:center;gap:10px}
.tag{font-size:13px;font-weight:700;color:var(--accent);background:var(--soft);padding:3px 9px;border-radius:4px}
.qn{font-family:var(--display);font-weight:700;font-size:15px;color:var(--faint);font-variant-numeric:tabular-nums}
.stem{font-size:18.5px;line-height:1.6;margin:0;white-space:pre-line;max-width:70ch}
.hint{font-size:13px;color:var(--faint)}
.tries{font-size:13px;color:var(--muted)}
.tries .bad{color:var(--bad);font-weight:600}.tries .ok{color:var(--ok);font-weight:600}

/* Options */
.opts{display:flex;flex-direction:column;gap:10px}
.optrow{display:flex;gap:8px;align-items:stretch}
.optrow .opt{flex:1;min-width:0}
.opt{display:flex;gap:14px;align-items:center;text-align:left;width:100%;background:var(--paper);color:var(--ink);border:1.5px solid var(--line);border-radius:var(--r);padding:12px 16px;font:inherit;font-size:16.5px;line-height:1.45;cursor:pointer;transition:border-color .12s ease,background .12s ease}
.opt:hover:not(:disabled){border-color:var(--accent);background:var(--soft)}
.opt:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.opt:disabled{cursor:default}
.opt .k{flex:none;display:inline-grid;place-items:center;width:30px;height:30px;border-radius:6px;background:var(--soft);color:var(--accent);font-family:var(--display);font-weight:700;font-size:14px}
.opt.right{border-color:var(--ok);background:var(--okw)}
.opt.right .k{background:var(--ok);color:var(--paper)}
.opt.wrong{border-color:var(--bad);background:var(--badw)}
.opt.wrong .k{background:var(--bad);color:var(--paper)}
.strike{flex:none;width:44px;border:1.5px solid var(--line);border-radius:var(--r);background:var(--paper);color:var(--faint);font-size:14px;cursor:pointer;display:grid;place-items:center}
.strike:hover{border-color:var(--accent);color:var(--accent)}
.strike:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.strike[aria-pressed="true"]{background:var(--soft);color:var(--ink)}
.optrow.struck .opt > span:last-child{text-decoration:line-through;color:var(--faint)}
.optrow.struck .opt .k{opacity:.45}

/* Feedback */
.fb{background:var(--bg);border-radius:var(--r);padding:18px 20px;display:flex;flex-direction:column;gap:10px}
.verdict{font-family:var(--display);font-weight:700;font-size:18px;display:flex;align-items:center;gap:8px}
.verdict::before{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;font-size:13px;color:var(--paper)}
.verdict.ok{color:var(--ok)}.verdict.ok::before{content:"✓";background:var(--ok)}
.verdict.bad{color:var(--bad)}.verdict.bad::before{content:"✕";background:var(--bad)}
.fb p{margin:0;max-width:72ch}
.fb .why,.fb .alt{display:flex;gap:10px;align-items:baseline}
.fb .why{font-weight:600}
.lk{flex:none;display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--line);color:var(--muted);font-family:var(--display);font-weight:700;font-size:12px;transform:translateY(-1px)}
.lk.ok{background:var(--ok);color:var(--paper)}
.fb .alt{color:var(--muted)}
.fb .take{border-left:3px solid var(--accent);padding:2px 0 2px 12px;color:var(--ink)}
.fb .take b{color:var(--accent)}
.obj{font-size:13.5px;color:var(--faint);line-height:1.5}
.obj b{color:var(--muted)}
.fbtools{display:flex;justify-content:flex-end}

/* Buttons */
.nav{display:flex;justify-content:space-between;gap:10px}
.btn{font-family:var(--display);font-weight:700;font-size:15px;padding:10px 20px;border:1.5px solid var(--accent);border-radius:6px;background:var(--accent);color:var(--paper);cursor:pointer}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.ghost:hover:not(:disabled){background:var(--soft);color:var(--accent);border-color:var(--accent)}
.btn:disabled{opacity:.35;cursor:default}
.btn:focus-visible{outline:2px solid var(--ink);outline-offset:3px}

/* Results */
.big{font-family:var(--display);font-size:clamp(48px,9vw,72px);font-weight:700;line-height:1;letter-spacing:-.03em;color:var(--accent);font-variant-numeric:tabular-nums}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
td,th{text-align:left;padding:9px 0;border-bottom:1px solid var(--line);font-size:15px;vertical-align:middle}
th{font-size:13px;font-weight:700;color:var(--faint)}
td:last-child,th:last-child{text-align:right;white-space:nowrap;padding-left:12px}
.meter{display:block;height:5px;border-radius:999px;background:var(--tick);margin-top:6px;max-width:320px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent);border-radius:999px}
h2{font-family:var(--display);font-size:21px;font-weight:700;margin:6px 0 0}
h3{font-size:14px;font-weight:700;color:var(--faint);margin:6px 0 0}
.miss{margin:0;padding-left:0;list-style:none;display:flex;flex-direction:column;gap:8px;font-size:15px}
.miss code{font-family:var(--display);font-weight:700;font-size:13px;color:var(--bad);background:var(--badw);padding:1px 7px;border-radius:999px;margin-right:8px}

@media (max-width:560px){.card{padding:18px}.stem{font-size:17.5px}.opt{padding:11px 12px;gap:10px}.strike{width:40px}}
@media (prefers-reduced-motion:no-preference){.fb{animation:in .2s ease-out}@keyframes in{from{opacity:.3;transform:translateY(4px)}to{opacity:1;transform:none}}}
@media (prefers-reduced-motion:reduce){.bar span,.opt,.map summary::before{transition:none}}
</style>

/* Block colour, and the same light or dark choice as the site's toggle. */

    r.dataset.theme = t || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"); }
  theme(); addEventListener("storage",theme);
})();

<script>
const QUESTIONS = [{"c": "Week 1", "p": "A physician diagnoses a patient with hypertension, decides the therapeutic objective is to lower blood pressure to reduce cardiovascular risk, then reviews the patient's other medications for interactions before selecting an antihypertensive. Which step of the WHO 6-step framework for rational prescribing does reviewing for interactions and comedications best represent?", "o": ["Treatment choice", "Patient's problem", "Therapeutic objective", "Monitor treatment"], "a": 0, "e": "Correct: A. Reviewing contraindications, interactions, and comedications before selecting a specific drug is the \"treatment choice\" step, distinct from defining the patient's problem or therapeutic objective earlier in the framework.", "l": []}, {"c": "Week 1", "p": "A student is asked to distinguish \"pharmacology\" from \"therapeutics.\" Which statement correctly differentiates the two?", "o": ["Pharmacology refers only to drug side effects, while therapeutics refers only to dosing", "Pharmacology is the study of how drugs affect the body and are affected by it, while therapeutics is the practical application of that knowledge to treat disease", "The two terms are interchangeable and have no meaningful distinction", "Therapeutics refers only to non-pharmacological treatment approaches"], "a": 1, "e": "Correct: B. Pharmacology is the broader science of drug action and disposition, therapeutics is the applied practice of using that knowledge (pharmacological and non-pharmacological) to treat patients.", "l": []}, {"c": "Week 1", "p": "After starting a new medication, a physician schedules a follow-up visit specifically to determine whether the drug is working, needs a dose adjustment, or should be discontinued. Which principle of rational prescribing does this best reflect?", "o": ["Give patient information", "Start treatment", "Monitor treatment", "Treatment choice"], "a": 2, "e": "Correct: C. Monitoring treatment, the final WHO step, involves following up to continue, adjust, or stop therapy based on response.", "l": []}, {"c": "Week 1", "p": "A 50-year-old man has a 20-pack-year smoking history and is also found to have hypertension on a routine visit. Which statement correctly classifies these two findings?", "o": ["Smoking is a risk condition, hypertension is a risk factor", "Both are risk factors", "Both are risk conditions", "Smoking is a risk factor, hypertension is a risk condition"], "a": 3, "e": "Correct: D. A risk factor is an individual characteristic or behaviour (like smoking) that increases the likelihood of a negative outcome. A risk condition is itself a chronic condition (like hypertension) that contributes to further risk.", "l": []}, {"c": "Week 1", "p": "A public health nutritionist notes that even though patients are individually counselled about healthy eating, food deserts in their neighbourhood limit access to fresh produce. Which approach would most directly address this structural barrier?", "o": ["A population-based strategy addressing the determinants of incidence at a community level", "A high-risk individual clinical strategy targeting counselled patients", "Tertiary prevention", "A purely informative model of the physician-patient relationship"], "a": 0, "e": "Correct: A. A population strategy targets the determinants of incidence at a community level (like food access), shifting the distribution of risk, rather than focusing only on high-risk individuals one at a time.", "l": []}, {"c": "Week 1", "p": "A resident feels deep unease after being required to continue aggressive treatment she personally believes is futile, even though there is no genuine disagreement among the care team about the correct course of action. Which term best describes her experience?", "o": ["An ethical dilemma, since two competing but equally valid options exist", "Moral distress, since she knows the right action but feels constrained from acting on it", "A procedural framework failure", "Casuistry"], "a": 1, "e": "Correct: B. Moral distress occurs when a person knows what they believe is the right action but feels unable to act on it due to institutional or other constraints, distinct from an ethical dilemma, where two comparably weighted options genuinely conflict.", "l": []}, {"c": "Week 1", "p": "A committee resolving an ethical conflict first gathers relevant clinical data and identifies the values at stake, then clarifies the specific goals and names the ethical conflict precisely, before evaluating why the problem exists. Which two steps of the practical ethical decision-making framework are being described, in order?", "o": ["Determination, then Implementation", "Designation, then Recognition", "Recognition, then Designation", "Clarification, then Evaluation"], "a": 2, "e": "Correct: C. Recognition (gathering data, identifying relevant values) comes first, followed by Designation (clarifying goals and naming the ethical conflict), before Evaluation, Clarification, Determination, and Implementation.", "l": []}, {"c": "Week 1", "p": "A 19th-century researcher isolates a bacterium suspected of causing a disease, develops a laboratory test to detect it, and later identifies a chemical agent capable of treating the resulting infection. Which historical framework does this three-part process best exemplify?", "o": ["Humoral theory", "Hippocratic diagnostic method", "Galenic anatomical framework", "Germ theory"], "a": 3, "e": "Correct: D. Germ theory's three-part process is: identify the micro-organism, develop a laboratory diagnostic test, and discover a chemotherapeutic agent, exactly the sequence described.", "l": []}, {"c": "Week 1", "p": "A historian describes a physician who took the clinically grounded practice inherited from his predecessor and set it within a broader framework of anatomy and physiology, greatly expanding the theoretical basis of medical practice. Which historical figure does this best describe?", "o": ["Galen", "Hippocrates", "William Osler", "Not attributable to any of these figures"], "a": 0, "e": "Correct: A. Galen took Hippocratic clinical medicine and set it within a wider anatomy and physiology framework, distinct from Hippocrates (who introduced the practitioner as diagnostician/therapist) and Osler (known for emphasizing the doctor-patient relationship).", "l": []}, {"c": "Week 1", "p": "A clinic serving a large refugee population is reviewing WHO guidance on refugee and migrant health. Which of the following statements from that guidance is accurate?", "o": ["Refugees and migrants are, as a group, generally unhealthy on arrival due to their journey", "Refugees and migrants have a lower risk of most cancers compared to the host population, but a higher rate of diabetes", "The number of migrants globally is typically underestimated by the public", "Children traveling with at least one parent face the same vulnerability as unaccompanied minors"], "a": 1, "e": "Correct: B. WHO guidance notes refugees/migrants are generally healthy on arrival, that migrant numbers are often overestimated (not underestimated), that they have lower cancer risk (except cervical cancer) but higher diabetes rates, and that children without any parent or guardian are especially vulnerable.", "l": []}, {"c": "Week 1", "p": "A hospital's billing policy is challenged because it charges an extra fee for a medically necessary service already covered under provincial health insurance, on top of what the province pays. Which principle of the Canada Health Act does this violate?", "o": ["Portability", "Universality", "Accessibility", "Comprehensiveness"], "a": 2, "e": "Correct: C. The accessibility principle requires reasonable access to insured services without financial barriers such as extra-billing or user fees, which this billing policy violates.", "l": []}, {"c": "Week 1", "p": "An occupational therapist notes that an elderly patient can still bathe, dress, and feed herself independently, but has recently been unable to manage her own finances or prepare meals safely. Which statement correctly classifies these findings?", "o": ["Both sets of findings reflect ADL deficits", "Both sets of findings reflect IADL deficits", "The preserved skills are IADLs, the impaired skills are ADLs", "The preserved skills are ADLs, the impaired skills are IADLs"], "a": 3, "e": "Correct: D. Bathing, dressing, and feeding are activities of daily living (ADLs), which are preserved here. Managing finances and preparing meals are instrumental activities of daily living (IADLs), which are impaired.", "l": []}, {"c": "Week 2", "p": "A biochemist compares two nucleic acid samples: one is double-stranded, relatively stable, and contains thymine with a methyl group, the other is single-stranded, degrades quickly, and contains uracil instead of thymine. Which molecules are being described, respectively?", "o": ["DNA, then RNA", "RNA, then DNA", "Both are DNA", "Both are RNA"], "a": 0, "e": "Correct: A. DNA is double-stranded, relatively stable, and uses thymine (with a methyl group), RNA is single-stranded, degrades quickly, and uses uracil instead of thymine.", "l": []}, {"c": "Week 2", "p": "A drug binds to the active site of an enzyme, directly preventing substrate from binding. Increasing the substrate concentration can overcome this effect and restore maximal enzyme activity. Which type of enzyme inhibition does this describe?", "o": ["Noncompetitive inhibition", "Competitive inhibition", "Irreversible inhibition", "Allosteric activation"], "a": 1, "e": "Correct: B. Competitive inhibition involves a molecule competing with substrate for the active site, because it's a reversible competition, sufficiently high substrate concentration can outcompete the inhibitor and restore maximal activity.", "l": []}, {"c": "Week 2", "p": "A different drug binds to a site on an enzyme distinct from the active site, reducing the enzyme's activity in a way that cannot be overcome by adding more substrate. Which type of inhibition does this describe?", "o": ["Competitive inhibition", "Substrate saturation", "Noncompetitive inhibition", "Positive cooperativity"], "a": 2, "e": "Correct: C. Noncompetitive inhibition involves binding at a site other than the active site, since the inhibitor doesn't compete directly with substrate, adding more substrate cannot overcome the inhibition.", "l": []}, {"c": "Week 2", "p": "As blood glucose rises after a meal, insulin secretion increases, which promotes glucose uptake into cells and lowers blood glucose back toward baseline, subsequently reducing further insulin release. Which type of feedback control system is this?", "o": ["Positive feedback", "Feedforward control only", "An open-loop system with no feedback", "Negative feedback"], "a": 3, "e": "Correct: D. This is negative feedback: the response (falling glucose) counteracts and reduces the original stimulus (elevated insulin secretion), returning the system toward its set point.", "l": []}, {"c": "Week 2", "p": "A red blood cell is placed in a solution with a lower effective osmolality (hypotonic) than the intracellular fluid. What is the expected result?", "o": ["The cell will swell and may lyse as water moves in", "The cell will shrink as water moves out", "The cell will remain unchanged in size", "The cell membrane will become impermeable to water"], "a": 0, "e": "Correct: A. In a hypotonic solution, water moves into the cell (toward the higher effective solute concentration inside), causing the cell to swell and potentially lyse.", "l": []}, {"c": "Week 2", "p": "A different red blood cell is placed in a hypertonic solution relative to the intracellular fluid. What is the expected result?", "o": ["The cell will swell and may lyse", "The cell will shrink as water moves out of the cell", "No net water movement will occur", "The cell will divide"], "a": 1, "e": "Correct: B. In a hypertonic solution, water moves out of the cell toward the higher effective solute concentration outside, causing the cell to shrink (crenate).", "l": []}, {"c": "Week 2", "p": "Under polarized light microscopy, skeletal muscle shows alternating light and dark bands. The dark band, which does not change its overall length during contraction (though a central zone within it narrows), corresponds to the region containing myosin thick filaments. Which band is being described?", "o": ["I band", "H zone", "A band", "Z line"], "a": 2, "e": "Correct: C. The A band (anisotropic) contains the full length of the thick filaments and does not change length during contraction, even though the H zone within it narrows as filaments slide, distinct from the I band, which does shorten.", "l": []}, {"c": "Week 2", "p": "A physiology student describes a specialized junction where an axon terminal releases neurotransmitter that diffuses across a narrow gap to bind receptors on an adjacent cell, converting an electrical signal into a chemical one and then back into an electrical signal. Which structure is being described?", "o": ["Gap junction", "Desmosome", "Tight junction", "Synapse"], "a": 3, "e": "Correct: D. This describes a synapse, where an electrical signal is converted to a chemical signal (neurotransmitter release) and back to an electrical signal on the postsynaptic side, distinct from a gap junction, which allows direct electrical/chemical continuity without a chemical intermediary step.", "l": []}, {"c": "Week 2", "p": "A patient recovering from a peripheral nerve injury is told that although neurons themselves do not divide, some functional recovery is still possible. Which statement correctly describes the basis for this recovery?", "o": ["Axonal sprouts form and Schwann cells re-innervate the muscle, restoring some function", "New neurons regenerate from local stem cells", "Oligodendrocytes migrate to the peripheral nervous system to assist repair", "Complete recovery of severed axons is universal and rapid"], "a": 0, "e": "Correct: A. Peripheral nerve repair occurs through axonal sprouting, with Schwann cells (not oligodendrocytes, which are CNS-specific) re-innervating the target muscle, neurons themselves do not regenerate by division.", "l": []}, {"c": "Week 2", "p": "A researcher studies a CNS support cell that transforms into a phagocytic, migratory cell in response to tissue damage, acting as part of the CNS's defence system. Which neuroglial cell is this?", "o": ["Astrocyte", "Microglia", "Ependymal cell", "Schwann cell"], "a": 1, "e": "Correct: B. Microglia transform into phagocytic, migratory cells in a damaged CNS as part of its defence system, distinct from astrocytes (blood-brain barrier maintenance) and ependymal cells (CSF propulsion).", "l": []}, {"c": "Week 2", "p": "A single nucleotide change in a gene results in a codon that specifies the same amino acid as before, with no change to the resulting protein. Which type of mutation does this describe?", "o": ["Missense mutation", "Nonsense mutation", "Silent mutation", "Frameshift mutation"], "a": 2, "e": "Correct: C. A silent mutation changes the DNA sequence without changing the resulting amino acid, due to the redundancy (degeneracy) of the genetic code.", "l": []}, {"c": "Week 2", "p": "A different mutation involves the insertion of a single nucleotide, shifting the reading frame for every codon downstream of the insertion and typically producing a severely altered or truncated protein. Which type of mutation is this?", "o": ["Silent mutation", "Missense mutation", "Synonymous mutation", "Frameshift mutation"], "a": 3, "e": "Correct: D. A frameshift mutation results from insertions or deletions that are not multiples of three nucleotides, shifting the reading frame downstream and typically producing a severely altered protein.", "l": []}, {"c": "Week 2", "p": "A fluoroquinolone antibiotic is prescribed for a urinary tract infection. Which statement correctly describes its mechanism at the level of bacterial DNA replication?", "o": ["It inhibits bacterial DNA gyrase/topoisomerase, preventing DNA unwinding and replication", "It binds the bacterial 30S ribosomal subunit, blocking protein synthesis", "It inhibits bacterial cell wall synthesis", "It directly damages bacterial RNA"], "a": 0, "e": "Correct: A. Fluoroquinolones inhibit bacterial DNA gyrase and topoisomerase IV, enzymes required for DNA unwinding and replication, distinct from antibiotics that target the ribosome or cell wall.", "l": []}, {"c": "Week 2", "p": "A macrolide antibiotic is prescribed for a respiratory infection. Which statement correctly describes its mechanism?", "o": ["It inhibits bacterial DNA gyrase", "It binds the bacterial 50S ribosomal subunit, blocking protein synthesis", "It inhibits folic acid synthesis", "It disrupts the bacterial cell membrane directly"], "a": 1, "e": "Correct: B. Macrolides bind the bacterial 50S ribosomal subunit, blocking protein synthesis, distinct from fluoroquinolones (DNA gyrase) or sulfonamides (folic acid synthesis).", "l": []}, {"c": "Week 2", "p": "Researchers running a multi-center trial want to ensure that important prognostic variables, such as disease severity, are evenly distributed between treatment and control groups at each site. Which randomization method is specifically designed to achieve this balance across known subgroups?", "o": ["Simple randomization", "Block randomization", "Stratified randomization", "No randomization is needed if allocation concealment is used"], "a": 2, "e": "Correct: C. Stratified randomization divides participants into subgroups (strata) based on key prognostic variables before randomizing within each stratum, ensuring balance across those specific variables.", "l": []}, {"c": "Week 2", "p": "A trial analyzes outcomes according to the treatment group patients were originally assigned to, regardless of whether they actually completed that treatment. Which type of analysis is this, and what is one advantage of this approach?", "o": ["Per-protocol analysis, it isolates the true biologica const OBJECTIVES = {};

const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");

function score(){ return ans.reduce((n,a,i)=>n+(a!==null&&a===QUESTIONS[i].a?1:0),0); }
function answered(){ return ans.filter(a=>a!==null).length; }
function firstTryScore(){ return tries.reduce((n,t)=>n+(t.length&&t[0].ok?1:0),0); }
function firstTryCount(){ return tries.filter(t=>t.length).length; }

function renderHeader(){
  const bf=$("#barfill"); if(bf) bf.style.width=(100*answered()/N)+"%";
  $("#stats").innerHTML = `<span>Question <b>${showResults?"–":cur+1}</b> of <b>${N}</b></span><span>Answered <b>${answered()}</b></span><span>Score <b>${score()} / ${answered()}</b></span>`;
  $("#ticks").innerHTML = QUESTIONS.map((q,i)=>{
    const st = ans[i]===null?"":(ans[i]===q.a?"ok":"bad");
    const redo = tries[i].length>1 || (ans[i]===null && tries[i].length>0);
    return `<button class="tick ${st} ${redo?"redo":""} ${(!showResults&&i===cur)?"cur":""}" data-i="${i}" aria-label="Question ${i+1}"></button>`;
  }).join("");
  document.querySelectorAll(".tick").forEach(b=>b.onclick=()=>{cur=+b.dataset.i;showResults=false;render();});
}

function triesLine(i, includeCurrent){
  const t = includeCurrent ? tries[i] : tries[i];
  if(!t.length) return "";
  const parts = t.map((x,k)=>`<span class="${x.ok?"ok":"bad"}">${k+1}: ${L[x.pick]} ${x.ok?"correct":"wrong"}</span>`).join(" · ");
  return `<div class="tries">Attempts ${parts}</div>`;
}

function fmtLine(t){
  let m;
  if((m=t.match(/^Correct:\s*([A-E])\.?\s*(.*)$/)) || (m=t.match(/^([A-E]) is correct\.?\s*(.*)$/)))
    return `<p class="why"><span class="lk ok">${m[1]}</span><span>${esc(m[2])}</span></p>`;
  if((m=t.match(/^([A-E]):\s*(.*)$/)))
    return `<p class="alt"><span class="lk">${m[1]}</span><span>${esc(m[2])}</span></p>`;
  if((m=t.match(/^(Takeaway|High yield|High-yield|Key point|Clues):\s*(.*)$/i)))
    return `<p class="take"><b>${esc(m[1])}.</b> ${esc(m[2])}</p>`;
  return `<p>${esc(t)}</p>`;
}

function renderQ(){

    b.onclick=()=>{ const p=+b.dataset.i; ans[cur]=p; tries[cur].push({pick:p, ok:p===q.a, at:new Date().toISOString()}); tries[cur]=tries[cur].slice(-10); strikes[cur]=[]; render(false); persist(); };

function toggleStrike(i){
  const s = strikes[cur], k = s.indexOf(i);
  if(k<0) s.push(i); else s.splice(k,1);
  render(false); persist();
}

function renderResults(){

  const missed = {};

    <table><thead><tr><th>Topic</th><th>Score</th></tr></thead><tbody>${rows}</tbody></table>
    <h2>Objectives to review</h2><p class="hint">Includes questions you missed on the first try, even if a redo got them right.</p>${missHtml}${history.length?`<h2>Past attempts</h2><table><thead><tr><th>Date</th><th>Score</th></tr></thead><tbody>${history.slice().reverse().map(h=>`<tr><td>${new Date(h.date).toLocaleDateString()}</td><td>${h.score} / ${h.total}</td></tr>`).join("")}</tbody></table>`:""}
    <div class="nav"><button class="btn ghost" id="back">Back to questions</button><button class="btn" id="restart">Restart all</button></div>

  $("#back").onclick=()=>{showResults=false;render();};

function setSave(text, cls){ const el=$("#save"); if(el){ el.textContent=text; el.className="save "+(cls||""); } }
function bodyOf(){
  const a = {};
  QUESTIONS.forEach((q,i)=>{
    if(ans[i]===null && !tries[i].length && !strikes[i].length) return;
    a["q"+(i+1)] = {pick:ans[i], ok:ans[i]!==null && ans[i]===q.a, l:q.l, tries:tries[i], strikes:strikes[i]};
  });
  return {answers:a, history, total:N, answered:answered(), score:score(), firstTry:firstTryScore(), updatedAt:new Date().toISOString()};
}
function validPick(i,p){ return Number.isInteger(p) && p>=0 && p<QUESTIONS[i].o.length; }

    if(!(i>=0 && i<N) || !row || typeof row!=="object") continue;
    if(validPick(i,row.pick)) ans[i]=row.pick;
    if(Array.isArray(row.tries)) tries[i]=row.tries.filter(t=>t&&validPick(i,t.pick)).map(t=>({pick:t.pick, ok:t.pick===QUESTIONS[i].a, at:String(t.at||"")})).slice(-10);
    else if(ans[i]!==null) tries[i]=[{pick:ans[i], ok:ans[i]===QUESTIONS[i].a, at:""}];
    if(Array.isArray(row.strikes)) strikes[i]=row.strikes.filter(x=>validPick(i,x));
  }
  history = Array.isArray(d.history) ? d.history.slice(-20) : [];
  const first = ans.findIndex(x=>x===null); cur = first<0 ? N-1 : first;
}
function lsLoad(){ try{ return JSON.parse(localStorage.getItem(LS_KEY)||"null"); }catch(e){ return null; } }
function lsSave(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(bodyOf())); }catch(e){} }
async function persist(){
  lsSave();
  if(!db || !uid) return;
  dirty = true; if(writing) return; writing = true;
  while(dirty){
    dirty = false;
    setSave("Saving…");
    try{ await db.doc("attempts/"+uid).set(bodyOf()); setSave("Progress saved to your account.","ok"); }
    catch(e){
      if(e && e.code==="invalid_argument"){ db=null; setSave("Progress saves in this browser only.","bad"); break; }
      setSave("Could not save to your account. Progress saves in this browser.","bad");
    }
  }
  writing = false;
}
async function connect(){
  try{
    if(!window.claude || !window.claude.use) return;
    const [u, d] = await Promise.all([window.claude.use("user"), window.claude.use("db")]);
    if(!u || !d) return;
    const id = await u.id(); if(!id) return;
    db = d; uid = id;
    const snap = await db.doc("attempts/"+uid).get();
    if(snap.exists){ applySaved(snap.data()); render(); setSave("Progress saved to your account.","ok"); }
    else if(answered() || tries.some(t=>t.length)){ persist(); }
    else setSave("Progress saves to your account.","ok");
  }catch(e){ /* keep local-only mode */ }
}

function render(top=true){ renderHeader(); showResults?renderResults():renderQ(); if(top) window.scrollTo({top:0}); }
applySaved(lsLoad());
render();
connect();
</script>
