<style>
/* Layout: single exam card column, header strip with score and tick map, results replace the card */
:root{
  --bg:#EEF0EA;--paper:#FFFFFF;--ink:#1F2A24;--muted:#5B6A61;--line:#D7DBD2;
  --accent:#2F6F5E;--wash:#E4EDE9;
  --ok:#2E7D4F;--okw:#E4F2E8;--bad:#A13D2C;--badw:#F6E7E3;--tick:#C9CFC4;
  --serif:"Source Serif 4",Georgia,"Times New Roman",serif;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#171C18;--paper:#1F251F;--ink:#EDEFE9;--muted:#9BA79C;--line:#333A32;
  --accent:#6FBBA3;--wash:#24302A;--ok:#6FBB8B;--okw:#1F3226;--bad:#E28C79;--badw:#3A2420;--tick:#3E463D;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#171C18;--paper:#1F251F;--ink:#EDEFE9;--muted:#9BA79C;--line:#333A32;
  --accent:#6FBBA3;--wash:#24302A;--ok:#6FBB8B;--okw:#1F3226;--bad:#E28C79;--badw:#3A2420;--tick:#3E463D;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.55}
.wrap{max-width:760px;margin:0 auto;padding-block:28px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px}
header{display:flex;flex-direction:column;gap:12px}
.eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
h1{font-family:var(--serif);font-weight:600;font-size:clamp(26px,5vw,34px);line-height:1.15;margin:0;text-wrap:balance}
.stats{display:flex;flex-wrap:wrap;gap:8px 22px;font-family:var(--mono);font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.stats b{color:var(--ink);font-weight:500}
.save{font-family:var(--mono);font-size:12px;color:var(--muted)}
.save.ok{color:var(--ok)}.save.bad{color:var(--bad)}
.ticks{display:flex;flex-wrap:wrap;gap:4px}
.tick{width:16px;height:16px;border:0;background:var(--tick);padding:0;cursor:pointer}
.tick.ok{background:var(--ok)}.tick.bad{background:var(--bad)}
.tick.cur{outline:2px solid var(--ink);outline-offset:1px}
.tick:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.card{background:var(--paper);border:1px solid var(--line);padding:22px;display:flex;flex-direction:column;gap:16px}
.chead{display:flex;justify-content:space-between;gap:10px;font-family:var(--mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.tag{color:var(--accent);background:var(--wash);padding:2px 8px}
.stem{font-family:var(--serif);font-size:18px;line-height:1.55;margin:0;white-space:pre-line}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;background:var(--paper);color:var(--ink);border:1px solid var(--line);padding:12px 14px;font:inherit;cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--accent);background:var(--wash)}
.opt:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.opt:disabled{cursor:default}
.opt .k{font-family:var(--mono);font-weight:500;color:var(--muted);min-width:1.2em}
.opt.right{border-color:var(--ok);background:var(--okw)}.opt.right .k{color:var(--ok)}
.opt.wrong{border-color:var(--bad);background:var(--badw)}.opt.wrong .k{color:var(--bad)}
.fb{border-top:1px solid var(--line);padding-top:14px;display:flex;flex-direction:column;gap:8px}
.verdict{font-weight:600}.verdict.ok{color:var(--ok)}.verdict.bad{color:var(--bad)}
.fb p{margin:0}
.obj{font-family:var(--mono);font-size:12px;color:var(--muted);line-height:1.5;border-left:2px solid var(--line);padding-left:10px}
.nav{display:flex;justify-content:space-between;gap:10px}
.btn{font:inherit;font-weight:500;padding:10px 18px;border:1px solid var(--accent);background:var(--accent);color:var(--paper);cursor:pointer}
.btn.ghost{background:transparent;color:var(--accent)}
.btn:disabled{opacity:.4;cursor:default}
.btn:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.big{font-family:var(--serif);font-size:44px;font-weight:600;line-height:1;font-variant-numeric:tabular-nums}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
td,th{text-align:left;padding:6px 0;border-bottom:1px solid var(--line);font-size:14px}
th{font-family:var(--mono);font-size:12px;font-weight:500;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
td:last-child,th:last-child{text-align:right}
h2{font-family:var(--serif);font-size:20px;font-weight:600;margin:0}
h3{font-family:var(--mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:6px 0 0;font-weight:500}
.miss{margin:0;padding-left:0;list-style:none;display:flex;flex-direction:column;gap:6px;font-size:14px}
.miss code{font-family:var(--mono);color:var(--bad);margin-right:6px}
.optrow{display:flex;gap:6px;align-items:stretch}
.optrow .opt{flex:1;min-width:0}
.strike{flex:0 0 auto;width:40px;border:1px solid var(--line);background:var(--paper);color:var(--muted);font-family:var(--mono);font-size:13px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.strike:hover{border-color:var(--accent);color:var(--accent)}
.strike:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.strike[aria-pressed="true"]{background:var(--wash);color:var(--ink)}
.optrow.struck .opt > span:last-child{text-decoration:line-through;color:var(--muted)}
.optrow.struck .opt .k{color:var(--line)}
.tries{font-family:var(--mono);font-size:12px;color:var(--muted)}
.tries .bad{color:var(--bad)}.tries .ok{color:var(--ok)}
.hint{font-family:var(--mono);font-size:12px;color:var(--muted)}
.fbtools{display:flex;justify-content:flex-end}
.tick.redo{box-shadow:inset 0 -3px 0 var(--accent)}
@media (prefers-reduced-motion:no-preference){.fb{animation:in .18s ease-out}@keyframes in{from{opacity:.4;transform:translateY(3px)}to{opacity:1;transform:none}}}
</style>

<div class="wrap">
  <header>
    <div class="eyebrow">Foundations of Medicine · Block 1 · Weeks 1 to 4 · Practice test</div>
    <h1>Block 1 Practice Test 1: 50 Questions</h1>
    <div class="stats" id="stats"></div>
    <div class="save" id="save" role="status">Progress saves in this browser.</div>
    <div class="ticks" id="ticks" aria-label="Question map"></div>

<script>
const QUESTIONS = [{"c": "Week 1", "p": "A patient reports fatigue and malaise with no localizing features on history, and no specific findings point to a single organ system on examination. How should this clinical presentation be classified?", "o": ["Undifferentiated presentation", "Single typical presentation", "Multiple problems/multisystem presentation", "Life-threatening presentation"], "a": 0, "e": "Correct: A. An undifferentiated presentation involves a symptom not specific to any one body system, such as fatigue or malaise, as opposed to a single typical presentation (specific to one system) or a multisystem presentation (multiple symptoms across systems).", "l": []}, {"c": "Week 1", "p": "A 45-year-old presents with fever and cough of 3 days' duration. Chest exam reveals crackles, and he also reports new joint pain and a rash. Which clinical presentation category best fits, and why does this matter for the diagnostic approach?", "o": ["Life-threatening, requiring an ABC-focused assessment first", "Multiple problems/multisystem, requiring a differential spanning several body systems", "Single typical presentation limited to the respiratory system", "A preventative care encounter"], "a": 1, "e": "Correct: B. Fever, cough, joint pain, and rash together span multiple body systems and may reflect one unifying cause or several concurrent problems, defining a multisystem presentation requiring a broader differential.", "l": []}, {"c": "Week 1", "p": "A resident builds a differential diagnosis for a patient's joint swelling using the VITAMIN C&D framework. Which of the following pairs a category with a correctly matching example?", "o": ["Neoplastic, septic arthritis", "Congenital, an acute gout flare", "Traumatic/toxic, a meniscal tear from a fall", "Degenerative, rheumatoid arthritis"], "a": 2, "e": "Correct: C. A meniscal tear from a fall correctly fits the traumatic/toxic category. Septic arthritis is infectious, not neoplastic, gout is metabolic, not congenital, and rheumatoid arthritis is autoimmune, not degenerative, each of the other options mismatches category to example.", "l": []}, {"c": "Week 1", "p": "During a visit, a physician asks a patient, \"What are you hoping I can do for you today?\" Which component of the FIFE framework does this question address?", "o": ["Feelings", "Ideas", "Function", "Expectations"], "a": 3, "e": "Correct: D. This question elicits the patient's expectations for the visit, the \"E\" in FIFE (Feelings, Ideas, Function, Expectations).", "l": []}, {"c": "Week 1", "p": "A 3cm deep soft tissue mass is found on imaging and needs a tissue diagnosis before a treatment plan is made, without yet committing to full surgical removal. Which biopsy technique is most appropriate?", "o": ["Needle core biopsy", "Fine needle aspiration", "Punch biopsy", "Excisional biopsy"], "a": 0, "e": "Correct: A. Needle core biopsy obtains tissue (not just cells) from deeper lesions, appropriate here. Fine needle aspiration yields cells only, punch biopsy is for skin lesions, and excisional biopsy is used for diagnosis and treatment together, which isn't yet the goal.", "l": []}, {"c": "Week 1", "p": "A patient with a family history of depression develops a major depressive episode after a sudden job loss. Her ongoing social isolation, which developed after the episode began, keeps her symptoms from improving. Which term best describes the role of her social isolation?", "o": ["Predisposing factor", "Perpetuating factor", "Precipitating factor", "Protective factor"], "a": 1, "e": "Correct: B. A perpetuating factor maintains a problem once established. Her family history is predisposing, and the job loss is precipitating, the social isolation, which sustains the episode, is perpetuating.", "l": []}, {"c": "Week 1", "p": "A public health campaign encourages an entire community to reduce dietary salt intake, regardless of individual risk status, in order to lower the population's average blood pressure. Which level of prevention does this represent?", "o": ["Primary prevention", "Secondary prevention", "Health promotion/primordial prevention", "Tertiary prevention"], "a": 2, "e": "Correct: C. Health promotion/primordial prevention targets the entire population to prevent risk factors from developing and lower average population risk, distinct from primary prevention, which targets individuals who already have one or more risk factors.", "l": []}, {"c": "Week 1", "p": "A physician believes a patient's expressed treatment preference conflicts with what is truly best for her and spends the visit trying to persuade her, through moral discussion, to adopt what the physician considers a more admirable set of values before proceeding. Which model of the physician-patient relationship does this reflect?", "o": ["Informative model", "Interpretive model", "Paternalistic model", "Deliberative model"], "a": 3, "e": "Correct: D. The deliberative model involves the physician articulating and persuading the patient toward more admirable values through moral discussion, still informing and implementing the patient's ultimate choice, distinct from the paternalistic model, which acts on objective values without this discussion.", "l": []}, {"c": "Week 1", "p": "An ethics committee resolves a dilemma by comparing it to a series of similar past cases and their resolutions, rather than starting from an abstract principle. Which ethical approach does this reflect?", "o": ["Casuistry", "Deontology", "Utilitarianism", "Virtue ethics"], "a": 0, "e": "Correct: A. Casuistry is bottom-up reasoning that infers from similar past cases, distinct from deontology (duty-based), utilitarianism (maximizing utility), and virtue ethics (character-focused).", "l": []}, {"c": "Week 1", "p": "A hospital acknowledges that cultural differences exist among its patients but treats every patient identically, on the reasoning that \"fair\" means \"the same,\" and as a result only meets the needs of the dominant cultural group. Which stage of the cultural competence continuum does this best reflect?", "o": ["Cultural pre-competence", "Cultural blindness", "Cultural humility", "Cultural safety"], "a": 1, "e": "Correct: B. Cultural blindness ignores differences and treats everyone the same, which in practice only meets the needs of the dominant group, distinct from cultural pre-competence (exposure and commitment to addressing needs) or cultural humility/safety (further along the continuum).", "l": []}, {"c": "Week 2", "p": "A biopsy slide shows strong pink staining of the cytoplasm in a section rich in skeletal muscle fibers. Which stain is responsible for this pattern, and what does it preferentially bind?", "o": ["Hematoxylin, a basic dye binding acidic structures", "Hematoxylin, an acidic dye binding basic structures", "Eosin, an acidic dye binding basic/cytoplasmic proteins", "Eosin, a basic dye binding nucleic acids"], "a": 2, "e": "Correct: C. Eosin is an acidic stain that binds basic (acidophilic) structures like cytoplasmic proteins and muscle, staining them pink. Hematoxylin is a basic stain that binds acidic (basophilic) structures like DNA and RNA, staining them blue.", "l": []}, {"c": "Week 2", "p": "A researcher studies a cell-cell junction composed of connexin proteins that form channels allowing direct passage of ions and small molecules between adjacent cells. Which junction type is this, and what is its primary function?", "o": ["Desmosome, providing mechanical cell-cell adhesion", "Tight junction, establishing apical-basolateral polarity", "Hemidesmosome, anchoring cells to the basement membrane", "Gap junction, enabling intercellular communication"], "a": 3, "e": "Correct: D. Gap junctions are formed by connexin proteins and enable direct intercellular communication via channels connecting adjacent cells, distinct from desmosomes (adhesion), tight junctions (barrier/polarity), and hemidesmosomes (cell-matrix adhesion).", "l": []}, {"c": "Week 2", "p": "A histology specimen from the trachea shows a single layer of cells that appears falsely stratified because nuclei sit at different heights, with cilia on the apical surface sweeping mucus upward. Which epithelial type is this?", "o": ["Pseudostratified columnar epithelium", "Simple columnar epithelium", "Stratified squamous epithelium", "Transitional epithelium"], "a": 0, "e": "Correct: A. Pseudostratified columnar epithelium is a single layer that appears falsely stratified due to nuclei at varying heights, classically ciliated and lining the trachea and much of the upper respiratory tract.", "l": []}, {"c": "Week 2", "p": "A pathologist examines a bladder biopsy and notes an epithelium capable of stretching considerably as the organ fills, with cells that appear cuboidal when relaxed and flattened when distended. Which epithelial type is being described?", "o": ["Simple cuboidal epithelium", "Transitional epithelium", "Stratified columnar epithelium", "Simple squamous epithelium"], "a": 1, "e": "Correct: B. Transitional epithelium lines the bladder, ureters, and urethra, and is specialized to allow urinary organs to expand and stretch, changing shape from cuboidal to flattened as the organ distends.", "l": []}, {"c": "Week 2", "p": "A tendon biopsy shows fibroblasts arranged in parallel rows, densely packed with type I collagen oriented in a single direction to resist high uniaxial stress. Which connective tissue type is this?", "o": ["Loose connective tissue", "Dense irregular connective tissue", "Dense regular connective tissue", "Reticular connective tissue"], "a": 2, "e": "Correct: C. Dense regular connective tissue, found in tendons and ligaments, has fibroblasts arranged in rows with type I collagen aligned in a single direction for high stress resistance, unlike dense irregular tissue, which has collagen woven in multiple directions.", "l": []}, {"c": "Week 2", "p": "A biopsy of the epiglottis shows chondrocytes embedded in a matrix rich in type II collagen and elastin, arranged in isogenous groups. Which type of cartilage is this, and where else would it classically be found?", "o": ["Hyaline cartilage, found at the epiphyseal plates", "Fibrocartilage, found in the intervertebral discs", "Hyaline cartilage, found in the trachea", "Elastic cartilage, found in the external ear"], "a": 3, "e": "Correct: D. Elastic cartilage contains type II collagen plus elastin and is found in the epiglottis, larynx, and external ear/auditory canal, distinct from hyaline cartilage (no elastin, found at epiphyseal plates and trachea) and fibrocartilage (type I and II collagen, found in intervertebral discs).", "l": []}, {"c": "Week 2", "p": "A researcher identifies a multinucleated cell derived from fused peripheral blood monocytes, located within a resorption pit on bone, actively degrading bone matrix as part of remodelling. Which bone cell is this?", "o": ["Osteoclast", "Osteoblast", "Osteocyte", "Osteoprogenitor cell"], "a": 0, "e": "Correct: A. Osteoclasts arise from fused peripheral blood monocytes/macrophages, are multinucleated, reside in Howship's lacunae, and resorb bone, distinct from osteoblasts (matrix-secreting), osteocytes (mechanosensory network), and osteoprogenitor cells (stem cells).", "l": []}, {"c": "Week 2", "p": "A fracture involving the shaft of the femur is expected to heal via a process that recapitulates fetal long bone growth, replacing an intermediate template with bone. Which ossification process does this describe, and which fetal structure does it echo?", "o": ["Intramembranous ossification, as occurs in the flat bones of the skull", "Endochondral ossification, replacing a cartilage template", "Appositional growth of the periosteum only", "Interstitial growth without any template"], "a": 1, "e": "Correct: B. Endochondral ossification replaces a cartilage template with bone and is responsible for the growth in length of long bones like the femur, vertebrae, and pelvis, distinct from intramembranous ossification, which occurs without a cartilage template (skull, mandible, clavicle).", "l": []}, {"c": "Week 2", "p": "A histology slide shows spindle-shaped cells with a single, centrally located nucleus, no visible striations, and gap junctions connecting neighbouring cells that allow spontaneous, coordinated contraction. Which tissue is this most consistent with, and where would it be found?", "o": ["Skeletal muscle, found in skeletal attachments", "Cardiac muscle, found exclusively in the heart", "Visceral (single-unit) smooth muscle, found in the intestine", "Multiunit smooth muscle, found in the iris"], "a": 2, "e": "Correct: C. Visceral (single-unit) smooth muscle has gap junctions enabling spontaneous, coordinated contraction (peristalsis) and is found in the intestine and uterus, unlike multiunit smooth muscle, which lacks gap junctions and requires nerve stimulation (e.g., the iris).", "l": []}, {"c": "Week 2", "p": "A neurophysiologist blocks the Na+/K+ ATPase pump in an isolated neuron with a pump inhibitor. Over time, which change would be expected in the resting membrane potential, and why?", "o": ["No change, since the pump does not contribute to resting membrane potential", "The resting membrane potential would become more negative immediately", "The neuron would immediately fire a continuous train of action potentials", "The resting membrane potential would become less negative over time, as the concentration gradients for Na+ and K+ gradually dissipate"], "a": 3, "e": "Correct: D. The Na+/K+ pump maintains the concentration gradients that leak channels rely on to generate the resting membrane potential. Blocking it does not change RMP immediately, but as gradients dissipate over time without replenishment, RMP gradually becomes less negative (depolarizes).", "l": []}, {"c": "Week 2", "p": "A drug is transported into a cell against its concentration gradient by a carrier protein that uses the energy released from Na+ moving down its own concentration gradient, in the same direction as the drug. Which transport mechanism does this describe?", "o": ["Secondary active transport, symport", "Primary active transport", "Facilitated diffusion", "Secondary active transport, antiport"], "a": 0, "e": "Correct: A. This is secondary active transport, since the energy comes from a pre-existing ion gradient (generated by primary active transport) rather than direct ATP hydrolysis. Because the drug and Na+ move in the same direction, this is a symport, not an antiport.", "l": []}, {"c": "Week 2", "p": "A new screening test for a disease is evaluated in a population where the disease is rare. The test has high sensitivity but only moderate specificity. Which statement about this test's clinical performance is correct?", "o": ["A positive result is highly reassuring, but a negative result requires confirmatory testing", "A negative result is highly reassuring, but a positive result requires confirmatory testing since false positives will be common in a low-prevalence population", "The positive predictive value will be high regardless of disease prevalence", "Sensitivity and specificity both fall as disease prevalence decreases"], "a": 1, "e": "Correct: B. High sensitivity means few false negatives, so a negative result is reassuring. But in a low-prevalence population, even moderate specificity produces many false positives relative to true positives, lowering positive predictive value and requiring confirmation of positive results. Sensitivity and specificity are properties of the test, not the population, and do not change with prevalence.", "l": []}, {"c": "Week 2", "p": "Researchers identify a group of patients recently diagnosed with a rare cancer and a group without the cancer, then look back through medical records to compare rates of past exposure to a suspected environmental toxin. Which study design is this, and what is a key advantage of using incident (newly diagnosed) rather than prevalent cases?", "o": ["Retrospective cohort study, incident cases allow the exposure to be measured in real time", "Cross-sectional study, incident cases eliminate all confounding", "Case-control study, incident cases avoid identifying factors that are only related to survival rather than to risk", "Randomized controlled trial, incident cases allow for blinding"], "a": 2, "e": "Correct: C. This is a case-control study, comparing cases and controls with respect to past exposure. Using incident (newly diagnosed) rather than prevalent cases avoids the risk of identifying characteristics associated with survival with the disease, rather than true risk factors for developing it.", "l": []}, {"c": "Week 2", "p": "A study finds that coffee drinkers have higher rates of lung cancer. Further analysis reveals that coffee drinkers in the study also smoke more cigarettes than non-coffee drinkers, and smoking independently causes lung cancer. Which concept does smoking represent in this scenario?", "o": ["Effect modifier", "Selection bias", "Lead time bias", "Confounder"], "a": 3, "e": "Correct: D. Smoking is a confounder: an extraneous variable associated with both the exposure (coffee) and the outcome (lung cancer), distorting the apparent relationship between the two.", "l": []}, {"c": "Week 2", "p": "A new screening program detects a cancer 2 years earlier than it would have been found by symptoms alone. Patients diagnosed through screening appear to survive longer from the point of diagnosis, even though the screening program does not actually change the date of death. Which concept explains this apparent survival benefit?", "o": ["Lead time bias", "Confounding", "Selection bias", "Recall bias"], "a": 0, "e": "Correct: A. Lead time bias occurs when earlier diagnosis through screening lengthens the apparent time from diagnosis to death, without actually delaying death or improving outcomes.", "l": []}, {"c": "Week 3", "p": "A geneticist studies two families. In Family A, a triplet-repeat disorder shows earlier onset and greater severity with each successive generation. In Family B, a chromosomal region behaves differently depending on whether it was inherited from the mother or the father. Which pairing of phenomena is correctly matched to each family?", "o": ["Family A: genomic imprinting, Family B: anticipation", "Family A: anticipation, Family B: genomic imprinting", "Family A: pleiotropy, Family B: anticipation", "Family A: locus heterogeneity, Family B: pleiotropy"], "a": 1, "e": "Correct: B. Earlier onset and greater severity across generations describes anticipation (Family A). Parent-of-origin-dependent expression of a region describes genomic imprinting (Family B).", "l": []}, {"c": "Week 3", "p": "A 29-year-old low-risk pregnant woman undergoes first-trimester combined screening (NT plus serum markers) at 12 weeks, which returns a low-risk result for trisomy 21. She asks whether this means her baby definitely does not have trisomy 21. What is the most accurate response?", "o": ["Yes, a low-risk screening result rules out trisomy 21 with certainty", "No, first-trimester screening cannot assess trisomy 21 risk at all", "No, this is a screening test, not a diagnostic test, so a residual risk remains despite the reassuring result", "Yes, but only because she is under 35"], "a": 2, "e": "Correct: C. First-trimester combined screening is a screening test, not diagnostic. A low-risk result is reassuring but does not eliminate all risk, only diagnostic testing (CVS or amniocentesis) can provide certainty.", "l": []}, {"c": "Week 3", "p": "A child with multiple congenital anomalies has a normal karyotype and a normal chromosomal microarray. The clinical suspicion for a genetic syndrome remains high. Which of the following would be the most appropriate next consideration?", "o": ["Repeating the karyotype, since it is likely to yield a different result the second time", "Concluding no genetic cause is possible", "FISH testing for the same region already excluded by microarray", "A single-gene or exome-level sequencing test, since balanced rearrangements and copy-number changes have already been excluded but point mutations have not"], "a": 3, "e": "Correct: D. Karyotype excludes large structural/balanced rearrangements, and microarray excludes copy-number changes (deletions/duplications). Neither test detects single-gene point mutations, so exome or targeted gene sequencing is the logical next step when suspicion remains high.", "l": []}, {"c": "Week 3", "p": "A 16-month-old is not yet walking independently. Her parents are anxious. Which statement about this finding is most accurate?", "o": ["This meets the standard definition of a red flag, since walking should be present by 15 months", "This does not yet meet the standard cutoff for a red flag, since walking is not considered delayed until 18 months", "This is never a cause for concern regardless of age", "This can only be assessed using the Nipissing screen, not clinical judgement"], "a": 1, "e": "Correct: B. The standard red flag cutoff for walking is 18 months, not 15 or 16 months. At 16 months, not yet walking independently is still within the range of normal variation.", "l": []}, {"c": "Week 3", "p": "A researcher observes that an infant becomes distressed when the caregiver leaves, but unlike a securely attached infant, is not easily soothed upon return and continues to display intermittent anger and clinginess for several minutes afterward. Which attachment classification fits best, and which caregiving pattern is it most associated with?", "o": ["Secure attachment, consistently responsive caregiving", "Insecure-ambivalent attachment, inconsistent caregiving", "Insecure-avoidant attachment, dismissive caregiving", "Disorganized attachment, frightening caregiving"], "a": 1, "e": "Correct: B. Intense distress with difficulty being consoled and ambivalent clinging/anger toward the returning caregiver describes insecure-ambivalent attachment, typically associated with inconsistent caregiving.", "l": []}, {"c": "Week 3", "p": "A dietitian is asked to identify the nutrient intake level intended to cover the needs of nearly the entire healthy population, used when there is not enough evidence to calculate an Estimated Average Requirement. Which DRI value is being described?", "o": ["Recommended Dietary Allowance (RDA)", "Estimated Average Requirement (EAR)", "Adequate Intake (AI)", "Tolerable Upper Intake Level (UL)"], "a": 2, "e": "Correct: C. Adequate Intake (AI) is used when there isn't sufficient evidence to calculate an EAR, and is set to cover the needs of nearly the whole healthy population, distinct from the RDA, which is specifically calculated as EAR + 2 SD.", "l": []}, {"c": "Week 3", "p": "A 4-month-old exclusively breastfed infant weighs almost exactly double his birth weight, consistent with expected growth. His mother asks when she should expect his weight to triple. Using standard growth expectations, what is the most accurate answer?", "o": ["By 6 months", "By 9 months", "By 18 months", "By approximately 1 year"], "a": 3, "e": "Correct: D. Birth weight typically doubles by 4-5 months and triples by about 1 year of age.", "l": []}, {"c": "Week 3", "p": "A woman's brother has hemophilia A, an X-linked recessive condition. Her mother is an obligate carrier. The woman is currently pregnant with a boy, and has not been tested for carrier status herself. What is the chance that her son will be affected?", "o": ["25%, accounting for both her probability of being a carrier and the probability of transmission", "50%, since she is an obligate carrier like her mother", "0%, since only her mother is a confirmed carrier", "12.5%, since hemophilia requires two X-linked mutations"], "a": 0, "e": "Correct: A. Since her mother is an obligate carrier, the woman has a 50% chance of being a carrier herself. If she is a carrier, each son has a 50% chance of being affected. Combined probability: 0.5 x 0.5 = 25%.", "l": []}, {"c": "Week 3", "p": "A newborn's screening test for a metabolic condition returns positive, but confirmatory testing shows the infant is unaffected. Which term best describes this outcome, and what does it illustrate about screening test design?", "o": ["A true positive, the confirmatory test result should be disregarded", "A false positive, screening tests are generally designed with high sensitivity, which increases the likelihood of some false positives", "A false negative, screening tests prioritize specificity over sensitivity", "This cannot occur with newborn screening tests"], "a": 1, "e": "Correct: B. A positive screen that does not hold up on confirmatory testing is a false positive. Screening tests are typically designed to maximize sensitivity (catch true cases), which trades off against specificity and increases the rate of false positives.", "l": []}, {"c": "Week 3", "p": "A researcher contrasts a \"critical period\" with a \"sensitive period\" in development. Which statement correctly distinguishes the two?", "o": ["A sensitive period always causes permanent, irreversible impairment if missed", "There is no meaningful distinction between the two terms", "In a critical period, missing the necessary stimulus causes an irreversible deficit, in a sensitive period, the same skill can still be acquired later, just with more difficulty", "Critical periods only apply to physical growth, not neural development"], "a": 2, "e": "Correct: C. A critical period is a window in which missing the necessary stimulus causes a permanent, irreversible deficit (e.g., early visual deprivation). A sensitive period is a window where learning is easier, but the skill can still be acquired later with more difficulty if missed.", "l": []}, {"c": "Week 3", "p": "A 7-year-old is able to understand that the volume of liquid stays the same when poured into a differently shaped container and can perform logical operations on concrete objects, though abstract hypothetical reasoning is still difficult. According to Piaget, which stage best fits?", "o": ["Preoperational stage", "Formal operational stage", "Sensorimotor stage", "Concrete operational stage"], "a": 3, "e": "Correct: D. Mastery of conservation and logical operations on concrete objects, without yet reasoning abstractly, describes Piaget's concrete operational stage.", "l": []}, {"c": "Week 3", "p": "Two mothers each have a child with Down syndrome. The first mother is 42 years old with a normal karyotype, and her child's trisomy arose from standard meiotic nondisjunction. The second mother is 28 years old and is found to carry a balanced Robertsonian translocation. Which statement correctly compares their recurrence risk for a future pregnancy?", "o": ["The first mother's risk is primarily related to her advanced maternal age, while the second mother's risk is related to her carrier status and is not primarily driven by age", "Both mothers have an identical, age-based recurrence risk for future pregnancies", "The second mother has no increased risk at all, since she is phenotypically normal", "The first mother's risk is higher than the second mother's regardless of age"], "a": 0, "e": "Correct: A. Nondisjunction-related trisomy 21 risk rises with maternal age. Translocation-related trisomy 21 risk instead reflects the parent's carrier status and is largely independent of maternal age, the second mother's risk does not follow the same age-based logic as the first.", "l": []}, {"c": "Week 4", "p": "A pregnant woman who is not immune to rubella is offered vaccination during her pregnancy. Her physician recommends deferring the MMR vaccine until after delivery, but administers the Tdap vaccine now. What best explains this difference in approach?", "o": ["Both vaccines are equally unsafe in pregnancy, but Tdap is given anyway due to urgency", "MMR is a live attenuated vaccine, contraindicated in pregnancy, while Tdap is an inactivated/subunit vaccine considered safe in pregnancy", "MMR is inactivated and therefore ineffective if given now, unrelated to pregnancy safety", "Tdap is a live vaccine, so it is preferred over the inactivated MMR during pregnancy"], "a": 1, "e": "Correct: B. MMR is live attenuated and contraindicated in pregnancy due to theoretical risk to the fetus. Tdap is an inactivated/subunit vaccine and is considered safe and recommended during pregnancy.", "l": []}, {"c": "Week 4", "p": "A community achieves 85% vaccination coverage against measles, a highly transmissible pathogen with a very high basic reproduction number (R0). Public health officials remain concerned that outbreaks could still occur despite this coverage level. What is the most likely explanation?", "o": ["85% coverage exceeds the herd immunity threshold for measles, so officials are being overly cautious", "Herd immunity thresholds do not depend on a pathogen's R0", "Measles' very high R0 means the herd immunity threshold is higher than 85%, so pockets of susceptible individuals can still sustain transmission", "Vaccination coverage above 50% always guarantees herd immunity regardless of pathogen"], "a": 2, "e": "Correct: C. The vaccination coverage required for herd immunity rises with R0. Measles has an unusually high R0, so its herd immunity threshold is higher than 85%, meaning that level of coverage can still leave enough susceptible people to sustain outbreaks.", "l": []}, {"c": "Week 4", "p": "An 8-year-old has 7 clear symptoms of inattention but only 2 symptoms of hyperactivity-impulsivity, all present since age 6 and causing impairment at both home and school. Which ADHD presentation best fits this pattern?", "o": ["Combined presentation", "Predominantly hyperactive-impulsive presentation", "This does not meet criteria for any ADHD presentation", "Predominantly inattentive presentation"], "a": 3, "e": "Correct: D. Meeting the symptom threshold in the inattentive domain (6+) but not the hyperactive-impulsive domain (fewer than 6) defines the predominantly inattentive presentation, as opposed to the combined presentation, which requires threshold symptoms in both domains.", "l": []}, {"c": "Week 4", "p": "During a HEADSS interview with a 15-year-old, the clinician asks about after-school clubs, hobbies, and how much time is spent on screens. Which HEADSS domain is being assessed?", "o": ["Activities", "Home", "Education/employment", "Drugs"], "a": 0, "e": "Correct: A. HEADSS covers Home, Education/employment, Activities, Drugs, Sexuality, and Suicide/depression. Clubs, hobbies, and screen time fall under the Activities domain.", "l": []}, {"c": "Week 4", "p": "A 13-year-old begins developing romantic interest in peers and mature adult sexual interests, alongside a growing capacity for genuine intimacy. According to Freud's psychosexual stages, which stage does this best correspond to?", "o": ["Latency", "Genital", "Phallic", "Anal"], "a": 1, "e": "Correct: B. The genital stage (from puberty onward) is characterized by mature romantic/sexual interest and capacity for intimacy, distinct from the earlier latency stage (same-sex peer focus, little romantic interest) or phallic stage (early childhood).", "l": []}, {"c": "Week 4", "p": "A rural community has one clinic serving a large geographic area, with patients often traveling several hours for basic care, resulting in delayed diagnoses. Which social determinant of health domain does this primarily reflect?", "o": ["Biology and genetic endowment", "Culture", "Access to health services", "Gender"], "a": 2, "e": "Correct: C. Geographic and logistical barriers to reaching care fall under the access to health services domain of the social determinants of health.", "l": []}, {"c": "Week 4", "p": "A city government funds a program to remove lead pipes from older homes in low-income neighbourhoods, reducing a known environmental health hazard at a community level. Which type of intervention does this best represent?", "o": ["Upstream", "Downstream", "Individual clinical intervention", "Midstream"], "a": 3, "e": "Correct: D. Midstream interventions improve material living/working conditions or reduce hazard exposure at a community level, distinct from upstream interventions (macro policy, e.g., wealth redistribution) or downstream interventions (individual access to services).", "l": []}, {"c": "Week 4", "p": "A tall adolescent with long fingers, joint hypermobility, lens dislocation on eye exam, and dilation of the aortic root is diagnosed with a connective tissue disorder. Which protein and mode of inheritance are most consistent with this presentation?", "o": ["Fibrillin-1, autosomal dominant", "Type I collagen, autosomal dominant", "Dystrophin, X-linked recessive", "CFTR, autosomal recessive"], "a": 0, "e": "Correct: A. This is Marfan syndrome, caused by an autosomal dominant fibrillin-1 (FBN1) mutation affecting elastic fiber organization and TGF-beta binding, producing the classic skeletal, ocular, and cardiovascular findings.", "l": []}, {"c": "Week 4", "p": "A 7-year-old repeatedly hits a classmate specifically in response to being teased, rather than to obtain a toy or object. Using the expected developmental trajectory of aggression, how should this be interpreted?", "o": ["Atypical for any age and requires immediate psychiatric referral", "Consistent with the expected shift toward retaliatory aggression that becomes more typical after age 6", "Only consistent with a diagnosis of conduct disorder", "Only expected in children under age 3"], "a": 1, "e": "Correct: B. The expected developmental pattern is that aggression to obtain something is more typical under age 6, shifting toward aggression to retaliate over age 6, this 7-year-old's retaliatory aggression fits that expected pattern.", "l": []}, {"c": "Week 4", "p": "A 10-week-old infant cries for 2 hours per day, 2 days per week, without a clear pattern, and is otherwise growing and feeding normally. Using the Rome IV-based definition referenced for infant colic, is this presentation consistent with colic?", "o": ["Yes, any unexplained crying in an infant under 5 months qualifies as colic", "No, colic can only be diagnosed after 6 months of age", "No, colic requires crying for more than 3 hours per day, on more than 3 days per week, for more than 3 weeks", "Yes, but only if the infant is exclusively breastfed"], "a": 2, "e": "Correct: C. The Rome IV-based definition referenced requires crying for more than 3 hours per day, on more than 3 days per week, for more than 3 weeks, in an infant under 5 months. This infant's pattern (2 hours, 2 days/week) does not meet that threshold.", "l": []}, {"c": "Week 4", "p": "A 5-year-old cannot yet count to 10, does not recognize letters, and struggles with basic shape recognition, though he separates from his parents easily and plays cooperatively with peers. Which readiness domain is most impaired?", "o": ["Emotional readiness", "Physical readiness", "Attentional readiness", "Cognitive/academic readiness"], "a": 3, "e": "Correct: D. Counting, letter recognition, and shape recognition fall under cognitive/academic readiness, which is impaired here despite intact emotional readiness (separation, cooperative play).", "l": []}, {"c": "Week 4", "p": "A family member of a child recently diagnosed with hepatitis A asks about post-exposure prophylaxis for an unvaccinated sibling who was exposed 5 days ago. Which statement is correct regarding the appropriate window for post-exposure intervention?", "o": ["Post-exposure prophylaxis can still be offered, since the recommended window extends to about 2 weeks after exposure", "Post-exposure prophylaxis for hepatitis A is only effective within 24 hours and has already been missed", "No post-exposure prophylaxis exists for hepatitis A", "Only immunoglobulin, never vaccine, is used for hepatitis A post-exposure prophylaxis regardless of patient factors"], "a": 0, "e": "Correct: A. Hepatitis A post-exposure prophylaxis (vaccine or immunoglobulin, depending on age and risk factors) can be offered within about 2 weeks of exposure, so this sibling, exposed 5 days ago, still falls within the effective window.", "l": []}, {"c": "Week 4", "p": "After delivering a diagnosis of a developmental disability to parents, a physician schedules a follow-up visit specifically to revisit the information, since families often retain little from the initial conversation. Which principle of giving difficult news does this reflect?", "o": ["Warning phrases should always be avoided", "Families need adequate time, including at follow-up visits, to review and process difficult information", "A single visit is always sufficient if the news is delivered clearly", "Follow-up visits are unnecessary once the diagnosis is confirmed"], "a": 1, "e": "Correct: B. Recommended practice for giving news of a disability includes ensuring families have adequate time to absorb the information, including scheduled follow-up visits to revisit and reinforce what was discussed, since retention from a single difficult conversation is often limited.", "l": []}];
const OBJECTIVES = {};
const L = "ABCDE";
const N = QUESTIONS.length;
let cur = 0, showResults = false;
let ans = new Array(N).fill(null);           // current pick per question
let tries = QUESTIONS.map(()=>[]);           // every locked attempt: {pick, ok, at}
let strikes = QUESTIONS.map(()=>[]);         // struck option indexes for the open attempt
let history = [], db = null, uid = null, writing = false, dirty = false;
const LS_KEY = "differential-block-1-practice-test-1";
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");

function score(){ return ans.reduce((n,a,i)=>n+(a!==null&&a===QUESTIONS[i].a?1:0),0); }
function answered(){ return ans.filter(a=>a!==null).length; }
function firstTryScore(){ return tries.reduce((n,t)=>n+(t.length&&t[0].ok?1:0),0); }
function firstTryCount(){ return tries.filter(t=>t.length).length; }

function renderHeader(){
  $("#stats").innerHTML = `<span>Item <b>${showResults?"–":cur+1}</b> of <b>${N}</b></span><span>Answered <b>${answered()}</b></span><span>Score <b>${score()} / ${answered()}</b></span>`;
  $("#ticks").innerHTML = QUESTIONS.map((q,i)=>{
    const st = ans[i]===null?"":(ans[i]===q.a?"ok":"bad");
    const redo = tries[i].length>1 || (ans[i]===null && tries[i].length>0);
    return `<button class="tick ${st} ${redo?"redo":""} ${(!showResults&&i===cur)?"cur":""}" data-i="${i}" aria-label="Question ${i+1}"></button>`;
  }).join("");
  document.querySelectorAll(".tick").forEach(b=>b.onclick=()=>{cur=+b.dataset.i;showResults=false;render();});
}

function triesLine(i, includeCurrent){
  const t = includeCurrent ? tries[i] : tries[i];
  if(!t.length) return "";
  const parts = t.map((x,k)=>`<span class="${x.ok?"ok":"bad"}">${k+1}: ${L[x.pick]} ${x.ok?"correct":"wrong"}</span>`).join(" · ");
  return `<div class="tries">Attempts ${parts}</div>`;
}

function renderQ(){
  const q = QUESTIONS[cur], a = ans[cur], done = a!==null, st = strikes[cur];
  const opts = q.o.map((o,i)=>{
    let c = "";
    if(done){ if(i===q.a) c="right"; else if(i===a) c="wrong"; }
    const struck = !done && st.includes(i);
    const strikeBtn = done ? "" : `<button class="strike" data-s="${i}" aria-pressed="${struck}" aria-label="${struck?"Restore":"Strike out"} option ${L[i]}" title="${struck?"Restore":"Strike out"} option">${struck?"↺":"✕"}</button>`;
    return `<div class="optrow ${struck?"struck":""}"><button class="opt ${c}" data-i="${i}" ${done?"disabled":""}><span class="k">${L[i]}</span><span>${esc(o)}</span></button>${strikeBtn}</div>`;
  }).join("");
  let fb = "";
  if(done){
    const ok = a===q.a;
    const lines = q.e.split("\n").map(t=>`<p>${esc(t)}</p>`).join("");
    const objs = q.l.map(id=>`<div class="obj">Objective: ${esc(id)}. ${esc(OBJECTIVES[id]||"")}</div>`).join("");
    fb = `<div class="fb" role="status"><div class="verdict ${ok?"ok":"bad"}">${ok?"Correct.":"Incorrect. The answer is "+L[q.a]+"."}</div>${lines}${objs}${triesLine(cur)}<div class="fbtools"><button class="btn ghost" id="redo">Reset and redo this question</button></div></div>`;
  }
  const pre = (!done && tries[cur].length) ? `<div class="hint">Redo. Your earlier attempts are saved.</div>${triesLine(cur)}` : (!done ? `<div class="hint">Tap ✕ to strike out an option. Right-click works too.</div>` : "");
  const last = cur===N-1;
  $("#main").innerHTML = `<article class="card">
    <div class="chead"><span class="tag">${esc(q.c)}</span><span>Q${cur+1}</span></div>
    <p class="stem">${esc(q.p)}</p>
    ${pre}
    <div class="opts">${opts}</div>${fb}
    <div class="nav"><button class="btn ghost" id="prev" ${cur===0?"disabled":""}>Previous</button>
    <button class="btn" id="next" ${done?"":"disabled"}>${last?"See results":"Next"}</button></div>
  </article>`;
  document.querySelectorAll(".opt").forEach(b=>{
    b.onclick=()=>{ const p=+b.dataset.i; ans[cur]=p; tries[cur].push({pick:p, ok:p===q.a, at:new Date().toISOString()}); tries[cur]=tries[cur].slice(-10); strikes[cur]=[]; render(false); persist(); };
    b.oncontextmenu=(e)=>{ if(done) return; e.preventDefault(); toggleStrike(+b.dataset.i); };
  });
  document.querySelectorAll(".strike").forEach(b=>b.onclick=()=>toggleStrike(+b.dataset.s));
  const r=$("#redo"); if(r) r.onclick=()=>{ ans[cur]=null; strikes[cur]=[]; render(false); persist(); };
  $("#prev").onclick=()=>{cur--;render();};
  $("#next").onclick=()=>{ if(last){showResults=true;} else cur++; render(); };
}

function toggleStrike(i){
  const s = strikes[cur], k = s.indexOf(i);
  if(k<0) s.push(i); else s.splice(k,1);
  render(false); persist();
}

function renderResults(){
  const s = score(), pct = Math.round(100*s/N);
  const cats = {};
  QUESTIONS.forEach((q,i)=>{ cats[q.c]=cats[q.c]||[0,0]; cats[q.c][1]++; if(ans[i]===q.a) cats[q.c][0]++; });
  const rows = Object.entries(cats).map(([c,[r,t]])=>`<tr><td>${esc(c)}</td><td>${r} / ${t}</td></tr>`).join("");
  const missed = {};
  QUESTIONS.forEach((q,i)=>{ const wrongFirst = tries[i].length && !tries[i][0].ok; if(ans[i]!==q.a || wrongFirst) q.l.forEach(id=>{ const w=id.split(" ")[0]; missed[w]=missed[w]||new Set(); missed[w].add(id); }); });
  const weeks = Object.keys(missed).sort((x,y)=>parseInt(x.slice(1))-parseInt(y.slice(1)));
  const missHtml = weeks.length ? weeks.map(w=>`<h3>Week ${w.slice(1)}</h3><ul class="miss">${[...missed[w]].map(id=>`<li><code>${esc(id)}</code>${esc(OBJECTIVES[id]||"")}</li>`).join("")}</ul>`).join("") : "<p>No missed objectives.</p>";
  const redone = tries.filter(t=>t.length>1).length;
  const un = N - answered();
  $("#main").innerHTML = `<article class="card">
    <div class="chead"><span class="tag">Results</span><span>${un?un+" unanswered":"Complete"}</span></div>
    <div><div class="big">${s} / ${N}</div><div class="stats"><span><b>${pct}%</b> correct now</span><span>First try <b>${firstTryScore()} / ${firstTryCount()}</b></span><span>Redone <b>${redone}</b></span></div></div>
    <table><thead><tr><th>Category</th><th>Score</th></tr></thead><tbody>${rows}</tbody></table>
    <h2>Objectives to review</h2><p class="hint">Includes questions you missed on the first try, even if a redo got them right.</p>${missHtml}${history.length?`<h2>Past attempts</h2><table><thead><tr><th>Date</th><th>Score</th></tr></thead><tbody>${history.slice().reverse().map(h=>`<tr><td>${new Date(h.date).toLocaleDateString()}</td><td>${h.score} / ${h.total}</td></tr>`).join("")}</tbody></table>`:""}
    <div class="nav"><button class="btn ghost" id="back">Back to questions</button><button class="btn" id="restart">Restart all</button></div>
  </article>`;
  $("#back").onclick=()=>{showResults=false;render();};
  $("#restart").onclick=()=>{
    if(answered() || tries.some(t=>t.length)){
      history.push({date:new Date().toISOString(), score:score(), answered:answered(), total:N, firstTry:firstTryScore(),
        missed:QUESTIONS.map((q,i)=>ans[i]!==null&&ans[i]!==q.a?"q"+(i+1):null).filter(Boolean)});
      history=history.slice(-20);
    }
    ans.fill(null); tries=QUESTIONS.map(()=>[]); strikes=QUESTIONS.map(()=>[]); cur=0; showResults=false; render(); persist();
  };
}

function setSave(text, cls){ const el=$("#save"); if(el){ el.textContent=text; el.className="save "+(cls||""); } }
function bodyOf(){
  const a = {};
  QUESTIONS.forEach((q,i)=>{
    if(ans[i]===null && !tries[i].length && !strikes[i].length) return;
    a["q"+(i+1)] = {pick:ans[i], ok:ans[i]!==null && ans[i]===q.a, l:q.l, tries:tries[i], strikes:strikes[i]};
  });
  return {answers:a, history, total:N, answered:answered(), score:score(), firstTry:firstTryScore(), updatedAt:new Date().toISOString()};
}
function validPick(i,p){ return Number.isInteger(p) && p>=0 && p<QUESTIONS[i].o.length; }
function applySaved(d){
  if(!d || typeof d!=="object") return;
  ans.fill(null); tries=QUESTIONS.map(()=>[]); strikes=QUESTIONS.map(()=>[]);
  const a = d.answers || {};
  for(const k in a){
    const i = parseInt(k.slice(1),10)-1, row = a[k];
    if(!(i>=0 && i<N) || !row || typeof row!=="object") continue;
    if(validPick(i,row.pick)) ans[i]=row.pick;
    if(Array.isArray(row.tries)) tries[i]=row.tries.filter(t=>t&&validPick(i,t.pick)).map(t=>({pick:t.pick, ok:t.pick===QUESTIONS[i].a, at:String(t.at||"")})).slice(-10);
    else if(ans[i]!==null) tries[i]=[{pick:ans[i], ok:ans[i]===QUESTIONS[i].a, at:""}];
    if(Array.isArray(row.strikes)) strikes[i]=row.strikes.filter(x=>validPick(i,x));
  }
  history = Array.isArray(d.history) ? d.history.slice(-20) : [];
  const first = ans.findIndex(x=>x===null); cur = first<0 ? N-1 : first;
}
function lsLoad(){ try{ return JSON.parse(localStorage.getItem(LS_KEY)||"null"); }catch(e){ return null; } }
function lsSave(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(bodyOf())); }catch(e){} }
async function persist(){
  lsSave();
  if(!db || !uid) return;
  dirty = true; if(writing) return; writing = true;
  while(dirty){
    dirty = false;
    setSave("Saving…");
    try{ await db.doc("attempts/"+uid).set(bodyOf()); setSave("Progress saved to your account.","ok"); }
    catch(e){
      if(e && e.code==="invalid_argument"){ db=null; setSave("Progress saves in this browser only.","bad"); break; }
      setSave("Could not save to your account. Progress saves in this browser.","bad");
    }
  }
  writing = false;
}
async function connect(){
  try{
    if(!window.claude || !window.claude.use) return;
    const [u, d] = await Promise.all([window.claude.use("user"), window.claude.use("db")]);
    if(!u || !d) return;
    const id = await u.id(); if(!id) return;
    db = d; uid = id;
    const snap = await db.doc("attempts/"+uid).get();
    if(snap.exists){ applySaved(snap.data()); render(); setSave("Progress saved to your account.","ok"); }
    else if(answered() || tries.some(t=>t.length)){ persist(); }
    else setSave("Progress saves to your account.","ok");
  }catch(e){ /* keep local-only mode */ }
}

function render(top=true){ renderHeader(); showResults?renderResults():renderQ(); if(top) window.scrollTo({top:0}); }
applySaved(lsLoad());
render();
connect();
</script>
