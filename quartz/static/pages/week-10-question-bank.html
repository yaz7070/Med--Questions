<style>
/* Nexus quiz page. Matches the site: neutral greys, one typeface, and the block's colour as --accent. */
:root{
  --bg:#f5f6f8;--paper:#ffffff;--ink:#15181d;--muted:#4d5560;--faint:#7b828d;--line:#e0e3e8;
  --accent:#0b7a75;--soft:#eef0f3;
  --ok:#1d7a46;--okw:#e7f4ec;--bad:#b42318;--badw:#fcecea;--tick:#dfe2e7;
  --display:"Atkinson Hyperlegible Next","Segoe UI",system-ui,-apple-system,sans-serif;
  --body:"Atkinson Hyperlegible Next","Segoe UI",system-ui,-apple-system,sans-serif;
  --r:8px;
}
:root[data-b="2"]{--accent:#4f46c8}:root[data-b="3"]{--accent:#a3246b}:root[data-b="4"]{--accent:#a35f08}
:root[data-theme="dark"]{
  --bg:#14161a;--paper:#1b1e24;--ink:#eceef2;--muted:#b3bac5;--faint:#8a919c;--line:#2d323b;
  --accent:#45c2b8;--soft:#252930;
  --ok:#5ccf8f;--okw:#13301f;--bad:#f2877c;--badw:#3a1c1a;--tick:#30353e;color-scheme:dark}
:root[data-theme="dark"][data-b="2"]{--accent:#a49df6}:root[data-theme="dark"][data-b="3"]{--accent:#ef8ec0}:root[data-theme="dark"][data-b="4"]{--accent:#e3a548}
.btn:hover:not(:disabled){filter:brightness(.92)}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55}
.wrap{max-width:820px;margin:0 auto;padding-block:28px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:20px}

/* Header */
header{display:flex;flex-direction:column;gap:10px}
.context{margin:0;color:var(--faint);font-size:14px;font-weight:600}
h1{font-family:var(--display);font-weight:700;font-size:clamp(28px,5vw,40px);line-height:1.05;letter-spacing:-.02em;margin:0;text-wrap:balance}
.stats{display:flex;flex-wrap:wrap;gap:6px 22px;font-size:15px;color:var(--muted);font-variant-numeric:tabular-nums}
.stats b{color:var(--ink);font-weight:700}
.bar{height:6px;border-radius:999px;background:var(--tick);overflow:hidden}
.bar span{display:block;height:100%;width:0;background:var(--accent);border-radius:999px;transition:width .25s ease}
.map summary{cursor:pointer;color:var(--accent);font-weight:600;font-size:14px;width:max-content;list-style:none;padding:2px 0}
.map summary::-webkit-details-marker{display:none}
.map summary::before{content:"▸";display:inline-block;margin-right:6px;transition:transform .15s ease}
.map[open] summary::before{transform:rotate(90deg)}
.map summary:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:4px}
.ticks{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}
.tick{width:14px;height:14px;border:0;border-radius:4px;background:var(--tick);padding:0;cursor:pointer}
.tick:hover{background:var(--faint)}
.tick.ok{background:var(--ok)}.tick.bad{background:var(--bad)}
.tick.cur{outline:2px solid var(--accent);outline-offset:2px}
.tick.redo{box-shadow:inset 0 -3px 0 var(--accent)}
.tick:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.saverow{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.save{font-size:13px;color:var(--faint)}
.resetbtn{font:inherit;font-size:13px;font-weight:700;color:var(--muted);background:none;border:1px solid var(--line);border-radius:6px;padding:3px 10px;cursor:pointer}
.resetbtn:hover{color:var(--bad);border-color:var(--bad)}
.resetbtn.armed{color:#fff;background:var(--bad);border-color:var(--bad)}
.resetbtn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.save.ok{color:var(--ok)}.save.bad{color:var(--bad)}

/* Question card */
.card{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:26px;display:flex;flex-direction:column;gap:18px}
.chead{display:flex;justify-content:space-between;align-items:center;gap:10px}
.tag{font-size:13px;font-weight:700;color:var(--accent);background:var(--soft);padding:3px 9px;border-radius:4px}
.chead-r{display:flex;align-items:center;gap:12px}
.ankibtn{font:inherit;font-size:13.5px;font-weight:700;color:var(--muted);background:transparent;border:1.5px solid var(--line);border-radius:6px;padding:4px 10px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.ankibtn::before{content:"";width:9px;height:11px;background:currentColor;clip-path:polygon(0 0,100% 30%,0 60%);border-left:2px solid currentColor;box-sizing:content-box}
.ankibtn:hover{border-color:var(--accent);color:var(--accent)}
.ankibtn[aria-pressed="true"]{border-color:var(--accent);background:var(--soft);color:var(--accent)}
.ankibtn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ankirow{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.qn{font-family:var(--display);font-weight:700;font-size:15px;color:var(--faint);font-variant-numeric:tabular-nums}
.stem{font-size:18.5px;line-height:1.6;margin:0;white-space:pre-line;max-width:70ch}
.hint{font-size:13px;color:var(--faint)}
.tries{font-size:13px;color:var(--muted)}
.tries .bad{color:var(--bad);font-weight:600}.tries .ok{color:var(--ok);font-weight:600}

/* Options */
.opts{display:flex;flex-direction:column;gap:10px}
.optrow{display:flex;gap:8px;align-items:stretch}
.optrow .opt{flex:1;min-width:0}
.opt{display:flex;gap:14px;align-items:center;text-align:left;width:100%;background:var(--paper);color:var(--ink);border:1.5px solid var(--line);border-radius:var(--r);padding:12px 16px;font:inherit;font-size:16.5px;line-height:1.45;cursor:pointer;transition:border-color .12s ease,background .12s ease}
.opt:hover:not(:disabled){border-color:var(--accent);background:var(--soft)}
.opt:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.opt:disabled{cursor:default}
.opt .k{flex:none;display:inline-grid;place-items:center;width:30px;height:30px;border-radius:6px;background:var(--soft);color:var(--accent);font-family:var(--display);font-weight:700;font-size:14px}
.opt.right{border-color:var(--ok);background:var(--okw)}
.opt.right .k{background:var(--ok);color:var(--paper)}
.opt.wrong{border-color:var(--bad);background:var(--badw)}
.opt.wrong .k{background:var(--bad);color:var(--paper)}
.strike{flex:none;width:44px;border:1.5px solid var(--line);border-radius:var(--r);background:var(--paper);color:var(--faint);font-size:14px;cursor:pointer;display:grid;place-items:center}
.strike:hover{border-color:var(--accent);color:var(--accent)}
.strike:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.strike[aria-pressed="true"]{background:var(--soft);color:var(--ink)}
.optrow.struck .opt > span:last-child{text-decoration:line-through;color:var(--faint)}
.optrow.struck .opt .k{opacity:.45}

/* Feedback */
.fb{background:var(--bg);border-radius:var(--r);padding:18px 20px;display:flex;flex-direction:column;gap:10px}
.verdict{font-family:var(--display);font-weight:700;font-size:18px;display:flex;align-items:center;gap:8px}
.verdict::before{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;font-size:13px;color:var(--paper)}
.verdict.ok{color:var(--ok)}.verdict.ok::before{content:"✓";background:var(--ok)}
.verdict.bad{color:var(--bad)}.verdict.bad::before{content:"✕";background:var(--bad)}
.fb p{margin:0;max-width:72ch}
.fb .why,.fb .alt{display:flex;gap:10px;align-items:baseline}
.fb .why{font-weight:600}
.lk{flex:none;display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--line);color:var(--muted);font-family:var(--display);font-weight:700;font-size:12px;transform:translateY(-1px)}
.lk.ok{background:var(--ok);color:var(--paper)}
.fb .alt{color:var(--muted)}
.fb .take{border-left:3px solid var(--accent);padding:2px 0 2px 12px;color:var(--ink)}
.fb .take b{color:var(--accent)}
.obj{font-size:13.5px;color:var(--faint);line-height:1.5}
.obj b{color:var(--muted)}
.fbtools{display:flex;justify-content:flex-end}
.offrow{display:flex;justify-content:flex-start}
.offbtn{font:inherit;font-size:13.5px;color:var(--faint);background:none;border:0;padding:2px 0;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.offbtn:hover{color:var(--bad)}
.offbtn[aria-pressed="true"]{color:var(--bad);font-weight:700}
.offbtn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* Buttons */
.nav{display:flex;justify-content:space-between;gap:10px}
.btn{font-family:var(--display);font-weight:700;font-size:15px;padding:10px 20px;border:1.5px solid var(--accent);border-radius:6px;background:var(--accent);color:var(--paper);cursor:pointer}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.ghost:hover:not(:disabled){background:var(--soft);color:var(--accent);border-color:var(--accent)}
.btn:disabled{opacity:.35;cursor:default}
.btn:focus-visible{outline:2px solid var(--ink);outline-offset:3px}

/* Results */
.big{font-family:var(--display);font-size:clamp(48px,9vw,72px);font-weight:700;line-height:1;letter-spacing:-.03em;color:var(--accent);font-variant-numeric:tabular-nums}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
td,th{text-align:left;padding:9px 0;border-bottom:1px solid var(--line);font-size:15px;vertical-align:middle}
th{font-size:13px;font-weight:700;color:var(--faint)}
td:last-child,th:last-child{text-align:right;white-space:nowrap;padding-left:12px}
.meter{display:block;height:5px;border-radius:999px;background:var(--tick);margin-top:6px;max-width:320px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent);border-radius:999px}
h2{font-family:var(--display);font-size:21px;font-weight:700;margin:6px 0 0}
h3{font-size:14px;font-weight:700;color:var(--faint);margin:6px 0 0}
.miss{margin:0;padding-left:0;list-style:none;display:flex;flex-direction:column;gap:8px;font-size:15px}
.miss code{font-family:var(--display);font-weight:700;font-size:13px;color:var(--bad);background:var(--badw);padding:1px 7px;border-radius:999px;margin-right:8px}

@media (max-width:560px){.card{padding:18px}.stem{font-size:17.5px}.opt{padding:11px 12px;gap:10px}.strike{width:40px}}
@media (prefers-reduced-motion:no-preference){.fb{animation:in .2s ease-out}@keyframes in{from{opacity:.3;transform:translateY(4px)}to{opacity:1;transform:none}}}
@media (prefers-reduced-motion:reduce){.bar span,.opt,.map summary::before{transition:none}}
</style>

    r.dataset.theme = t || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"); }
  theme(); addEventListener("storage",theme);
})();

<script>
const QUESTIONS = [{"c": "Bleeding disorders", "p": "Aisha, 16, has had heavy periods since menarche and nosebleeds that last over 30 minutes. Her father bruises easily. She takes no drugs.\n\nHb 104 g/L (ref 115-160)\nPlatelets 230 × 10⁹/L (ref 150-450)\nPT/INR normal\naPTT mildly prolonged\nvWF antigen 0.6 IU/mL\nvWF activity 0.2 IU/mL\nFVIII activity mildly low\n\nWhat is the most likely diagnosis?", "o": ["Glanzmann thrombasthenia", "Type 2 von Willebrand disease", "Type 3 von Willebrand disease", "Type 1 von Willebrand disease", "Hemophilia A"], "a": 1, "e": "Correct: B. vWF activity is a third of the antigen, well under 70%, so the vWF that is present doesn't work. That is a qualitative defect, type 2 VWD.\nA: Glanzmann thrombasthenia has normal vWF.\nC: Type 3 has almost no vWF at all.\nD: Type 1 lowers antigen and activity in proportion.\nE: Hemophilia A is X-linked and causes joint and muscle bleeds.\nTakeaway: Type 2 has 4 subtypes: 2A, 2B, 2M and 2N.", "l": ["W10 11.1", "W10 4.2.3"]}, {"c": "Thrombocytopenia", "p": "Which of the following is NOT part of ITP management?", "o": ["Rituximab", "Thrombopoietin mimetics such as romiplostim", "Plasma exchange to replace ADAMTS-13", "Glucocorticoids such as prednisone or dexamethasone"], "a": 2, "e": "Correct: C. Plasma exchange to replace ADAMTS-13 treats TTP.\nA: Rituximab is an ITP treatment (and also used in TTP).\nB: TPO mimetics (romiplostim, eltrombopag) are an ITP treatment.\nD: Glucocorticoids are an ITP treatment.\nTakeaway: ITP: steroids, IVIg, splenectomy, rituximab, TPO mimetics, immune suppression.", "l": ["W10 3.5"]}, {"c": "Bleeding disorders", "p": "Two patients present.\nPatient 1: recurrent nosebleeds, heavy periods, easy bruising.\nPatient 2: spontaneous swelling of the knee and a thigh hematoma.\n\nWhich category of defect does each pattern suggest, in order?", "o": ["Secondary hemostasis, then primary hemostasis", "Hyperfibrinolysis, then primary hemostasis", "Primary hemostasis for both", "Primary hemostasis, then secondary hemostasis"], "a": 3, "e": "Correct: D. Mucocutaneous bleeding suggests platelets or vWF. Deep bleeding into joints and muscles suggests coagulation factor deficiency.\nA: This reverses the patterns.\nB: Hyperfibrinolysis is not suggested, and joints point to factors.\nC: Joint and muscle bleeds point to coagulation factors.\nTakeaway: Primary = mucocutaneous, often immediate. Secondary = deep, less immediate.", "l": ["W10 4.1", "W10 5.3"]}, {"c": "Bleeding disorders", "p": "A 6-day-old boy who received vitamin K at birth oozes from his umbilical stump. Platelets, PT, aPTT and fibrinogen are all normal. Which deficiency is most likely?", "o": ["Factor XIII deficiency", "Factor VII deficiency", "Hemophilia A", "Vitamin K deficiency bleeding"], "a": 0, "e": "Correct: A. FXIII cross-links fibrin after the clot forms, so PT and aPTT stay normal. Neonatal umbilical bleeding and ICH are classic FXIII presentations.\nB: FVII deficiency gives an isolated prolonged PT.\nC: Hemophilia A prolongs the aPTT.\nD: He received vitamin K, and deficiency prolongs the PT.\nTakeaway: Bleeding with normal INR and PTT: remember FXIII deficiency.", "l": ["W10 4.2.3", "W10 11.2"]}, {"c": "Coagulation tests", "p": "Three people complete standardized bleeding tools.\nPatient 1: woman, 30, ISTH BAT 5\nPatient 2: man, 30, ISTH BAT 5\nPatient 3: child, 9, PBQ 3\n\nHow should each score be interpreted, in order?", "o": ["Abnormal, abnormal, positive", "Abnormal, normal, negative", "Normal, abnormal, positive", "Normal, normal, negative"], "a": 2, "e": "Correct: C. ISTH BAT normal cut-offs are under 4 in adult males and under 6 in adult females. PBQ is positive above 2.\nA: The woman's 5 is under 6, so it is normal.\nB: This reverses the sex-specific cut-offs, and PBQ 3 is positive.\nD: The man's 5 is above his cut-off, and a PBQ of 3 is positive.\nTakeaway: A normal BAT has a high negative predictive value for a mild bleeding disorder.", "l": ["W10 4.1"]}, {"c": "Hemostasis and platelets", "p": "Which statement about fibrinolysis (tertiary hemostasis) is correct?", "o": ["t-PA converts fibrinogen into fibrin monomers", "D-dimers form when thrombin cleaves soluble fibrin", "PAI-1 activates t-PA to speed clot breakdown", "TAFI inhibits plasmin formation and suppresses fibrinolysis"], "a": 3, "e": "Correct: D. TAFI (thrombin activatable fibrinolysis inhibitor) inhibits formation of plasmin.\nA: Thrombin, not t-PA, converts fibrinogen to fibrin. t-PA converts plasminogen to plasmin.\nB: D-dimers come from plasmin acting on cross-linked fibrin.\nC: PAI-1 inhibits t-PA. It slows breakdown.\nTakeaway: t-PA makes plasmin. Plasmin makes D-dimers. TAFI, PAI-1 and antiplasmin apply the brakes.", "l": ["W10 2.2"]}, {"c": "Thrombocytopenia", "p": "Jordan, 40, had a CBC for a work medical. He feels well and has never had bruising, nosebleeds or bleeding after dental work or a past appendectomy. He takes no drugs. His exam is normal.\n\nHb 148 g/L (ref 135-170)\nWBC 6.9 × 10⁹/L (ref 4-10)\nPlatelets 35 × 10⁹/L (ref 150-450)\nPT/INR normal\naPTT normal\nSample: lavender top tube\nFilm: large platelet clumps.\n\nWhat is the most likely diagnosis?", "o": ["Bernard Soulier syndrome", "Thrombotic thrombocytopenic purpura", "Immune thrombocytopenia", "Splenic sequestration", "EDTA-dependent pseudothrombocytopenia"], "a": 4, "e": "Correct: E. No bleeding ever, a normal exam, an EDTA tube and platelet clumps on the film fit pseudothrombocytopenia. Antibodies bind platelets in EDTA, and the counter misses the clumps.\nA: Bernard Soulier causes bleeding.\nB: TTP brings hemolysis and a sick patient.\nC: ITP is a diagnosis of exclusion and shows no clumps.\nD: Sequestration needs a large spleen.\nTakeaway: Repeat the count in a sodium citrate tube.", "l": ["W10 3.3", "W10 3.1"]}, {"c": "Thrombocytopenia", "p": "Ethan, 4, has new petechiae on his legs and two nosebleeds. Two weeks ago he had a cold. He is playing happily and has no fever, bone pain, weight loss or bloody diarrhea. On exam he has scattered petechiae and bruises, with no enlarged nodes, liver or spleen.\n\nHb 124 g/L (ref 110-140)\nWBC 7.6 × 10⁹/L (ref 4-10)\nNeutrophils and lymphocytes normal\nPlatelets 8 × 10⁹/L (ref 150-450)\nPT/INR normal\naPTT normal\nFilm: a few large platelets. No blasts, no schistocytes, no clumps.\n\nWhat is the most likely diagnosis?", "o": ["Hemolytic-uremic syndrome", "EDTA-dependent pseudothrombocytopenia", "Acute lymphoblastic leukemia", "Thrombotic thrombocytopenic purpura", "Immune thrombocytopenia"], "a": 4, "e": "Correct: E. A well child with isolated severe thrombocytopenia after a viral illness, other cell lines normal and a clean film fits ITP, a diagnosis of exclusion. Half of cases are children, and these resolve within 6 months.\nA: HUS follows bloody diarrhea, with hemolysis and kidney injury.\nB: Pseudothrombocytopenia shows clumps and causes no bleeding.\nC: ALL lowers other cell lines and shows blasts.\nD: TTP brings hemolytic anemia, schistocytes and neurological signs.\nTakeaway: ITP: antibodies coat platelets, and splenic macrophages consume them.", "l": ["W10 3.4", "W10 3.2"]}, {"c": "Thrombocytopenia", "p": "Kofi, 50, is in the ICU with septic shock from pneumonia. Over 12 hours he has started oozing from IV sites and his central line, with new bruises. He has had no heparin.\n\nHb 85 g/L (ref 135-170)\nWBC 22 × 10⁹/L (ref 4-10)\nPlatelets 40 × 10⁹/L (ref 150-450)\nPT/INR 2.0\naPTT prolonged\nFibrinogen 0.8 g/L\nD-dimer very high\nFilm: schistocytes.\n\nWhat is the most likely diagnosis?", "o": ["Disseminated intravascular coagulation", "Thrombotic thrombocytopenic purpura", "Vitamin K deficiency", "Heparin-induced thrombocytopenia", "Immune thrombocytopenia"], "a": 0, "e": "Correct: A. Sepsis with bleeding, platelets under 100, a high INR, fibrinogen under 1 g/L, a high D-dimer and schistocytes fit DIC. Overactive clotting consumes factors and platelets.\nB: TTP has a normal INR and fibrinogen.\nC: Vitamin K deficiency leaves platelets and fibrinogen normal.\nD: HIT needs heparin and causes clots, not oozing.\nE: ITP has normal clotting tests.\nTakeaway: DIC: cryoprecipitate if fibrinogen is under 1.0 g/L, platelets if under 50, plasma if INR over 1.5.", "l": ["W10 3.5", "W10 4.2.3"]}, {"c": "Transfusion", "p": "Which patient best meets an indication for red cell transfusion?", "o": ["Hb 78 g/L, age 25, no symptoms or cardiac history", "Hb 85 g/L, age 70, coronary disease, chest pain", "Hb 95 g/L in a 50 year old before elective surgery", "Hb 72 g/L, age 40, refuses blood products"], "a": 1, "e": "Correct: B. Hb 70 to 90 g/L with risk of cardiac ischemia is an indication.\nA: Without symptoms or cardiac risk, the threshold is under 70.\nC: 95 is above the listed thresholds.\nD: Patient refusal is a contraindication. Consider EPO, iron, B12 and folate.\nTakeaway: 1 unit RBC raises Hb by about 10 g/L.", "l": ["W10 9.4"]}, {"c": "Transfusion", "p": "Which patient meets an indication for platelet transfusion?", "o": ["A patient with TTP, platelets 15 x 10^9/L and no bleeding", "A patient with HIT and platelets 40 x 10^9/L", "A stable outpatient with platelets 25 x 10^9/L and no bleeding", "A patient with platelets 80 x 10^9/L going for neurosurgery"], "a": 3, "e": "Correct: D. Neurosurgery needs platelets above 100 x 10^9/L.\nA: TTP is a contraindication because it fuels further thrombosis.\nB: HIT is a contraindication.\nC: Prophylactic transfusion without bleeding or a procedure targets under 10.\nTakeaway: Platelet thresholds: under 10, under 50 for invasive surgery, under 100 for neurosurgery.", "l": ["W10 9.4", "W10 3.5"]}, {"c": "VTE", "p": "George, 81, had hip fracture surgery yesterday. He had a DVT 5 years ago.\n\nHow long should his thromboprophylaxis last at minimum?", "o": ["Lifelong", "7 to 10 days", "4 to 6 weeks", "Until discharge only"], "a": 2, "e": "Correct: C. Hip fracture is the highest VTE risk. Prophylaxis runs at least 7 to 10 days, extended to 4 to 6 weeks with cancer or past VTE.\nA: Prophylaxis is time limited.\nB: 7 to 10 days applies without cancer or prior VTE.\nD: Prophylaxis continues while he is not ambulatory and beyond discharge.\nTakeaway: Virchow's triad: stasis, injury, hypercoagulability.", "l": ["W10 6.1", "W10 6.2"]}, {"c": "Transfusion", "p": "Which blood product is correctly paired with its storage?", "o": ["Plasma: 4 °C in the blood bank fridge, up to 1 year", "Platelets: 20 to 24 °C with mixing, up to 7 days", "Red cells: room temperature, up to 42 days", "Cryoprecipitate: room temperature, up to 5 years"], "a": 1, "e": "Correct: B. Platelets stay at room temperature with constant slow mixing to preserve function, up to 7 days.\nA: Plasma is frozen at -18 °C for up to 1 year.\nC: Red cells are refrigerated at 4 °C for up to 42 days.\nD: Cryo is frozen at -18 °C for up to 1 year.\nTakeaway: Fibrinogen concentrate and PCCs are lyophilized with virus inactivation.", "l": ["W10 9.6"]}, {"c": "Thrombocytopenia", "p": "Hector, 61, has early satiety and fullness in his left upper abdomen. Ultrasound shows a spleen of 18 cm. His liver enzymes and liver function are normal. He has no bleeding.\n\nHb 118 g/L (ref 135-170)\nWBC 3.6 × 10⁹/L (ref 4-10)\nPlatelets 70 × 10⁹/L (ref 150-450)\nPT/INR normal\nReticulocytes normal\nFilm: no blasts, no schistocytes, no clumps.\nMarrow: normal cellularity with plenty of megakaryocytes.\n\nWhat is the most likely cause of his low platelets?", "o": ["Sequestration in the enlarged spleen", "Decreased marrow production", "Thrombotic thrombocytopenic purpura", "Immune thrombocytopenia", "EDTA-dependent pseudothrombocytopenia"], "a": 0, "e": "Correct: A. A large spleen with mild cytopenias, a normal marrow full of megakaryocytes and no sign of destruction points to sequestration.\nB: His marrow is normal and full of megakaryocytes.\nC: TTP shows schistocytes and hemolysis.\nD: ITP is a diagnosis of exclusion, and the large spleen explains the count.\nE: The film shows no clumps.\nTakeaway: Low platelets: less production, more destruction, or sequestration.", "l": ["W10 3.1", "W10 3.3"]}, {"c": "Anticoagulants", "p": "Bleeding emergencies in two patients:\nPatient 1: on warfarin with an intracranial hemorrhage, INR 3.4.\nPatient 2: on dabigatran with a major GI bleed.\n\nWhich reversal plans fit, in order?", "o": ["Protamine sulphate, then idarucizumab", "Vitamin K IV plus PCC, then protamine sulphate", "Vitamin K IV plus PCC, then idarucizumab", "Idarucizumab, then vitamin K IV plus PCC"], "a": 2, "e": "Correct: C. Warfarin emergency reversal = vitamin K plus PCC (vitamin K prevents rebound coagulopathy once PCC wears off). Dabigatran's antidote is idarucizumab, a monoclonal antibody.\nA: Protamine reverses heparin, not warfarin.\nB: Protamine has no effect on dabigatran.\nD: This reverses the two antidotes.\nTakeaway: Andexanet alfa targets Xa inhibitors. Protamine targets UFH (partial for LMWH).", "l": ["W10 7.3"]}, {"c": "Anticoagulants", "p": "Elaine is on an IV UFH infusion at 1000 units per hour. She develops major bleeding. The infusion has run steadily for 6 hours.\n\nUsing the rule in your notes, what dose of protamine sulphate fits best?", "o": ["10 mg", "60 mg", "100 mg", "25 mg"], "a": 3, "e": "Correct: D. Protamine is 1 mg per 100 units of UFH given in the last 2 to 2.5 hours. 1000 U/h x 2.5 h = 2500 U, so 25 mg.\nA: 10 mg covers only 1 hour of infusion.\nB: 60 mg counts all 6 hours. UFH from earlier has already cleared (half-life 60 to 90 minutes).\nC: 100 mg is the maximum single dose. Too much causes hypotension and a weak anticoagulant effect.\nTakeaway: Only recent heparin counts because of the short half-life.", "l": ["W10 7.3"]}, {"c": "Bleeding disorders", "p": "Which precaution is NOT recommended for a child with hemophilia?", "o": ["Skip routine dental visits", "Avoid antiplatelet agents such as aspirin", "Use prophylactic factor infusions at home", "Wear a helmet when riding a bicycle"], "a": 0, "e": "Correct: A. Routine dental care is recommended because it prevents the need for dental surgery.\nB: Avoiding aspirin is recommended.\nC: Home infusion prophylaxis is the norm in Canada for severe hemophilia.\nD: Protective gear is recommended.\nTakeaway: Primary prophylaxis prevents joint bleeds and has improved life expectancy.", "l": ["W10 10.1"]}, {"c": "Anticoagulants", "p": "Which of the following is NOT an adverse effect or limitation of unfractionated heparin?", "o": ["Osteoporosis", "Accumulation in renal failure", "Heparin-induced thrombocytopenia", "Unpredictable pharmacokinetics"], "a": 1, "e": "Correct: B. UFH is degraded by the RES in the liver and is safe in renal failure. LMWH is the one that accumulates.\nA: Osteoporosis is an adverse event of UFH.\nC: HIT is an adverse event of UFH, about 3 times more than with LMWH.\nD: UFH is heterogeneous with unpredictable pharmacokinetics.\nTakeaway: LMWH vs UFH: less bleeding, less HIT, less osteoporosis, home treatment, but renal clearance.", "l": ["W10 7.2"]}, {"c": "Coagulation tests", "p": "A lab technologist runs a PT and an aPTT on the same citrated plasma sample.\n\nWhich reagent component is present in the PT test but absent from the aPTT test?", "o": ["Tissue factor (thromboplastin)", "Calcium chloride to reverse citrate", "Phospholipid from a platelet substitute", "A contact activator"], "a": 0, "e": "Correct: A. PT reagent contains thromboplastin (tissue factor), which drives the extrinsic pathway via FVII. The aPTT reagent has no tissue factor.\nB: Both tests add calcium chloride to overcome citrate.\nC: Both reagents contain phospholipid.\nD: The contact activator belongs to the aPTT, not the PT.\nTakeaway: PT = TF-driven (VII, then X, V, II, I). aPTT = contact-driven (XII, XI, IX, VIII, then common).", "l": ["W10 4.2.1", "W10 4.2.2"]}, {"c": "Coagulation tests", "p": "Margaret, 78, has 3 weeks of large spontaneous bruises on her arms and thighs and a bleed into her forearm muscle. She never bled with past surgeries or childbirth. She takes no anticoagulants and has no family history of bleeding.\n\nHb 98 g/L (ref 115-160)\nPlatelets 260 × 10⁹/L (ref 150-450)\nPT/INR normal\naPTT prolonged\n50:50 mixing study aPTT does not correct\nFVIII activity very low\n\nWhat is the most likely diagnosis?", "o": ["Congenital hemophilia A", "Vitamin K deficiency", "Factor XII deficiency", "Type 1 von Willebrand disease", "Acquired hemophilia A from an FVIII inhibitor"], "a": 4, "e": "Correct: E. New, severe bleeding in an older adult with no past bleeding, an isolated long aPTT that does not correct on mixing, and very low FVIII fit an acquired inhibitor against FVIII. Correction means a deficiency, while no correction means an inhibitor.\nA: Congenital hemophilia shows up in childhood, and the mixing study would correct.\nB: Vitamin K deficiency prolongs the INR first.\nC: Factor XII deficiency doesn't cause bleeding.\nD: Type 1 VWD causes mucosal bleeding, and the mixing study would correct.\nTakeaway: Acquired bleeding disorders include hemophilia A, VWD and platelet disorders.", "l": ["W10 4.2.3", "W10 4.1"]}, {"c": "Bleeding disorders", "p": "Noah, 10, has had two knee bleeds after soccer and a large thigh hematoma after a fall. His mother's brother has a bleeding disorder. He has no nosebleeds or gum bleeding.\n\nHb 124 g/L (ref 115-155)\nPlatelets 300 × 10⁹/L (ref 150-450)\nPT/INR normal\naPTT prolonged\n50:50 mixing study aPTT corrects\nFVIII activity normal\nvWF antigen and activity normal\n\nWhat is the most likely diagnosis?", "o": ["Factor VII deficiency", "Type 1 von Willebrand disease", "Acquired FVIII inhibitor", "Hemophilia A", "Hemophilia B"], "a": 4, "e": "Correct: E. Joint and muscle bleeds in a boy with an affected maternal uncle, a long aPTT that corrects on mixing, and normal FVIII and vWF point to hemophilia B, factor IX deficiency.\nA: Factor VII deficiency prolongs the PT/INR.\nB: Type 1 VWD causes mucosal bleeding and a low vWF.\nC: An inhibitor would not correct on mixing.\nD: Hemophilia A would have a low FVIII.\nTakeaway: Hemophilia A and B are both X-linked and mostly affect males.", "l": ["W10 11.1", "W10 11.2"]}, {"c": "Bleeding disorders", "p": "Two boys with severe hemophilia (baseline level near 0%) have joint bleeds. Each needs a target factor level of 60%.\nBoy 1 has hemophilia A. Boy 2 has hemophilia B.\n\nUsing the rule in your notes (1 U/kg FVIII raises the level by 2%, 1 U/kg FIX raises it by 1%), what dose does each need, in order?", "o": ["120 U/kg rFVIII, then 60 U/kg rFIX", "60 U/kg rFVIII, then 30 U/kg rFIX", "30 U/kg rFVIII, then 30 U/kg rFIX", "30 U/kg rFVIII, then 60 U/kg rFIX"], "a": 3, "e": "Correct: D. 60% divided by 2% per U/kg = 30 U/kg FVIII. 60% divided by 1% per U/kg = 60 U/kg FIX.\nA: This multiplies by 2 instead of dividing.\nB: This swaps the recovery rates.\nC: FIX recovery is half that of FVIII, so FIX needs double.\nTakeaway: Joint bleeds target over 50%.", "l": ["W10 5.4"]}, {"c": "Thrombocytopenia", "p": "Consider these statements about heparin-induced thrombocytopenia:\ni) It presents with thrombosis, not bleeding\nii) Onset is typically 5 to 10 days after heparin starts\niii) Platelet transfusion is standard treatment\niv) An anti-PF4 ELISA supports the diagnosis\n\nWhich are correct?", "o": ["ii), iii) and iv) only", "i), iii) and iv) only", "i), ii) and iv) only", "i) and ii) only", "All of the above"], "a": 2, "e": "Correct: C. HIT antibodies form against the heparin-PF4 complex and activate platelets, causing thrombosis. Onset is 5 to 10 days. Anti-PF4 ELISA and the serotonin assay support it.\nA: Includes iii). Platelet transfusions are avoided in HIT.\nB: Includes iii) and drops ii).\nD: Leaves out iv), which is true.\nE: iii) is false.\nTakeaway: HIT pathophysiology: antibody to heparin-PF4 activates platelets, causing consumption and thrombosis.", "l": ["W10 3.4"]}, {"c": "Hemostasis and platelets", "p": "Leila, 19, has had nosebleeds since childhood, heavy periods and bleeding gums. Her parents are first cousins. She takes no NSAIDs or other drugs.\n\nHb 108 g/L (ref 115-160)\nPlatelets 250 × 10⁹/L (ref 150-450)\nPlatelet size normal\nPT/INR normal\naPTT normal\nvWF antigen and activity normal\nPlatelet aggregometry: platelets adhere to collagen but do not aggregate.\n\nWhat is the most likely diagnosis?", "o": ["Bernard Soulier syndrome", "Glanzmann thrombasthenia", "Hemophilia A", "Type 1 von Willebrand disease", "Immune thrombocytopenia"], "a": 1, "e": "Correct: B. Mucocutaneous bleeding with normal platelet number and size, normal clotting tests, normal vWF, and platelets that adhere but fail to aggregate fit Glanzmann thrombasthenia. Aggregation needs GPIIb/IIIa.\nA: Bernard Soulier is a disorder of adhesion.\nC: Hemophilia A prolongs the aPTT and causes joint bleeds.\nD: Her vWF is normal.\nE: Her platelet count is normal.\nTakeaway: Normal INR and PTT don't rule out a bleeding disorder.", "l": ["W10 1.2", "W10 1.3"]}, {"c": "Bleeding disorders", "p": "Consider these genetic bleeding disorders:\ni) Glanzmann thrombasthenia is a disorder of primary hemostasis\nii) Hemophilia B is a disorder of secondary hemostasis\niii) Type 3 vWD is a disorder of primary hemostasis that also lowers FVIII\niv) Bernard Soulier syndrome is a disorder of secondary hemostasis\n\nWhich are correct?", "o": ["i) and ii) only", "i), ii) and iv) only", "i), ii) and iii) only", "ii), iii) and iv) only", "All of the above"], "a": 2, "e": "Correct: C. Glanzmann and Bernard Soulier are platelet disorders (primary). Hemophilia B is FIX (secondary). vWD is primary, and type 3 also loses FVIII.\nA: Leaves out iii), which is true.\nB: Includes iv) and drops iii).\nD: Includes iv). Bernard Soulier is a platelet adhesion disorder.\nE: iv) is false.\nTakeaway: Platelets and vWF = primary. Coagulation factors = secondary.", "l": ["W10 11.1", "W10 11.2"]}, {"c": "VTE", "p": "Which patient has the strongest indication for a thrombophilia screen?", "o": ["A 28 year old with unprovoked cerebral vein thrombosis", "A 72 year old with DVT after knee arthroplasty", "A 60 year old with DVT during chemotherapy", "A 70 year old with PE after a long hospitalization"], "a": 0, "e": "Correct: A. Indications include idiopathic events, age under 55 and unusual location such as the brain. She meets all three.\nB: Arthroplasty is a strong provoking factor, and he is over 55.\nC: Cancer explains the clot, and she is over 55.\nD: Hospitalization is a provoking factor, and he is over 55.\nTakeaway: Thrombophilias: FV Leiden, prothrombin mutation, protein C, S, antithrombin deficiency, antiphospholipid antibodies.", "l": ["W10 6.1"]}, {"c": "Anticoagulants", "p": "Which anticoagulant is indirect (needs antithrombin) and inhibits only Factor Xa?", "o": ["Unfractionated heparin", "Fondaparinux", "Dabigatran", "Rivaroxaban"], "a": 1, "e": "Correct: B. Fondaparinux is a synthetic pentasaccharide that binds antithrombin and inhibits Xa.\nA: UFH needs antithrombin but inhibits IIa, Xa, IXa, XIa and XIIa.\nC: Dabigatran is a direct thrombin inhibitor.\nD: Rivaroxaban inhibits Xa directly without antithrombin.\nTakeaway: Thrombin inhibition needs at least 18 saccharides to bridge antithrombin and thrombin.", "l": ["W10 7.1"]}, {"c": "Hemostasis and platelets", "p": "During the propagation phase of coagulation, large amounts of Factor Xa are produced.\n\nWhich complex converts Factor X to Xa in this phase?", "o": ["Tissue factor with Factor VIIa", "Factor Xa with Va, calcium and phospholipid", "Thrombin with Factor XIIIa", "Factor IXa with Factor VIIIa (tenase)"], "a": 3, "e": "Correct: D. In propagation, IXa plus VIIIa forms the tenase complex, which converts more X to Xa.\nA: TF/VIIa activates only a small amount of IX and X in the initiation phase.\nB: This is the prothrombinase complex. It converts prothrombin to thrombin, downstream of Xa.\nC: Thrombin activates XIII to cross-link fibrin. It does not form a complex that activates X.\nTakeaway: Initiation = TF/VIIa (small burst). Propagation = tenase (IXa/VIIIa) then prothrombinase (Xa/Va).", "l": ["W10 2.1"]}, {"c": "Coagulation tests", "p": "Two patients have prolonged PT and aPTT.\nPatient 1: platelets normal, D-dimer normal, fibrinogen normal, FV normal, FVII low.\nPatient 2: platelets low, D-dimer high, fibrinogen low, all factors low.\n\nWhich diagnoses fit, in order?", "o": ["Vitamin K deficiency, then DIC", "DIC, then vitamin K deficiency", "Liver disease, then DIC", "Vitamin K deficiency, then liver disease"], "a": 0, "e": "Correct: A. Patient 1 has a low vitamin K factor (FVII) with normal FV, which is not vitamin K dependent. Patient 2 shows consumption: low platelets, low fibrinogen, high D-dimer and all factors down.\nB: This reverses the two patterns.\nC: Liver disease lowers FV and fibrinogen. Patient 1 has normal FV and fibrinogen.\nD: Liver disease does not raise D-dimer or give low platelets with global consumption, and FVIII rises in liver disease.\nTakeaway: FV is the tiebreaker: normal in vitamin K deficiency, low in liver disease and DIC.", "l": ["W10 4.2.3"]}, {"c": "Transfusion", "p": "Which statement about consent for blood transfusion is correct?", "o": ["Verbal consent without any documentation is sufficient", "Consent is waived if need is urgent and no SDM is available", "Consent covers the procedure and risks only, not alternatives", "Consent is waived whenever the patient is over 80"], "a": 1, "e": "Correct: B. Consent is written, explains procedure, risks, benefits and alternatives in a capable patient, and is documented. It is waived in urgent need without an SDM.\nA: Consent is written and documented.\nC: Alternatives belong in the discussion.\nD: Age alone is not a reason to waive consent.\nTakeaway: Transfusion steps: need, consent, then blood bank tests (group, screen, crossmatch).", "l": ["W10 9.3"]}, {"c": "Anticoagulants", "p": "Why does warfarin need 5 to 7 days of overlap with UFH or LMWH when treatment starts?", "o": ["Heparin is needed to prevent warfarin-induced HIT", "The liver must first convert it into a direct thrombin inhibitor", "It blocks antithrombin, and antithrombin takes several days to clear", "Its effect reflects lower thrombin, and Factor II has a long half-life"], "a": 3, "e": "Correct: D. Warfarin blocks synthesis of II, VII, IX, X, protein C and S. Existing factors decay at their own half-lives, and the full effect depends on falling thrombin (II, 60 to 72 h).\nA: HIT is caused by heparin, not warfarin.\nB: Warfarin inhibits vitamin K reductase (VKORC1). It does not become a thrombin inhibitor.\nC: Warfarin does not act on antithrombin. Heparins need antithrombin.\nTakeaway: FVII falls first (3 to 8 h), so the INR rises before full protection.", "l": ["W10 7.1"]}, {"c": "Anticoagulants", "p": "A pregnant patient on therapeutic LMWH needs her anticoagulant effect checked.\n\nWhich test fits best?", "o": ["aPTT twice daily", "Thrombin time", "Anti-Xa assay", "INR every 1 to 2 days"], "a": 2, "e": "Correct: C. LMWH has a high anti-Xa to anti-IIa ratio, so it barely affects the aPTT. Monitor anti-Xa directly in pregnancy and renal failure.\nA: The aPTT monitors UFH, not LMWH.\nB: TT detects thrombin inhibition, which LMWH has little of.\nD: INR monitors warfarin.\nTakeaway: UFH = aPTT 2 to 4 times daily. LMWH = no routine monitoring, anti-Xa if needed.", "l": ["W10 7.1", "W10 8.3"]}, {"c": "Thrombocytopenia", "p": "Frank, 66, is on day 8 of subcutaneous unfractionated heparin after a hip replacement. His left calf is now swollen, and ultrasound shows a new DVT. He has no bleeding and no fever, and his wound is clean.\n\nHb 116 g/L (ref 135-170)\nWBC 8.8 × 10⁹/L (ref 4-10)\nPlatelets 90 (was 250 before surgery) × 10⁹/L (ref 150-450)\nPT/INR normal\nFibrinogen normal\nFilm: no schistocytes.\n\nWhat is the most likely diagnosis?", "o": ["Immune thrombocytopenia", "Splenic sequestration", "Disseminated intravascular coagulation", "Thrombotic thrombocytopenic purpura", "Heparin-induced thrombocytopenia"], "a": 4, "e": "Correct: E. A platelet fall of more than half, 5 to 10 days into heparin, with a new clot and no bleeding fits HIT. Antibodies against the heparin-PF4 complex activate platelets.\nA: ITP is a diagnosis of exclusion and doesn't cause thrombosis.\nB: Sequestration needs an enlarged spleen and develops slowly.\nC: DIC raises the INR and lowers fibrinogen.\nD: TTP shows schistocytes and hemolysis.\nTakeaway: Confirm with an anti-PF4 ELISA and a functional serotonin assay.", "l": ["W10 3.4", "W10 3.5"]}, {"c": "Thrombocytopenia", "p": "Diane, 38, is brought in confused with a headache and slurred speech that comes and goes. She has had fevers and new bruising for 3 days. She has had no diarrhea, takes no drugs and is not pregnant.\n\nHb 82 g/L (ref 115-160)\nReticulocytes high\nWBC 9.2 × 10⁹/L (ref 4-10)\nPlatelets 9 × 10⁹/L (ref 150-450)\nPT/INR normal\nFibrinogen normal\nLDH high\nCreatinine mildly high\nADAMTS-13 low\nFilm: many schistocytes.\n\nWhat is the most likely diagnosis?", "o": ["Disseminated intravascular coagulation", "Heparin-induced thrombocytopenia", "Hemolytic-uremic syndrome", "Immune thrombocytopenia", "Thrombotic thrombocytopenic purpura"], "a": 4, "e": "Correct: E. Neurological signs, fever, severe thrombocytopenia, hemolysis with schistocytes, normal clotting tests and a low ADAMTS-13 fit TTP. Ultra-large vWF multimers go uncut and cause clotting.\nA: DIC raises the INR and lowers fibrinogen.\nB: HIT needs heparin exposure and causes thrombosis.\nC: HUS follows a diarrheal illness and has a normal ADAMTS-13.\nD: ITP has no hemolysis or schistocytes.\nTakeaway: TTP: plasma exchange and steroids. Avoid platelet transfusions.", "l": ["W10 3.4", "W10 3.5"]}, {"c": "Pediatric bleeding", "p": "Three children present to clinic.\nChild 1: 2 year old boy with a swollen knee after a minor fall and easy bruising.\nChild 2: 13 year old girl with heavy periods and iron deficiency anemia.\nChild 3: 4 year old with petechiae after a viral illness, platelets 6.\n\nWhich diagnoses are most likely, in order?", "o": ["Hemophilia, ITP, von Willebrand disease", "Hemophilia, von Willebrand disease, ITP", "von Willebrand disease, hemophilia, ITP", "ITP, von Willebrand disease, hemophilia"], "a": 1, "e": "Correct: B. Hemarthrosis in a toddler boy suggests hemophilia. Menorrhagia with iron deficiency suggests vWD. Isolated severe thrombocytopenia after a virus suggests ITP.\nA: Menorrhagia is a vWF pattern, and petechiae with low platelets fits ITP.\nC: Joint bleeding points to factors, not vWF.\nD: This reverses the first and last cases.\nTakeaway: Petechiae = platelets. Joints = hemophilia. Epistaxis and menorrhagia = vWD.", "l": ["W10 5.1", "W10 5.3"]}, {"c": "Hemostasis and platelets", "p": "Consider these statements about antiplatelet agents:\ni) Aspirin inhibits cyclooxygenase and lowers thromboxane A2\nii) Clopidogrel blocks the P2Y12 receptor pathway\niii) Abciximab blocks GPIb/IX and prevents platelet adhesion\niv) Abciximab is directed against GPIIb/IIIa and prevents aggregation\n\nWhich statements are correct?", "o": ["i), ii) and iv) only", "ii), iii) and iv) only", "i), ii) and iii) only", "i) and ii) only", "All of the above"], "a": 0, "e": "Correct: A. Aspirin hits cyclooxygenase (less TXA2). Clopidogrel hits P2Y12. Abciximab targets GPIIb/IIIa and blocks aggregation, so iii) is false.\nB: This includes iii). Abciximab targets GPIIb/IIIa, not GPIb/IX.\nC: This includes iii) and drops iv).\nD: This leaves out iv), which is true.\nE: iii) is false, so not all statements hold.\nTakeaway: Three drugs, three targets: COX (aspirin), P2Y12 (clopidogrel), GPIIb/IIIa (abciximab).", "l": ["W10 1.4"]}, {"c": "Thrombocytopenia", "p": "Mia, 3, had bloody diarrhea for 4 days after a family barbecue. The diarrhea has settled, but she now looks pale and puffy and has passed very little urine for a day. She is not confused and has no rash.\n\nHb 74 g/L (ref 110-140)\nWBC 12.4 × 10⁹/L (ref 4-10)\nPlatelets 52 × 10⁹/L (ref 150-450)\nPT/INR normal\nFibrinogen normal\nCreatinine high\nADAMTS-13 normal\nFilm: schistocytes.\n\nWhat is the most likely diagnosis?", "o": ["Thrombotic thrombocytopenic purpura", "Acute lymphoblastic leukemia", "Immune thrombocytopenia", "Disseminated intravascular coagulation", "Hemolytic-uremic syndrome"], "a": 4, "e": "Correct: E. A young child with a diarrheal prodrome, then hemolytic anemia with schistocytes, low platelets, acute kidney injury and a normal ADAMTS-13 has HUS, most often from Shiga toxin from E. coli O157:H7.\nA: TTP has a low ADAMTS-13 and more neurological signs.\nB: ALL shows blasts and doesn't cause schistocytes.\nC: ITP has no hemolysis or kidney injury.\nD: DIC raises the INR and lowers fibrinogen.\nTakeaway: HUS: supportive care. Avoid antibiotics and platelet transfusions.", "l": ["W10 3.4", "W10 3.5"]}, {"c": "Coagulation tests", "p": "A man has a very long aPTT and a normal PT, but had a tonsillectomy and two dental extractions with no bleeding. Which deficiency best explains this?", "o": ["Factor VII deficiency affecting the extrinsic pathway", "A lupus anticoagulant directed against phospholipid-bound proteins", "Factor XII deficiency with no bleeding risk", "Mild hemophilia A from Factor VIII deficiency"], "a": 2, "e": "Correct: C. Correction on mixing means a factor deficiency. A long aPTT with a bleed-free surgical history points to a contact factor. Contact factors profoundly elevate the aPTT but do not cause bleeding.\nA: FVII deficiency prolongs the PT, not the aPTT.\nB: An inhibitor such as a lupus anticoagulant does not correct on mixing.\nD: FVIII deficiency also corrects on mixing, but tonsillectomy and extractions without bleeding argue against it.\nTakeaway: Mixing: corrects = deficiency, no correction = inhibitor.", "l": ["W10 4.2.3"]}, {"c": "Hemostasis and platelets", "p": "Which pairing of a natural regulator of hemostasis with its target is correct?", "o": ["Plasminogen activator inhibitor-1: thrombin", "Antithrombin: the TF/VIIa complex only", "Tissue factor pathway inhibitor: Factors V and VIII", "Protein C and Protein S: Factors V and VIII"], "a": 3, "e": "Correct: D. Protein C and S block amplification by targeting FV and FVIII.\nA: PAI-1 inhibits t-PA and plasmin, a fibrinolysis regulator.\nB: Antithrombin binds IX, X and XI (and thrombin), blocking thrombin already generated.\nC: TFPI blocks initiation by targeting TF-VIIa and Xa.\nTakeaway: TFPI = initiation. Protein C/S = V and VIII. Antithrombin = thrombin, IX, X, XI.", "l": ["W10 2.1", "W10 2.2"]}, {"c": "Bleeding disorders", "p": "Sofia, 7, has had bleeding into her right ankle after a minor twist, nosebleeds needing packing, and prolonged bleeding after losing baby teeth. Both parents have mild nosebleeds. She is a girl, and no male relatives have hemophilia.\n\nHb 110 g/L (ref 110-140)\nPlatelets 280 × 10⁹/L (ref 150-450)\nPT/INR normal\naPTT prolonged\nvWF antigen nearly undetectable\nvWF activity nearly undetectable\nFVIII activity low\n\nWhat is the most likely diagnosis?", "o": ["Type 2 von Willebrand disease", "Factor XIII deficiency", "Type 1 von Willebrand disease", "Hemophilia A", "Type 3 von Willebrand disease"], "a": 4, "e": "Correct: E. Almost absent vWF with a low FVIII causes both mucosal and joint bleeding. That is type 3 VWD, the rare severe form, since vWF normally protects FVIII.\nA: Type 2 is qualitative, with vWF antigen present.\nB: FXIII deficiency has a normal aPTT.\nC: Type 1 is a partial deficiency with milder bleeding.\nD: Hemophilia A is X-linked and has normal vWF.\nTakeaway: vWF adheres platelets to collagen and carries FVIII.", "l": ["W10 11.1", "W10 1.3"]}];
const OBJECTIVES = {"W10 1.2": "List the physiologic steps and key regulators of primary hemostasis.", "W10 1.3": "List and describe the changes in the primary hemostatic system that may lead to hemorrhagic complications.", "W10 1.4": "Describe the physiological targets of antiplatelet agents.", "W10 2.1": "List the physiologic steps and key regulators of secondary hemostasis.", "W10 2.2": "List the physiologic steps and key regulators of tertiary hemostasis", "W10 3.1": "Define thrombocytopenia and list the most common causes of thrombocytopenia.", "W10 3.2": "Describe the clinical presentation of thrombocytopenia.", "W10 3.3": "Formulate an initial laboratory workup of a patient presenting with thrombocytopenia", "W10 3.4": "Compare and contrast: Immune Thrombocytopenic Purpura (ITP), Thrombotic Thrombocytopenia Purpura/Hemolytic Uremic Syndrome (TTP/HUS), Disseminated Intravascular Coagulopathy (DIC), Heparin Induced Thrombocytopenia (HIT).", "W10 3.5": "Develop a management plan to treat thrombocytopenia.", "W10 4.1": "List and interpret critical clinical findings, including results of an appropriate history and physical examination performed with a particular attention to differentiate between various disorders of hemostasis.", "W10 4.2.1": "Define the laboratory tests: INR, aPTT and Fibrinogen.", "W10 4.2.2": "List coagulation factors analyzed by the laboratory investigation of INR and aPTT.", "W10 4.2.3": "Discuss the differential diagnoses in adults with isolated or combined abnormalities of INR, aPTT and Fibrinogen.", "W10 5.1": "List the differential diagnoses for pediatric patient with bleeding tendency.", "W10 5.3": "Compare and contrast the symptoms and signs of the differential diagnoses for pediatric patient with bleeding tendency.", "W10 5.4": "List therapeutic options, including blood components, required in the management of pediatric patients with bleeding disorders.", "W10 6.1": "List clinical risk factors for venous thrombosis.", "W10 6.2": "Describe ways to prevent venous thrombosis.", "W10 7.1": "List and describe the mechanism of actions for the different anticoagulants available.", "W10 7.2": "List possible common side effects and complications of anticoagulants.", "W10 7.3": "Describe approach to managing bleeding complications including possible antidotes to various anticoagulant medications.", "W10 8.3": "Recognize the special consideration including patient with renal impairment, pregnancy, post operative setting, in under- and over-weight populations", "W10 9.3": "Describe the elements of informed consent.", "W10 9.4": "List the indications for red cell, platelet and plasma transfusions.", "W10 9.6": "Describe the contents and storage of blood and blood products.", "W10 10.1": "List precautions that patients with bleeding disorder have to take in daily activities.", "W10 11.1": "List possible genetic disorders of primary hemostasis.", "W10 11.2": "List possible genetic disorders of secondary hemostasis."};
const L = "ABCDE";
const N = QUESTIONS.length;
let cur = 0, showResults = false;
let ans = new Array(N).fill(null);           // current pick per question
let tries = QUESTIONS.map(()=>[]);           // every locked attempt: {pick, ok, at}
let strikes = QUESTIONS.map(()=>[]);         // struck option indexes for the open attempt
let history = [], db = null, uid = null, writing = false, dirty = false;
const MAP=document.getElementById("map"); if(MAP && QUESTIONS.length<=60) MAP.open=true;
const LS_KEY = "differential-week-10-question-bank";
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");

function score(){ return ans.reduce((n,a,i)=>n+(a!==null&&a===QUESTIONS[i].a?1:0),0); }
function answered(){ return ans.filter(a=>a!==null).length; }
function firstTryScore(){ return tries.reduce((n,t)=>n+(t.length&&t[0].ok?1:0),0); }
function firstTryCount(){ return tries.filter(t=>t.length).length; }

function renderHeader(){
  const bf=$("#barfill"); if(bf) bf.style.width=(100*answered()/N)+"%";
  $("#stats").innerHTML = `<span>Question <b>${showResults?"–":cur+1}</b> of <b>${N}</b></span><span>Answered <b>${answered()}</b></span><span>Score <b>${score()} / ${answered()}</b></span>`;
  $("#ticks").innerHTML = QUESTIONS.map((q,i)=>{
    const st = ans[i]===null?"":(ans[i]===q.a?"ok":"bad");
    const redo = tries[i].length>1 || (ans[i]===null && tries[i].length>0);
    return `<button class="tick ${st} ${redo?"redo":""} ${(!showResults&&i===cur)?"cur":""}" data-i="${i}" aria-label="Question ${i+1}"></button>`;
  }).join("");
  document.querySelectorAll(".tick").forEach(b=>b.onclick=()=>{cur=+b.dataset.i;showResults=false;render();});
}

function triesLine(i, includeCurrent){
  const t = includeCurrent ? tries[i] : tries[i];
  if(!t.length) return "";
  const parts = t.map((x,k)=>`<span class="${x.ok?"ok":"bad"}">${k+1}: ${L[x.pick]} ${x.ok?"correct":"wrong"}</span>`).join(" · ");
  return `<div class="tries">Attempts ${parts}</div>`;
}

function fmtLine(t){
  let m;
  if((m=t.match(/^Correct:\s*([A-E])\.?\s*(.*)$/)) || (m=t.match(/^([A-E]) is correct\.?\s*(.*)$/)))
    return `<p class="why"><span class="lk ok">${m[1]}</span><span>${esc(m[2])}</span></p>`;
  if((m=t.match(/^([A-E]):\s*(.*)$/)))
    return `<p class="alt"><span class="lk">${m[1]}</span><span>${esc(m[2])}</span></p>`;
  if((m=t.match(/^(Takeaway|High yield|High-yield|Key point|Clues):\s*(.*)$/i)))
    return `<p class="take"><b>${esc(m[1])}.</b> ${esc(m[2])}</p>`;
  return `<p>${esc(t)}</p>`;
}

function renderQ(){
  const q = QUESTIONS[cur], a = ans[cur], done = a!==null, st = strikes[cur];
  const opts = q.o.map((o,i)=>{
    let c = "";
    if(done){ if(i===q.a) c="right"; else if(i===a) c="wrong"; }
    const struck = !done && st.includes(i);
    const strikeBtn = done ? "" : `<button class="strike" data-s="${i}" aria-pressed="${struck}" aria-label="${struck?"Restore":"Strike out"} option ${L[i]}" title="${struck?"Restore":"Strike out"} option">${struck?"↺":"✕"}</button>`;
    return `<div class="optrow ${struck?"struck":""}"><button class="opt ${c}" data-i="${i}" ${done?"disabled":""}><span class="k">${L[i]}</span><span>${esc(o)}</span></button>${strikeBtn}</div>`;
  }).join("");
  let fb = "";
  if(done){
    const ok = a===q.a;
    const lines = q.e.split("\n").map(fmtLine).join("");
    const objs = q.l.map(id=>`<div class="obj"><b>Objective ${esc(id)}</b> ${esc(OBJECTIVES[id]||"")}</div>`).join("");
    fb = `<div class="fb" role="status"><div class="verdict ${ok?"ok":"bad"}">${ok?"Correct.":"Incorrect. The answer is "+L[q.a]+"."}</div>${lines}${objs}${triesLine(cur)}<div class="fbtools"><button class="btn ghost" id="redo">Reset and redo this question</button></div></div>`;
  }
  const pre = (!done && tries[cur].length) ? `<div class="hint">Redo. Your earlier attempts are saved.</div>${triesLine(cur)}` : (!done ? `<div class="hint">Tap ✕ to strike out an option. Right-click works too.</div>` : "");
  const last = cur===N-1;
  $("#main").innerHTML = `<article class="card">
    <div class="chead"><span class="tag">${esc(q.c)}</span><span class="chead-r">${ankiButton(cur)}<span class="qn">${cur+1} of ${N}</span></span></div>
    <p class="stem">${esc(q.p)}</p>
    ${pre}
    <div class="opts">${opts}</div>
    <div class="offrow">${offButton(cur)}</div>${fb}
    <div class="nav"><button class="btn ghost" id="prev" ${cur===0?"disabled":""}>Previous</button>
    <button class="btn" id="next" ${done?"":"disabled"}>${last?"See results":"Next"}</button></div>
  </article>`;
  document.querySelectorAll(".opt").forEach(b=>{
    b.onclick=()=>{ const p=+b.dataset.i; ans[cur]=p; tries[cur].push({pick:p, ok:p===q.a, at:new Date().toISOString()}); tries[cur]=tries[cur].slice(-10); strikes[cur]=[]; render(false); persist(); };
    b.oncontextmenu=(e)=>{ if(done) return; e.preventDefault(); toggleStrike(+b.dataset.i); };
  });
  document.querySelectorAll(".strike").forEach(b=>b.onclick=()=>toggleStrike(+b.dataset.s));
  const ab=$("#anki"); if(ab) ab.onclick=()=>ankiToggle(cur);
  const ob=$("#off"); if(ob) ob.onclick=()=>offToggle(cur);
  const r=$("#redo"); if(r) r.onclick=()=>{ ans[cur]=null; strikes[cur]=[]; render(false); persist(); };
  $("#prev").onclick=()=>{cur--;render();};
  $("#next").onclick=()=>{ if(last){showResults=true;} else cur++; render(); };
}

function toggleStrike(i){
  const s = strikes[cur], k = s.indexOf(i);
  if(k<0) s.push(i); else s.splice(k,1);
  render(false); persist();
}

function renderResults(){
  const s = score(), pct = Math.round(100*s/N);
  const cats = {};
  QUESTIONS.forEach((q,i)=>{ cats[q.c]=cats[q.c]||[0,0]; cats[q.c][1]++; if(ans[i]===q.a) cats[q.c][0]++; });
  const rows = Object.entries(cats).map(([c,[r,t]])=>`<tr><td>${esc(c)}<span class="meter"><i style="width:${Math.round(100*r/t)}%"></i></span></td><td>${r} / ${t}</td></tr>`).join("");
  const missed = {};
  QUESTIONS.forEach((q,i)=>{ const wrongFirst = tries[i].length && !tries[i][0].ok; if(ans[i]!==q.a || wrongFirst) q.l.forEach(id=>{ const w=id.split(" ")[0]; missed[w]=missed[w]||new Set(); missed[w].add(id); }); });
  const weeks = Object.keys(missed).sort((x,y)=>parseInt(x.slice(1))-parseInt(y.slice(1)));
  const missHtml = weeks.length ? weeks.map(w=>`<h3>Week ${w.slice(1)}</h3><ul class="miss">${[...missed[w]].map(id=>`<li><code>${esc(id)}</code>${esc(OBJECTIVES[id]||"")}</li>`).join("")}</ul>`).join("") : "<p>No missed objectives.</p>";
  const redone = tries.filter(t=>t.length>1).length;
  const un = N - answered();
  $("#main").innerHTML = `<article class="card">
    <div class="chead"><span class="tag">Results</span><span>${un?un+" unanswered":"Complete"}</span></div>
    <div><div class="big">${s} / ${N}</div><div class="stats"><span><b>${pct}%</b> correct now</span><span>First try <b>${firstTryScore()} / ${firstTryCount()}</b></span><span>Redone <b>${redone}</b></span></div></div>
    <table><thead><tr><th>Topic</th><th>Score</th></tr></thead><tbody>${rows}</tbody></table>
    ${ankiMissedRow()}<h2>Objectives to review</h2><p class="hint">Includes questions you missed on the first try, even if a redo got them right.</p>${missHtml}${history.length?`<h2>Past attempts</h2><table><thead><tr><th>Date</th><th>Score</th></tr></thead><tbody>${history.slice().reverse().map(h=>`<tr><td>${new Date(h.date).toLocaleDateString()}</td><td>${h.score} / ${h.total}</td></tr>`).join("")}</tbody></table>`:""}
    <div class="nav"><button class="btn ghost" id="back">Back to questions</button><button class="btn" id="restart">Restart all</button></div>
  </article>`;
  $("#back").onclick=()=>{showResults=false;render();};
  const am=$("#ankimissed"); if(am) am.onclick=()=>{ ankiAdd(missedIdx()); renderResults(); };
  $("#restart").onclick=resetAll;
}
/* Clear every answer, redo and strike-out. The attempt is kept in Past attempts. Flags are not touched. */
function resetAll(){
  if(answered() || tries.some(t=>t.length)){
    history.push({date:new Date().toISOString(), score:score(), answered:answered(), total:N, firstTry:firstTryScore(),
      missed:QUESTIONS.map((q,i)=>ans[i]!==null&&ans[i]!==q.a?"q"+(i+1):null).filter(Boolean)});
    history=history.slice(-20);
  }
  ans.fill(null); tries=QUESTIONS.map(()=>[]); strikes=QUESTIONS.map(()=>[]); cur=0; showResults=false; render(); persist();
}
/* Header button: first tap arms it, second tap within 4 seconds resets. No browser dialog. */
(function(){
  const b=document.getElementById("resetall"); let timer=null;
  const disarm=()=>{ b.classList.remove("armed"); b.textContent="Reset all answers"; clearTimeout(timer); timer=null; };
  b.onclick=()=>{
    if(!b.classList.contains("armed")){ b.classList.add("armed"); b.textContent="Tap again to reset"; timer=setTimeout(disarm,4000); return; }
    disarm(); resetAll(); setSave("All answers cleared. Your score is saved in Past attempts.","ok");
  };
})();

function setSave(text, cls){ const el=$("#save"); if(el){ el.textContent=text; el.className="save "+(cls||""); } }
function bodyOf(){
  const a = {};
  QUESTIONS.forEach((q,i)=>{
    if(ans[i]===null && !tries[i].length && !strikes[i].length) return;
    a["q"+(i+1)] = {pick:ans[i], ok:ans[i]!==null && ans[i]===q.a, l:q.l, tries:tries[i], strikes:strikes[i]};
  });
  return {answers:a, history, total:N, answered:answered(), score:score(), firstTry:firstTryScore(), updatedAt:new Date().toISOString()};
}
function validPick(i,p){ return Number.isInteger(p) && p>=0 && p<QUESTIONS[i].o.length; }
function applySaved(d){
  if(!d || typeof d!=="object") return;
  ans.fill(null); tries=QUESTIONS.map(()=>[]); strikes=QUESTIONS.map(()=>[]);
  const a = d.answers || {};
  for(const k in a){
    const i = parseInt(k.slice(1),10)-1, row = a[k];
    if(!(i>=0 && i<N) || !row || typeof row!=="object") continue;
    if(validPick(i,row.pick)) ans[i]=row.pick;
    if(Array.isArray(row.tries)) tries[i]=row.tries.filter(t=>t&&validPick(i,t.pick)).map(t=>({pick:t.pick, ok:t.pick===QUESTIONS[i].a, at:String(t.at||"")})).slice(-10);
    else if(ans[i]!==null) tries[i]=[{pick:ans[i], ok:ans[i]===QUESTIONS[i].a, at:""}];
    if(Array.isArray(row.strikes)) strikes[i]=row.strikes.filter(x=>validPick(i,x));
  }
  history = Array.isArray(d.history) ? d.history.slice(-20) : [];
  const first = ans.findIndex(x=>x===null); cur = first<0 ? N-1 : first;
}
function lsLoad(){ try{ return JSON.parse(localStorage.getItem(LS_KEY)||"null"); }catch(e){ return null; } }
function lsSave(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(bodyOf())); }catch(e){} }
async function persist(){
  lsSave();
  if(!db || !uid) return;
  dirty = true; if(writing) return; writing = true;
  while(dirty){
    dirty = false;
    setSave("Saving…");
    try{ await db.doc("attempts/"+uid).set(bodyOf()); setSave("Progress saved to your account.","ok"); }
    catch(e){
      if(e && e.code==="invalid_argument"){ db=null; setSave("Progress saves in this browser only.","bad"); break; }
      setSave("Could not save to your account. Progress saves in this browser.","bad");
    }
  }
  writing = false;
}
async function connect(){
  try{
    if(!window.claude || !window.claude.use) return;
    const [u, d] = await Promise.all([window.claude.use("user"), window.claude.use("db")]);
    if(!u || !d) return;
    const id = await u.id(); if(!id) return;
    db = d; uid = id;
    const snap = await db.doc("attempts/"+uid).get();
    if(snap.exists){ applySaved(snap.data()); render(); setSave("Progress saved to your account.","ok"); }
    else if(answered() || tries.some(t=>t.length)){ persist(); }
    else setSave("Progress saves to your account.","ok");
  }catch(e){ /* keep local-only mode */ }
}

/* Flagged: flagged questions live in one shared list ("differential-anki", the key predates the rename)
   that the Flagged tab reads. Each card keeps a copy of its question, so the tab works without loading every quiz. */
const SET = {"slug": "week-10-question-bank", "title": "Week 10 Question Bank", "b": 3, "href": "fom/block-3/question-bank/week-10-question-bank"};
const ANKI_KEY = "differential-anki";
function ankiAll(){ try{ const d=JSON.parse(localStorage.getItem(ANKI_KEY)||"null"); return d && Array.isArray(d.cards) ? d.cards : []; }catch(e){ return []; } }
function ankiPut(cards){ try{ localStorage.setItem(ANKI_KEY, JSON.stringify({v:1, cards})); return true; }catch(e){ setSave("Could not flag. Browser storage is full or blocked.","bad"); return false; } }
function ankiId(i){ return SET.slug+"#"+(i+1); }
function ankiCard(i){
  const q=QUESTIONS[i];
  return {id:ankiId(i), slug:SET.slug, set:SET.title, b:SET.b, href:SET.href, n:i+1, c:q.c, p:q.p, o:q.o, a:q.a, e:q.e, l:q.l, obj:q.l.map(x=>OBJECTIVES[x]||"")};
}
function ankiHas(i, cards){ return (cards||ankiAll()).some(c=>c.id===ankiId(i)); }
function ankiButton(i){ const s=ankiHas(i); return `<button class="ankibtn" id="anki" aria-pressed="${s}" title="${s?"Remove the flag":"Flag this question for review"}">${s?"Flagged":"Flag"}</button>`; }
function ankiToggle(i){
  let cards=ankiAll();
  if(ankiHas(i,cards)) cards=cards.filter(c=>c.id!==ankiId(i));
  else cards.push(Object.assign(ankiCard(i), {at:new Date().toISOString()}));
  ankiPut(cards); render(false);
}
function ankiAdd(list){
  const cards=ankiAll(), have=new Set(cards.map(c=>c.id)), at=new Date().toISOString();
  list.forEach(i=>{ if(!have.has(ankiId(i))) cards.push(Object.assign(ankiCard(i), {at})); });
  ankiPut(cards);
}
function missedIdx(){ return QUESTIONS.map((q,i)=>((ans[i]!==null && ans[i]!==q.a) || (tries[i].length && !tries[i][0].ok)) ? i : -1).filter(i=>i>=0); }
function ankiMissedRow(){
  const m=missedIdx(); if(!m.length) return "";
  const cards=ankiAll(), left=m.filter(i=>!ankiHas(i,cards)).length;
  return `<div class="ankirow">${left ? `<button class="btn ghost" id="ankimissed">Flag ${left} missed question${left===1?"":"s"} for review</button>` : `<span class="hint">All ${m.length} missed questions are flagged.</span>`}</div>`;
}
/* Keep saved copies current when a question is corrected, without touching review progress. */
function ankiRefresh(){
  const cards=ankiAll(); let changed=false;
  cards.forEach(c=>{
    if(c.slug!==SET.slug) return;
    const i=c.n-1; if(!(i>=0 && i<N)) return;
    const fresh=ankiCard(i);
    for(const k of ["set","b","href","c","p","o","a","e","l","obj"]) if(JSON.stringify(c[k])!==JSON.stringify(fresh[k])){ c[k]=fresh[k]; changed=true; }
  });
  if(changed) ankiPut(cards);
}
addEventListener("storage", e=>{ if(e.key===ANKI_KEY || e.key===OFF_KEY) render(false); });

/* Not in course content: questions you report land in "differential-offcontent".
   The Flagged tab lists them with a Copy list button, so they can be sent in for removal. */
const OFF_KEY = "differential-offcontent";
function offAll(){ try{ const d=JSON.parse(localStorage.getItem(OFF_KEY)||"null"); return d && Array.isArray(d.items) ? d.items : []; }catch(e){ return []; } }
function offHas(i){ return offAll().some(x=>x.id===ankiId(i)); }
function offButton(i){ const s=offHas(i); return `<button class="offbtn" id="off" aria-pressed="${s}">${s?"Reported as not in course content. Undo":"Not in course content?"}</button>`; }
function offToggle(i){
  let items=offAll();
  if(offHas(i)) items=items.filter(x=>x.id!==ankiId(i));
  else { const q=QUESTIONS[i]; items.push({id:ankiId(i), slug:SET.slug, set:SET.title, b:SET.b, href:SET.href, n:i+1, c:q.c, p:q.p, key:q.o[q.a], at:new Date().toISOString()}); }
  try{ localStorage.setItem(OFF_KEY, JSON.stringify({v:1, items})); }catch(e){ setSave("Could not save the report. Browser storage is full or blocked.","bad"); }
  render(false);
}

function render(top=true){ renderHeader(); showResults?renderResults():renderQ(); if(top) window.scrollTo({top:0}); }
applySaved(lsLoad());
ankiRefresh();
render();
connect();
</script>
