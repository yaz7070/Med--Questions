<script>
const QUESTIONS = [{"c": "Bleeding disorders", "p": "Aisha, 16, has had heavy periods since menarche, soaking a pad every 1 to 2 hours, and nosebleeds that last over 30 minutes. Her father bruises easily and once needed a transfusion after a tooth extraction. Her maternal uncle has hemophilia A. She takes ibuprofen for cramps. She had a viral illness 2 weeks ago. She plays competitive volleyball and often has bruises on her forearms.\n\nShe has had no joint swelling or muscle bleeds. She eats a varied diet and takes no other drugs. She is doing well at school but misses days during her periods.\n\nReview of systems: no fevers, weight loss, rash or blood in urine or stool. No headaches or vision changes.\n\nVitals: HR 98, BP 106/64.\nExam: Pale. Bruises on both forearms. No joint swelling. No hepatosplenomegaly.\n\nHb 104 g/L (ref 115-160)\nPlatelets 230 × 10⁹/L (ref 150-450)\nPT/INR normal\naPTT mildly prolonged\nvWF antigen 0.6 IU/mL\nvWF activity 0.2 IU/mL\nFVIII activity mildly low\n\nWhat is the most likely diagnosis?", "o": ["Glanzmann thrombasthenia", "Type 2 von Willebrand disease", "Type 3 von Willebrand disease", "Type 1 von Willebrand disease", "Hemophilia A"], "a": 1, "e": "Correct: B. vWF activity is a third of the antigen, well under 70%, so the vWF that is present doesn't work. That is a qualitative defect, type 2 VWD.\nA: Glanzmann thrombasthenia has normal vWF.\nC: Type 3 has almost no vWF at all.\nD: Type 1 lowers antigen and activity in proportion.\nE: Hemophilia A is X-linked and causes joint and muscle bleeds.\nRed herring: Her maternal uncle tempts hemophilia A, but she has mucosal bleeding, not joint bleeds, and her father is affected too. The ibuprofen and viral illness tempt a platelet problem, but her count is normal. vWF activity is a third of antigen, under 70%: type 2 VWD.\nTakeaway: Type 2 has 4 subtypes: 2A, 2B, 2M and 2N.", "l": ["W10 11.1", "W10 4.2.3"]}, {"c": "Thrombocytopenia", "p": "Tanya, 34, has newly diagnosed immune thrombocytopenia with a platelet count of 8 × 10⁹/L and gum bleeding. Her friend had TTP last year and was treated with daily plasma exchange, and Tanya asks whether she needs the same. Her doctor lists the options for ITP.\n\nWhich of the following is NOT part of ITP management?", "o": ["Rituximab", "Thrombopoietin mimetics such as romiplostim", "Plasma exchange to replace ADAMTS-13", "Glucocorticoids such as prednisone or dexamethasone"], "a": 2, "e": "Correct: C. Plasma exchange to replace ADAMTS-13 treats TTP.\nA: Rituximab is an ITP treatment (and also used in TTP).\nB: TPO mimetics (romiplostim, eltrombopag) are an ITP treatment.\nD: Glucocorticoids are an ITP treatment.\nRed herring: Her friend's TTP tempts you to borrow its treatment. Plasma exchange replaces ADAMTS-13 in TTP and is not an ITP treatment. Rituximab is used in both.\nTakeaway: ITP: steroids, IVIg, splenectomy, rituximab, TPO mimetics, immune suppression.", "l": ["W10 3.5"]}, {"c": "Bleeding disorders", "p": "Two patients present on the same day.\n\nPatient 1, a 25-year-old woman, has recurrent nosebleeds, heavy periods and easy bruising. She once had a swollen ankle after a bad sprain.\n\nPatient 2, a 30-year-old man, has spontaneous swelling of the knee and a large thigh hematoma. He also gets the odd nosebleed in winter.\n\nWhich category of defect does each pattern suggest, in order?", "o": ["Secondary hemostasis, then primary hemostasis", "Hyperfibrinolysis, then primary hemostasis", "Primary hemostasis for both", "Primary hemostasis, then secondary hemostasis"], "a": 3, "e": "Correct: D. Mucocutaneous bleeding suggests platelets or vWF. Deep bleeding into joints and muscles suggests coagulation factor deficiency.\nA: This reverses the patterns.\nB: Hyperfibrinolysis is not suggested, and joints point to factors.\nC: Joint and muscle bleeds point to coagulation factors.\nRed herring: Each patient has one feature from the other pattern: a sprain-related ankle swelling and a winter nosebleed. Judge by the dominant pattern: mucocutaneous bleeding is primary, deep spontaneous bleeding is secondary.\nTakeaway: Primary = mucocutaneous, often immediate. Secondary = deep, less immediate.", "l": ["W10 4.1", "W10 5.3"]}, {"c": "Bleeding disorders", "p": "A 6-day-old boy oozes from his umbilical stump. He received vitamin K at birth. His mother took an anticonvulsant during pregnancy. His maternal uncle has hemophilia A. Platelets, PT, aPTT and fibrinogen are all normal.\n\nWhich deficiency is most likely?", "o": ["Factor XIII deficiency", "Factor VII deficiency", "Hemophilia A", "Vitamin K deficiency bleeding"], "a": 0, "e": "Correct: A. FXIII cross-links fibrin after the clot forms, so PT and aPTT stay normal. Neonatal umbilical bleeding and ICH are classic FXIII presentations.\nB: FVII deficiency gives an isolated prolonged PT.\nC: Hemophilia A prolongs the aPTT.\nD: He received vitamin K, and deficiency prolongs the PT.\nRed herring: The maternal anticonvulsant tempts vitamin K deficiency bleeding, but he got vitamin K and his PT is normal. The uncle tempts hemophilia A, but his aPTT is normal. Bleeding with all normal tests points to FXIII deficiency.\nTakeaway: Bleeding with normal INR and PTT: remember FXIII deficiency.", "l": ["W10 4.2.3", "W10 11.2"]}, {"c": "Coagulation tests", "p": "Three people complete standardized bleeding assessment tools at a family screening clinic.\n\nPatient 1, a woman of 30 with heavy periods, scores 5 on the ISTH BAT.\nPatient 2, her brother of 30, also scores 5 on the ISTH BAT.\nPatient 3, her son of 9, scores 3 on the PBQ.\n\nThe woman is the most worried, because her periods are the most troublesome.\n\nHow should each score be interpreted, in order?", "o": ["Abnormal, abnormal, positive", "Abnormal, normal, negative", "Normal, abnormal, positive", "Normal, normal, negative"], "a": 2, "e": "Correct: C. ISTH BAT normal cut-offs are under 4 in adult males and under 6 in adult females. PBQ is positive above 2.\nA: The woman's 5 is under 6, so it is normal.\nB: This reverses the sex-specific cut-offs, and PBQ 3 is positive.\nD: The man's 5 is above his cut-off, and a PBQ of 3 is positive.\nRed herring: The woman's heavy periods tempt you to call her score abnormal. Cut-offs differ by sex: under 6 is normal for adult women, under 4 for adult men. A PBQ above 2 is positive.\nTakeaway: A normal BAT has a high negative predictive value for a mild bleeding disorder.", "l": ["W10 4.1"]}, {"c": "Hemostasis and platelets", "p": "A student is reviewing how clots are broken down. She recalls that thrombin, t-PA, plasmin, PAI-1 and TAFI are all involved, and that D-dimers rise in DIC and after a PE.\n\nWhich statement about fibrinolysis (tertiary hemostasis) is correct?", "o": ["t-PA converts fibrinogen into fibrin monomers", "D-dimers form when thrombin cleaves soluble fibrin", "PAI-1 activates t-PA to speed clot breakdown", "TAFI inhibits plasmin formation and suppresses fibrinolysis"], "a": 3, "e": "Correct: D. TAFI (thrombin activatable fibrinolysis inhibitor) inhibits formation of plasmin.\nA: Thrombin, not t-PA, converts fibrinogen to fibrin. t-PA converts plasminogen to plasmin.\nB: D-dimers come from plasmin acting on cross-linked fibrin.\nC: PAI-1 inhibits t-PA. It slows breakdown.\nRed herring: Thrombin and t-PA are both enzymes that act on fibrin-related proteins, which makes them easy to swap. t-PA makes plasmin. Plasmin makes D-dimers. TAFI and PAI-1 put on the brakes.\nTakeaway: t-PA makes plasmin. Plasmin makes D-dimers. TAFI, PAI-1 and antiplasmin apply the brakes.", "l": ["W10 2.2"]}, {"c": "Thrombocytopenia", "p": "Jordan, 40, had a CBC for a work medical. He feels well and has never had bruising, nosebleeds or bleeding after dental work or a past appendectomy. He takes ibuprofen occasionally for back pain. His sister has ITP. He had a cold last week. He drinks 2 beers a week and runs half marathons.\n\nHe has had no fevers, weight loss or night sweats. His last CBC, done at a different lab 4 years ago, was normal.\n\nReview of systems: no fatigue, gum bleeding, blood in urine or dark stools. He has never needed a transfusion. He works as a software developer and does not smoke.\n\nVitals: HR 58, BP 118/74.\nExam: Normal. No petechiae, bruises or splenomegaly.\n\nHb 148 g/L (ref 135-170)\nWBC 6.9 × 10⁹/L (ref 4-10)\nPlatelets 35 × 10⁹/L (ref 150-450)\nPT/INR normal\naPTT normal\nSample: lavender top tube\nFilm: large platelet clumps.\n\nWhat is the most likely diagnosis?", "o": ["Bernard Soulier syndrome", "Thrombotic thrombocytopenic purpura", "Immune thrombocytopenia", "Splenic sequestration", "EDTA-dependent pseudothrombocytopenia"], "a": 4, "e": "Correct: E. No bleeding ever, a normal exam, an EDTA tube and platelet clumps on the film fit pseudothrombocytopenia. Antibodies bind platelets in EDTA, and the counter misses the clumps.\nA: Bernard Soulier causes bleeding.\nB: TTP brings hemolysis and a sick patient.\nC: ITP is a diagnosis of exclusion and shows no clumps.\nD: Sequestration needs a large spleen.\nRed herring: His sister's ITP, the recent cold and ibuprofen all point toward ITP. No bleeding ever, an EDTA tube and platelet clumps mean pseudothrombocytopenia. Repeat in a citrate tube.\nTakeaway: Repeat the count in a sodium citrate tube.", "l": ["W10 3.3", "W10 3.1"]}, {"c": "Thrombocytopenia", "p": "Ethan, 4, has new petechiae on his legs and two nosebleeds. Two weeks ago he had a cold. He is playing happily. His grandfather was recently diagnosed with leukemia. He fell off his bike last week and has bruises on his shins. He had MMR vaccine 3 weeks ago.\n\nHe has had no fever, bone pain, weight loss or bloody diarrhea. He is eating well. He goes to daycare, where a few children have had colds.\n\nReview of systems: no limp, joint swelling, night sweats or pallor. He is toilet trained with normal urine. His parents and older sister are well. He takes no medications or supplements.\n\nVitals: HR 104, T 36.8°C.\nExam: Scattered petechiae and bruises. No enlarged nodes, liver or spleen. No bone tenderness.\n\nHb 124 g/L (ref 110-140)\nWBC 7.6 × 10⁹/L (ref 4-10)\nNeutrophils and lymphocytes normal\nPlatelets 8 × 10⁹/L (ref 150-450)\nPT/INR normal\naPTT normal\nFilm: a few large platelets. No blasts, no schistocytes, no clumps.\n\nWhat is the most likely diagnosis?", "o": ["Hemolytic-uremic syndrome", "EDTA-dependent pseudothrombocytopenia", "Acute lymphoblastic leukemia", "Thrombotic thrombocytopenic purpura", "Immune thrombocytopenia"], "a": 4, "e": "Correct: E. A well child with isolated severe thrombocytopenia after a viral illness, other cell lines normal and a clean film fits ITP, a diagnosis of exclusion. Half of cases are children, and these resolve within 6 months.\nA: HUS follows bloody diarrhea, with hemolysis and kidney injury.\nB: Pseudothrombocytopenia shows clumps and causes no bleeding.\nC: ALL lowers other cell lines and shows blasts.\nD: TTP brings hemolytic anemia, schistocytes and neurological signs.\nRed herring: His grandfather's leukemia tempts ALL, but his other cell lines are normal and there are no blasts. The bike fall explains some bruises but not petechiae with a count of 8. A well child after a virus with isolated low platelets has ITP.\nTakeaway: ITP: antibodies coat platelets, and splenic macrophages consume them.", "l": ["W10 3.4", "W10 3.2"]}, {"c": "Thrombocytopenia", "p": "Kofi, 50, is in the ICU with septic shock from pneumonia. Over 12 hours he has started oozing from IV sites and his central line, with new bruises. His lines are flushed with saline only. He drinks heavily. He has received 3 units of red cells. His wife says he had no bleeding problems before.\n\nHe is on norepinephrine and broad-spectrum antibiotics. His urine output has fallen.\n\nHis medications on admission were metformin and lisinopril. He has no known liver disease, and his last liver tests a year ago were normal. He smokes a pack a day.\n\nVitals: HR 122, BP 84/48 on norepinephrine, T 39.1°C.\nExam: Oozing from line sites. Purpura on his arms. Mild jaundice.\n\nHb 85 g/L (ref 135-170)\nWBC 22 × 10⁹/L (ref 4-10)\nPlatelets 40 × 10⁹/L (ref 150-450)\nPT/INR 2.0\naPTT prolonged\nFibrinogen 0.8 g/L\nD-dimer very high\nFilm: schistocytes.\n\nWhat is the most likely diagnosis?", "o": ["Disseminated intravascular coagulation", "Thrombotic thrombocytopenic purpura", "Vitamin K deficiency", "Heparin-induced thrombocytopenia", "Immune thrombocytopenia"], "a": 0, "e": "Correct: A. Sepsis with bleeding, platelets under 100, a high INR, fibrinogen under 1 g/L, a high D-dimer and schistocytes fit DIC. Overactive clotting consumes factors and platelets.\nB: TTP has a normal INR and fibrinogen.\nC: Vitamin K deficiency leaves platelets and fibrinogen normal.\nD: HIT needs heparin and causes clots, not oozing.\nE: ITP has normal clotting tests.\nRed herring: Heavy drinking and jaundice tempt liver disease, and the transfusions tempt dilution. Neither explains schistocytes with a fibrinogen under 1 g/L and a very high D-dimer. Sepsis with consumption means DIC.\nTakeaway: DIC: cryoprecipitate if fibrinogen is under 1.0 g/L, platelets if under 50, plasma if INR over 1.5.", "l": ["W10 3.5", "W10 4.2.3"]}, {"c": "Transfusion", "p": "Four patients have anemia on the medical ward. The resident must decide who should get a red cell transfusion today.\n\nWhich patient best meets an indication for red cell transfusion?", "o": ["Hb 78 g/L, age 25, no symptoms or cardiac history", "Hb 85 g/L, age 70, coronary disease, chest pain", "Hb 95 g/L in a 50 year old before elective surgery", "Hb 72 g/L, age 40, refuses blood products"], "a": 1, "e": "Correct: B. Hb 70 to 90 g/L with risk of cardiac ischemia is an indication.\nA: Without symptoms or cardiac risk, the threshold is under 70.\nC: 95 is above the listed thresholds.\nD: Patient refusal is a contraindication. Consider EPO, iron, B12 and folate.\nRed herring: The 40-year-old has the lowest Hb, which tempts you to pick her, but she refuses blood products. Hb 70 to 90 with risk of cardiac ischemia is an indication.\nTakeaway: 1 unit RBC raises Hb by about 10 g/L.", "l": ["W10 9.4"]}, {"c": "Transfusion", "p": "Four patients have low platelet counts, and the blood bank asks which order to fill first. The patient with TTP has the lowest count and looks the most unwell.\n\nWhich patient meets an indication for platelet transfusion?", "o": ["A patient with TTP, platelets 15 x 10^9/L and no bleeding", "A patient with HIT and platelets 40 x 10^9/L", "A stable outpatient with platelets 25 x 10^9/L and no bleeding", "A patient with platelets 80 x 10^9/L going for neurosurgery"], "a": 3, "e": "Correct: D. Neurosurgery needs platelets above 100 x 10^9/L.\nA: TTP is a contraindication because it fuels further thrombosis.\nB: HIT is a contraindication.\nC: Prophylactic transfusion without bleeding or a procedure targets under 10.\nRed herring: The TTP patient has the lowest count, which tempts you to give platelets. Platelet transfusion is avoided in TTP and HIT. Neurosurgery needs a count above 100.\nTakeaway: Platelet thresholds: under 10, under 50 for invasive surgery, under 100 for neurosurgery.", "l": ["W10 9.4", "W10 3.5"]}, {"c": "VTE", "p": "George, 81, had hip fracture surgery yesterday. He had a DVT 5 years ago after a long flight, treated for 3 months. He has no cancer. His daughter asks whether he will now need \"blood thinners for life\". He is walking with a frame today.\n\nHow long should his thromboprophylaxis last at minimum?", "o": ["Lifelong", "7 to 10 days", "4 to 6 weeks", "Until discharge only"], "a": 2, "e": "Correct: C. Hip fracture is the highest VTE risk. Prophylaxis runs at least 7 to 10 days, extended to 4 to 6 weeks with cancer or past VTE.\nA: Prophylaxis is time limited.\nB: 7 to 10 days applies without cancer or prior VTE.\nD: Prophylaxis continues while he is not ambulatory and beyond discharge.\nRed herring: His past DVT and his daughter's question tempt lifelong treatment. This is prophylaxis after hip fracture surgery, extended to 4 to 6 weeks because of his past VTE.\nTakeaway: Virchow's triad: stasis, injury, hypercoagulability.", "l": ["W10 6.1", "W10 6.2"]}, {"c": "Transfusion", "p": "A new blood bank technologist is learning how each product is stored. Red cells sit in a fridge, plasma and cryoprecipitate sit in a freezer, and one product sits on a gently rocking shelf at room temperature.\n\nWhich blood product is correctly paired with its storage?", "o": ["Plasma: 4 °C in the blood bank fridge, up to 1 year", "Platelets: 20 to 24 °C with mixing, up to 7 days", "Red cells: room temperature, up to 42 days", "Cryoprecipitate: room temperature, up to 5 years"], "a": 1, "e": "Correct: B. Platelets stay at room temperature with constant slow mixing to preserve function, up to 7 days.\nA: Plasma is frozen at -18 °C for up to 1 year.\nC: Red cells are refrigerated at 4 °C for up to 42 days.\nD: Cryo is frozen at -18 °C for up to 1 year.\nRed herring: The fridge and freezer products are easy to mix up. Platelets are the only product kept at room temperature, with constant slow mixing, for up to 7 days.\nTakeaway: Fibrinogen concentrate and PCCs are lyophilized with virus inactivation.", "l": ["W10 9.6"]}, {"c": "Thrombocytopenia", "p": "Hector, 61, has early satiety and fullness in his left upper abdomen. Ultrasound shows a spleen of 18 cm. His liver enzymes and liver function are normal. He drinks 3 beers a day. He had a cold 2 weeks ago. His brother has ITP. He has no bleeding.\n\nHe has had no fevers, weight loss or night sweats. He takes no regular medications.\n\nReview of systems: no bruising, nosebleeds, jaundice or itching. He works as an accountant and travelled to Mexico last winter. His father died of a stroke at 76.\n\nVitals: HR 76, BP 132/80.\nExam: Spleen palpable 6 cm below the costal margin. No jaundice, spider nevi or ascites.\n\nHb 118 g/L (ref 135-170)\nWBC 3.6 × 10⁹/L (ref 4-10)\nPlatelets 70 × 10⁹/L (ref 150-450)\nPT/INR normal\nReticulocytes normal\nFilm: no blasts, no schistocytes, no clumps.\nMarrow: normal cellularity with plenty of megakaryocytes.\n\nWhat is the most likely cause of his low platelets?", "o": ["Sequestration in the enlarged spleen", "Decreased marrow production", "Thrombotic thrombocytopenic purpura", "Immune thrombocytopenia", "EDTA-dependent pseudothrombocytopenia"], "a": 0, "e": "Correct: A. A large spleen with mild cytopenias, a normal marrow full of megakaryocytes and no sign of destruction points to sequestration.\nB: His marrow is normal and full of megakaryocytes.\nC: TTP shows schistocytes and hemolysis.\nD: ITP is a diagnosis of exclusion, and the large spleen explains the count.\nE: The film shows no clumps.\nRed herring: His brother's ITP and the recent cold tempt ITP, but ITP does not cause a large spleen or low WBC. Beer tempts liver disease, but his liver tests are normal. Mild cytopenias with a big spleen and a normal marrow mean sequestration.\nTakeaway: Low platelets: less production, more destruction, or sequestration.", "l": ["W10 3.1", "W10 3.3"]}, {"c": "Anticoagulants", "p": "Two patients arrive in the ED with bleeding on anticoagulants.\n\nPatient 1, 80, takes warfarin and has an intracranial hemorrhage. INR 3.4. She also takes aspirin.\n\nPatient 2, 72, takes dabigatran and has a major GI bleed. He had a dose 4 hours ago and has mild kidney impairment.\n\nWhich reversal plans fit, in order?", "o": ["Protamine sulphate, then idarucizumab", "Vitamin K IV plus PCC, then protamine sulphate", "Vitamin K IV plus PCC, then idarucizumab", "Idarucizumab, then vitamin K IV plus PCC"], "a": 2, "e": "Correct: C. Warfarin emergency reversal = vitamin K plus PCC (vitamin K prevents rebound coagulopathy once PCC wears off). Dabigatran's antidote is idarucizumab, a monoclonal antibody.\nA: Protamine reverses heparin, not warfarin.\nB: Protamine has no effect on dabigatran.\nD: This reverses the two antidotes.\nRed herring: Patient 1's aspirin and Patient 2's kidney impairment are true but do not change the antidote. Warfarin is reversed with vitamin K plus PCC. Dabigatran is reversed with idarucizumab.\nTakeaway: Andexanet alfa targets Xa inhibitors. Protamine targets UFH (partial for LMWH).", "l": ["W10 7.3"]}, {"c": "Anticoagulants", "p": "Elaine, 68, is on an IV UFH infusion at 1000 units per hour for a PE. The infusion has run steadily for 6 hours, and she received a 5000 unit bolus at the start. She now has major bleeding from a femoral line site.\n\nUsing the rule in your notes, what dose of protamine sulphate fits best?", "o": ["10 mg", "60 mg", "100 mg", "25 mg"], "a": 3, "e": "Correct: D. Protamine is 1 mg per 100 units of UFH given in the last 2 to 2.5 hours. 1000 U/h x 2.5 h = 2500 U, so 25 mg.\nA: 10 mg covers only 1 hour of infusion.\nB: 60 mg counts all 6 hours. UFH from earlier has already cleared (half-life 60 to 90 minutes).\nC: 100 mg is the maximum single dose. Too much causes hypotension and a weak anticoagulant effect.\nRed herring: The 6 hours and the starting bolus tempt you to add up all the heparin given. Only heparin given in the last 2 to 2.5 hours counts: 1000 U/h × 2.5 h = 2500 U, so 25 mg.\nTakeaway: Only recent heparin counts because of the short half-life.", "l": ["W10 7.3"]}, {"c": "Bleeding disorders", "p": "Lucas, 7, has severe hemophilia A. His parents are worried about his teeth after his cousin, who has no bleeding disorder, needed dental surgery. They ask the hemophilia nurse what precautions to take.\n\nWhich precaution is NOT recommended for a child with hemophilia?", "o": ["Skip routine dental visits", "Avoid antiplatelet agents such as aspirin", "Use prophylactic factor infusions at home", "Wear a helmet when riding a bicycle"], "a": 0, "e": "Correct: A. Routine dental care is recommended because it prevents the need for dental surgery.\nB: Avoiding aspirin is recommended.\nC: Home infusion prophylaxis is the norm in Canada for severe hemophilia.\nD: Protective gear is recommended.\nRed herring: Worry about bleeding tempts avoiding the dentist. Routine dental care is recommended because it prevents the need for dental surgery.\nTakeaway: Primary prophylaxis prevents joint bleeds and has improved life expectancy.", "l": ["W10 10.1"]}, {"c": "Anticoagulants", "p": "Rose, 76, has end-stage kidney disease on dialysis and needs anticoagulation for a new PE. She is also at risk of osteoporosis. Her team chooses an IV drug that is degraded in the liver and can be reversed with protamine.\n\nWhich of the following is NOT an adverse effect or limitation of unfractionated heparin?", "o": ["Osteoporosis", "Accumulation in renal failure", "Heparin-induced thrombocytopenia", "Unpredictable pharmacokinetics"], "a": 1, "e": "Correct: B. UFH is degraded by the RES in the liver and is safe in renal failure. LMWH is the one that accumulates.\nA: Osteoporosis is an adverse event of UFH.\nC: HIT is an adverse event of UFH, about 3 times more than with LMWH.\nD: UFH is heterogeneous with unpredictable pharmacokinetics.\nRed herring: Her kidney disease tempts you to call accumulation a UFH problem. UFH is cleared by the liver and is safe in renal failure. LMWH is the one that accumulates.\nTakeaway: LMWH vs UFH: less bleeding, less HIT, less osteoporosis, home treatment, but renal clearance.", "l": ["W10 7.2"]}, {"c": "Coagulation tests", "p": "A lab technologist runs a PT and an aPTT on the same citrated plasma sample from a patient on warfarin. The PT is long and the aPTT is mildly long. Both tests add calcium chloride and phospholipid.\n\nWhich reagent component is present in the PT test but absent from the aPTT test?", "o": ["Tissue factor (thromboplastin)", "Calcium chloride to reverse citrate", "Phospholipid from a platelet substitute", "A contact activator"], "a": 0, "e": "Correct: A. PT reagent contains thromboplastin (tissue factor), which drives the extrinsic pathway via FVII. The aPTT reagent has no tissue factor.\nB: Both tests add calcium chloride to overcome citrate.\nC: Both reagents contain phospholipid.\nD: The contact activator belongs to the aPTT, not the PT.\nRed herring: Warfarin prolonging both tests is a distractor. Calcium and phospholipid are in both reagents. Only the PT reagent contains tissue factor.\nTakeaway: PT = TF-driven (VII, then X, V, II, I). aPTT = contact-driven (XII, XI, IX, VIII, then common).", "l": ["W10 4.2.1", "W10 4.2.2"]}, {"c": "Coagulation tests", "p": "Margaret, 78, has 3 weeks of large spontaneous bruises on her arms and thighs and a bleed into her forearm muscle. She never bled with past surgeries or childbirth. She takes aspirin 81 mg daily and a fish oil supplement. Her brother has hemophilia A. She had a urinary infection 6 weeks ago treated with an antibiotic.\n\nShe has had no weight loss or night sweats. She lives independently and still drives.\n\nReview of systems: no fevers, joint pain, rash or blood in her urine. Her appetite is normal. She has no history of autoimmune disease or cancer. She had her last mammogram a year ago, and it was normal.\n\nVitals: HR 92, BP 138/80.\nExam: Large bruises on both arms and thighs. Tense, swollen right forearm. No petechiae.\n\nHb 98 g/L (ref 115-160)\nPlatelets 260 × 10⁹/L (ref 150-450)\nPT/INR normal\naPTT prolonged\n50:50 mixing study aPTT does not correct\nFVIII activity very low\n\nWhat is the most likely diagnosis?", "o": ["Congenital hemophilia A", "Vitamin K deficiency", "Factor XII deficiency", "Type 1 von Willebrand disease", "Acquired hemophilia A from an FVIII inhibitor"], "a": 4, "e": "Correct: E. New, severe bleeding in an older adult with no past bleeding, an isolated long aPTT that does not correct on mixing, and very low FVIII fit an acquired inhibitor against FVIII. Correction means a deficiency, while no correction means an inhibitor.\nA: Congenital hemophilia shows up in childhood, and the mixing study would correct.\nB: Vitamin K deficiency prolongs the INR first.\nC: Factor XII deficiency doesn't cause bleeding.\nD: Type 1 VWD causes mucosal bleeding, and the mixing study would correct.\nRed herring: Her brother's hemophilia A tempts congenital hemophilia, but she never bled before and the mixing study does not correct. Aspirin and fish oil tempt a platelet effect, but her aPTT is long. A new FVIII inhibitor explains it.\nTakeaway: Acquired bleeding disorders include hemophilia A, VWD and platelet disorders.", "l": ["W10 4.2.3", "W10 4.1"]}, {"c": "Bleeding disorders", "p": "Noah, 10, has had two knee bleeds after soccer and a large thigh hematoma after a fall. His mother's brother has a bleeding disorder. Noah had a nosebleed last winter during a cold. His sister has heavy periods. He takes no drugs.\n\nHe has had no gum bleeding or blood in his urine. He was born at term and is growing well.\n\nReview of systems: no fevers, weight loss, rash or blood in urine. He takes no medications. His parents are not related. He plays soccer twice a week and has missed games because of his knee.\n\nVitals: HR 88, T 36.7°C.\nExam: Right knee warm and swollen with limited movement. Healing thigh bruise. No petechiae.\n\nHb 124 g/L (ref 115-155)\nPlatelets 300 × 10⁹/L (ref 150-450)\nPT/INR normal\naPTT prolonged\n50:50 mixing study aPTT corrects\nFVIII activity normal\nvWF antigen and activity normal\n\nWhat is the most likely diagnosis?", "o": ["Factor VII deficiency", "Type 1 von Willebrand disease", "Acquired FVIII inhibitor", "Hemophilia A", "Hemophilia B"], "a": 4, "e": "Correct: E. Joint and muscle bleeds in a boy with an affected maternal uncle, a long aPTT that corrects on mixing, and normal FVIII and vWF point to hemophilia B, factor IX deficiency.\nA: Factor VII deficiency prolongs the PT/INR.\nB: Type 1 VWD causes mucosal bleeding and a low vWF.\nC: An inhibitor would not correct on mixing.\nD: Hemophilia A would have a low FVIII.\nRed herring: The uncle and joint bleeds tempt hemophilia A, but his FVIII is normal. His sister's heavy periods and his nosebleed tempt VWD, but his vWF is normal. That leaves factor IX: hemophilia B.\nTakeaway: Hemophilia A and B are both X-linked and mostly affect males.", "l": ["W10 11.1", "W10 11.2"]}, {"c": "Bleeding disorders", "p": "Two boys with severe hemophilia (baseline level near 0%) have joint bleeds. Each needs a target factor level of 60%. Boy 1 has hemophilia A and weighs 30 kg. Boy 2 has hemophilia B and weighs 40 kg.\n\nUsing the rule in your notes (1 U/kg FVIII raises the level by 2%, 1 U/kg FIX raises it by 1%), what dose per kg does each need, in order?", "o": ["120 U/kg rFVIII, then 60 U/kg rFIX", "60 U/kg rFVIII, then 30 U/kg rFIX", "30 U/kg rFVIII, then 30 U/kg rFIX", "30 U/kg rFVIII, then 60 U/kg rFIX"], "a": 3, "e": "Correct: D. 60% divided by 2% per U/kg = 30 U/kg FVIII. 60% divided by 1% per U/kg = 60 U/kg FIX.\nA: This multiplies by 2 instead of dividing.\nB: This swaps the recovery rates.\nC: FIX recovery is half that of FVIII, so FIX needs double.\nRed herring: Their weights tempt you to calculate total units. The question asks for U/kg, which does not depend on weight.\nTakeaway: Joint bleeds target over 50%.", "l": ["W10 5.4"]}, {"c": "Thrombocytopenia", "p": "A hematology resident teaches about HIT using a patient who had a DVT on day 7 of heparin after knee surgery, with a platelet fall from 280 to 110. The patient's family asks whether a platelet transfusion would help.\n\nConsider these statements about heparin-induced thrombocytopenia:\ni) It presents with thrombosis, not bleeding\nii) Onset is typically 5 to 10 days after heparin starts\niii) Platelet transfusion is standard treatment\niv) An anti-PF4 ELISA supports the diagnosis\n\nWhich are correct?", "o": ["ii), iii) and iv) only", "i), iii) and iv) only", "i), ii) and iv) only", "i) and ii) only", "All of the above"], "a": 2, "e": "Correct: C. HIT antibodies form against the heparin-PF4 complex and activate platelets, causing thrombosis. Onset is 5 to 10 days. Anti-PF4 ELISA and the serotonin assay support it.\nA: Includes iii). Platelet transfusions are avoided in HIT.\nB: Includes iii) and drops ii).\nD: Leaves out iv), which is true.\nE: iii) is false.\nRed herring: A low count with a worried family tempts platelet transfusion. Platelet transfusions are avoided in HIT.\nTakeaway: HIT pathophysiology: antibody to heparin-PF4 activates platelets, causing consumption and thrombosis.", "l": ["W10 3.4"]}, {"c": "Hemostasis and platelets", "p": "Leila, 19, has had nosebleeds since childhood, heavy periods and bleeding gums. Her parents are first cousins. She takes no NSAIDs or other drugs. Her mother has type 1 VWD. She had a viral illness last month. She plays rugby and has bruises on her legs.\n\nShe has had no joint bleeds. She is a university student and does not smoke or drink.\n\nReview of systems: no fevers, weight loss, rash, joint pain or blood in her urine. She takes an oral contraceptive to control her periods, which has helped a little.\n\nVitals: HR 90, BP 112/70.\nExam: Pale. Bruises on her legs. No petechiae. No hepatosplenomegaly.\n\nHb 108 g/L (ref 115-160)\nPlatelets 250 × 10⁹/L (ref 150-450)\nPlatelet size normal\nPT/INR normal\naPTT normal\nvWF antigen and activity normal\nPlatelet aggregometry: platelets adhere to collagen but do not aggregate.\n\nWhat is the most likely diagnosis?", "o": ["Bernard Soulier syndrome", "Glanzmann thrombasthenia", "Hemophilia A", "Type 1 von Willebrand disease", "Immune thrombocytopenia"], "a": 1, "e": "Correct: B. Mucocutaneous bleeding with normal platelet number and size, normal clotting tests, normal vWF, and platelets that adhere but fail to aggregate fit Glanzmann thrombasthenia. Aggregation needs GPIIb/IIIa.\nA: Bernard Soulier is a disorder of adhesion.\nC: Hemophilia A prolongs the aPTT and causes joint bleeds.\nD: Her vWF is normal.\nE: Her platelet count is normal.\nRed herring: Her mother's type 1 VWD tempts the same diagnosis, but Leila's vWF is normal. Normal platelet size argues against Bernard Soulier. Platelets that adhere but fail to aggregate mean Glanzmann thrombasthenia.\nTakeaway: Normal INR and PTT don't rule out a bleeding disorder.", "l": ["W10 1.2", "W10 1.3"]}, {"c": "Bleeding disorders", "p": "A student makes flashcards on inherited bleeding disorders. Her friend points out that two of the disorders involve platelets, two involve factors, and one involves both.\n\nConsider these statements about genetic bleeding disorders:\ni) Glanzmann thrombasthenia is a disorder of primary hemostasis\nii) Hemophilia B is a disorder of secondary hemostasis\niii) Type 3 vWD is a disorder of primary hemostasis that also lowers FVIII\niv) Bernard Soulier syndrome is a disorder of secondary hemostasis\n\nWhich are correct?", "o": ["i) and ii) only", "i), ii) and iv) only", "i), ii) and iii) only", "ii), iii) and iv) only", "All of the above"], "a": 2, "e": "Correct: C. Glanzmann and Bernard Soulier are platelet disorders (primary). Hemophilia B is FIX (secondary). vWD is primary, and type 3 also loses FVIII.\nA: Leaves out iii), which is true.\nB: Includes iv) and drops iii).\nD: Includes iv). Bernard Soulier is a platelet adhesion disorder.\nE: iv) is false.\nRed herring: Bernard Soulier is a rare name that sounds like a factor disorder. It is a platelet adhesion disorder, so it is primary.\nTakeaway: Platelets and vWF = primary. Coagulation factors = secondary.", "l": ["W10 11.1", "W10 11.2"]}, {"c": "VTE", "p": "The thrombosis clinic has room for one thrombophilia screen this week. The 72-year-old with a knee replacement DVT has a sister with a PE. The 60-year-old is on chemotherapy for lung cancer. The 70-year-old had a PE after 3 weeks in hospital. The 28-year-old has a cerebral vein clot with no trigger.\n\nWhich patient has the strongest indication for a thrombophilia screen?", "o": ["A 28 year old with unprovoked cerebral vein thrombosis", "A 72 year old with DVT after knee arthroplasty", "A 60 year old with DVT during chemotherapy", "A 70 year old with PE after a long hospitalization"], "a": 0, "e": "Correct: A. Indications include idiopathic events, age under 55 and unusual location such as the brain. She meets all three.\nB: Arthroplasty is a strong provoking factor, and he is over 55.\nC: Cancer explains the clot, and she is over 55.\nD: Hospitalization is a provoking factor, and he is over 55.\nRed herring: The 72-year-old's sister tempts family history, but his clot had a clear surgical trigger at an older age. The 28-year-old meets three criteria: idiopathic, under 55 and an unusual site.\nTakeaway: Thrombophilias: FV Leiden, prothrombin mutation, protein C, S, antithrombin deficiency, antiphospholipid antibodies.", "l": ["W10 6.1"]}, {"c": "Anticoagulants", "p": "Hana, 55, has a DVT and heparin-induced thrombocytopenia from a previous admission. Her team wants a once-daily injection that works through antithrombin and inhibits only factor Xa, with no heparin-PF4 cross-reactivity.\n\nWhich anticoagulant is indirect (needs antithrombin) and inhibits only Factor Xa?", "o": ["Unfractionated heparin", "Fondaparinux", "Dabigatran", "Rivaroxaban"], "a": 1, "e": "Correct: B. Fondaparinux is a synthetic pentasaccharide that binds antithrombin and inhibits Xa.\nA: UFH needs antithrombin but inhibits IIa, Xa, IXa, XIa and XIIa.\nC: Dabigatran is a direct thrombin inhibitor.\nD: Rivaroxaban inhibits Xa directly without antithrombin.\nRed herring: Her HIT history rules out UFH. Rivaroxaban inhibits Xa but is direct, with no antithrombin. Fondaparinux is the indirect, Xa-only drug.\nTakeaway: Thrombin inhibition needs at least 18 saccharides to bridge antithrombin and thrombin.", "l": ["W10 7.1"]}, {"c": "Hemostasis and platelets", "p": "A student draws the cell-based model of coagulation. In initiation, tissue factor with VIIa makes a little Xa and thrombin. In amplification, thrombin activates platelets and factors V, VIII and XI. Then propagation produces a burst of Xa.\n\nWhich complex converts Factor X to Xa in the propagation phase?", "o": ["Tissue factor with Factor VIIa", "Factor Xa with Va, calcium and phospholipid", "Thrombin with Factor XIIIa", "Factor IXa with Factor VIIIa (tenase)"], "a": 3, "e": "Correct: D. In propagation, IXa plus VIIIa forms the tenase complex, which converts more X to Xa.\nA: TF/VIIa activates only a small amount of IX and X in the initiation phase.\nB: This is the prothrombinase complex. It converts prothrombin to thrombin, downstream of Xa.\nC: Thrombin activates XIII to cross-link fibrin. It does not form a complex that activates X.\nRed herring: TF with VIIa also converts X to Xa, but only in small amounts during initiation. The burst in propagation comes from tenase: IXa with VIIIa.\nTakeaway: Initiation = TF/VIIa (small burst). Propagation = tenase (IXa/VIIIa) then prothrombinase (Xa/Va).", "l": ["W10 2.1"]}, {"c": "Coagulation tests", "p": "Two patients have prolonged PT and aPTT.\n\nPatient 1, 70, has eaten poorly for a month and finished antibiotics last week. She drinks 2 glasses of wine a day. Platelets normal, D-dimer normal, fibrinogen normal, FV normal, FVII low.\n\nPatient 2, 45, is in the ICU with sepsis. Platelets low, D-dimer high, fibrinogen low, all factors low.\n\nWhich diagnoses fit, in order?", "o": ["Vitamin K deficiency, then DIC", "DIC, then vitamin K deficiency", "Liver disease, then DIC", "Vitamin K deficiency, then liver disease"], "a": 0, "e": "Correct: A. Patient 1 has a low vitamin K factor (FVII) with normal FV, which is not vitamin K dependent. Patient 2 shows consumption: low platelets, low fibrinogen, high D-dimer and all factors down.\nB: This reverses the two patterns.\nC: Liver disease lowers FV and fibrinogen. Patient 1 has normal FV and fibrinogen.\nD: Liver disease does not raise D-dimer or give low platelets with global consumption, and FVIII rises in liver disease.\nRed herring: Patient 1's wine tempts liver disease, but liver disease lowers FV too, and hers is normal. A low FVII with a normal FV means vitamin K deficiency.\nTakeaway: FV is the tiebreaker: normal in vitamin K deficiency, low in liver disease and DIC.", "l": ["W10 4.2.3"]}, {"c": "Transfusion", "p": "Mr. Tran, 72, arrives unconscious after a crash with massive bleeding. No family can be reached, and there is no record of his wishes. The team needs to transfuse now. A medical student asks about consent.\n\nWhich statement about consent for blood transfusion is correct?", "o": ["Verbal consent without any documentation is sufficient", "Consent is waived if need is urgent and no SDM is available", "Consent covers the procedure and risks only, not alternatives", "Consent is waived whenever the patient is over 80"], "a": 1, "e": "Correct: B. Consent is written, explains procedure, risks, benefits and alternatives in a capable patient, and is documented. It is waived in urgent need without an SDM.\nA: Consent is written and documented.\nC: Alternatives belong in the discussion.\nD: Age alone is not a reason to waive consent.\nRed herring: His age and the chaos tempt shortcuts like verbal-only consent or an age rule. Consent is waived only when need is urgent and no SDM is available.\nTakeaway: Transfusion steps: need, consent, then blood bank tests (group, screen, crossmatch).", "l": ["W10 9.3"]}, {"c": "Anticoagulants", "p": "Ruby, 50, starts warfarin for a DVT. Her INR is 2.2 on day 3, and she asks to stop her LMWH injections. The pharmacist explains that the INR rises early from factor VII loss, but the full effect takes longer.\n\nWhy does warfarin need 5 to 7 days of overlap with UFH or LMWH when treatment starts?", "o": ["Heparin is needed to prevent warfarin-induced HIT", "The liver must first convert it into a direct thrombin inhibitor", "It blocks antithrombin, and antithrombin takes several days to clear", "Its effect reflects lower thrombin, and Factor II has a long half-life"], "a": 3, "e": "Correct: D. Warfarin blocks synthesis of II, VII, IX, X, protein C and S. Existing factors decay at their own half-lives, and the full effect depends on falling thrombin (II, 60 to 72 h).\nA: HIT is caused by heparin, not warfarin.\nB: Warfarin inhibits vitamin K reductase (VKORC1). It does not become a thrombin inhibitor.\nC: Warfarin does not act on antithrombin. Heparins need antithrombin.\nRed herring: An INR of 2.2 on day 3 tempts you to stop the overlap. The early INR rise reflects factor VII, which has a short half-life. The full effect depends on falling thrombin (factor II), which takes days.\nTakeaway: FVII falls first (3 to 8 h), so the INR rises before full protection.", "l": ["W10 7.1"]}, {"c": "Anticoagulants", "p": "Zara, 31, is 28 weeks pregnant and on therapeutic LMWH for a DVT. Her aPTT is normal, and her nurse worries the drug is not working. She has normal kidney function.\n\nWhich test fits best to check her anticoagulant effect?", "o": ["aPTT twice daily", "Thrombin time", "Anti-Xa assay", "INR every 1 to 2 days"], "a": 2, "e": "Correct: C. LMWH has a high anti-Xa to anti-IIa ratio, so it barely affects the aPTT. Monitor anti-Xa directly in pregnancy and renal failure.\nA: The aPTT monitors UFH, not LMWH.\nB: TT detects thrombin inhibition, which LMWH has little of.\nD: INR monitors warfarin.\nRed herring: A normal aPTT tempts you to think LMWH is not working, but LMWH barely affects the aPTT. Anti-Xa is used in pregnancy and renal failure.\nTakeaway: UFH = aPTT 2 to 4 times daily. LMWH = no routine monitoring, anti-Xa if needed.", "l": ["W10 7.1", "W10 8.3"]}, {"c": "Thrombocytopenia", "p": "Frank, 66, is on day 8 of subcutaneous unfractionated heparin after a hip replacement. His left calf is now swollen, and ultrasound shows a new DVT. He received 2 units of red cells during surgery and cefazolin for 24 hours. He has a heart murmur known for years. He had ITP as a teenager that resolved.\n\nHe has no bleeding and no fever, and his wound is clean. He is walking with physio.\n\nBefore surgery he had well-controlled hypertension on amlodipine. He has no personal or family history of clots before this. He does not smoke. He has no chest pain or shortness of breath.\n\nVitals: HR 86, BP 134/78, T 36.9°C.\nExam: Clean wound. Left calf swollen and tender. No petechiae.\n\nHb 116 g/L (ref 135-170)\nWBC 8.8 × 10⁹/L (ref 4-10)\nPlatelets 90 × 10⁹/L (ref 150-450), 250 before surgery\nPT/INR normal\nFibrinogen normal\nFilm: no schistocytes.\n\nWhat is the most likely diagnosis?", "o": ["Immune thrombocytopenia", "Splenic sequestration", "Disseminated intravascular coagulation", "Thrombotic thrombocytopenic purpura", "Heparin-induced thrombocytopenia"], "a": 4, "e": "Correct: E. A platelet fall of more than half, 5 to 10 days into heparin, with a new clot and no bleeding fits HIT. Antibodies against the heparin-PF4 complex activate platelets.\nA: ITP is a diagnosis of exclusion and doesn't cause thrombosis.\nB: Sequestration needs an enlarged spleen and develops slowly.\nC: DIC raises the INR and lowers fibrinogen.\nD: TTP shows schistocytes and hemolysis.\nRed herring: His teenage ITP tempts a relapse, and the transfusion tempts dilution. Neither causes a new clot. A fall of more than half at day 5 to 10 of heparin with a new DVT means HIT.\nTakeaway: Confirm with an anti-PF4 ELISA and a functional serotonin assay.", "l": ["W10 3.4", "W10 3.5"]}, {"c": "Thrombocytopenia", "p": "Diane, 38, is brought in confused with a headache and slurred speech that comes and goes. She has had fevers and new bruising for 3 days. She started an oral contraceptive pill 2 months ago. She has migraines. Her roommate had a stomach bug last week, but Diane has had no diarrhea. She is not pregnant.\n\nShe takes no other drugs. She has no history of seizures or bleeding problems.\n\nReview of systems: no chest pain, cough, urinary symptoms or rash. She works as a teacher and has had no recent travel. She does not smoke and drinks socially. Her family has no history of clotting or bleeding disorders.\n\nVitals: HR 114, BP 150/92, T 38.5°C.\nExam: Drowsy. Mild right arm weakness that improves during the exam. Petechiae on her legs. No neck stiffness.\n\nHb 82 g/L (ref 115-160)\nReticulocytes high\nWBC 9.2 × 10⁹/L (ref 4-10)\nPlatelets 9 × 10⁹/L (ref 150-450)\nPT/INR normal\nFibrinogen normal\nLDH high\nCreatinine mildly high\nADAMTS-13 low\nFilm: many schistocytes.\n\nWhat is the most likely diagnosis?", "o": ["Disseminated intravascular coagulation", "Heparin-induced thrombocytopenia", "Hemolytic-uremic syndrome", "Immune thrombocytopenia", "Thrombotic thrombocytopenic purpura"], "a": 4, "e": "Correct: E. Neurological signs, fever, severe thrombocytopenia, hemolysis with schistocytes, normal clotting tests and a low ADAMTS-13 fit TTP. Ultra-large vWF multimers go uncut and cause clotting.\nA: DIC raises the INR and lowers fibrinogen.\nB: HIT needs heparin exposure and causes thrombosis.\nC: HUS follows a diarrheal illness and has a normal ADAMTS-13.\nD: ITP has no hemolysis or schistocytes.\nRed herring: Her migraines and the pill tempt a stroke, and the roommate's stomach bug tempts HUS. A low ADAMTS-13 with schistocytes, severe thrombocytopenia, fever and changing neurological signs means TTP.\nTakeaway: TTP: plasma exchange and steroids. Avoid platelet transfusions.", "l": ["W10 3.4", "W10 3.5"]}, {"c": "Pediatric bleeding", "p": "Three children present to a pediatric hematology clinic.\n\nChild 1: 2-year-old boy with a swollen knee after a minor fall and easy bruising. His sister has heavy periods.\nChild 2: 13-year-old girl with heavy periods and iron deficiency anemia. Her father bruises easily.\nChild 3: 4-year-old with petechiae after a viral illness, platelets 6. His grandmother has hemophilia carrier status.\n\nWhich diagnoses are most likely, in order?", "o": ["Hemophilia, ITP, von Willebrand disease", "Hemophilia, von Willebrand disease, ITP", "von Willebrand disease, hemophilia, ITP", "ITP, von Willebrand disease, hemophilia"], "a": 1, "e": "Correct: B. Hemarthrosis in a toddler boy suggests hemophilia. Menorrhagia with iron deficiency suggests vWD. Isolated severe thrombocytopenia after a virus suggests ITP.\nA: Menorrhagia is a vWF pattern, and petechiae with low platelets fits ITP.\nC: Joint bleeding points to factors, not vWF.\nD: This reverses the first and last cases.\nRed herring: Each family history points to another child's disorder. Judge each child by their own pattern: hemarthrosis in a toddler boy, menorrhagia in a teen girl, isolated low platelets after a virus.\nTakeaway: Petechiae = platelets. Joints = hemophilia. Epistaxis and menorrhagia = vWD.", "l": ["W10 5.1", "W10 5.3"]}, {"c": "Hemostasis and platelets", "p": "Paul, 64, takes aspirin and clopidogrel after a stent. In the cath lab he also received abciximab. A student writes down how each drug works.\n\nConsider these statements about antiplatelet agents:\ni) Aspirin inhibits cyclooxygenase and lowers thromboxane A2\nii) Clopidogrel blocks the P2Y12 receptor pathway\niii) Abciximab blocks GPIb/IX and prevents platelet adhesion\niv) Abciximab is directed against GPIIb/IIIa and prevents aggregation\n\nWhich statements are correct?", "o": ["i), ii) and iv) only", "ii), iii) and iv) only", "i), ii) and iii) only", "i) and ii) only", "All of the above"], "a": 0, "e": "Correct: A. Aspirin hits cyclooxygenase (less TXA2). Clopidogrel hits P2Y12. Abciximab targets GPIIb/IIIa and blocks aggregation, so iii) is false.\nB: This includes iii). Abciximab targets GPIIb/IIIa, not GPIb/IX.\nC: This includes iii) and drops iv).\nD: This leaves out iv), which is true.\nE: iii) is false, so not all statements hold.\nRed herring: Statements iii) and iv) both describe abciximab, so one must be wrong. GPIb/IX is the adhesion receptor missing in Bernard Soulier. Abciximab targets GPIIb/IIIa.\nTakeaway: Three drugs, three targets: COX (aspirin), P2Y12 (clopidogrel), GPIIb/IIIa (abciximab).", "l": ["W10 1.4"]}, {"c": "Thrombocytopenia", "p": "Mia, 3, had bloody diarrhea for 4 days after a family barbecue. The diarrhea has settled, but she now looks pale and puffy and has passed very little urine for a day. She received amoxicillin for an ear infection a week ago. Her aunt has TTP. She had a cold before the barbecue.\n\nShe is not confused and has no rash. Her cousin who ate the same food also had diarrhea.\n\nReview of systems: no cough, rash, joint swelling or seizures. Her vaccines are up to date. She takes no other medications. She has a younger brother who is well.\n\nVitals: HR 132, BP 118/76, T 37.2°C.\nExam: Pale. Puffy eyelids and ankles. A few petechiae. No neck stiffness.\n\nHb 74 g/L (ref 110-140)\nWBC 12.4 × 10⁹/L (ref 4-10)\nPlatelets 52 × 10⁹/L (ref 150-450)\nPT/INR normal\nFibrinogen normal\nCreatinine high\nADAMTS-13 normal\nFilm: schistocytes.\n\nWhat is the most likely diagnosis?", "o": ["Thrombotic thrombocytopenic purpura", "Acute lymphoblastic leukemia", "Immune thrombocytopenia", "Disseminated intravascular coagulation", "Hemolytic-uremic syndrome"], "a": 4, "e": "Correct: E. A young child with a diarrheal prodrome, then hemolytic anemia with schistocytes, low platelets, acute kidney injury and a normal ADAMTS-13 has HUS, most often from Shiga toxin from E. coli O157:H7.\nA: TTP has a low ADAMTS-13 and more neurological signs.\nB: ALL shows blasts and doesn't cause schistocytes.\nC: ITP has no hemolysis or kidney injury.\nD: DIC raises the INR and lowers fibrinogen.\nRed herring: Her aunt's TTP tempts TTP, but Mia's ADAMTS-13 is normal and kidney injury dominates. The cold tempts ITP, which has no schistocytes. A diarrheal prodrome then hemolysis, low platelets and kidney injury mean HUS.\nTakeaway: HUS: supportive care. Avoid antibiotics and platelet transfusions.", "l": ["W10 3.4", "W10 3.5"]}, {"c": "Coagulation tests", "p": "Hamid, 50, has a very long aPTT and a normal PT on pre-op testing. The aPTT corrects on mixing. He had a tonsillectomy and two dental extractions with no bleeding. His brother has mild hemophilia A.\n\nWhich deficiency best explains this?", "o": ["Factor VII deficiency affecting the extrinsic pathway", "A lupus anticoagulant directed against phospholipid-bound proteins", "Factor XII deficiency with no bleeding risk", "Mild hemophilia A from Factor VIII deficiency"], "a": 2, "e": "Correct: C. Correction on mixing means a factor deficiency. A long aPTT with a bleed-free surgical history points to a contact factor. Contact factors profoundly elevate the aPTT but do not cause bleeding.\nA: FVII deficiency prolongs the PT, not the aPTT.\nB: An inhibitor such as a lupus anticoagulant does not correct on mixing.\nD: FVIII deficiency also corrects on mixing, but tonsillectomy and extractions without bleeding argue against it.\nRed herring: His brother's mild hemophilia A tempts the same diagnosis, but Hamid never bled with surgery. A very long aPTT that corrects, with no bleeding, means a contact factor like factor XII.\nTakeaway: Mixing: corrects = deficiency, no correction = inhibitor.", "l": ["W10 4.2.3"]}, {"c": "Hemostasis and platelets", "p": "A student lists the natural brakes on coagulation: antithrombin, TFPI, protein C, protein S and PAI-1. She remembers that one pair acts during amplification by switching off two cofactors.\n\nWhich pairing of a natural regulator of hemostasis with its target is correct?", "o": ["Plasminogen activator inhibitor-1: thrombin", "Antithrombin: the TF/VIIa complex only", "Tissue factor pathway inhibitor: Factors V and VIII", "Protein C and Protein S: Factors V and VIII"], "a": 3, "e": "Correct: D. Protein C and S block amplification by targeting FV and FVIII.\nA: PAI-1 inhibits t-PA and plasmin, a fibrinolysis regulator.\nB: Antithrombin binds IX, X and XI (and thrombin), blocking thrombin already generated.\nC: TFPI blocks initiation by targeting TF-VIIa and Xa.\nRed herring: PAI-1 sounds like it targets clotting, but it inhibits t-PA in fibrinolysis. Protein C and S switch off factors V and VIII.\nTakeaway: TFPI = initiation. Protein C/S = V and VIII. Antithrombin = thrombin, IX, X, XI.", "l": ["W10 2.1", "W10 2.2"]}, {"c": "Bleeding disorders", "p": "Sofia, 7, has had bleeding into her right ankle after a minor twist, nosebleeds needing packing, and prolonged bleeding after losing baby teeth. Both parents have mild nosebleeds and were told years ago they have \"low von Willebrand\". Sofia is a girl, and no male relatives have hemophilia. She had a viral illness last month.\n\nShe has had heavy bruising since starting school. She takes no medications.\n\nReview of systems: no fevers, weight loss, rash or blood in her urine. She is in grade 2 and is doing well at school. Her younger brother has not had any bleeding.\n\nVitals: HR 98, T 36.8°C.\nExam: Swollen right ankle. Bruises on her shins. Dried blood in one nostril.\n\nHb 110 g/L (ref 110-140)\nPlatelets 280 × 10⁹/L (ref 150-450)\nPT/INR normal\naPTT prolonged\nvWF antigen nearly undetectable\nvWF activity nearly undetectable\nFVIII activity low\n\nWhat is the most likely diagnosis?", "o": ["Type 2 von Willebrand disease", "Factor XIII deficiency", "Type 1 von Willebrand disease", "Hemophilia A", "Type 3 von Willebrand disease"], "a": 4, "e": "Correct: E. Almost absent vWF with a low FVIII causes both mucosal and joint bleeding. That is type 3 VWD, the rare severe form, since vWF normally protects FVIII.\nA: Type 2 is qualitative, with vWF antigen present.\nB: FXIII deficiency has a normal aPTT.\nC: Type 1 is a partial deficiency with milder bleeding.\nD: Hemophilia A is X-linked and has normal vWF.\nRed herring: The ankle bleed and low FVIII tempt hemophilia A, but she is a girl with no affected males and her vWF is nearly absent. Both parents carry mild VWD, so she inherited it from both: type 3 VWD.\nTakeaway: vWF adheres platelets to collagen and carries FVIII.", "l": ["W10 11.1", "W10 1.3"]}];
const OBJECTIVES = {"W10 1.2": "List the physiologic steps and key regulators of primary hemostasis.", "W10 1.3": "List and describe the changes in the primary hemostatic system that may lead to hemorrhagic complications.", "W10 1.4": "Describe the physiological targets of antiplatelet agents.", "W10 2.1": "List the physiologic steps and key regulators of secondary hemostasis.", "W10 2.2": "List the physiologic steps and key regulators of tertiary hemostasis", "W10 3.1": "Define thrombocytopenia and list the most common causes of thrombocytopenia.", "W10 3.2": "Describe the clinical presentation of thrombocytopenia.", "W10 3.3": "Formulate an initial laboratory workup of a patient presenting with thrombocytopenia", "W10 3.4": "Compare and contrast: Immune Thrombocytopenic Purpura (ITP), Thrombotic Thrombocytopenia Purpura/Hemolytic Uremic Syndrome (TTP/HUS), Disseminated Intravascular Coagulopathy (DIC), Heparin Induced Thrombocytopenia (HIT).", "W10 3.5": "Develop a management plan to treat thrombocytopenia.", "W10 4.1": "List and interpret critical clinical findings, including results of an appropriate history and physical examination performed with a particular attention to differentiate between various disorders of hemostasis.", "W10 4.2.1": "Define the laboratory tests: INR, aPTT and Fibrinogen.", "W10 4.2.2": "List coagulation factors analyzed by the laboratory investigation of INR and aPTT.", "W10 4.2.3": "Discuss the differential diagnoses in adults with isolated or combined abnormalities of INR, aPTT and Fibrinogen.", "W10 5.1": "List the differential diagnoses for pediatric patient with bleeding tendency.", "W10 5.3": "Compare and contrast the symptoms and signs of the differential diagnoses for pediatric patient with bleeding tendency.", "W10 5.4": "List therapeutic options, including blood components, required in the management of pediatric patients with bleeding disorders.", "W10 6.1": "List clinical risk factors for venous thrombosis.", "W10 6.2": "Describe ways to prevent venous thrombosis.", "W10 7.1": "List and describe the mechanism of actions for the different anticoagulants available.", "W10 7.2": "List possible common side effects and complications of anticoagulants.", "W10 7.3": "Describe approach to managing bleeding complications including possible antidotes to various anticoagulant medications.", "W10 8.3": "Recognize the special consideration including patient with renal impairment, pregnancy, post operative setting, in under- and over-weight populations", "W10 9.3": "Describe the elements of informed consent.", "W10 9.4": "List the indications for red cell, platelet and plasma transfusions.", "W10 9.6": "Describe the contents and storage of blood and blood products.", "W10 10.1": "List precautions that patients with bleeding disorder have to take in daily activities.", "W10 11.1": "List possible genetic disorders of primary hemostasis.", "W10 11.2": "List possible genetic disorders of secondary hemostasis."};
const L = "ABCDE";
const N = QUESTIONS.length;
let cur = 0, showResults = false;
let ans = new Array(N).fill(null);           // current pick per question
let tries = QUESTIONS.map(()=>[]);           // every locked attempt: {pick, ok, at}
let strikes = QUESTIONS.map(()=>[]);         // struck option indexes for the open attempt
let history = [], db = null, uid = null, writing = false, dirty = false;
const MAP=document.getElementById("map"); if(MAP && QUESTIONS.length<=60) MAP.open=true;
const LS_KEY = "differential-week-10-question-bank";
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");

function score(){ return ans.reduce((n,a,i)=>n+(a!==null&&a===QUESTIONS[i].a?1:0),0); }
function answered(){ return ans.filter(a=>a!==null).length; }
function firstTryScore(){ return tries.reduce((n,t)=>n+(t.length&&t[0].ok?1:0),0); }
function firstTryCount(){ return tries.filter(t=>t.length).length; }

function renderHeader(){
  const bf=$("#barfill"); if(bf) bf.style.width=(100*answered()/N)+"%";
  $("#stats").innerHTML = `<span>Question <b>${showResults?"–":cur+1}</b> of <b>${N}</b></span><span>Answered <b>${answered()}</b></span><span>Score <b>${score()} / ${answered()}</b></span>`;
  $("#ticks").innerHTML = QUESTIONS.map((q,i)=>{
    const st = ans[i]===null?"":(ans[i]===q.a?"ok":"bad");
    const redo = tries[i].length>1 || (ans[i]===null && tries[i].length>0);
    return `<button class="tick ${st} ${redo?"redo":""} ${(!showResults&&i===cur)?"cur":""}" data-i="${i}" aria-label="Question ${i+1}"></button>`;
  }).join("");
  document.querySelectorAll(".tick").forEach(b=>b.onclick=()=>{cur=+b.dataset.i;showResults=false;render();});
}

function triesLine(i, includeCurrent){
  const t = includeCurrent ? tries[i] : tries[i];
  if(!t.length) return "";
  const parts = t.map((x,k)=>`<span class="${x.ok?"ok":"bad"}">${k+1}: ${L[x.pick]} ${x.ok?"correct":"wrong"}</span>`).join(" · ");
  return `<div class="tries">Attempts ${parts}</div>`;
}

function fmtLine(t){
  let m;
  if((m=t.match(/^Correct:\s*([A-E])\.?\s*(.*)$/)) || (m=t.match(/^([A-E]) is correct\.?\s*(.*)$/)))
    return `<p class="why"><span class="lk ok">${m[1]}</span><span>${esc(m[2])}</span></p>`;
  if((m=t.match(/^([A-E]):\s*(.*)$/)))
    return `<p class="alt"><span class="lk">${m[1]}</span><span>${esc(m[2])}</span></p>`;
  if((m=t.match(/^(Takeaway|High yield|High-yield|Key point|Clues):\s*(.*)$/i)))
    return `<p class="take"><b>${esc(m[1])}.</b> ${esc(m[2])}</p>`;
  return `<p>${esc(t)}</p>`;
}

function renderQ(){
  const q = QUESTIONS[cur], a = ans[cur], done = a!==null, st = strikes[cur];
  const opts = q.o.map((o,i)=>{
    let c = "";
    if(done){ if(i===q.a) c="right"; else if(i===a) c="wrong"; }
    const struck = !done && st.includes(i);
    const strikeBtn = done ? "" : `<button class="strike" data-s="${i}" aria-pressed="${struck}" aria-label="${struck?"Restore":"Strike out"} option ${L[i]}" title="${struck?"Restore":"Strike out"} option">${struck?"↺":"✕"}</button>`;
    return `<div class="optrow ${struck?"struck":""}"><button class="opt ${c}" data-i="${i}" ${done?"disabled":""}><span class="k">${L[i]}</span><span>${esc(o)}</span></button>${strikeBtn}</div>`;
  }).join("");
  let fb = "";
  if(done){
    const ok = a===q.a;
    const lines = q.e.split("\n").map(fmtLine).join("");
    const objs = q.l.map(id=>`<div class="obj"><b>Objective ${esc(id)}</b> ${esc(OBJECTIVES[id]||"")}</div>`).join("");
    fb = `<div class="fb" role="status"><div class="verdict ${ok?"ok":"bad"}">${ok?"Correct.":"Incorrect. The answer is "+L[q.a]+"."}</div>${lines}${objs}${triesLine(cur)}<div class="fbtools"><button class="btn ghost" id="redo">Reset and redo this question</button></div></div>`;
  }
  const pre = (!done && tries[cur].length) ? `<div class="hint">Redo. Your earlier attempts are saved.</div>${triesLine(cur)}` : (!done ? `<div class="hint">Tap ✕ to strike out an option. Right-click works too.</div>` : "");
  const last = cur===N-1;
  $("#main").innerHTML = `<article class="card">
    <div class="chead"><span class="tag">${esc(q.c)}</span><span class="chead-r">${ankiButton(cur)}<span class="qn">${cur+1} of ${N}</span></span></div>
    <p class="stem">${esc(q.p)}</p>
    ${pre}
    <div class="opts">${opts}</div>
    <div class="offrow">${offButton(cur)}</div>${fb}
    <div class="nav"><button class="btn ghost" id="prev" ${cur===0?"disabled":""}>Previous</button>
    <button class="btn" id="next" ${done?"":"disabled"}>${last?"See results":"Next"}</button></div>
  </article>`;
  document.querySelectorAll(".opt").forEach(b=>{
    b.onclick=()=>{ const p=+b.dataset.i; ans[cur]=p; tries[cur].push({pick:p, ok:p===q.a, at:new Date().toISOString()}); tries[cur]=tries[cur].slice(-10); strikes[cur]=[]; render(false); persist(); };
    b.oncontextmenu=(e)=>{ if(done) return; e.preventDefault(); toggleStrike(+b.dataset.i); };
  });
  document.querySelectorAll(".strike").forEach(b=>b.onclick=()=>toggleStrike(+b.dataset.s));
  const ab=$("#anki"); if(ab) ab.onclick=()=>ankiToggle(cur);
  const ob=$("#off"); if(ob) ob.onclick=()=>offToggle(cur);
  const r=$("#redo"); if(r) r.onclick=()=>{ ans[cur]=null; strikes[cur]=[]; render(false); persist(); };
  $("#prev").onclick=()=>{cur--;render();};
  $("#next").onclick=()=>{ if(last){showResults=true;} else cur++; render(); };
}

function toggleStrike(i){
  const s = strikes[cur], k = s.indexOf(i);
  if(k<0) s.push(i); else s.splice(k,1);
  render(false); persist();
}

function renderResults(){
  const s = score(), pct = Math.round(100*s/N);
  const cats = {};
  QUESTIONS.forEach((q,i)=>{ cats[q.c]=cats[q.c]||[0,0]; cats[q.c][1]++; if(ans[i]===q.a) cats[q.c][0]++; });
  const rows = Object.entries(cats).map(([c,[r,t]])=>`<tr><td>${esc(c)}<span class="meter"><i style="width:${Math.round(100*r/t)}%"></i></span></td><td>${r} / ${t}</td></tr>`).join("");
  const missed = {};
  QUESTIONS.forEach((q,i)=>{ const wrongFirst = tries[i].length && !tries[i][0].ok; if(ans[i]!==q.a || wrongFirst) q.l.forEach(id=>{ const w=id.split(" ")[0]; missed[w]=missed[w]||new Set(); missed[w].add(id); }); });
  const weeks = Object.keys(missed).sort((x,y)=>parseInt(x.slice(1))-parseInt(y.slice(1)));
  const missHtml = weeks.length ? weeks.map(w=>`<h3>Week ${w.slice(1)}</h3><ul class="miss">${[...missed[w]].map(id=>`<li><code>${esc(id)}</code>${esc(OBJECTIVES[id]||"")}</li>`).join("")}</ul>`).join("") : "<p>No missed objectives.</p>";
  const redone = tries.filter(t=>t.length>1).length;
  const un = N - answered();
  $("#main").innerHTML = `<article class="card">
    <div class="chead"><span class="tag">Results</span><span>${un?un+" unanswered":"Complete"}</span></div>
    <div><div class="big">${s} / ${N}</div><div class="stats"><span><b>${pct}%</b> correct now</span><span>First try <b>${firstTryScore()} / ${firstTryCount()}</b></span><span>Redone <b>${redone}</b></span></div></div>
    <table><thead><tr><th>Topic</th><th>Score</th></tr></thead><tbody>${rows}</tbody></table>
    ${ankiMissedRow()}<h2>Objectives to review</h2><p class="hint">Includes questions you missed on the first try, even if a redo got them right.</p>${missHtml}${history.length?`<h2>Past attempts</h2><table><thead><tr><th>Date</th><th>Score</th></tr></thead><tbody>${history.slice().reverse().map(h=>`<tr><td>${new Date(h.date).toLocaleDateString()}</td><td>${h.score} / ${h.total}</td></tr>`).join("")}</tbody></table>`:""}
    <div class="nav"><button class="btn ghost" id="back">Back to questions</button><button class="btn" id="restart">Restart all</button></div>
  </article>`;
  $("#back").onclick=()=>{showResults=false;render();};
  const am=$("#ankimissed"); if(am) am.onclick=()=>{ ankiAdd(missedIdx()); renderResults(); };
  $("#restart").onclick=resetAll;
}
/* Clear every answer, redo and strike-out. The attempt is kept in Past attempts. Flags are not touched. */
function resetAll(){
  if(answered() || tries.some(t=>t.length)){
    history.push({date:new Date().toISOString(), score:score(), answered:answered(), total:N, firstTry:firstTryScore(),
      missed:QUESTIONS.map((q,i)=>ans[i]!==null&&ans[i]!==q.a?"q"+(i+1):null).filter(Boolean)});
    history=history.slice(-20);
  }
  ans.fill(null); tries=QUESTIONS.map(()=>[]); strikes=QUESTIONS.map(()=>[]); cur=0; showResults=false; render(); persist();
}
/* Header button: first tap arms it, second tap within 4 seconds resets. No browser dialog. */
(function(){
  const b=document.getElementById("resetall"); let timer=null;
  const disarm=()=>{ b.classList.remove("armed"); b.textContent="Reset all answers"; clearTimeout(timer); timer=null; };
  b.onclick=()=>{
    if(!b.classList.contains("armed")){ b.classList.add("armed"); b.textContent="Tap again to reset"; timer=setTimeout(disarm,4000); return; }
    disarm(); resetAll(); setSave("All answers cleared. Your score is saved in Past attempts.","ok");
  };
})();

function setSave(text, cls){ const el=$("#save"); if(el){ el.textContent=text; el.className="save "+(cls||""); } }
function bodyOf(){
  const a = {};
  QUESTIONS.forEach((q,i)=>{
    if(ans[i]===null && !tries[i].length && !strikes[i].length) return;
    a["q"+(i+1)] = {pick:ans[i], ok:ans[i]!==null && ans[i]===q.a, l:q.l, tries:tries[i], strikes:strikes[i]};
  });
  return {answers:a, history, total:N, answered:answered(), score:score(), firstTry:firstTryScore(), updatedAt:new Date().toISOString()};
}
function validPick(i,p){ return Number.isInteger(p) && p>=0 && p<QUESTIONS[i].o.length; }
function applySaved(d){
  if(!d || typeof d!=="object") return;
  ans.fill(null); tries=QUESTIONS.map(()=>[]); strikes=QUESTIONS.map(()=>[]);
  const a = d.answers || {};
  for(const k in a){
    const i = parseInt(k.slice(1),10)-1, row = a[k];
    if(!(i>=0 && i<N) || !row || typeof row!=="object") continue;
    if(validPick(i,row.pick)) ans[i]=row.pick;
    if(Array.isArray(row.tries)) tries[i]=row.tries.filter(t=>t&&validPick(i,t.pick)).map(t=>({pick:t.pick, ok:t.pick===QUESTIONS[i].a, at:String(t.at||"")})).slice(-10);
    else if(ans[i]!==null) tries[i]=[{pick:ans[i], ok:ans[i]===QUESTIONS[i].a, at:""}];
    if(Array.isArray(row.strikes)) strikes[i]=row.strikes.filter(x=>validPick(i,x));
  }
  history = Array.isArray(d.history) ? d.history.slice(-20) : [];
  const first = ans.findIndex(x=>x===null); cur = first<0 ? N-1 : first;
}
function lsLoad(){ try{ return JSON.parse(localStorage.getItem(LS_KEY)||"null"); }catch(e){ return null; } }
function lsSave(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(bodyOf())); }catch(e){} }
async function persist(){
  lsSave();
  if(!db || !uid) return;
  dirty = true; if(writing) return; writing = true;
  while(dirty){
    dirty = false;
    setSave("Saving…");
    try{ await db.doc("attempts/"+uid).set(bodyOf()); setSave("Progress saved to your account.","ok"); }
    catch(e){
      if(e && e.code==="invalid_argument"){ db=null; setSave("Progress saves in this browser only.","bad"); break; }
      setSave("Could not save to your account. Progress saves in this browser.","bad");
    }
  }
  writing = false;
}
async function connect(){
  try{
    if(!window.claude || !window.claude.use) return;
    const [u, d] = await Promise.all([window.claude.use("user"), window.claude.use("db")]);
    if(!u || !d) return;
    const id = await u.id(); if(!id) return;
    db = d; uid = id;
    const snap = await db.doc("attempts/"+uid).get();
    if(snap.exists){ applySaved(snap.data()); render(); setSave("Progress saved to your account.","ok"); }
    else if(answered() || tries.some(t=>t.length)){ persist(); }
    else setSave("Progress saves to your account.","ok");
  }catch(e){ /* keep local-only mode */ }
}

/* Flagged: flagged questions live in one shared list ("differential-anki", the key predates the rename)
   that the Flagged tab reads. Each card keeps a copy of its question, so the tab works without loading every quiz. */
const SET = {"slug": "week-10-question-bank", "title": "Week 10 Question Bank", "b": 3, "href": "fom/block-3/question-bank/week-10-question-bank"};
const ANKI_KEY = "differential-anki";
function ankiAll(){ try{ const d=JSON.parse(localStorage.getItem(ANKI_KEY)||"null"); return d && Array.isArray(d.cards) ? d.cards : []; }catch(e){ return []; } }
function ankiPut(cards){ try{ localStorage.setItem(ANKI_KEY, JSON.stringify({v:1, cards})); return true; }catch(e){ setSave("Could not flag. Browser storage is full or blocked.","bad"); return false; } }
function ankiId(i){ return SET.slug+"#"+(i+1); }
function ankiCard(i){
  const q=QUESTIONS[i];
  return {id:ankiId(i), slug:SET.slug, set:SET.title, b:SET.b, href:SET.href, n:i+1, c:q.c, p:q.p, o:q.o, a:q.a, e:q.e, l:q.l, obj:q.l.map(x=>OBJECTIVES[x]||"")};
}
function ankiHas(i, cards){ return (cards||ankiAll()).some(c=>c.id===ankiId(i)); }
function ankiButton(i){ const s=ankiHas(i); return `<button class="ankibtn" id="anki" aria-pressed="${s}" title="${s?"Remove the flag":"Flag this question for review"}">${s?"Flagged":"Flag"}</button>`; }
function ankiToggle(i){
  let cards=ankiAll();
  if(ankiHas(i,cards)) cards=cards.filter(c=>c.id!==ankiId(i));
  else cards.push(Object.assign(ankiCard(i), {at:new Date().toISOString()}));
  ankiPut(cards); render(false);
}
function ankiAdd(list){
  const cards=ankiAll(), have=new Set(cards.map(c=>c.id)), at=new Date().toISOString();
  list.forEach(i=>{ if(!have.has(ankiId(i))) cards.push(Object.assign(ankiCard(i), {at})); });
  ankiPut(cards);
}
function missedIdx(){ return QUESTIONS.map((q,i)=>((ans[i]!==null && ans[i]!==q.a) || (tries[i].length && !tries[i][0].ok)) ? i : -1).filter(i=>i>=0); }
function ankiMissedRow(){
  const m=missedIdx(); if(!m.length) return "";
  const cards=ankiAll(), left=m.filter(i=>!ankiHas(i,cards)).length;
  return `<div class="ankirow">${left ? `<button class="btn ghost" id="ankimissed">Flag ${left} missed question${left===1?"":"s"} for review</button>` : `<span class="hint">All ${m.length} missed questions are flagged.</span>`}</div>`;
}
/* Keep saved copies current when a question is corrected, without touching review progress. */
function ankiRefresh(){
  const cards=ankiAll(); let changed=false;
  cards.forEach(c=>{
    if(c.slug!==SET.slug) return;
    const i=c.n-1; if(!(i>=0 && i<N)) return;
    const fresh=ankiCard(i);
    for(const k of ["set","b","href","c","p","o","a","e","l","obj"]) if(JSON.stringify(c[k])!==JSON.stringify(fresh[k])){ c[k]=fresh[k]; changed=true; }
  });
  if(changed) ankiPut(cards);
}
addEventListener("storage", e=>{ if(e.key===ANKI_KEY || e.key===OFF_KEY) render(false); });

/* Not in course content: questions you report land in "differential-offcontent".
   The Flagged tab lists them with a Copy list button, so they can be sent in for removal. */
const OFF_KEY = "differential-offcontent";
function offAll(){ try{ const d=JSON.parse(localStorage.getItem(OFF_KEY)||"null"); return d && Array.isArray(d.items) ? d.items : []; }catch(e){ return []; } }
function offHas(i){ return offAll().some(x=>x.id===ankiId(i)); }
function offButton(i){ const s=offHas(i); return `<button class="offbtn" id="off" aria-pressed="${s}">${s?"Reported as not in course content. Undo":"Not in course content?"}</button>`; }
function offToggle(i){
  let items=offAll();
  if(offHas(i)) items=items.filter(x=>x.id!==ankiId(i));
  else { const q=QUESTIONS[i]; items.push({id:ankiId(i), slug:SET.slug, set:SET.title, b:SET.b, href:SET.href, n:i+1, c:q.c, p:q.p, key:q.o[q.a], at:new Date().toISOString()}); }
  try{ localStorage.setItem(OFF_KEY, JSON.stringify({v:1, items})); }catch(e){ setSave("Could not save the report. Browser storage is full or blocked.","bad"); }
  render(false);
}

function render(top=true){ renderHeader(); showResults?renderResults():renderQ(); if(top) window.scrollTo({top:0}); }
applySaved(lsLoad());
ankiRefresh();
render();
connect();
</script>

</body></html>
