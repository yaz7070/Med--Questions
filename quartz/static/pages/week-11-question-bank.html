<script>
const QUESTIONS = [{"c": "Cancer therapy", "p": "Jonah, 28, has a neck node that has grown over 2 months. A surgeon removes the whole node, and pathology shows lymphoma confined to that single region. His oncologist then discusses radiation. Jonah's friend had a splenectomy \"to cure\" a blood disorder and asks whether surgery could cure Jonah too.\n\nMatch each localized therapy with its role in hematological malignancies. Therapy 1: surgery. Therapy 2: radiotherapy. Which pairing is correct, in order?", "o": ["Curative in limited stage lymphoma, diagnosis only", "CNS prophylaxis in ALL, palliation of AML", "Diagnosis only, curative in limited stage lymphoma", "Curative splenectomy, CNS prophylaxis in AML"], "a": 2, "e": "Correct: C. Surgery is used for diagnosis only, such as resecting a lymph node. Radiotherapy can be curative in limited stage lymphoma and gives CNS prophylaxis in ALL.\nA: This swaps the two roles.\nB: Surgery is for diagnosis only, and the notes do not list radiation for AML palliation.\nD: The notes do not list curative surgery, and CNS prophylaxis is listed for ALL.\nRed herring: The friend's curative splenectomy tempts a curative role for surgery. In hematological malignancy, surgery is for diagnosis only, such as removing a node. Radiotherapy can cure limited-stage lymphoma.\nTakeaway: In blood cancers, surgery mostly diagnoses. Radiation can cure limited disease.", "l": ["W11 8.1", "W11 8.2"]}, {"c": "Myeloproliferative neoplasms", "p": "A hematology fellow quizzes residents on the driver mutations in myeloproliferative neoplasms. She reminds them that one gene is found in nearly all PV but only about half of ET and PMF, and that CALR and MPL drive some of the rest.\n\nWhich statement about mutations in myeloproliferative neoplasms is FALSE?", "o": ["JAK2 mutations are found in 90 to 95% of PV", "CALR mutations can drive essential thrombosis (ET)", "MPL W515L/K mutations can drive primary myelofibrosis", "JAK2 mutations are found in only 50 to 60% of PV"], "a": 3, "e": "Correct: D. JAK2 is found in 90 to 95% of PV. The 50 to 60% figure belongs to ET and PMF.\nA: This is true. JAK2 is found in 90 to 95% of PV.\nB: This is true. CALR is listed for ET.\nC: This is true. MPL W515L/K is listed for PMF.\nRed herring: Both 90 to 95% and 50 to 60% are real figures for JAK2, which makes the false statement easy to miss. The 50 to 60% figure belongs to ET and PMF, not PV.\nTakeaway: JAK2: about 95% of PV, about half of ET and PMF. CALR and MPL cover much of the rest.", "l": ["W11 6.5"]}, {"c": "Trial design", "p": "A team plans a trial of a new add-on drug for CML. Lab data show it can only deepen response, never worsen it. The statistician also suggests a composite endpoint, and a junior investigator wants to cut the target power to save money.\n\nWhich choice lets them use a smaller sample size in a valid way?", "o": ["Lowering power below 50%", "A one-sided test", "A two-sided test", "Adding a composite endpoint with unequal weights"], "a": 1, "e": "Correct: B. A one-sided test is used when investigators suspect a difference in one direction only, and it needs a smaller sample size.\nA: Power is 1 minus β, the chance of detecting a true difference. Cutting it defeats the trial's purpose.\nC: A two-sided test is used when the direction is unknown.\nD: Components of a composite endpoint are equally weighted.\nRed herring: Lowering power does shrink the sample, but power below 50% makes the trial nearly useless. A one-direction expectation justifies a one-sided test, which needs fewer patients.\nTakeaway: One direction, smaller sample. Power = 1 minus β.", "l": ["W11 11.2"]}, {"c": "Cancer therapy", "p": "Rosa, 52, starts a classic chemotherapy regimen for lymphoma. Her neighbour took ibrutinib for CLL and developed atrial fibrillation, and Rosa asks whether she should expect the same. Her nurse lists the toxicities common to all classic chemotherapies.\n\nWhich toxicities are common to all classic chemotherapies?\ni) Myelosuppression\nii) Alopecia\niii) Mucositis\niv) Atrial fibrillation", "o": ["i), ii) and iii) only", "ii), iii) and iv) only", "i), ii) and iv) only", "All of the above"], "a": 0, "e": "Correct: A. The notes list myelosuppression, alopecia and mucositis as common to all classic chemotherapies.\nB: Atrial fibrillation is an ibrutinib toxicity, and myelosuppression is missing.\nC: Atrial fibrillation is an ibrutinib toxicity, and mucositis is missing.\nD: Atrial fibrillation does not belong in the list.\nRed herring: The neighbour's atrial fibrillation came from ibrutinib, a targeted drug, not classic chemotherapy.\nTakeaway: Classic chemotherapy hits fast-dividing cells: marrow, hair, mucosa.", "l": ["W11 7.7"]}, {"c": "Trial design", "p": "In a trial of a new oral drug for myeloma, 30% of patients in the treatment arm stopped the drug early because of side effects. The company presents results that include only patients who finished treatment, and the effect looks large. A reviewer asks for the other analysis.\n\nWhich statement about intention-to-treat (ITT) and per-protocol (PP) analysis is correct?", "o": ["ITT includes only patients who finished treatment", "ITT gives a more conservative effect estimate", "PP analyzes everyone randomized, even dropouts", "PP usually gives a lower effect estimate than ITT"], "a": 1, "e": "Correct: B. ITT analyzes patients by assigned group, including those who stop treatment. It almost always gives a more conservative estimate and reflects real-world use.\nA: Completers only is the definition of PP.\nC: Analyzing everyone randomized is ITT, not PP.\nD: PP usually yields a higher estimate, because patients doing poorly tend to drop out.\nRed herring: The large effect in the company's analysis tempts you to trust it. Including only finishers is per-protocol and tends to inflate the effect. ITT keeps everyone randomized and gives a more conservative estimate.\nTakeaway: ITT is conservative and real world. PP inflates the effect.", "l": ["W11 11.1"]}, {"c": "Trial design", "p": "Investigators test a new oral drug for CLL that is less toxic and easier to take than standard IV therapy. They do not expect it to work better, only not meaningfully worse. They plan 900 patients in 30 centres and want to publish in a top journal.\n\nWhich trial design fits?", "o": ["Superiority, against a placebo control", "Phase 1, to find the tolerated dose", "Non-inferiority, with a pre-set margin", "Equivalence, with no margin at all"], "a": 2, "e": "Correct: C. A non-inferiority trial shows a new therapy is not clinically worse than the comparator. It suits a drug that offers other advantages such as safety, tolerability or convenience. The margin must be pre-specified.\nA: A superiority trial aims to show the new therapy is better.\nB: Phase 1 trials study safety and tolerated dose in 10 to 30 patients.\nD: Equivalence trials still use lower and upper margins, and they test that two treatments differ by an unimportant amount.\nRed herring: The big size and high profile tempt a superiority design. The aim is to show it is not clinically worse, so it is non-inferiority with a pre-set margin.\nTakeaway: Non-inferiority: give up a little efficacy (the delta) for safety or convenience.", "l": ["W11 11.4"]}, {"c": "Erythrocytosis", "p": "Two patients have polycythemia vera. Both take ASA 81 mg daily with a hematocrit target below 0.45.\n\nPatient 1, 42, has no history of thrombosis but smokes and has high cholesterol.\nPatient 2, 50, had a DVT last year after a long flight.\n\nWhich added therapy is correct for each, in order?", "o": ["Phlebotomy, hydroxyurea ± phlebotomy", "Ruxolitinib, allogeneic transplant", "Hydroxyurea ± phlebotomy, phlebotomy", "Phlebotomy, phlebotomy alone for both"], "a": 0, "e": "Correct: A. Low-risk PV is treated with phlebotomy. High risk means age 60 or older, or prior thrombosis, and adds cytoreduction with hydroxyurea with or without phlebotomy. Patient 2 is high risk because of the prior DVT.\nB: Ruxolitinib and transplant are listed for primary myelofibrosis.\nC: This reverses the risk groups.\nD: Patient 2's prior thrombosis makes him high risk, which adds hydroxyurea.\nRed herring: Patient 1's smoking and cholesterol tempt you to call him high risk, and Patient 2's DVT had a trigger. High risk in PV means age 60 or older, or any prior thrombosis. Only Patient 2 is high risk.\nTakeaway: High-risk PV: age 60 or older, or any prior thrombosis.", "l": ["W11 6.3"]}, {"c": "Marrow testing", "p": "A marrow aspirate from a patient with suspected leukemia is sent for flow cytometry. The lab also sends a sample for cytogenetics and a fixed core for histology. The resident wants to know what the flow scatter plots show.\n\nWhich statement about flow cytometry of a marrow aspirate is correct?", "o": ["Samples must be formalin fixed before they are run", "It detects changes in chromosome structure and number", "FSC reflects granularity and SSC reflects cell size", "FSC reflects cell size and SSC reflects granularity"], "a": 3, "e": "Correct: D. In flow cytometry, forward scatter (FSC) measures size and side scatter (SSC) measures complexity or granularity.\nA: Samples should be fresh (under 24 hours) and in liquid or disaggregated suspension.\nB: Chromosome changes are studied by cytogenetics.\nC: This reverses the two measures.\nRed herring: Cytogenetics, not flow, looks at chromosomes, and the core is the fixed sample. On flow, forward scatter measures size and side scatter measures granularity.\nTakeaway: FSC is size, SSC is granularity. Immunophenotype is the pattern of antigens.", "l": ["W11 9.3"]}, {"c": "Leukemias", "p": "Arthur, 72, has CLL found on a routine CBC. He has no nodes, no enlarged organs and normal Hb and platelets: Rai stage 0. He feels well. His daughter, a nurse, has read about new drugs and a younger friend's transplant and wants him treated now.\n\nWhich plan fits CLL that is Rai stage 0 and causing no symptoms?", "o": ["Refer for allogeneic stem cell transplant", "Start imatinib", "Start chlorambucil", "Monitor without treatment for now"], "a": 3, "e": "Correct: D. Rai stage 0 is low risk. The notes say do NOT treat low risk or asymptomatic CLL.\nA: Transplant is not a first step in asymptomatic, low-risk CLL.\nB: Imatinib is a tyrosine kinase inhibitor for CML.\nC: Chlorambucil is a CLL chemotherapy option once treatment is needed, not for stage 0 without symptoms.\nRed herring: His daughter's urgency tempts active treatment. Low-risk, asymptomatic CLL is not treated.\nTakeaway: CLL is incurable. Low-risk, asymptomatic CLL is watched, not treated.", "l": ["W11 3.3"]}, {"c": "Myeloproliferative neoplasms", "p": "George, 62, has primary myelofibrosis with a massive spleen and transfusion-dependent anemia. Ruxolitinib has shrunk his spleen and eased his night sweats. He is fit and has a matched sibling. He asks whether any treatment could cure the disease.\n\nWhich treatment do the notes list as curative in primary myelofibrosis?", "o": ["Allogeneic stem cell transplantation", "Hydroxyurea with steroids", "Supportive red cell and platelet transfusions", "Ruxolitinib, a JAK2 inhibitor"], "a": 0, "e": "Correct: A. The notes list allogeneic stem cell transplantation as the curative option for PMF.\nB: Hydroxyurea is a conventional option for symptoms and quality of life.\nC: Transfusions are supportive, not curative.\nD: Ruxolitinib, a JAK inhibitor, is the newer option for symptom control.\nRed herring: Ruxolitinib improved his symptoms and spleen, which tempts you to call it curative. It controls the disease. Allogeneic stem cell transplant is the curative option.\nTakeaway: PMF: transplant to cure, everything else to control symptoms.", "l": ["W11 8.7"]}, {"c": "Emergencies", "p": "Omar, 45, was diagnosed with AML this morning. Over a few hours he has become short of breath, with a headache, blurred vision and confusion. He has asthma and missed his inhaler doses this week. He had a CT contrast scan this morning. He has not started chemotherapy.\n\nHe has no fever, chest pain or bleeding. His urine output is normal.\n\nReview of systems: no cough, sputum, chest pain or bleeding. He works as a construction manager and smokes 10 cigarettes a day. His diagnosis was made this morning after a routine CBC for fatigue.\n\nVitals: HR 118, BP 128/80, RR 28, T 37.1°C, oxygen saturation 86% on room air.\nExam: Confused. Scattered crackles. No wheeze. Retinal veins look engorged.\n\nHb 82 g/L (ref 135-170)\nWBC 210 × 10⁹/L (ref 4-10)\nBlasts: most of the white cells\nPlatelets 34 × 10⁹/L (ref 150-450)\nPotassium normal\nPhosphate normal\nCalcium normal\nCreatinine normal\n\nWhat is the most likely diagnosis?", "o": ["Febrile neutropenia", "Leukostasis", "Tumour lysis syndrome", "Disseminated intravascular coagulation"], "a": 1, "e": "Correct: B. A very high blast count with dyspnea, hypoxia, headache, visual changes and confusion fits leukostasis. Big, sticky blasts get stuck in small vessels and reduce tissue perfusion.\nA: Febrile neutropenia needs a fever.\nC: TLS brings high potassium and phosphate, low calcium and kidney failure.\nD: DIC presents with bleeding and abnormal clotting tests.\nRed herring: Missed inhalers tempt an asthma attack, but he has no wheeze. The contrast scan tempts a reaction, and AML tempts TLS, but his electrolytes and kidneys are normal and chemo has not started. A WBC of 210 with hypoxia and confusion means leukostasis.\nTakeaway: Leukostasis: IV fluids, leukapheresis and cytoreduction.", "l": ["W11 3.5", "W11 1.3"]}, {"c": "Cancer therapy", "p": "Walter, 78, has CLL and starts chlorambucil because he is too frail for intensive therapy. He also receives rituximab. His grandson, a pharmacy student, asks which mechanism belongs to chlorambucil's drug class.\n\nWhich mechanism matches chlorambucil's class?", "o": ["Interferes with cellular nucleic acid metabolism", "Targets the CD20 marker on malignant B cells", "Crosslinks guanine so DNA cannot enter S phase", "Binds PD1 or PDL1 to release the immune brake"], "a": 2, "e": "Correct: C. Chlorambucil is an alkylating agent. Alkylating agents crosslink guanine, causing cell arrest and apoptosis.\nA: This is the antimetabolite mechanism, such as methotrexate.\nB: CD20 targeting describes rituximab, a monoclonal antibody.\nD: This is the immune checkpoint inhibitor mechanism.\nRed herring: Rituximab, given at the same time, targets CD20, which tempts you to choose it. Chlorambucil is an alkylating agent that crosslinks guanine.\nTakeaway: Alkylators (cyclophosphamide, chlorambucil, cisplatin, carboplatin) crosslink guanine.", "l": ["W11 7.5", "W11 7.6"]}, {"c": "Erythrocytosis", "p": "Frank, 62, has smoked 2 packs a day for 40 years and has COPD on home oxygen at night. He has morning headaches. His brother has polycythemia vera. He had a gout attack last year. He takes no hormones or supplements.\n\nReview of systems: no itching after showers, no burning in his hands or feet, no vision changes and no bleeding. He has a chronic cough with white sputum. He worked as a welder for 30 years.\n\nVitals: HR 88, BP 146/88, oxygen saturation 88% on room air.\nExam: Plethoric face. Barrel chest with prolonged expiration. No enlarged spleen.\n\nHb 182 g/L (ref 135-170)\nHematocrit 0.55\nWBC 8.1 × 10⁹/L (ref 4-10)\nPlatelets 260 × 10⁹/L (ref 150-450)\nSerum EPO high\nJAK2 V617F negative\n\nWhat is the most likely diagnosis?", "o": ["Chronic myeloid leukemia", "Essential thrombocythemia", "EPO-secreting renal tumour", "Polycythemia vera", "Secondary erythrocytosis"], "a": 4, "e": "Correct: E. An isolated high Hb with a high EPO, negative JAK2 and a clear hypoxic cause in COPD and smoking fits secondary erythrocytosis. Treat the underlying cause.\nA: CML gives a very high WBC with basophilia.\nB: ET mainly raises platelets.\nC: A tumour is possible with a high EPO, but his lung disease already explains it.\nD: PV has a low EPO, usually a JAK2 mutation, and often a high WBC and platelets.\nRed herring: His brother's PV and the gout attack tempt PV, but his JAK2 is negative and EPO is high. A clear hypoxic cause with an isolated high Hb means secondary erythrocytosis.\nTakeaway: Primary means low EPO. Secondary means normal or high EPO.", "l": ["W11 5.2", "W11 5.3"]}, {"c": "Myeloproliferative neoplasms", "p": "Hilda, 64, has polycythemia vera and a low serum EPO. Her son, a biology student, asks how her marrow can make so many red cells when her EPO is so low. He wonders if a hidden tumour is making EPO.\n\nWhy does the JAK2V617F mutation cause red cells to proliferate in polycythemia vera?", "o": ["The mutant receptor signals without EPO", "A tumour secretes EPO that drives the marrow", "A congenital EPOR mutation lowers the threshold", "The mutant receptor needs more EPO than normal"], "a": 0, "e": "Correct: A. JAK2V617F is an acquired somatic mutation in the negative regulatory JH2 pseudokinase domain. The receptor is always phosphorylated and on, so it signals the STAT, PI3K and RAS-MAPK pathways without EPO.\nB: Tumour EPO production is a secondary cause with normal or high EPO.\nC: EPOR mutations are a rare congenital primary cause, while JAK2V617F is acquired.\nD: This reverses the effect. The mutant does not require EPO at all.\nRed herring: A hidden EPO-secreting tumour would raise EPO, not lower it. The mutant receptor signals on its own, without EPO.\nTakeaway: JAK2V617F: valine to phenylalanine, acquired, constitutively on.", "l": ["W11 6.1"]}, {"c": "Leukemias", "p": "A medical student makes a table of the four leukemias. She writes that CLL is the most common overall, AML is most adult acute leukemia, and ALL is most childhood leukemia. Her classmate adds a fourth line about CML in children.\n\nWhich statement about the epidemiology of the four leukemias is FALSE?", "o": ["AML makes up 80% of acute adult leukemias", "ALL makes up 80% of childhood leukemias", "CML makes up 80% of childhood leukemias", "CLL is the most common leukemia overall"], "a": 2, "e": "Correct: C. CML accounts for only 5% of childhood leukemias. ALL makes up 80%.\nA: This is true. AML is 80% of acute adult leukemias.\nB: This is true. ALL is 80% of childhood leukemias.\nD: This is true. CLL is 30% of all leukemias, the most common.\nRed herring: Each true statement uses 80% or \"most common\", so the false one blends in. CML is only about 5% of childhood leukemias.\nTakeaway: Children get ALL. Older adults get CLL. Adults with acute leukemia mostly have AML.", "l": ["W11 3.1"]}, {"c": "Cancer therapy", "p": "A pharmacist checks three oncology orders. Patient 1 has multiple myeloma. Patient 2 has acute promyelocytic leukemia. Patient 3 has chronic lymphocytic leukemia. One order is for imatinib, which the pharmacist flags because none of these patients has CML.\n\nMatch each patient with the targeted therapy the notes list for their disease. Which pairing is correct, in order?", "o": ["Ibrutinib, ATRA, bortezomib", "Bortezomib, ATRA, ibrutinib", "Bortezomib, imatinib, ATRA", "ATRA, bortezomib, ibrutinib"], "a": 1, "e": "Correct: B. The notes list bortezomib (proteasome inhibitor) for MM, all-trans retinoic acid (ATRA) for APL, and ibrutinib (Bruton kinase inhibitor) for CLL.\nA: Ibrutinib is for CLL, and bortezomib is for MM.\nC: Imatinib treats CML, and ATRA is not a CLL drug.\nD: ATRA treats APL, not myeloma.\nRed herring: Imatinib is a famous targeted drug, which tempts you to place it, but it is for CML. Bortezomib is for myeloma, ATRA for APL and ibrutinib for CLL.\nTakeaway: Targeted therapy pairs: CML imatinib, APL ATRA, CLL ibrutinib, MM bortezomib.", "l": ["W11 8.5", "W11 4.4"]}, {"c": "Leukemias", "p": "Bruno, 58, has chronic-phase CML with t(9;22). His spleen is large and his WBC is 180. His cousin had AML and was treated with 7+3 induction. Bruno asks whether he needs the same.\n\nWhich therapy is the long-term mainstay for chronic phase CML?", "o": ["Chemotherapy with chlorambucil and fludarabine", "All-trans retinoic acid (ATRA)", "Induction with 7+3 chemotherapy", "A tyrosine kinase inhibitor (imatinib)"], "a": 3, "e": "Correct: D. The notes list tyrosine kinase inhibitors (imatinib, nilotinib, dasatinib) as the chronic treatment for CML, with prophylactic allopurinol.\nA: Chlorambucil and fludarabine are CLL chemotherapies.\nB: ATRA treats APL.\nC: 7+3 is AML induction.\nRed herring: His cousin's 7+3 is AML induction. CML in chronic phase is treated with a daily tyrosine kinase inhibitor.\nTakeaway: CML: a TKI for the long term, transplant as a possible cure.", "l": ["W11 3.3", "W11 8.4"]}, {"c": "Leukocytosis", "p": "Nadia, 19, has 1 week of fever, a very sore throat, fatigue and tender swollen neck nodes. Her roommate had the same illness last month. She was prescribed amoxicillin at a walk-in clinic and developed a rash. Her grandfather has CLL. She has had night sweats for 2 nights during the fevers.\n\nShe has had no weight loss. She is a university student and drinks on weekends.\n\nReview of systems: no cough, abdominal pain, joint pain or bleeding. She takes an oral contraceptive pill. She plays varsity volleyball and asks when she can return.\n\nVitals: HR 104, BP 114/70, T 38.7°C.\nExam: Large tonsils with exudate. Tender cervical nodes. Tender spleen tip. Faint rash on her trunk.\n\nHb 132 g/L (ref 115-160)\nWBC 13.8 × 10⁹/L (ref 4-10)\nLymphocytes high\nPlatelets 172 × 10⁹/L (ref 150-450)\nFilm: atypical lymphocytes surrounding the red cells. No smudge cells, no blasts.\n\nWhat is the most likely diagnosis?", "o": ["Acute lymphoblastic leukemia", "Chronic lymphocytic leukemia", "Hodgkin lymphoma", "Reactive neutrophilia", "EBV mononucleosis"], "a": 4, "e": "Correct: E. A young adult with fever, sore throat, tender nodes, a tender spleen and atypical lymphocytes surrounding red cells has EBV mononucleosis.\nA: ALL shows blasts.\nB: CLL affects older adults and shows smudge cells.\nC: Hodgkin lymphoma doesn't cause atypical lymphocytes in the blood.\nD: Her lymphocytes are high, not her neutrophils.\nRed herring: Night sweats tempt Hodgkin lymphoma, and her grandfather's CLL tempts CLL. Her sweats came with fevers, she is 19, and there are no smudge cells. Atypical lymphocytes with a rash after amoxicillin mean EBV mononucleosis.\nTakeaway: Confirm with a Monospot test. Do flow cytometry only if it persists past 4 to 6 weeks.", "l": ["W11 1.5", "W11 1.1"]}, {"c": "Emergencies", "p": "Ava, 19, started induction chemotherapy for ALL 2 days ago. She now has palpitations, muscle cramps and very little urine output. She had IV contrast for a CT 3 days ago. She has been vomiting and drinking little. She has no fever, bleeding or confusion.\n\nShe takes ondansetron. Allopurinol was not started. Her nurse notes dark, scanty urine.\n\nReview of systems: no bleeding, headache, chest pain or shortness of breath. She had a very high WBC and a large mediastinal mass at diagnosis. She lives with her parents.\n\nVitals: HR 112, BP 104/66, T 37.0°C.\nExam: Dry mucous membranes. No edema. Normal mental status.\nECG: peaked T waves.\n\nHb 88 g/L (ref 115-160)\nWBC 2.1 × 10⁹/L (ref 4-10)\nPlatelets 61 × 10⁹/L (ref 150-450)\nPotassium high\nPhosphate high\nUric acid high\nCalcium low\nCreatinine rising\n\nWhat is the most likely diagnosis?", "o": ["Febrile neutropenia", "Leukostasis", "Tumour lysis syndrome", "Disseminated intravascular coagulation"], "a": 2, "e": "Correct: C. Starting treatment for a leukemia, then high potassium, phosphate and urate, low calcium, a rising creatinine and arrhythmia risk fit tumour lysis syndrome. Dying tumour cells release their contents into the blood.\nA: Febrile neutropenia needs a fever.\nB: Leukostasis brings dyspnea, hypoxia and confusion with a very high blast count.\nD: DIC presents with bleeding.\nRed herring: The contrast and vomiting tempt a simple kidney injury from contrast or dehydration. Neither explains high phosphate, high uric acid and low calcium right after chemotherapy. That pattern means tumour lysis syndrome.\nTakeaway: Prevent and treat with hydration and allopurinol or rasburicase.", "l": ["W11 3.4"]}, {"c": "Emergencies", "p": "Omar, 45, has AML with a WBC of 210 and is short of breath and confused from leukostasis. The night resident writes orders and also considers the drug he used last week for another patient's high uric acid after chemotherapy.\n\nWhich of the following are part of the management of leukostasis?\ni) IV fluids\nii) Leukapheresis\niii) Cytoreduction\niv) Rasburicase", "o": ["i), ii) and iii) only", "ii), iii) and iv) only", "i), iii) and iv) only", "All of the above"], "a": 0, "e": "Correct: A. The notes list IV fluids, leukapheresis and cytoreduction for leukostasis.\nB: Rasburicase belongs to tumour lysis syndrome, and IV fluids are missing.\nC: Rasburicase belongs to tumour lysis syndrome, and leukapheresis is missing.\nD: Rasburicase is not part of the leukostasis plan.\nRed herring: Rasburicase treats tumour lysis syndrome, which the resident has just seen. It is not listed for leukostasis.\nTakeaway: Leukostasis: fluids, leukapheresis, cytoreduction. TLS: hydration, rasburicase, allopurinol, dialysis.", "l": ["W11 3.5"]}, {"c": "Leukemias", "p": "Leo, 4, has 3 weeks of pallor, bruising, limping from leg pain and two fevers. He had a viral illness with a sore throat a month ago, and his cousin recently had mononucleosis. His parents think the limp started after he fell at the playground. He is fully vaccinated.\n\nHe has been eating less and sleeping more. He has no cough or rash.\n\nReview of systems: no rash, joint swelling, diarrhea or blood in his urine. He was born at term and is meeting his milestones. His older brother is well.\n\nVitals: HR 134, T 37.8°C.\nExam: Pale. Petechiae on his legs. Enlarged neck nodes. Liver and spleen enlarged. Tender shins.\n\nChest X-ray: mediastinal mass.\n\nHb 68 g/L (ref 110-140)\nWBC 36 × 10⁹/L (ref 4-10)\nPlatelets 22 × 10⁹/L (ref 150-450)\nLDH high\nFilm: many blasts with no granules.\n\nWhat is the most likely diagnosis?", "o": ["Immune thrombocytopenia", "Infectious mononucleosis from EBV", "Acute myeloid leukemia", "Aplastic anemia", "Acute lymphoblastic leukemia"], "a": 4, "e": "Correct: E. A young child with marrow failure, bone pain, nodes, organ enlargement, a mediastinal mass and agranular blasts has ALL, 80% of childhood leukemias.\nA: ITP lowers platelets only.\nB: Mono shows atypical lymphocytes, not blasts.\nC: AML blasts often carry an Auer rod, and AML is 15% of childhood leukemias.\nD: Aplastic anemia shows no blasts or organ enlargement.\nRed herring: The playground fall explains the limp, and the cousin with mono tempts EBV. Mono does not cause blasts or a mediastinal mass. Agranular blasts with marrow failure in a young child mean ALL.\nTakeaway: Before chemotherapy, do a lumbar puncture to check for CNS involvement.", "l": ["W11 4.1", "W11 4.2"]}, {"c": "Cancer therapy", "p": "Selena, 40, takes pembrolizumab for relapsed Hodgkin lymphoma. She now has 6 watery stools a day. She finished amoxicillin for a sinus infection 1 week ago. Stool tests for infection are negative, and colonoscopy shows immune-mediated colitis.\n\nWhat is the best treatment for this toxicity?", "o": ["IV vancomycin", "Glucocorticoids", "IV rasburicase infusion", "Leukapheresis"], "a": 1, "e": "Correct: B. Pembrolizumab is an immune checkpoint inhibitor. It takes the brakes off the immune system, which causes immune toxicities such as colitis, pneumonitis, rash and hepatitis. These are treated with glucocorticoids.\nA: Vancomycin is added in febrile neutropenia with skin or line infection.\nC: Rasburicase treats tumour lysis syndrome.\nD: Leukapheresis treats leukostasis.\nRed herring: Recent antibiotics tempt C. difficile and vancomycin, but stool tests are negative and colonoscopy shows immune-mediated colitis from the checkpoint inhibitor.\nTakeaway: Checkpoint inhibitor toxicity is immune-mediated, so treat with steroids.", "l": ["W11 8.6"]}, {"c": "Neutropenia", "p": "Four patients on chemotherapy with an ANC under 0.5 report fevers to the oncology triage line. Each has taken a temperature at home.\n\nWhich one meets the definition of febrile neutropenia?", "o": ["38.1°C, a single oral reading", "37.9°C, sustained for 2 hours", "38.2°C, a single oral temperature reading", "38.0°C, sustained for over 1 hour"], "a": 3, "e": "Correct: D. Febrile neutropenia is a single oral temperature above 38.3°C, or 38.0°C or higher sustained over 1 hour.\nA: A single reading of 38.1°C is below the 38.3°C single-reading cutoff.\nB: 37.9°C never reaches 38.0°C, however long it lasts.\nC: A single 38.2°C reading is still below 38.3°C.\nRed herring: Several readings sit just above 38°C, which tempts you to pick them. Febrile neutropenia is a single oral reading above 38.3°C, or 38.0°C or higher sustained over 1 hour.\nTakeaway: Two ways in: one reading above 38.3°C, or 38.0°C or more for over an hour.", "l": ["W11 2.3"]}, {"c": "Neutropenia", "p": "Daniel, 34, has schizophrenia and started clozapine three months ago. His ANC is 0.8 × 10⁹/L. He has no fever. His sister has an autoimmune thyroid disease, and his last ANC before clozapine was 2.1.\n\nWhich description fits best?", "o": ["Moderate neutropenia from a medication", "Moderate neutropenia from a congenital cause", "Severe neutropenia from a medication", "Mild neutropenia from an autoimmune cause"], "a": 0, "e": "Correct: A. An ANC of 0.5 to 0.99 × 10^9/L is moderate neutropenia. Clozapine is a listed acquired toxin cause.\nB: A new drug and adult onset point to an acquired cause, not a congenital one.\nC: Severe neutropenia is below 0.5 × 10^9/L.\nD: Mild is 1 to 1.5 × 10^9/L, and nothing here suggests autoimmunity.\nRed herring: His sister's autoimmune disease tempts an autoimmune cause. His ANC was normal before clozapine, a listed drug cause, and 0.5 to 0.99 is moderate.\nTakeaway: ANC bands: mild 1 to 1.5, moderate 0.5 to 0.99, severe below 0.5.", "l": ["W11 2.1", "W11 2.2"]}, {"c": "APL", "p": "Two patients are diagnosed with APL in the same week.\n\nPatient 1: WBC 2.1 × 10⁹/L. Film shows promyelocytes packed with cytoplasmic granules.\nPatient 2: WBC 24 × 10⁹/L. Film shows promyelocytes with few granules.\n\nBoth have DIC and t(15;17).\n\nWhich subtypes fit, in order?", "o": ["Microgranular (M3v), hypergranular (M3)", "Hypergranular (M3), microgranular (M3v)", "Hypergranular (M3), hypergranular (M3)", "Monocytic (M4/M5), hypergranular (M3)"], "a": 1, "e": "Correct: B. The hypergranular or typical form (M3, 75% of cases) usually has a decreased WBC. The microgranular form (M3v, 25%) has a WBC above 10.\nA: This reverses the two subtypes.\nC: A high WBC with few granules fits M3v.\nD: M4 and M5 are monoblastic and monocytic leukemias, not APL.\nRed herring: A high WBC sounds like the typical leukemia picture, but in APL the typical hypergranular form has a low WBC. The microgranular form has a WBC above 10.\nTakeaway: APL: M3 has a low WBC and many granules. M3v has a high WBC and few granules.", "l": ["W11 9.5"]}, {"c": "Cancer therapy", "p": "Liam, 7, with ALL gets vincristine weekly during induction. He now has constipation and tingling in his fingers. His mother, a pharmacist, recalls that another drug class binds stabilized microtubules, and wonders if vincristine works the same way.\n\nHow does vincristine stop tumour cells from dividing?", "o": ["Binds stabilized microtubules so chromosomes cannot be pulled apart", "Interferes with normal nucleic acid metabolism", "Inhibits microtubule assembly in metaphase", "Crosslinks guanine so DNA cannot enter S phase"], "a": 2, "e": "Correct: C. Vincristine is a vinca alkaloid. Vinca alkaloids inhibit microtubule assembly in metaphase and disrupt M phase.\nA: Binding stabilized microtubules is the taxane mechanism (paclitaxel, docetaxel).\nB: Disrupted nucleic acid metabolism is the antimetabolite mechanism.\nD: Guanine crosslinking is the alkylating agent mechanism.\nRed herring: The option about stabilized microtubules describes a different class. Vinca alkaloids such as vincristine inhibit microtubule assembly in metaphase.\nTakeaway: Both vincas and taxanes block M phase, by opposite actions on microtubules.", "l": ["W11 7.6", "W11 7.3"]}, {"c": "Neutropenia", "p": "Aisha, 45, has AML on chemotherapy and presents with a fever of 38.6°C and an ANC of 0.2. She reports rectal pain on sitting. The resident wants to examine for a perianal abscess and also orders cultures and a chest X-ray.\n\nIn the initial assessment of a patient with febrile neutropenia, which action should be avoided?", "o": ["Blood and urine cultures", "Chest x-ray", "Inspection of IV catheter sites", "Digital rectal exam"], "a": 3, "e": "Correct: D. The notes specify the GI exam in febrile neutropenia is done with no DRE.\nA: Blood and urine cultures are part of the initial investigations.\nB: A chest x-ray is part of the initial investigations.\nC: Skin and indwelling IV catheter sites are part of the focused exam.\nRed herring: Her rectal pain tempts a digital rectal exam to look for an abscess. In febrile neutropenia, the GI exam is done with no DRE.\nTakeaway: Examine mouth, sinuses, lungs, abdomen, GU, skin and lines, but skip the DRE.", "l": ["W11 2.3"]}, {"c": "Leukocytosis", "p": "Three patients in clinic each have one raised white cell type.\n\nPatient 1: eosinophilia after starting penicillin. She also has a dog.\nPatient 2: basophilia with fatigue and cold intolerance. He has mild splenomegaly.\nPatient 3: monocytosis with a chronic cough and night sweats. She emigrated from a high-TB country.\n\nMatch each finding with a benign cause the notes list. Which pairing is correct, in order?", "o": ["Parasitic infection, drug reaction, hypothyroidism", "Drug reaction, hypothyroidism, chronic infection (TB)", "Hypothyroidism, drug reaction, chronic infection (TB)", "Drug reaction, chronic infection (TB), hypothyroidism"], "a": 1, "e": "Correct: B. Eosinophilia lists drug reaction (penicillin). Basophilia lists hypothyroidism. Monocytosis lists chronic infection (TB).\nA: Parasites cause eosinophilia, but the penicillin history points to a drug reaction, and the other two pairings are wrong.\nC: Hypothyroidism causes basophilia, not eosinophilia.\nD: TB causes monocytosis, and hypothyroidism causes basophilia.\nRed herring: Patient 2's splenomegaly tempts CML as the cause of basophilia. Cold intolerance and fatigue point to the listed benign cause, hypothyroidism.\nTakeaway: Eosinophils: drugs, allergy, parasites. Basophils: hypothyroidism. Monocytes: TB, endocarditis, IBD.", "l": ["W11 1.1"]}, {"c": "Leukemias", "p": "Noah, 6, is in remission from ALL after induction and consolidation. His parents hope treatment is nearly over, like his uncle's AML treatment, which finished in 5 months. They ask what comes next.\n\nAfter remission in childhood ALL, which describes the maintenance phase?", "o": ["No further treatment unless symptoms return", "Treatment ends after a 4 to 6 month course of chemotherapy", "Low-dose intermittent chemotherapy for 2 to 3 years", "A tyrosine kinase inhibitor taken indefinitely"], "a": 2, "e": "Correct: C. ALL follows the Dana-Farber protocol over 2 to 3 years. Maintenance gives low-dose intermittent chemotherapy over 2 to 3 years to prevent relapse.\nA: Watch and wait applies to low-risk, asymptomatic CLL.\nB: A 4 to 6 month course with 4 to 6 weeks in hospital is the AML timeline.\nD: Chronic tyrosine kinase inhibitor therapy is the CML approach.\nRed herring: His uncle's 5-month course matches AML, which tempts a short timeline. ALL maintenance is low-dose intermittent chemotherapy for 2 to 3 years.\nTakeaway: ALL treatment runs 2 to 3 years: induction, consolidation, then maintenance, plus CNS and testes prophylaxis.", "l": ["W11 4.3"]}, {"c": "Cancer therapy", "p": "Jade, 22, has ALL that relapsed after a stem cell transplant. Her team refers her for tisagenlecleucel (Kymriah). She asks whether it is \"another antibody like rituximab\".\n\nWhich description fits this therapy?", "o": ["Modified T cells made from the patient's own blood", "An antibody linking a tumour marker to a T cell", "An antibody that carries a radioisotope to CD markers", "A naked monoclonal antibody that targets CD20"], "a": 0, "e": "Correct: A. Tisagenlecleucel is a CAR-T cell therapy, listed for ALL and relapsed DLBCL. CAR-T cells are genetically modified T cells from the patient's own blood.\nB: Linking a tumour marker to a cytotoxic T cell describes a bi-specific antibody.\nC: A radioisotope-carrying antibody is a conjugated antibody, such as Zevalin.\nD: A naked CD20 antibody is rituximab.\nRed herring: Her comparison to rituximab tempts a naked monoclonal antibody. Tisagenlecleucel is a CAR-T therapy: modified T cells from her own blood.\nTakeaway: CAR-T: the patient's own T cells, modified to attack the cancer.", "l": ["W11 8.4", "W11 8.6"]}, {"c": "Trial design", "p": "In a 3-year trial of 600 patients with myeloma, relapse occurs in 20% of the control group and 15% of the treatment group. Overall survival is similar, and grade 3 side effects occur in 12% of treated patients.\n\nWhich set of results is correct?", "o": ["ARR 5%, RRR 75%, NNT 20", "ARR 25%, RRR 5%, NNT 4", "ARR 15%, RRR 25%, NNT 7", "ARR 5%, RRR 25%, NNT 20"], "a": 3, "e": "Correct: D. ARR = 20% minus 15% = 5%. RR = 15 ÷ 20 = 0.75, so RRR = 1 minus 0.75 = 25%. NNT is the number treated to prevent one bad outcome, 1 ÷ 0.05 = 20.\nA: 75% is the relative risk, not the relative risk reduction.\nB: This swaps ARR and RRR.\nC: 15% is the treatment group's risk, not the ARR.\nRed herring: The side effect rate and survival are extra numbers. Use only the relapse rates: ARR 5%, RR 0.75, RRR 25%, NNT 20.\nTakeaway: ARR is a subtraction. RRR = 1 minus RR. NNT = 1 ÷ ARR.", "l": ["W11 11.3"]}, {"c": "Leukemias", "p": "Mei, 58, has 2 weeks of fatigue, fevers, easy bruising and pain over her breastbone. She has gum swelling, which her dentist treated as gingivitis, and a few purple skin nodules. She takes warfarin for atrial fibrillation, and her INR is in range. Her sister has ITP.\n\nShe has had no weight loss. She works as a hairdresser and has used hair dyes for 30 years.\n\nReview of systems: no cough, chest pain, headache or blood in her urine or stool. She lives with her husband and does not smoke. Her last CBC 2 years ago was normal.\n\nVitals: HR 108, BP 118/74, T 38.2°C.\nExam: Petechiae. Swollen, infiltrated gums. Purple skin nodules. Tender sternum. No lymph nodes.\n\nHb 76 g/L (ref 115-160)\nWBC 54 × 10⁹/L (ref 4-10)\nPlatelets 24 × 10⁹/L (ref 150-450)\nLDH high\nUric acid high\nFilm: many large blast cells, one with an Auer rod.\nFlow cytometry: myeloid blasts.\n\nWhat is the most likely diagnosis?", "o": ["Acute lymphoblastic leukemia", "Chronic lymphocytic leukemia", "Myelodysplastic syndrome", "Chronic myeloid leukemia", "Acute myeloid leukemia"], "a": 4, "e": "Correct: E. Marrow failure, sternal tenderness, gum and skin infiltration, and large myeloid blasts with an Auer rod fit AML, 80% of acute leukemias in adults.\nA: ALL blasts have no granules or Auer rods.\nB: CLL shows mature lymphocytes and smudge cells.\nC: MDS doesn't have this many blasts.\nD: CML shows mature myeloid cells with basophilia.\nRed herring: Warfarin tempts drug-related bruising, and her sister's ITP tempts ITP. ITP does not cause blasts or gum infiltration. Myeloid blasts with an Auer rod mean AML.\nTakeaway: AML induction is 7+3 chemotherapy.", "l": ["W11 3.2", "W11 1.2"]}, {"c": "Thrombocytosis", "p": "Ruth, 58, has episodes of burning, red toes and two brief spells of blurred vision. She had a total knee replacement 2 months ago. She has psoriasis that flares in winter. Her brother has CML. She has no heavy periods, infection or cancer.\n\nShe takes no regular medications. She does not smoke.\n\nReview of systems: no headaches, chest pain, bleeding or bone pain. Her periods stopped at 51. She walks 5 km daily and has no history of clots.\n\nVitals: HR 72, BP 136/82.\nExam: Warm, red toes. Mild psoriatic plaques on her elbows. No enlarged spleen.\n\nHb 134 g/L (ref 115-160)\nWBC 8.0 × 10⁹/L (ref 4-10)\nPlatelets 720 × 10⁹/L (ref 150-450)\nFerritin normal\nCRP normal\nCALR positive\nMarrow: increased enlarged, mature megakaryocytes with hyperlobulated nuclei.\n\nWhat is the most likely diagnosis?", "o": ["Early primary myelofibrosis", "Chronic myeloid leukemia", "Reactive thrombocytosis", "Polycythemia vera", "Essential thrombocythemia"], "a": 4, "e": "Correct: E. A platelet count of 450 or more with erythromelalgia and ocular migraines, a CALR mutation, big hyperlobulated megakaryocytes and no reactive cause fits essential thrombocythemia.\nA: Myelofibrosis shows teardrop cells and marrow fibrosis.\nB: CML gives a high WBC with basophilia.\nC: Her iron, CRP and history rule out a reactive cause.\nD: PV needs a high Hb.\nRed herring: The knee surgery and psoriasis tempt reactive thrombocytosis, but her CRP is normal and the surgery was 2 months ago. Her brother's CML tempts CML, but her WBC is normal. A CALR mutation with hyperlobulated megakaryocytes means ET.\nTakeaway: ET carries a risk of both thrombosis and bleeding.", "l": ["W11 6.4", "W11 6.2"]}, {"c": "Marrow testing", "p": "A 70-year-old's marrow core biopsy shows 70% cellularity. The myeloid to erythroid ratio is 2:1. His resident thinks 70% sounds normal because a textbook figure for a young adult is about 50 to 70%.\n\nHow should you interpret the biopsy?", "o": ["Normal cellularity for age, normal M:E ratio", "Normal cellularity, low M:E ratio", "Hypocellular for age, high M:E ratio", "Hypercellular for age, normal M:E ratio"], "a": 3, "e": "Correct: D. Expected cellularity is 100 minus age, so 30% for a 70-year-old. 70% is hypercellular. A ratio of 2:1 sits within the normal 1:1 to 3:1 range.\nA: 70% is far above the expected 30%.\nB: 70% is not low for a 70-year-old, and 2:1 is normal.\nC: The marrow is more cellular than expected, and 2:1 is normal.\nRed herring: The young-adult figure tempts \"normal\". Expected cellularity is 100 minus age, about 30% at 70, so 70% is hypercellular.\nTakeaway: Marrow cellularity = 100 minus age. Normal M:E ratio is 1:1 to 3:1.", "l": ["W11 9.3"]}, {"c": "Pancytopenia", "p": "Four patients have pancytopenia. One has aplastic anemia, one has myelofibrosis, one has B12 deficiency, and one has a massive spleen from portal hypertension.\n\nWhich of the following cause pancytopenia through decreased production?\ni) Aplastic anemia\nii) Myelofibrosis\niii) Vitamin deficiencies\niv) Splenomegaly", "o": ["ii), iii) and iv) only", "i), ii) and iv) only", "i), ii) and iii) only", "All of the above"], "a": 2, "e": "Correct: C. Aplastic anemia, myelofibrosis and vitamin deficiencies are listed under decreased production.\nA: Splenomegaly causes sequestration, and aplastic anemia is missing.\nB: Splenomegaly causes pancytopenia by sequestration, not decreased production.\nD: Splenomegaly belongs to sequestration.\nRed herring: A massive spleen does cause pancytopenia, which tempts you to include it, but through sequestration, not decreased production.\nTakeaway: Pancytopenia: decreased production, increased destruction, or sequestration.", "l": ["W11 9.1"]}, {"c": "APL", "p": "Isabel, 38, has 5 days of gum bleeding, heavy bruising and a nosebleed that won't stop. Today she has a sudden headache. She started an oral contraceptive pill last month. She had a flu-like illness a week ago. Her mother had ITP.\n\nShe takes ibuprofen for headaches. She has no weight loss.\n\nReview of systems: no fevers, weight loss, bone pain or blood in her urine. She works as a teacher. She does not smoke or drink. She has no known exposures to chemicals or radiation.\n\nVitals: HR 112, BP 142/88, T 37.6°C.\nExam: Petechiae. Oozing gums. No enlarged nodes or spleen.\n\nHb 84 g/L (ref 115-160)\nWBC 1.9 × 10⁹/L (ref 4-10)\nPlatelets 19 × 10⁹/L (ref 150-450)\nPT/INR 1.9\nFibrinogen 0.8 g/L\nD-dimer high\nFilm: abnormal promyelocytes, several with multiple Auer rods in one cell.\nFlow cytometry: HLA-DR negative.\n\nWhat is the most likely diagnosis?", "o": ["Immune thrombocytopenia", "Chronic myeloid leukemia", "Aplastic anemia", "Acute lymphoblastic leukemia", "Acute promyelocytic leukemia"], "a": 4, "e": "Correct: E. Pancytopenia with DIC, blasts with 2 or more Auer rods and HLA-DR negative flow fit APL. Its main early danger is fatal bleeding, often in the brain.\nA: ITP has normal clotting tests and no abnormal cells.\nB: CML gives a high WBC with basophilia.\nC: Aplastic anemia has no abnormal cells or DIC.\nD: ALL blasts have no granules or Auer rods.\nRed herring: Her mother's ITP, the viral illness and ibuprofen all point to ITP. ITP leaves clotting tests normal. DIC with abnormal promyelocytes and multiple Auer rods means APL, an emergency.\nTakeaway: Confirm with t(15;17) or PML/RARα, and start ATRA.", "l": ["W11 9.5", "W11 9.6"]}, {"c": "Myeloproliferative neoplasms", "p": "George, 70, has 6 months of fatigue, early satiety, night sweats and weight loss. He had prostate cancer treated 10 years ago, with normal PSA tests since. He had TB as a child. He drinks 3 beers a day.\n\nHe has had no bone pain or bleeding. He takes tamsulosin.\n\nReview of systems: no fevers, bleeding, bone pain or cough. He lives with his wife and still drives. He does not smoke. His last CBC 3 years ago showed only a mild anemia.\n\nVitals: HR 92, BP 124/76, T 37.2°C.\nExam: Pale. Spleen reaches his pelvis. No lymph nodes.\n\nHb 88 g/L (ref 135-170)\nWBC 3.1 × 10⁹/L (ref 4-10)\nPlatelets 84 × 10⁹/L (ref 150-450)\nLDH high\nJAK2 V617F positive\nFilm: teardrop cells, nucleated red cells and immature myeloid cells.\nMarrow core biopsy: marrow fibrosis.\n\nWhat is the most likely diagnosis?", "o": ["Chronic myeloid leukemia", "Myelophthisis from metastatic cancer", "Myelodysplastic syndrome", "Aplastic anemia", "Primary myelofibrosis"], "a": 4, "e": "Correct: E. Pancytopenia from marrow fibrosis, a massive spleen, teardrop cells with a leukoerythroblastic picture and a JAK2 mutation fit primary myelofibrosis.\nA: CML gives a high WBC with basophilia.\nB: Myelophthisis also shows teardrop cells, but he has no cancer history, and the JAK2 mutation points to an MPN.\nC: MDS shows dysplasia, not marrow fibrosis with a massive spleen.\nD: Aplastic anemia shows a fatty, empty marrow and no large spleen.\nRed herring: His old prostate cancer and TB tempt myelophthisis from infiltration. His PSA is normal, and a JAK2 mutation with marrow fibrosis and a massive spleen means primary myelofibrosis.\nTakeaway: Allogeneic stem cell transplant is the only cure.", "l": ["W11 6.3", "W11 9.1"]}, {"c": "Leukemias", "p": "Harold, 74, has a CBC at his annual physical. He feels well, with no fever, weight loss or night sweats. He had a chest cold 2 weeks ago. His granddaughter had mono last month. He takes ramipril.\n\nHe walks daily and plays bridge. He does not smoke.\n\nReview of systems: no bone pain, bleeding, rash or recurrent infections. His wife is well. He has had no recent travel. His last CBC 5 years ago showed a WBC of 11.\n\nVitals: HR 72, BP 132/78, T 36.6°C.\nExam: Small, painless nodes in both armpits. No enlarged liver or spleen.\n\nHb 138 g/L (ref 135-170)\nWBC 32 × 10⁹/L (ref 4-10)\nLymphocytes 28 × 10⁹/L, mature-looking\nPlatelets 205 × 10⁹/L (ref 150-450)\nFilm: many small mature lymphocytes and smudge cells.\nFlow cytometry: clonal B cells that are CD5, CD19, dim CD20 and CD23 positive.\n\nWhat is the most likely diagnosis?", "o": ["Infectious mononucleosis", "Chronic lymphocytic leukemia", "Reactive lymphocytosis", "Chronic myeloid leukemia", "Acute lymphoblastic leukemia"], "a": 1, "e": "Correct: B. An older man with a high count of mature lymphocytes, smudge cells and clonal B cells with the CD5, CD19, dim CD20 and CD23 pattern has CLL, the most common leukemia.\nA: Mononucleosis shows atypical lymphocytes in a young person and is not clonal.\nC: A reactive lymphocytosis is not clonal.\nD: CML raises myeloid cells with basophilia.\nE: ALL shows blasts.\nRed herring: The chest cold and his granddaughter's mono tempt a reactive lymphocytosis. Reactive cells are not clonal. Smudge cells with clonal CD5 and CD23 positive B cells mean CLL.\nTakeaway: Don't treat low-risk, asymptomatic CLL.", "l": ["W11 3.2", "W11 3.1"]}, {"c": "Leukocytosis", "p": "Sofia, 30, has 4 days of fever, cough with green sputum and pain on breathing in. She takes prednisone for asthma flares and finished a course yesterday. Her aunt has CML. She has smoked a pack a day for 10 years.\n\nShe has no weight loss, night sweats or enlarged spleen.\n\nReview of systems: no rash, joint pain, bleeding or abdominal pain. She works as a nurse and has had no recent travel. Her last CBC a year ago was normal.\n\nVitals: HR 108, RR 24, T 38.9°C, oxygen saturation 93%.\nExam: Crackles at the left base. No splenomegaly.\n\nChest X-ray: left lower lobe consolidation.\n\nHb 128 g/L (ref 115-160)\nWBC 18 × 10⁹/L (ref 4-10)\nNeutrophils 15 × 10⁹/L, with bands\nBasophils normal\nEosinophils normal\nPlatelets 390 × 10⁹/L (ref 150-450)\nFilm: toxic granules, toxic vacuoles and Döhle bodies. No myeloblasts or promyelocytes.\n\nWhat is the most likely diagnosis?", "o": ["Reactive neutrophilia", "Acute myeloid leukemia", "Leukostasis", "Chronic neutrophilic leukemia", "Chronic myeloid leukemia"], "a": 0, "e": "Correct: A. Mature neutrophils with a left shift, toxic changes, no blasts or promyelocytes, and an obvious pneumonia fit a secondary, reactive neutrophilia.\nB: AML shows blasts.\nC: Leukostasis needs a very high blast count.\nD: Primary neutrophilia shows immature myeloid cells, often with a WBC over 30.\nE: CML shows basophilia, eosinophilia and myelocytes, often with a large spleen.\nRed herring: Her aunt's CML tempts CML, but she has normal basophils, no splenomegaly and no immature cells. Recent prednisone also raises neutrophils. Toxic changes with pneumonia mean a reactive neutrophilia.\nTakeaway: Primary neutrophilia: immature cells and often a WBC over 30.", "l": ["W11 1.4", "W11 1.1"]}, {"c": "Leukemias", "p": "Rajiv, 68, has 2 months of night sweats, weight loss and a dragging feeling under his left ribs. He had a dental abscess 3 weeks ago. He has hypothyroidism on levothyroxine. His brother had lymphoma.\n\nHe has no fevers or current infections. He takes no other medications.\n\nReview of systems: no bone pain, bleeding, cough or abdominal pain. He works as a lawyer and does not smoke. His appetite is lower because he feels full quickly.\n\nVitals: HR 86, BP 130/80, T 36.9°C.\nExam: Spleen palpable 8 cm below the costal margin. No lymph nodes.\n\nHb 118 g/L (ref 135-170)\nWBC 148 × 10⁹/L (ref 4-10)\nBasophils increased\nEosinophils increased\nPlatelets 610 × 10⁹/L (ref 150-450)\nFilm: a bimodal spread of myelocytes and neutrophils, few blasts. No toxic granules.\n\nWhat is the most likely diagnosis?", "o": ["Primary myelofibrosis", "Chronic lymphocytic leukemia", "Reactive neutrophilia", "Acute myeloid leukemia", "Chronic myeloid leukemia"], "a": 4, "e": "Correct: E. A very high WBC with basophilia, eosinophilia, thrombocytosis and a bimodal spread of myelocytes and neutrophils, plus a large spleen, fits chronic phase CML.\nA: Myelofibrosis gives cytopenias and teardrop cells.\nB: CLL raises mature lymphocytes, with smudge cells.\nC: A reactive neutrophilia has no basophilia and shows toxic granules, with a clear trigger.\nD: AML shows many large blasts.\nRed herring: The dental abscess tempts a reactive neutrophilia, but there are no toxic granules and the WBC is 148. Hypothyroidism is a benign cause of basophilia, but not with this count. A bimodal spread with basophils and a big spleen means CML.\nTakeaway: Confirm with FISH for t(9;22) BCR-ABL.", "l": ["W11 3.2", "W11 1.1"]}];
const OBJECTIVES = {"W11 1.1": "Identify and analyze abnormalities on complete blood count (CBC) to formulate differential diagnoses for leukocytosis.", "W11 1.2": "Identify acute leukemias based on investigation.", "W11 1.3": "Identify possible complication of leukocytosis.", "W11 1.4": "List the differential diagnoses of neutrophilia.", "W11 1.5": "List the differential diagnoses of lymphocytosis.", "W11 2.1": "Identify and analyze abnormalities on complete blood count (CBC) to formulate differential diagnoses for leukocytopenia.", "W11 2.2": "List the differential diagnoses for neutropenia.", "W11 2.3": "Describe management of neutropenia.", "W11 3.1": "Compare and contrast the four different leukemias according to cell lineage and natural history.", "W11 3.2": "List and interpret the clinical symptoms and laboratory findings in each of: chronic lymphocytic leukemia, chronic myeloid leukemia, acute lymphocytic leukemia and acute myeloid leukemia.", "W11 3.3": "Explain principle of treatment options and patient management.", "W11 3.4": "Identify and manage tumour lysis syndrome.", "W11 3.5": "Identify and manage leukostasis.", "W11 4.1": "Identify the common presentations of leukemia in childhood.", "W11 4.2": "Describe risk features of acute lymphoblastic leukemia.", "W11 4.3": "Describe the principles of treatment of ALL.", "W11 4.4": "Explain role of targeted therapy for leukemia.", "W11 5.2": "Formulate differential diagnoses for erythrocytosis and thrombocytosis.", "W11 5.3": "List and interpret the clinical findings important in determining the etiology of erythrocytosis and/or thrombocytosis.", "W11 6.1": "Discuss the “stem cell” as an origin for myeloproliferative neoplasms", "W11 6.2": "Distinguish the common features of the myeloproliferative neoplasms", "W11 6.3": "Compare and contrast the clinical presentations of the different myeloproliferative neoplasms.", "W11 6.4": "Describe how to reach the diagnosis of each myeloproliferative neoplasm.", "W11 6.5": "List the gene mutations characteristic of CML, PV and ET.", "W11 7.3": "Describe the cell cycle and the specificity (or lack thereof) of antineoplastic drugs for cells in specific stages in the cycle.", "W11 7.5": "Define the major classes of antineoplastic drugs used in cancer chemotherapy.", "W11 7.6": "Define the mechanism(s) of action of the designated major classes of antineoplastic drugs.", "W11 7.7": "Describe the major toxicities exhibited by the designated classes of antineoplastic drugs", "W11 8.1": "Describe the role of surgery in hematological malignancies.", "W11 8.2": "Describe the role of radiation in treatment of hematological malignancies.", "W11 8.4": "Define targeted therapy.", "W11 8.5": "Give examples of targeted therapies for B cell malignancies, chronic myeloid leukemia, acute promyelocytic leukemia, and multiple myeloma.", "W11 8.6": "List different classes of immunotherapy.", "W11 8.7": "Describe the rationale for stem cell transplantation", "W11 9.1": "List differential diagnoses of pancytopenia.", "W11 9.3": "List and describe appropriate testing for suspected bone marrow disorder.", "W11 9.5": "Describe laboratory abnormalities of acute promyelocytic leukemia.", "W11 9.6": "Describe the clinical relevance of the genetic abnormalities in myelodysplastic syndrome and acute promyelocytic leukemia.", "W11 11.1": "Describe advantages and disadvantages in the study design.", "W11 11.2": "Discuss factors influencing the sample size calculation.", "W11 11.3": "Calculate relative risk reduction, absolute risk reduction and number- needed-to-treat.", "W11 11.4": "List differences between trial designed to show “non-inferiority” versus “superiority”."};
const L = "ABCDE";
const N = QUESTIONS.length;
let cur = 0, showResults = false;
let ans = new Array(N).fill(null);           // current pick per question
let tries = QUESTIONS.map(()=>[]);           // every locked attempt: {pick, ok, at}
let strikes = QUESTIONS.map(()=>[]);         // struck option indexes for the open attempt
let history = [], db = null, uid = null, writing = false, dirty = false;
const MAP=document.getElementById("map"); if(MAP && QUESTIONS.length<=60) MAP.open=true;
const LS_KEY = "differential-week-11-question-bank";
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");

function score(){ return ans.reduce((n,a,i)=>n+(a!==null&&a===QUESTIONS[i].a?1:0),0); }
function answered(){ return ans.filter(a=>a!==null).length; }
function firstTryScore(){ return tries.reduce((n,t)=>n+(t.length&&t[0].ok?1:0),0); }
function firstTryCount(){ return tries.filter(t=>t.length).length; }

function renderHeader(){
  const bf=$("#barfill"); if(bf) bf.style.width=(100*answered()/N)+"%";
  $("#stats").innerHTML = `<span>Question <b>${showResults?"–":cur+1}</b> of <b>${N}</b></span><span>Answered <b>${answered()}</b></span><span>Score <b>${score()} / ${answered()}</b></span>`;
  $("#ticks").innerHTML = QUESTIONS.map((q,i)=>{
    const st = ans[i]===null?"":(ans[i]===q.a?"ok":"bad");
    const redo = tries[i].length>1 || (ans[i]===null && tries[i].length>0);
    return `<button class="tick ${st} ${redo?"redo":""} ${(!showResults&&i===cur)?"cur":""}" data-i="${i}" aria-label="Question ${i+1}"></button>`;
  }).join("");
  document.querySelectorAll(".tick").forEach(b=>b.onclick=()=>{cur=+b.dataset.i;showResults=false;render();});
}

function triesLine(i, includeCurrent){
  const t = includeCurrent ? tries[i] : tries[i];
  if(!t.length) return "";
  const parts = t.map((x,k)=>`<span class="${x.ok?"ok":"bad"}">${k+1}: ${L[x.pick]} ${x.ok?"correct":"wrong"}</span>`).join(" · ");
  return `<div class="tries">Attempts ${parts}</div>`;
}

function fmtLine(t){
  let m;
  if((m=t.match(/^Correct:\s*([A-E])\.?\s*(.*)$/)) || (m=t.match(/^([A-E]) is correct\.?\s*(.*)$/)))
    return `<p class="why"><span class="lk ok">${m[1]}</span><span>${esc(m[2])}</span></p>`;
  if((m=t.match(/^([A-E]):\s*(.*)$/)))
    return `<p class="alt"><span class="lk">${m[1]}</span><span>${esc(m[2])}</span></p>`;
  if((m=t.match(/^(Takeaway|High yield|High-yield|Key point|Clues):\s*(.*)$/i)))
    return `<p class="take"><b>${esc(m[1])}.</b> ${esc(m[2])}</p>`;
  return `<p>${esc(t)}</p>`;
}

function renderQ(){
  const q = QUESTIONS[cur], a = ans[cur], done = a!==null, st = strikes[cur];
  const opts = q.o.map((o,i)=>{
    let c = "";
    if(done){ if(i===q.a) c="right"; else if(i===a) c="wrong"; }
    const struck = !done && st.includes(i);
    const strikeBtn = done ? "" : `<button class="strike" data-s="${i}" aria-pressed="${struck}" aria-label="${struck?"Restore":"Strike out"} option ${L[i]}" title="${struck?"Restore":"Strike out"} option">${struck?"↺":"✕"}</button>`;
    return `<div class="optrow ${struck?"struck":""}"><button class="opt ${c}" data-i="${i}" ${done?"disabled":""}><span class="k">${L[i]}</span><span>${esc(o)}</span></button>${strikeBtn}</div>`;
  }).join("");
  let fb = "";
  if(done){
    const ok = a===q.a;
    const lines = q.e.split("\n").map(fmtLine).join("");
    const objs = q.l.map(id=>`<div class="obj"><b>Objective ${esc(id)}</b> ${esc(OBJECTIVES[id]||"")}</div>`).join("");
    fb = `<div class="fb" role="status"><div class="verdict ${ok?"ok":"bad"}">${ok?"Correct.":"Incorrect. The answer is "+L[q.a]+"."}</div>${lines}${objs}${triesLine(cur)}<div class="fbtools"><button class="btn ghost" id="redo">Reset and redo this question</button></div></div>`;
  }
  const pre = (!done && tries[cur].length) ? `<div class="hint">Redo. Your earlier attempts are saved.</div>${triesLine(cur)}` : (!done ? `<div class="hint">Tap ✕ to strike out an option. Right-click works too.</div>` : "");
  const last = cur===N-1;
  $("#main").innerHTML = `<article class="card">
    <div class="chead"><span class="tag">${esc(q.c)}</span><span class="chead-r">${ankiButton(cur)}<span class="qn">${cur+1} of ${N}</span></span></div>
    <p class="stem">${esc(q.p)}</p>
    ${pre}
    <div class="opts">${opts}</div>
    <div class="offrow">${offButton(cur)}</div>${fb}
    <div class="nav"><button class="btn ghost" id="prev" ${cur===0?"disabled":""}>Previous</button>
    <button class="btn" id="next" ${done?"":"disabled"}>${last?"See results":"Next"}</button></div>
  </article>`;
  document.querySelectorAll(".opt").forEach(b=>{
    b.onclick=()=>{ const p=+b.dataset.i; ans[cur]=p; tries[cur].push({pick:p, ok:p===q.a, at:new Date().toISOString()}); tries[cur]=tries[cur].slice(-10); strikes[cur]=[]; render(false); persist(); };
    b.oncontextmenu=(e)=>{ if(done) return; e.preventDefault(); toggleStrike(+b.dataset.i); };
  });
  document.querySelectorAll(".strike").forEach(b=>b.onclick=()=>toggleStrike(+b.dataset.s));
  const ab=$("#anki"); if(ab) ab.onclick=()=>ankiToggle(cur);
  const ob=$("#off"); if(ob) ob.onclick=()=>offToggle(cur);
  const r=$("#redo"); if(r) r.onclick=()=>{ ans[cur]=null; strikes[cur]=[]; render(false); persist(); };
  $("#prev").onclick=()=>{cur--;render();};
  $("#next").onclick=()=>{ if(last){showResults=true;} else cur++; render(); };
}

function toggleStrike(i){
  const s = strikes[cur], k = s.indexOf(i);
  if(k<0) s.push(i); else s.splice(k,1);
  render(false); persist();
}

function renderResults(){
  const s = score(), pct = Math.round(100*s/N);
  const cats = {};
  QUESTIONS.forEach((q,i)=>{ cats[q.c]=cats[q.c]||[0,0]; cats[q.c][1]++; if(ans[i]===q.a) cats[q.c][0]++; });
  const rows = Object.entries(cats).map(([c,[r,t]])=>`<tr><td>${esc(c)}<span class="meter"><i style="width:${Math.round(100*r/t)}%"></i></span></td><td>${r} / ${t}</td></tr>`).join("");
  const missed = {};
  QUESTIONS.forEach((q,i)=>{ const wrongFirst = tries[i].length && !tries[i][0].ok; if(ans[i]!==q.a || wrongFirst) q.l.forEach(id=>{ const w=id.split(" ")[0]; missed[w]=missed[w]||new Set(); missed[w].add(id); }); });
  const weeks = Object.keys(missed).sort((x,y)=>parseInt(x.slice(1))-parseInt(y.slice(1)));
  const missHtml = weeks.length ? weeks.map(w=>`<h3>Week ${w.slice(1)}</h3><ul class="miss">${[...missed[w]].map(id=>`<li><code>${esc(id)}</code>${esc(OBJECTIVES[id]||"")}</li>`).join("")}</ul>`).join("") : "<p>No missed objectives.</p>";
  const redone = tries.filter(t=>t.length>1).length;
  const un = N - answered();
  $("#main").innerHTML = `<article class="card">
    <div class="chead"><span class="tag">Results</span><span>${un?un+" unanswered":"Complete"}</span></div>
    <div><div class="big">${s} / ${N}</div><div class="stats"><span><b>${pct}%</b> correct now</span><span>First try <b>${firstTryScore()} / ${firstTryCount()}</b></span><span>Redone <b>${redone}</b></span></div></div>
    <table><thead><tr><th>Topic</th><th>Score</th></tr></thead><tbody>${rows}</tbody></table>
    ${ankiMissedRow()}<h2>Objectives to review</h2><p class="hint">Includes questions you missed on the first try, even if a redo got them right.</p>${missHtml}${history.length?`<h2>Past attempts</h2><table><thead><tr><th>Date</th><th>Score</th></tr></thead><tbody>${history.slice().reverse().map(h=>`<tr><td>${new Date(h.date).toLocaleDateString()}</td><td>${h.score} / ${h.total}</td></tr>`).join("")}</tbody></table>`:""}
    <div class="nav"><button class="btn ghost" id="back">Back to questions</button><button class="btn" id="restart">Restart all</button></div>
  </article>`;
  $("#back").onclick=()=>{showResults=false;render();};
  const am=$("#ankimissed"); if(am) am.onclick=()=>{ ankiAdd(missedIdx()); renderResults(); };
  $("#restart").onclick=resetAll;
}
/* Clear every answer, redo and strike-out. The attempt is kept in Past attempts. Flags are not touched. */
function resetAll(){
  if(answered() || tries.some(t=>t.length)){
    history.push({date:new Date().toISOString(), score:score(), answered:answered(), total:N, firstTry:firstTryScore(),
      missed:QUESTIONS.map((q,i)=>ans[i]!==null&&ans[i]!==q.a?"q"+(i+1):null).filter(Boolean)});
    history=history.slice(-20);
  }
  ans.fill(null); tries=QUESTIONS.map(()=>[]); strikes=QUESTIONS.map(()=>[]); cur=0; showResults=false; render(); persist();
}
/* Header button: first tap arms it, second tap within 4 seconds resets. No browser dialog. */
(function(){
  const b=document.getElementById("resetall"); let timer=null;
  const disarm=()=>{ b.classList.remove("armed"); b.textContent="Reset all answers"; clearTimeout(timer); timer=null; };
  b.onclick=()=>{
    if(!b.classList.contains("armed")){ b.classList.add("armed"); b.textContent="Tap again to reset"; timer=setTimeout(disarm,4000); return; }
    disarm(); resetAll(); setSave("All answers cleared. Your score is saved in Past attempts.","ok");
  };
})();

function setSave(text, cls){ const el=$("#save"); if(el){ el.textContent=text; el.className="save "+(cls||""); } }
function bodyOf(){
  const a = {};
  QUESTIONS.forEach((q,i)=>{
    if(ans[i]===null && !tries[i].length && !strikes[i].length) return;
    a["q"+(i+1)] = {pick:ans[i], ok:ans[i]!==null && ans[i]===q.a, l:q.l, tries:tries[i], strikes:strikes[i]};
  });
  return {answers:a, history, total:N, answered:answered(), score:score(), firstTry:firstTryScore(), updatedAt:new Date().toISOString()};
}
function validPick(i,p){ return Number.isInteger(p) && p>=0 && p<QUESTIONS[i].o.length; }
function applySaved(d){
  if(!d || typeof d!=="object") return;
  ans.fill(null); tries=QUESTIONS.map(()=>[]); strikes=QUESTIONS.map(()=>[]);
  const a = d.answers || {};
  for(const k in a){
    const i = parseInt(k.slice(1),10)-1, row = a[k];
    if(!(i>=0 && i<N) || !row || typeof row!=="object") continue;
    if(validPick(i,row.pick)) ans[i]=row.pick;
    if(Array.isArray(row.tries)) tries[i]=row.tries.filter(t=>t&&validPick(i,t.pick)).map(t=>({pick:t.pick, ok:t.pick===QUESTIONS[i].a, at:String(t.at||"")})).slice(-10);
    else if(ans[i]!==null) tries[i]=[{pick:ans[i], ok:ans[i]===QUESTIONS[i].a, at:""}];
    if(Array.isArray(row.strikes)) strikes[i]=row.strikes.filter(x=>validPick(i,x));
  }
  history = Array.isArray(d.history) ? d.history.slice(-20) : [];
  const first = ans.findIndex(x=>x===null); cur = first<0 ? N-1 : first;
}
function lsLoad(){ try{ return JSON.parse(localStorage.getItem(LS_KEY)||"null"); }catch(e){ return null; } }
function lsSave(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(bodyOf())); }catch(e){} }
async function persist(){
  lsSave();
  if(!db || !uid) return;
  dirty = true; if(writing) return; writing = true;
  while(dirty){
    dirty = false;
    setSave("Saving…");
    try{ await db.doc("attempts/"+uid).set(bodyOf()); setSave("Progress saved to your account.","ok"); }
    catch(e){
      if(e && e.code==="invalid_argument"){ db=null; setSave("Progress saves in this browser only.","bad"); break; }
      setSave("Could not save to your account. Progress saves in this browser.","bad");
    }
  }
  writing = false;
}
async function connect(){
  try{
    if(!window.claude || !window.claude.use) return;
    const [u, d] = await Promise.all([window.claude.use("user"), window.claude.use("db")]);
    if(!u || !d) return;
    const id = await u.id(); if(!id) return;
    db = d; uid = id;
    const snap = await db.doc("attempts/"+uid).get();
    if(snap.exists){ applySaved(snap.data()); render(); setSave("Progress saved to your account.","ok"); }
    else if(answered() || tries.some(t=>t.length)){ persist(); }
    else setSave("Progress saves to your account.","ok");
  }catch(e){ /* keep local-only mode */ }
}

/* Flagged: flagged questions live in one shared list ("differential-anki", the key predates the rename)
   that the Flagged tab reads. Each card keeps a copy of its question, so the tab works without loading every quiz. */
const SET = {"slug": "week-11-question-bank", "title": "Week 11 Question Bank", "b": 3, "href": "fom/block-3/question-bank/week-11-question-bank"};
const ANKI_KEY = "differential-anki";
function ankiAll(){ try{ const d=JSON.parse(localStorage.getItem(ANKI_KEY)||"null"); return d && Array.isArray(d.cards) ? d.cards : []; }catch(e){ return []; } }
function ankiPut(cards){ try{ localStorage.setItem(ANKI_KEY, JSON.stringify({v:1, cards})); return true; }catch(e){ setSave("Could not flag. Browser storage is full or blocked.","bad"); return false; } }
function ankiId(i){ return SET.slug+"#"+(i+1); }
function ankiCard(i){
  const q=QUESTIONS[i];
  return {id:ankiId(i), slug:SET.slug, set:SET.title, b:SET.b, href:SET.href, n:i+1, c:q.c, p:q.p, o:q.o, a:q.a, e:q.e, l:q.l, obj:q.l.map(x=>OBJECTIVES[x]||"")};
}
function ankiHas(i, cards){ return (cards||ankiAll()).some(c=>c.id===ankiId(i)); }
function ankiButton(i){ const s=ankiHas(i); return `<button class="ankibtn" id="anki" aria-pressed="${s}" title="${s?"Remove the flag":"Flag this question for review"}">${s?"Flagged":"Flag"}</button>`; }
function ankiToggle(i){
  let cards=ankiAll();
  if(ankiHas(i,cards)) cards=cards.filter(c=>c.id!==ankiId(i));
  else cards.push(Object.assign(ankiCard(i), {at:new Date().toISOString()}));
  ankiPut(cards); render(false);
}
function ankiAdd(list){
  const cards=ankiAll(), have=new Set(cards.map(c=>c.id)), at=new Date().toISOString();
  list.forEach(i=>{ if(!have.has(ankiId(i))) cards.push(Object.assign(ankiCard(i), {at})); });
  ankiPut(cards);
}
function missedIdx(){ return QUESTIONS.map((q,i)=>((ans[i]!==null && ans[i]!==q.a) || (tries[i].length && !tries[i][0].ok)) ? i : -1).filter(i=>i>=0); }
function ankiMissedRow(){
  const m=missedIdx(); if(!m.length) return "";
  const cards=ankiAll(), left=m.filter(i=>!ankiHas(i,cards)).length;
  return `<div class="ankirow">${left ? `<button class="btn ghost" id="ankimissed">Flag ${left} missed question${left===1?"":"s"} for review</button>` : `<span class="hint">All ${m.length} missed questions are flagged.</span>`}</div>`;
}
/* Keep saved copies current when a question is corrected, without touching review progress. */
function ankiRefresh(){
  const cards=ankiAll(); let changed=false;
  cards.forEach(c=>{
    if(c.slug!==SET.slug) return;
    const i=c.n-1; if(!(i>=0 && i<N)) return;
    const fresh=ankiCard(i);
    for(const k of ["set","b","href","c","p","o","a","e","l","obj"]) if(JSON.stringify(c[k])!==JSON.stringify(fresh[k])){ c[k]=fresh[k]; changed=true; }
  });
  if(changed) ankiPut(cards);
}
addEventListener("storage", e=>{ if(e.key===ANKI_KEY || e.key===OFF_KEY) render(false); });

/* Not in course content: questions you report land in "differential-offcontent".
   The Flagged tab lists them with a Copy list button, so they can be sent in for removal. */
const OFF_KEY = "differential-offcontent";
function offAll(){ try{ const d=JSON.parse(localStorage.getItem(OFF_KEY)||"null"); return d && Array.isArray(d.items) ? d.items : []; }catch(e){ return []; } }
function offHas(i){ return offAll().some(x=>x.id===ankiId(i)); }
function offButton(i){ const s=offHas(i); return `<button class="offbtn" id="off" aria-pressed="${s}">${s?"Reported as not in course content. Undo":"Not in course content?"}</button>`; }
function offToggle(i){
  let items=offAll();
  if(offHas(i)) items=items.filter(x=>x.id!==ankiId(i));
  else { const q=QUESTIONS[i]; items.push({id:ankiId(i), slug:SET.slug, set:SET.title, b:SET.b, href:SET.href, n:i+1, c:q.c, p:q.p, key:q.o[q.a], at:new Date().toISOString()}); }
  try{ localStorage.setItem(OFF_KEY, JSON.stringify({v:1, items})); }catch(e){ setSave("Could not save the report. Browser storage is full or blocked.","bad"); }
  render(false);
}

function render(top=true){ renderHeader(); showResults?renderResults():renderQ(); if(top) window.scrollTo({top:0}); }
applySaved(lsLoad());
ankiRefresh();
render();
connect();
</script>

</body></html>
