<style>
/* Nexus quiz page. Matches the site: neutral greys, one typeface, and the block's colour as --accent. */
:root{
  --bg:#f5f6f8;--paper:#ffffff;--ink:#15181d;--muted:#4d5560;--faint:#7b828d;--line:#e0e3e8;
  --accent:#0b7a75;--soft:#eef0f3;
  --ok:#1d7a46;--okw:#e7f4ec;--bad:#b42318;--badw:#fcecea;--tick:#dfe2e7;
  --display:"Atkinson Hyperlegible Next","Segoe UI",system-ui,-apple-system,sans-serif;
  --body:"Atkinson Hyperlegible Next","Segoe UI",system-ui,-apple-system,sans-serif;
  --r:8px;
}
:root[data-b="2"]{--accent:#4f46c8}:root[data-b="3"]{--accent:#a3246b}:root[data-b="4"]{--accent:#a35f08}
:root[data-theme="dark"]{
  --bg:#14161a;--paper:#1b1e24;--ink:#eceef2;--muted:#b3bac5;--faint:#8a919c;--line:#2d323b;
  --accent:#45c2b8;--soft:#252930;
  --ok:#5ccf8f;--okw:#13301f;--bad:#f2877c;--badw:#3a1c1a;--tick:#30353e;color-scheme:dark}
:root[data-theme="dark"][data-b="2"]{--accent:#a49df6}:root[data-theme="dark"][data-b="3"]{--accent:#ef8ec0}:root[data-theme="dark"][data-b="4"]{--accent:#e3a548}
.btn:hover:not(:disabled){filter:brightness(.92)}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55}
.wrap{max-width:820px;margin:0 auto;padding-block:28px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:20px}

/* Header */
header{display:flex;flex-direction:column;gap:10px}
.context{margin:0;color:var(--faint);font-size:14px;font-weight:600}
h1{font-family:var(--display);font-weight:700;font-size:clamp(28px,5vw,40px);line-height:1.05;letter-spacing:-.02em;margin:0;text-wrap:balance}
.stats{display:flex;flex-wrap:wrap;gap:6px 22px;font-size:15px;color:var(--muted);font-variant-numeric:tabular-nums}
.stats b{color:var(--ink);font-weight:700}
.bar{height:6px;border-radius:999px;background:var(--tick);overflow:hidden}
.bar span{display:block;height:100%;width:0;background:var(--accent);border-radius:999px;transition:width .25s ease}
.map summary{cursor:pointer;color:var(--accent);font-weight:600;font-size:14px;width:max-content;list-style:none;padding:2px 0}
.map summary::-webkit-details-marker{display:none}
.map summary::before{content:"▸";display:inline-block;margin-right:6px;transition:transform .15s ease}
.map[open] summary::before{transform:rotate(90deg)}
.map summary:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:4px}
.ticks{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}
.tick{width:14px;height:14px;border:0;border-radius:4px;background:var(--tick);padding:0;cursor:pointer}
.tick:hover{background:var(--faint)}
.tick.ok{background:var(--ok)}.tick.bad{background:var(--bad)}
.tick.cur{outline:2px solid var(--accent);outline-offset:2px}
.tick.redo{box-shadow:inset 0 -3px 0 var(--accent)}
.tick:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.save{font-size:13px;color:var(--faint)}
.save.ok{color:var(--ok)}.save.bad{color:var(--bad)}

/* Question card */
.card{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:26px;display:flex;flex-direction:column;gap:18px}
.chead{display:flex;justify-content:space-between;align-items:center;gap:10px}
.tag{font-size:13px;font-weight:700;color:var(--accent);background:var(--soft);padding:3px 9px;border-radius:4px}
.qn{font-family:var(--display);font-weight:700;font-size:15px;color:var(--faint);font-variant-numeric:tabular-nums}
.stem{font-size:18.5px;line-height:1.6;margin:0;white-space:pre-line;max-width:70ch}
.hint{font-size:13px;color:var(--faint)}
.tries{font-size:13px;color:var(--muted)}
.tries .bad{color:var(--bad);font-weight:600}.tries .ok{color:var(--ok);font-weight:600}

/* Options */
.opts{display:flex;flex-direction:column;gap:10px}
.optrow{display:flex;gap:8px;align-items:stretch}
.optrow .opt{flex:1;min-width:0}
.opt{display:flex;gap:14px;align-items:center;text-align:left;width:100%;background:var(--paper);color:var(--ink);border:1.5px solid var(--line);border-radius:var(--r);padding:12px 16px;font:inherit;font-size:16.5px;line-height:1.45;cursor:pointer;transition:border-color .12s ease,background .12s ease}
.opt:hover:not(:disabled){border-color:var(--accent);background:var(--soft)}
.opt:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.opt:disabled{cursor:default}
.opt .k{flex:none;display:inline-grid;place-items:center;width:30px;height:30px;border-radius:6px;background:var(--soft);color:var(--accent);font-family:var(--display);font-weight:700;font-size:14px}
.opt.right{border-color:var(--ok);background:var(--okw)}
.opt.right .k{background:var(--ok);color:var(--paper)}
.opt.wrong{border-color:var(--bad);background:var(--badw)}
.opt.wrong .k{background:var(--bad);color:var(--paper)}
.strike{flex:none;width:44px;border:1.5px solid var(--line);border-radius:var(--r);background:var(--paper);color:var(--faint);font-size:14px;cursor:pointer;display:grid;place-items:center}
.strike:hover{border-color:var(--accent);color:var(--accent)}
.strike:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.strike[aria-pressed="true"]{background:var(--soft);color:var(--ink)}
.optrow.struck .opt > span:last-child{text-decoration:line-through;color:var(--faint)}
.optrow.struck .opt .k{opacity:.45}

/* Feedback */
.fb{background:var(--bg);border-radius:var(--r);padding:18px 20px;display:flex;flex-direction:column;gap:10px}
.verdict{font-family:var(--display);font-weight:700;font-size:18px;display:flex;align-items:center;gap:8px}
.verdict::before{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;font-size:13px;color:var(--paper)}
.verdict.ok{color:var(--ok)}.verdict.ok::before{content:"✓";background:var(--ok)}
.verdict.bad{color:var(--bad)}.verdict.bad::before{content:"✕";background:var(--bad)}
.fb p{margin:0;max-width:72ch}
.fb .why,.fb .alt{display:flex;gap:10px;align-items:baseline}
.fb .why{font-weight:600}
.lk{flex:none;display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--line);color:var(--muted);font-family:var(--display);font-weight:700;font-size:12px;transform:translateY(-1px)}
.lk.ok{background:var(--ok);color:var(--paper)}
.fb .alt{color:var(--muted)}
.fb .take{border-left:3px solid var(--accent);padding:2px 0 2px 12px;color:var(--ink)}
.fb .take b{color:var(--accent)}
.obj{font-size:13.5px;color:var(--faint);line-height:1.5}
.obj b{color:var(--muted)}
.fbtools{display:flex;justify-content:flex-end}

/* Buttons */
.nav{display:flex;justify-content:space-between;gap:10px}
.btn{font-family:var(--display);font-weight:700;font-size:15px;padding:10px 20px;border:1.5px solid var(--accent);border-radius:6px;background:var(--accent);color:var(--paper);cursor:pointer}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.ghost:hover:not(:disabled){background:var(--soft);color:var(--accent);border-color:var(--accent)}
.btn:disabled{opacity:.35;cursor:default}
.btn:focus-visible{outline:2px solid var(--ink);outline-offset:3px}

/* Results */
.big{font-family:var(--display);font-size:clamp(48px,9vw,72px);font-weight:700;line-height:1;letter-spacing:-.03em;color:var(--accent);font-variant-numeric:tabular-nums}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
td,th{text-align:left;padding:9px 0;border-bottom:1px solid var(--line);font-size:15px;vertical-align:middle}
th{font-size:13px;font-weight:700;color:var(--faint)}
td:last-child,th:last-child{text-align:right;white-space:nowrap;padding-left:12px}
.meter{display:block;height:5px;border-radius:999px;background:var(--tick);margin-top:6px;max-width:320px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent);border-radius:999px}
h2{font-family:var(--display);font-size:21px;font-weight:700;margin:6px 0 0}
h3{font-size:14px;font-weight:700;color:var(--faint);margin:6px 0 0}
.miss{margin:0;padding-left:0;list-style:none;display:flex;flex-direction:column;gap:8px;font-size:15px}
.miss code{font-family:var(--display);font-weight:700;font-size:13px;color:var(--bad);background:var(--badw);padding:1px 7px;border-radius:999px;margin-right:8px}

@media (max-width:560px){.card{padding:18px}.stem{font-size:17.5px}.opt{padding:11px 12px;gap:10px}.strike{width:40px}}
@media (prefers-reduced-motion:no-preference){.fb{animation:in .2s ease-out}@keyframes in{from{opacity:.3;transform:translateY(4px)}to{opacity:1;transform:none}}}
@media (prefers-reduced-motion:reduce){.bar span,.opt,.map summary::before{transition:none}}
</style>

    r.dataset.theme = t || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"); }
  theme(); addEventListener("storage",theme);

<script>
const QUESTIONS = [{"c": "Leukocytosis", "p": "Rajiv, 68, has a WBC of 48 × 10^9/L on routine bloodwork. The film shows a bimodal distribution of myelocytes and neutrophils. He also has basophilia, eosinophilia, thrombocytosis and a palpable spleen. He feels well. Which test best confirms the most likely diagnosis?", "o": ["FISH for t(9;22) BCR-ABL", "Flow cytometry for CD5, CD19 and CD23", "Monospot test", "Karyotype for t(15;17)"], "a": 0, "e": "Correct: A. Basophilia, eosinophilia, thrombocytosis and a bimodal myelocyte and neutrophil pattern fit CML. The Philadelphia chromosome t(9;22) with the BCR-ABL fusion confirms it.\nB: This flow panel identifies the clonal B cells of CLL.\nC: Monospot tests for mononucleosis, a cause of reactive lymphocytosis, not a myeloid picture.\nD: t(15;17) confirms APL, which presents with cytopenias and bleeding, not a high WBC with basophilia.\nTakeaway: Basophilia plus a bimodal myelocyte and neutrophil film points to CML.", "l": ["W11 1.1"]}, {"c": "Leukemias", "p": "Harold, 74, has lymphocytosis on a routine CBC. He has no fever, weight loss or night sweats. The film shows many smudge cells. Which flow cytometry result fits the most likely diagnosis?", "o": ["JAK2V617F in red cell precursors", "CD5, CD19, dim CD20 and CD23 positive", "PML/RARα fusion in the myeloblasts", "HLA-DR negative myeloblasts on flow cytometry"], "a": 1, "e": "Correct: B. An older adult with asymptomatic lymphocytosis and smudge cells has CLL. Its flow pattern is CD5, CD19, dim CD20, CD23 with clonal light chain restriction.\nA: JAK2V617F drives polycythemia vera, a red cell cancer.\nC: PML/RARα is the APL fusion gene, found by FISH or NGS.\nD: HLA-DR negative myeloblasts suggest APL.\nTakeaway: CLL: smudge cells on film, CD5 and CD23 on flow.", "l": ["W11 3.2"]}, {"c": "Leukemias", "p": "Harold's workup confirms CLL, Rai stage 0. He is asymptomatic and asks when treatment starts. What is the best plan?", "o": ["Refer for allogeneic stem cell transplant", "Start imatinib", "Start chlorambucil", "Monitor without treatment for now"], "a": 3, "e": "Correct: D. Rai stage 0 is low risk. The notes say do NOT treat low risk or asymptomatic CLL.\nA: Transplant is not a first step in asymptomatic, low-risk CLL.\nB: Imatinib is a tyrosine kinase inhibitor for CML.\nC: Chlorambucil is a CLL chemotherapy option once treatment is needed, not for stage 0 without symptoms.\nTakeaway: CLL is incurable. Low-risk, asymptomatic CLL is watched, not treated.", "l": ["W11 3.3"]}, {"c": "Leukemias", "p": "Mei, 58, has fatigue, bruising and bony tenderness over the sternum. Her film shows large blast cells, one with an Auer rod. Which set of chemistry results best fits the most likely diagnosis?", "o": ["Normal LDH, clonal mature B lymphocytes", "High platelets, basophils and eosinophils", "High LDH, urate, phosphate, low Ca2+ and K+", "High LDH, urate, phosphate, plus high Ca2+ and K+"], "a": 2, "e": "Correct: C. Large blasts with an Auer rod and sternal tenderness point to AML. The notes list increased LDH, uric acid and phosphate with decreased calcium and potassium for AML.\nA: A clonal B lymphocyte population is CLL.\nB: Thrombocytosis with basophilia and eosinophilia fits CML.\nD: Raised calcium and potassium alongside LDH, uric acid and phosphate is the pattern the notes give for ALL.\nTakeaway: AML and ALL both raise LDH, uric acid and phosphate. Calcium and potassium go down in AML and up in ALL.", "l": ["W11 1.2"]}, {"c": "Leukemias", "p": "Leo, 4, has pancytopenia. His film shows blasts with no granules. A chest x-ray shows a mediastinal mass. Before chemotherapy starts, which test should be added?", "o": ["Q-RT-PCR for the BCR-ABL transcript", "Flow cytometry for CD5, CD19 and CD23", "Monospot test for EBV mononucleosis", "Lumbar puncture for CNS involvement"], "a": 3, "e": "Correct: D. A child with agranular blasts and a mediastinal mass has ALL, which makes up 80% of childhood leukemias. The notes call for an LP before chemotherapy to check for CNS involvement.\nA: Q-RT-PCR for BCR-ABL is part of the CML workup.\nB: CD5 and CD23 flow identifies CLL in older adults.\nC: Monospot screens for mononucleosis.\nTakeaway: ALL workup: CXR for a mediastinal mass and LP for the CNS before chemotherapy.", "l": ["W11 4.1"]}, {"c": "Leukemias", "p": "Leo reaches remission after induction and consolidation for ALL. His parents ask what comes next. Which statement best describes the rest of his treatment?", "o": ["Low-dose intermittent chemotherapy for 2 to 3 years", "No further treatment unless symptoms return", "Treatment ends after a 4 to 6 month course of chemotherapy", "A tyrosine kinase inhibitor taken indefinitely"], "a": 0, "e": "Correct: A. ALL follows the Dana-Farber protocol over 2 to 3 years. Maintenance gives low-dose intermittent chemotherapy over 2 to 3 years to prevent relapse.\nB: Watch and wait applies to low-risk, asymptomatic CLL.\nC: A 4 to 6 month course with 4 to 6 weeks in hospital is the AML timeline.\nD: Chronic tyrosine kinase inhibitor therapy is the CML approach.\nTakeaway: ALL treatment runs 2 to 3 years: induction, consolidation, then maintenance, plus CNS and testes prophylaxis.", "l": ["W11 4.3"]}, {"c": "Leukemias", "p": "A parent of a child newly diagnosed with acute leukemia asks how outcomes compare between ALL and AML in children. Which statement matches the notes?", "o": ["ALL: 75% remission with 40% long-term survival. AML: 90% cured.", "Both ALL and AML cure about 90% of children.", "ALL: 90% of children are cured. AML: 70% of children reach remission.", "AML: 90% of children are cured. ALL: 70% of children reach remission."], "a": 2, "e": "Correct: C. The notes give 90% cure for childhood ALL. Childhood AML has 70% remission and 10% death, with 40% alive at 5 years.\nA: 75% remission with 40% long-term survival is the adult ALL figure, and AML is not 90% cured.\nB: AML outcomes in children are clearly worse than ALL.\nD: This reverses the two leukemias.\nTakeaway: Childhood ALL has one of the best outcomes in the notes, with 90% cured.", "l": ["W11 4.5"]}, {"c": "Cancer therapy", "p": "Match each patient with the targeted therapy the notes list for their disease.\nPatient 1: multiple myeloma\nPatient 2: acute promyelocytic leukemia\nPatient 3: chronic lymphocytic leukemia\nWhich pairing is correct, in order?", "o": ["Ibrutinib, ATRA, bortezomib", "Bortezomib, ATRA, ibrutinib", "Bortezomib, imatinib, ATRA", "ATRA, bortezomib, ibrutinib"], "a": 1, "e": "Correct: B. The notes list bortezomib (proteasome inhibitor) for MM, all-trans retinoic acid (ATRA) for APL, and ibrutinib (Bruton kinase inhibitor) for CLL.\nA: Ibrutinib is for CLL, and bortezomib is for MM.\nC: Imatinib treats CML, and ATRA is not a CLL drug.\nD: ATRA treats APL, not myeloma.\nTakeaway: Targeted therapy pairs: CML imatinib, APL ATRA, CLL ibrutinib, MM bortezomib.", "l": ["W11 8.5", "W11 4.4"]}, {"c": "Emergencies", "p": "Ava, 19, started induction chemotherapy for ALL two days ago. She now has palpitations. Labs show high urate, potassium, phosphate and creatinine, and low calcium. What is the best initial management?", "o": ["Empiric IV piperacillin-tazobactam and cultures", "Leukapheresis, IV fluids and cytoreduction", "Daily ASA 81 mg and regular phlebotomy", "IV hydration, rasburicase and frequent labs"], "a": 3, "e": "Correct: D. Dying tumour cells after chemotherapy release their contents, causing tumour lysis syndrome with high urate, potassium, phosphate and creatinine and low calcium. Treat with hydration, rasburicase, allopurinol, frequent labs and dialysis if needed.\nA: Broad-spectrum antibiotics are for febrile neutropenia.\nB: Leukapheresis treats leukostasis, where sticky blasts block small vessels.\nC: ASA and phlebotomy treat polycythemia vera.\nTakeaway: TLS labs: urate, potassium, phosphate and creatinine go up, calcium goes down.", "l": ["W11 3.4"]}, {"c": "Emergencies", "p": "Omar, 45, has newly diagnosed AML with a very high blast count. Over a few hours he develops dyspnea, hypoxia, headache, confusion and blurred vision. What best explains his symptoms?", "o": ["Dying tumour cells release potassium and phosphate", "Marrow infiltration crowds out normal production", "Large, sticky blasts block small vessels", "Neutropenia lets a bacterial infection spread"], "a": 2, "e": "Correct: C. A high blast count with symptoms of poor tissue perfusion (dyspnea, hypoxia, confusion, visual changes) is leukostasis. Big, sticky blasts get stuck in small vessels, causing local hypoxemia, cytokine release and endothelial damage.\nA: Release of cell contents is tumour lysis syndrome, which presents with electrolyte changes, arrhythmias and renal failure.\nB: Marrow infiltration explains cytopenias, not acute vessel occlusion.\nD: Neutropenic infection presents with fever, not this pattern of blocked perfusion.\nTakeaway: Leukostasis is seen in AML and ALL: high blasts plus signs of poor perfusion.", "l": ["W11 3.5", "W11 1.3"]}, {"c": "Emergencies", "p": "Which of the following are part of the management of Omar's leukostasis?\ni) IV fluids\nii) Leukapheresis\niii) Cytoreduction\niv) Rasburicase", "o": ["i), ii) and iii) only", "i), iii) and iv) only", "ii), iii) and iv) only", "All of the above"], "a": 0, "e": "Correct: A. The notes list IV fluids, leukapheresis and cytoreduction for leukostasis.\nB: Rasburicase belongs to tumour lysis syndrome, and leukapheresis is missing.\nC: Rasburicase belongs to tumour lysis syndrome, and IV fluids are missing.\nD: Rasburicase is not part of the leukostasis plan.\nTakeaway: Leukostasis: fluids, leukapheresis, cytoreduction. TLS: hydration, rasburicase, allopurinol, dialysis.", "l": ["W11 3.5"]}, {"c": "Neutropenia", "p": "Grace, 52, is on chemotherapy for AML. She has a single oral temperature of 38.4°C and an ANC of 0.3 × 10^9/L. After ABCs and IV fluids, cultures and a chest x-ray are sent. She has no skin or catheter-site findings and is hemodynamically stable. What should happen next?", "o": ["Start IV vancomycin as the only agent", "Start IV piperacillin-tazobactam empirically", "Start rasburicase and hydration", "Wait for culture results before starting antibiotics"], "a": 1, "e": "Correct: B. A single oral temperature above 38.3°C in a neutropenic patient is febrile neutropenia, an oncologic emergency. Start broad-spectrum antibiotics empirically, such as IV imipenem or IV piperacillin-tazobactam.\nA: Vancomycin is only added for signs of skin or IV catheter site infection, or hemodynamic instability.\nC: Rasburicase treats tumour lysis syndrome.\nD: Antibiotics start empirically, not after cultures return.\nTakeaway: Febrile neutropenia: stabilize, investigate, examine, then empiric carbapenem or piperacillin-tazobactam.", "l": ["W11 2.3"]}, {"c": "Neutropenia", "p": "Four neutropenic patients on chemotherapy report fevers. Which one meets the definition of febrile neutropenia?", "o": ["37.9°C, sustained for 2 hours", "38.2°C, a single oral temperature reading", "38.0°C, sustained for over 1 hour", "38.1°C, a single oral reading"], "a": 2, "e": "Correct: C. Febrile neutropenia is a single oral temperature above 38.3°C, or 38.0°C or higher sustained over 1 hour.\nA: 37.9°C never reaches 38.0°C, however long it lasts.\nB: A single 38.2°C reading is still below 38.3°C.\nD: A single reading of 38.1°C is below the 38.3°C single-reading cutoff.\nTakeaway: Two ways in: one reading above 38.3°C, or 38.0°C or more for over an hour.", "l": ["W11 2.3"]}, {"c": "Neutropenia", "p": "In the initial assessment of a patient with febrile neutropenia, which action should be avoided?", "o": ["Blood and urine cultures", "Chest x-ray", "Inspection of IV catheter sites", "Digital rectal exam"], "a": 3, "e": "Correct: D. The notes specify the GI exam in febrile neutropenia is done with no DRE.\nA: Blood and urine cultures are part of the initial investigations.\nB: A chest x-ray is part of the initial investigations.\nC: Skin and indwelling IV catheter sites are part of the focused exam.\nTakeaway: Examine mouth, sinuses, lungs, abdomen, GU, skin and lines, but skip the DRE.", "l": ["W11 2.3"]}, {"c": "Neutropenia", "p": "Daniel, 34, has schizophrenia and started clozapine three months ago. His ANC is 0.8 × 10^9/L. He has no fever. Which description fits best?", "o": ["Moderate neutropenia from a medication", "Severe neutropenia from a medication", "Mild neutropenia from an autoimmune cause", "Moderate neutropenia from a congenital cause"], "a": 0, "e": "Correct: A. An ANC of 0.5 to 0.99 × 10^9/L is moderate neutropenia. Clozapine is a listed acquired toxin cause.\nB: Severe neutropenia is below 0.5 × 10^9/L.\nC: Mild is 1 to 1.5 × 10^9/L, and nothing here suggests autoimmunity.\nD: A new drug and adult onset point to an acquired cause, not a congenital one.\nTakeaway: ANC bands: mild 1 to 1.5, moderate 0.5 to 0.99, severe below 0.5.", "l": ["W11 2.1", "W11 2.2"]}, {"c": "Leukocytosis", "p": "Sofia, 30, has pneumonia. Her WBC is 18 × 10^9/L with a left shift, toxic granules and Döhle bodies. There are no myeloblasts or promyelocytes on the film. Which additional finding would instead point to a primary cause of neutrophilia?", "o": ["Döhle bodies in the neutrophils", "Increased eosinophils and basophils", "Toxic vacuoles in many of the neutrophils", "No promyelocytes seen on the film"], "a": 1, "e": "Correct: B. Features of primary neutrophilia include immature myeloid cells, WBC above 30 × 10^9/L, increased eosinophils or basophils, and clonality.\nA: Döhle bodies are a reactive, secondary feature.\nC: Toxic vacuoles are a reactive, secondary feature.\nD: No myeloblasts or promyelocytes in the blood supports a secondary cause.\nTakeaway: Toxic granules, vacuoles and Döhle bodies mean reactive. Blasts, eosinophils, basophils and clonality mean primary.", "l": ["W11 1.4"]}, {"c": "Leukocytosis", "p": "Nadia, 19, has fever, fatigue and sore throat. Her CBC shows lymphocytosis with atypical lymphocytes surrounding red cells. What is the best next test?", "o": ["Flow cytometry now", "BCR-ABL by Q-RT-PCR", "Bone marrow aspirate", "Monospot test"], "a": 3, "e": "Correct: D. Atypical lymphocytes after a viral illness suggest EBV mononucleosis. Use the Monospot test. Flow cytometry is for lymphocytosis that persists after 4 to 6 weeks.\nA: Flow cytometry comes later, only if the lymphocytosis persists after 4 to 6 weeks.\nB: BCR-ABL is the CML test.\nC: A marrow aspirate is not the first step for likely mononucleosis.\nTakeaway: Reactive lymphocytosis: Monospot first, flow only if it persists 4 to 6 weeks.", "l": ["W11 1.5"]}, {"c": "Leukocytosis", "p": "Match each finding with a benign cause the notes list.\nPatient 1: eosinophilia after starting penicillin\nPatient 2: basophilia with fatigue and cold intolerance\nPatient 3: monocytosis with a chronic cough and night sweats\nWhich pairing is correct, in order?", "o": ["Drug reaction, chronic infection (TB), hypothyroidism", "Hypothyroidism, drug reaction, chronic infection (TB)", "Drug reaction, hypothyroidism, chronic infection (TB)", "Parasitic infection, drug reaction, hypothyroidism"], "a": 2, "e": "Correct: C. Eosinophilia lists drug reaction (penicillin). Basophilia lists hypothyroidism. Monocytosis lists chronic infection (TB).\nA: TB causes monocytosis, and hypothyroidism causes basophilia.\nB: Hypothyroidism causes basophilia, not eosinophilia.\nD: Parasites cause eosinophilia, but the penicillin history points to a drug reaction, and the other two pairings are wrong.\nTakeaway: Eosinophils: drugs, allergy, parasites. Basophils: hypothyroidism. Monocytes: TB, endocarditis, IBD.", "l": ["W11 1.1"]}, {"c": "Erythrocytosis", "p": "Frank, 62, smokes heavily and has COPD. His Hb is 178 g/L. His serum EPO is high. He has no splenomegaly. How is his erythrocytosis best classified?", "o": ["Secondary, from systemic hypoxia", "Primary, from polycythemia vera", "Secondary, from local renal hypoxia", "Secondary, from pathological EPO production"], "a": 0, "e": "Correct: A. Normal or high EPO makes this secondary erythrocytosis. COPD and smoking are listed causes of systemic hypoxia.\nB: Primary erythrocytosis, such as PV, has low EPO.\nC: Local hypoxia refers to the kidney (renal artery stenosis, renal cysts, post renal transplant).\nD: Pathological EPO production comes from tumours such as RCC, HCC or cerebellar hemangioblastoma.\nTakeaway: EPO splits it: low means primary, normal or high means secondary.", "l": ["W11 5.2", "W11 5.3"]}, {"c": "Erythrocytosis", "p": "Victor, 55, has Hb 172 g/L, a low serum EPO, a ruddy complexion and itchy skin after hot showers. Which investigation is one of the major diagnostic criteria for his most likely diagnosis?", "o": ["A repeat serum EPO level next week", "JAK2V617F or exon 12 mutation testing", "Monospot test for EBV infection", "Abdominal ultrasound to look for renal cysts"], "a": 1, "e": "Correct: B. Low EPO, ruddy complexion and aquagenic pruritus point to PV. A JAK2V617F or exon 12 mutation is major criterion 3.\nA: Subnormal EPO is a minor criterion, and it is already known.\nC: Monospot screens for mononucleosis.\nD: Renal imaging looks for local hypoxia, a secondary cause, which low EPO argues against.\nTakeaway: PV major criteria: high Hb or hct, hypercellular marrow, JAK2 mutation.", "l": ["W11 5.4"]}, {"c": "Erythrocytosis", "p": "Martin, 50, has Hb 168 g/L and hematocrit 50%. He carries a JAK2V617F mutation. His marrow is hypercellular for age with erythroid, granulocytic and megakaryocytic proliferation. Which statement is correct?", "o": ["PV needs a subnormal EPO before diagnosis", "He cannot have PV because his Hb is below 170", "He meets WHO criteria for PV despite Hb below 170", "PV needs palpable splenomegaly before it is diagnosed"], "a": 2, "e": "Correct: C. PV is diagnosed with all 3 major criteria: Hb above 165 g/L or hct above 49% in men, a hypercellular trilineage marrow, and a JAK2 mutation. He meets all three.\nA: Subnormal EPO is a minor criterion, needed only when one major criterion is missing.\nB: 170 g/L is the general erythrocytosis cutoff, but the PV criterion for men is Hb above 165 g/L.\nD: Splenomegaly is not a PV diagnostic criterion in the notes.\nTakeaway: PV: all 3 major criteria, or the first 2 major plus 1 minor.", "l": ["W11 6.4"]}, {"c": "Erythrocytosis", "p": "Two patients have polycythemia vera.\nPatient 1: 42, no history of thrombosis\nPatient 2: 50, a DVT last year\nBoth take ASA 81 mg daily with a hematocrit target below 0.45. Which added therapy is correct for each, in order?", "o": ["Phlebotomy, phlebotomy alone for both", "Ruxolitinib, allogeneic transplant", "Hydroxyurea ± phlebotomy, phlebotomy", "Phlebotomy, hydroxyurea ± phlebotomy"], "a": 3, "e": "Correct: D. Low-risk PV is treated with phlebotomy. High risk means age 60 or older, or prior thrombosis, and adds cytoreduction with hydroxyurea with or without phlebotomy. Patient 2 is high risk because of the prior DVT.\nA: Patient 2's prior thrombosis makes him high risk, which adds hydroxyurea.\nB: Ruxolitinib and transplant are listed for primary myelofibrosis.\nC: This reverses the risk groups.\nTakeaway: High-risk PV: age 60 or older, or any prior thrombosis.", "l": ["W11 6.3"]}, {"c": "Thrombocytosis", "p": "Ruth, 58, has a platelet count of 720 × 10^9/L and episodes of erythromelalgia. She has no infection, inflammation or iron deficiency. Her marrow shows proliferation mainly of enlarged, mature megakaryocytes with hyperlobulated nuclei. She carries a CALR mutation and does not meet criteria for CML or PV. What is the most likely diagnosis?", "o": ["Essential thrombosis (ET)", "Primary myelofibrosis", "Reactive (secondary) thrombocytosis", "Polycythemia vera"], "a": 0, "e": "Correct: A. She meets all 4 ET major criteria: platelets of 450 × 10^9/L or more, megakaryocyte-predominant marrow with enlarged hyperlobulated forms, not meeting criteria for other myeloid neoplasms, and a CALR mutation. Erythromelalgia fits.\nB: PMF shows megakaryocyte atypia with fibrosis, pancytopenia and tear drop cells.\nC: A clonal CALR mutation and no reactive cause argue against secondary thrombocytosis.\nD: PV needs erythrocytosis.\nTakeaway: ET: platelets of 450 or more, a megakaryocyte-rich marrow, and a JAK2, CALR or MPL mutation.", "l": ["W11 6.4", "W11 6.2"]}, {"c": "Thrombocytosis", "p": "Leah, 40, has heavy menstrual bleeding. Her CBC shows a microcytic anemia with low ferritin and a platelet count of 520 × 10^9/L. What is the most likely explanation for her platelet count?", "o": ["Familial thrombocytosis, a congenital cause", "Secondary thrombocytosis from iron deficiency", "Essential thrombosis (ET), a primary MPN cause", "A spurious count from cryoglobulin crystals"], "a": 1, "e": "Correct: B. Secondary thrombocytosis is more common than primary. Iron deficiency anemia and hemorrhage are both listed causes. Treat the underlying cause.\nA: Familial thrombocytosis is a rare congenital primary cause.\nC: ET is a primary MPN, which is less likely with an obvious secondary cause.\nD: Spurious counts come from fragments or crystals, and nothing suggests that here.\nTakeaway: Think secondary first: infection, inflammation, tissue damage, bleeding, iron deficiency, hyposplenism.", "l": ["W11 5.2", "W11 5.3"]}, {"c": "Myeloproliferative neoplasms", "p": "George, 70, has fatigue, early satiety and weight loss. He has a large spleen. His CBC shows pancytopenia, and the film shows tear drop cells with immature cells. What is the most likely diagnosis?", "o": ["Primary myelofibrosis", "Chronic myeloid leukemia", "Essential thrombosis (ET)", "Polycythemia vera"], "a": 0, "e": "Correct: A. Pancytopenia from marrow fibrosis, tear drop cells, a leukoerythroblastic picture, early satiety and splenomegaly fit primary myelofibrosis.\nB: CML presents with leukocytosis, basophilia and thrombocytosis, not pancytopenia.\nC: ET raises platelets.\nD: PV raises red cell counts.\nTakeaway: Tear drop cells plus pancytopenia and a big spleen point to PMF.", "l": ["W11 6.3", "W11 6.4"]}, {"c": "Myeloproliferative neoplasms", "p": "Which statement about mutations in myeloproliferative neoplasms is FALSE?", "o": ["JAK2 mutations are found in 90 to 95% of PV", "MPL W515L/K mutations can drive primary myelofibrosis", "CALR mutations can drive essential thrombosis (ET)", "JAK2 mutations are found in only 50 to 60% of PV"], "a": 3, "e": "Correct: D. JAK2 is found in 90 to 95% of PV. The 50 to 60% figure belongs to ET and PMF.\nA: This is true. JAK2 is found in 90 to 95% of PV.\nB: This is true. MPL W515L/K is listed for PMF.\nC: This is true. CALR is listed for ET.\nTakeaway: JAK2: about 95% of PV, about half of ET and PMF. CALR and MPL cover much of the rest.", "l": ["W11 6.5"]}, {"c": "Myeloproliferative neoplasms", "p": "Why does the JAK2V617F mutation cause red cells to proliferate in polycythemia vera?", "o": ["A congenital EPOR mutation lowers the threshold", "The mutant receptor signals without EPO", "A tumour secretes EPO that drives the marrow", "The mutant receptor needs more EPO than normal"], "a": 1, "e": "Correct: B. JAK2V617F is an acquired somatic mutation in the negative regulatory JH2 pseudokinase domain. The receptor is always phosphorylated and on, so it signals the STAT, PI3K and RAS-MAPK pathways without EPO.\nA: EPOR mutations are a rare congenital primary cause, while JAK2V617F is acquired.\nC: Tumour EPO production is a secondary cause with normal or high EPO.\nD: This reverses the effect. The mutant does not require EPO at all.\nTakeaway: JAK2V617F: valine to phenylalanine, acquired, constitutively on.", "l": ["W11 6.1"]}, {"c": "Myeloproliferative neoplasms", "p": "George's primary myelofibrosis is progressing. He asks whether any treatment can cure it. Which option do the notes list as curative?", "o": ["Hydroxyurea with steroids", "Ruxolitinib, a JAK2 inhibitor", "Allogeneic stem cell transplantation", "Supportive red cell and platelet transfusions"], "a": 2, "e": "Correct: C. The notes list allogeneic stem cell transplantation as the curative option for PMF.\nA: Hydroxyurea is a conventional option for symptoms and quality of life.\nB: Ruxolitinib, a JAK inhibitor, is the newer option for symptom control.\nD: Transfusions are supportive, not curative.\nTakeaway: PMF: transplant to cure, everything else to control symptoms.", "l": ["W11 8.7"]}, {"c": "APL", "p": "Isabel, 38, has gum bleeding and bruising. Her WBC is low. The marrow shows myeloblasts with two or more Auer rods. Flow cytometry shows HLA-DR negative cells. Her fibrinogen is low. Which test confirms the most likely diagnosis?", "o": ["Flow cytometry for CD5, CD19, CD23", "FISH for the BCR-ABL fusion gene", "JAK2V617F mutation testing by PCR", "FISH for the PML/RARα fusion gene"], "a": 3, "e": "Correct: D. Blasts with 2 or more Auer rods and HLA-DR negative flow suggest APL. Karyotype t(15;17), FISH for PML/RARα, or NGS confirms it.\nA: CD5 and CD23 flow identifies CLL.\nB: BCR-ABL confirms CML.\nC: JAK2 testing is for the MPNs.\nTakeaway: Auer rods and HLA-DR negative suggest APL. PML/RARα or t(15;17) confirms it.", "l": ["W11 9.5", "W11 9.3"]}, {"c": "APL", "p": "Isabel's karyotype confirms t(15;17). Which statement about her case is correct?", "o": ["Severe hemorrhage is the main early risk, treat with ATRA and arsenic", "Surgery and radiation are the main treatments for this subtype", "Early risk is low until chemotherapy starts, so 7+3 alone is the standard", "Thrombosis is the main early risk, so hydroxyurea is first line"], "a": 0, "e": "Correct: A. APL carries a high risk of early death before or early in therapy, usually from severe hemorrhage, often cerebral. Treatment is ATRA, arsenic, and chemotherapy for high-risk disease.\nB: Surgery and radiation are not APL treatments in the notes.\nC: Early mortality is high before therapy starts, and 7+3 is the AML induction, not the APL backbone.\nD: Bleeding, DIC and abnormal fibrinolysis dominate APL, and hydroxyurea is for MPNs.\nTakeaway: APL is a hemorrhage emergency. Start ATRA early.", "l": ["W11 9.6", "W11 4.4"]}, {"c": "APL", "p": "Two patients have APL.\nPatient 1: WBC 2.1 × 10^9/L, abundant cytoplasmic granules\nPatient 2: WBC 24 × 10^9/L, few granules\nWhich subtypes fit, in order?", "o": ["Hypergranular (M3), hypergranular (M3)", "Hypergranular (M3), microgranular (M3v)", "Microgranular (M3v), hypergranular (M3)", "Monocytic (M4/M5), hypergranular (M3)"], "a": 1, "e": "Correct: B. The hypergranular or typical form (M3, 75% of cases) usually has a decreased WBC. The microgranular form (M3v, 25%) has a WBC above 10.\nA: A high WBC with few granules fits M3v.\nC: This reverses the two subtypes.\nD: M4 and M5 are monoblastic and monocytic leukemias, not APL.\nTakeaway: APL: M3 has a low WBC and many granules. M3v has a high WBC and few granules.", "l": ["W11 9.5"]}, {"c": "Marrow testing", "p": "A 50-year-old needs a bone marrow aspirate and core biopsy. Where should the core sample be taken?", "o": ["Ribs, under imaging guidance", "Tibia, in any adult patient", "Posterior superior iliac spine", "Sternum, if done by an experienced operator"], "a": 2, "e": "Correct: C. Marrow samples should come from the posterior superior iliac spine.\nA: Ribs are never used for core biopsy.\nB: The tibia is used for aspirates in children only, never for cores.\nD: The sternum is allowed for aspirates in special cases, but never for a core biopsy because it sits too close to the heart.\nTakeaway: Core biopsy: PSIS only. Never sternum, tibia, skull or ribs.", "l": ["W11 9.2"]}, {"c": "Marrow testing", "p": "Which statement about flow cytometry of a marrow aspirate is correct?", "o": ["FSC reflects granularity and SSC reflects cell size", "Samples must be formalin fixed before they are run", "It detects changes in chromosome structure and number", "FSC reflects cell size and SSC reflects granularity"], "a": 3, "e": "Correct: D. In flow cytometry, forward scatter (FSC) measures size and side scatter (SSC) measures complexity or granularity.\nA: This reverses the two measures.\nB: Samples should be fresh (under 24 hours) and in liquid or disaggregated suspension.\nC: Chromosome changes are studied by cytogenetics.\nTakeaway: FSC is size, SSC is granularity. Immunophenotype is the pattern of antigens.", "l": ["W11 9.3"]}, {"c": "Marrow testing", "p": "A 70-year-old's marrow core biopsy shows 70% cellularity. The myeloid to erythroid ratio is 2:1. How should you interpret the biopsy?", "o": ["Normal cellularity, low M:E ratio", "Hypercellular for age, normal M:E ratio", "Hypocellular for age, high M:E ratio", "Normal cellularity for age, normal M:E ratio"], "a": 1, "e": "Correct: B. Expected cellularity is 100 minus age, so 30% for a 70-year-old. 70% is hypercellular. A ratio of 2:1 sits within the normal 1:1 to 3:1 range.\nA: 70% is not low for a 70-year-old, and 2:1 is normal.\nC: The marrow is more cellular than expected, and 2:1 is normal.\nD: 70% is far above the expected 30%.\nTakeaway: Marrow cellularity = 100 minus age. Normal M:E ratio is 1:1 to 3:1.", "l": ["W11 9.3"]}, {"c": "Pancytopenia", "p": "Which of the following cause pancytopenia through decreased production?\ni) Aplastic anemia\nii) Myelofibrosis\niii) Vitamin deficiencies\niv) Splenomegaly", "o": ["i), ii) and iv) only", "ii), iii) and iv) only", "i), ii) and iii) only", "All of the above"], "a": 2, "e": "Correct: C. Aplastic anemia, myelofibrosis and vitamin deficiencies are listed under decreased production.\nA: Splenomegaly causes pancytopenia by sequestration, not decreased production.\nB: Splenomegaly causes sequestration, and aplastic anemia is missing.\nD: Splenomegaly belongs to sequestration.\nTakeaway: Pancytopenia: decreased production, increased destruction, or sequestration.", "l": ["W11 9.1"]}, {"c": "Leukemias", "p": "Which statement about the epidemiology of the four leukemias is FALSE?", "o": ["CML makes up 80% of childhood leukemias", "ALL makes up 80% of childhood leukemias", "AML makes up 80% of acute adult leukemias", "CLL is the most common leukemia overall"], "a": 0, "e": "Correct: A. CML accounts for only 5% of childhood leukemias. ALL makes up 80%.\nB: This is true. ALL is 80% of childhood leukemias.\nC: This is true. AML is 80% of acute adult leukemias.\nD: This is true. CLL is 30% of all leukemias, the most common.\nTakeaway: Children get ALL. Older adults get CLL. Adults with acute leukemia mostly have AML.", "l": ["W11 3.1"]}, {"c": "Leukemias", "p": "Peter, 61, has had stable chronic phase CML for three years. He now has fever, marrow failure and a large rise in blasts that looks like acute leukemia. Which phase is he in?", "o": ["Chronic phase", "Myeloid sarcoma", "Blast crisis", "Accelerated phase"], "a": 2, "e": "Correct: C. CML moves from a chronic phase, through an accelerated phase, to blast crisis, which reflects acute leukemia.\nA: Chronic phase is usually asymptomatic.\nB: Myeloid sarcoma is an extramedullary mass of myeloblasts in AML.\nD: The accelerated phase comes before a picture that looks like acute leukemia.\nTakeaway: CML phases: chronic, accelerated, blast crisis.", "l": ["W11 3.2"]}, {"c": "Leukemias", "p": "Peter's original chronic phase CML was found on routine bloodwork. Which therapy is the chronic mainstay in the notes?", "o": ["Induction with 7+3 chemotherapy", "A tyrosine kinase inhibitor (imatinib)", "All-trans retinoic acid (ATRA)", "Chemotherapy with chlorambucil and fludarabine"], "a": 1, "e": "Correct: B. The notes list tyrosine kinase inhibitors (imatinib, nilotinib, dasatinib) as the chronic treatment for CML, with prophylactic allopurinol.\nA: 7+3 is AML induction.\nC: ATRA treats APL.\nD: Chlorambucil and fludarabine are CLL chemotherapies.\nTakeaway: CML: a TKI for the long term, transplant as a possible cure.", "l": ["W11 3.3", "W11 8.4"]}, {"c": "Leukemias", "p": "Arthur, 72, has CLL and has had three sinus infections and a pneumonia in the past year. His neutrophil count is normal. Which CLL feature best explains his recurrent infections?", "o": ["Autoimmune hemolytic anemia", "Tumour lysis syndrome", "Leukostasis", "Hypogammaglobulinemia"], "a": 3, "e": "Correct: D. CLL causes hypogammaglobulinemia, with or without neutropenia, which explains recurrent infections with a normal neutrophil count.\nA: AIHA is a CLL complication, but it causes anemia, not infection.\nB: TLS causes electrolyte derangements, not recurrent infection.\nC: Leukostasis is a high-blast emergency of AML and ALL.\nTakeaway: CLL complications: AIHA, ITP, hypogammaglobulinemia.", "l": ["W11 3.2"]}, {"c": "Cancer therapy", "p": "A patient with ALL receives vincristine. How does it stop tumour cells from dividing?", "o": ["Inhibits microtubule assembly in metaphase", "Crosslinks guanine so DNA cannot enter S phase", "Interferes with normal nucleic acid metabolism", "Binds stabilized microtubules so chromosomes cannot be pulled apart"], "a": 0, "e": "Correct: A. Vincristine is a vinca alkaloid. Vinca alkaloids inhibit microtubule assembly in metaphase and disrupt M phase.\nB: Guanine crosslinking is the alkylating agent mechanism.\nC: Disrupted nucleic acid metabolism is the antimetabolite mechanism.\nD: Binding stabilized microtubules is the taxane mechanism (paclitaxel, docetaxel).\nTakeaway: Both vincas and taxanes block M phase, by opposite actions on microtubules.", "l": ["W11 7.6", "W11 7.3"]}, {"c": "Cancer therapy", "p": "A patient with CLL receives chlorambucil. Which mechanism matches this drug's class?", "o": ["Interferes with cellular nucleic acid metabolism", "Targets the CD20 marker on malignant B cells", "Binds PD1 or PDL1 to release the immune brake", "Crosslinks guanine so DNA cannot enter S phase"], "a": 3, "e": "Correct: D. Chlorambucil is an alkylating agent. Alkylating agents crosslink guanine, causing cell arrest and apoptosis.\nA: This is the antimetabolite mechanism, such as methotrexate.\nB: CD20 targeting describes rituximab, a monoclonal antibody.\nC: This is the immune checkpoint inhibitor mechanism.\nTakeaway: Alkylators (cyclophosphamide, chlorambucil, cisplatin, carboplatin) crosslink guanine.", "l": ["W11 7.5", "W11 7.6"]}, {"c": "Cancer therapy", "p": "Which toxicities are common to all classic chemotherapies?\ni) Myelosuppression\nii) Alopecia\niii) Mucositis\niv) Atrial fibrillation", "o": ["i), ii) and iv) only", "ii), iii) and iv) only", "i), ii) and iii) only", "All of the above"], "a": 2, "e": "Correct: C. The notes list myelosuppression, alopecia and mucositis as common to all classic chemotherapies.\nA: Atrial fibrillation is an ibrutinib toxicity, and mucositis is missing.\nB: Atrial fibrillation is an ibrutinib toxicity, and myelosuppression is missing.\nD: Atrial fibrillation does not belong in the list.\nTakeaway: Classic chemotherapy hits fast-dividing cells: marrow, hair, mucosa.", "l": ["W11 7.7"]}, {"c": "Cancer therapy", "p": "A patient on pembrolizumab develops diarrhea and is diagnosed with colitis. What is the best treatment for this toxicity?", "o": ["IV rasburicase infusion", "Glucocorticoids", "IV vancomycin", "Leukapheresis"], "a": 1, "e": "Correct: B. Pembrolizumab is an immune checkpoint inhibitor. It takes the brakes off the immune system, which causes immune toxicities such as colitis, pneumonitis, rash and hepatitis. These are treated with glucocorticoids.\nA: Rasburicase treats tumour lysis syndrome.\nC: Vancomycin is added in febrile neutropenia with skin or line infection.\nD: Leukapheresis treats leukostasis.\nTakeaway: Checkpoint inhibitor toxicity is immune-mediated, so treat with steroids.", "l": ["W11 8.6"]}, {"c": "Cancer therapy", "p": "Match each localized therapy with its role in hematological malignancies, according to the notes.\nTherapy 1: surgery\nTherapy 2: radiotherapy\nWhich pairing is correct, in order?", "o": ["Diagnosis only, curative in limited stage lymphoma", "Curative in limited stage lymphoma, diagnosis only", "Curative splenectomy, CNS prophylaxis in AML", "CNS prophylaxis in ALL, palliation of AML"], "a": 0, "e": "Correct: A. Surgery is used for diagnosis only, such as resecting a lymph node. Radiotherapy can be curative in limited stage lymphoma and gives CNS prophylaxis in ALL.\nB: This swaps the two roles.\nC: The notes do not list curative surgery, and CNS prophylaxis is listed for ALL.\nD: Surgery is for diagnosis only, and the notes do not list radiation for AML palliation.\nTakeaway: In blood cancers, surgery mostly diagnoses. Radiation can cure limited disease.", "l": ["W11 8.1", "W11 8.2"]}, {"c": "Leukemias", "p": "Sam, 45, has AML and reaches remission after 7+3 induction. His disease has high-risk features with a poor prognosis. What is the best consolidation?", "o": ["Low-dose intermittent maintenance chemotherapy over 2 to 3 years", "A tyrosine kinase inhibitor indefinitely", "Allogeneic hemopoietic stem cell transplantation", "Observation without further therapy"], "a": 2, "e": "Correct: C. AML consolidation is further chemotherapy, or allogeneic hemopoietic stem cell transplantation for high-risk or poor-prognosis disease.\nA: Maintenance over 2 to 3 years is part of the ALL protocol.\nB: Long-term TKI therapy is for CML.\nD: AML needs consolidation after induction.\nTakeaway: AML: 7+3 induction, then chemotherapy or a transplant for high risk.", "l": ["W11 8.7", "W11 3.3"]}, {"c": "Cancer therapy", "p": "A patient has relapsed ALL and is referred for tisagenlecleucel (Kymriah). Which description fits this therapy?", "o": ["A naked monoclonal antibody that targets CD20", "An antibody that carries a radioisotope to CD markers", "An antibody linking a tumour marker to a T cell", "Modified T cells made from the patient's own blood"], "a": 3, "e": "Correct: D. Tisagenlecleucel is a CAR-T cell therapy, listed for ALL and relapsed DLBCL. CAR-T cells are genetically modified T cells from the patient's own blood.\nA: A naked CD20 antibody is rituximab.\nB: A radioisotope-carrying antibody is a conjugated antibody, such as Zevalin.\nC: Linking a tumour marker to a cytotoxic T cell describes a bi-specific antibody.\nTakeaway: CAR-T: the patient's own T cells, modified to attack the cancer.", "l": ["W11 8.4", "W11 8.6"]}, {"c": "Trial design", "p": "In a trial, 20% of the control group and 15% of the treatment group have a relapse. Which set of results is correct?", "o": ["ARR 5%, RRR 75%, NNT 20", "ARR 5%, RRR 25%, NNT 20", "ARR 15%, RRR 25%, NNT 7", "ARR 25%, RRR 5%, NNT 4"], "a": 1, "e": "Correct: B. ARR = 20% minus 15% = 5%. RR = 15 ÷ 20 = 0.75, so RRR = 1 minus 0.75 = 25%. NNT is the number treated to prevent one bad outcome, 1 ÷ 0.05 = 20.\nA: 75% is the relative risk, not the relative risk reduction.\nC: 15% is the treatment group's risk, not the ARR.\nD: This swaps ARR and RRR.\nTakeaway: ARR is a subtraction. RRR = 1 minus RR. NNT = 1 ÷ ARR.", "l": ["W11 11.3"]}, {"c": "Trial design", "p": "Investigators test a new oral drug for CLL that is less toxic and easier to take than standard therapy. They do not expect it to work better, only not meaningfully worse. Which trial design fits?", "o": ["Non-inferiority, with a pre-set margin", "Superiority, against a placebo control", "Phase 1, to find the tolerated dose", "Equivalence, with no margin at all"], "a": 0, "e": "Correct: A. A non-inferiority trial shows a new therapy is not clinically worse than the comparator. It suits a drug that offers other advantages such as safety, tolerability or convenience. The margin must be pre-specified.\nB: A superiority trial aims to show the new therapy is better.\nC: Phase 1 trials study safety and tolerated dose in 10 to 30 patients.\nD: Equivalence trials still use lower and upper margins, and they test that two treatments differ by an unimportant amount.\nTakeaway: Non-inferiority: give up a little efficacy (the delta) for safety or convenience.", "l": ["W11 11.4"]}, {"c": "Trial design", "p": "Which statement about intention-to-treat (ITT) and per-protocol (PP) analysis is correct?", "o": ["ITT includes only patients who finished treatment", "PP usually gives a lower effect estimate than ITT", "ITT gives a more conservative effect estimate", "PP analyzes everyone randomized, even dropouts"], "a": 2, "e": "Correct: C. ITT analyzes patients by assigned group, including those who stop treatment. It almost always gives a more conservative estimate and reflects real-world use.\nA: Completers only is the definition of PP.\nB: PP usually yields a higher estimate, because patients doing poorly tend to drop out.\nD: Analyzing everyone randomized is ITT, not PP.\nTakeaway: ITT is conservative and real world. PP inflates the effect.", "l": ["W11 11.1"]}, {"c": "Trial design", "p": "A team planning a trial expects the new drug can only improve, never worsen, the response. Which choice lets them use a smaller sample size?", "o": ["Adding a composite endpoint with unequal weights", "A two-sided test", "Lowering power below 50%", "A one-sided test"], "a": 3, "e": "Correct: D. A one-sided test is used when investigators suspect a difference in one direction only, and it needs a smaller sample size.\nA: Components of a composite endpoint are equally weighted.\nB: A two-sided test is used when the direction is unknown.\nC: Power is 1 minus β, the chance of detecting a true difference. Cutting it defeats the trial's purpose.\nTakeaway: One direction, smaller sample. Power = 1 minus β.", "l": ["W11 11.2"]}];
const OBJECTIVES = {"W11 1.1": "Identify and analyze abnormalities on complete blood count (CBC) to formulate differential diagnoses for leukocytosis.", "W11 1.2": "Identify acute leukemias based on investigation.", "W11 1.3": "Identify possible complication of leukocytosis.", "W11 1.4": "List the differential diagnoses of neutrophilia.", "W11 1.5": "List the differential diagnoses of lymphocytosis.", "W11 11.1": "Describe advantages and disadvantages in the study design.", "W11 11.2": "Discuss factors influencing the sample size calculation.", "W11 11.3": "Calculate relative risk reduction, absolute risk reduction and number- needed-to-treat.", "W11 11.4": "List differences between trial designed to show “non-inferiority” versus “superiority”.", "W11 2.1": "Identify and analyze abnormalities on complete blood count (CBC) to formulate differential diagnoses for leukocytopenia.", "W11 2.2": "List the differential diagnoses for neutropenia.", "W11 2.3": "Describe management of neutropenia.", "W11 3.1": "Compare and contrast the four different leukemias according to cell lineage and natural history.", "W11 3.2": "List and interpret the clinical symptoms and laboratory findings in each of: chronic lymphocytic leukemia, chronic myeloid leukemia, acute lymphocytic leukemia and acute myeloid leukemia.", "W11 3.3": "Explain principle of treatment options and patient management.", "W11 3.4": "Identify and manage tumour lysis syndrome.", "W11 3.5": "Identify and manage leukostasis.", "W11 4.1": "Identify the common presentations of leukemia in childhood.", "W11 4.3": "Describe the principles of treatment of ALL.", "W11 4.4": "Explain role of targeted therapy for leukemia.", "W11 4.5": "Compare and contrast the difference in treatment and outcome between ALL and AML.", "W11 5.2": "Formulate differential diagnoses for erythrocytosis and thrombocytosis.", "W11 5.3": "List and interpret the clinical findings important in determining the etiology of erythrocytosis and/or thrombocytosis.", "W11 5.4": "List and interpret the investigation based on most likely etiology of erythrocytosis and/or thrombocytosis", "W11 6.1": "Discuss the “stem cell” as an origin for myeloproliferative neoplasms", "W11 6.2": "Distinguish the common features of the myeloproliferative neoplasms", "W11 6.3": "Compare and contrast the clinical presentations of the different myeloproliferative neoplasms.", "W11 6.4": "Describe how to reach the diagnosis of each myeloproliferative neoplasm.", "W11 6.5": "List the gene mutations characteristic of CML, PV and ET.", "W11 7.3": "Describe the cell cycle and the specificity (or lack thereof) of antineoplastic drugs for cells in specific stages in the cycle.", "W11 7.5": "Define the major classes of antineoplastic drugs used in cancer chemotherapy.", "W11 7.6": "Define the mechanism(s) of action of the designated major classes of antineoplastic drugs.", "W11 7.7": "Describe the major toxicities exhibited by the designated classes of antineoplastic drugs", "W11 8.1": "Describe the role of surgery in hematological malignancies.", "W11 8.2": "Describe the role of radiation in treatment of hematological malignancies.", "W11 8.4": "Define targeted therapy.", "W11 8.5": "Give examples of targeted therapies for B cell malignancies, chronic myeloid leukemia, acute promyelocytic leukemia, and multiple myeloma.", "W11 8.6": "List different classes of immunotherapy.", "W11 8.7": "Describe the rationale for stem cell transplantation", "W11 9.1": "List differential diagnoses of pancytopenia.", "W11 9.2": "Describe the procedure of a bone marrow aspiration and core biopsy with its risks.", "W11 9.3": "List and describe appropriate testing for suspected bone marrow disorder.", "W11 9.5": "Describe laboratory abnormalities of acute promyelocytic leukemia.", "W11 9.6": "Describe the clinical relevance of the genetic abnormalities in myelodysplastic syndrome and acute promyelocytic leukemia."};
const L = "ABCDE";
const N = QUESTIONS.length;
let cur = 0, showResults = false;
let ans = new Array(N).fill(null);           // current pick per question
let tries = QUESTIONS.map(()=>[]);           // every locked attempt: {pick, ok, at}
let strikes = QUESTIONS.map(()=>[]);         // struck option indexes for the open attempt
let history = [], db = null, uid = null, writing = false, dirty = false;
const MAP=document.getElementById("map"); if(MAP && QUESTIONS.length<=60) MAP.open=true;
const LS_KEY = "differential-week-11-question-bank";
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");

function score(){ return ans.reduce((n,a,i)=>n+(a!==null&&a===QUESTIONS[i].a?1:0),0); }
function answered(){ return ans.filter(a=>a!==null).length; }
function firstTryScore(){ return tries.reduce((n,t)=>n+(t.length&&t[0].ok?1:0),0); }
function firstTryCount(){ return tries.filter(t=>t.length).length; }

function renderHeader(){
  const bf=$("#barfill"); if(bf) bf.style.width=(100*answered()/N)+"%";
  $("#stats").innerHTML = `<span>Question <b>${showResults?"–":cur+1}</b> of <b>${N}</b></span><span>Answered <b>${answered()}</b></span><span>Score <b>${score()} / ${answered()}</b></span>`;
  $("#ticks").innerHTML = QUESTIONS.map((q,i)=>{
    const st = ans[i]===null?"":(ans[i]===q.a?"ok":"bad");
    const redo = tries[i].length>1 || (ans[i]===null && tries[i].length>0);
    return `<button class="tick ${st} ${redo?"redo":""} ${(!showResults&&i===cur)?"cur":""}" data-i="${i}" aria-label="Question ${i+1}"></button>`;
  }).join("");
  document.querySelectorAll(".tick").forEach(b=>b.onclick=()=>{cur=+b.dataset.i;showResults=false;render();});
}

function triesLine(i, includeCurrent){
  const t = includeCurrent ? tries[i] : tries[i];
  if(!t.length) return "";
  const parts = t.map((x,k)=>`<span class="${x.ok?"ok":"bad"}">${k+1}: ${L[x.pick]} ${x.ok?"correct":"wrong"}</span>`).join(" · ");
  return `<div class="tries">Attempts ${parts}</div>`;
}

function fmtLine(t){
  let m;
  if((m=t.match(/^Correct:\s*([A-E])\.?\s*(.*)$/)) || (m=t.match(/^([A-E]) is correct\.?\s*(.*)$/)))
    return `<p class="why"><span class="lk ok">${m[1]}</span><span>${esc(m[2])}</span></p>`;
  if((m=t.match(/^([A-E]):\s*(.*)$/)))
    return `<p class="alt"><span class="lk">${m[1]}</span><span>${esc(m[2])}</span></p>`;
  if((m=t.match(/^(Takeaway|High yield|High-yield|Key point|Clues):\s*(.*)$/i)))
    return `<p class="take"><b>${esc(m[1])}.</b> ${esc(m[2])}</p>`;
  return `<p>${esc(t)}</p>`;
}

function renderQ(){
  const q = QUESTIONS[cur], a = ans[cur], done = a!==null, st = strikes[cur];
  const opts = q.o.map((o,i)=>{
    let c = "";
    if(done){ if(i===q.a) c="right"; else if(i===a) c="wrong"; }
    const struck = !done && st.includes(i);
    const strikeBtn = done ? "" : `<button class="strike" data-s="${i}" aria-pressed="${struck}" aria-label="${struck?"Restore":"Strike out"} option ${L[i]}" title="${struck?"Restore":"Strike out"} option">${struck?"↺":"✕"}</button>`;
    return `<div class="optrow ${struck?"struck":""}"><button class="opt ${c}" data-i="${i}" ${done?"disabled":""}><span class="k">${L[i]}</span><span>${esc(o)}</span></button>${strikeBtn}</div>`;
  }).join("");
  let fb = "";
  if(done){
    const ok = a===q.a;
    const lines = q.e.split("\n").map(fmtLine).join("");
    const objs = q.l.map(id=>`<div class="obj"><b>Objective ${esc(id)}</b> ${esc(OBJECTIVES[id]||"")}</div>`).join("");
    fb = `<div class="fb" role="status"><div class="verdict ${ok?"ok":"bad"}">${ok?"Correct.":"Incorrect. The answer is "+L[q.a]+"."}</div>${lines}${objs}${triesLine(cur)}<div class="fbtools"><button class="btn ghost" id="redo">Reset and redo this question</button></div></div>`;
  }
  const pre = (!done && tries[cur].length) ? `<div class="hint">Redo. Your earlier attempts are saved.</div>${triesLine(cur)}` : (!done ? `<div class="hint">Tap ✕ to strike out an option. Right-click works too.</div>` : "");
  const last = cur===N-1;
  $("#main").innerHTML = `<article class="card">
    <div class="chead"><span class="tag">${esc(q.c)}</span><span class="qn">${cur+1} of ${N}</span></div>
    <p class="stem">${esc(q.p)}</p>
    ${pre}
    <div class="opts">${opts}</div>${fb}
    <div class="nav"><button class="btn ghost" id="prev" ${cur===0?"disabled":""}>Previous</button>
    <button class="btn" id="next" ${done?"":"disabled"}>${last?"See results":"Next"}</button></div>
  </article>`;
  document.querySelectorAll(".opt").forEach(b=>{
    b.onclick=()=>{ const p=+b.dataset.i; ans[cur]=p; tries[cur].push({pick:p, ok:p===q.a, at:new Date().toISOString()}); tries[cur]=tries[cur].slice(-10); strikes[cur]=[]; render(false); persist(); };
    b.oncontextmenu=(e)=>{ if(done) return; e.preventDefault(); toggleStrike(+b.dataset.i); };
  });
  document.querySelectorAll(".strike").forEach(b=>b.onclick=()=>toggleStrike(+b.dataset.s));
  const r=$("#redo"); if(r) r.onclick=()=>{ ans[cur]=null; strikes[cur]=[]; render(false); persist(); };
  $("#prev").onclick=()=>{cur--;render();};
  $("#next").onclick=()=>{ if(last){showResults=true;} else cur++; render(); };
}

function toggleStrike(i){
  const s = strikes[cur], k = s.indexOf(i);
  if(k<0) s.push(i); else s.splice(k,1);
  render(false); persist();
}

function renderResults(){
  const s = score(), pct = Math.round(100*s/N);
  const cats = {};
  QUESTIONS.forEach((q,i)=>{ cats[q.c]=cats[q.c]||[0,0]; cats[q.c][1]++; if(ans[i]===q.a) cats[q.c][0]++; });
  const rows = Object.entries(cats).map(([c,[r,t]])=>`<tr><td>${esc(c)}<span class="meter"><i style="width:${Math.round(100*r/t)}%"></i></span></td><td>${r} / ${t}</td></tr>`).join("");
  const missed = {};
  QUESTIONS.forEach((q,i)=>{ const wrongFirst = tries[i].length && !tries[i][0].ok; if(ans[i]!==q.a || wrongFirst) q.l.forEach(id=>{ const w=id.split(" ")[0]; missed[w]=missed[w]||new Set(); missed[w].add(id); }); });
  const weeks = Object.keys(missed).sort((x,y)=>parseInt(x.slice(1))-parseInt(y.slice(1)));
  const missHtml = weeks.length ? weeks.map(w=>`<h3>Week ${w.slice(1)}</h3><ul class="miss">${[...missed[w]].map(id=>`<li><code>${esc(id)}</code>${esc(OBJECTIVES[id]||"")}</li>`).join("")}</ul>`).join("") : "<p>No missed objectives.</p>";
  const redone = tries.filter(t=>t.length>1).length;
  const un = N - answered();
  $("#main").innerHTML = `<article class="card">
    <div class="chead"><span class="tag">Results</span><span>${un?un+" unanswered":"Complete"}</span></div>
    <div><div class="big">${s} / ${N}</div><div class="stats"><span><b>${pct}%</b> correct now</span><span>First try <b>${firstTryScore()} / ${firstTryCount()}</b></span><span>Redone <b>${redone}</b></span></div></div>
    <table><thead><tr><th>Topic</th><th>Score</th></tr></thead><tbody>${rows}</tbody></table>
    <h2>Objectives to review</h2><p class="hint">Includes questions you missed on the first try, even if a redo got them right.</p>${missHtml}${history.length?`<h2>Past attempts</h2><table><thead><tr><th>Date</th><th>Score</th></tr></thead><tbody>${history.slice().reverse().map(h=>`<tr><td>${new Date(h.date).toLocaleDateString()}</td><td>${h.score} / ${h.total}</td></tr>`).join("")}</tbody></table>`:""}
    <div class="nav"><button class="btn ghost" id="back">Back to questions</button><button class="btn" id="restart">Restart all</button></div>
  </article>`;
  $("#back").onclick=()=>{showResults=false;render();};
  $("#restart").onclick=()=>{
    if(answered() || tries.some(t=>t.length)){
      history.push({date:new Date().toISOString(), score:score(), answered:answered(), total:N, firstTry:firstTryScore(),
        missed:QUESTIONS.map((q,i)=>ans[i]!==null&&ans[i]!==q.a?"q"+(i+1):null).filter(Boolean)});
      history=history.slice(-20);
    }
    ans.fill(null); tries=QUESTIONS.map(()=>[]); strikes=QUESTIONS.map(()=>[]); cur=0; showResults=false; render(); persist();
  };
}

function setSave(text, cls){ const el=$("#save"); if(el){ el.textContent=text; el.className="save "+(cls||""); } }
function bodyOf(){
  const a = {};
  QUESTIONS.forEach((q,i)=>{
    if(ans[i]===null && !tries[i].length && !strikes[i].length) return;
    a["q"+(i+1)] = {pick:ans[i], ok:ans[i]!==null && ans[i]===q.a, l:q.l, tries:tries[i], strikes:strikes[i]};
  });
  return {answers:a, history, total:N, answered:answered(), score:score(), firstTry:firstTryScore(), updatedAt:new Date().toISOString()};
}
function validPick(i,p){ return Number.isInteger(p) && p>=0 && p<QUESTIONS[i].o.length; }
function applySaved(d){
  if(!d || typeof d!=="object") return;
  ans.fill(null); tries=QUESTIONS.map(()=>[]); strikes=QUESTIONS.map(()=>[]);
  const a = d.answers || {};
  for(const k in a){
    const i = parseInt(k.slice(1),10)-1, row = a[k];
    if(!(i>=0 && i<N) || !row || typeof row!=="object") continue;
    if(validPick(i,row.pick)) ans[i]=row.pick;
    if(Array.isArray(row.tries)) tries[i]=row.tries.filter(t=>t&&validPick(i,t.pick)).map(t=>({pick:t.pick, ok:t.pick===QUESTIONS[i].a, at:String(t.at||"")})).slice(-10);
    else if(ans[i]!==null) tries[i]=[{pick:ans[i], ok:ans[i]===QUESTIONS[i].a, at:""}];
    if(Array.isArray(row.strikes)) strikes[i]=row.strikes.filter(x=>validPick(i,x));
  }
  history = Array.isArray(d.history) ? d.history.slice(-20) : [];
  const first = ans.findIndex(x=>x===null); cur = first<0 ? N-1 : first;
}
function lsLoad(){ try{ return JSON.parse(localStorage.getItem(LS_KEY)||"null"); }catch(e){ return null; } }
function lsSave(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(bodyOf())); }catch(e){} }
async function persist(){
  lsSave();
  if(!db || !uid) return;
  dirty = true; if(writing) return; writing = true;
  while(dirty){
    dirty = false;
    setSave("Saving…");
    try{ await db.doc("attempts/"+uid).set(bodyOf()); setSave("Progress saved to your account.","ok"); }
    catch(e){
      if(e && e.code==="invalid_argument"){ db=null; setSave("Progress saves in this browser only.","bad"); break; }
      setSave("Could not save to your account. Progress saves in this browser.","bad");
    }
  }
  writing = false;
}
async function connect(){
  try{
    if(!window.claude || !window.claude.use) return;
    const [u, d] = await Promise.all([window.claude.use("user"), window.claude.use("db")]);
    if(!u || !d) return;
    const id = await u.id(); if(!id) return;
    db = d; uid = id;
    const snap = await db.doc("attempts/"+uid).get();
    if(snap.exists){ applySaved(snap.data()); render(); setSave("Progress saved to your account.","ok"); }
    else if(answered() || tries.some(t=>t.length)){ persist(); }
    else setSave("Progress saves to your account.","ok");
  }catch(e){ /* keep local-only mode */ }
}

function render(top=true){ renderHeader(); showResults?renderResults():renderQ(); if(top) window.scrollTo({top:0}); }
applySaved(lsLoad());
render();
connect();
</script>
