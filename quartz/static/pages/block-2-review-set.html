<style>
/* Layout: single exam card column, header strip with score and tick map, results replace the card */
:root{
  --bg:#EEF0EA;--paper:#FFFFFF;--ink:#1F2A24;--muted:#5B6A61;--line:#D7DBD2;
  --accent:#2F6F5E;--wash:#E4EDE9;
  --ok:#2E7D4F;--okw:#E4F2E8;--bad:#A13D2C;--badw:#F6E7E3;--tick:#C9CFC4;
  --serif:"Source Serif 4",Georgia,"Times New Roman",serif;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#171C18;--paper:#1F251F;--ink:#EDEFE9;--muted:#9BA79C;--line:#333A32;
  --accent:#6FBBA3;--wash:#24302A;--ok:#6FBB8B;--okw:#1F3226;--bad:#E28C79;--badw:#3A2420;--tick:#3E463D;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#171C18;--paper:#1F251F;--ink:#EDEFE9;--muted:#9BA79C;--line:#333A32;
  --accent:#6FBBA3;--wash:#24302A;--ok:#6FBB8B;--okw:#1F3226;--bad:#E28C79;--badw:#3A2420;--tick:#3E463D;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.55}
.wrap{max-width:760px;margin:0 auto;padding-block:28px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px}
header{display:flex;flex-direction:column;gap:12px}
.eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
h1{font-family:var(--serif);font-weight:600;font-size:clamp(26px,5vw,34px);line-height:1.15;margin:0;text-wrap:balance}
.stats{display:flex;flex-wrap:wrap;gap:8px 22px;font-family:var(--mono);font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.stats b{color:var(--ink);font-weight:500}
.save{font-family:var(--mono);font-size:12px;color:var(--muted)}
.save.ok{color:var(--ok)}.save.bad{color:var(--bad)}
.ticks{display:flex;flex-wrap:wrap;gap:4px}
.tick{width:16px;height:16px;border:0;background:var(--tick);padding:0;cursor:pointer}
.tick.ok{background:var(--ok)}.tick.bad{background:var(--bad)}
.tick.cur{outline:2px solid var(--ink);outline-offset:1px}
.tick:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.card{background:var(--paper);border:1px solid var(--line);padding:22px;display:flex;flex-direction:column;gap:16px}
.chead{display:flex;justify-content:space-between;gap:10px;font-family:var(--mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.tag{color:var(--accent);background:var(--wash);padding:2px 8px}
.stem{font-family:var(--serif);font-size:18px;line-height:1.55;margin:0;white-space:pre-line}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;background:var(--paper);color:var(--ink);border:1px solid var(--line);padding:12px 14px;font:inherit;cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--accent);background:var(--wash)}
.opt:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.opt:disabled{cursor:default}
.opt .k{font-family:var(--mono);font-weight:500;color:var(--muted);min-width:1.2em}
.opt.right{border-color:var(--ok);background:var(--okw)}.opt.right .k{color:var(--ok)}
.opt.wrong{border-color:var(--bad);background:var(--badw)}.opt.wrong .k{color:var(--bad)}
.fb{border-top:1px solid var(--line);padding-top:14px;display:flex;flex-direction:column;gap:8px}
.verdict{font-weight:600}.verdict.ok{color:var(--ok)}.verdict.bad{color:var(--bad)}
.fb p{margin:0}
.obj{font-family:var(--mono);font-size:12px;color:var(--muted);line-height:1.5;border-left:2px solid var(--line);padding-left:10px}
.nav{display:flex;justify-content:space-between;gap:10px}
.btn{font:inherit;font-weight:500;padding:10px 18px;border:1px solid var(--accent);background:var(--accent);color:var(--paper);cursor:pointer}
.btn.ghost{background:transparent;color:var(--accent)}
.btn:disabled{opacity:.4;cursor:default}
.btn:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.big{font-family:var(--serif);font-size:44px;font-weight:600;line-height:1;font-variant-numeric:tabular-nums}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
td,th{text-align:left;padding:6px 0;border-bottom:1px solid var(--line);font-size:14px}
th{font-family:var(--mono);font-size:12px;font-weight:500;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
td:last-child,th:last-child{text-align:right}
h2{font-family:var(--serif);font-size:20px;font-weight:600;margin:0}
h3{font-family:var(--mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:6px 0 0;font-weight:500}
.miss{margin:0;padding-left:0;list-style:none;display:flex;flex-direction:column;gap:6px;font-size:14px}
.miss code{font-family:var(--mono);color:var(--bad);margin-right:6px}
.optrow{display:flex;gap:6px;align-items:stretch}
.optrow .opt{flex:1;min-width:0}
.strike{flex:0 0 auto;width:40px;border:1px solid var(--line);background:var(--paper);color:var(--muted);font-family:var(--mono);font-size:13px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.strike:hover{border-color:var(--accent);color:var(--accent)}
.strike:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.strike[aria-pressed="true"]{background:var(--wash);color:var(--ink)}
.optrow.struck .opt > span:last-child{text-decoration:line-through;color:var(--muted)}
.optrow.struck .opt .k{color:var(--line)}
.tries{font-family:var(--mono);font-size:12px;color:var(--muted)}
.tries .bad{color:var(--bad)}.tries .ok{color:var(--ok)}
.hint{font-family:var(--mono);font-size:12px;color:var(--muted)}
.fbtools{display:flex;justify-content:flex-end}
.tick.redo{box-shadow:inset 0 -3px 0 var(--accent)}
@media (prefers-reduced-motion:no-preference){.fb{animation:in .18s ease-out}@keyframes in{from{opacity:.4;transform:translateY(3px)}to{opacity:1;transform:none}}}
</style>

<div class="wrap">
  <header>
    <div class="eyebrow">Foundations of Medicine · Block 2 · Review of mock exam misses</div>
    <h1>Targeted Review: Your Mock Exam Misses</h1>
    <div class="stats" id="stats"></div>
    <div class="save" id="save" role="status">Progress saves in this browser.</div>
    <div class="ticks" id="ticks" aria-label="Question map"></div>
  </header>
  <main id="main"></main>
</div>

<script>
const QUESTIONS = [{"c": "Test performance", "p": "The same blood test is used in two settings. Clinic 1 screens healthy adults where the disease is rare. Clinic 2 is a specialist clinic where most referred patients have symptoms of the disease. Which statement is correct?", "o": ["The PPV is the same in both clinics", "The specificity is lower in Clinic 1", "The PPV is higher in Clinic 2", "The ROC curve shifts upward in Clinic 2", "The sensitivity is higher in Clinic 2"], "a": 2, "e": "C is correct. Higher pretest probability gives a higher PPV, and predictive value changes with prevalence. Sensitivity and specificity are calculated within the diseased and healthy groups separately, so they do not change with prevalence.\nA: Predictive values change with prevalence.\nB: Specificity is TN / (TN + FP), measured only in people without the disease.\nD: The ROC curve plots sensitivity against 1 minus specificity, which do not change with prevalence.\nE: Sensitivity is TP / (TP + FN), measured only in people with the disease.\nHigh yield: This is the rule behind your mock exam miss: pretest probability does change PPV.", "l": ["W5 7.1"]}, {"c": "Test performance", "p": "On a ROC curve, one cut-point of a new test sits at x = 0.10 and y = 0.90. What are the sensitivity and specificity at this cut-point?", "o": ["Sensitivity 90%, specificity 10%", "PPV 90% with an NPV of 10%", "Sensitivity 10%, specificity 10%", "Sensitivity 90%, specificity 90%", "Sensitivity 10%, specificity 90%"], "a": 3, "e": "D is correct. The x-axis is the false positive rate (1 minus specificity), so x = 0.10 means specificity 90%. The y-axis is the true positive rate (sensitivity), so y = 0.90 means sensitivity 90%.\nA: Specificity is 1 minus x, not x itself.\nB: ROC curves plot sensitivity and the false positive rate, not predictive values.\nC: This misreads both axes.\nE: Sensitivity is read from the y-axis, 0.90.\nHigh yield: More area under the curve means a more effective test.", "l": ["W5 7.1"]}, {"c": "Test performance", "p": "A test with 80% sensitivity and 90% specificity is used in 1,000 people. The disease prevalence is 10%. What is the approximate negative predictive value?", "o": ["90%", "98%", "81%", "80%", "47%"], "a": 1, "e": "B is correct. 100 have the disease: TP 80, FN 20. 900 are healthy: TN 810, FP 90. NPV = TN / (TN + FN) = 810 / 830, about 98%.\nA: 90% is the specificity.\nC: 81% is TN out of all 1,000 people, not out of all negative tests.\nD: 80% is the sensitivity.\nE: 47% is the PPV, 80 / 170.\nHigh yield: Low prevalence keeps NPV high and drags PPV down.", "l": ["W5 7.1"]}, {"c": "Test performance", "p": "A lab sets its decision threshold at the upper limit of the reference range. A healthy blood donor with no disease has a result above the threshold. How is this result classified?", "o": ["False positive", "Precision error", "True negative", "False negative", "True positive"], "a": 0, "e": "A is correct. With disease absent, a result below the threshold is a true negative and a result above it is a false positive.\nB: Precision is the spread of repeated results, not the classification of one result.\nC: A true negative falls below the threshold.\nD: A false negative is a result below the threshold in someone with disease.\nE: A true positive needs disease present.\nHigh yield: Increasing TN raises specificity. Increasing TP raises sensitivity.", "l": ["W5 7.1", "W5 7.2.2"]}, {"c": "Health equity", "p": "A public health report reviews income-related health gaps in Canada. Which of the following statements is FALSE?", "o": ["Social determinants hit marginalized groups harder in COVID-19", "The cost of health disparity in Canada is $6.1 billion", "The poorest fifth make fewer specialist visits", "Income gaps in self-rated mental health have narrowed", "Income gaps in COPD hospitalization have widened"], "a": 3, "e": "D is correct. Gaps by income in self-rated mental health and COPD hospitalization have widened over time, not narrowed.\nA: True. Multimorbidity, dense households and testing rates hit marginalized groups harder.\nB: True. The cost of disparity is $6.1 billion.\nC: True. The poorest fifth have fewer specialist visits, the fact your mock exam tested.\nE: True. COPD hospitalization gaps have widened.\nHigh yield: FALSE items: test each option against the notes and pick the one that fails.", "l": ["W5 4.1"]}, {"c": "Health equity", "p": "A clinic runs two policies. Policy 1 offers the same flu clinic hours to all adults who have the same level of need. Policy 2 adds evening outreach and transit help only for patients with fewer resources. Which equity concept fits each policy, in order?", "o": ["Vertical equity for both of them", "Horizontal equity for both of them", "Vertical, then horizontal equity", "Horizontal, then vertical equity"], "a": 3, "e": "D is correct. Horizontal equity is equal treatment of equals in relevant respects. Vertical equity is unequal treatment for those who are unequal in relevant respects.\nA: Policy 1 treats equal groups the same, which is horizontal.\nB: Policy 2 treats unequal groups differently, which is vertical.\nC: This reverses the two.\nHigh yield: The poorest fifth are less likely to use cancer screening and have more avoidable deaths.", "l": ["W5 4.1", "W5 4.3"]}, {"c": "Pathology reports", "p": "Two sections of a surgical pathology report are described. Section 1 gives the location and type of the tissue sample. Section 2 is the overall summary of the most important findings and influences management. Which sections are these, in order?", "o": ["Specimen, then Diagnosis", "Clinical information, then Diagnosis", "Specimen, then Synoptic report", "Gross description, then Synoptic report"], "a": 0, "e": "A is correct. The Specimen section gives the location and type of tissue. The Diagnosis section is the overall summary of the most important findings, and it influences management.\nB: Clinical information carries the history from the requisition.\nC: The synoptic report is a checklist, not the overall summary.\nD: The gross description covers the specimen's appearance, ink and section codes. The synoptic report is the checklist within the microscopic description.\nHigh yield: Your mock exam miss: the synoptic report is the checklist, and the Diagnosis section is the summary.", "l": ["W6 4.4"]}, {"c": "Pathology reports", "p": "An oncologist needs the margin status, lymph node findings and stage classification for a resected breast cancer. In which part of the pathology report are these found?", "o": ["The specimen section", "The Diagnosis section summary", "The clinical information section", "The gross description of the whole specimen", "The synoptic report, microscopic section"], "a": 4, "e": "E is correct. The synoptic report, within the microscopic description, lists specimen, tumour, margins, lymph nodes, stage classification, additional findings and comments.\nA: The specimen section gives location and type of tissue.\nB: The Diagnosis is an overall summary, not the full checklist.\nC: Clinical information comes from the requisition.\nD: The gross description gives specimen, main findings, ink code and section code.\nHigh yield: ER, PR and Her2 biomarker results also sit in the microscopic description.", "l": ["W6 4.5", "W6 6.4"]}, {"c": "Pathology reports", "p": "Helen's hereditary cancer genetic report is marked ABNORMAL. Which statement about this type of report is correct?", "o": ["Its Interpretation gives significance from ClinVar", "The hereditary cancer panel tests 5 genes", "A variant of uncertain significance is ACMG class 2", "Its specimen is tumour tissue from the biopsy site", "An ACMG class 5 variant is pathogenic"], "a": 0, "e": "A is correct. The Interpretation section states the result, the findings (type of mutation, exon, gene) and the clinical significance from ClinVar and the literature.\nB: The multi-gene panel tests 37 genes.\nC: A VUS is class 3. Class 2 is likely pathogenic.\nD: The specimen is blood.\nE: Class 5 is benign. Class 1 is pathogenic.\nHigh yield: ACMG: 1 pathogenic, 2 likely pathogenic, 3 VUS, 4 likely benign, 5 benign.", "l": ["W6 4.5", "W6 6.3"]}, {"c": "Cancer screening", "p": "A medical student lists screening intervals for average-risk adults. Which interval is correct?", "o": ["FIT every year", "Flexible sigmoidoscopy every 5 years", "Prostate PSA every year from age 55", "Mammogram every year from age 50", "Pap test every 3 years"], "a": 4, "e": "E is correct. Cervical screening with a Pap test is every 3 years for women 25-70.\nA: FIT is every 2 years.\nB: Flexible sigmoidoscopy or colonoscopy is every 10 years.\nC: PSA for men 55-69 is every 2-4 years.\nD: Average-risk mammograms are every 2 years from 50 to 74.\nHigh yield: Your first-try miss on the mock: sigmoidoscopy is every 10 years, not 2.", "l": ["W6 7.11"]}, {"c": "Cancer screening", "p": "Mrs. Leclerc, 71, is healthy and has had three negative Pap tests in a row over the last 10 years. She asks whether she still needs cervical screening. What is the best answer?", "o": ["Continue Pap tests every 3 years for life", "Continue Pap tests every 3 years until age 74", "She has aged out of cervical screening", "Switch to mammograms in place of Pap tests", "Switch to a yearly Pap test after age 70"], "a": 2, "e": "C is correct. Cervical screening runs ages 25-70. Women over 70 with 3 or more successive negative tests in the last 10 years are out.\nA: Screening stops at 70 with a negative history.\nB: 74 is the stop age for breast and colorectal screening, not cervical.\nD: Mammograms screen for breast cancer, not cervical cancer.\nE: No yearly Pap test is recommended after 70.\nHigh yield: Stop ages: cervical 70, breast 74, colorectal 74, prostate 69.", "l": ["W6 7.11"]}, {"c": "Cancer screening", "p": "Mr. Becker, 74, feels well and asks his family doctor to start yearly PSA tests for prostate cancer screening. Which response fits the screening guidance?", "o": ["He is outside the PSA group at age 70+", "Order a low-dose CT scan instead", "Start PSA because everyone over 55 qualifies", "Start a yearly PSA with a yearly DRE", "Start PSA every 2-4 years until age 80"], "a": 0, "e": "A is correct. PSA screening is for men 55-69 every 2-4 years. Men 70 and over are out.\nB: Low-dose CT screens for lung cancer.\nC: The window is 55-69, not everyone over 55.\nD: Yearly PSA and DRE from 45 is for BRCA-positive men.\nE: Screening ends at 69.\nHigh yield: Of 1,000 men tested, about 1 escapes death, which is why PSA screening is controversial.", "l": ["W6 7.11"]}, {"c": "Lesion localization", "p": "Ms. Ortiz, 34, has double vision, drooping eyelids and trouble swallowing that worsen over weeks. Her limb reflexes are normal or reduced, plantar responses are flexor and sensation is normal. Where is the lesion?", "o": ["Spinal root", "Muscle", "Multiple peripheral nerves", "Neuromuscular junction", "Brainstem"], "a": 3, "e": "D is correct. Eyes and swallowing with LMN-type findings and spared sensation localize to the NMJ.\nA: A root lesion is limited to one myotome.\nB: Muscle disease gives generalized proximal weakness.\nC: Multiple nerve lesions involve sensation.\nE: The brainstem gives UMN signs such as brisk reflexes and extensor plantars.\nHigh yield: Your mock exam miss: NMJ means eyes and swallowing, not a single myotome.", "l": ["W7 6.4", "W7 6.3"]}, {"c": "Lesion localization", "p": "Mr. Brown, 62, struggles to rise from a chair and lift his arms above his head. Weakness is symmetric in the shoulders and hips. Eye movements and swallowing are normal, sensation is normal and plantars are flexor. Where is the lesion?", "o": ["Cervical spinal cord", "Spinal root", "Single peripheral nerve", "Muscle", "Neuromuscular junction"], "a": 3, "e": "D is correct. Generalized proximal weakness with spared sensation and no UMN signs localizes to muscle.\nA: A cervical cord lesion gives UMN signs in four limbs.\nB: A root lesion causes weakness in one myotome.\nC: A single nerve lesion is limited to that nerve's distribution.\nE: The NMJ typically involves the eyes and swallowing.\nHigh yield: LMN sites: anterior horn cell, root, nerve, NMJ, muscle.", "l": ["W7 6.4", "W7 6.3"]}, {"c": "Lesion localization", "p": "Two patients have LMN weakness in one leg. Patient 1's weakness and numbness match the distribution of a single named peripheral nerve. Patient 2's weakness matches a single myotome. Which localization fits each, in order?", "o": ["Single nerve, then spinal root", "Spinal root, then single nerve", "Multiple nerves, then muscle", "Single nerve, then anterior horn cell"], "a": 0, "e": "A is correct. Weakness in the distribution of one nerve localizes to that nerve. Weakness in a single myotome matches the distribution of a root.\nB: This reverses the two.\nC: Multiple nerves give a wider pattern, and muscle disease is generalized and proximal.\nD: A single myotome pattern is the root pattern.\nHigh yield: For LMN lesions, ask whether sensation is affected and what the distribution is.", "l": ["W7 6.4", "W7 6.3"]}, {"c": "Enzyme induction and inhibition", "p": "Ms. Haddad takes a drug cleared mainly by CYP3A4, and her condition is well controlled. She starts rifampin for an infection. Two weeks later her symptoms return. What is the most likely explanation?", "o": ["Her drug became a prodrug after rifampin", "Rifampin reduced her renal clearance", "Rifampin inhibited CYP3A4 and raised her drug levels", "Rifampin blocked her drug's receptor directly", "Rifampin induced CYP3A4 and lowered her drug levels"], "a": 4, "e": "E is correct. Rifampin is a potent CYP3A4 inducer. Induction increases clearance of other drugs and lowers their levels, so they lose effect.\nA: A drug does not change into a prodrug.\nB: Rifampin acts on liver metabolism here.\nC: Rifampin is an inducer, and higher levels would cause toxicity, not failure.\nD: This is a pharmacokinetic interaction, not receptor blockade.\nHigh yield: Induction lowers levels. Inhibition raises them.", "l": ["W8 O45", "W8 O34"]}, {"c": "Enzyme induction and inhibition", "p": "Drug P is an inactive prodrug converted to its active form by CYP3A4. A patient stable on Drug P starts carbamazepine, a CYP3A4 inducer. What is expected?", "o": ["Less active drug, since inducers block activation", "More inactive prodrug left in the plasma", "More active drug, with a stronger effect", "No change, since prodrugs avoid CYP enzymes", "Less active drug, with a weaker effect"], "a": 2, "e": "C is correct. For prodrugs the rule reverses. Induction speeds activation, making more active drug and a stronger effect.\nA: Inducers increase enzyme activity.\nB: Faster activation leaves less prodrug, not more.\nD: Prodrugs depend on CYP enzymes for activation.\nE: That is the result for an active drug, not a prodrug.\nHigh yield: Induction lowers drug levels, inhibition raises them, opposite for prodrugs.", "l": ["W8 O45", "W8 O33"]}, {"c": "Enzyme induction and inhibition", "p": "Which of the following are listed as potent CYP inhibitors?\ni) Ketoconazole\nii) Clarithromycin\niii) Rifampin\niv) Fluconazole", "o": ["i) and ii) only", "i), ii) and iv) only", "ii) and iii) only", "i), iii) and iv) only", "All of the above"], "a": 1, "e": "B is correct. Ketoconazole and clarithromycin inhibit CYP3A4. Fluconazole inhibits CYP2C9. Rifampin is an inducer.\nA: Fluconazole is also an inhibitor.\nC: Rifampin is an inducer.\nD: Rifampin is an inducer and clarithromycin is an inhibitor.\nE: Rifampin is an inducer.\nHigh yield: Inducers: rifampin, phenytoin, carbamazepine, St. John's Wort, cigarette smoke, corticosteroids.", "l": ["W8 O45"]}, {"c": "Enzyme induction and inhibition", "p": "Which pairing correctly lists a CYP inducer, then a CYP inhibitor, in order?", "o": ["Erythromycin, then ketoconazole", "Ciprofloxacin, then rifampin", "Phenytoin, then fluoxetine", "St. John's Wort, then carbamazepine", "Fluoxetine, then phenytoin"], "a": 2, "e": "C is correct. Phenytoin induces CYP2C9 and CYP3A4. Fluoxetine inhibits CYP2D6.\nA: Both are inhibitors.\nB: Ciprofloxacin is an inhibitor (CYP1A2) and rifampin an inducer, the reverse order.\nD: Both are inducers.\nE: This reverses the two.\nHigh yield: Cigarette smoke induces CYP1A2, the fact behind your theophylline miss.", "l": ["W8 O45", "W8 O46"]}, {"c": "Lifespan pharmacology", "p": "The same renally cleared antibiotic is dosed in three children: a 3-day-old term newborn, an 8-month-old infant and a 4-year-old. Whose glomerular filtration rate, adjusted for body surface area, is highest?", "o": ["The newborn and infant equally", "All three are equal", "The 4-year-old", "The 3-day-old", "The 8-month-old"], "a": 2, "e": "C is correct. GFR is low at birth, doubles at 1 week and again at 1 month, reaches adult values at 6-12 months and exceeds adult values at 2-6 years.\nA: The newborn's GFR is lower than the infant's.\nB: GFR changes rapidly through early childhood.\nD: GFR is lowest at birth.\nE: At 8 months GFR is near adult values, below the 2-6 year peak.\nHigh yield: Premature newborn GFR: 5-10 mL/min/m2. Term newborn: 10-15.", "l": ["W8 O37"]}, {"c": "Lifespan pharmacology", "p": "Mrs. Varga, 84, takes oral iron for anemia, but her levels barely change. Which age-related change best explains the poor response?", "o": ["Lower stomach acidity altering absorption", "Increased stomach acidity degrading the iron", "Increased liver enzyme activity", "Increased GFR clearing the iron too fast", "Faster gastric emptying shortening contact time"], "a": 0, "e": "A is correct. Older adults have decreased stomach acidity, which alters absorption of iron, ketoconazole and dabigatran.\nB: Stomach acidity falls with age.\nC: Liver function falls with age.\nD: GFR falls with age.\nE: Gastric emptying slows with age.\nHigh yield: Infants also have low stomach acid, which raises penicillin absorption, as in your mock exam.", "l": ["W8 O37", "W8 O39"]}, {"c": "Lifespan ph  ["i) and ii) only", "i), ii) and iv) only", "ii) and iii) only", "i), iii) and iv) only", "All of the above"], "a": 1, "e": "B is correct. PK interactions change drug disposition: elimination (i, iv) or bioavailability (ii). ACE inhibitor with a K+-sparing diuretic is a PD interaction with additive effects.\nA: Statement iv is also PK.\nC: Statement iii is PD.\nD: Statement iii is PD and ii is PK.\nE: Statement iii is PD.\nHigh yield: PK: what the body does to the drug. PD: what the drugs do together.", "l": ["W8 O46", "W8 O45"]}, {"c": "Drug interactions", "p": "Mrs. Kim, 81, takes a tricyclic antidepressant. She starts an antihistamine for sleep and within days becomes confused and agitated. What is the best explanation?", "o": ["A PK interaction lowering antihistamine absorption", "A PD interaction, additive anticholinergic effects", "A drug-food interaction from her large evening meal", "A Type B idiosyncratic allergic reaction", "A PK interaction raising tricyclic plasma levels"], "a": 1, "e": "B is correct. TCAs with antihistamines or neuroleptics produce additive anticholinergic effects and delirium, a pharmacodynamic interaction.\nA: Reduced absorption would weaken, not add, effects.\nC: No food is involved.\nD: The reaction is predictable from the drugs' actions.\nE: The effect comes from combined actions, not raised levels.\nHigh yield: Antihistamines and anticholinergics are also delirium precipitants in DIMESPPP.", "l": ["W8 O46", "W8 O38"]}, {"c": "Drug interactions", "p": "A pharmacology tutor reviews drug interactions. Which statement is correct?", "o": ["PD interactions involve changes in the disposition of a drug", "Enzyme inducers make other drugs more potent and more toxic", "A constituent of grapefruit induces CYP3A4 activity", "Leafy green vegetables raise the efficacy of warfarin", "Altered elimination is the top cause of adverse interactions"], "a": 4, "e": "E is correct. Alteration in drug elimination is the most common cause of adverse drug interactions.\nA: Changes in disposition define PK interactions.\nB: Inducers increase clearance and make other drugs less effective.\nC: Grapefruit destroys CYP3A4, an inhibitory effect.\nD: Their vitamin K decreases warfarin efficacy.\nHigh yield: Risk factors for interactions: polypharmacy, many prescribers, older age, narrow therapeutic window, female sex.", "l": ["W8 O46"]}, {"c": "Drug regulation", "p": "A medical student reviews the bodies involved in bringing a drug to market in Canada. Which statement is correct?", "o": ["PMPRB is a provincial body run by each province", "Health Canada evaluates value for money", "PMPRB sets price ceilings on patented drugs", "pCPA approves drugs for sale in Canada", "CADTH negotiates the price with the company"], "a": 2, "e": "C is correct. The Patented Medicine Prices Review Board is a federal body that sets price ceilings for patented drugs.\nA: PMPRB is federal.\nB: Health Canada evaluates quality, safety and efficacy.\nD: Health Canada approves drugs for sale. The pCPA negotiates the price.\nE: CADTH evaluates value for money.\nHigh yield: Approval: Health Canada. Ceiling: PMPRB. Value: CADTH. Negotiation: pCPA. Listing: drug plans.", "l": ["W8 O21"]}, {"c": "Drug regulation", "p": "A new childhood vaccine is submitted to Health Canada for approval. Which part of the Health Products and Food Branch reviews it?", "o": ["Pan-Canadian Pharmaceutical Alliance", "Canadian Agency for Drugs and Technologies", "Biologic and Genetic Therapies Directorate", "Patented Medicine Prices Review Board", "Therapeutic Products Directorate of Health Canada"], "a": 2, "e": "C is correct. The Biologic and Genetic Therapies Directorate reviews vaccines and biologics. The Therapeutic Products Directorate reviews drugs.\nA: pCPA negotiates prices.\nB: CADTH evaluates value for money.\nD: PMPRB sets price ceilings.\nE: The TPD reviews drugs, not vaccines.\nHigh yield: Both directorates sit in the Health Products and Food Branch of Health Canada.", "l": ["W8 O21"]}, {"c": "Drug regulation", "p": "A trial enrolls patients with the disease and compares a new drug head-to-head with the current standard of care. Which phase of drug development is this?", "o": ["Phase IV", "Phase III", "Pre-clinical", "Phase II", "Phase I"], "a": 1, "e": "B is correct. Phase III is a head-to-head comparison with the standard of care.\nA: Phase IV is post-market surveillance.\nC: Pre-clinical work is chemical, in vitro and animal testing.\nD: Phase II tests the drug in patients, without a head-to-head comparison.\nE: Phase I typically uses about 20 healthy male volunteers aged 21-30.\nHigh yield: Rare adverse reactions surface in Phase IV, after approval.", "l": ["W8 O47"]}, {"c": "Drug regulation", "p": "After the price of a new drug is negotiated, a federal, provincial and territorial body decides whether it goes on the public list of covered drugs and under what conditions. Who does this?", "o": ["The public drug plans", "The Pan-Canadian Pharmaceutical Alliance", "Health Canada's Therapeutic Products Directorate", "Private drug plans", "The Patented Medicine Prices Review Board"], "a": 0, "e": "A is correct. Federal, provincial and territorial drug plans establish drug formularies and reimbursement criteria.\nB: pCPA negotiates the price, the step before listing.\nC: The TPD approves drugs for sale.\nD: Private plans decide coverage for their own clients, not public lists.\nE: PMPRB sets price ceilings.\nHigh yield: A drug formulary is a list of medications approved for use in a hospital or provided by a drug plan.", "l": ["W8 O21", "W8 O16"]}];
const OBJECTIVES = {"W5 7.1": "Define screening lab test performance parameters (e.g. accuracy, precision, predictive value, sensitivity, specificity)", "W5 7.2.2": "Discuss what reference intervals are", "W5 4.1": "Understand the concepts of inequality and inequity, and the relationship between social determinants and lifetime health experiences", "W5 4.3": "Recognize the role of health system in exacerbating or mitigating health inequities, and the role of health care policy to address these barriers", "W6 4.4": "Explain meaning of a pathology report", "W6 4.5": "Interpret a cancer synoptic report and cancer genetics test report", "W6 6.4": "Explain how cancer staging and molecular pathology can be used to inform prognosis and treatment", "W6 6.3": "Explain benefits of referral for cancer genetic counseling, including risk assessment, informed consent for genetic testing, and screening of additional family members", "W6 7.11": "Use knowledge of cancer screening programs in Canada to prepare cancer screening plans for adults with diverse risk profiles", "W7 6.4": "Develop an approach to localization of lesions in the nervous system", "W7 6.3": "Distinguish between upper motor neuron vs lower motor neuron signs", "W8 O45": "Explain the pharmacological basis of adverse drug reactions, including pharmacokinetic and pharmacodynamic mechanisms.", "W8 O34": "Apply basic principles of pharmacokinetics and pharmacodynamics to clinical scenarios", "W8 O33": "Explain how the interplay between pharmacokinetics and pharmacodynamics affects drug response", "W8 O46": "Describe potential outcomes of pharmacokinetic and pharmacodynamic drug interactions, including both harmful and beneficial effects.", "W8 O37": "Compare the pharmacokinetics and pharmacodynamics changes across the lifespan", "W8 O39": "Identify factors that affect therapeutics in different populations", "W8 O38": "Identify factors that lead to adverse drug reactions across the lifespan", "W8 O21": "Summarize the process and regulatory control of drug development and funding", "W8 O47": "Summarize the phases of drug development and identify how adverse drug reactions are studied and detected at each stage.", "W8 O16": "Describe the governance and funding models the Canadian healthcare"};
const L = "ABCDE";
const N = QUESTIONS.length;
let cur = 0, showResults = false;
let ans = new Array(N).fill(null);           // current pick per question
let tries = QUESTIONS.map(()=>[]);           // every locked attempt: {pick, ok, at}
let strikes = QUESTIONS.map(()=>[]);         // struck option indexes for the open attempt
let history = [], db = null, uid = null, writing = false, dirty = false;
const LS_KEY = "quiz-progress-v2";
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");

function score(){ return ans.reduce((n,a,i)=>n+(a!==null&&a===QUESTIONS[i].a?1:0),0); }
function answered(){ return ans.filter(a=>a!==null).length; }
function firstTryScore(){ return tries.reduce((n,t)=>n+(t.length&&t[0].ok?1:0),0); }
function firstTryCount(){ return tries.filter(t=>t.length).length; }

function renderHeader(){
  $("#stats").innerHTML = `<span>Item <b>${showResults?"–":cur+1}</b> of <b>${N}</b></span><span>Answered <b>${answered()}</b></span><span>Score <b>${score()} / ${answered()}</b></span>`;
  $("#ticks").innerHTML = QUESTIONS.map((q,i)=>{
    const st = ans[i]===null?"":(ans[i]===q.a?"ok":"bad");
    const redo = tries[i].length>1 || (ans[i]===null && tries[i].length>0);
    return `<button class="tick ${st} ${redo?"redo":""} ${(!showResults&&i===cur)?"cur":""}" data-i="${i}" aria-label="Question ${i+1}"></button>`;
  }).join("");
  document.querySelectorAll(".tick").forEach(b=>b.onclick=()=>{cur=+b.dataset.i;showResults=false;render();});
}

function triesLine(i, includeCurrent){
  const t = includeCurrent ? tries[i] : tries[i];
  if(!t.length) return "";
  const parts = t.map((x,k)=>`<span class="${x.ok?"ok":"bad"}">${k+1}: ${L[x.pick]} ${x.ok?"correct":"wrong"}</span>`).join(" · ");
  return `<div class="tries">Attempts ${parts}</div>`;
}

function renderQ(){
  const q = QUESTIONS[cur], a = ans[cur], done = a!==null, st = strikes[cur];
  const opts = q.o.map((o,i)=>{
    let c = "";
    if(done){ if(i===q.a) c="right"; else if(i===a) c="wrong"; }
    const struck = !done && st.includes(i);
    const strikeBtn = done ? "" : `<button class="strike" data-s="${i}" aria-pressed="${struck}" aria-label="${struck?"Restore":"Strike out"} option ${L[i]}" title="${struck?"Restore":"Strike out"} option">${struck?"↺":"✕"}</button>`;
    return `<div class="optrow ${struck?"struck":""}"><button class="opt ${c}" data-i="${i}" ${done?"disabled":""}><span class="k">${L[i]}</span><span>${esc(o)}</span></button>${strikeBtn}</div>`;
  }).join("");
  let fb = "";
  if(done){
    const ok = a===q.a;
    const lines = q.e.split("\n").map(t=>`<p>${esc(t)}</p>`).join("");
    const objs = q.l.map(id=>`<div class="obj">Objective: ${esc(id)}. ${esc(OBJECTIVES[id]||"")}</div>`).join("");
    fb = `<div class="fb" role="status"><div class="verdict ${ok?"ok":"bad"}">${ok?"Correct.":"Incorrect. The answer is "+L[q.a]+"."}</div>${lines}${objs}${triesLine(cur)}<div class="fbtools"><button class="btn ghost" id="redo">Reset and redo this question</button></div></div>`;
  }
  const pre = (!done && tries[cur].length) ? `<div class="hint">Redo. Your earlier attempts are saved.</div>${triesLine(cur)}` : (!done ? `<div class="hint">Tap ✕ to strike out an option. Right-click works too.</div>` : "");
  const last = cur===N-1;
  $("#main").innerHTML = `<article class="card">
    <div class="chead"><span class="tag">${esc(q.c)}</span><span>Q${cur+1}</span></div>
    <p class="stem">${esc(q.p)}</p>
    ${pre}
    <div class="opts">${opts}</div>${fb}
    <div class="nav"><button class="btn ghost" id="prev" ${cur===0?"disabled":""}>Previous</button>
    <button class="btn" id="next" ${done?"":"disabled"}>${last?"See results":"Next"}</button></div>
  </article>`;
  document.querySelectorAll(".opt").forEach(b=>{
    b.onclick=()=>{ const p=+b.dataset.i; ans[cur]=p; tries[cur].push({pick:p, ok:p===q.a, at:new Date().toISOString()}); tries[cur]=tries[cur].slice(-10); strikes[cur]=[]; render(false); persist(); };
    b.oncontextmenu=(e)=>{ if(done) return; e.preventDefault(); toggleStrike(+b.dataset.i); };
  });
  document.querySelectorAll(".strike").forEach(b=>b.onclick=()=>toggleStrike(+b.dataset.s));
  const r=$("#redo"); if(r) r.onclick=()=>{ ans[cur]=null; strikes[cur]=[]; render(false); persist(); };
  $("#prev").onclick=()=>{cur--;render();};
  $("#next").onclick=()=>{ if(last){showResults=true;} else cur++; render(); };
}

function toggleStrike(i){
  const s = strikes[cur], k = s.indexOf(i);
  if(k<0) s.push(i); else s.splice(k,1);
  render(false); persist();
}

function renderResults(){
  const s = score(), pct = Math.round(100*s/N);
  const cats = {};
  QUESTIONS.forEach((q,i)=>{ cats[q.c]=cats[q.c]||[0,0]; cats[q.c][1]++; if(ans[i]===q.a) cats[q.c][0]++; });
  const rows = Object.entries(cats).map(([c,[r,t]])=>`<tr><td>${esc(c)}</td><td>${r} / ${t}</td></tr>`).join("");
  const missed = {};
  QUESTIONS.forEach((q,i)=>{ const wrongFirst = tries[i].length && !tries[i][0].ok; if(ans[i]!==q.a || wrongFirst) q.l.forEach(id=>{ const w=id.split(" ")[0]; missed[w]=missed[w]||new Set(); missed[w].add(id); }); });
  const weeks = Object.keys(missed).sort((x,y)=>parseInt(x.slice(1))-parseInt(y.slice(1)));
  const missHtml = weeks.length ? weeks.map(w=>`<h3>Week ${w.slice(1)}</h3><ul class="miss">${[...missed[w]].map(id=>`<li><code>${esc(id)}</code>${esc(OBJECTIVES[id]||"")}</li>`).join("")}</ul>`).join("") : "<p>No missed objectives.</p>";
  const redone = tries.filter(t=>t.length>1).length;
  const un = N - answered();
  $("#main").innerHTML = `<article class="card">
    <div class="chead"><span class="tag">Results</span><span>${un?un+" unanswered":"Complete"}</span></div>
    <div><div class="big">${s} / ${N}</div><div class="stats"><span><b>${pct}%</b> correct now</span><span>First try <b>${firstTryScore()} / ${firstTryCount()}</b></span><span>Redone <b>${redone}</b></span></div></div>
    <table><thead><tr><th>Category</th><th>Score</th></tr></thead><tbody>${rows}</tbody></table>
    <h2>Objectives to review</h2><p class="hint">Includes questions you missed on the first try, even if a redo got them right.</p>${missHtml}${history.length?`<h2>Past attempts</h2><table><thead><tr><th>Date</th><th>Score</th></tr></thead><tbody>${history.slice().reverse().map(h=>`<tr><td>${new Date(h.date).toLocaleDateString()}</td><td>${h.score} / ${h.total}</td></tr>`).join("")}</tbody></table>`:""}
    <div class="nav"><button class="btn ghost" id="back">Back to questions</button><button class="btn" id="restart">Restart all</button></div>
  </article>`;
  $("#back").onclick=()=>{showResults=false;render();};
  $("#restart").onclick=()=>{
    if(answered() || tries.some(t=>t.length)){
      history.push({date:new Date().toISOString(), score:score(), answered:answered(), total:N, firstTry:firstTryScore(),
        missed:QUESTIONS.map((q,i)=>ans[i]!==null&&ans[i]!==q.a?"q"+(i+1):null).filter(Boolean)});
      history=history.slice(-20);
    }
    ans.fill(null); tries=QUESTIONS.map(()=>[]); strikes=QUESTIONS.map(()=>[]); cur=0; showResults=false; render(); persist();
  };
}

function setSave(text, cls){ const el=$("#save"); if(el){ el.textContent=text; el.className="save "+(cls||""); } }
function bodyOf(){
  const a = {};
  QUESTIONS.forEach((q,i)=>{
    if(ans[i]===null && !tries[i].length && !strikes[i].length) return;
    a["q"+(i+1)] = {pick:ans[i], ok:ans[i]!==null && ans[i]===q.a, l:q.l, tries:tries[i], strikes:strikes[i]};
  });
  return {answers:a, history, total:N, answered:answered(), score:score(), firstTry:firstTryScore(), updatedAt:new Date().toISOString()};
}
function validPick(i,p){ return Number.isInteger(p) && p>=0 && p<QUESTIONS[i].o.length; }
function applySaved(d){
  if(!d || typeof d!=="object") return;
  ans.fill(null); tries=QUESTIONS.map(()=>[]); strikes=QUESTIONS.map(()=>[]);
  const a = d.answers || {};
  for(const k in a){
    const i = parseInt(k.slice(1),10)-1, row = a[k];
    if(!(i>=0 && i<N) || !row || typeof row!=="object") continue;
    if(validPick(i,row.pick)) ans[i]=row.pick;
    if(Array.isArray(row.tries)) tries[i]=row.tries.filter(t=>t&&validPick(i,t.pick)).map(t=>({pick:t.pick, ok:t.pick===QUESTIONS[i].a, at:String(t.at||"")})).slice(-10);
    else if(ans[i]!==null) tries[i]=[{pick:ans[i], ok:ans[i]===QUESTIONS[i].a, at:""}];
    if(Array.isArray(row.strikes)) strikes[i]=row.strikes.filter(x=>validPick(i,x));
  }
  history = Array.isArray(d.history) ? d.history.slice(-20) : [];
  const first = ans.findIndex(x=>x===null); cur = first<0 ? N-1 : first;
}
function lsLoad(){ try{ return JSON.parse(localStorage.getItem(LS_KEY)||"null"); }catch(e){ return null; } }
function lsSave(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(bodyOf())); }catch(e){} }
async function persist(){
  lsSave();
  if(!db || !uid) return;
  dirty = true; if(writing) return; writing = true;
  while(dirty){
    dirty = false;
    setSave("Saving…");
    try{ await db.doc("attempts/"+uid).set(bodyOf()); setSave("Progress saved to your account.","ok"); }
    catch(e){
      if(e && e.code==="invalid_argument"){ db=null; setSave("Progress saves in this browser only.","bad"); break; }
      setSave("Could not save to your account. Progress saves in this browser.","bad");
    }
  }
  writing = false;
}
async function connect(){
  try{
    if(!window.claude || !window.claude.use) return;
    const [u, d] = await Promise.all([window.claude.use("user"), window.claude.use("db")]);
    if(!u || !d) return;
    const id = await u.id(); if(!id) return;
    db = d; uid = id;
    const snap = await db.doc("attempts/"+uid).get();
    if(snap.exists){ applySaved(snap.data()); render(); setSave("Progress saved to your account.","ok"); }
    else if(answered() || tries.some(t=>t.length)){ persist(); }
    else setSave("Progress saves to your account.","ok");
  }catch(e){ /* keep local-only mode */ }
}

function render(top=true){ renderHeader(); showResults?renderResults():renderQ(); if(top) window.scrollTo({top:0}); }
applySaved(lsLoad());
render();
connect();
</script>
