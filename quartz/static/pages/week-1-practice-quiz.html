<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Foundations of Medicine Week 1 practice</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&display=swap">
<style>
:root {
  --paper: #EAF0F2;
  --card: #F8FBFC;
  --ink: #14262E;
  --slate: #4C6069;
  --line: #C5D3D9;
  --teal: #0F6E73;
  --teal-soft: #D5EAEA;
  --ok: #1E7A4B;
  --ok-soft: #DAEFE3;
  --bad: #B0344C;
  --bad-soft: #F7DDE2;
  --mark: rgba(243, 217, 107, 0.85);
  --serif: "Literata", Georgia, "Times New Roman", serif;
  --sans: "Figtree", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0F1B20;
    --card: #16272E;
    --ink: #E4EEF1;
    --slate: #9DB2BA;
    --line: #2C444E;
    --teal: #5CC2C6;
    --teal-soft: #1B3A3F;
    --ok: #5FCB92;
    --ok-soft: #173A2A;
    --bad: #F08AA0;
    --bad-soft: #40202A;
    --mark: rgba(214, 181, 60, 0.4);
  }
}
:root[data-theme="dark"] {
  --paper: #0F1B20;
  --card: #16272E;
  --ink: #E4EEF1;
  --slate: #9DB2BA;
  --line: #2C444E;
  --teal: #5CC2C6;
  --teal-soft: #1B3A3F;
  --ok: #5FCB92;
  --ok-soft: #173A2A;
  --bad: #F08AA0;
  --bad-soft: #40202A;
  --mark: rgba(214, 181, 60, 0.4);
}
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
*, *::before, *::after { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 1rem;
  line-height: 1.5;
}
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--teal); outline-offset: 2px; }

.app {
  display: grid;
  grid-template-columns: 250px minmax(0, 1fr);
  gap: 2.5rem;
  max-width: 1120px;
  margin: 0 auto;
  padding: 2rem 1.5rem 4rem;
}

/* Rail */
.rail {
  position: sticky;
  top: 2rem;
  align-self: start;
}
.brand h1 {
  font-family: var(--serif);
  font-size: 1.5rem;
  line-height: 1.2;
  margin: 0 0 0.25rem;
  font-weight: 600;
}
.brand p { margin: 0; color: var(--slate); font-size: 0.95rem; }
.count { margin: 1.25rem 0 0.6rem; font-weight: 600; font-size: 0.95rem; }
.grid {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 0.4rem;
}
.num {
  position: relative;
  min-height: 44px;
  border: 1.5px solid var(--line);
  background: var(--card);
  border-radius: 8px;
  font-weight: 600;
}
.num.right { background: var(--ok-soft); border-color: var(--ok); color: var(--ok); }
.num.wrong { background: var(--bad-soft); border-color: var(--bad); color: var(--bad); }
.num.shown { border-style: dashed; border-color: var(--teal); color: var(--teal); }
.num.right::after, .num.wrong::after {
  position: absolute;
  top: 1px;
  right: 4px;
  font-size: 0.65rem;
}
.num.right::after { content: "\2713"; }
.num.wrong::after { content: "\2715"; }
.num.cur { box-shadow: 0 0 0 3px var(--teal); }
.links { display: flex; gap: 0.5rem; margin-top: 1rem; flex-wrap: wrap; }
.link {
  min-height: 40px;
  padding: 0 0.9rem;
  border: 1.5px solid var(--line);
  border-radius: 8px;
  background: transparent;
  font-weight: 600;
}
.link.cur { border-color: var(--teal); background: var(--teal-soft); }
.hint { margin: 1.25rem 0 0; color: var(--slate); font-size: 0.85rem; }

/* Card */
.card {
  background: var(--card);
  border: 1.5px solid var(--line);
  border-radius: 14px;
  padding: 2rem 2.25rem;
}
main:focus { outline: none; }
.meta {
  display: flex;
  justify-content: space-between;
  gap: 1rem;
  flex-wrap: wrap;
  color: var(--slate);
  font-size: 0.92rem;
  margin: 0 0 1rem;
}
.stem {
  font-family: var(--serif);
  font-weight: 400;
  font-size: 1.3rem;
  line-height: 1.6;
  margin: 0 0 1.5rem;
  max-width: 68ch;
}
.opts { display: grid; gap: 0.6rem; }
.opt {
  display: grid;
  grid-template-columns: 2rem 1fr auto;
  align-items: start;
  gap: 0.75rem;
  width: 100%;
  min-height: 52px;
  padding: 0.75rem 1rem;
  text-align: left;
  background: var(--card);
  border: 1.5px solid var(--line);
  border-radius: 10px;
  line-height: 1.45;
}
.opt:hover:not(:disabled) { border-color: var(--teal); }
.opt[aria-checked="true"] { border-color: var(--teal); background: var(--teal-soft); }
.opt:disabled { cursor: default; color: inherit; }
.opt .k {
  display: grid;
  place-items: center;
  width: 1.9rem;
  height: 1.9rem;
  border: 1.5px solid currentColor;
  border-radius: 50%;
  font-weight: 700;
  font-size: 0.9rem;
}
.multi .opt .k { border-radius: 6px; }
.opt .tag { font-size: 0.85rem; font-weight: 600; white-space: nowrap; padding-top: 0.15rem; }
.opt.is-correct { border-color: var(--ok); background: var(--ok-soft); }
.opt.is-correct .tag, .opt.is-correct .k { color: var(--ok); }
.opt.is-wrong { border-color: var(--bad); background: var(--bad-soft); }
.opt.is-wrong .tag, .opt.is-wrong .k { color: var(--bad); }

.actions, .nav { display: flex; gap: 0.75rem; flex-wrap: wrap; margin-top: 1.5rem; }
.btn {
  min-height: 46px;
  padding: 0 1.25rem;
  border-radius: 10px;
  border: 1.5px solid var(--teal);
  background: transparent;
  color: var(--teal);
  font-weight: 700;
}
.btn.primary { background: var(--teal); color: var(--card); }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.nav { justify-content: space-between; margin-top: 2rem; padding-top: 1.5rem; border-top: 1.5px solid var(--line); }

.banner {
  margin-top: 1.5rem;
  padding: 1rem 1.25rem;
  border-radius: 10px;
  border: 1.5px solid;
}
.banner strong { font-size: 1.1rem; }
.banner p { margin: 0.2rem 0 0; }
.banner.ok { background: var(--ok-soft); border-color: var(--ok); }
.banner.bad { background: var(--bad-soft); border-color: var(--bad); }
.banner.info { background: var(--teal-soft); border-color: var(--teal); }

.detail h3 {
  font-family: var(--serif);
  font-size: 1.15rem;
  margin: 2rem 0 0.75rem;
  font-weight: 600;
}
.detail ol { margin: 0; padding-left: 1.4rem; max-width: 68ch; }
.detail ol li { margin-bottom: 0.4rem; }
.clue { margin: 0 0 0.9rem; max-width: 68ch; }
.clue mark {
  background: linear-gradient(transparent 50%, var(--mark) 50%);
  color: inherit;
  padding: 0 0.15em;
  font-weight: 600;
}
.clue span { display: block; color: var(--slate); margin-top: 0.15rem; }
.why {
  border-left: 4px solid var(--line);
  padding: 0.1rem 0 0.1rem 1rem;
  margin: 0 0 1.1rem;
  max-width: 68ch;
}
.why.good { border-left-color: var(--ok); }
.why.miss { border-left-color: var(--bad); }
.why h4 { margin: 0 0 0.25rem; font-size: 1rem; }
.why h4 em { font-style: normal; font-weight: 700; margin-left: 0.4rem; }
.why.good h4 em { color: var(--ok); }
.why.miss h4 em { color: var(--bad); }
.why p { margin: 0; }
.final {
  margin-top: 2rem;
  padding: 1rem 1.25rem;
  border-radius: 10px;
  background: var(--teal-soft);
  border: 1.5px solid var(--teal);
}
.final h3 { margin: 0 0 0.4rem; }
.final p { margin: 0.15rem 0; }

/* Score and key review */
.rows { display: grid; gap: 0.5rem; margin-top: 1.25rem; }
.row {
  display: grid;
  grid-template-columns: 2.2rem 1fr auto;
  gap: 0.75rem;
  align-items: center;
  padding: 0.6rem 0.8rem;
  border: 1.5px solid var(--line);
  border-radius: 10px;
}
.row .st { font-weight: 600; font-size: 0.9rem; }
.row .st.right { color: var(--ok); }
.row .st.wrong { color: var(--bad); }
.row .st.shown { color: var(--teal); }
.row button { min-height: 40px; padding: 0 0.9rem; border-radius: 8px; border: 1.5px solid var(--teal); background: transparent; color: var(--teal); font-weight: 600; }
.card h2 { font-family: var(--serif); font-size: 1.6rem; margin: 0 0 0.5rem; font-weight: 600; }
.lead { max-width: 62ch; color: var(--slate); margin: 0 0 1rem; }
.flag { margin: 0 0 1.4rem; max-width: 68ch; border-left: 4px solid var(--teal); padding-left: 1rem; }
.flag h4 { margin: 0 0 0.3rem; font-size: 1.02rem; }
.flag p { margin: 0; }

@media (max-width: 860px) {
  .app { display: block; padding: 0 0 3rem; }
  .rail {
    position: sticky;
    top: env(safe-area-inset-top, 0px);
    z-index: 5;
    background: var(--paper);
    border-bottom: 1.5px solid var(--line);
    padding: 0.6rem 1rem 0.7rem;
  }
  .brand { display: flex; align-items: baseline; justify-content: space-between; gap: 0.75rem; }
  .brand h1 { font-size: 1.1rem; }
  .brand p { display: none; }
  .count { margin: 0.2rem 0 0.4rem; font-size: 0.85rem; }
  .grid { display: flex; overflow-x: auto; gap: 0.4rem; padding-bottom: 0.3rem; }
  .num { flex: 0 0 44px; }
  .links { margin-top: 0.4rem; }
  .hint { display: none; }
  main { padding: 1rem; }
  .card { padding: 1.25rem 1.1rem; border-radius: 12px; }
  .stem { font-size: 1.15rem; }
  .opt { grid-template-columns: 2rem 1fr; }
  .opt .tag { grid-column: 2; }
  .nav .btn { flex: 1; }
}
@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; animation: none !important; scroll-behavior: auto !important; }
}
</style>
</head>
<body>
<div class="app">
  <aside class="rail" id="rail" aria-label="Question navigation"></aside>
  <main id="main" tabindex="-1"></main>
</div>

<script>
const Q = [
{
  t: "Ethical reasoning", m: false,
  s: "A nurse watches a colleague pocket a patient's gold ring. She feels disgust and is certain it is wrong before she has thought about why. Afterward she builds reasons to support her reaction. Which process describes her judgment?",
  o: [
    ["A", "Ethical deliberation", false, "Wrong. Deliberation runs in the opposite order. You gather facts, weigh reasons and values, then reach a conclusion. It would be correct if she had paused, listed who is affected and which values conflict, and only then decided."],
    ["B", "Social intuitionism", true, "Correct. The verdict arrived first as a fast gut reaction, and reasons came afterward to defend it. That order is the signature of social intuitionism."],
    ["C", "Casuistry", false, "Wrong. Casuistry reasons by comparing the case with paradigm cases. It would be correct if she had asked how earlier thefts by staff were judged and reasoned by analogy."],
    ["D", "Principlism", false, "Wrong. Principlism balances autonomy, beneficence, non-maleficence and justice. It would be correct if she had weighed those four against one another before deciding."]
  ],
  st: ["Mark the order of events. The feeling and verdict come first, and the reasons come second.", "Ask which approach begins with a conclusion and adds reasons later.", "Rule out approaches that start from reasoning, cases or principles.", "Choose social intuitionism."],
  cl: [["feels disgust and is certain it is wrong before she has thought about why", "Fast, automatic moral intuition drives the verdict."], ["Afterward she builds reasons", "Post hoc justification is the core claim of social intuitionism."]]
},
{
  t: "Ethical frameworks", m: false,
  s: "An ethics committee reviews the case of a competent patient who refuses dialysis. Members name autonomy, beneficence, non-maleficence and justice. They treat the four as equally ranked and balance them for this case. Which framework are they using?",
  o: [
    ["A", "Utilitarianism", false, "Wrong. Utilitarianism judges an act by the total good it produces. It would be correct if the committee ranked the options only by which yields the most overall benefit."],
    ["B", "Deontology", false, "Wrong. Deontology decides by duties and rules, often stated as maxims, whatever the outcome. It would be correct if the committee asked which universal duty binds the physician."],
    ["C", "Principlism", true, "Correct. Principlism defines principles of equal rank and balances them case by case to structure the decision."],
    ["D", "Narrative ethics", false, "Wrong. Narrative ethics centres on the patient's story and what the illness means to that person. It would be correct if the committee focused on the patient's life story and values in context."],
    ["E", "Casuistry", false, "Wrong. Casuistry compares the case with paradigm cases. It would be correct if the committee had pulled up earlier refusals of dialysis and reasoned by analogy."]
  ],
  st: ["Note the four named principles.", "Note that none outranks the others and that balancing is the task.", "Match a framework that defines principles to structure decision making and balances equals.", "Rule out frameworks built on outcomes, duties, stories or cases."],
  cl: [["autonomy, beneficence, non-maleficence and justice", "These are the four principles of principlism."], ["equally ranked and balance them", "Principlism balances principles of equal rank. No fixed hierarchy exists."]]
},
{
  t: "Ethical frameworks", m: false,
  s: "A family asks a resident to withhold a terminal diagnosis from a patient. She recalls three earlier cases with similar features and works out how the present case is alike and different from each. Which approach is she using?",
  o: [
    ["A", "Deontology", false, "Wrong. Deontology starts from a duty such as truth-telling and applies it whatever the circumstances. It would be correct if she began from a rule and applied it without comparing cases."],
    ["B", "Utilitarianism", false, "Wrong. Utilitarianism counts harm and happiness for everyone affected. It would be correct if she had picked the option with the largest net benefit."],
    ["C", "Social intuitionism", false, "Wrong. It would be correct if she had an instant gut reaction and then went looking for reasons."],
    ["D", "Casuistry", true, "Correct. Casuistry reasons by analogy from paradigm cases and attends to the details that make cases alike or different."]
  ],
  st: ["Ask where her reasoning starts. It starts from cases, not from rules or outcomes.", "Notice the comparison of similarities and differences between cases.", "Match this to the approach built on paradigm cases and analogy."],
  cl: [["recalls three earlier cases", "The starting point is prior cases."], ["alike and different", "Reasoning by analogy is the method of casuistry."]]
},
{
  t: "Ethical frameworks", m: false,
  s: "During a surge, a hospital network writes a protocol to allocate ventilators so that the greatest number of lives is saved. Which framework most directly drives this protocol?",
  o: [
    ["A", "Deontology", false, "Wrong. Deontology fixes each patient's claim as a duty owed whatever the outcome. It would be correct if the protocol assigned ventilators by lottery or arrival order because equal treatment is a duty."],
    ["B", "Communitarianism", false, "Wrong here, and it is the closest competitor. It would be correct if the protocol rested on shared community values and the common good, for example priority for frontline workers because of the role they play in sustaining the community. The wording 'greatest number of lives' points to aggregate outcomes."],
    ["C", "Utilitarianism", true, "Correct. The goal is to maximize total benefit, here the number of lives saved. Actions are judged by outcomes summed across everyone."],
    ["D", "Casuistry", false, "Wrong. It would be correct if the group compared this surge with earlier paradigm cases of scarcity and reasoned by analogy."],
    ["E", "Social intuitionism", false, "Wrong. It would be correct if members followed gut reactions about who deserves a bed."]
  ],
  st: ["Identify the stated goal: save the greatest number of lives.", "Ask what kind of reasoning that goal reflects. It counts outcomes across all patients.", "Separate it from community-value reasoning, which starts from shared values and the common good.", "Choose utilitarianism."],
  cl: [["greatest number of lives", "Aggregate outcome maximization is the utilitarian criterion."], ["allocate ventilators during a surge", "Scarcity sets the problem, but the criterion is total benefit."]]
},
{
  t: "Physician-patient models", m: false,
  s: "A 58-year-old man has newly diagnosed hypertension. He holds firm views: he wants to avoid daily pills if possible and wants the lowest side-effect risk. He asks you for every option with its risks and benefits and says he will decide alone. Which physician-patient model fits best?",
  o: [
    ["A", "Paternalistic", false, "Wrong. The physician would choose for the patient. It would be correct if he said, 'You decide, Doctor. I trust you.'"],
    ["B", "Informative", true, "Correct. The physician acts as an expert supplier of facts. The patient holds fixed values and makes the decision."],
    ["C", "Interpretive", false, "Wrong. The physician helps a patient work out values that are vague or in conflict. It would be correct if he were unsure what he wanted."],
    ["D", "Deliberative", false, "Wrong. The physician acts as a teacher or friend who argues that some values are better than others. It would be correct if you were persuading him toward accepting daily medication for long-term health."]
  ],
  st: ["Decide whether the patient's values are fixed or unclear. They are fixed.", "Decide what he wants from you. He wants facts and full options.", "Note who decides. He does.", "Match to the model where the physician supplies information and the patient chooses."],
  cl: [["holds firm views", "Fixed values point away from interpretive and deliberative models."], ["every option with its risks and benefits", "The physician's role is to provide facts."], ["will decide alone", "Full patient control fits the informative model."]]
},
{
  t: "Physician-patient models", m: false,
  s: "A 44-year-old woman with early breast cancer tells you she is unable to decide between a treatment that keeps her hair and one with the lowest recurrence risk. She is unsure which matters more to her. You ask open questions to help her put her values into words and you do not press your own view. Which model are you using?",
  o: [
    ["A", "Informative", false, "Wrong. It would be correct if her values were settled and she wanted only the facts."],
    ["B", "Deliberative", false, "Wrong. It would be correct if you argued, as a teacher, that avoiding recurrence deserves priority over hair loss and worked to persuade her."],
    ["C", "Interpretive", true, "Correct. The physician acts as a counsellor who helps the patient clarify and state values that are present but unclear, then helps choose the intervention that fits them."],
    ["D", "Paternalistic", false, "Wrong. It would be correct if you selected the treatment for her on the basis of your own judgment of her best interest."]
  ],
  st: ["Ask whether her values are settled. They are unclear.", "Ask what your role is. You draw out her values and you do not press your own.", "Rule out models where you supply only facts, persuade, or decide for her.", "Choose the interpretive model."],
  cl: [["unsure which matters more to her", "Her values exist but need clarifying."], ["help her put her values into words", "This is the interpretive physician's task."], ["you do not press your own view", "This rules out deliberative and paternalistic models."]]
},
{
  t: "Bias and equity", m: false,
  s: "A physician sincerely believes every patient deserves equal care. Chart review over a month shows he spends less time with patients who speak with an accent and orders less pain medication for them. He is unaware of the pattern. Which term fits best?",
  o: [
    ["A", "Cultural competence", false, "Wrong. This is the ability to understand and interact effectively with people of other cultures. It would be correct if he had learned about his patients' backgrounds and adapted his communication."],
    ["B", "Explicit bias", false, "Wrong. Explicit bias is conscious and endorsed. It would be correct if he stated that these patients deserve less care."],
    ["C", "Cultural safety", false, "Wrong. This describes care that patients experience as spiritually and socially safe. It would be correct if patients reported feeling respected and safe in his clinic."],
    ["D", "Implicit bias", true, "Correct. Unconscious attitudes shape his behaviour even though his stated beliefs are egalitarian."]
  ],
  st: ["Compare his stated belief with his behaviour. They conflict.", "Ask whether he is aware of the pattern. He is not.", "Match unaware, behaviour-shaping attitudes to implicit bias."],
  cl: [["sincerely believes every patient deserves equal care", "No conscious prejudice, which rules out explicit bias."], ["He is unaware of the pattern", "The attitude operates outside awareness."], ["less time and less pain medication", "The bias changes real clinical behaviour."]]
},
{
  t: "Bias and equity", m: false,
  s: "A clinic asks Indigenous patients how safe and respected they feel in the space and changes its practices based on their answers. The patient, not the provider, decides whether care was culturally safe. Which concept does this reflect?",
  o: [
    ["A", "Cultural competence", false, "Wrong. This is the provider's knowledge and skill in interacting with people of other cultures. It would be correct if the clinic had trained staff on customs and communication styles."],
    ["B", "Cultural safety", true, "Correct. Cultural safety is judged by the person receiving care. It attends to power imbalances and asks whether the environment felt socially and spiritually safe."],
    ["C", "Culture", false, "Wrong. Culture means the knowledge, beliefs and values shared by members of a society. It would be correct if the question asked what a group has in common."],
    ["D", "Cultural destructiveness", false, "Wrong. This sits at the harmful end of the cultural competence continuum, where practices suppress or damage a culture. It would be correct if the clinic banned traditional healing or language."]
  ],
  st: ["Identify who defines success. The patient does.", "Match to the concept that centres the patient's experience and the power balance.", "Rule out concepts defined by provider skill or by group traits."],
  cl: [["how safe and respected they feel", "Subjective patient experience is the measure."], ["The patient, not the provider, decides", "Cultural safety is defined by the recipient of care."]]
},
{
  t: "Refugee health", m: true,
  s: "Which statements about refugee health are true? Select all that apply.",
  o: [
    ["A", "Health risks arise before, during and after migration.", true, "True. Premigration violence and deprivation, dangerous journeys and postmigration stressors all shape health."],
    ["B", "Refugees are generally unhealthy on arrival.", false, "False. Many refugees arrive in good health, and assuming otherwise leads to stereotyping. Care should respond to specific exposures and needs. The statement would hold only for a particular group with a documented high disease burden."],
    ["C", "After arrival, language barriers, an unfamiliar system and insecure housing limit access to care.", true, "True. These are common postmigration barriers to services."],
    ["D", "Children who arrive without guardians are especially vulnerable.", true, "True. Unaccompanied children lack protection and advocacy, which raises their risk."],
    ["E", "Mental health problems such as PTSD are rare and seldom need attention.", false, "False. PTSD, depression and anxiety are common after trauma and displacement. The statement would be true only for a population with little exposure to trauma or displacement."]
  ],
  st: ["Judge each statement on its own.", "Reject sweeping wording such as 'generally unhealthy' and 'rare'.", "Keep statements that describe risk across the migration timeline, barriers to access and vulnerable groups."],
  cl: [["generally, rare, seldom", "Absolute or sweeping wording is a common trap."], ["before, during and after", "The migration timeline frames refugee health risks."]]
},
{
  t: "Indigenous health", m: true,
  s: "Which of the following are colonial policies or practices you should recognize when you study Indigenous health in Canada? Select all that apply.",
  o: [
    ["A", "The Indian Act (1876)", true, "True. It shaped governance, land, status and movement for First Nations people and continues to influence social and health outcomes."],
    ["B", "The residential school system", true, "True. Forced separation of children from families, culture and language, along with abuse and neglect, has intergenerational health effects."],
    ["C", "Forced relocation of Inuit communities", true, "True. Relocation disrupted food security, kinship and community ties."],
    ["D", "Removal of Indigenous children into child welfare care, past and present", true, "True. Child welfare removals, including the Sixties Scoop and present-day over-representation in care, continue to affect family and community health."],
    ["E", "The Truth and Reconciliation Commission Calls to Action (2015)", false, "False. The Calls to Action respond to colonial harm. They are not a colonial policy. This would be correct if the question asked for frameworks for redress and reconciliation."]
  ],
  st: ["Sort each item into harm imposed by colonial policy or response to that harm.", "Keep the four policies and practices.", "Exclude the response."],
  cl: [["colonial policies or practices", "Look for measures that controlled, removed or relocated Indigenous people."]]
},
{
  t: "History of medicine", m: false,
  s: "A second-century Greek physician took Hippocratic clinical practice and placed it within a wider framework of anatomy and physiology. His ideas dominated Western medicine for more than a thousand years. Who was he?",
  o: [

{

{

const KEY = [
  ["Meds2024 Question 9, Medieval contributions", "The key answer C holds. Its explanation dates Galen to about 150 years BCE, but Galen lived from about 129 to 216 CE. Option A also depends on where you draw the end of the medieval period, since movable-type printing in Europe began around 1450."],
  ["New Question 8, chronic stress", "The key says ADH is not produced during stress, so it selects D. Stress does trigger release of ADH (vasopressin), which acts with CRH to raise ACTH and cortisol. That makes option B defensible and points to E. Confirm the intended answer with your course team."],
  ["New Question 11, epidemiologic transition", "Key D holds. Option C says a little less than half of deaths in the degenerative stage come from cardiovascular disease. Meds2024 Question 6 treats a share below 50 percent in that stage as incorrect. The two items disagree with each other."],
  ["New Question 12, primordial prevention", "Key B is right. The explanation describes the goal as primary prevention preventing risk factors from developing. That is the definition of primordial prevention. Primary prevention reduces exposure to established risk factors to stop disease onset."],
  ["New Question 3, proximal factors", "The key says B, employment, with no reasoning. Some frameworks place faith and beliefs with culture at the distal level, while others treat them as personal factors. Confirm which framework your course uses, because option E depends on that call."],
  ["New Question 20, matching theories", "Key D holds. The explanation calls option B the humoral theory and option C the miasma theory, but the options label them religious teachings and humoral theory. The labels and the explanation do not line up."]
];

const state = { view: "quiz", i: 0, a: Q.map(() => ({ sel: [], checked: false, shown: false })) };
const rail = document.getElementById("rail");
const main = document.getElementById("main");
const LABEL = { open: "not answered", right: "correct", wrong: "incorrect", shown: "answer shown" };

function el(tag, props) {
  const n = document.createElement(tag);
  if (props) {
    for (const k in props) {
      const v = props[k];
      if (v === null || v === undefined || v === false) continue;
      if (k === "class") n.className = v;
      else if (k === "text") n.textContent = v;
      else if (k.startsWith("on")) n.addEventListener(k.slice(2), v);
      else n.setAttribute(k, v === true ? "" : v);
    }
  }
  for (let i = 2; i < arguments.length; i++) {
    const kids = [].concat(arguments[i]);
    kids.forEach(function (c) {
      if (c === null || c === undefined || c === false) return;
      n.append(c.nodeType ? c : document.createTextNode(c));
    });
  }
  return n;
}

function correctKeys(q) { return q.o.filter(function (x) { return x[2]; }).map(function (x) { return x[0]; }); }
function sameSet(a, b) { return a.length === b.length && a.every(function (x) { return b.indexOf(x) !== -1; }); }
function status(i) {
  const a = state.a[i];
  if (a.checked) return sameSet(a.sel, correctKeys(Q[i])) ? "right" : "wrong";
  if (a.shown) return "shown";
  return "open";
}

function go(i) {
  state.view = "quiz";
  state.i = i;
  render();
  window.scrollTo(0, 0);
  main.focus({ preventScroll: true });
}
function showView(v) {
  state.view = v;
  render();
  window.scrollTo(0, 0);
  main.focus({ preventScroll: true });
}

function renderRail() {
  rail.innerHTML = "";
  const checked = state.a.filter(function (x) { return x.checked; }).length;
  rail.append(
    el("div", { class: "brand" },
      el("h1", { text: "Week 1 practice" }),
      el("p", { text: "Foundations of Medicine, Block 1" })),
    el("p", { class: "count", text: checked + " of " + Q.length + " checked" }),
    el("div", { class: "grid" }, Q.map(function (q, i) {
      const s = status(i);
      const cur = state.view === "quiz" && state.i === i;
      return el("button", {
        class: "num " + s + (cur ? " cur" : ""),
        type: "button",
        "aria-label": "Question " + (i + 1) + ", " + LABEL[s],
        "aria-current": cur ? "true" : null,
        onclick: function () { go(i); },
        text: String(i + 1)
      });
    })),
    el("div", { class: "links" },
      el("button", { class: "link" + (state.view === "score" ? " cur" : ""), type: "button", onclick: function () { showView("score"); }, text: "Score" }),
      el("button", { class: "link" + (state.view === "key" ? " cur" : ""), type: "button", onclick: function () { showView("key"); }, text: "Key review" })),
    el("p", { class: "hint", text: "Keys A to F pick an option. Arrow keys move between questions." })
  );
}

function renderQuestion() {
  const q = Q[state.i];
  const a = state.a[state.i];
  const done = a.checked || a.shown;
  const ck = correctKeys(q);
  const card = el("article", { class: "card" });

  card.append(el("div", { class: "meta" },
    el("span", { text: "Question " + (state.i + 1) + " of " + Q.length + ", " + q.t }),
    el("span", { text: q.m ? "Select all that apply" : "Select one" })));
  card.append(el("h2", { class: "stem", text: q.s }));

  const opts = el("div", { class: "opts" + (q.m ? " multi" : ""), role: q.m ? "group" : "radiogroup", "aria-label": "Answer options" });
  q.o.forEach(function (o) {
    const on = a.sel.indexOf(o[0]) !== -1;
    let cls = "opt";
    let tag = "";
    if (done) {
      if (o[2]) {
        cls += " is-correct";
        tag = on ? "Your choice, correct" : (a.checked ? "Correct answer" : "Correct answer");
        if (!on && a.checked && q.m) tag = "Missed";
      } else if (on) {
        cls += " is-wrong";
        tag = "Your choice, wrong";
      }
    }
    opts.append(el("button", {
      class: cls,
      type: "button",
      role: q.m ? "checkbox" : "radio",
      "aria-checked": on ? "true" : "false",
      disabled: done ? true : null,
      onclick: function () { pick(o[0]); }
    }, el("span", { class: "k", text: o[0] }), el("span", { class: "tx", text: o[1] }), tag ? el("span", { class: "tag", text: tag }) : null));
  });
  card.append(opts);

  if (!done) {
    card.append(el("div", { class: "actions" },
      el("button", { class: "btn primary", type: "button", disabled: a.sel.length ? null : true, onclick: check, text: "Check answer" }),
      el("button", { class: "btn", type: "button", onclick: showAnswer, text: "Show answer" })));
  } else {
    const ok = a.checked && sameSet(a.sel, ck);
    let bClass = "banner info", head = "Answer shown", body = "Correct: " + ck.join(", ") + ".";
    if (a.checked) {
      bClass = ok ? "banner ok" : "banner bad";
      head = ok ? "Correct" : "Not quite";
      body = "Correct answer: " + ck.join(", ") + ". You chose " + a.sel.join(", ") + ".";
    }
    card.append(el("div", { class: bClass, role: "status" }, el("strong", { text: head }), el("p", { text: body })));

    const d = el("div", { class: "detail" });
    d.append(el("h3", { text: "Step by step" }), el("ol", null, q.st.map(function (s) { return el("li", { text: s }); })));
    d.append(el("h3", { text: "High-yield clues" }), ...q.cl.map(function (c) {
      return el("p", { class: "clue" }, el("mark", { text: c[0] }), el("span", { text: "Indicates: " + c[1] }));
    }));
    d.append(el("h3", { text: "Why each option is right or wrong" }), ...q.o.map(function (o) {
      return el("div", { class: "why " + (o[2] ? "good" : "miss") },
        el("h4", null, o[0] + ". " + o[1], el("em", { text: o[2] ? "Correct" : "Incorrect" })),
        el("p", { text: o[3] }));
    }));
    d.append(el("div", { class: "final" },
      el("h3", { text: "Final answer" }),
      q.o.filter(function (o) { return o[2]; }).map(function (o) { return el("p", { text: o[0] + ". " + o[1] }); })));
    card.append(d);
  }

  card.append(el("div", { class: "nav" },
    el("button", { class: "btn", type: "button", disabled: state.i === 0 ? true : null, onclick: function () { go(state.i - 1); }, text: "Previous" }),
    el("button", { class: "btn primary", type: "button", onclick: function () { if (state.i < Q.length - 1) go(state.i + 1); else showView("score"); }, text: state.i < Q.length - 1 ? "Next question" : "See score" })));

  main.append(card);
}

function pick(k) {
  const q = Q[state.i], a = state.a[state.i];
  if (a.checked || a.shown) return;
  if (q.m) {
    const at = a.sel.indexOf(k);
    if (at === -1) a.sel.push(k); else a.sel.splice(at, 1);
    a.sel.sort();
  } else {
    a.sel = [k];
  }
  render();
}
function check() {
  const a = state.a[state.i];
  if (!a.sel.length) return;
  a.checked = true;
  render();
}
function showAnswer() {
  state.a[state.i].shown = true;
  render();
}

function renderScore() {
  const right = Q.filter(function (q, i) { return status(i) === "right"; }).length;
  const checked = state.a.filter(function (x) { return x.checked; }).length;
  const shown = state.a.filter(function (x) { return x.shown && !x.checked; }).length;
  const open = Q.length - checked - shown;
  const card = el("article", { class: "card" });
  card.append(el("h2", { text: "Score" }));
  card.append(el("p", { class: "lead", text: "You answered " + right + " of " + checked + " checked questions correctly. " + shown + " had the answer shown and " + open + " remain open. Multiple-choice questions with several answers need every correct option and no wrong ones." }));
  card.append(el("div", { class: "rows" }, Q.map(function (q, i) {
    const s = status(i);
    return el("div", { class: "row" },
      el("span", { text: String(i + 1) }),
      el("span", null, q.t, " ", el("span", { class: "st " + s, text: "(" + LABEL[s] + ")" })),
      el("button", { type: "button", onclick: function () { go(i); }, text: "Open" }));
  })));
  card.append(el("div", { class: "actions" }, el("button", { class: "btn", type: "button", onclick: restart, text: "Restart all questions" })));
  main.append(card);
}

function restart() {
  state.a = Q.map(function () { return { sel: [], checked: false, shown: false }; });
  go(0);
}

function renderKey() {
  const card = el("article", { class: "card" });
  card.append(el("h2", { text: "Notes on the original answer key" }));
  card.append(el("p", { class: "lead", text: "I reviewed every Week 1 answer while writing these questions. Most keys hold up. These six items deserve a second look before you rely on them." }));
  KEY.forEach(function (k) {
    card.append(el("div", { class: "flag" }, el("h4", { text: k[0] }), el("p", { text: k[1] })));
  });
  main.append(card);
}

function render() {
  main.innerHTML = "";
  renderRail();
  if (state.view === "quiz") renderQuestion();
  else if (state.view === "score") renderScore();
  else renderKey();
}

document.addEventListener("keydown", function (e) {
  if (e.metaKey || e.ctrlKey || e.altKey || state.view !== "quiz") return;
  if (e.key === "ArrowRight" && state.i < Q.length - 1) { go(state.i + 1); return; }
  if (e.key === "ArrowLeft" && state.i > 0) { go(state.i - 1); return; }
  const k = e.key.toUpperCase();
  if (k.length === 1 && Q[state.i].o.some(function (o) { return o[0] === k; })) pick(k);
});

render();
</script>
