<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Anki</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;600;700&display=swap">
<style>
/* Nexus Anki page. Source: scripts/quiz/anki.html (build.py copies it to quartz/static/pages/).
   Reads the shared list "differential-anki" that every quiz writes to with Save to Anki.
   Same tokens as the quiz template. Each card takes its block colour. */
:root{
  --bg:#f5f6f8;--paper:#ffffff;--ink:#15181d;--muted:#4d5560;--faint:#7b828d;--line:#e0e3e8;--soft:#eef0f3;
  --ok:#1d7a46;--okw:#e7f4ec;--bad:#b42318;--badw:#fcecea;--new:#1f5fa8;
  --b1:#0b7a75;--b2:#4f46c8;--b3:#a3246b;--b4:#a35f08;
  --accent:var(--ink);
  --font:"Atkinson Hyperlegible Next","Segoe UI",system-ui,-apple-system,sans-serif;
}
:root[data-theme="dark"]{
  --bg:#14161a;--paper:#1b1e24;--ink:#eceef2;--muted:#b3bac5;--faint:#8a919c;--line:#2d323b;--soft:#252930;
  --ok:#5ccf8f;--okw:#13301f;--bad:#f2877c;--badw:#3a1c1a;--new:#93b9ec;
  --b1:#45c2b8;--b2:#a49df6;--b3:#ef8ec0;--b4:#e3a548;color-scheme:dark}
[data-b="1"]{--accent:var(--b1)}[data-b="2"]{--accent:var(--b2)}[data-b="3"]{--accent:var(--b3)}[data-b="4"]{--accent:var(--b4)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.5;font-variant-numeric:tabular-nums}
.wrap{max-width:860px;margin:0 auto;padding:28px 16px 64px;display:flex;flex-direction:column;gap:22px}
h1,h2,h3,p{margin:0}
h1{font-size:clamp(26px,4vw,32px);letter-spacing:-.015em;line-height:1.15}
.sub{color:var(--muted);margin-top:4px}
.tools{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.help{font-size:14px;color:var(--faint);margin-top:10px;max-width:70ch}
.filters{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.filters button{font:inherit;font-size:14px;font-weight:700;color:var(--muted);background:transparent;border:1.5px solid var(--line);border-radius:6px;padding:4px 11px;cursor:pointer}
.filters button[aria-pressed="true"]{color:var(--paper);background:var(--accent);border-color:var(--accent)}
.filters button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.btn{font:inherit;font-weight:700;font-size:15px;padding:9px 18px;border:1.5px solid var(--accent);border-radius:6px;background:var(--accent);color:var(--paper);cursor:pointer}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.ghost:hover:not(:disabled){background:var(--soft)}
.btn:disabled{opacity:.35;cursor:default}
.btn:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
.status{font-size:14px;color:var(--muted);display:flex;align-items:center;gap:10px;min-height:1.5em}
.linkbtn{font:inherit;font-size:14px;font-weight:700;color:var(--accent);background:none;border:0;padding:0;text-decoration:underline;text-underline-offset:3px;cursor:pointer}

#main{display:flex;flex-direction:column;gap:26px}
.status:empty,.filters:empty,.help:empty,.tools:empty,.prefs:empty{display:none}
/* List */
.group h2{font-size:17px;display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px;margin-bottom:8px}
.group h2 span{font-size:14px;font-weight:400;color:var(--muted)}
.cards{list-style:none;margin:0;padding:0;background:var(--paper);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.cards li{display:flex;align-items:flex-start;gap:8px;border-left:5px solid var(--accent);padding:0 12px 0 0}
.cards li + li{border-top:1px solid var(--line)}
details{flex:1;min-width:0}
summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:3.2rem minmax(0,1fr) auto;gap:4px 12px;padding:11px 0 11px 12px;align-items:baseline}
summary::-webkit-details-marker{display:none}
summary:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
summary:hover .s{color:var(--ink)}
.qn{font-weight:700;color:var(--accent);font-size:14px}
.s{color:var(--muted);overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;font-size:15px}
details[open] .s{display:block;-webkit-line-clamp:unset;color:var(--ink);white-space:pre-line}
.due{font-size:13px;color:var(--faint);white-space:nowrap}
.due.now{color:var(--accent);font-weight:700}
.back{padding:0 0 14px 12px;margin-left:3.2rem;display:flex;flex-direction:column;gap:8px}
.rm{flex:none;font:inherit;font-size:13px;font-weight:700;color:var(--faint);background:none;border:1.5px solid transparent;border-radius:6px;padding:4px 8px;margin-top:8px;cursor:pointer}
.rm:hover{color:var(--bad);border-color:var(--line)}
.rm:focus-visible{outline:2px solid var(--accent)}
.open{font-size:14px;font-weight:700;color:var(--accent)}

/* Options and explanation (shared by list and review) */
.olist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.olist li{display:flex;gap:10px;align-items:baseline;border:0;padding:0}
.k{flex:none;display:inline-grid;place-items:center;width:24px;height:24px;border-radius:5px;background:var(--soft);color:var(--accent);font-weight:700;font-size:13px}
.olist li.right .k{background:var(--ok);color:var(--paper)}
.olist li.right > span:last-child{font-weight:700}
.ex{display:flex;flex-direction:column;gap:8px;background:var(--bg);border-radius:6px;padding:12px 14px;font-size:15px}
.cards .ex{background:var(--soft)}
.ex p{max-width:72ch}
.ex .why,.ex .alt{display:flex;gap:10px;align-items:baseline}
.ex .why{font-weight:600}
.ex .alt{color:var(--muted)}
.lk{flex:none;display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--line);color:var(--muted);font-weight:700;font-size:12px}
.lk.ok{background:var(--ok);color:var(--paper)}
.ex .take{border-left:3px solid var(--accent);padding-left:10px}
.obj{font-size:13.5px;color:var(--faint)}
.obj b{color:var(--muted)}

/* Empty */
.empty{background:var(--paper);border:1px dashed var(--line);border-radius:8px;padding:22px;display:flex;flex-direction:column;gap:8px;color:var(--muted)}
.empty b{color:var(--ink)}
.empty a{color:var(--ink);font-weight:700}

/* Anki's colours for the three counts: new blue, learning red, review green */
.counts{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:14px;color:var(--muted)}
.counts b{font-size:17px;margin-right:4px}
.counts .cn{color:var(--new)}.counts .cl{color:var(--bad)}.counts .cr{color:var(--ok)}
.counts .cur{text-decoration:underline;text-underline-offset:4px;text-decoration-thickness:2px}
.prefs{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted);margin-top:12px}
.prefs select{font:inherit;font-size:14px;color:var(--ink);background:var(--paper);border:1.5px solid var(--line);border-radius:6px;padding:3px 6px}
.prefs select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
/* Review */
.card{background:var(--paper);border:1px solid var(--line);border-top:4px solid var(--accent);border-radius:10px;padding:24px;display:flex;flex-direction:column;gap:18px}
.chead{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-size:14px}
.chead > b{color:var(--accent)}
.chead > span{color:var(--faint)}
.stem{font-size:18.5px;line-height:1.6;white-space:pre-line;max-width:70ch}
.card .olist{gap:10px;font-size:16.5px}
.card .k{width:28px;height:28px}
.rate{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.rate button{font:inherit;display:flex;flex-direction:column;align-items:center;gap:1px;padding:9px 6px;border-radius:6px;border:1.5px solid var(--line);background:var(--paper);color:var(--ink);font-weight:700;cursor:pointer}
.rate button small{font-weight:400;font-size:13px;color:var(--faint)}
.rate button:hover{border-color:var(--accent)}
.rate .g1{color:var(--bad)}.rate .g2{color:var(--muted)}.rate .g3{color:var(--ok)}.rate .g4{color:var(--new)}
.rate button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.keys{font-size:13px;color:var(--faint)}
.rowbtns{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
@media (max-width:560px){
  summary{grid-template-columns:2.6rem minmax(0,1fr)}
  .due{grid-column:2}
  .back{margin-left:0}
  .card{padding:18px}.stem{font-size:17.5px}
  .keys{display:none}
  .rate{grid-template-columns:repeat(2,minmax(0,1fr))}
}
</style>
</head><body>
<script>
/* Follow the site's light or dark toggle. */
(function(){
  const r=document.documentElement;
  function theme(){ let t=null; try{ t=localStorage.getItem("theme"); }catch(e){}
    r.dataset.theme = t || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"); }
  theme(); addEventListener("storage",theme);
})();
</script>
<div class="wrap">
  <header id="top">
    <h1>Anki</h1>
    <p class="sub" id="sub"></p>
    <div class="tools" id="tools"></div>
    <p class="help" id="help"></p>
    <div class="filters" id="filters" role="group" aria-label="Show questions from"></div>
    <div class="prefs" id="prefs"></div>
  </header>
  <div class="status" id="status" role="status"></div>
  <main id="main"></main>
</div>

<script src="vendor/ts-fsrs.min.js"></script>
<script>
/* Study logic follows Anki: the FSRS scheduler (Anki's default), learning steps of 1 and 10 minutes,
   90% desired retention, Again / Hard / Good / Easy, a daily new-card limit, a 4 am day rollover,
   and a 20 minute learn-ahead window. Card state is stored on each saved card as c.f. */
const KEY = "differential-anki", META_KEY = "differential-anki-meta";
const ROOT = "../../";            // this page is served at static/pages/anki.html
const L = "ABCDE", MIN = 60000, DAY = 86400000, LEARN_AHEAD = 20*MIN, ROLLOVER_H = 4;
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const F = window.FSRS;
const S = F.fsrs(F.generatorParameters({enable_fuzz:true, enable_short_term:true, learning_steps:["1m","10m"], relearning_steps:["10m"], request_retention:0.9}));
const NEW = F.State.New, LEARNING = F.State.Learning, REVIEW = F.State.Review, RELEARNING = F.State.Relearning;

let cards = [], filter = "all", session = null, removed = null, meta = {lim:20, d:"", n:0};

function load(){
  try{ const d=JSON.parse(localStorage.getItem(KEY)||"null"); cards = d && Array.isArray(d.cards) ? d.cards.filter(c=>c && c.id && Array.isArray(c.o)) : []; }catch(e){ cards=[]; }
  try{ meta = Object.assign({lim:20, d:"", n:0}, JSON.parse(localStorage.getItem(META_KEY)||"{}")); }catch(e){}
  if(migrate()) save();
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify({v:1, cards})); return true; }catch(e){ status("Could not save. Browser storage is full or blocked."); return false; } }
function saveMeta(){ try{ localStorage.setItem(META_KEY, JSON.stringify(meta)); }catch(e){} }
function status(html){ $("#status").innerHTML = html || ""; }

/* Cards reviewed with the first version of this page carry {ivl, ease, due}. Move them onto FSRS. */
function migrate(){
  let changed=false;
  cards.forEach(c=>{
    if(!c.r) return;
    if(!c.f && c.r.reps){
      const due=new Date(c.r.due||Date.now()), ivl=c.r.ivl||0;
      c.f = ivl>=1
        ? {due:due.toISOString(), stability:ivl, difficulty:5, scheduled_days:ivl, reps:c.r.reps, lapses:0, learning_steps:0, state:REVIEW, last_review:new Date(due-ivl*DAY).toISOString()}
        : {due:due.toISOString(), stability:1, difficulty:5, scheduled_days:0, reps:c.r.reps, lapses:0, learning_steps:0, state:LEARNING, last_review:new Date().toISOString()};
    }
    delete c.r; changed=true;
  });
  return changed;
}

/* ---------- Anki's day and counts ---------- */
function dayKey(t){ const d=new Date((t||Date.now()) - ROLLOVER_H*3600000); return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate(); }
function dayEnd(){ const d=new Date(Date.now() - ROLLOVER_H*3600000); d.setHours(24+ROLLOVER_H,0,0,0); return d.getTime(); }
function newToday(){ if(meta.d!==dayKey()){ meta.d=dayKey(); meta.n=0; saveMeta(); } return meta.n; }
function newLeft(){ return Math.max(0, meta.lim - newToday()); }
function state(c){ return c.f ? c.f.state : NEW; }
function due(c){ return c.f ? new Date(c.f.due).getTime() : 0; }
const isNew = c => state(c)===NEW;
const isLearn = c => state(c)===LEARNING || state(c)===RELEARNING;
const isReview = c => state(c)===REVIEW;

function week(c){ const m=String(c.slug).match(/week-(\d+)/); return m ? +m[1] : 99; }
function order(a,b){ return (a.b-b.b) || (week(a)-week(b)) || String(a.set).localeCompare(String(b.set)) || (a.n-b.n); }
function deck(){ return cards.filter(c=>filter==="all" || String(c.b)===filter).sort(order); }
function counts(list){
  const now=Date.now(), end=dayEnd();
  return {
    n: Math.min(list.filter(isNew).length, newLeft()),
    l: list.filter(c=>isLearn(c) && due(c)<=now+LEARN_AHEAD).length,
    r: list.filter(c=>isReview(c) && due(c)<end).length,
  };
}
function countsHtml(k, cur){
  return `<span class="counts" aria-label="${k.n} new, ${k.l} learning, ${k.r} to review">
    <span class="cn ${cur==="n"?"cur":""}"><b>${k.n}</b>New</span>
    <span class="cl ${cur==="l"?"cur":""}"><b>${k.l}</b>Learning</span>
    <span class="cr ${cur==="r"?"cur":""}"><b>${k.r}</b>Review</span></span>`;
}

/* Interval labels the way Anki prints them: 1m, 10m, 3h, 4d, 2.1mo, 1.3y */
function ivl(ms){
  const m=Math.max(1, Math.round(ms/MIN));
  if(m<60) return m+"m";
  const h=m/60; if(h<24) return Math.round(h)+"h";
  const d=h/24; if(d<30) return Math.round(d)+"d";
  if(d<365) return (d/30).toFixed(1).replace(/\.0$/,"")+"mo";
  return (d/365).toFixed(1).replace(/\.0$/,"")+"y";
}
function dueLabel(c){
  if(isNew(c)) return ["New","new"];
  const ms=due(c)-Date.now();
  if(isLearn(c)) return [ms<=0 ? "Learning, due now" : "Learning, due in "+ivl(ms), "now"];
  if(due(c)<dayEnd()) return ["Due today","now"];
  const d=Math.round(ms/DAY);
  return [d<=1 ? "Due tomorrow" : "Due in "+ivl(ms), ""];
}

function fmtLine(t){
  let m;
  if((m=t.match(/^Correct:\s*([A-E])\.?\s*(.*)$/))) return `<p class="why"><span class="lk ok">${m[1]}</span><span>${esc(m[2])}</span></p>`;
  if((m=t.match(/^([A-E]):\s*(.*)$/))) return `<p class="alt"><span class="lk">${m[1]}</span><span>${esc(m[2])}</span></p>`;
  if((m=t.match(/^(Takeaway|High yield|High-yield|Key point|Clues):\s*(.*)$/i))) return `<p class="take"><b>${esc(m[1])}.</b> ${esc(m[2])}</p>`;
  return `<p>${esc(t)}</p>`;
}
function optsHtml(c, reveal){
  return `<ol class="olist">${c.o.map((o,i)=>`<li class="${reveal && i===c.a ? "right" : ""}"><span class="k">${L[i]}</span><span>${esc(o)}</span></li>`).join("")}</ol>`;
}
function backHtml(c){
  const objs=(c.l||[]).map((id,k)=>`<div class="obj"><b>Objective ${esc(id)}</b> ${esc((c.obj||[])[k]||"")}</div>`).join("");
  return `<div class="ex">${String(c.e||"").split("\n").map(fmtLine).join("")}${objs}</div>`;
}

/* ---------- header ---------- */
function renderTop(){
  const list=deck(), k=counts(list), any=k.n+k.l+k.r;
  const scope = filter==="all" ? "" : " in Block "+filter;
  const study = !session && cards.length;
  $("#sub").innerHTML = !cards.length ? "Questions you save from any quiz land here."
    : session ? esc(session.cram ? "Studying every saved card"+scope+"." : "Studying"+scope+".")
    : `${list.length} saved question${list.length===1?"":"s"}${scope}.`;
  $("#tools").innerHTML = study ? `
    ${countsHtml(k)}
    <span style="flex-basis:100%"></span>
    <button class="btn" id="go" ${any?"":"disabled"}>${any ? "Study now" : "Nothing due"}</button>
    <button class="btn ghost" id="all">Study all ${list.length}</button>
    <button class="btn ghost" id="dl">Download for Anki</button>` : "";
  $("#help").textContent = study
    ? "Study now works like Anki: due reviews, cards you are learning, and up to your daily limit of new cards. Study all goes through every saved card. Download for Anki makes a file the Anki app imports (File, then Import) into a deck called Nexus."
    : "";
  const blocks=[...new Set(cards.map(c=>String(c.b)))].sort();
  if(filter!=="all" && !blocks.includes(filter)) filter="all";
  $("#filters").innerHTML = blocks.length>1 && study
    ? [["all","All blocks"], ...blocks.map(b=>[b,"Block "+b])].map(([v,t])=>`<button data-f="${v}" ${v==="all"?"":`data-b="${v}"`} aria-pressed="${filter===v}">${t}</button>`).join("")
    : "";
  $("#prefs").innerHTML = study ? `<label for="lim">New cards per day</label>
    <select id="lim">${[5,10,20,50,100,9999].map(v=>`<option value="${v}" ${meta.lim===v?"selected":""}>${v===9999?"No limit":v}</option>`).join("")}</select>
    <span>${newToday() ? newToday()+" started today" : ""}</span>` : "";
  document.querySelectorAll("[data-f]").forEach(b=>b.onclick=()=>{ filter=b.dataset.f; render(); });
  const lim=$("#lim"); if(lim) lim.onchange=()=>{ meta.lim=+lim.value; saveMeta(); render(); };
  const go=$("#go"); if(go) go.onclick=()=>startSession(false);
  const all=$("#all"); if(all) all.onclick=()=>startSession(true);
  const dl=$("#dl"); if(dl) dl.onclick=()=>download(list);
}

/* ---------- list ---------- */
function renderList(){
  const list=deck();
  if(!cards.length){
    $("#main").innerHTML = `<div class="empty"><b>Your Anki list is empty.</b>
      <span>Open any quiz and press Save to Anki on a question. After you finish a quiz, the results screen can save every question you missed in one click.</span>
      <a href="${ROOT}" target="_top">Go to the home page</a></div>`;
    return;
  }
  const groups=[];
  list.forEach(c=>{ const g=groups[groups.length-1]; if(g && g.slug===c.slug) g.items.push(c); else groups.push({slug:c.slug, set:c.set, b:c.b, items:[c]}); });
  $("#main").innerHTML = groups.map(g=>`<section class="group" data-b="${esc(g.b)}">
    <h2>${esc(g.set)} <span>Block ${esc(g.b)}, ${g.items.length} saved</span></h2>
    <ul class="cards">${g.items.map(c=>{ const [dl,cls]=dueLabel(c); return `<li>
      <details><summary><span class="qn">Q${c.n}</span><span class="s">${esc(c.p)}</span><span class="due ${cls}">${dl}</span></summary>
        <div class="back">${optsHtml(c,true)}${backHtml(c)}${c.href?`<a class="open" href="${ROOT+esc(c.href)}" target="_top">Open ${esc(c.set)}</a>`:""}</div></details>
      <button class="rm" data-id="${esc(c.id)}" aria-label="Remove question ${c.n} of ${esc(c.set)}">Remove</button></li>`; }).join("")}</ul>
  </section>`).join("");
  document.querySelectorAll(".rm").forEach(b=>b.onclick=()=>{
    const i=cards.findIndex(c=>c.id===b.dataset.id); if(i<0) return;
    removed={card:cards[i], at:i}; cards.splice(i,1); save(); render();
    status(`Removed Q${removed.card.n} of ${esc(removed.card.set)}. <button class="linkbtn" id="undo">Undo</button>`);
    $("#undo").onclick=()=>{ if(!removed) return; cards.splice(Math.min(removed.at,cards.length),0,removed.card); removed=null; save(); status(""); render(); };
  });
}

/* ---------- study session ----------
   Order on each step, as in Anki: learning cards that are due, then reviews due today and new cards,
   then learning cards due within the next 20 minutes. "Study all" swaps the second group for every card. */
function startSession(cram){
  const ids=new Set(deck().map(c=>c.id));
  session = {cram, ids, pool: cram ? deck().map(c=>c.id) : null, cur:null, shown:false, done:0, undo:null};
  status(""); nextCard(); render(); scrollTo({top:0});
}
function inDeck(c){ return session.ids.has(c.id); }
function pick(){
  const now=Date.now(), mine=cards.filter(inDeck);
  const learnDue=mine.filter(c=>isLearn(c) && due(c)<=now).sort((a,b)=>due(a)-due(b));
  if(learnDue.length) return learnDue[0];
  if(session.cram){
    while(session.pool.length){ const c=cards.find(x=>x.id===session.pool[0]); if(c && !(isLearn(c) && due(c)>now)) return c; session.pool.shift(); }
  } else {
    const rev=mine.filter(c=>isReview(c) && due(c)<dayEnd()).sort((a,b)=>due(a)-due(b));
    if(rev.length) return rev[0];
    if(newLeft()>0){ const nw=mine.filter(isNew).sort(order); if(nw.length) return nw[0]; }
  }
  const ahead=mine.filter(c=>isLearn(c) && due(c)<=now+LEARN_AHEAD).sort((a,b)=>due(a)-due(b));
  return ahead[0] || null;
}
function nextCard(){ const c=pick(); session.cur=c ? c.id : null; session.shown=false; }
function endSession(){ session=null; document.documentElement.removeAttribute("data-b"); render(); scrollTo({top:0}); }
function fcard(c){ return c.f ? F.TypeConvert.card(c.f) : F.createEmptyCard(new Date()); }
function store(card){ const o={}; for(const k in card){ const v=card[k]; o[k] = v instanceof Date ? v.toISOString() : v; } return o; }

function renderSession(){
  const c=cards.find(x=>x.id===session.cur);
  const list=cards.filter(inDeck), k=counts(list);
  if(!c){
    document.documentElement.removeAttribute("data-b");
    const later=list.filter(x=>!isNew(x)).map(due).filter(t=>t>Date.now()).sort((a,b)=>a-b)[0];
    const msg = later ? "The next card is due in "+ivl(later-Date.now())+"." : "";
    const moreNew = !session.cram && list.some(isNew) && newLeft()===0 ? ` You reached today's limit of ${meta.lim} new cards. Raise it on the list page, or use Study all.` : "";
    $("#main").innerHTML = `<article class="card"><h2>Congratulations, you have finished for now.</h2>
      <p>You answered ${session.done} card${session.done===1?"":"s"}. ${msg}${moreNew}</p>
      ${session.undo?`<p><button class="linkbtn" id="undo2">Undo last answer</button></p>`:""}
      <div class="rowbtns"><button class="btn" id="end">Back to list</button></div></article>`;
    $("#end").onclick=endSession; $("#end").focus();
    const u=$("#undo2"); if(u) u.onclick=undoLast;
    return;
  }
  document.documentElement.dataset.b=c.b;
  const cur = isNew(c) ? "n" : isLearn(c) ? "l" : "r";
  const sched = session.shown ? S.repeat(fcard(c), new Date()) : null;
  const now=Date.now();
  const btn=(g,label)=>`<button class="g${g}" data-g="${g}">${label}<small>${ivl(sched[g].card.due.getTime()-now)}</small></button>`;
  $("#main").innerHTML = `<article class="card">
    <div class="chead"><b>${esc(c.set)}, Q${c.n}</b>${countsHtml(k, cur)}</div>
    <p class="stem">${esc(c.p)}</p>
    ${optsHtml(c, session.shown)}
    ${session.shown ? backHtml(c)+`
      <div class="rate" role="group" aria-label="How well did you know it?">
        ${btn(F.Rating.Again,"Again")}${btn(F.Rating.Hard,"Hard")}${btn(F.Rating.Good,"Good")}${btn(F.Rating.Easy,"Easy")}
      </div>
      <div class="rowbtns"><span>${session.undo?`<button class="linkbtn" id="undo2">Undo last answer</button>`:""}</span><span class="keys">Keys: 1 Again, 2 Hard, 3 or Space Good, 4 Easy</span></div>`
    : `<div class="rowbtns"><button class="btn" id="flip">Show answer</button><span class="keys">Space shows the answer</span></div>`}
    <div class="rowbtns"><button class="btn ghost" id="end">End session</button>${!session.shown && session.undo?`<button class="linkbtn" id="undo2">Undo last answer</button>`:""}</div>
  </article>`;
  const f=$("#flip"); if(f){ f.onclick=()=>{ session.shown=true; renderSession(); const b=document.querySelector('[data-g="3"]'); if(b) b.focus(); }; f.focus(); }
  document.querySelectorAll("[data-g]").forEach(b=>b.onclick=()=>answer(+b.dataset.g));
  $("#end").onclick=endSession;
  const u=$("#undo2"); if(u) u.onclick=undoLast;
}
function answer(grade){
  const c=cards.find(x=>x.id===session.cur); if(!c) return;
  const wasNew=isNew(c);
  session.undo={id:c.id, f:c.f ? JSON.parse(JSON.stringify(c.f)) : null, wasNew, pool:session.cram ? session.pool.slice() : null, done:session.done};
  c.f = store(S.next(fcard(c), new Date(), grade).card);
  if(wasNew && !session.cram){ newToday(); meta.n++; saveMeta(); }
  if(session.cram && session.pool[0]===c.id) session.pool.shift();
  session.done++;
  save(); nextCard(); renderTop(); renderSession(); scrollTo({top:0});
}
function undoLast(){
  const u=session && session.undo; if(!u) return;
  const c=cards.find(x=>x.id===u.id); if(!c){ session.undo=null; return; }
  if(u.f) c.f=u.f; else delete c.f;
  if(u.wasNew && !session.cram && meta.n>0){ meta.n--; saveMeta(); }
  if(u.pool) session.pool=u.pool;
  session.done=u.done; session.cur=c.id; session.shown=false; session.undo=null;
  save(); renderTop(); renderSession();
}
addEventListener("keydown", e=>{
  if(!session || e.altKey || e.metaKey) return;
  if((e.ctrlKey && e.key.toLowerCase()==="z")){ e.preventDefault(); undoLast(); return; }
  if(e.ctrlKey) return;
  const onBtn = e.target && e.target.tagName==="BUTTON";
  if(!session.cur){ return; }
  if(!session.shown && (e.key===" " || e.key==="Enter") && !onBtn){ e.preventDefault(); const f=$("#flip"); if(f) f.click(); }
  else if(session.shown && ["1","2","3","4"].includes(e.key)){ e.preventDefault(); answer(+e.key); }
  else if(session.shown && e.key===" " && !onBtn){ e.preventDefault(); answer(F.Rating.Good); }
  else if(e.key==="Escape"){ endSession(); }
});
/* A learning card can come due while you sit on the done screen. */
setInterval(()=>{ if(session && !session.cur){ nextCard(); if(session.cur){ renderTop(); renderSession(); } } else if(!session){ renderTop(); } }, 30000);

/* ---------- download for the Anki app ----------
   A tab-separated text file with Anki's file headers: Basic note type, deck "Nexus",
   tags in column 3, and a stable id in column 4 so a re-import updates cards. */
function field(html){ return '"'+String(html).replace(/\t/g," ").replace(/\r?\n/g,"<br>").replace(/"/g,'""')+'"'; }
function tag(s){ return String(s).trim().replace(/[^\w.\-]+/g,"_").replace(/^_+|_+$/g,""); }
function download(list){
  if(!list.length) return;
  const rows=list.map(c=>{
    const front = `${esc(c.p)}<br><br>${c.o.map((o,i)=>`<b>${L[i]}.</b> ${esc(o)}`).join("<br>")}<br><br><small style="color:#888">${esc(c.set)}, Q${c.n}</small>`;
    const objs=(c.l||[]).map((id,k)=>`<small style="color:#888">Objective ${esc(id)}: ${esc((c.obj||[])[k]||"")}</small>`).join("<br>");
    const back = `<b>${L[c.a]}. ${esc(c.o[c.a])}</b><br><br>${String(c.e||"").split("\n").map(esc).join("<br>")}${objs?"<br><br>"+objs:""}`;
    const tags = ["Nexus", "Block"+c.b, tag(c.set), tag(c.c), ...(c.l||[]).map(tag)].filter(Boolean).join(" ");
    return [field(front), field(back), field(tags), field("nexus-"+c.slug+"-"+c.n)].join("\t");
  });
  const head = ["#separator:tab","#html:true","#notetype:Basic","#deck:Nexus","#tags column:3","#guid column:4"].join("\n");
  const blob = new Blob([head+"\n"+rows.join("\n")+"\n"], {type:"text/plain;charset=utf-8"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download="nexus-anki-"+new Date().toISOString().slice(0,10)+".txt";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href), 2000);
  status(`Downloaded ${list.length} card${list.length===1?"":"s"}. In Anki, choose File, then Import, and pick the file.`);
}

function render(){ renderTop(); session ? renderSession() : renderList(); }
addEventListener("storage", e=>{ if(e.key===KEY || e.key===META_KEY){ load(); if(!session) render(); else renderTop(); } });
if(!F){ document.getElementById("main").innerHTML='<div class="empty"><b>The study engine did not load.</b><span>Reload the page. If it keeps happening, your browser may be blocking scripts on this site.</span></div>'; }
else { load(); render(); }
</script>
