<style>

@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#171C18;--paper:#1F251F;--ink:#EDEFE9;--muted:#9BA79C;--line:#333A32;
  --accent:#6FBBA3;--wash:#24302A;--ok:#6FBB8B;--okw:#1F3226;--bad:#E28C79;--badw:#3A2420;--tick:#3E463D;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#171C18;--paper:#1F251F;--ink:#EDEFE9;--muted:#9BA79C;--line:#333A32;
  --accent:#6FBBA3;--wash:#24302A;--ok:#6FBB8B;--okw:#1F3226;--bad:#E28C79;--badw:#3A2420;--tick:#3E463D;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.55}
.wrap{max-width:760px;margin:0 auto;padding-block:28px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px}
header{display:flex;flex-direction:column;gap:12px}

h1{font-family:var(--serif);font-weight:600;font-size:clamp(26px,5vw,34px);line-height:1.15;margin:0;text-wrap:balance}

.chead{display:flex;justify-content:space-between;gap:10px;font-family:var(--mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}

.strike:hover{border-color:var(--accent);color:var(--accent)}

.strike[aria-pressed="true"]{background:var(--wash);color:var(--ink)}
.optrow.struck .opt > span:last-child{text-decoration:line-through;color:var(--muted)}
.optrow.struck .opt .k{color:var(--line)}
.tries{font-family:var(--mono);font-size:12px;color:var(--muted)}
.tries .bad{color:var(--bad)}.tries .ok{color:var(--ok)}

.tick.redo{box-shadow:inset 0 -3px 0 var(--accent)}

<div class="wrap">
  <header>
    <div class="eyebrow">Foundations of Medicine · Block 2 · Weeks 5 to 8</div>
    <h1>Adult Screening, Aging and Prescribing</h1>
    <div class="stats" id="stats"></div>
    <div class="save" id="save" role="status">Progress saves in this browser.</div>

<script>
const QUESTIONS = [{"c": "Week 5", "p": "A public health unit pilots a new blood test for an asymptomatic condition in 1,000 adults. The condition has a prevalence of 2% in this group. The test has a sensitivity of 90% and a specificity of 95% against the gold standard. A participant's result comes back positive. What is the approximate probability that she truly has the condition?", "o": ["About 27%", "About 99.8%", "About 90%", "About 95%"], "a": 0, "e": "A is correct. Build the 2x2 table. 20 of 1,000 have the condition, so TP = 18. 980 are healthy and 5% of them test positive, so FP = 49. PPV = TP / (TP + FP) = 18 / 67, about 27%. The deciding clue is the low prevalence.\nB: 99.8% is the NPV. It answers the question for a negative result.\nC: 90% is the sensitivity, the chance of a positive test when disease is present.\nD: 95% is the specificity, the chance of a negative test when disease is absent.\nHigh yield: Predictive value changes with prevalence. Use a sensitive screen, then a specific test for diagnosis.", "l": ["W5 7.1"]}, {"c": "Week 5", "p": "Your hospital lab is adding a new assay and plans to set its own reference interval instead of adopting the manufacturer's. Which statement about reference intervals is correct?", "o": ["An RI applies equally well to pregnant and pediatric patients", "An RI holds the central 99% of values from a healthy population", "Establishing a new RI needs over 120 healthy subjects per partition", "Verifying an existing RI needs over 120 local patients per partition", "A result outside the RI confirms that disease is present"], "a": 2, "e": "C is correct. Establishing an RI needs more than 120 subjects per partition. Verifying an existing RI needs more than 20.\nA: Pediatric, geriatric, transgender and pregnant patients are challenging populations for RIs.\nB: The RI is the central 95% of healthy values, not 99%.\nD: Verification needs only more than 20 patients per partition.\nE: 2.5% of healthy people fall outside each tail, so an abnormal flag does not prove disease.\nHigh yield: Limitations of RIs include demographics, excluded tails, sampling time, sample type and method.", "l": ["W5 7.2.1", "W5 7.2.3"]}, {"c": "Week 5", "p": "Omar, 50, feels well, but his routine potassium returns at 6.8 mmol/L. His previous values were all normal and his other electrolytes are unremarkable. You review the collection and transport, the lab's analytical run and the final report, and find no explanation. Following the approach to unexpected lab test results, what is the next step?", "o": ["Repeat the test with no further review of the result", "Report it as a post-analytical transcription error", "Accept the result as correct and start treatment", "Consult a lab professional for explanation and options"], "a": 3, "e": "D is correct. After pre-analytical, analytical and post-analytical explanations are considered, step 5 is to consult a lab professional, who explains and suggests other tests or methods.\nA: Repeat testing is step 6 and follows the lab consultation.\nB: Nothing in the review points to a transcription error, which was already considered.\nC: Accepting the result as correct is the final step, reached only after the earlier steps.\nHigh yield: Order: understand the issue, pre-analytical, analytical, post-analytical, consult the lab, additional testing, consider the result is correct.", "l": ["W5 7.4", "W5 7.3"]}, {"c": "Week 5", "p": "Priya, a 29-year-old runner, finishes a hot-weather marathon after drinking little. Her plasma osmolality is high, her urine is dark and concentrated, and she reports intense thirst. Which change is the first homeostatic step in restoring her osmolality?", "o": ["Hypothalamic osmoreceptors fire and trigger ADH release", "Kidneys lower water permeability and raise urine output", "Stretch receptor activity rises and suppresses ADH", "Atrial stretch triggers release of natriuretic peptide"], "a": 0, "e": "A is correct. In dehydration the hypothalamus increases osmoreceptor activity, decreases stretch receptor activity and releases ADH. The kidneys then raise water permeability and cut urine output, and thirst restores volume.\nB: Kidneys increase water permeability and decrease urine output to conserve fluid.\nC: Stretch receptor activity falls with low volume, and ADH release increases.\nD: ANP is released when atrial muscle is stretched and inhibits RAAS, the opposite of what she needs.\nHigh yield: Restore osmolality, conserve fluid, restore volume, increase BP.", "l": ["W5 9.3", "W5 9.4"]}, {"c": "Week 5", "p": "A tumour arises in a pelvic organ that lies below the pelvic pain line, the lower limit of the peritoneum. The patient describes a vague, deep, poorly localized ache. Along which route do visceral pain signals from this organ reach the spinal cord?", "o": ["With sympathetics to the T1-L3 levels", "With parasympathetics to the S2-S4 levels", "With the vagus nerve to the medulla", "With the phrenic nerve to the C3-C5 levels"], "a": 1, "e": "B is correct. Below the pelvic pain line, visceral afferents follow parasympathetic fibres to S2-S4. Above it, they follow sympathetic fibres to T1-L3.\nA: Sympathetic routes to T1-L3 carry pain from viscera above the pelvic pain line.\nC: The vagus carries parasympathetic output to thoracic and abdominal viscera, not pelvic pain below the line.\nD: The phrenic nerve carries diaphragm irritation, referred to the shoulder.\nHigh yield: Above the line, follow sympathetics. Below the line, follow parasympathetics.", "l": ["W5 9.5"]}, {"c": "Week 5", "p": "Joseph, a 52-year-old with a 30 pack-year smoking history, has bronchoscopy for chronic cough. Biopsy shows squamous cells lining the bronchus where columnar cells normally sit. Nuclei are uniform, maturation is orderly and there is no atypia. Which response does this represent?", "o": ["Hyperplasia", "Hypertrophy", "Dysplasia", "Metaplasia"], "a": 3, "e": "D is correct. Metaplasia is a reversible change from one type of specialized cell to another, here columnar to squamous. Orderly maturation and no nuclear changes argue against dysplasia.\nA: Hyperplasia is more cells of the same type, as in breast, colon or endometrium.\nB: Hypertrophy is larger cells with no new cells.\nC: Dysplasia shows disordered growth and maturation with nuclear changes and is premalignant.\nHigh yield: Adaptation is reversible. Dysplasia is pre-malignant.", "l": ["W5 9.9", "W5 9.8"]}, {"c": "Week 5", "p": "Two patients attend the emergency department. Patient 1 has a shallow kitchen burn limited to the skin surface of her forearm. Patient 2 has a confirmed myocardial infarction from an occluded coronary artery. Which pairing best predicts how each injured tissue heals, in order?", "o": ["Regeneration, then scarring", "Regeneration in both patients", "Scar formation in both patients", "Scar formation, then regeneration"], "a": 0, "e": "A is correct. Skin epithelium regenerates constantly, so a mild injury restores normal function. Cardiac myocytes are permanent cells, so the infarct heals by angiogenesis, granulation tissue and a fibrous scar.\nB: Cardiac myocytes cannot regenerate.\nC: A mild skin injury does not need scarring. Scar follows severe injury that destroys supporting structures.\nD: This reverses the two tissue types.\nHigh yield: Permanent cells (cardiac myocytes, neurons, skeletal muscle) always heal by scarring.", "l": ["W5 9.12", "W5 9.11"]}, {"c": "Week 5", "p": "Daniel, 38, completes a PHQ-9 at his periodic health encounter. His total is 12. He denies thoughts of self-harm and still works full time, though he has lost interest in hockey and sleeps poorly. Based on PHQ-9 score bands, which management is most appropriate?", "o": ["Pharmacotherapy, CBT and psychiatry referral", "Reassurance with no further action required", "Watchful waiting, then repeat at follow-up", "Consider starting pharmacotherapy or CBT"], "a": 3, "e": "D is correct. A PHQ-9 of 10-14 is moderate depression, where pharmacotherapy or CBT should be considered.\nA: Adding psychiatry referral fits 20-27, severe depression.\nB: Reassurance fits 0-4, minimal depression.\nC: Watchful waiting fits 5-9, mild depression.\nHigh yield: PHQ-9 bands: 0-4, 5-9, 10-14, 15-19, 20-27.", "l": ["W5 3.2"]}, {"c": "Week 5", "p": "Leila, 44, lost her job five weeks ago. She worries daily about money, sleeps poorly and has trouble focusing during job searches. She still parents her two children, attends interviews and sees friends weekly. Her GAD-7 score is 9. Which interpretation fits best?", "o": ["Generalized anxiety disorder, based on the GAD-7", "Situational stress, an expected response to job loss", "Major depressive disorder, given insomnia and poor focus", "Anxiety disorder, since symptoms have passed 2 weeks"], "a": 1, "e": "B is correct. An expectable response to a common stressor or loss is not a mental disorder. Her symptoms are recent and do not interfere with functioning. A GAD-7 of 9 is mild anxiety.\nA: An anxiety disorder needs sustained, excessive symptoms, usually for 6 months, that interfere with functioning.\nC: Depression needs depressed mood or loss of interest with interference in functioning, neither of which is described.\nD: The 2-week window applies to major depression. Anxiety disorders usually need 6 months.\nHigh yield: The key to a mental disorder is the duration of symptoms and the level of interference.", "l": ["W5 3.1"]}, {"c": "Week 5", "p": "A family health team notices its refugee patients complete far fewer ordered blood tests than other patients. The team now books these patients longer visits with interpreters and gives them transit tokens for lab visits. Other patients keep standard bookings. Which concept best describes this policy?", "o": ["Horizontal equity", "Health inequality", "Health surveillance", "Vertical equity"], "a": 3, "e": "D is correct. Vertical equity is unequal treatment for those who are unequal in relevant respects. The team gives more support to a group facing more barriers.\nA: Horizontal equity is equal treatment of equals, which is what the standard bookings provide.\nB: Health inequality is the gap the team observed, not the policy that responds to it.\nC: Health surveillance is ongoing monitoring of health, not a service policy.\nHigh yield: Childcare, transit, employment and understanding of a test all affect follow-through on care.", "l": ["W5 4.1", "W5 4.3"]}, {"c": "Week 5", "p": "A trial compares annual screening for a cancer against usual care. Tumours in both arms show the same mix of slow and fast growth. Median survival from diagnosis is 7 years in the screened arm and 4 years in the control arm, yet disease-specific mortality and average age at death are identical. Which bias best explains the apparent survival gain?", "o": ["Length bias", "Selection bias", "Lead-time bias", "Publication bias"], "a": 2, "e": "C is correct. Screening moved the date of diagnosis earlier without delaying death, so survival measured from diagnosis grows. Identical mortality is the clue.\nA: Length bias over-represents slow-growing cases in the screened group. The stem rules this out with the same growth mix in both arms.\nB: Selection bias arises when groups differ at the start, which the stem does not describe.\nD: Publication bias affects which studies get published, not results inside one trial.\nHigh yield: Judge screening benefit by reduction in disease-specific mortality.", "l": ["W5 6.4"]}, {"c": "Week 5", "p": "Rahul, a 46-year-old with no symptoms, has screening labs at his periodic health encounter. Fasting plasma glucose is 6.4 mmol/L and HbA1c is 6.2%. His BMI is 29 and his father has type 2 diabetes. Which category do these results place him in?", "o": ["At risk only", "Normal glycemia", "Prediabetes", "Type 2 diabetes"], "a": 2, "e": "C is correct. FPG 6.1-6.9 mmol/L and HbA1c 6.0-6.4% both define prediabetes.\nA: At risk is FPG 5.6-6.0 or HbA1c 5.5-5.9%.\nB: Normal is FPG under 5.6 and HbA1c under 5.5%.\nD: Diabetes needs FPG of 7.0 mmol/L or more, or HbA1c of 6.5% or more.\nHigh yield: With risk factors, rescreen every 6-12 months instead of every 3 years.", "l": ["W5 6.5", "W5 8.1"]}, {"c": "Week 5", "p": "Sofia is a healthy 45-year-old premenopausal woman with no family history of cancer or heart disease. She does not smoke, her BMI is normal and her last Pap test 3 years ago was negative. Using the periodic health screening guidance, which tests are due today?", "o": ["Pap test, plus a diabetes screen with FPG or HbA1c", "Pap test, lipid panel and fecal immunochemical test", "Lipid panel and a diabetes screen with FPG or HbA1c", "Diabetes screen, FIT and a lipid panel together"], "a": 0, "e": "A is correct. Cervical screening runs ages 25-70 every 3 years, and hers is due. Diabetes screening starts at 40 and repeats every 3 years.\nB: Lipids start at 50 for women (or postmenopausal), and FIT starts at 50.\nC: The lipid panel is not yet due, and this option misses the Pap test.\nD: FIT and lipids both start at 50, and this option misses the Pap test.\nHigh yield: Men start lipid screening at 40. Women start at 50 or at menopause.", "l": ["W5 8.1", "W5 6.5"]}, {"c": "Week 6", "p": "Grace, 48, has a 1.4 cm breast carcinoma excised with sentinel node biopsy. The report reads poorly differentiated invasive ductal carcinoma, 0 of 3 lymph nodes positive. Staging CT shows no distant spread. Which statement best describes her tumour?", "o": ["Advanced stage with an aggressive, high grade", "Early stage with an aggressive, high grade", "Early stage with an indolent, low grade", "Advanced stage with an indolent, low grade"], "a": 1, "e": "B is correct. Stage describes size and spread. A small tumour with N0 and M0 is early stage. Grade describes how cells look. Poorly differentiated is grade III, aggressive.\nA: Grade is right, but N0 M0 at 1.4 cm is not advanced.\nC: The stage is right, but poorly differentiated cells are high grade.\nD: No nodes or metastases rules out advanced stage, and poor differentiation rules out low grade.\nHigh yield: Grade and stage are separate. Both inform prognosis and treatment.", "l": ["W6 4.2", "W6 6.4"]}, {"c": "Week 6", "p": "Two families attend a cancer genetics clinic. In Family 1, a single activating mutation in one allele of RET drives medullary thyroid cancer. In Family 2, a child inherits one mutated Rb allele and develops cancer after a second mutation. Which classification of each gene is correct, in order?", "o": ["Oncogene in both of the two families", "Tumour suppressor in both of the families", "Oncogene, then tumour suppressor gene", "Tumour suppressor gene, then oncogene"], "a": 2, "e": "C is correct. RET is a proto-oncogene, and a single hit in one allele makes it an oncogene (gain of function). Rb is a tumour suppressor gene that needs two hits (loss of function), and an inherited first hit raises risk.\nA: Rb needs two hits, the hallmark of a tumour suppressor.\nB: RET needs only one hit, the hallmark of an oncogene.\nD: This reverses the two mechanisms.\nHigh yield: One hit: Ras, c-myc, Her2-neu, RET. Two hits: p53, Rb, PTEN, BRCA1/2.", "l": ["W6 7.9"]}, {"c": "Week 6", "p": "Ahmed, 47, grew up in rural Egypt and had a parasitic infection as a child that was never treated. He now has painless blood in his urine, and cystoscopy shows a bladder mass. Which organism most likely contributed to his cancer?", "o": ["Helicobacter pylori", "Human T-lymphotropic virus 1", "Southeast Asian liver fluke", "Schistosoma blood flukes"], "a": 3, "e": "D is correct. Schistosoma (blood flukes) is linked to bladder cancer.\nA: H. pylori causes gastric cancer.\nB: HTLV-1 causes adult T-cell lymphoma.\nC: The Southeast Asian liver fluke causes cholangiocarcinoma.\nHigh yield: HPV: cervical, anal, oropharyngeal. HBV and HCV: hepatocellular. EBV: nasopharyngeal, Burkitt, Hodgkin. HHV8: Kaposi sarcoma.", "l": ["W6 7.7"]}, {"c": "Week 6", "p": "A cervical biopsy from Mei, 33, shows dysplastic cells spanning the full thickness of the squamous epithelium. The basement membrane is intact throughout and no dysplastic cells are seen beneath it. Which term and implication fit best?", "o": ["Carcinoma in situ, not yet a malignant neoplasm", "Invasive carcinoma, at risk of nodal spread", "Metaplasia, a reversible adaptive change", "Metastasis, spread from a distant primary"], "a": 0, "e": "A is correct. Dysplastic cells involving the entire epithelial thickness and pushing against an intact basement membrane define carcinoma in situ (high grade dysplasia), which is pre-malignant.\nB: A malignant neoplasm needs cells past the basement membrane.\nC: Metaplasia is a change of cell type without dysplasia.\nD: Metastasis is spread to and invasion of other tissues.\nHigh yield: Pap testing screens for this pre-cancer stage.", "l": ["W6 4.1", "W6 7.4"]}, {"c": "Week 6", "p": "Chloe, 24, notices a new lump in her left breast. On exam there is a 2 cm smooth, firm, mobile, non-tender mass with no skin or nipple changes and no palpable axillary nodes. Which is the most appropriate first imaging test?", "o": ["Breast ultrasound", "Staging CT of the chest", "Contrast breast MRI", "Diagnostic mammogram"], "a": 0, "e": "A is correct. Ultrasound is the first modality for a palpable lump and for women under 30.\nB: CT is for staging after biopsy and is not used in the workup.\nC: MRI is for high-risk screening, high breast density and local staging.\nD: Mammography is not the first modality for a palpable lump in a woman under 30.\nHigh yield: Firm, mobile, well-circumscribed fits fibroadenoma, a benign neoplasm.", "l": ["W6 3.2", "W6 1.3"]}, {"c": "Week 6", "p": "Hannah, 32, tested positive for a pathogenic BRCA1 variant after her mother's ovarian cancer diagnosis. She has no breast symptoms and a normal clinical breast exam. Which breast screening plan fits?", "o": ["Annual mammogram alone, from age 40", "Mammogram every 2 years, from age 50", "Annual MRI and mammogram, from now", "Clinical breast exams only until 35"], "a": 2, "e": "C is correct. BRCA carriers have an annual mammogram from 30 and breast MRI from 30 to 69. She is 32, so screening applies now.\nA: Mammogram alone misses MRI, and 40 is too late.\nB: Every 2 years from 50 is the average-risk program.\nD: Clinical exams alone are not the plan. Age 35 is the BRCA1 prophylactic surgery milestone.\nHigh yield: Prophylactic surgery: age 35 for BRCA1, age 40 for BRCA2.", "l": ["W6 7.11"]}, {"c": "Week 6", "p": "Ruth, 66, has a breast mass that radiology rates as highly suspicious for malignancy. Her core needle biopsy returns as benign breast tissue. What is the most appropriate next step?", "o": ["Reassure her and return to routine screening", "Repeat a screening mammogram in 2 years", "Discuss the discordance with the pathologist", "Refer for mastectomy without further review"], "a": 2, "e": "C is correct. Clinical-pathological non-concordance is a reason to communicate directly, beyond the requisition.\nA: Reassurance ignores imaging and pathology that disagree.\nB: Routine interval screening ignores a suspicious lesion.\nD: Surgery skips resolving the discordance.\nHigh yield: Other triggers: unusual or ambiguous result, missing information, rare diagnosis, urgent result needed.", "l": ["W6 3.6"]}, {"c": "Week 6", "p": "Three patients attend a breast cancer clinic. Patient 1 receives chemotherapy before surgery to shrink a 6 cm tumour. Patient 2 receives radiation after surgery for micro-metastatic disease. Patient 3 receives radiation to relieve pain from a spinal metastasis. Which intent applies to each, in order?", "o": ["Adjuvant, palliative, neoadjuvant", "Neoadjuvant, adjuvant, palliative", "Neoadjuvant, adjuvant, curative", "Adjuvant, neoadjuvant, palliative"], "a": 1, "e": "B is correct. Before surgery to shrink a tumour is neoadjuvant. After surgery for micro-metastatic disease is adjuvant. Radiation to relieve symptoms of metastatic disease is palliative.\nA: Patient 2 is post-surgical (adjuvant) and Patient 3 is palliative.\nC: Symptom relief for a metastasis is palliative, not curative.\nD: This swaps the first two.\nHigh yield: Radiation oncology aims to reduce local recurrence or metastasis, or to relieve symptoms.", "l": ["W6 6.2", "W6 6.1"]}, {"c": "Week 6", "p": "Tamara, 41, carries a pathogenic BRCA2 variant. She asks you to order the same test for her healthy 12-year-old daughter so the family has time to plan. Which response best follows the ethics of cancer genetic testing?", "o": ["Test only if the daughter develops breast changes", "Defer testing until she is an adult and chooses", "Test now, since results will guide her screening", "Test now, since a parent holds full decision rights"], "a": 1, "e": "B is correct. Avoid testing children for adult-onset conditions because of stigmatization, anxiety and vulnerable child parenting. Autonomy makes testing each person's own choice.\nA: Symptoms call for diagnostic workup, not predictive testing of a minor.\nC: BRCA surveillance starts at 30, so a result guides nothing in childhood.\nD: The decision belongs to the person tested, under autonomy.\nHigh yield: Confirm a mutation in an affected relative before testing unaffected relatives.", "l": ["W6 9.1"]}, {"c": "Week 6", "p": "Jonah, 39, tests positive for a pathogenic variant causing Lynch syndrome. He does not want his sister told, citing a long family conflict. Which approach best reflects the ethics of sharing genetic results?", "o": ["Contact his sister directly, since beneficence wins", "Insist results be shared with all first-degree relatives", "Withhold further counselling until he agrees to share", "Respect his choice and explain the benefit to relatives"], "a": 3, "e": "D is correct. Under autonomy, it is the patient's right to choose who knows his results. Beneficence supports explaining that relatives have the option of surveillance.\nA: Disclosure without consent violates his autonomy.\nB: No rule makes sharing mandatory.\nC: Withholding counselling breaches non-maleficence and justice.\nHigh yield: Autonomy, beneficence, non-maleficence and justice all apply to genetic testing.", "l": ["W6 9.2"]}, {"c": "Week 6", "p": "Regarding cancer statistics in Canada, which of the following statements are true?\ni) Colorectal cancer is the second leading cause of cancer death\nii) Breast cancer is the leading cause of cancer death in women\niii) About 1 in 2 Canadians will develop cancer in their lifetime\niv) Prostate cancer is the most often diagnosed cancer overall", "o": ["i) and ii) only", "ii) and iv) only", "i), iii) and iv) only", "i) and iii) only", "All of the above"], "a": 3, "e": "D is correct. Canadian cancer mortality ranks lung, colorectum, then pancreas. 1 in 2 Canadians develop cancer and 1 in 4 die of it.\nA: Lung leads cancer deaths in women. Breast is second.\nB: Statements ii and iv are both false.\nC: Lung is the most diagnosed cancer overall. Prostate is first in men only.\nE: Statements ii and iv are false.\nHigh yield: High-income countries have higher incidence and lower mortality.", "l": ["W6 7.1"]}, {"c": "Week 6", "p": "You meet Mr. Laurent, 70, to discuss biopsy results confirming metastatic pancreatic cancer. When you ask what he understands so far, he says the scan showed a cyst and he expects to be back at work next week. Within SPIKES, which step are you in, and what is the best approach?", "o": ["Perception, do not confront his denial at this visit", "Knowledge, correct his understanding with all details", "Empathy, name his emotion before checking understanding", "Invitation, ask permission before sharing information"], "a": 0, "e": "A is correct. Asking what he knows before you tell is Perception. If a patient is in denial, do not confront the denial at the first interview.\nB: Knowledge comes later, with a warning, no jargon and small chunks.\nC: Empathy responds to emotions as they arise after news is given.\nD: Invitation follows Perception and asks how much he wants to know.\nHigh yield: Setting, Perception, Invitation, Knowledge, Empathy, Strategy and summary.", "l": ["W6 5.5"]}, {"c": "Week 6", "p": "Doug, 63, smoked for decades and has a 45 pack-year history. He quit 18 years ago. He feels well and has no symptoms. He asks about lung cancer screening. Which response is correct?", "o": ["He qualifies for a screening chest X-ray each year", "He qualifies for annual low-dose CT, up to 3 times", "He is not eligible, since he quit over 15 years ago", "He qualifies, since pack-years alone define eligibility"], "a": 2, "e": "C is correct. Lung screening covers adults 55-74 with a 30 pack-year history who currently smoke or quit less than 15 years ago. Quitting 18 years ago excludes him.\nA: CXR is not ordered for routine screening.\nB: He meets age and pack-years but fails the quit-time criterion.\nD: Eligibility needs age, pack-years and quit time together.\nHigh yield: Check every criterion, not only the most striking one.", "l": ["W6 7.11"]}, {"c": "Week 7", "p": "Kevin, 34, is stabbed in the right side of his back. His arms are normal. His right leg is weak, with hyperactive reflexes and an extensor plantar response. Vibration and proprioception are lost in the right leg. Pain and temperature are lost in the left leg. Where is the lesion?", "o": ["Right half of the thoracic cord", "Right lumbar roots below L1", "Left half of the thoracic cord", "Right half of the cervical cord"], "a": 0, "e": "A is correct. Dorsal columns run ipsilateral in the cord, so right vibration loss points to the right side. Spinothalamic tracts cross at entry, so pain loss is contralateral. UMN signs in a leg with normal arms place it in the thoracic cord.\nB: Lesions below L1 give LMN signs, with reduced reflexes and flexor plantars.\nC: A left lesion would cause left leg weakness and left vibration loss.\nD: A cervical lesion would also affect the arms.\nHigh yield: UMN: brain, brainstem, cord. LMN: anterior horn, root, nerve, NMJ, muscle.", "l": ["W7 6.4", "W7 6.2"]}, {"c": "Week 7", "p": "Linda, 52, notices complete loss of vision in her left eye over a few days. With the left eye covered, her right eye has full visual fields. Where is the lesion most likely located?", "o": ["Right occipital lobe", "Right optic tract", "Optic chiasm", "Left optic nerve"], "a": 3, "e": "D is correct. Each eye's information travels in its own optic nerve until the chiasm. A lesion before the chiasm affects one eye only.\nA: An occipital lesion also affects the same hemifield in both eyes, as in your Week 7 quiz.\nB: Left hemifield information from each eye runs in the right optic tract, so a tract lesion affects both eyes.\nC: Behind the optic nerve, fibres from both eyes travel together, so field loss would involve both eyes.\nHigh yield: Retina, optic nerve, chiasm, optic tract, LGN, optic radiation, visual cortex.", "l": ["W7 6.2", "W7 6.5"]}, {"c": "Week 7", "p": "During a periodic health exam, Mr. Novak, 82, has several findings noted. Which one is best explained by normal aging rather than disease?", "o": ["Memory loss that stops him managing finances", "A maximal exercise heart rate of about 120 bpm", "Fasting glucose of 7.4 mmol/L on two occasions", "Three falls in 6 months while walking indoors"], "a": 1, "e": "B is correct. Maximal heart rate falls with age, estimated as 200 minus age. For 82, that is about 118 bpm. Age-related changes are universal.\nA: Cognitive loss that impairs independence is dementia.\nC: FPG of 7.0 mmol/L or more is in the diabetes range.\nD: Falls are almost always multifactorial and need assessment.\nHigh yield: Age-related change is universal. Disease-related change is not.", "l": ["W7 1.6", "W7 1.5"]}, {"c": "Week 7", "p": "During a MoCA, Mrs. Ibrahim names the camel and lion but calls the rhinoceros a hippo. On verbal fluency she produces 12 words in 60 seconds. For abstraction, she says a train and bicycle both have wheels, and a watch and ruler are both used to measure. How many points does she earn across these three sections combined?", "o": ["6", "3", "4", "5"], "a": 2, "e": "C is correct. Naming: camel and lion score, hippo does not (2). Fluency: 11 or more words scores 1. Abstraction: has wheels scores 0, used to measure scores 1. Total 4.\nA: 6 credits the hippo and the wheels answer.\nB: 3 misses the fluency point, since 12 clears the threshold of 11.\nD: 5 credits the concrete answer about wheels.\nHigh yield: Abstraction needs the category (means of transportation, measuring instruments).", "l": ["W7 4.2"]}, {"c": "Week 7", "p": "Mr. Dubois, 84, is on day 2 after hip fracture repair. He is drowsy and drifts off mid-sentence. He states his age and date of birth correctly but gives the wrong year and cannot name the hospital. He lists five months backwards before stopping. His daughter says he was sharp last week. What is his 4-AT score and interpretation?", "o": ["7, possible delirium", "3, possible cognitive impairment", "11, possible delirium", "11, possible dementia"], "a": 2, "e": "C is correct. Alertness clearly abnormal = 4. AMT4 with 2 mistakes = 2. Fewer than 7 months = 1. Acute change = 4. Total 11. A score of 4 or more indicates possible delirium.\nA: 7 drops the 4 points for clearly abnormal alertness.\nB: 1-3 indicates possible cognitive impairment, which fits an alert patient without acute change.\nD: The 4-AT screens for delirium, and the acute change argues against dementia.\nHigh yield: Do not use the MoCA in suspected delirium. Use the 4-AT.", "l": ["W7 8.3", "W7 8.1"]}, {"c": "Week 7", "p": "Mrs. Chen, 76, and her son report 18 months of misplacing items and repeating questions. Her MoCA is 22/30 with deficits mainly in delayed recall. She still pays her bills, fills her own pill organizer, cooks full meals and drives without incident. Which diagnosis fits best?", "o": ["Normal age-related change", "Mild cognitive impairment", "Major neurocognitive disorder", "Delirium"], "a": 1, "e": "B is correct. She has a subjective change and an objective deficit, but daily functioning is preserved. That is MCI.\nA: Normal aging gives a subjective change without an objective deficit.\nC: Dementia needs deficits that interfere with independence in everyday activities.\nD: Delirium is acute and fluctuating, not an 18-month course.\nHigh yield: MCI converts to dementia at about 10% per year.", "l": ["W7 7.3", "W7 7.1"]}, {"c": "Week 7", "p": "Mrs. Rossi, 88, has mild dementia. On the second night of a hospital stay for cellulitis she becomes acutely confused and agitated. She was given an antihistamine for sleep the night before. A bladder scan shows 650 mL of retained urine. Which explanation fits best?", "o": ["Dementia progression from the hospital stay", "Delirium from a drug and urinary retention", "Late-life depression with agitation", "Dementia symptoms needing an antipsychotic"], "a": 1, "e": "B is correct. An acute change with triggers is delirium. Antihistamines (drugs) and urinary retention (pee) are both DIMESPPP precipitants, and dementia is a risk factor.\nA: Dementia progresses over months to years.\nC: Depression has an insidious onset over weeks to months.\nD: Antipsychotics are not first choice for behavioural symptoms, and a reversible cause is present.\nHigh yield: Delirium is acute, fluctuating and reversible.", "l": ["W7 8.2", "W7 8.1"]}, {"c": "Week 7", "p": "A family physician sorts four referrals for a dementia workup. None of the patients takes anticoagulants, has a cancer history or shows focal neurologic signs. Which patient meets an indication for neuroimaging?", "o": ["A 57-year-old with 14 months of memory decline", "A 76-year-old with 5 years of gradual decline", "An 80-year-old with 4 years of slow memory decline", "A 79-year-old whose MoCA fell 2 points in 2 years"], "a": 0, "e": "A is correct. Age under 60 and dementia of short duration (under 2 years) are both abnormal presentations that call for neuroimaging.\nB: Gradual 5-year decline without focal signs has no listed indication.\nC: Slow decline over 4 years at 80 is not an abnormal presentation.\nD: A small, gradual MoCA drop is not rapid decline over 1-2 months.\nHigh yield: BRAIN: bleeding risk, abnormal presentation, intracranial lesion, normal pressure hydrocephalus.", "l": ["W7 7.5"]}, {"c": "Week 7", "p": "Mrs. Patel, 81, is brought in by her daughter for 2 months of fatigue, apathy and generalized weakness. ECG shows new atrial fibrillation. She denies heat intolerance, palpitations or irritability. Which diagnosis best explains this presentation?", "o": ["Late-life depression", "Hyperthyroidism", "Rapid atrial fibrillation alone", "Acute myocardial infarction"], "a": 1, "e": "B is correct. Hyperthyroidism in older adults presents atypically with new atrial fibrillation, generalized weakness, apathy, fatigue and delirium.\nA: Depression explains apathy but not new atrial fibrillation.\nC: Rapid AF presents atypically with anorexia, fatigue and falls, but leaves the new AF unexplained.\nD: Atypical MI presents with abdominal pain, nausea, functional decline or delirium.\nHigh yield: Geriatric syndromes: weakness, falls, delirium, incontinence, functional decline, weight loss.", "l": ["W7 9.6"]}, {"c": "Week 7", "p": "Mr. Okafor, 79, lives alone. He bathes, dresses and feeds himself without help. Over the past year his daughter has taken over his grocery shopping and housework because he cannot walk far alone, and he no longer prepares meals. Which Clinical Frailty Scale score fits best?", "o": ["5, mildly frail", "4, vulnerable", "6, moderately frail", "7, severely frail"], "a": 0, "e": "A is correct. CFS 5 needs help in high order IADLs such as shopping, walking alone, meal preparation and housework. His personal care is independent.\nB: CFS 4 is not dependent on others for daily help.\nC: CFS 6 needs help with all outside activities and with bathing.\nD: CFS 7 is complete dependence for personal care.\nHigh yield: Bathing help separates CFS 6 from 5.", "l": ["W7 9.3", "W7 9.2"]}, {"c": "Week 7", "p": "Mr. Tremblay, 71, has a 20 pack-year smoking history and quit 25 years ago. He feels well. At his periodic health encounter, which screening test is indicated?", "o": ["Annual low-dose CT scan of the chest", "One-time abdominal aortic ultrasound", "Screening thyroid stimulating hormone", "Serum PSA test every 2 to 4 years"], "a": 1, "e": "B is correct. Men 65-80 get one-time ultrasound screening for abdominal aortic aneurysm.\nA: Lung screening needs 30 pack-years and quitting under 15 years ago.\nC: Thyroid screening is not recommended when asymptomatic.\nD: PSA screening is not recommended in the older adult PHE.\nHigh yield: Also due: colorectal screening to 74, Pneumovax at 65+.", "l": ["W7 2.3", "W7 2.1"]}, {"c": "Week 7", "p": "Mrs. Leblanc, 87, lives in long-term care. A urine culture sent at admission grows E. coli. She has no fever, dysuria, urgency, flank pain or change in mental status. What is the most appropriate management?", "o": ["Start ciprofloxacin to prevent urosepsis", "Start nitrofurantoin for 5 days now", "Repeat the culture and treat if positive", "No antibiotics, as she has no symptoms"], "a": 3, "e": "D is correct. Choosing Wisely advises against antimicrobials for bacteriuria in older adults unless specific urinary tract symptoms are present.\nA: No antibiotic is indicated without symptoms, whichever drug is chosen.\nB: Treatment without symptoms adds harm without benefit.\nC: A repeat positive culture still does not justify treatment without symptoms.\nHigh yield: Also avoid benzodiazepines as first choice for insomnia, agitation or delirium.", "l": ["W5 6.7"]}, {"c": "Week 8", "p": "In a lab study, an agonist's dose-response curve is recorded alone and then with Drug X added. With Drug X present, the curve shifts to the right, but raising the agonist dose still reaches the same maximal response. Which description of Drug X is correct?", "o": ["A competitive antagonist lowering agonist efficacy", "A non-competitive antagonist lowering efficacy", "A competitive antagonist lowering agonist potency", "A partial agonist raising the agonist's potency"], "a": 2, "e": "C is correct. A right shift with the same Emax means a higher EC50 (lower potency) with unchanged efficacy. That is competitive antagonism.\nA: Competitive antagonists do not change efficacy.\nB: A non-competitive antagonist lowers efficacy, which did not happen.\nD: Higher potency would shift the curve left.\nHigh yield: Competitive: potency down, efficacy same. Non-competitive: efficacy down, potency same.", "l": ["W8 O4", "W8 O6"]}, {"c": "Week 8", "p": "Sam has been on a steady high dose of Drug F, a full agonist at receptor R, with good effect. Drug P, a partial agonist at the same receptor, is then added at a dose that occupies many receptors. What happens to the overall response at receptor R?", "o": ["It falls, as P is an inverse agonist at R", "It falls, as P acts as an antagonist here", "It is unchanged, as P binds an allosteric site", "It rises, as P adds to the effect of F"], "a": 1, "e": "B is correct. A partial agonist acts as an agonist when no full agonist is present, but as an antagonist when a full agonist is present.\nA: An inverse agonist decreases the number of activated receptors, which is a different drug class.\nC: A partial agonist binds the same site as the agonist, not an allosteric one.\nD: P produces less than the full effect, so replacing F lowers the response.\nHigh yield: Your Week 8 quiz tested the same rule as a true statement.", "l": ["W8 O4"]}, {"c": "Week 8", "p": "Dr. Kaur's patient takes 100 mg of a drug every 12 hours and has reached steady state. To simplify the regimen she switches to 200 mg once every 24 hours. Which change is expected?", "o": ["Same Css, with different peak and trough levels", "Half the Css, since doses come half as often", "Same Css, with identical peak and trough levels", "Double the Css, since each dose is twice as large"], "a": 0, "e": "A is correct. The daily dose rate is unchanged at 200 mg per day. With the same daily dose rate, Css is the same, but peak and trough fluctuation differs.\nB: Fewer doses of a larger size keep the same daily dose rate.\nC: Changing the interval changes the peaks and troughs.\nD: Css depends on the daily dose rate, which did not change.\nHigh yield: Steady state takes 3-5 half-lives. Simpler regimens help adherence.", "l": ["W8 O29", "W8 O32"]}, {"c": "Week 8", "p": "Mr. Silva, 68, has taken felodipine for blood pressure for years. He is prescribed erythromycin for pneumonia. Three days later he is admitted with dizziness and a blood pressure of 82/50 mmHg. Which mechanism best explains this?", "o": ["PK interaction, with CYP3A4 induction", "Type B idiosyncratic reaction to erythromycin", "PD interaction, with additive vasodilation", "PK interaction, lower felodipine clearance"], "a": 3, "e": "D is correct. Erythromycin is a potent CYP3A4 inhibitor. It reduces felodipine clearance and raises its concentration about 2.5-fold, causing hypotension.\nA: Induction would lower felodipine levels.\nB: The effect is predictable from known enzyme inhibition.\nC: Erythromycin has no blood pressure effect of its own.\nHigh yield: Altered elimination is the most common cause of adverse drug interactions.", "l": ["W8 O46", "W8 O45"]}, {"c": "Week 8", "p": "Mr. Gill takes simvastatin each night. He drinks a large glass of grapefruit juice every morning and asks whether spacing the two by 12 hours avoids any interaction. Which counselling point is most accurate?", "o": ["No, the juice binds the statin in the gut", "No, its CYP3A4 effect lasts up to 3 days", "Yes, a 12-hour gap prevents the interaction", "Yes, grapefruit affects only warfarin"], "a": 1, "e": "B is correct. A constituent of grapefruit destroys CYP3A4, and the effect lasts up to 3 days after the last serving. Statin levels rise, with a risk of myopathy.\nA: The mechanism is enzyme destruction.\nC: The enzyme stays destroyed for days, so timing does not help.\nD: Warfarin's food interaction is with leafy green vegetables.\nHigh yield: Grapefruit also enhances the hypotensive effect of calcium channel blockers.", "l": ["W8 O51"]}, {"c": "Week 8", "p": "Two patients have reactions to medications. Patient 1 develops dry mouth on a standard dose of an antihistamine. Patient 2, who has G6PD deficiency, develops hemolytic anemia after a standard dose of primaquine. Which classification is correct, in order?", "o": ["Type A predictable, then Type B unpredictable", "Type B unpredictable, then Type A predictable", "Type B unpredictable in both patients", "Type A predictable in both patients"], "a": 0, "e": "A is correct. Dry mouth from antihistamines is a predictable pharmacological side effect (Type A). Hemolysis in G6PD deficiency after primaquine is idiosyncratic and unpredictable (Type B).\nB: This reverses the two.\nC: Dry mouth follows from the drug's known pharmacology.\nD: Hemolysis in G6PD deficiency is idiosyncratic.\nHigh yield: Unpredictable: pseudoallergic, idiosyncratic, intolerance.", "l": ["W8 O43"]}, {"c": "Week 8", "p": "A physician writes an order for 50 mg of a drug, but a misplaced decimal makes it read 500 mg. The pharmacist catches the error before any dose reaches the patient. Which term best describes this event?", "o": ["Adverse drug reaction", "Adverse drug event", "Near miss", "Preventable adverse event"], "a": 2, "e": "C is correct. A near miss is when something bad almost happened.\nA: An ADR happens with the right drug, dose and route.\nB: An ADE needs an injury.\nD: A preventable adverse event needs something bad to happen.\nHigh yield: Error, preventable adverse event and near miss are separate terms.", "l": ["W8 O41"]}, {"c": "Week 8", "p": "A 3-month-old with severe eczema has a strong corticosteroid cream applied twice daily over most of his body for 4 weeks. He develops signs of systemic steroid excess. Which pharmacokinetic factor best explains this?", "o": ["Mature CYP3A4 activity at this age", "High GFR clearing the steroid faster", "Low stomach acid raising enteral uptake", "High skin absorption and surface area per kg"], "a": 3, "e": "D is correct. Infants have increased percutaneous absorption of corticosteroids, and total body surface area per body weight is larger, so systemic exposure (mg/kg) rises.\nA: Phase I CYP activity is low at birth.\nB: GFR is low at birth and faster clearance would reduce exposure.\nC: The cream was applied to skin, so stomach acid is irrelevant.\nHigh yield: Infants: more skin absorption, low GFR, immature phase I and phase II.", "l": ["W8 O37", "W8 O39"]}, {"c": "Week 8", "p": "Mrs. Oyelaran, 77, needs penicillin for an infection. Her creatinine clearance is 32 mL/min. Which dose is most appropriate?", "o": ["The usual full dose", "Avoid penicillin altogether", "75% of the usual dose", "20 to 50% of the usual dose"], "a": 2, "e": "C is correct. Creatinine clearance predicts renal clearance of penicillin. 10-50 mL/min calls for 75% of the usual dose.\nA: The usual dose applies above 50 mL/min.\nB: Reduced renal function calls for dose adjustment.\nD: 20-50% applies below 10 mL/min.\nHigh yield: Monitor renal function routinely in older adults.", "l": ["W8 O34", "W8 O39"]}, {"c": "Week 8", "p": "A new biologic for Crohn's disease receives Health Canada approval. Before drug plans decide on listing, a federal, provincial and territorial body reviews whether it offers value for money. Which body performs this review?", "o": ["Pan-Canadian Pharmaceutical Alliance", "Patented Medicine Prices Review Board", "Therapeutic Products Directorate", "Canadian Agency for Drugs and Technologies in Health"], "a": 3, "e": "D is correct. CADTH evaluates value for money.\nA: The pCPA negotiates the price with the company.\nB: The PMPRB sets price ceilings for patented drugs.\nC: The TPD sits within Health Canada, which already approved the drug.\nHigh yield: Approval, price ceiling, value review, price negotiation, formulary listing.", "l": ["W8 O21"]}, {"c": "Week 8", "p": "Mr. Fontaine, 45, takes a standard dose of codeine after a dental extraction and becomes markedly drowsy. Genotyping shows he is a CYP2D6 ultrarapid metabolizer. Which explanation fits best?", "o": ["Rapid inactivation of codeine by CYP2D6", "Reduced renal clearance of unchanged codeine", "Failure to convert codeine to active morphine", "Excess morphine made from codeine by CYP2D6"], "a": 3, "e": "D is correct. CYP2D6 bioactivates inactive codeine into active morphine. An ultrarapid metabolizer makes more morphine than expected.\nA: CYP2D6 activates codeine. It is a prodrug.\nB: His genotype explains the effect, and nothing suggests renal impairment.\nC: Failed conversion fits a poor metabolizer or CYP2D6 inhibition, as in your Week 8 quiz, and gives no pain relief.\nHigh yield: CYP2D6 phenotypes: poor, intermediate, normal, ultrarapid. For prodrugs, induction and inhibition effects reverse.", "l": ["W8 O36", "W8 O35"]}, {"c": "Week 8", "p": "Dr. Mensah decides a 64-year-old with new hypertension needs an ACE inhibitor as standard therapy. Before prescribing, she reviews his potassium-sparing diuretic, his kidney function, his drug coverage and whether he agrees with the plan. Which WHO step is she completing?", "o": ["Step 6, monitor or stop the treatment", "Step 3b, verify the suitability of treatment", "Step 5, give information and warnings", "Step 2, specify the therapeutic objective"], "a": 1, "e": "B is correct. Step 3b checks the standard choice against this patient: other medications, organ function, cost, access and agreement. ACE inhibitor plus a potassium-sparing diuretic risks hyperkalemia.\nA: Step 6 is follow-up and stopping.\nC: Step 5 follows starting treatment.\nD: Step 2 sets the goal of care.\nHigh yield: Define problem, objective, choose and verify, start, inform, monitor or stop.", "l": ["W8 O10", "W8 O58"]}];
const OBJECTIVES = {"W5 7.1": "Define screening lab test performance parameters (e.g. accuracy, precision, predictive value, sensitivity, specificity)", "W5 7.2.1": "Describe how reference intervals are determined taking into account age, gender and population-based parameters", "W5 7.2.3": "Discuss limitations of reference intervals", "W5 7.4": "Develop an approach to investigations using a template, including consideration of test error", "W5 7.3": "Explain the impact of pre-analytical, analytical and post-analytical factors affecting the integrity of lab test results, including collection and transport and the proper pre- analytical process to reduce errors", "W5 9.3": "Explain the basic mechanisms of body fluid & blood pressure regulation", "W5 9.4": "Describe how the cardiovascular system and renal system work to maintain homeostasis", "W5 9.5": "Discuss the importance of understanding referred pain and outline the general pathway of visceral afferents", "W5 9.9": "Identify the appropriate adaptive response to cellular stress / injury", "W5 9.8": "Describe the different mechanisms of short- and long-term cellular responses to injury, potential end-organ effects and mechanisms of repair", "W5 9.12": "Contrast regeneration and repair", "W5 9.11": "Explain the difference between regeneration and repair", "W5 3.2": "Build an approach to evaluating patients for depression, anxiety and alcohol and substance use using published mental health screening templates", "W5 3.1": "Identify stressors and differentiate situational stress from a true anxiety disorder", "W5 4.1": "Understand the concepts of inequality and inequity, and the relationship between social determinants and lifetime health experiences", "W5 4.3": "Recognize the role of health system in exacerbating or mitigating health inequities, and the role of health care policy to address these barriers", "W5 6.4": "Outline the principles of a screening test", "W5 6.5": "List the common screening tests for adult age groups (20-55 years)", "W5 8.1": "Build a screening plan for an adult in the age groups (20-55 years)", "W6 4.2": "Explain terminology related to neoplasia in order to interpret investigation outcomes", "W6 6.4": "Explain how cancer staging and molecular pathology can be used to inform prognosis and treatment", "W6 7.9": "Define oncogene, proto-oncogene and tumour suppressor gene", "W6 7.7": "Match important viral/microbial carcinogens with their corresponding cancers", "W6 4.1": "Explain common pathology terminology", "W6 7.4": "Describe the basic steps of carcinogenesis from premalignant cell to invasive cancer", "W6 3.2": "Select appropriate investigations from a diagnostic toolkit using a Choosing Wisely approach", "W6 1.3": "Modify the approach to a breast mass based on age groups (20-55 years), symptoms, past & family history, prior risk factors and what risk factors and diseases are common", "W6 7.11": "Use knowledge of cancer screening programs in Canada to prepare cancer screening plans for adults with diverse risk profiles", "W6 3.6": "List examples of scenarios when clinicians and pathologists should communicate directly with one another (i.e. communication “above & beyond” the requisition, pathology report)", "W6 6.2": "Demonstrate a basic understanding of treatment approaches for cancer patients and intent (curative, adjuvant, neoadjuvant and palliative)", "W6 6.1": "Describe the basic categories of cancer therapy (chemotherapy, radiation and hormonal therapy)", "W6 9.1": "Describe ethics principles related to cancer genetic screening of family member", "W6 9.2": "Explain the ethics concepts regarding disclosure of cancer genetic results to family", "W6 7.1": "Compare & contrast Canadian versus global cancer health burden statistics", "W6 5.5": "Use a framework for breaking bad news and disclosing a diagnosis of cancer", "W7 6.4": "Develop an approach to localization of lesions in the nervous system", "W7 6.2": "Describe the basic motor, sensory and visual pathways within the nervous system", "W7 6.5": "Apply an approach to differential diagnosis of lesions within the nervous system in case scenarios", "W7 1.6": "Summarize the physiological and anatomical changes that occur in humans due to aging", "W7 1.5": "Define the terms age related changes, disease related changes and usual aging", "W7 4.2": "Score a patient’s performance on a MoCA test with reliability and accuracy applying the standardized approach", "W7 8.3": "Apply the 4-AT to screen for delirium", "W7 8.1": "Differentiate between delirium, mild cognitive impairment and dementia", "W7 7.3": "Differentiate the diagnosis of mild cognitive impairment (minor neurocognitive disorder) from dementia (major neurocognitive disorder) using the DSMV criteria", "W7 7.1": "Differentiate normal changes in memory due to aging from those due to disease", "W7 8.2": "Identify risk factors and precipitants of delirium", "W7 7.5": "Identify indications for neuroimaging in the workup of dementia", "W7 9.6": "Discuss how diseases can present in an atypical way in frail older adults", "W7 9.3": "Determine the severity of frailty, and conduct an assessment of function", "W7 9.2": "Identify frailty using a frailty screening tool", "W7 2.3": "Propose appropriate screening investigations", "W7 2.1": "Outline the components of a periodic health exam relevant to the older adult", "W5 6.7": "Apply Choosing Wisely principles to reduce inappropriate test utilization & unnecessary testing", "W8 O4": "Compare and contrast the actions of an agonist (full, partial and inverse) and antagonist (competitive and noncompetitive)", "W8 O6": "Describe potency and efficacy of drugs", "W8 O29": "Define half-life of a drug, therapeutic range, steady state concentration and loading/maintenance dose", "W8 O32": "Explain the effects of pharmacokinetics on drug dose regimen", "W8 O46": "Describe potential outcomes of pharmacokinetic and pharmacodynamic drug interactions, including both harmful and beneficial effects.", "W8 O45": "Explain the pharmacological basis of adverse drug reactions, including pharmacokinetic and pharmacodynamic mechanisms.", "W8 O51": "Summarize key instructions, information and warning that should be communicated to patients in order to promote a safe and effective use of medications", "W8 O43": "Differentiate between Type A and Type B adverse drug reactions and provide clinical examples of each.", "W8 O41": "Define commonly used patient safety incident terms such as adverse drug event, adverse drug reaction, and side effect.", "W8 O37": "Compare the pharmacokinetics and pharmacodynamics changes across the lifespan", "W8 O39": "Identify factors that affect therapeutics in different populations", "W8 O34": "Apply basic principles of pharmacokinetics and pharmacodynamics to clinical scenarios", "W8 O21": "Summarize the process and regulatory control of drug development and funding", "W8 O36": "Provide examples of how human genetic variation(s) can affect the efficacy and safety of drugs", "W8 O35": "Explain the human genetic variation in the context of variable drug response", "W8 O10": "Outline the 6-steps of the World Health Organization’s framework to rational prescribing", "W8 O58": "Propose approaches to the therapeutic goal with consideration of the suitability to the individual patient with respect to access, efficacy and safety"};
const L = "ABCDE";
const N = QUESTIONS.length;
let cur = 0, showResults = false;
let ans = new Array(N).fill(null);           // current pick per question
let tries = QUESTIONS.map(()=>[]);           // every locked attempt: {pick, ok, at}
let strikes = QUESTIONS.map(()=>[]);         // struck option indexes for the open attempt
let history = [], db = null, uid = null, writing = false, dirty = false;
const LS_KEY = "quiz-progress-v2";
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");

function score(){ return ans.reduce((n,a,i)=>n+(a!==null&&a===QUESTIONS[i].a?1:0),0); }
function answered(){ return ans.filter(a=>a!==null).length; }
function firstTryScore(){ return tries.reduce((n,t)=>n+(t.length&&t[0].ok?1:0),0); }
function firstTryCount(){ return tries.filter(t=>t.length).length; }

function renderHeader(){
  $("#stats").innerHTML = `<span>Item <b>${showResults?"–":cur+1}</b> of <b>${N}</b></span><span>Answered <b>${answered()}</b></span><span>Score <b>${score()} / ${answered()}</b></span>`;
  $("#ticks").innerHTML = QUESTIONS.map((q,i)=>{
    const st = ans[i]===null?"":(ans[i]===q.a?"ok":"bad");
    const redo = tries[i].length>1 || (ans[i]===null && tries[i].length>0);
    return `<button class="tick ${st} ${redo?"redo":""} ${(!showResults&&i===cur)?"cur":""}" data-i="${i}" aria-label="Question ${i+1}"></button>`;
  }).join("");
  document.querySelectorAll(".tick").forEach(b=>b.onclick=()=>{cur=+b.dataset.i;showResults=false;render();});
}

function triesLine(i, includeCurrent){
  const t = includeCurrent ? tries[i] : tries[i];
  if(!t.length) return "";
  const parts = t.map((x,k)=>`<span class="${x.ok?"ok":"bad"}">${k+1}: ${L[x.pick]} ${x.ok?"correct":"wrong"}</span>`).join(" · ");
  return `<div class="tries">Attempts ${parts}</div>`;
}

function renderQ(){
  const q = QUESTIONS[cur], a = ans[cur], done = a!==null, st = strikes[cur];
  const opts = q.o.map((o,i)=>{
    let c = "";
    if(done){ if(i===q.a) c="right"; else if(i===a) c="wrong"; }
    const struck = !done && st.includes(i);
    const strikeBtn = done ? "" : `<button class="strike" data-s="${i}" aria-pressed="${struck}" aria-label="${struck?"Restore":"Strike out"} option ${L[i]}" title="${struck?"Restore":"Strike out"} option">${struck?"↺":"✕"}</button>`;
    return `<div class="optrow ${struck?"struck":""}"><button class="opt ${c}" data-i="${i}" ${done?"disabled":""}><span class="k">${L[i]}</span><span>${esc(o)}</span></button>${strikeBtn}</div>`;
  }).join("");
  let fb = "";
  if(done){
    const ok = a===q.a;
    const lines = q.e.split("\n").map(t=>`<p>${esc(t)}</p>`).join("");
    const objs = q.l.map(id=>`<div class="obj">Objective: ${esc(id)}. ${esc(OBJECTIVES[id]||"")}</div>`).join("");
    fb = `<div class="fb" role="status"><div class="verdict ${ok?"ok":"bad"}">${ok?"Correct.":"Incorrect. The answer is "+L[q.a]+"."}</div>${lines}${objs}${triesLine(cur)}<div class="fbtools"><button class="btn ghost" id="redo">Reset and redo this question</button></div></div>`;
  }
  const pre = (!done && tries[cur].length) ? `<div class="hint">Redo. Your earlier attempts are saved.</div>${triesLine(cur)}` : (!done ? `<div class="hint">Tap ✕ to strike out an option. Right-click works too.</div>` : "");
  const last = cur===N-1;
  $("#main").innerHTML = `<article class="card">
    <div class="chead"><span class="tag">${esc(q.c)}</span><span>Q${cur+1}</span></div>
    <p class="stem">${esc(q.p)}</p>
    ${pre}
    <div class="opts">${opts}</div>${fb}
    <div class="nav"><button class="btn ghost" id="prev" ${cur===0?"disabled":""}>Previous</button>
    <button class="btn" id="next" ${done?"":"disabled"}>${last?"See results":"Next"}</button></div>
  </article>`;
  document.querySelectorAll(".opt").forEach(b=>{
    b.onclick=()=>{ const p=+b.dataset.i; ans[cur]=p; tries[cur].push({pick:p, ok:p===q.a, at:new Date().toISOString()}); tries[cur]=tries[cur].slice(-10); strikes[cur]=[]; render(false); persist(); };
    b.oncontextmenu=(e)=>{ if(done) return; e.preventDefault(); toggleStrike(+b.dataset.i); };
  });
  document.querySelectorAll(".strike").forEach(b=>b.onclick=()=>toggleStrike(+b.dataset.s));
  const r=$("#redo"); if(r) r.onclick=()=>{ ans[cur]=null; strikes[cur]=[]; render(false); persist(); };
  $("#prev").onclick=()=>{cur--;render();};
  $("#next").onclick=()=>{ if(last){showResults=true;} else cur++; render(); };
}

function toggleStrike(i){
  const s = strikes[cur], k = s.indexOf(i);
  if(k<0) s.push(i); else s.splice(k,1);
  render(false); persist();
}

function renderResults(){
  const s = score(), pct = Math.round(100*s/N);
  const cats = {};
  QUESTIONS.forEach((q,i)=>{ cats[q.c]=cats[q.c]||[0,0]; cats[q.c][1]++; if(ans[i]===q.a) cats[q.c][0]++; });
  const rows = Object.entries(cats).map(([c,[r,t]])=>`<tr><td>${esc(c)}</td><td>${r} / ${t}</td></tr>`).join("");
  const missed = {};
  QUESTIONS.forEach((q,i)=>{ const wrongFirst = tries[i].length && !tries[i][0].ok; if(ans[i]!==q.a || wrongFirst) q.l.forEach(id=>{ const w=id.split(" ")[0]; missed[w]=missed[w]||new Set(); missed[w].add(id); }); });
  const weeks = Object.keys(missed).sort((x,y)=>parseInt(x.slice(1))-parseInt(y.slice(1)));
  const missHtml = weeks.length ? weeks.map(w=>`<h3>Week ${w.slice(1)}</h3><ul class="miss">${[...missed[w]].map(id=>`<li><code>${esc(id)}</code>${esc(OBJECTIVES[id]||"")}</li>`).join("")}</ul>`).join("") : "<p>No missed objectives.</p>";
  const redone = tries.filter(t=>t.length>1).length;
  const un = N - answered();
  $("#main").innerHTML = `<article class="card">
    <div class="chead"><span class="tag">Results</span><span>${un?un+" unanswered":"Complete"}</span></div>
    <div><div class="big">${s} / ${N}</div><div class="stats"><span><b>${pct}%</b> correct now</span><span>First try <b>${firstTryScore()} / ${firstTryCount()}</b></span><span>Redone <b>${redone}</b></span></div></div>
    <table><thead><tr><th>Category</th><th>Score</th></tr></thead><tbody>${rows}</tbody></table>
    <h2>Objectives to review</h2><p class="hint">Includes questions you missed on the first try, even if a redo got them right.</p>${missHtml}${history.length?`<h2>Past attempts</h2><table><thead><tr><th>Date</th><th>Score</th></tr></thead><tbody>${history.slice().reverse().map(h=>`<tr><td>${new Date(h.date).toLocaleDateString()}</td><td>${h.score} / ${h.total}</td></tr>`).join("")}</tbody></table>`:""}
    <div class="nav"><button class="btn ghost" id="back">Back to questions</button><button class="btn" id="restart">Restart all</button></div>
  </article>`;
  $("#back").onclick=()=>{showResults=false;render();};
  $("#restart").onclick=()=>{
    if(answered() || tries.some(t=>t.length)){
      history.push({date:new Date().toISOString(), score:score(), answered:answered(), total:N, firstTry:firstTryScore(),
        missed:QUESTIONS.map((q,i)=>ans[i]!==null&&ans[i]!==q.a?"q"+(i+1):null).filter(Boolean)});
      history=history.slice(-20);
    }
    ans.fill(null); tries=QUESTIONS.map(()=>[]); strikes=QUESTIONS.map(()=>[]); cur=0; showResults=false; render(); persist();
  };
}

function setSave(text, cls){ const el=$("#save"); if(el){ el.textContent=text; el.className="save "+(cls||""); } }
function bodyOf(){
  const a = {};
  QUESTIONS.forEach((q,i)=>{
    if(ans[i]===null && !tries[i].length && !strikes[i].length) return;
    a["q"+(i+1)] = {pick:ans[i], ok:ans[i]!==null && ans[i]===q.a, l:q.l, tries:tries[i], strikes:strikes[i]};
  });
  return {answers:a, history, total:N, answered:answered(), score:score(), firstTry:firstTryScore(), updatedAt:new Date().toISOString()};
}
function validPick(i,p){ return Number.isInteger(p) && p>=0 && p<QUESTIONS[i].o.length; }
function applySaved(d){
  if(!d || typeof d!=="object") return;
  ans.fill(null); tries=QUESTIONS.map(()=>[]); strikes=QUESTIONS.map(()=>[]);
  const a = d.answers || {};
  for(const k in a){
    const i = parseInt(k.slice(1),10)-1, row = a[k];
    if(!(i>=0 && i<N) || !row || typeof row!=="object") continue;
    if(validPick(i,row.pick)) ans[i]=row.pick;
    if(Array.isArray(row.tries)) tries[i]=row.tries.filter(t=>t&&validPick(i,t.pick)).map(t=>({pick:t.pick, ok:t.pick===QUESTIONS[i].a, at:String(t.at||"")})).slice(-10);
    else if(ans[i]!==null) tries[i]=[{pick:ans[i], ok:ans[i]===QUESTIONS[i].a, at:""}];
    if(Array.isArray(row.strikes)) strikes[i]=row.strikes.filter(x=>validPick(i,x));
  }
  history = Array.isArray(d.history) ? d.history.slice(-20) : [];
  const first = ans.findIndex(x=>x===null); cur = first<0 ? N-1 : first;
}
function lsLoad(){ try{ return JSON.parse(localStorage.getItem(LS_KEY)||"null"); }catch(e){ return null; } }
function lsSave(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(bodyOf())); }catch(e){} }
async function persist(){
  lsSave();
  if(!db || !uid) return;
  dirty = true; if(writing) return; writing = true;
  while(dirty){
    dirty = false;
    setSave("Saving…");
    try{ await db.doc("attempts/"+uid).set(bodyOf()); setSave("Progress saved to your account.","ok"); }
    catch(e){
      if(e && e.code==="invalid_argument"){ db=null; setSave("Progress saves in this browser only.","bad"); break; }
      setSave("Could not save to your account. Progress saves in this browser.","bad");
    }
  }
  writing = false;
}
async function connect(){
  try{
    if(!window.claude || !window.claude.use) return;
    const [u, d] = await Promise.all([window.claude.use("user"), window.claude.use("db")]);
    if(!u || !d) return;
    const id = await u.id(); if(!id) return;
    db = d; uid = id;
    const snap = await db.doc("attempts/"+uid).get();
    if(snap.exists){ applySaved(snap.data()); render(); setSave("Progress saved to your account.","ok"); }
    else if(answered() || tries.some(t=>t.length)){ persist(); }
    else setSave("Progress saves to your account.","ok");
  }catch(e){ /* keep local-only mode */ }
}

function render(top=true){ renderHeader(); showResults?renderResults():renderQ(); if(top) window.scrollTo({top:0}); }
applySaved(lsLoad());
render();
connect();
</script>
