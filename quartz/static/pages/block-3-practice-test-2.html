<style>
/* Nexus quiz page. Matches the site: neutral greys, one typeface, and the block's colour as --accent. */
:root{
  --bg:#f5f6f8;--paper:#ffffff;--ink:#15181d;--muted:#4d5560;--faint:#7b828d;--line:#e0e3e8;
  --accent:#0b7a75;--soft:#eef0f3;
  --ok:#1d7a46;--okw:#e7f4ec;--bad:#b42318;--badw:#fcecea;--tick:#dfe2e7;
  --display:"Atkinson Hyperlegible Next","Segoe UI",system-ui,-apple-system,sans-serif;
  --body:"Atkinson Hyperlegible Next","Segoe UI",system-ui,-apple-system,sans-serif;
  --r:8px;
}
:root[data-b="2"]{--accent:#4f46c8}:root[data-b="3"]{--accent:#a3246b}:root[data-b="4"]{--accent:#a35f08}
:root[data-theme="dark"]{
  --bg:#14161a;--paper:#1b1e24;--ink:#eceef2;--muted:#b3bac5;--faint:#8a919c;--line:#2d323b;
  --accent:#45c2b8;--soft:#252930;
  --ok:#5ccf8f;--okw:#13301f;--bad:#f2877c;--badw:#3a1c1a;--tick:#30353e;color-scheme:dark}
:root[data-theme="dark"][data-b="2"]{--accent:#a49df6}:root[data-theme="dark"][data-b="3"]{--accent:#ef8ec0}:root[data-theme="dark"][data-b="4"]{--accent:#e3a548}
.btn:hover:not(:disabled){filter:brightness(.92)}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55}
.wrap{max-width:820px;margin:0 auto;padding-block:28px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:20px}

/* Header */
header{display:flex;flex-direction:column;gap:10px}
.context{margin:0;color:var(--faint);font-size:14px;font-weight:600}
h1{font-family:var(--display);font-weight:700;font-size:clamp(28px,5vw,40px);line-height:1.05;letter-spacing:-.02em;margin:0;text-wrap:balance}
.stats{display:flex;flex-wrap:wrap;gap:6px 22px;font-size:15px;color:var(--muted);font-variant-numeric:tabular-nums}
.stats b{color:var(--ink);font-weight:700}
.bar{height:6px;border-radius:999px;background:var(--tick);overflow:hidden}
.bar span{display:block;height:100%;width:0;background:var(--accent);border-radius:999px;transition:width .25s ease}
.map summary{cursor:pointer;color:var(--accent);font-weight:600;font-size:14px;width:max-content;list-style:none;padding:2px 0}
.map summary::-webkit-details-marker{display:none}
.map summary::before{content:"▸";display:inline-block;margin-right:6px;transition:transform .15s ease}
.map[open] summary::before{transform:rotate(90deg)}
.map summary:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:4px}
.ticks{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}
.tick{width:14px;height:14px;border:0;border-radius:4px;background:var(--tick);padding:0;cursor:pointer}
.tick:hover{background:var(--faint)}
.tick.ok{background:var(--ok)}.tick.bad{background:var(--bad)}
.tick.cur{outline:2px solid var(--accent);outline-offset:2px}
.tick.redo{box-shadow:inset 0 -3px 0 var(--accent)}
.tick:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.saverow{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.save{font-size:13px;color:var(--faint)}
.resetbtn{font:inherit;font-size:13px;font-weight:700;color:var(--muted);background:none;border:1px solid var(--line);border-radius:6px;padding:3px 10px;cursor:pointer}
.resetbtn:hover{color:var(--bad);border-color:var(--bad)}
.resetbtn.armed{color:#fff;background:var(--bad);border-color:var(--bad)}
.resetbtn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.save.ok{color:var(--ok)}.save.bad{color:var(--bad)}

/* Question card */
.card{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:26px;display:flex;flex-direction:column;gap:18px}
.chead{display:flex;justify-content:space-between;align-items:center;gap:10px}
.tag{font-size:13px;font-weight:700;color:var(--accent);background:var(--soft);padding:3px 9px;border-radius:4px}
.chead-r{display:flex;align-items:center;gap:12px}
.ankibtn{font:inherit;font-size:13.5px;font-weight:700;color:var(--muted);background:transparent;border:1.5px solid var(--line);border-radius:6px;padding:4px 10px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.ankibtn::before{content:"";width:9px;height:11px;background:currentColor;clip-path:polygon(0 0,100% 30%,0 60%);border-left:2px solid currentColor;box-sizing:content-box}
.ankibtn:hover{border-color:var(--accent);color:var(--accent)}
.ankibtn[aria-pressed="true"]{border-color:var(--accent);background:var(--soft);color:var(--accent)}
.ankibtn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ankirow{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.qn{font-family:var(--display);font-weight:700;font-size:15px;color:var(--faint);font-variant-numeric:tabular-nums}
.stem{font-size:18.5px;line-height:1.6;margin:0;white-space:pre-line;max-width:70ch}
.hint{font-size:13px;color:var(--faint)}
.tries{font-size:13px;color:var(--muted)}
.tries .bad{color:var(--bad);font-weight:600}.tries .ok{color:var(--ok);font-weight:600}

/* Options */
.opts{display:flex;flex-direction:column;gap:10px}
.optrow{display:flex;gap:8px;align-items:stretch}
.optrow .opt{flex:1;min-width:0}
.opt{display:flex;gap:14px;align-items:center;text-align:left;width:100%;background:var(--paper);color:var(--ink);border:1.5px solid var(--line);border-radius:var(--r);padding:12px 16px;font:inherit;font-size:16.5px;line-height:1.45;cursor:pointer;transition:border-color .12s ease,background .12s ease}
.opt:hover:not(:disabled){border-color:var(--accent);background:var(--soft)}
.opt:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.opt:disabled{cursor:default}
.opt .k{flex:none;display:inline-grid;place-items:center;width:30px;height:30px;border-radius:6px;background:var(--soft);color:var(--accent);font-family:var(--display);font-weight:700;font-size:14px}
.opt.right{border-color:var(--ok);background:var(--okw)}
.opt.right .k{background:var(--ok);color:var(--paper)}
.opt.wrong{border-color:var(--bad);background:var(--badw)}
.opt.wrong .k{background:var(--bad);color:var(--paper)}
.strike{flex:none;width:44px;border:1.5px solid var(--line);border-radius:var(--r);background:var(--paper);color:var(--faint);font-size:14px;cursor:pointer;display:grid;place-items:center}
.strike:hover{border-color:var(--accent);color:var(--accent)}
.strike:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.strike[aria-pressed="true"]{background:var(--soft);color:var(--ink)}
.optrow.struck .opt > span:last-child{text-decoration:line-through;color:var(--faint)}
.optrow.struck .opt .k{opacity:.45}

/* Feedback */
.fb{background:var(--bg);border-radius:var(--r);padding:18px 20px;display:flex;flex-direction:column;gap:10px}
.verdict{font-family:var(--display);font-weight:700;font-size:18px;display:flex;align-items:center;gap:8px}
.verdict::before{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;font-size:13px;color:var(--paper)}
.verdict.ok{color:var(--ok)}.verdict.ok::before{content:"✓";background:var(--ok)}
.verdict.bad{color:var(--bad)}.verdict.bad::before{content:"✕";background:var(--bad)}
.fb p{margin:0;max-width:72ch}
.fb .why,.fb .alt{display:flex;gap:10px;align-items:baseline}
.fb .why{font-weight:600}
.lk{flex:none;display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--line);color:var(--muted);font-family:var(--display);font-weight:700;font-size:12px;transform:translateY(-1px)}
.lk.ok{background:var(--ok);color:var(--paper)}
.fb .alt{color:var(--muted)}
.fb .take{border-left:3px solid var(--accent);padding:2px 0 2px 12px;color:var(--ink)}
.fb .take b{color:var(--accent)}
.obj{font-size:13.5px;color:var(--faint);line-height:1.5}
.obj b{color:var(--muted)}
.fbtools{display:flex;justify-content:flex-end}
.offrow{display:flex;justify-content:flex-start}
.offbtn{font:inherit;font-size:13.5px;color:var(--faint);background:none;border:0;padding:2px 0;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.offbtn:hover{color:var(--bad)}
.offbtn[aria-pressed="true"]{color:var(--bad);font-weight:700}
.offbtn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* Buttons */
.nav{display:flex;justify-content:space-between;gap:10px}
.btn{font-family:var(--display);font-weight:700;font-size:15px;padding:10px 20px;border:1.5px solid var(--accent);border-radius:6px;background:var(--accent);color:var(--paper);cursor:pointer}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.ghost:hover:not(:disabled){background:var(--soft);color:var(--accent);border-color:var(--accent)}
.btn:disabled{opacity:.35;cursor:default}
.btn:focus-visible{outline:2px solid var(--ink);outline-offset:3px}

/* Results */
.big{font-family:var(--display);font-size:clamp(48px,9vw,72px);font-weight:700;line-height:1;letter-spacing:-.03em;color:var(--accent);font-variant-numeric:tabular-nums}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
td,th{text-align:left;padding:9px 0;border-bottom:1px solid var(--line);font-size:15px;vertical-align:middle}
th{font-size:13px;font-weight:700;color:var(--faint)}
td:last-child,th:last-child{text-align:right;white-space:nowrap;padding-left:12px}
.meter{display:block;height:5px;border-radius:999px;background:var(--tick);margin-top:6px;max-width:320px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent);border-radius:999px}
h2{font-family:var(--display);font-size:21px;font-weight:700;margin:6px 0 0}
h3{font-size:14px;font-weight:700;color:var(--faint);margin:6px 0 0}
.miss{margin:0;padding-left:0;list-style:none;display:flex;flex-direction:column;gap:8px;font-size:15px}
.miss code{font-family:var(--display);font-weight:700;font-size:13px;color:var(--bad);background:var(--badw);padding:1px 7px;border-radius:999px;margin-right:8px}

@media (max-width:560px){.card{padding:18px}.stem{font-size:17.5px}.opt{padding:11px 12px;gap:10px}.strike{width:40px}}
@media (prefers-reduced-motion:no-preference){.fb{animation:in .2s ease-out}@keyframes in{from{opacity:.3;transform:translateY(4px)}to{opacity:1;transform:none}}}
@media (prefers-reduced-motion:reduce){.bar span,.opt,.map summary::before{transition:none}}
</style>

<script>
const QUESTIONS = [{"c": "Week 9", "p": "Liam, 2, is brought in because he looks pale and tires quickly while playing. He has been growing normally. He has no bruising, no infections and no jaundice. On exam he is pale, with no enlarged nodes, liver or spleen.\n\nHb 62 g/L (ref 110-140)\nMCV 88 fL (ref 80-100)\nReticulocytes very low\nWBC 7.5 × 10⁹/L (ref 4-10)\nPlatelets 290 × 10⁹/L (ref 150-450)\nFilm: normochromic red cells. No blasts.\n\nWhat is the most likely diagnosis?", "o": ["Pure red cell aplasia (Diamond Blackfan anemia)", "Myelophthisis", "Aplastic anemia", "Hereditary spherocytosis", "Acute lymphoblastic leukemia"], "a": 0, "e": "Correct: A. Only the red cell line is low, with severe reticulocytopenia, normochromic cells and no splenomegaly. That fits pure red cell aplasia, and Diamond Blackfan anemia is a listed cause in young children.\nB: Myelophthisis gives a leukoerythroblastic film with teardrop cells.\nC: Aplastic anemia causes pancytopenia.\nD: Hereditary spherocytosis has a high reticulocyte count and spherocytes.\nE: ALL lowers other cell lines and shows blasts.\nTakeaway: Low retics mean low production. High retics mean loss or destruction.", "l": ["W9 3.4", "W9 3.1"]}, {"c": "Week 11", "p": "Iris, 34, started an antithyroid drug 6 weeks ago. She now has a sore throat and an ANC of 0.4 × 10⁹/L. Her Hb and platelets are normal. How is her neutropenia best classified?", "o": ["Severe congenital neutropenia", "Moderate neutropenia from low B12", "Mild neutropenia from a virus", "Severe neutropenia from a drug"], "a": 3, "e": "Correct: D. An ANC below 0.5 is severe. Antithyroid drugs are listed toxins that cause acquired neutropenia.\nA: Her neutropenia began after a new drug, which points to an acquired cause.\nB: Moderate is 0.5 to 0.99, and nothing points to B12 deficiency.\nC: Mild is 1 to 1.5, and her ANC is 0.4.\nTakeaway: Neutropenia: ANC below 1.5. Severe below 0.5.", "l": ["W11 2.2", "W11 2.1"]}, {"c": "Week 11", "p": "Jenna, 19, has 1 week of sore throat, fever, fatigue and swollen, tender neck nodes. She has no night sweats or weight loss. On exam she has large tonsils and a tender spleen tip.\n\nHb 134 g/L (ref 115-160)\nWBC 14.5 × 10⁹/L (ref 4-10)\nLymphocytes high\nPlatelets 168 × 10⁹/L (ref 150-450)\nFilm: atypical lymphocytes surrounding the red cells. No smudge cells, no blasts.\n\nWhat is the most likely diagnosis?", "o": ["Bacterial tonsillitis with neutrophilia", "Chronic lymphocytic leukemia", "Hodgkin lymphoma", "Acute lymphoblastic leukemia", "Infectious mononucleosis from EBV"], "a": 4, "e": "Correct: E. A young adult with sore throat, fever, tender nodes, a tender spleen and atypical lymphocytes surrounding red cells has EBV mononucleosis. Confirm with a Monospot test.\nA: A bacterial infection raises neutrophils, not lymphocytes.\nB: CLL affects older adults and shows smudge cells.\nC: Hodgkin lymphoma does not cause atypical lymphocytes in the blood.\nD: ALL shows blasts.\nTakeaway: Do flow cytometry only if the lymphocytosis lasts more than 4 to 6 weeks.", "l": ["W11 1.5", "W11 1.1"]}, {"c": "Week 10", "p": "Which anticoagulant works by inhibiting vitamin K epoxide reductase (VKORC1)?", "o": ["Dabigatran", "Warfarin", "Fondaparinux", "Argatroban", "Rivaroxaban"], "a": 1, "e": "Correct: B. Warfarin inhibits vitamin K epoxide reductase (VKORC1), which lowers the vitamin K dependent factors.\nA: Dabigatran targets the active site of thrombin.\nC: Fondaparinux is a synthetic pentasaccharide that works through antithrombin.\nD: Argatroban targets the active site of thrombin.\nE: Rivaroxaban is a direct Xa inhibitor.\nTakeaway: Indirect drugs need antithrombin. Direct drugs do not.", "l": ["W10 7.1"]}, {"c": "Week 11", "p": "Harold, 66, has had burning pain and redness in his toes and two episodes of brief vision loss in one eye. He has no heavy periods or bleeding, no infections, no inflammatory disease and no cancer history. On exam his spleen is not palpable.\n\nHb 142 g/L (ref 135-170)\nWBC 8.4 × 10⁹/L (ref 4-10)\nPlatelets 980 × 10⁹/L (ref 150-450)\nFerritin normal\nCRP normal\nJAK2 V617F positive\nMarrow biopsy: increased enlarged, mature megakaryocytes with hyperlobulated nuclei.\n\nWhat is the most likely diagnosis?", "o": ["Reactive thrombocytosis", "Chronic myeloid leukemia", "Essential thrombocythemia", "Polycythemia vera", "Myelodysplastic syndrome"], "a": 2, "e": "Correct: C. A platelet count of 450 or more, erythromelalgia and ocular migraines, a megakaryocyte-rich marrow, JAK2 positivity and no reactive cause fit essential thrombocythemia.\nA: A reactive cause is ruled out by normal iron, CRP and history.\nB: CML gives a high WBC with basophilia.\nD: PV needs erythrocytosis, and his Hb is normal.\nE: MDS gives cytopenias and dysplasia.\nTakeaway: ET carries a risk of both thrombosis and bleeding.", "l": ["W11 6.2", "W11 6.3"]}, {"c": "Week 10", "p": "Hugh, 58, develops a DVT 2 weeks after hip replacement surgery. He has no cancer and no prior clots. What is the minimum length of anticoagulation?", "o": ["6 months", "3 months", "Lifelong", "7-10 days"], "a": 1, "e": "Correct: B. A major transient risk factor such as surgery needs a minimum of 3 months.\nA: A minimum of 6 months is for clots linked to cancer.\nC: Staying on long term applies to idiopathic clots in men.\nD: 7 to 10 days is the minimum length of prophylaxis after surgery.\nTakeaway: Duration follows the cause: cancer 6 months, transient risk 3 months, idiopathic often long term.", "l": ["W10 6.4"]}, {"c": "Week 10", "p": "Grace, 41, is brought in by her husband because she has been confused and had a seizure at home. She has had a headache for 2 days and noticed bruises on her arms. She has no diarrhea and takes no drugs. She has a fever of 38.4°C.\n\nHb 74 g/L (ref 115-160)\nReticulocytes high\nWBC 9.0 × 10⁹/L (ref 4-10)\nPlatelets 9 × 10⁹/L (ref 150-450)\nPT/INR normal\nFibrinogen normal\nLDH high\nCreatinine mildly high\nADAMTS-13 low\nFilm: many schistocytes.\n\nWhat is the most likely diagnosis?", "o": ["Hemolytic-uremic syndrome", "Immune thrombocytopenia", "Heparin-induced thrombocytopenia", "Disseminated intravascular coagulation", "Thrombotic thrombocytopenic purpura"], "a": 4, "e": "Correct: E. A very sick patient with neurological signs, severe thrombocytopenia, hemolytic anemia with schistocytes, normal clotting tests and a low ADAMTS-13 has TTP. Without ADAMTS-13, ultra-large vWF multimers build up and cause clotting.\nA: HUS follows a diarrheal illness and mainly injures the kidneys, with a normal ADAMTS-13.\nB: ITP has no hemolysis or schistocytes.\nC: HIT needs heparin exposure and causes thrombosis.\nD: DIC prolongs the INR and lowers fibrinogen.\nTakeaway: TTP: plasma exchange, steroids and rituximab. Avoid platelet transfusions.", "l": ["W10 3.4", "W10 3.5"]}, {"c": "Week 9", "p": "Mai, 28, of Vietnamese descent, has felt tired for years and was told she had a mild anemia as a child. She has had yellow eyes during infections. Her periods are normal. On exam she is pale with mild jaundice and a palpable spleen.\n\nHb 84 g/L (ref 115-160)\nMCV 64 fL (ref 80-100)\nRBC count high\nReticulocytes high\nPlatelets 230 × 10⁹/L (ref 150-450)\nFerritin normal\nHbA2 normal\nHbH inclusion body test positive\nFilm: hypochromic microcytes, target cells and evidence of hemolysis.\n\nWhat is the most likely diagnosis?", "o": ["Hereditary spherocytosis", "Iron deficiency anemia", "α-thalassemia trait", "HbH disease", "β-thalassemia minor"], "a": 3, "e": "Correct: D. A Southeast Asian woman with a microcytic hemolytic anemia, splenomegaly, a normal HbA2 and a positive HbH inclusion body test has HbH disease, a form of α-thalassemia.\nA: Hereditary spherocytosis is not microcytic.\nB: Iron deficiency has a low ferritin.\nC: α-thalassemia trait gives only a mild anemia, without hemolysis or splenomegaly.\nE: β-thalassemia minor raises HbA2 and is common in Mediterraneans.\nTakeaway: α-thalassemia: silent carrier, trait, HbH disease, hydrops fetalis.", "l": ["W9 2.2", "W9 2.1"]}, {"c": "Week 12", "p": "A patient needs radiation for lymphoma in the neck. The team wants to spare the uninvolved salivary glands from high doses. Which technique is designed for this?", "o": ["High dose rate brachytherapy implants", "Low dose rate brachytherapy implants", "Intensity modulated radiation (IMRT)", "Stereotactic ablative radiation (SABR)"], "a": 2, "e": "Correct: C. IMRT maximizes the therapeutic ratio by sparing normal uninvolved tissues from high doses. Targeted radiation has improved the ability to spare the major salivary glands.\nA: High dose rate implants are also brachytherapy.\nB: Brachytherapy places radioactive isotopes near gynecologic and GU tumours.\nD: SABR gives extremely high doses in 1 to 5 highly focused treatments.\nTakeaway: Every tissue has a dose limit. Spinal cord, bowel, kidney and lungs often limit treatment.", "l": ["W12 12.2", "W12 12.1"]}, {"c": "Week 11", "p": "Victor, 62, has 2 weeks of fatigue, fevers, bone pain over his sternum and swollen gums. On exam he is pale with petechiae, gum infiltration and a mildly enlarged liver and spleen.\n\nHb 78 g/L (ref 135-170)\nWBC 64 × 10⁹/L (ref 4-10)\nPlatelets 28 × 10⁹/L (ref 150-450)\nLDH high\nUric acid high\nFilm: many large blast cells, some with a single Auer rod.\n\nWhat is the most likely diagnosis?", "o": ["Acute myeloid leukemia", "Chronic lymphocytic leukemia", "Chronic myeloid leukemia", "Acute lymphoblastic leukemia", "Reactive neutrophilia"], "a": 0, "e": "Correct: A. An older adult with marrow failure, sternal tenderness, gum infiltration and large blasts with an Auer rod has AML, 80% of acute adult leukemias.\nB: CLL raises mature lymphocytes, with smudge cells.\nC: CML shows mature myeloid cells with basophilia, not blasts.\nD: ALL blasts have no granules or Auer rods, and ALL is mostly a childhood leukemia.\nE: A reactive neutrophilia shows mature cells and no blasts.\nTakeaway: AML: 7+3 induction over 4 to 6 months.", "l": ["W11 4.1", "W11 4.2"]}, {"c": "Week 9", "p": "Which causes of hemolysis are intravascular?\ni) A mechanical heart valve with a paravalvular leak\nii) Paroxysmal nocturnal hemoglobinuria\niii) Hereditary spherocytosis\niv) Warm autoimmune hemolytic anemia", "o": ["iii) and iv) only", "i), ii) and iii) only", "i) and ii) only", "All of the above"], "a": 2, "e": "Correct: C. Mechanical valves cause intravascular hemolysis from high shear stress, and PNH is also intravascular.\nA: Both are extravascular.\nB: Hereditary spherocytosis is extravascular.\nD: Statements iii) and iv) are extravascular.\nTakeaway: Mechanical valve hemolysis shows schistocytes.", "l": ["W9 6.1", "W9 6.4"]}, {"c": "Week 11", "p": "Which statement about trial design and statistics is correct?", "o": ["Type II error is the false positive rate", "A one-sided test needs a smaller sample size", "A two-sided test assumes one direction of effect", "Power equals the type I error rate"], "a": 1, "e": "Correct: B. A one-sided test is used when a difference is suspected in one direction only, and it needs a smaller sample size.\nA: Type II error is the false negative rate.\nC: A two-sided test is used when the direction of the difference is unknown.\nD: Power is 1 minus beta, the type II error rate.\nTakeaway: Type I is a false positive. Type II is a false negative.", "l": ["W11 11.2"]}, {"c": "Week 10", "p": "Oliver, 9, has mild hemophilia A and needs a dental extraction. Which plan best prevents bleeding?", "o": ["Platelet transfusion before the procedure", "Vitamin K the night before", "Cryoprecipitate to raise fibrinogen", "DDAVP with tranexamic acid"], "a": 3, "e": "Correct: D. DDAVP raises FVIII in mild hemophilia A, and tranexamic acid treats mucosal bleeding. Care is coordinated with the hemophilia centre.\nA: Platelets treat platelet disorders and thrombocytopenia.\nB: Vitamin K reverses warfarin.\nC: Cryoprecipitate replaces fibrinogen.\nTakeaway: Severe hemophilia needs factor replacement. Mild can use DDAVP.", "l": ["W10 5.4"]}, {"c": "Week 9", "p": "Which are causes of non-megaloblastic macrocytosis?\ni) Liver disease\nii) Hypothyroidism\niii) Reticulocytosis\niv) Vitamin B12 deficiency", "o": ["i), ii) and iii) only", "i) and ii) only", "ii), iii) and iv) only", "All of the above"], "a": 0, "e": "Correct: A. Liver disease, reticulocytosis, pseudo-macrocytosis and hypothyroidism are the non-megaloblastic causes of macrocytosis.\nB: This leaves out reticulocytosis.\nC: B12 deficiency is megaloblastic, a failure of DNA synthesis.\nD: Statement iv) is megaloblastic.\nTakeaway: Megaloblastic: B12 and folate deficiency.", "l": ["W9 4.3", "W9 4.4"]}, {"c": "Week 10", "p": "Tariq, 52, has massive bleeding and his fibrinogen is low. The team wants a small-volume product that also holds factor VIII, factor XIII and von Willebrand factor. Which product fits?", "o": ["Prothrombin complex concentrate", "Frozen plasma", "Cryoprecipitate", "Fibrinogen concentrate"], "a": 2, "e": "Correct: C. One unit of cryoprecipitate is 10 mL and holds factor VIII, factor XIII, von Willebrand factor and 150 mg of fibrinogen. It is stored frozen for up to 1 year.\nA: PCC holds the vitamin K dependent factors.\nB: Plasma holds all coagulation factors, but one unit is 250 to 300 mL.\nD: Fibrinogen concentrate is concentrated fibrinogen alone.\nTakeaway: 10 units of cryoprecipitate give about 4 g of fibrinogen.", "l": ["W10 9.6"]}, {"c": "Week 10", "p": "Ethan, 18 months, has a swollen, warm right knee after a minor fall while learning to walk. He bled for a long time after a heel prick as a newborn. His mother's brother had \"bleeding problems\". On exam his knee is tense with a painful, limited range of motion.\n\nHb 108 g/L (ref 110-140)\nPlatelets 320 × 10⁹/L (ref 150-450)\nPT/INR normal\naPTT prolonged\nMixing study aPTT corrects\nFactor VIII activity low\n\nWhat is the most likely diagnosis?", "o": ["Type 1 von Willebrand disease", "Hemophilia B", "Factor VII deficiency", "Factor XII deficiency", "Hemophilia A"], "a": 4, "e": "Correct: E. A boy with a joint bleed after minor trauma, an affected maternal uncle, a prolonged aPTT with a normal INR, and low FVIII activity has hemophilia A. It is X-linked, so males are mainly affected.\nA: Type 1 VWD causes mucosal bleeding, and FVIII is reduced only in proportion to vWF.\nB: Hemophilia B has low factor IX, not VIII.\nC: Factor VII deficiency prolongs the INR.\nD: Factor XII deficiency prolongs the aPTT without bleeding.\nTakeaway: Factor replacement: 1 unit of FVIII raises the level by 2%.", "l": ["W10 5.2", "W10 11.3"]}, {"c": "Week 11", "p": "Walter, 76, has a macrocytic anemia. His marrow shows dysplastic precursors with ring sideroblasts. Which molecular mutation is often seen in this setting?", "o": ["SF3B1", "PML/RARα", "JAK2 V617F", "BCR-ABL"], "a": 0, "e": "Correct: A. SF3B1 mutations are often seen in MDS with ring sideroblasts, as in your Week 11 Jeopardy deck.\nB: PML/RARα is the fusion gene of APL.\nC: JAK2 V617F drives most PV and many ET and PMF cases.\nD: BCR-ABL comes from t(9;22) in CML.\nTakeaway: MDS with del(5q) is treated with lenalidomide.", "l": ["W11 9.6"]}, {"c": "Week 11", "p": "Kayla, 17, has 3 weeks of fatigue, easy bruising, gum bleeding and two chest infections. She takes no drugs, has no toxin exposure, and her viral tests are negative. On exam she is pale with petechiae. She has no enlarged nodes, liver or spleen, and no unusual physical features.\n\nHb 72 g/L (ref 115-160)\nMCV 98 fL (ref 80-100)\nReticulocytes low\nWBC 1.6 × 10⁹/L (ref 4-10)\nANC 0.4 × 10⁹/L (ref 1.5 or more)\nPlatelets 14 × 10⁹/L (ref 150-450)\nFilm: no blasts and no abnormal cells.\nMarrow biopsy: fatty marrow, 10% cellularity, no infiltrate.\n\nWhat is the most likely diagnosis?", "o": ["Myelodysplastic syndrome", "Acute lymphoblastic leukemia", "Primary myelofibrosis", "Aplastic anemia", "Splenic sequestration"], "a": 3, "e": "Correct: D. Pancytopenia with a hypocellular, fatty marrow and no cause found fits idiopathic aplastic anemia, the most common form. It is not a cancer.\nA: MDS is far more common in the elderly and shows dysplasia.\nB: ALL shows blasts in the blood or marrow.\nC: Myelofibrosis shows teardrop cells and marrow fibrosis.\nE: Sequestration needs an enlarged spleen and has a normal marrow.\nTakeaway: Fanconi anemia brings physical features such as short stature and triphalangeal thumbs.", "l": ["W11 9.1", "W11 9.4"]}, {"c": "Week 11", "p": "Selena, 40, has relapsed Hodgkin lymphoma and starts an immune checkpoint inhibitor. Weeks later she develops severe diarrhea from colitis. Which treatment fits this toxicity?", "o": ["Leukapheresis", "Glucocorticoids", "Rasburicase", "Desferoxamine"], "a": 1, "e": "Correct: B. Checkpoint inhibitors such as pembrolizumab bind PD1 or PDL1 and take the brakes off the immune system. Their toxicities, including colitis, are treated with glucocorticoids.\nA: Leukapheresis treats leukostasis.\nC: Rasburicase treats tumour lysis syndrome.\nD: Desferoxamine is an iron chelator.\nTakeaway: Checkpoint toxicities: colitis, pneumonitis, rash, hepatitis, hypophysitis, nephritis.", "l": ["W11 8.6"]}, {"c": "Week 10", "p": "Which agent reverses dabigatran in a major bleed?", "o": ["Vitamin K and PCC", "Protamine sulphate", "Andexanet alpha", "Idarucizumab"], "a": 3, "e": "Correct: D. Dabigatran is a direct thrombin inhibitor. Idarucizumab, a monoclonal antibody, is its emergency reversal.\nA: Vitamin K and PCC reverse warfarin.\nB: Protamine reverses heparin.\nC: Andexanet alpha is for the direct Xa inhibitors.\nTakeaway: Match the antidote to the drug class.", "l": ["W10 7.3"]}, {"c": "Week 10", "p": "Two patients react during a transfusion. Patient A develops hives with stable vital signs and no breathing problems. Patient B develops sudden hypotension with no fever, rash or dyspnea. Which reaction fits each, in order?", "o": ["A anaphylaxis, B acute hemolytic reaction", "A minor allergic, B bradykinin-mediated hypotension", "A FNHTR, B transfusion-related acute lung injury", "A bradykinin-mediated hypotension, B minor allergic"], "a": 1, "e": "Correct: B. Urticaria with stable vitals is a minor allergic reaction. Isolated hypotension is listed as bradykinin-mediated hypotension.\nA: Anaphylaxis brings more than hives, and an acute hemolytic reaction shows hemolysis or fever.\nC: FNHTR needs a fever, and TRALI presents with dyspnea.\nD: This reverses the pair.\nTakeaway: Hives: allergic or anaphylaxis. Hypotension alone: bradykinin.", "l": ["W10 9.5"]}, {"c": "Week 12", "p": "Arthur, 74, has a routine CBC before cataract surgery. He feels well apart from mild fatigue. He has no fevers, night sweats or weight loss. On exam he has small, painless nodes in his neck and armpits and no enlarged liver or spleen.\n\nHb 136 g/L (ref 135-170)\nWBC 38 × 10⁹/L (ref 4-10)\nLymphocytes 34, mature × 10⁹/L\nPlatelets 190 × 10⁹/L (ref 150-450)\nFilm: many small mature lymphocytes and smudge cells.\nFlow cytometry: clonal B cells, CD5, CD19, dim CD20 and CD23 positive.\n\nWhat is the most likely diagnosis?", "o": ["Acute lymphoblastic leukemia", "Infectious mononucleosis", "Chronic myeloid leukemia", "Diffuse large B-cell lymphoma", "Chronic lymphocytic leukemia"], "a": 4, "e": "Correct: E. An older man with a high count of mature lymphocytes, smudge cells and clonal B cells that are CD5, CD19, dim CD20 and CD23 positive has CLL. Early-stage, asymptomatic CLL is not treated.\nA: ALL shows blasts.\nB: Mononucleosis shows atypical lymphocytes in a young person and is not clonal.\nC: CML raises myeloid cells with basophilia.\nD: DLBCL is a rapidly enlarging mass with B symptoms.\nTakeaway: CLL can bring autoimmune hemolytic anemia and ITP.", "l": ["W12 4.1", "W11 4.3"]}, {"c": "Week 12", "p": "Dev, 30, has had small nodes in his neck, axillae and groin for 2 months. Which test belongs in his initial bloodwork?", "o": ["HIV testing", "Serum free light chains", "Anti-AChR antibodies", "ADAMTS-13 level"], "a": 0, "e": "Correct: A. Generalized lymphadenopathy is concerning for malignancy or another systemic condition. Initial bloodwork includes CBC, LDH, calcium, albumin, liver and kidney function, HBV, HCV and HIV.\nB: Free light chains are a myeloma test.\nC: Anti-AChR is the tumour marker for thymoma.\nD: ADAMTS-13 is tested in TTP.\nTakeaway: Isolated is one node, localized is one area, generalized is more than one area.", "l": ["W12 2.3", "W12 2.2"]}, {"c": "Week 10", "p": "Rosa, 34, noticed tiny red spots on her legs and bleeding gums when brushing her teeth over the last week. She feels otherwise well and takes no drugs. She has no fever, diarrhea or confusion. On exam she has petechiae on her legs and no enlarged nodes, liver or spleen.\n\nHb 132 g/L (ref 115-160)\nWBC 6.8 × 10⁹/L (ref 4-10)\nPlatelets 12 × 10⁹/L (ref 150-450)\nPT/INR normal\naPTT normal\nFibrinogen normal\nCreatinine normal\nFilm: a few large platelets. No schistocytes, no platelet clumps, no blasts.\n\nWhat is the most likely diagnosis?", "o": ["Disseminated intravascular coagulation", "Aplastic anemia", "Thrombotic thrombocytopenic purpura", "EDTA-dependent pseudothrombocytopenia", "Immune thrombocytopenia"], "a": 4, "e": "Correct: E. Isolated severe thrombocytopenia with mucocutaneous bleeding, other cell lines normal, normal clotting tests and a clean film fits ITP, a diagnosis of exclusion. In adults it is often relapsing-remitting.\nA: DIC prolongs the INR and lowers fibrinogen.\nB: Aplastic anemia lowers all three cell lines.\nC: TTP brings hemolytic anemia, schistocytes and neurological signs.\nD: Pseudothrombocytopenia shows platelet clumps and no bleeding.\nTakeaway: ITP: steroids or IVIg first. Avoid routine platelet transfusions.", "l": ["W10 3.4", "W10 3.2"]}, {"c": "Week 10", "p": "Priya, 36, has had three pregnancies and needs red cells after a postpartum hemorrhage. Her blood group is already known. Which blood bank test detects antibodies she formed from her past pregnancies?", "o": ["Mixing study", "Crossmatch", "Antibody screen", "Blood group"], "a": 2, "e": "Correct: C. The antibody screen tests whether the patient's plasma holds antibodies against red cell antigens. These form from past transfusion or pregnancy and cause acute or delayed hemolysis.\nA: A mixing study looks for a clotting factor inhibitor.\nB: The crossmatch checks that her plasma does not agglutinate a specific donor unit.\nD: The blood group gives ABO and RhD type, which is already known.\nTakeaway: Blood bank tests in order: blood group, antibody screen, crossmatch.", "l": ["W10 9.1"]}, {"c": "Week 10", "p": "In which patients is a thrombophilia screen indicated?\ni) A 70-year-old with a DVT after hip arthroplasty\nii) A 35-year-old with an idiopathic DVT\niii) A 45-year-old with a mesenteric vein clot\niv) A 40-year-old with a DVT whose sister had a PE", "o": ["i), ii) and iv) only", "ii) and iii) only", "ii), iii) and iv) only", "All of the above"], "a": 2, "e": "Correct: C. Indications include idiopathic DVT or PE, age under 55, recurrent events, family history and unusual sites such as the mesentery.\nA: Statement i) is an older patient with a clear surgical cause.\nB: This leaves out family history, which is an indication.\nD: Statement i) does not meet the criteria.\nTakeaway: Hip fracture and joint arthroplasty carry the highest VTE risk.", "l": ["W10 6.1"]}, {"c": "Week 11", "p": "Which problem is a listed toxicity of imatinib?", "o": ["Muscle cramping and edema", "Atrial fibrillation and bruising", "Alopecia and mucositis", "Colitis and pneumonitis"], "a": 0, "e": "Correct: A. Imatinib toxicities include muscle cramping, edema, diarrhea, cytopenias and effusions.\nB: Bruising and atrial fibrillation are ibrutinib toxicities.\nC: Alopecia and mucositis are shared by the classic chemotherapies.\nD: Colitis and pneumonitis are immune checkpoint inhibitor toxicities.\nTakeaway: Classic chemotherapy: myelosuppression, alopecia, mucositis.", "l": ["W11 7.7"]}, {"c": "Week 10", "p": "Gloria, 66, received 2 units of red cells after surgery. A week later she has new bruising and a platelet count of 8 × 10⁹/L. She has no heparin exposure. Which transfusion risk fits best?", "o": ["Transfusion-associated circulatory overload", "Febrile non-hemolytic transfusion reaction", "Transfusion-related acute lung injury", "Post-transfusion purpura"], "a": 3, "e": "Correct: D. New cytopenias after a transfusion point to TA-GvHD, post-transfusion purpura or alloimmune cytopenias. An isolated platelet drop fits post-transfusion purpura.\nA: TACO presents with dyspnea.\nB: FNHTR presents with fever.\nC: TRALI presents with dyspnea.\nTakeaway: Sort transfusion reactions by the main sign: fever, dyspnea, hives, hypotension, hemolysis or cytopenias.", "l": ["W10 9.5"]}, {"c": "Week 12", "p": "Serum protein electrophoresis shows the albumin peak and a narrow monoclonal protein spike, with darkening of one heavy chain and one light chain. What does this pattern show?", "o": ["A polyclonal rise from many plasma cell clones", "One plasma cell clone making one antibody", "A normal pattern of antibody production", "A loss of plasma cells from the bone marrow"], "a": 1, "e": "Correct: B. Each plasma cell makes one type of Ig. A monoclonal spike with one heavy and one light chain means a single clone is making one antibody, the M protein.\nA: Many clones would give a polyclonal rise, not a single spike.\nC: A normal pattern has no monoclonal spike.\nD: A spike comes from plasma cells making excess protein, not from their loss.\nTakeaway: Myeloma: production and build-up of a non-functional monoclonal antibody.", "l": ["W12 7.1"]}, {"c": "Week 9", "p": "Aiden, 3, lives in an old house that is being renovated, and his parents have seen him chewing paint chips from the windowsill. He has been irritable and tired, with belly pain and constipation. He eats a normal diet with meat.\n\nHb 96 g/L (ref 110-140)\nMCV 72 fL (ref 80-100)\nWBC 8.0 × 10⁹/L (ref 4-10)\nPlatelets 310 × 10⁹/L (ref 150-450)\nFerritin normal\nFilm: hypochromic red cells with basophilic stippling.\n\nWhat is the most likely diagnosis?", "o": ["Iron deficiency anemia", "Hereditary spherocytosis", "Anemia of chronic inflammation", "β-thalassemia minor", "Lead poisoning"], "a": 4, "e": "Correct: E. A toddler eating paint chips, a microcytic anemia with a normal ferritin, and basophilic stippling fit lead poisoning, a cause of sideroblastic anemia.\nA: Iron deficiency has a low ferritin.\nB: Hereditary spherocytosis is normocytic, with spherocytes.\nC: Anemia of chronic inflammation needs a chronic illness.\nD: Thalassemia would need a family history and a high RBC count, and has no toxin exposure.\nTakeaway: Treat by removing the toxin, with chelation for lead.", "l": ["W9 1.5", "W9 1.1"]}, {"c": "Week 11", "p": "Monica, 34, has heavy periods that last 8 days. She is tired and craves ice. She has no headaches, burning in her hands or feet, or vision changes. On exam she is pale, with no splenomegaly.\n\nHb 98 g/L (ref 115-160)\nMCV 70 fL (ref 80-100)\nWBC 6.6 × 10⁹/L (ref 4-10)\nPlatelets 620 × 10⁹/L (ref 150-450)\nFerritin low\nJAK2, CALR, MPL negative\n\nWhat is the most likely diagnosis?", "o": ["Polycythemia vera", "Reactive thrombocytosis from iron deficiency", "Essential thrombocythemia", "Chronic myeloid leukemia", "Primary myelofibrosis"], "a": 1, "e": "Correct: B. A high platelet count with iron deficiency from heavy periods, no MPN symptoms, and negative JAK2, CALR and MPL fits secondary thrombocytosis, which is more common than primary. Iron-deficiency anemia is a listed cause.\nA: PV raises the Hb, and hers is low.\nC: ET needs reactive causes ruled out and is usually JAK2, CALR or MPL positive.\nD: CML gives a high WBC with basophils.\nE: Myelofibrosis shows teardrop cells and cytopenias.\nTakeaway: Treat the underlying cause of a secondary thrombocytosis.", "l": ["W11 5.2", "W11 5.3"]}, {"c": "Week 12", "p": "Two node biopsies are reviewed. Node A has lost its normal structure and shows large cells with visible nucleoli and high mitotic activity. Node B has a follicular pattern of B cells. Which lymphoma and behaviour fits each node, in order?", "o": ["A DLBCL, indolent. B follicular, aggressive", "A Burkitt, indolent. B mantle cell, aggressive", "A DLBCL, aggressive. B follicular, indolent", "A follicular, aggressive. B DLBCL, indolent"], "a": 2, "e": "Correct: C. Loss of node structure with large nuclei, visible nucleoli and high mitotic activity is DLBCL, which is aggressive. A follicular pattern is follicular lymphoma, which is indolent.\nA: This keeps the lymphomas but swaps their behaviour.\nB: Burkitt has a starry-sky pattern, and neither node is described that way.\nD: This swaps the two lymphomas.\nTakeaway: Aggressive lymphomas are often curable. Indolent ones are often not.", "l": ["W12 1.2", "W12 4.2"]}, {"c": "Week 12", "p": "Viktor, 66, has a monoclonal protein along with heart failure and kidney damage. Biopsy shows deposits of abnormal protein in his tissues. Which disorder fits?", "o": ["AL amyloidosis", "Smoldering myeloma", "POEMS syndrome", "Solitary plasmacytoma"], "a": 0, "e": "Correct: A. In AL amyloidosis, M proteins become insoluble and deposit in organs such as the heart and kidneys.\nB: Smoldering myeloma causes no organ damage.\nC: POEMS is polyneuropathy, organomegaly, endocrinopathy, M protein and skin changes.\nD: A plasmacytoma is a solid myeloma tumour.\nTakeaway: AL amyloidosis can be primary or secondary to myeloma.", "l": ["W12 8.1"]}, {"c": "Week 10", "p": "Jacob, 35, had routine bloodwork for a life insurance application. He feels well and has never had easy bruising, nosebleeds or bleeding after dental work. He takes no drugs. His exam is normal, with no petechiae or bruises.\n\nHb 152 g/L (ref 135-170)\nWBC 7.2 × 10⁹/L (ref 4-10)\nPlatelets 38 × 10⁹/L (ref 150-450)\nPT/INR normal\naPTT normal\nSample: lavender top tube\nFilm: large platelet clumps.\n\nWhat is the most likely diagnosis?", "o": ["Immune thrombocytopenia", "Splenic sequestration", "Thrombotic thrombocytopenic purpura", "EDTA-dependent pseudothrombocytopenia", "Bernard Soulier syndrome"], "a": 3, "e": "Correct: D. A low count with no bleeding history, a normal exam, a lavender top EDTA tube and platelet clumps on the film fit pseudothrombocytopenia. Antibodies bind platelets in EDTA, and the clumps are miscounted.\nA: ITP is a diagnosis of exclusion and does not show clumps.\nB: Sequestration needs an enlarged spleen.\nC: TTP brings hemolysis, schistocytes and a sick patient.\nE: Bernard Soulier is a platelet adhesion disorder with bleeding.\nTakeaway: Always look at the film before treating a low platelet count.", "l": ["W10 3.3", "W10 3.1"]}, {"c": "Week 9", "p": "Which treatment fits folate deficiency in an older adult with alcoholism and a poor diet?", "o": ["Oral iron 60 mg daily", "IM cobalamin 100 mcg daily", "Oral folate 1-5 mg daily", "Folic acid 0.4 mg daily"], "a": 2, "e": "Correct: C. Folate deficiency from alcoholism and old age is treated with oral folate 1 to 5 mg.\nA: Folate deficiency causes a macrocytic anemia, not iron deficiency.\nB: IM cobalamin treats B12 deficiency.\nD: 0.4 mg is the pregnancy dose.\nTakeaway: Folate stores last months. B12 stores last years.", "l": ["W9 7.6", "W9 8.3"]}, {"c": "Week 10", "p": "Which blood product best corrects a high INR in a patient with liver disease who is bleeding?", "o": ["Platelets", "Frozen plasma", "Cryoprecipitate", "Fibrinogen concentrate"], "a": 1, "e": "Correct: B. Plasma holds all coagulation factors and is indicated for bleeding in liver disease with an INR of 1.8 or more.\nA: Platelets treat a low platelet count, not a high INR.\nC: Cryoprecipitate replaces fibrinogen, not the full set of factors.\nD: Fibrinogen concentrate is for congenital fibrinogen deficiency.\nTakeaway: Liver disease raises the INR because the liver makes the clotting factors.", "l": ["W10 9.4", "W10 4.2.3"]}, {"c": "Week 9", "p": "Marcus, 22, a university athlete, learns he has sickle cell trait (HbAS). Which statement about his condition is correct?", "o": ["Being heterozygous raises malaria resistance", "He needs penicillin prophylaxis and hydroxyurea", "He will have frequent veno-occlusive crises", "It is inherited in an X-linked recessive pattern"], "a": 0, "e": "Correct: A. Sickle cell disease is autosomal recessive, and the heterozygous phenotype increases malaria resistance. Sickle trait is monitored if there is hematuria, glaucoma, severe dehydration or medullary renal carcinoma.\nB: Penicillin and hydroxyurea are for sickle cell disease.\nC: Veno-occlusive crises are a feature of sickle cell disease.\nD: Sickle cell disease is autosomal recessive.\nTakeaway: Sickle cell disease care: folate, hydroxyurea, penicillin to age 5, stem cell transplant, as in your Week 9 quiz.", "l": ["W9 2.1"]}, {"c": "Week 12", "p": "Greta, 45, has enlarged nodes in her right neck and right axilla, and the lymphoma has also spread into the adjacent chest wall. There is no disease below the diaphragm and no B symptoms. What is her Ann Arbor stage?", "o": ["Stage IVA", "Stage IIIA", "Stage IIB", "Stage IIA"], "a": 3, "e": "Correct: D. Stage II covers two or more node regions, or an extralymphatic site with one or more node regions, on the same side of the diaphragm. No B symptoms gives A.\nA: Stage IV is diffuse extralymphatic involvement, such as marrow.\nB: Stage III needs nodes on both sides of the diaphragm.\nC: B needs B symptoms.\nTakeaway: The spleen counts toward stage III, as in your Week 12 quiz.", "l": ["W12 5.3"]}, {"c": "Week 9", "p": "Nadia, 41, has taken oral iron for 4 months for iron deficiency anemia. Her Hb is now normal. Which test best shows whether her iron stores have refilled?", "o": ["Hemoglobin", "Serum iron", "Serum ferritin", "Reticulocyte count"], "a": 2, "e": "Correct: C. Serum ferritin reflects body iron stores. The anemia corrects by about 3 months, but stores take 3 to 6 months to refill.\nA: Hb normalizes before the stores refill.\nB: Serum iron and transferrin reflect iron delivery to the marrow.\nD: Reticulocytes rise in the first week of treatment.\nTakeaway: Iron response: retics at 1 week, Hb at 2 to 4 weeks, anemia corrected by 3 months, stores by 3 to 6 months.", "l": ["W9 7.2", "W9 1.4"]}, {"c": "Week 11", "p": "Teardrop cells with a leukoerythroblastic picture are most associated with which disorder?", "o": ["Chronic lymphocytic leukemia", "Polycythemia vera", "Essential thrombocythemia", "Primary myelofibrosis"], "a": 3, "e": "Correct: D. Primary myelofibrosis gives pancytopenia from marrow fibrosis, with teardrop cells and immature cells in a leukoerythroblastic picture.\nA: CLL shows smudge cells.\nB: PV mainly causes erythrocytosis.\nC: ET mainly causes thrombocytosis.\nTakeaway: Teardrop cells: myelofibrosis or marrow infiltration.", "l": ["W11 6.3", "W11 9.1"]}, {"c": "Week 11", "p": "Two children have acute leukemia. Child A has ALL and child B has AML. Which statement about their outlook is correct?", "o": ["AML in children has a 90% cure rate", "About 90% of children with ALL are cured", "ALL treatment lasts 4-6 months in total", "Children with AML do better than with ALL"], "a": 1, "e": "Correct: B. About 90% of children with ALL are cured. In AML, about 70% of children reach remission and 40% are alive 5 years later.\nA: The 90% cure rate belongs to ALL.\nC: ALL treatment lasts 2 to 3 years. 4 to 6 months is the AML timeline.\nD: Children with ALL do better.\nTakeaway: ALL is 80% of childhood leukemias.", "l": ["W11 4.5"]}, {"c": "Week 12", "p": "Leo, 22, needs radiation to his pelvic and inguinal nodes for lymphoma. Which late effect should he be counselled about because of this field?", "o": ["Infertility", "Hypothyroidism", "Radiation pneumonitis", "L'Hermitte's sign"], "a": 0, "e": "Correct: A. Infertility is a late effect when the testicles or ovaries are in the radiation field. As in your Week 12 quiz, it is not expected from mediastinal radiation.\nB: Hypothyroidism follows radiation that includes the thyroid.\nC: Pneumonitis follows mediastinal radiation.\nD: L'Hermitte's sign follows radiation near the spinal cord in the neck.\nTakeaway: Late effects: hypothyroidism, zoster, infertility, second cancers.", "l": ["W12 12.3"]}, {"c": "Week 10", "p": "Which can cause bleeding with a normal INR and aPTT?\ni) Factor XIII deficiency\nii) A platelet function disorder\niii) VWD with normal factor VIII activity\niv) Hemophilia A", "o": ["ii), iii) and iv) only", "i) and ii) only", "i), ii) and iii) only", "All of the above"], "a": 2, "e": "Correct: C. Bleeding with a normal INR and PTT points to a platelet disorder, VWD with normal FVIII activity, FXIII deficiency, hyperfibrinolysis, abnormal vessels, or a very mild factor deficiency.\nA: Hemophilia A usually prolongs the aPTT.\nB: This leaves out VWD with normal FVIII activity.\nD: Statement iv) prolongs the aPTT.\nTakeaway: Normal clotting tests do not rule out a bleeding disorder.", "l": ["W10 4.1", "W10 5.1"]}, {"c": "Week 11", "p": "Why does the JAK2 V617F mutation drive polycythemia vera?", "o": ["It signals constantly without needing EPO", "It blocks EPO from binding to its receptor", "It fuses BCR to ABL on chromosome 22", "It is an inherited germline mutation"], "a": 0, "e": "Correct: A. Wild-type JAK2 needs EPO to bind before it activates. JAK2 V617F is an acquired somatic mutation that leaves the receptor constitutively active without EPO.\nB: The mutated receptor no longer needs EPO, which is why EPO is low in PV.\nC: BCR-ABL from t(9;22) is the Philadelphia chromosome of CML.\nD: JAK2 is an acquired somatic mutation.\nTakeaway: JAK2 sits in 90-95% of PV and 50-60% of ET and PMF.", "l": ["W11 6.1", "W11 6.5"]}, {"c": "Week 9", "p": "Theo, 22, has had mild jaundice on and off since childhood, worse when he is sick. He had gallstones removed last year. His father has the same problem and had his spleen removed. On exam he has scleral icterus and a palpable spleen.\n\nHb 104 g/L (ref 135-170)\nMCV 86 fL (ref 80-100)\nReticulocytes high\nWBC 6.4 × 10⁹/L (ref 4-10)\nPlatelets 250 × 10⁹/L (ref 150-450)\nIndirect bilirubin high\nHaptoglobin low\nDAT negative\nFilm: many small, round red cells without central pallor, and polychromasia.\n\nWhat is the most likely diagnosis?", "o": ["G6PD deficiency", "Warm autoimmune hemolytic anemia", "Hereditary elliptocytosis", "β-thalassemia minor", "Hereditary spherocytosis"], "a": 4, "e": "Correct: E. Lifelong hemolysis, pigment stones, splenomegaly, an affected parent, spherocytes and a negative DAT fit hereditary spherocytosis. It is autosomal dominant, from red cell membrane protein defects.\nA: G6PD deficiency shows bite cells and is X-linked.\nB: Warm AIHA also shows spherocytes, but the DAT is positive.\nC: Hereditary elliptocytosis shows elongated cells.\nD: β-thalassemia minor is microcytic.\nTakeaway: Diagnose with flow cytometry for band 3 protein.", "l": ["W9 6.3", "W9 3.5"]}, {"c": "Week 12", "p": "A patient with multiple myeloma has neutropenia and keeps getting chest infections. Which supportive therapies fit?", "o": ["Vertebroplasty and kyphoplasty", "Packed red cells and recombinant EPO", "Bisphosphonates and IV hydration", "Prophylactic antibiotics, G-CSF and IgG"], "a": 3, "e": "Correct: D. For neutropenia in myeloma, use antibiotic prophylaxis, SC G-CSF and IV or SC polyclonal IgG. Infections come from neutropenia and a weakened immune system.\nA: Vertebroplasty and kyphoplasty treat bone pain and fractures.\nB: Red cells and EPO treat anemia.\nC: Bisphosphonates and hydration treat hypercalcemia.\nTakeaway: Match each myeloma complication to its supportive therapy.", "l": ["W12 8.6", "W12 8.3"]}, {"c": "Week 9", "p": "Omar, 30, of Mediterranean descent, started a sulfonamide antibiotic for a urinary infection 3 days ago. He now has dark urine, yellow eyes and fatigue. He had a similar episode as a child after eating fava beans. On exam he is jaundiced, with no splenomegaly.\n\nHb 92 g/L (ref 135-170)\nMCV 96 fL (ref 80-100)\nReticulocytes high\nWBC 9.1 × 10⁹/L (ref 4-10)\nPlatelets 290 × 10⁹/L (ref 150-450)\nLDH high\nIndirect bilirubin high\nHaptoglobin low\nDAT negative\nFilm: bite cells, blister cells and Heinz bodies.\n\nWhat is the most likely diagnosis?", "o": ["Hereditary spherocytosis", "Warm autoimmune hemolytic anemia", "Sickle cell disease", "Paroxysmal nocturnal hemoglobinuria", "G6PD deficiency"], "a": 4, "e": "Correct: E. Hemolysis after a sulfonamide, a past episode with fava beans, a negative DAT, and bite cells with Heinz bodies fit G6PD deficiency. It is X-linked recessive and common in Mediterraneans.\nA: Hereditary spherocytosis shows spherocytes and splenomegaly.\nB: Warm AIHA has a positive DAT.\nC: Sickle cell disease shows sickle cells.\nD: PNH is a clonal PIGA disorder with no link to oxidant drugs.\nTakeaway: G6PD: avoid precipitants and give folate.", "l": ["W9 6.3", "W9 6.1"]}, {"c": "Week 12", "p": "Henry, 63, has newly diagnosed myeloma. Albumin is 40 g/L, beta-2 microglobulin is 2.8, LDH is normal and FISH is standard risk. Which ISS group and outlook fit?", "o": ["ISS 2, median survival of 83 months", "ISS 1, over 80% survival at 72 months", "Durie-Salmon stage I, the current system", "ISS 3, median survival of 43 months"], "a": 1, "e": "Correct: B. Albumin of 35 or more with beta-2 microglobulin below 3.5, standard risk FISH and a normal LDH is ISS 1, with over 80% survival at 72 months.\nA: ISS 2 is for patients who are neither ISS 1 nor ISS 3.\nC: Durie-Salmon staging is no longer used.\nD: ISS 3 needs beta-2 microglobulin of 5.5 or more.\nTakeaway: ISS uses albumin and beta-2 microglobulin.", "l": ["W12 8.5"]}, {"c": "Week 9", "p": "Pappenheimer bodies on the blood film are associated with which anemia?", "o": ["Sideroblastic anemia", "Hereditary spherocytosis", "Anemia of chronic inflammation", "Iron deficiency anemia"], "a": 0, "e": "Correct: A. Sideroblastic anemia shows hypochromic cells with basophilic stippling and Pappenheimer bodies. Iron is present but can't be built into hemoglobin.\nB: Hereditary spherocytosis shows spherocytes.\nC: Anemia of chronic inflammation shows hypochromic cells without these inclusions.\nD: Iron deficiency shows anisocytosis, poikilocytosis, target cells and elliptocytes.\nTakeaway: Sideroblastic anemia: iron deposits form a ring around the nucleus of red cell precursors.", "l": ["W9 1.5", "W9 1.1"]}, {"c": "Week 11", "p": "Which pairings of targeted therapy and disease are correct?\ni) Rituximab and B-cell lymphomas\nii) Imatinib and CML\niii) ATRA and APL\niv) Bortezomib and CLL", "o": ["i) and iii) only", "i), ii) and iii) only", "ii), iii) and iv) only", "All of the above"], "a": 1, "e": "Correct: B. Rituximab targets CD20 on B-cell lymphomas, imatinib is a TKI for CML and ATRA is a differentiating molecule for APL.\nA: This leaves out imatinib for CML.\nC: Bortezomib is a proteosome inhibitor for multiple myeloma.\nD: Statement iv) is wrong. Bortezomib is for myeloma.\nTakeaway: Daratumumab (CD38) and bortezomib are myeloma drugs.", "l": ["W11 8.5", "W11 8.4"]}];

"Identify and analyze abnormalities on complete blood count (CBC) to formulate differential diagnoses for leukocytopenia.", "W11 2.2": "List the differential diagnoses for neutropenia.", "W11 4.1": "Identify the common presentations of leukemia in childhood.", "W11 4.2": "Describe risk features of acute lymphoblastic leukemia.", "W11 4.3": "Describe the principles of treatment of ALL.", "W11 4.5": "Compare and contrast the difference in treatment and outcome between ALL and AML.", "W11 5.2": "Formulate differential diagnoses for erythrocytosis and thrombocytosis.", "W11 5.3": "List and interpret the clinical findings important in determining the etiology of erythrocytosis and/or thrombocytosis.", "W11 6.1": "Discuss the “stem cell” as an origin for myeloproliferative neoplasms", "W11 6.2": "Distinguish the common features of the myeloproliferative neoplasms", "W11 6.3": "Compare and contrast the clinical presentations of the different myeloproliferative neoplasms.", "W11 6.5": "List the gene mutations characteristic of CML, PV and ET.", "W11 7.7": "Describe the major toxicities exhibited by the designated classes of antineoplastic drugs", "W11 8.4": "Define targeted therapy.", "W11 8.5": "Give examples of targeted therapies for B cell malignancies, chronic myeloid leukemia, acute promyelocytic leukemia, and multiple myeloma.", "W11 8.6": "List different classes of immunotherapy.", "W11 9.1": "List differential diagnoses of pancytopenia.", "W11 9.4": "Describe epidemiology and presentation of aplastic anemia.", "W11 9.6": "Describe the clinical relevance of the genetic abnormalities in myelodysplastic syndrome and acute promyelocytic leukemia.", "W11 11.2": "Discuss factors influencing the sample size calculation.", "W12 1.2": "Compare and contrast lymph node pathology from reactive causes, metastatic disease, low grade lymphoma and aggressive lymphoma.", "W12 2.2": "List and interpret critical clinical findings, including an appropriate history and physical examination in a patient with lymphadenopathy.", "W12 2.3": "List and interpret initial investigations, including laboratory and radiological studies, and determine whether there is an indication for a biopsy.", "W12 4.1": "Differentiate between \"monoclonal\" and \"polyclonal\" populations in confirming the diagnosis of non‐Hodgkin lymphoma.", "W12 4.2": "Correlate the histology and clinical behaviour of different types of non‐ Hodgkin lymphoma.", "W12 5.3": "Describe the Ann Arbor staging system", "W12 7.1": "Understand the role of plasma cells and know how to interpret serum protein electrophoresis.", "W12 8.1": "Define multiple myeloma and the other plasma cell dyscrasias.", "W12 8.3": "Explain the mechanisms for the disease manifestations.", "W12 8.5": "Discuss prognostic factors and prognosis of multiple myeloma in general terms.", "W12 8.6": "Identify and provide initial management of complications", "W12 12.1": "Describe principles of radiation in treatment of hematological malignancies.", "W12 12.2": "Explain the advantages and disadvantages of radiation.", "W12 12.3": "Explain the short-term and long-term side effects of radiation"};
const L = "ABCDE";
const N = QUESTIONS.length;
let cur = 0, showResults = false;
let ans = new Array(N).fill(null);           // current pick per question
let tries = QUESTIONS.map(()=>[]);           // every locked attempt: {pick, ok, at}
let strikes = QUESTIONS.map(()=>[]);         // struck option indexes for the open attempt
let history = [], db = null, uid = null, writing = false, dirty = false;
const MAP=document.getElementById("map"); if(MAP && QUESTIONS.length<=60) MAP.open=true;
const LS_KEY = "differential-block-3-practice-test-2";
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");

function score(){ return ans.reduce((n,a,i)=>n+(a!==null&&a===QUESTIONS[i].a?1:0),0); }
function answered(){ return ans.filter(a=>a!==null).length; }
function firstTryScore(){ return tries.reduce((n,t)=>n+(t.length&&t[0].ok?1:0),0); }
function firstTryCount(){ return tries.filter(t=>t.length).length; }

function renderHeader(){
  const bf=$("#barfill"); if(bf) bf.style.width=(100*answered()/N)+"%";
  $("#stats").innerHTML = `<span>Question <b>${showResults?"–":cur+1}</b> of <b>${N}</b></span><span>Answered <b>${answered()}</b></span><span>Score <b>${score()} / ${answered()}</b></span>`;
  $("#ticks").innerHTML = QUESTIONS.map((q,i)=>{
    const st = ans[i]===null?"":(ans[i]===q.a?"ok":"bad");
    const redo = tries[i].length>1 || (ans[i]===null && tries[i].length>0);
    return `<button class="tick ${st} ${redo?"redo":""} ${(!showResults&&i===cur)?"cur":""}" data-i="${i}" aria-label="Question ${i+1}"></button>`;
  }).join("");
  document.querySelectorAll(".tick").forEach(b=>b.onclick=()=>{cur=+b.dataset.i;showResults=false;render();});
}

function triesLine(i, includeCurrent){
  const t = includeCurrent ? tries[i] : tries[i];
  if(!t.length) return "";
  const parts = t.map((x,k)=>`<span class="${x.ok?"ok":"bad"}">${k+1}: ${L[x.pick]} ${x.ok?"correct":"wrong"}</span>`).join(" · ");
  return `<div class="tries">Attempts ${parts}</div>`;
}

function fmtLine(t){
  let m;
  if((m=t.match(/^Correct:\s*([A-E])\.?\s*(.*)$/)) || (m=t.match(/^([A-E]) is correct\.?\s*(.*)$/)))
    return `<p class="why"><span class="lk ok">${m[1]}</span><span>${esc(m[2])}</span></p>`;
  if((m=t.match(/^([A-E]):\s*(.*)$/)))
    return `<p class="alt"><span class="lk">${m[1]}</span><span>${esc(m[2])}</span></p>`;
  if((m=t.match(/^(Takeaway|High yield|High-yield|Key point|Clues):\s*(.*)$/i)))
    return `<p class="take"><b>${esc(m[1])}.</b> ${esc(m[2])}</p>`;
  return `<p>${esc(t)}</p>`;
}

function renderQ(){
  const q = QUESTIONS[cur], a = ans[cur], done = a!==null, st = strikes[cur];
  const opts = q.o.map((o,i)=>{
    let c = "";
    if(done){ if(i===q.a) c="right"; else if(i===a) c="wrong"; }
    const struck = !done && st.includes(i);
    const strikeBtn = done ? "" : `<button class="strike" data-s="${i}" aria-pressed="${struck}" aria-label="${struck?"Restore":"Strike out"} option ${L[i]}" title="${struck?"Restore":"Strike out"} option">${struck?"↺":"✕"}</button>`;
    return `<div class="optrow ${struck?"struck":""}"><button class="opt ${c}" data-i="${i}" ${done?"disabled":""}><span class="k">${L[i]}</span><span>${esc(o)}</span></button>${strikeBtn}</div>`;
  }).join("");
  let fb = "";
  if(done){
    const ok = a===q.a;
    const lines = q.e.split("\n").map(fmtLine).join("");
    const objs = q.l.map(id=>`<div class="obj"><b>Objective ${esc(id)}</b> ${esc(OBJECTIVES[id]||"")}</div>`).join("");
    fb = `<div class="fb" role="status"><div class="verdict ${ok?"ok":"bad"}">${ok?"Correct.":"Incorrect. The answer is "+L[q.a]+"."}</div>${lines}${objs}${triesLine(cur)}<div class="fbtools"><button class="btn ghost" id="redo">Reset and redo this question</button></div></div>`;
  }
  const pre = (!done && tries[cur].length) ? `<div class="hint">Redo. Your earlier attempts are saved.</div>${triesLine(cur)}` : (!done ? `<div class="hint">Tap ✕ to strike out an option. Right-click works too.</div>` : "");
  const last = cur===N-1;
  $("#main").innerHTML = `<article class="card">
    <div class="chead"><span class="tag">${esc(q.c)}</span><span class="chead-r">${ankiButton(cur)}<span class="qn">${cur+1} of ${N}</span></span></div>
    <p class="stem">${esc(q.p)}</p>
    ${pre}
    <div class="opts">${opts}</div>
    <div class="offrow">${offButton(cur)}</div>${fb}
    <div class="nav"><button class="btn ghost" id="prev" ${cur===0?"disabled":""}>Previous</button>
    <button class="btn" id="next" ${done?"":"disabled"}>${last?"See results":"Next"}</button></div>
  </article>`;
  document.querySelectorAll(".opt").forEach(b=>{
    b.onclick=()=>{ const p=+b.dataset.i; ans[cur]=p; tries[cur].push({pick:p, ok:p===q.a, at:new Date().toISOString()}); tries[cur]=tries[cur].slice(-10); strikes[cur]=[]; render(false); persist(); };
    b.oncontextmenu=(e)=>{ if(done) return; e.preventDefault(); toggleStrike(+b.dataset.i); };
  });
  document.querySelectorAll(".strike").forEach(b=>b.onclick=()=>toggleStrike(+b.dataset.s));
  const ab=$("#anki"); if(ab) ab.onclick=()=>ankiToggle(cur);
  const ob=$("#off"); if(ob) ob.onclick=()=>offToggle(cur);
  const r=$("#redo"); if(r) r.onclick=()=>{ ans[cur]=null; strikes[cur]=[]; render(false); persist(); };
  $("#prev").onclick=()=>{cur--;render();};
  $("#next").onclick=()=>{ if(last){showResults=true;} else cur++; render(); };
}

function toggleStrike(i){
  const s = strikes[cur], k = s.indexOf(i);
  if(k<0) s.push(i); else s.splice(k,1);
  render(false); persist();
}

function renderResults(){
  const s = score(), pct = Math.round(100*s/N);
  const cats = {};
  QUESTIONS.forEach((q,i)=>{ cats[q.c]=cats[q.c]||[0,0]; cats[q.c][1]++; if(ans[i]===q.a) cats[q.c][0]++; });
  const rows = Object.entries(cats).map(([c,[r,t]])=>`<tr><td>${esc(c)}<span class="meter"><i style="width:${Math.round(100*r/t)}%"></i></span></td><td>${r} / ${t}</td></tr>`).join("");
  const missed = {};
  QUESTIONS.forEach((q,i)=>{ const wrongFirst = tries[i].length && !tries[i][0].ok; if(ans[i]!==q.a || wrongFirst) q.l.forEach(id=>{ const w=id.split(" ")[0]; missed[w]=missed[w]||new Set(); missed[w].add(id); }); });
  const weeks = Object.keys(missed).sort((x,y)=>parseInt(x.slice(1))-parseInt(y.slice(1)));
  const missHtml = weeks.length ? weeks.map(w=>`<h3>Week ${w.slice(1)}</h3><ul class="miss">${[...missed[w]].map(id=>`<li><code>${esc(id)}</code>${esc(OBJECTIVES[id]||"")}</li>`).join("")}</ul>`).join("") : "<p>No missed objectives.</p>";
  const redone = tries.filter(t=>t.length>1).length;
  const un = N - answered();
  $("#main").innerHTML = `<article class="card">
    <div class="chead"><span class="tag">Results</span><span>${un?un+" unanswered":"Complete"}</span></div>
    <div><div class="big">${s} / ${N}</div><div class="stats"><span><b>${pct}%</b> correct now</span><span>First try <b>${firstTryScore()} / ${firstTryCount()}</b></span><span>Redone <b>${redone}</b></span></div></div>
    <table><thead><tr><th>Topic</th><th>Score</th></tr></thead><tbody>${rows}</tbody></table>
    ${ankiMissedRow()}<h2>Objectives to review</h2><p class="hint">Includes questions you missed on the first try, even if a redo got them right.</p>${missHtml}${history.length?`<h2>Past attempts</h2><table><thead><tr><th>Date</th><th>Score</th></tr></thead><tbody>${history.slice().reverse().map(h=>`<tr><td>${new Date(h.date).toLocaleDateString()}</td><td>${h.score} / ${h.total}</td></tr>`).join("")}</tbody></table>`:""}
    <div class="nav"><button class="btn ghost" id="back">Back to questions</button><button class="btn" id="restart">Restart all</button></div>
  </article>`;
  $("#back").onclick=()=>{showResults=false;render();};
  const am=$("#ankimissed"); if(am) am.onclick=()=>{ ankiAdd(missedIdx()); renderResults(); };
  $("#restart").onclick=resetAll;
}
/* Clear every answer, redo and strike-out. The attempt is kept in Past attempts. Flags are not touched. */
function resetAll(){
  if(answered() || tries.some(t=>t.length)){
    history.push({date:new Date().toISOString(), score:score(), answered:answered(), total:N, firstTry:firstTryScore(),
      missed:QUESTIONS.map((q,i)=>ans[i]!==null&&ans[i]!==q.a?"q"+(i+1):null).filter(Boolean)});
    history=history.slice(-20);
  }
  ans.fill(null); tries=QUESTIONS.map(()=>[]); strikes=QUESTIONS.map(()=>[]); cur=0; showResults=false; render(); persist();
}
/* Header button: first tap arms it, second tap within 4 seconds resets. No browser dialog. */
(function(){
  const b=document.getElementById("resetall"); let timer=null;
  const disarm=()=>{ b.classList.remove("armed"); b.textContent="Reset all answers"; clearTimeout(timer); timer=null; };
  b.onclick=()=>{
    if(!b.classList.contains("armed")){ b.classList.add("armed"); b.textContent="Tap again to reset"; timer=setTimeout(disarm,4000); return; }
    disarm(); resetAll(); setSave("All answers cleared. Your score is saved in Past attempts.","ok");
  };
})();

function setSave(text, cls){ const el=$("#save"); if(el){ el.textContent=text; el.className="save "+(cls||""); } }
function bodyOf(){
  const a = {};
  QUESTIONS.forEach((q,i)=>{
    if(ans[i]===null && !tries[i].length && !strikes[i].length) return;
    a["q"+(i+1)] = {pick:ans[i], ok:ans[i]!==null && ans[i]===q.a, l:q.l, tries:tries[i], strikes:strikes[i]};
  });
  return {answers:a, history, total:N, answered:answered(), score:score(), firstTry:firstTryScore(), updatedAt:new Date().toISOString()};
}
function validPick(i,p){ return Number.isInteger(p) && p>=0 && p<QUESTIONS[i].o.length; }
function applySaved(d){
  if(!d || typeof d!=="object") return;
  ans.fill(null); tries=QUESTIONS.map(()=>[]); strikes=QUESTIONS.map(()=>[]);
  const a = d.answers || {};
  for(const k in a){
    const i = parseInt(k.slice(1),10)-1, row = a[k];
    if(!(i>=0 && i<N) || !row || typeof row!=="object") continue;
    if(validPick(i,row.pick)) ans[i]=row.pick;
    if(Array.isArray(row.tries)) tries[i]=row.tries.filter(t=>t&&validPick(i,t.pick)).map(t=>({pick:t.pick, ok:t.pick===QUESTIONS[i].a, at:String(t.at||"")})).slice(-10);
    else if(ans[i]!==null) tries[i]=[{pick:ans[i], ok:ans[i]===QUESTIONS[i].a, at:""}];
    if(Array.isArray(row.strikes)) strikes[i]=row.strikes.filter(x=>validPick(i,x));
  }
  history = Array.isArray(d.history) ? d.history.slice(-20) : [];
  const first = ans.findIndex(x=>x===null); cur = first<0 ? N-1 : first;
}
function lsLoad(){ try{ return JSON.parse(localStorage.getItem(LS_KEY)||"null"); }catch(e){ return null; } }
function lsSave(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(bodyOf())); }catch(e){} }
async function persist(){
  lsSave();
  if(!db || !uid) return;
  dirty = true; if(writing) return; writing = true;
  while(dirty){
    dirty = false;
    setSave("Saving…");
    try{ await db.doc("attempts/"+uid).set(bodyOf()); setSave("Progress saved to your account.","ok"); }
    catch(e){
      if(e && e.code==="invalid_argument"){ db=null; setSave("Progress saves in this browser only.","bad"); break; }
      setSave("Could not save to your account. Progress saves in this browser.","bad");
    }
  }
  writing = false;
}
async function connect(){
  try{
    if(!window.claude || !window.claude.use) return;
    const [u, d] = await Promise.all([window.claude.use("user"), window.claude.use("db")]);
    if(!u || !d) return;
    const id = await u.id(); if(!id) return;
    db = d; uid = id;
    const snap = await db.doc("attempts/"+uid).get();
    if(snap.exists){ applySaved(snap.data()); render(); setSave("Progress saved to your account.","ok"); }
    else if(answered() || tries.some(t=>t.length)){ persist(); }
    else setSave("Progress saves to your account.","ok");
  }catch(e){ /* keep local-only mode */ }
}

/* Flagged: flagged questions live in one shared list ("differential-anki", the key predates the rename)
   that the Flagged tab reads. Each card keeps a copy of its question, so the tab works without loading every quiz. */
const SET = {"slug": "block-3-practice-test-2", "title": "Block 3 Practice Test 2", "b": 3, "href": "fom/block-3/practice-tests/block-3-practice-test-2"};
const ANKI_KEY = "differential-anki";
function ankiAll(){ try{ const d=JSON.parse(localStorage.getItem(ANKI_KEY)||"null"); return d && Array.isArray(d.cards) ? d.cards : []; }catch(e){ return []; } }
function ankiPut(cards){ try{ localStorage.setItem(ANKI_KEY, JSON.stringify({v:1, cards})); return true; }catch(e){ setSave("Could not flag. Browser storage is full or blocked.","bad"); return false; } }
function ankiId(i){ return SET.slug+"#"+(i+1); }
function ankiCard(i){
  const q=QUESTIONS[i];
  return {id:ankiId(i), slug:SET.slug, set:SET.title, b:SET.b, href:SET.href, n:i+1, c:q.c, p:q.p, o:q.o, a:q.a, e:q.e, l:q.l, obj:q.l.map(x=>OBJECTIVES[x]||"")};
}
function ankiHas(i, cards){ return (cards||ankiAll()).some(c=>c.id===ankiId(i)); }
function ankiButton(i){ const s=ankiHas(i); return `<button class="ankibtn" id="anki" aria-pressed="${s}" title="${s?"Remove the flag":"Flag this question for review"}">${s?"Flagged":"Flag"}</button>`; }
function ankiToggle(i){
  let cards=ankiAll();
  if(ankiHas(i,cards)) cards=cards.filter(c=>c.id!==ankiId(i));
  else cards.push(Object.assign(ankiCard(i), {at:new Date().toISOString()}));
  ankiPut(cards); render(false);
}
function ankiAdd(list){
  const cards=ankiAll(), have=new Set(cards.map(c=>c.id)), at=new Date().toISOString();
  list.forEach(i=>{ if(!have.has(ankiId(i))) cards.push(Object.assign(ankiCard(i), {at})); });
  ankiPut(cards);
}
function missedIdx(){ return QUESTIONS.map((q,i)=>((ans[i]!==null && ans[i]!==q.a) || (tries[i].length && !tries[i][0].ok)) ? i : -1).filter(i=>i>=0); }
function ankiMissedRow(){
  const m=missedIdx(); if(!m.length) return "";
  const cards=ankiAll(), left=m.filter(i=>!ankiHas(i,cards)).length;
  return `<div class="ankirow">${left ? `<button class="btn ghost" id="ankimissed">Flag ${left} missed question${left===1?"":"s"} for review</button>` : `<span class="hint">All ${m.length} missed questions are flagged.</span>`}</div>`;
}
/* Keep saved copies current when a question is corrected, without touching review progress. */
function ankiRefresh(){
  const cards=ankiAll(); let changed=false;
  cards.forEach(c=>{
    if(c.slug!==SET.slug) return;
    const i=c.n-1; if(!(i>=0 && i<N)) return;
    const fresh=ankiCard(i);
    for(const k of ["set","b","href","c","p","o","a","e","l","obj"]) if(JSON.stringify(c[k])!==JSON.stringify(fresh[k])){ c[k]=fresh[k]; changed=true; }
  });
  if(changed) ankiPut(cards);
}
addEventListener("storage", e=>{ if(e.key===ANKI_KEY || e.key===OFF_KEY) render(false); });

/* Not in course content: questions you report land in "differential-offcontent".
   The Flagged tab lists them with a Copy list button, so they can be sent in for removal. */
const OFF_KEY = "differential-offcontent";
function offAll(){ try{ const d=JSON.parse(localStorage.getItem(OFF_KEY)||"null"); return d && Array.isArray(d.items) ? d.items : []; }catch(e){ return []; } }
function offHas(i){ return offAll().some(x=>x.id===ankiId(i)); }
function offButton(i){ const s=offHas(i); return `<button class="offbtn" id="off" aria-pressed="${s}">${s?"Reported as not in course content. Undo":"Not in course content?"}</button>`; }
function offToggle(i){
  let items=offAll();
  if(offHas(i)) items=items.filter(x=>x.id!==ankiId(i));
  else { const q=QUESTIONS[i]; items.push({id:ankiId(i), slug:SET.slug, set:SET.title, b:SET.b, href:SET.href, n:i+1, c:q.c, p:q.p, key:q.o[q.a], at:new Date().toISOString()}); }
  try{ localStorage.setItem(OFF_KEY, JSON.stringify({v:1, items})); }catch(e){ setSave("Could not save the report. Browser storage is full or blocked.","bad"); }
  render(false);
}

function render(top=true){ renderHeader(); showResults?renderResults():renderQ(); if(top) window.scrollTo({top:0}); }
applySaved(lsLoad());
ankiRefresh();
render();
connect();
</script>

</body></html>
