<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>

<style>
/* Nexus quiz page. Matches the site: neutral greys, one typeface, and the block's colour as --accent. */
:root{
  --bg:#f5f6f8;--paper:#ffffff;--ink:#15181d;--muted:#4d5560;--faint:#7b828d;--line:#e0e3e8;
  --accent:#0b7a75;--soft:#eef0f3;
  --ok:#1d7a46;--okw:#e7f4ec;--bad:#b42318;--badw:#fcecea;--tick:#dfe2e7;
  --display:"Atkinson Hyperlegible Next","Segoe UI",system-ui,-apple-system,sans-serif;
  --body:"Atkinson Hyperlegible Next","Segoe UI",system-ui,-apple-system,sans-serif;
  --r:8px;
}
:root[data-b="2"]{--accent:#4f46c8}:root[data-b="3"]{--accent:#a3246b}:root[data-b="4"]{--accent:#a35f08}
:root[data-theme="dark"]{
  --bg:#14161a;--paper:#1b1e24;--ink:#eceef2;--muted:#b3bac5;--faint:#8a919c;--line:#2d323b;
  --accent:#45c2b8;--soft:#252930;
  --ok:#5ccf8f;--okw:#13301f;--bad:#f2877c;--badw:#3a1c1a;--tick:#30353e;color-scheme:dark}
:root[data-theme="dark"][data-b="2"]{--accent:#a49df6}:root[data-theme="dark"][data-b="3"]{--accent:#ef8ec0}:root[data-theme="dark"][data-b="4"]{--accent:#e3a548}
.btn:hover:not(:disabled){filter:brightness(.92)}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55}
.wrap{max-width:820px;margin:0 auto;padding-block:28px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:20px}

/* Header */
header{display:flex;flex-direction:column;gap:10px}
.context{margin:0;color:var(--faint);font-size:14px;font-weight:600}
h1{font-family:var(--display);font-weight:700;font-size:clamp(28px,5vw,40px);line-height:1.05;letter-spacing:-.02em;margin:0;text-wrap:balance}
.stats{display:flex;flex-wrap:wrap;gap:6px 22px;font-size:15px;color:var(--muted);font-variant-numeric:tabular-nums}
.stats b{color:var(--ink);font-weight:700}
.bar{height:6px;border-radius:999px;background:var(--tick);overflow:hidden}
.bar span{display:block;height:100%;width:0;background:var(--accent);border-radius:999px;transition:width .25s ease}
.map summary{cursor:pointer;color:var(--accent);font-weight:600;font-size:14px;width:max-content;list-style:none;padding:2px 0}
.map summary::-webkit-details-marker{display:none}
.map summary::before{content:"▸";display:inline-block;margin-right:6px;transition:transform .15s ease}
.map[open] summary::before{transform:rotate(90deg)}
.map summary:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:4px}
.ticks{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}
.tick{width:14px;height:14px;border:0;border-radius:4px;background:var(--tick);padding:0;cursor:pointer}
.tick:hover{background:var(--faint)}
.tick.ok{background:var(--ok)}.tick.bad{background:var(--bad)}
.tick.cur{outline:2px solid var(--accent);outline-offset:2px}
.tick.redo{box-shadow:inset 0 -3px 0 var(--accent)}
.tick:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.save{font-size:13px;color:var(--faint)}
.save.ok{color:var(--ok)}.save.bad{color:var(--bad)}

/* Question card */
.card{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:26px;display:flex;flex-direction:column;gap:18px}
.chead{display:flex;justify-content:space-between;align-items:center;gap:10px}
.tag{font-size:13px;font-weight:700;color:var(--accent);background:var(--soft);padding:3px 9px;border-radius:4px}
.chead-r{display:flex;align-items:center;gap:12px}
.ankibtn{font:inherit;font-size:13.5px;font-weight:700;color:var(--muted);background:transparent;border:1.5px solid var(--line);border-radius:6px;padding:4px 10px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.ankibtn::before{content:"+";font-size:15px;line-height:1}
.ankibtn:hover{border-color:var(--accent);color:var(--accent)}
.ankibtn[aria-pressed="true"]{border-color:var(--accent);background:var(--soft);color:var(--accent)}
.ankibtn[aria-pressed="true"]::before{content:"✓";font-size:12px}
.ankibtn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ankirow{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.qn{font-family:var(--display);font-weight:700;font-size:15px;color:var(--faint);font-variant-numeric:tabular-nums}
.stem{font-size:18.5px;line-height:1.6;margin:0;white-space:pre-line;max-width:70ch}
.hint{font-size:13px;color:var(--faint)}
.tries{font-size:13px;color:var(--muted)}
.tries .bad{color:var(--bad);font-weight:600}.tries .ok{color:var(--ok);font-weight:600}

/* Options */
.opts{display:flex;flex-direction:column;gap:10px}
.optrow{display:flex;gap:8px;align-items:stretch}
.optrow .opt{flex:1;min-width:0}
.opt{display:flex;gap:14px;align-items:center;text-align:left;width:100%;background:var(--paper);color:var(--ink);border:1.5px solid var(--line);border-radius:var(--r);padding:12px 16px;font:inherit;font-size:16.5px;line-height:1.45;cursor:pointer;transition:border-color .12s ease,background .12s ease}
.opt:hover:not(:disabled){border-color:var(--accent);background:var(--soft)}
.opt:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.opt:disabled{cursor:default}
.opt .k{flex:none;display:inline-grid;place-items:center;width:30px;height:30px;border-radius:6px;background:var(--soft);color:var(--accent);font-family:var(--display);font-weight:700;font-size:14px}
.opt.right{border-color:var(--ok);background:var(--okw)}
.opt.right .k{background:var(--ok);color:var(--paper)}
.opt.wrong{border-color:var(--bad);background:var(--badw)}
.opt.wrong .k{background:var(--bad);color:var(--paper)}
.strike{flex:none;width:44px;border:1.5px solid var(--line);border-radius:var(--r);background:var(--paper);color:var(--faint);font-size:14px;cursor:pointer;display:grid;place-items:center}
.strike:hover{border-color:var(--accent);color:var(--accent)}
.strike:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.strike[aria-pressed="true"]{background:var(--soft);color:var(--ink)}
.optrow.struck .opt > span:last-child{text-decoration:line-through;color:var(--faint)}
.optrow.struck .opt .k{opacity:.45}

/* Feedback */
.fb{background:var(--bg);border-radius:var(--r);padding:18px 20px;display:flex;flex-direction:column;gap:10px}
.verdict{font-family:var(--display);font-weight:700;font-size:18px;display:flex;align-items:center;gap:8px}
.verdict::before{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;font-size:13px;color:var(--paper)}
.verdict.ok{color:var(--ok)}.verdict.ok::before{content:"✓";background:var(--ok)}
.verdict.bad{color:var(--bad)}.verdict.bad::before{content:"✕";background:var(--bad)}
.fb p{margin:0;max-width:72ch}
.fb .why,.fb .alt{display:flex;gap:10px;align-items:baseline}
.fb .why{font-weight:600}
.lk{flex:none;display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--line);color:var(--muted);font-family:var(--display);font-weight:700;font-size:12px;transform:translateY(-1px)}
.lk.ok{background:var(--ok);color:var(--paper)}
.fb .alt{color:var(--muted)}
.fb .take{border-left:3px solid var(--accent);padding:2px 0 2px 12px;color:var(--ink)}
.fb .take b{color:var(--accent)}
.obj{font-size:13.5px;color:var(--faint);line-height:1.5}
.obj b{color:var(--muted)}
.fbtools{display:flex;justify-content:flex-end}

/* Buttons */
.nav{display:flex;justify-content:space-between;gap:10px}
.btn{font-family:var(--display);font-weight:700;font-size:15px;padding:10px 20px;border:1.5px solid var(--accent);border-radius:6px;background:var(--accent);color:var(--paper);cursor:pointer}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.ghost:hover:not(:disabled){background:var(--soft);color:var(--accent);border-color:var(--accent)}
.btn:disabled{opacity:.35;cursor:default}
.btn:focus-visible{outline:2px solid var(--ink);outline-offset:3px}

/* Results */
.big{font-family:var(--display);font-size:clamp(48px,9vw,72px);font-weight:700;line-height:1;letter-spacing:-.03em;color:var(--accent);font-variant-numeric:tabular-nums}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
td,th{text-align:left;padding:9px 0;border-bottom:1px solid var(--line);font-size:15px;vertical-align:middle}
th{font-size:13px;font-weight:700;color:var(--faint)}
td:last-child,th:last-child{text-align:right;white-space:nowrap;padding-left:12px}
.meter{display:block;height:5px;border-radius:999px;background:var(--tick);margin-top:6px;max-width:320px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent);border-radius:999px}
h2{font-family:var(--display);font-size:21px;font-weight:700;margin:6px 0 0}
h3{font-size:14px;font-weight:700;color:var(--faint);margin:6px 0 0}
.miss{margin:0;padding-left:0;list-style:none;display:flex;flex-direction:column;gap:8px;font-size:15px}
.miss code{font-family:var(--display);font-weight:700;font-size:13px;color:var(--bad);background:var(--badw);padding:1px 7px;border-radius:999px;margin-right:8px}

@media (max-width:560px){.card{padding:18px}.stem{font-size:17.5px}.opt{padding:11px 12px;gap:10px}.strike{width:40px}}
@media (prefers-reduced-motion:no-preference){.fb{animation:in .2s ease-out}@keyframes in{from{opacity:.3;transform:translateY(4px)}to{opacity:1;transform:none}}}
@media (prefers-reduced-motion:reduce){.bar span,.opt,.map summary::before{transition:none}}
</style>

    r.dataset.theme = t || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"); }

<script>
const QUESTIONS = [{"c": "Week 12", "p": "Greta, 45, has enlarged nodes in her right neck and right axilla, and the lymphoma has also spread into the adjacent chest wall. There is no disease below the diaphragm and no B symptoms. What is her Ann Arbor stage?", "o": ["Stage IIA", "Stage IIB", "Stage IIIA", "Stage IVA"], "a": 0, "e": "Correct: A. Stage II covers two or more node regions, or an extralymphatic site with one or more node regions, on the same side of the diaphragm. No B symptoms gives A.\nB: B needs B symptoms.\nC: Stage III needs nodes on both sides of the diaphragm.\nD: Stage IV is diffuse extralymphatic involvement, such as marrow.\nTakeaway: The spleen counts toward stage III, as in your Week 12 quiz.", "l": ["W12 5.3"]}, {"c": "Week 10", "p": "Two patients react during a transfusion. Patient A develops hives with stable vital signs and no breathing problems. Patient B develops sudden hypotension with no fever, rash or dyspnea. Which reaction fits each, in order?", "o": ["A FNHTR, B transfusion-related acute lung injury", "A minor allergic, B bradykinin-mediated hypotension", "A anaphylaxis, B acute hemolytic reaction", "A bradykinin-mediated hypotension, B minor allergic"], "a": 1, "e": "Correct: B. Urticaria with stable vitals is a minor allergic reaction. Isolated hypotension is listed as bradykinin-mediated hypotension.\nA: FNHTR needs a fever, and TRALI presents with dyspnea.\nC: Anaphylaxis brings more than hives, and an acute hemolytic reaction shows hemolysis or fever.\nD: This reverses the pair.\nTakeaway: Hives: allergic or anaphylaxis. Hypotension alone: bradykinin.", "l": ["W10 9.5"]}, {"c": "Week 12", "p": "Two node biopsies are reviewed. Node A has lost its normal structure and shows large cells with visible nucleoli and high mitotic activity. Node B has a follicular pattern of B cells. Which lymphoma and behaviour fits each node, in order?", "o": ["A follicular, aggressive. B DLBCL, indolent", "A Burkitt, indolent. B mantle cell, aggressive", "A DLBCL, aggressive. B follicular, indolent", "A DLBCL, indolent. B follicular, aggressive"], "a": 2, "e": "Correct: C. Loss of node structure with large nuclei, visible nucleoli and high mitotic activity is DLBCL, which is aggressive. A follicular pattern is follicular lymphoma, which is indolent.\nA: This swaps the two lymphomas.\nB: Burkitt has a starry-sky pattern, and neither node is described that way.\nD: This keeps the lymphomas but swaps their behaviour.\nTakeaway: Aggressive lymphomas are often curable. Indolent ones are often not.", "l": ["W12 1.2", "W12 4.2"]}, {"c": "Week 10", "p": "Gloria, 66, received 2 units of red cells after surgery. A week later she has new bruising and a platelet count of 8 × 10⁹/L. She has no heparin exposure. Which transfusion risk fits best?", "o": ["Febrile non-hemolytic transfusion reaction", "Transfusion-related acute lung injury", "Transfusion-associated circulatory overload", "Post-transfusion purpura"], "a": 3, "e": "Correct: D. New cytopenias after a transfusion point to TA-GvHD, post-transfusion purpura or alloimmune cytopenias. An isolated platelet drop fits post-transfusion purpura.\nA: FNHTR presents with fever.\nB: TRALI presents with dyspnea.\nC: TACO presents with dyspnea.\nTakeaway: Sort transfusion reactions by the main sign: fever, dyspnea, hives, hypotension, hemolysis or cytopenias.", "l": ["W10 9.5"]}, {"c": "Week 12", "p": "Sam, 6, has a tender 1.5 cm neck node with a cold and sore throat for 4 days. He is otherwise well. Which approach is most appropriate?", "o": ["Bone marrow aspirate and biopsy", "Reassure, then follow up", "Excisional biopsy of the node now", "PET-CT to stage a lymphoma"], "a": 1, "e": "Correct: B. Nodes are found in about 90% of children aged 4 to 8, and benign causes are more likely in young children. His ear, nose and throat symptoms are reassuring.\nA: A marrow is not part of the work-up without abnormal blood counts.\nC: Biopsy is for concerning features, such as a node of 2 cm or more that grows or fails 2 weeks of antibiotics.\nD: PET-CT stages a lymphoma once it is diagnosed.\nTakeaway: In children, a missing ENT cause is the concerning feature.", "l": ["W12 3.2", "W12 3.3"]}, {"c": "Week 10", "p": "Oliver, 9, has mild hemophilia A and needs a dental extraction. Which plan best prevents bleeding?", "o": ["DDAVP with tranexamic acid", "Vitamin K the night before", "Cryoprecipitate to raise fibrinogen", "Platelet transfusion before the procedure"], "a": 0, "e": "Correct: A. DDAVP raises FVIII in mild hemophilia A, and tranexamic acid treats mucosal bleeding. Care is coordinated with the hemophilia centre.\nB: Vitamin K reverses warfarin.\nC: Cryoprecipitate replaces fibrinogen.\nD: Platelets treat platelet disorders and thrombocytopenia.\nTakeaway: Severe hemophilia needs factor replacement. Mild can use DDAVP.", "l": ["W10 5.4"]}, {"c": "Week 12", "p": "Serum protein electrophoresis shows the albumin peak and a narrow monoclonal protein spike, with darkening of one heavy chain and one light chain. What does this pattern show?", "o": ["A polyclonal rise from many plasma cell clones", "A normal pattern of antibody production", "One plasma cell clone making one antibody", "A loss of plasma cells from the bone marrow"], "a": 2, "e": "Correct: C. Each plasma cell makes one type of Ig. A monoclonal spike with one heavy and one light chain means a single clone is making one antibody, the M protein.\nA: Many clones would give a polyclonal rise, not a single spike.\nB: A normal pattern has no monoclonal spike.\nD: A spike comes from plasma cells making excess protein, not from their loss.\nTakeaway: Myeloma: production and build-up of a non-functional monoclonal antibody.", "l": ["W12 7.1"]}, {"c": "Week 11", "p": "Two children have acute leukemia. Child A has ALL and child B has AML. Which statement about their outlook is correct?", "o": ["Children with AML do better than with ALL", "ALL treatment lasts 4-6 months in total", "AML in children has a 90% cure rate", "About 90% of children with ALL are cured"], "a": 3, "e": "Correct: D. About 90% of children with ALL are cured. In AML, about 70% of children reach remission and 40% are alive 5 years later.\nA: Children with ALL do better.\nB: ALL treatment lasts 2 to 3 years. 4 to 6 months is the AML timeline.\nC: The 90% cure rate belongs to ALL.\nTakeaway: ALL is 80% of childhood leukemias.", "l": ["W11 4.5"]}, {"c": "Week 11", "p": "Raj, 44, has a spleen that reaches well below his ribs and he feels full after small meals. He has pancytopenia, but his marrow is normal and no cause of destruction is found. What is the most likely mechanism?", "o": ["Immune-mediated destruction", "Splenic sequestration", "Decreased marrow production", "Marrow infiltration by cancer"], "a": 1, "e": "Correct: B. With a normal marrow and no destruction, a large spleen lowers blood counts by sequestration.\nA: No cause of destruction was found.\nC: His marrow is normal, so production is not the problem.\nD: Infiltration would show in the marrow and give a leukoerythroblastic film.\nTakeaway: Sequestration in a large spleen can lower all three cell lines.", "l": ["W11 9.1"]}, {"c": "Week 12", "p": "Dev, 30, has had small nodes in his neck, axillae and groin for 2 months. Which test belongs in his initial bloodwork?", "o": ["HIV testing", "Serum free light chains", "ADAMTS-13 level", "Anti-AChR antibodies"], "a": 0, "e": "Correct: A. Generalized lymphadenopathy is concerning for malignancy or another systemic condition. Initial bloodwork includes CBC, LDH, calcium, albumin, liver and kidney function, HBV, HCV and HIV.\nB: Free light chains are a myeloma test.\nC: ADAMTS-13 is tested in TTP.\nD: Anti-AChR is the tumour marker for thymoma.\nTakeaway: Isolated is one node, localized is one area, generalized is more than one area.", "l": ["W12 2.3", "W12 2.2"]}, {"c": "Week 9", "p": "Aiden, 3, has a mild microcytic anemia, and his film shows basophilic stippling. His ferritin is normal and his blood lead level is high. Which management fits?", "o": ["Oral iron for at least 3 months", "Regular transfusion and genetic counselling", "Chelation and removal of the source", "Pyridoxine with folate supplements"], "a": 2, "e": "Correct: C. Lead poisoning is one of the TAILS causes of microcytic anemia and a cause of sideroblastic anemia with basophilic stippling. Treatment is removal of the toxin, with chelation therapy for lead.\nA: His ferritin is normal, so iron deficiency is unlikely.\nB: Transfusion and genetic counselling are thalassemia care.\nD: Pyridoxine helps some sideroblastic anemia, but lead needs removal of the toxin.\nTakeaway: TAILS: thalassemia, chronic inflammation, iron deficiency, lead, sideroblastic.", "l": ["W9 1.5", "W9 1.1"]}, {"c": "Week 10", "p": "In which patients is a thrombophilia screen indicated?\ni) A 70-year-old with a DVT after hip arthroplasty\nii) A 35-year-old with an idiopathic DVT\niii) A 45-year-old with a mesenteric vein clot\niv) A 40-year-old with a DVT whose sister had a PE", "o": ["i), ii) and iv) only", "ii), iii) and iv) only", "ii) and iii) only", "All of the above"], "a": 1, "e": "Correct: B. Indications include idiopathic DVT or PE, age under 55, recurrent events, family history and unusual sites such as the mesentery.\nA: Statement i) is an older patient with a clear surgical cause.\nC: This leaves out family history, which is an indication.\nD: Statement i) does not meet the criteria.\nTakeaway: Hip fracture and joint arthroplasty carry the highest VTE risk.", "l": ["W10 6.1"]}, {"c": "Week 9", "p": "Marcus, 22, a university athlete, learns he has sickle cell trait (HbAS). Which statement about his condition is correct?", "o": ["He needs penicillin prophylaxis and hydroxyurea", "It is inherited in an X-linked recessive pattern", "He will have frequent veno-occlusive crises", "Being heterozygous raises malaria resistance"], "a": 3, "e": "Correct: D. Sickle cell disease is autosomal recessive, and the heterozygous phenotype increases malaria resistance. Sickle trait is monitored if there is hematuria, glaucoma, severe dehydration or medullary renal carcinoma.\nA: Penicillin and hydroxyurea are for sickle cell disease.\nB: Sickle cell disease is autosomal recessive.\nC: Veno-occlusive crises are a feature of sickle cell disease.\nTakeaway: Sickle cell disease care: folate, hydroxyurea, penicillin to age 5, stem cell transplant, as in your Week 9 quiz.", "l": ["W9 2.1"]}, {"c": "Week 9", "p": "Liam, 2, is pale and tired. Hb is 62 g/L with an MCV of 88 fL. His WBC and platelets are normal and the reticulocyte count is very low. He has no splenomegaly. Which diagnosis fits best?", "o": ["Pure red cell aplasia", "Hereditary spherocytosis", "Aplastic anemia", "Myelophthisis"], "a": 0, "e": "Correct: A. Only the red cells are low, with severe reticulocytopenia. That fits pure red cell aplasia, and Diamond Blackfan anemia is a listed cause.\nB: Hereditary spherocytosis is hemolytic, with a high reticulocyte count and splenomegaly.\nC: Aplastic anemia causes pancytopenia.\nD: Myelophthisis shows a leukoerythroblastic film with teardrop cells.\nTakeaway: Low retics: production. High retics: loss or destruction.", "l": ["W9 3.4", "W9 3.1"]}, {"c": "Week 9", "p": "Nadia, 41, has taken oral iron for 4 months for iron deficiency anemia. Her Hb is now normal. Which test best shows whether her iron stores have refilled?", "o": ["Reticulocyte count", "Serum iron", "Serum ferritin", "Hemoglobin"], "a": 2, "e": "Correct: C. Serum ferritin reflects body iron stores. The anemia corrects by about 3 months, but stores take 3 to 6 months to refill.\nA: Reticulocytes rise in the first week of treatment.\nB: Serum iron and transferrin reflect iron delivery to the marrow.\nD: Hb normalizes before the stores refill.\nTakeaway: Iron response: retics at 1 week, Hb at 2 to 4 weeks, anemia corrected by 3 months, stores by 3 to 6 months.", "l": ["W9 7.2", "W9 1.4"]}, {"c": "Week 12", "p": "Viktor, 66, has a monoclonal protein along with heart failure and kidney damage. Biopsy shows deposits of abnormal protein in his tissues. Which disorder fits?", "o": ["Smoldering myeloma", "Solitary plasmacytoma", "POEMS syndrome", "AL amyloidosis"], "a": 3, "e": "Correct: D. In AL amyloidosis, M proteins become insoluble and deposit in organs such as the heart and kidneys.\nA: Smoldering myeloma causes no organ damage.\nB: A plasmacytoma is a solid myeloma tumour.\nC: POEMS is polyneuropathy, organomegaly, endocrinopathy, M protein and skin changes.\nTakeaway: AL amyloidosis can be primary or secondary to myeloma.", "l": ["W12 8.1"]}, {"c": "Week 10", "p": "Frank, 79, takes dabigatran for atrial fibrillation and presents with a major GI bleed. Which agent reverses his anticoagulant?", "o": ["Idarucizumab", "Vitamin K and PCC", "Protamine sulphate", "Andexanet alpha"], "a": 0, "e": "Correct: A. Dabigatran is a direct thrombin inhibitor. Idarucizumab, a monoclonal antibody, is its emergency reversal.\nB: Vitamin K and PCC reverse warfarin.\nC: Protamine reverses heparin.\nD: Andexanet alpha is for the direct Xa inhibitors.\nTakeaway: Match the antidote to the drug class.", "l": ["W10 7.3"]}, {"c": "Week 12", "p": "A patient needs radiation for lymphoma in the neck. The team wants to spare the uninvolved salivary glands from high doses. Which technique is designed for this?", "o": ["High dose rate brachytherapy implants", "Stereotactic ablative radiation (SABR)", "Intensity modulated radiation (IMRT)", "Low dose rate brachytherapy implants"], "a": 2, "e": "Correct: C. IMRT maximizes the therapeutic ratio by sparing normal uninvolved tissues from high doses. Targeted radiation has improved the ability to spare the major salivary glands.\nA: High dose rate implants are also brachytherapy.\nB: SABR gives extremely high doses in 1 to 5 highly focused treatments.\nD: Brachytherapy places radioactive isotopes near gynecologic and GU tumours.\nTakeaway: Every tissue has a dose limit. Spinal cord, bowel, kidney and lungs often limit treatment.", "l": ["W12 12.2", "W12 12.1"]}, {"c": "Week 10", "p": "Ruth, 74, is alert, has an Hb of 66 g/L and gets short of breath walking to her mailbox. The team decides she needs a red cell transfusion. In the approach to transfusion, which step comes next?", "o": ["Order the blood group and crossmatch", "Obtain written informed consent", "Give IV iron and recheck the Hb", "Start the first unit while consent is sought"], "a": 1, "e": "Correct: B. The approach runs in order: decide the patient needs a transfusion, obtain informed consent, then obtain the blood bank tests. Ruth is capable, so consent is written and documented.\nA: The blood bank tests come after consent.\nC: She has symptomatic anemia, which meets the transfusion indication.\nD: Starting without consent applies only when the need is urgent with no SDM.\nTakeaway: Consent: written, explain risks, benefits and alternatives, capable patient, documented.", "l": ["W10 9.3", "W10 9.1"]}, {"c": "Week 10", "p": "Tariq, 52, has massive bleeding and his fibrinogen is low. The team wants a small-volume product that also holds factor VIII, factor XIII and von Willebrand factor. Which product fits?", "o": ["Frozen plasma", "Prothrombin complex concentrate", "Fibrinogen concentrate", "Cryoprecipitate"], "a": 3, "e": "Correct: D. One unit of cryoprecipitate is 10 mL and holds factor VIII, factor XIII, von Willebrand factor and 150 mg of fibrinogen. It is stored frozen for up to 1 year.\nA: Plasma holds all coagulation factors, but one unit is 250 to 300 mL.\nB: PCC holds the vitamin K dependent factors.\nC: Fibrinogen concentrate is concentrated fibrinogen alone.\nTakeaway: 10 units of cryoprecipitate give about 4 g of fibrinogen.", "l": ["W10 9.6"]}, {"c": "Week 10", "p": "Priya, 36, has had three pregnancies and needs red cells after a postpartum hemorrhage. Her blood group is already known. Which blood bank test detects antibodies she formed from her past pregnancies?", "o": ["Mixing study", "Antibody screen", "Crossmatch", "Blood group"], "a": 1, "e": "Correct: B. The antibody screen tests whether the patient's plasma holds antibodies against red cell antigens. These form from past transfusion or pregnancy and cause acute or delayed hemolysis.\nA: A mixing study looks for a clotting factor inhibitor.\nC: The crossmatch checks that her plasma does not agglutinate a specific donor unit.\nD: The blood group gives ABO and RhD type, which is already known.\nTakeaway: Blood bank tests in order: blood group, antibody screen, crossmatch.", "l": ["W10 9.1"]}, {"c": "Week 12", "p": "Which pairing of patient and likely anterior mediastinal mass is correct?", "o": ["A neurogenic tumour in the anterior space", "Thymoma in a 7-year-old child", "Thymoma in an adult over 40", "Seminoma in a 60-year-old woman"], "a": 2, "e": "Correct: C. The 5 Ts of the anterior mediastinum include the thymus in children and thymoma over age 40.\nA: Neurogenic tumours sit in the posterior compartment.\nB: Thymoma is a tumour of adults over 40. In children the T is the thymus.\nD: Germ cell tumours such as seminoma are seen in children and men.\nTakeaway: Anterior: 5 Ts. Middle: nodes and cysts. Posterior: nerves and spine.", "l": ["W12 6.1"]}, {"c": "Week 11", "p": "Why does the JAK2 V617F mutation drive polycythemia vera?", "o": ["It signals constantly without needing EPO", "It is an inherited germline mutation", "It fuses BCR to ABL on chromosome 22", "It blocks EPO from binding to its receptor"], "a": 0, "e": "Correct: A. Wild-type JAK2 needs EPO to bind before it activates. JAK2 V617F is an acquired somatic mutation that leaves the receptor constitutively active without EPO.\nB: JAK2 is an acquired somatic mutation.\nC: BCR-ABL from t(9;22) is the Philadelphia chromosome of CML.\nD: The mutated receptor no longer needs EPO, which is why EPO is low in PV.\nTakeaway: JAK2 sits in 90-95% of PV and 50-60% of ET and PMF.", "l": ["W11 6.1", "W11 6.5"]}, {"c": "Week 12", "p": "Henry, 63, has newly diagnosed myeloma. Albumin is 40 g/L, beta-2 microglobulin is 2.8, LDH is normal and FISH is standard risk. Which ISS group and outlook fit?", "o": ["ISS 2, median survival of 83 months", "Durie-Salmon stage I, the current system", "ISS 3, median survival of 43 months", "ISS 1, over 80% survival at 72 months"], "a": 3, "e": "Correct: D. Albumin of 35 or more with beta-2 microglobulin below 3.5, standard risk FISH and a normal LDH is ISS 1, with over 80% survival at 72 months.\nA: ISS 2 is for patients who are neither ISS 1 nor ISS 3.\nB: Durie-Salmon staging is no longer used.\nC: ISS 3 needs beta-2 microglobulin of 5.5 or more.\nTakeaway: ISS uses albumin and beta-2 microglobulin.", "l": ["W12 8.5"]}, {"c": "Week 9", "p": "Carol, 52, feels cold all the time, has gained weight and is constipated. Her heart rate is low. Hb is 112 g/L and MCV 104 fL, with large round red cells and normal neutrophils. Which treatment fits best?", "o": ["IM cobalamin injections", "Oral folate", "Thyroid supplements", "Alcohol cessation"], "a": 2, "e": "Correct: C. Cold intolerance, weight gain, constipation and a low heart rate fit hypothyroidism, a non-megaloblastic cause of macrocytosis. Treat with thyroid supplements.\nA: B12 deficiency is megaloblastic, with oval macrocytes and hypersegmented neutrophils.\nB: Folate deficiency is megaloblastic too.\nD: Alcohol cessation treats liver disease, and nothing suggests it here.\nTakeaway: ABCDEF: alcohol, B12, compensatory reticulocytosis, drugs, endocrine, folate.", "l": ["W9 4.5", "W9 4.3"]}, {"c": "Week 10", "p": "Rosa, 34, has new petechiae and gum bleeding. Platelets are 15, and the rest of the CBC and her film are normal. She takes no drugs and other causes are ruled out. Which statement about her condition is correct?", "o": ["Platelet transfusion is the first-line treatment", "It is caused by low ADAMTS-13 activity", "Most adult cases resolve within 6 months", "Half of adult cases follow a relapsing-remitting course"], "a": 3, "e": "Correct: D. Isolated thrombocytopenia with a normal film and no other cause fits ITP, a diagnosis of exclusion. Half of adult cases are relapsing-remitting.\nA: Platelets in ITP are kept for emergency bleeding. Steroids or IVIg come first, as in your Schulich review.\nB: Low ADAMTS-13 defines TTP.\nC: Resolution within 6 months describes childhood ITP.\nTakeaway: Childhood ITP follows a viral infection and resolves within 6 months.", "l": ["W10 3.4", "W10 3.2"]}, {"c": "Week 10", "p": "Hugh, 58, develops a DVT 2 weeks after hip replacement surgery. He has no cancer and no prior clots. What is the minimum length of anticoagulation?", "o": ["6 months", "3 months", "7-10 days", "Lifelong"], "a": 1, "e": "Correct: B. A major transient risk factor such as surgery needs a minimum of 3 months.\nA: A minimum of 6 months is for clots linked to cancer.\nC: 7 to 10 days is the minimum length of prophylaxis after surgery.\nD: Staying on long term applies to idiopathic clots in men.\nTakeaway: Duration follows the cause: cancer 6 months, transient risk 3 months, idiopathic often long term.", "l": ["W10 6.4"]}, {"c": "Week 10", "p": "Bruce, 61, has cirrhosis and is vomiting blood. INR is 2.4, fibrinogen is 2.0 g/L, platelets are 90 and Hb is 105 g/L. After the ABCs, which blood product best corrects his coagulopathy?", "o": ["Frozen plasma", "Fibrinogen concentrate", "Platelets", "Cryoprecipitate"], "a": 0, "e": "Correct: A. Plasma holds all coagulation factors and is indicated for bleeding in liver disease with an INR of 1.8 or more. Liver disease causes both primary and secondary hemostatic problems, as in your Week 10 Jeopardy deck.\nB: Fibrinogen concentrate is for congenital fibrinogen deficiency.\nC: His platelets are 90, so they are not the main problem.\nD: Cryoprecipitate replaces fibrinogen, and his is 2.0 g/L.\nTakeaway: Liver disease raises the INR because the liver makes the clotting factors.", "l": ["W10 9.4", "W10 4.2.3"]}, {"c": "Week 11", "p": "Which statement about trial design and statistics is correct?", "o": ["Power equals the type I error rate", "A one-sided test needs a smaller sample size", "Type II error is the false positive rate", "A two-sided test assumes one direction of effect"], "a": 1, "e": "Correct: B. A one-sided test is used when a difference is suspected in one direction only, and it needs a smaller sample size.\nA: Power is 1 minus beta, the type II error rate.\nC: Type II error is the false negative rate.\nD: A two-sided test is used when the direction of the difference is unknown.\nTakeaway: Type I is a false positive. Type II is a false negative.", "l": ["W11 11.2"]}, {"c": "Week 11", "p": "Which statement about local therapies in hematological malignancies is correct?", "o": ["Surgery is for diagnosis and palliation only", "Surgery cures limited stage lymphoma", "Radiation has no role in ALL", "Radiation is only ever used to palliate symptoms"], "a": 0, "e": "Correct: A. Surgery is used for diagnosis, such as removing a lymph node, and for palliation, such as myeloma bone pain.\nB: Radiation, not surgery, can cure limited stage lymphoma.\nC: Radiation is used for CNS prophylaxis in ALL.\nD: Radiation is also curative in limited stage lymphoma and in CNS prophylaxis for ALL.\nTakeaway: Systemic therapy is the main treatment for blood cancers.", "l": ["W11 8.1", "W11 8.2"]}, {"c": "Week 12", "p": "Leo, 22, needs radiation to his pelvic and inguinal nodes for lymphoma. Which late effect should he be counselled about because of this field?", "o": ["Hypothyroidism", "Radiation pneumonitis", "L'Hermitte's sign", "Infertility"], "a": 3, "e": "Correct: D. Infertility is a late effect when the testicles or ovaries are in the radiation field. As in your Week 12 quiz, it is not expected from mediastinal radiation.\nA: Hypothyroidism follows radiation that includes the thyroid.\nB: Pneumonitis follows mediastinal radiation.\nC: L'Hermitte's sign follows radiation near the spinal cord in the neck.\nTakeaway: Late effects: hypothyroidism, zoster, infertility, second cancers.", "l": ["W12 12.3"]}, {"c": "Week 11", "p": "Alan, 58, has had fevers and night sweats for 6 weeks and has a new heart murmur. His WBC is mildly high, with a raised monocyte count and normal neutrophils. Which benign cause fits his leukocytosis?", "o": ["Drug reaction to penicillin", "Hypothyroidism", "Bacterial endocarditis", "Parasitic infection"], "a": 2, "e": "Correct: C. Monocytosis has listed benign causes that include chronic infection such as TB and bacterial endocarditis. His murmur and fevers point to endocarditis.\nA: A penicillin reaction causes eosinophilia.\nB: Hypothyroidism causes basophilia.\nD: Parasitic infections cause eosinophilia.\nTakeaway: Match each raised white cell to its benign causes.", "l": ["W11 1.1"]}, {"c": "Week 11", "p": "Patient A, 16, has pancytopenia and a fatty marrow with 15% cellularity. No infection, drug or cancer is found. Patient B, 74, has pancytopenia, macrocytosis and dysplasia in two cell lines on the marrow. Which diagnosis fits each patient, in order?", "o": ["A aplastic anemia, B myelodysplastic syndrome", "Both have acute myeloid leukemia", "A myelodysplastic syndrome, B aplastic anemia", "A Fanconi anemia, B acute myeloid leukemia"], "a": 0, "e": "Correct: A. A hypocellular, fatty marrow with no cause fits aplastic anemia, which is not a cancer. Dysplasia in an older adult fits MDS, which is far more common in the elderly.\nB: Neither marrow shows blasts.\nC: This reverses the pair.\nD: Fanconi anemia has physical features such as triphalangeal thumbs, and AML shows blasts.\nTakeaway: Pancytopenia: low production, high destruction or sequestration.", "l": ["W11 9.1", "W11 9.4"]}, {"c": "Week 12", "p": "Ada, 70, has multiple myeloma and keeps getting chest infections. Her neutrophils are low and her normal immunoglobulins are reduced. Which supportive therapies fit?", "o": ["Bisphosphonates and IV hydration", "Vertebroplasty and kyphoplasty", "Packed red cells and recombinant EPO", "Prophylactic antibiotics, G-CSF and IgG"], "a": 3, "e": "Correct: D. For neutropenia in myeloma, use antibiotic prophylaxis, SC G-CSF and IV or SC polyclonal IgG. Infections come from neutropenia and a weakened immune system.\nA: Bisphosphonates and hydration treat hypercalcemia.\nB: Vertebroplasty and kyphoplasty treat bone pain and fractures.\nC: Red cells and EPO treat anemia.\nTakeaway: Match each myeloma complication to its supportive therapy.", "l": ["W12 8.6", "W12 8.3"]}, {"c": "Week 9", "p": "Omar, 30, of Mediterranean descent, starts a sulfonamide antibiotic. Three days later he is jaundiced. The film shows bite cells and Heinz bodies, and the DAT is negative. Which plan is best?", "o": ["Start steroids for immune hemolysis", "Arrange a splenectomy this week", "Stop the drug and give folate", "Begin IV iron for the anemia"], "a": 2, "e": "Correct: C. Bite cells and Heinz bodies after a sulfonamide fit G6PD deficiency, an X-linked disorder. Management is to avoid the precipitant and give folate, with splenectomy only in severe cases.\nA: The DAT is negative, so this is not immune hemolysis.\nB: Splenectomy is kept for severe cases.\nD: IV iron is for iron deficiency with poor absorption or rapid loss.\nTakeaway: G6PD triggers: infections, antimalarials, sulfonamides, ASA, fava beans.", "l": ["W9 6.3", "W9 6.1"]}, {"c": "Week 9", "p": "Edward, 78, lives alone, drinks heavily and eats poorly. Hb is 98 g/L, MCV 110 fL, homocysteine is high and methylmalonic acid is normal. Which treatment best fits?", "o": ["Folic acid 0.4 mg daily", "Oral folate 1-5 mg daily", "Oral iron 60 mg daily", "IM cobalamin 100 mcg daily"], "a": 1, "e": "Correct: B. A high homocysteine with a normal MMA points to folate deficiency, and alcoholism and old age are listed causes. Treatment is oral folate 1 to 5 mg.\nA: 0.4 mg is the pregnancy dose.\nC: He has a macrocytic anemia, not iron deficiency.\nD: IM cobalamin treats B12 deficiency, which would raise the MMA too.\nTakeaway: Folate stores last months. B12 stores last years.", "l": ["W9 7.6", "W9 8.3"]}, {"c": "Week 9", "p": "Theo, 22, has Hb 96 g/L, a high reticulocyte count and spherocytes on his film. The DAT is negative and his father has the same anemia. Which belong in his management?\ni) Folate supplementation\nii) Vaccination for encapsulated bacteria\niii) Oral penicillin prophylaxis\niv) Avoiding the cold", "o": ["i) and ii) only", "ii), iii) and iv) only", "i), ii) and iii) only", "All of the above"], "a": 2, "e": "Correct: C. Spherocytes with a negative DAT and an affected parent fit hereditary spherocytosis. Its management includes folate, vaccination for encapsulated bacteria and oral penicillin, with splenectomy in severe cases.\nA: This leaves out oral penicillin prophylaxis.\nB: Avoiding the cold is management for cold AIHA.\nD: Statement iv) belongs to cold AIHA.\nTakeaway: Hereditary spherocytosis is autosomal dominant.", "l": ["W9 6.3", "W9 3.5"]}, {"c": "Week 11", "p": "Martin, 58, has primary myelofibrosis with a large spleen, teardrop cells and transfusion-dependent anemia. He is fit. Which therapy offers a cure?", "o": ["Supportive red cell transfusions", "Hydroxyurea for cytoreduction", "Ruxolitinib, a JAK inhibitor", "Allogeneic stem cell transplant"], "a": 3, "e": "Correct: D. Allogeneic stem cell transplantation is the curative option in myelofibrosis. Other therapies control symptoms and improve quality of life.\nA: Transfusions are supportive care.\nB: Hydroxyurea is a conventional therapy for symptom control.\nC: Ruxolitinib is a newer drug for symptom control.\nTakeaway: Teardrop cells: myelofibrosis or marrow infiltration, as in your Week 11 quiz.", "l": ["W11 8.7", "W11 6.3"]}, {"c": "Week 9", "p": "Arthur, 67, has a mechanical aortic valve with a paravalvular leak. He is tired, with a high LDH, high indirect bilirubin, low haptoglobin and schistocytes. His platelets are normal. What is the most likely cause?", "o": ["Shear stress from his valve", "Paroxysmal nocturnal hemoglobinuria", "Hereditary spherocytosis", "Warm autoimmune hemolytic anemia"], "a": 0, "e": "Correct: A. Mechanical valves cause intravascular hemolysis from high shear stress, especially with damaged valves or paravalvular leaks, and give schistocytes.\nB: PNH is a clonal PIGA disorder, not a valve problem.\nC: Hereditary spherocytosis is inherited and shows spherocytes.\nD: Warm AIHA shows spherocytes and a positive DAT.\nTakeaway: Schistocytes with normal platelets: think of a mechanical cause.", "l": ["W9 6.1", "W9 6.4"]}, {"c": "Week 11", "p": "Iris, 34, started an antithyroid drug 6 weeks ago. She now has a sore throat and an ANC of 0.4 × 10⁹/L. Her Hb and platelets are normal. How is her neutropenia best classified?", "o": ["Moderate neutropenia from low B12", "Severe neutropenia from a drug", "Severe congenital neutropenia", "Mild neutropenia from a virus"], "a": 1, "e": "Correct: B. An ANC below 0.5 is severe. Antithyroid drugs are listed toxins that cause acquired neutropenia.\nA: Moderate is 0.5 to 0.99, and nothing points to B12 deficiency.\nC: Her neutropenia began after a new drug, which points to an acquired cause.\nD: Mild is 1 to 1.5, and her ANC is 0.4.\nTakeaway: Neutropenia: ANC below 1.5. Severe below 0.5.", "l": ["W11 2.2", "W11 2.1"]}, {"c": "Week 10", "p": "Which statement about secondary hemostasis is correct?", "o": ["Factor XII is required for clotting in the body", "Factor IXa and Va form the tenase complex", "Factor Xa and Va form the prothrombinase complex", "Tissue factor binds factor VIII to start clotting"], "a": 2, "e": "Correct: C. Factor Xa and Va, with calcium and a phospholipid surface, form the prothrombinase complex that turns prothrombin into large amounts of thrombin.\nA: Factor XII plays a minor role and is not required in the body.\nB: The tenase complex is factor IXa with VIIIa.\nD: Tissue factor binds factor VIIa.\nTakeaway: Vitamin K dependent factors: X, IX, VII, II, as in your Week 10 quiz.", "l": ["W10 2.1"]}, {"c": "Week 11", "p": "Monica, 34, has heavy periods. Her platelet count is 620 × 10⁹/L, Hb 102 g/L, MCV 72 fL and ferritin is low. JAK2, CALR and MPL are negative. What is the most likely cause of her high platelets?", "o": ["Iron deficiency driving a reactive rise", "Chronic myeloid leukemia in chronic phase", "Polycythemia vera with a high red cell mass", "Essential thrombocythemia, a platelet cancer"], "a": 0, "e": "Correct: A. Secondary thrombocytosis is more common than primary, and iron-deficiency anemia and hemorrhage are listed causes. Treat the underlying cause.\nB: CML shows a high WBC with basophilia and eosinophilia.\nC: PV is an erythrocytosis with a high Hb, and hers is low.\nD: ET needs reactive causes ruled out and is usually JAK2, CALR or MPL positive.\nTakeaway: ET carries a risk of both bleeding and thrombosis, as in your Week 11 quiz.", "l": ["W11 5.2", "W11 5.3"]}, {"c": "Week 10", "p": "Jacob, 35, has a platelet count of 38 on a routine CBC drawn in a lavender top tube. He has no bruising or bleeding, and his film shows platelet clumps. What is the most likely explanation?", "o": ["Thrombotic thrombocytopenic purpura", "EDTA-dependent platelet clumping", "Splenic sequestration", "Immune thrombocytopenia"], "a": 1, "e": "Correct: B. Pre-formed antibodies bind platelets in the presence of EDTA, the lavender top tube. The clumps are miscounted by the Coulter counter, giving a falsely low count.\nA: TTP shows schistocytes in a very sick patient.\nC: Sequestration needs an enlarged spleen.\nD: ITP is a diagnosis of exclusion and does not cause clumps on the film.\nTakeaway: Always look at the film before treating a low platelet count.", "l": ["W10 3.3", "W10 3.1"]}, {"c": "Week 10", "p": "Which anticoagulant works by inhibiting vitamin K epoxide reductase (VKORC1)?", "o": ["Fondaparinux", "Argatroban", "Dabigatran", "Rivaroxaban", "Warfarin"], "a": 4, "e": "Correct: E. Warfarin inhibits vitamin K epoxide reductase (VKORC1), which lowers the vitamin K dependent factors.\nA: Fondaparinux is a synthetic pentasaccharide that works through antithrombin.\nB: Argatroban targets the active site of thrombin.\nC: Dabigatran targets the active site of thrombin.\nD: Rivaroxaban is a direct Xa inhibitor.\nTakeaway: Indirect drugs need antithrombin. Direct drugs do not.", "l": ["W10 7.1"]}, {"c": "Week 11", "p": "Selena, 40, has relapsed Hodgkin lymphoma and starts an immune checkpoint inhibitor. Weeks later she develops severe diarrhea from colitis. Which treatment fits this toxicity?", "o": ["Leukapheresis", "Rasburicase", "Desferoxamine", "Glucocorticoids"], "a": 3, "e": "Correct: D. Checkpoint inhibitors such as pembrolizumab bind PD1 or PDL1 and take the brakes off the immune system. Their toxicities, including colitis, are treated with glucocorticoids.\nA: Leukapheresis treats leukostasis.\nB: Rasburicase treats tumour lysis syndrome.\nC: Desferoxamine is an iron chelator.\nTakeaway: Checkpoint toxicities: colitis, pneumonitis, rash, hepatitis, hypophysitis, nephritis.", "l": ["W11 8.6"]}, {"c": "Week 11", "p": "Walter, 76, has a macrocytic anemia. His marrow shows dysplastic precursors with ring sideroblasts. Which molecular mutation is often seen in this setting?", "o": ["PML/RARα", "SF3B1", "JAK2 V617F", "BCR-ABL"], "a": 1, "e": "Correct: B. SF3B1 mutations are often seen in MDS with ring sideroblasts, as in your Week 11 Jeopardy deck.\nA: PML/RARα is the fusion gene of APL.\nC: JAK2 V617F drives most PV and many ET and PMF cases.\nD: BCR-ABL comes from t(9;22) in CML.\nTakeaway: MDS with del(5q) is treated with lenalidomide.", "l": ["W11 9.6"]}, {"c": "Week 11", "p": "Which pairings of targeted therapy and disease are correct?\ni) Rituximab and B-cell lymphomas\nii) Imatinib and CML\niii) ATRA and APL\niv) Bortezomib and CLL", "o": ["i) and iii) only", "ii), iii) and iv) only", "i), ii) and iii) only", "All of the above"] const L = "ABCDE";
const N = QUESTIONS.length;
let cur = 0, showResults = false;
let ans = new Array(N).fill(null);           // current pick per question
let tries = QUESTIONS.map(()=>[]);           // every locked attempt: {pick, ok, at}

const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");

function score(){ return ans.reduce((n,a,i)=>n+(a!==null&&a===QUESTIONS[i].a?1:0),0); }
function answered(){ return ans.filter(a=>a!==null).length; }
function firstTryScore(){ return tries.reduce((n,t)=>n+(t.length&&t[0].ok?1:0),0); }
function firstTryCount(){ return tries.filter(t=>t.length).length; }

function renderHeader(){
  const bf=$("#barfill"); if(bf) bf.style.width=(100*answered()/N)+"%";

  $("#ticks").innerHTML = QUESTIONS.map((q,i)=>{
    const st = ans[i]===null?"":(ans[i]===q.a?"ok":"bad");
    const redo = tries[i].length>1 || (ans[i]===null && tries[i].length>0);
    return `<button class="tick ${st} ${redo?"redo":""} ${(!showResults&&i===cur)?"cur":""}" data-i="${i}" aria-label="Question ${i+1}"></button>`;
  }).join("");
  document.querySelectorAll(".tick").forEach(b=>b.onclick=()=>{cur=+b.dataset.i;showResults=false;render();});
}

function triesLine(i, includeCurrent){
  const t = includeCurrent ? tries[i] : tries[i];
  if(!t.length) return "";
  const parts = t.map((x,k)=>`<span class="${x.ok?"ok":"bad"}">${k+1}: ${L[x.pick]} ${x.ok?"correct":"wrong"}</span>`).join(" · ");
  return `<div class="tries">Attempts ${parts}</div>`;
}

function fmtLine(t){
  let m;
  if((m=t.match(/^Correct:\s*([A-E])\.?\s*(.*)$/)) || (m=t.match(/^([A-E]) is correct\.?\s*(.*)$/)))
    return `<p class="why"><span class="lk ok">${m[1]}</span><span>${esc(m[2])}</span></p>`;
  if((m=t.match(/^([A-E]):\s*(.*)$/)))
    return `<p class="alt"><span class="lk">${m[1]}</span><span>${esc(m[2])}</span></p>`;
  if((m=t.match(/^(Takeaway|High yield|High-yield|Key point|Clues):\s*(.*)$/i)))
    return `<p class="take"><b>${esc(m[1])}.</b> ${esc(m[2])}</p>`;
  return `<p>${esc(t)}</p>`;
}

function renderQ(){
  const q = QUESTIONS[cur], a = ans[cur], done = a!==null, st = strikes[cur];
  const opts = q.o.map((o,i)=>{
    let c = "";
    if(done){ if(i===q.a) c="right"; else if(i===a) c="wrong"; }
    const struck = !done && st.includes(i);
    const strikeBtn = done ? "" : `<button class="strike" data-s="${i}" aria-pressed="${struck}" aria-label="${struck?"Restore":"Strike out"} option ${L[i]}" title="${struck?"Restore":"Strike out"} option">${struck?"↺":"✕"}</button>`;
    return `<div class="optrow ${struck?"struck":""}"><button class="opt ${c}" data-i="${i}" ${done?"disabled":""}><span class="k">${L[i]}</span><span>${esc(o)}</span></button>${strikeBtn}</div>`;
  }).join("");
  let fb = "";
  if(done){
    const ok = a===q.a;
    const lines = q.e.split("\n").map(fmtLine).join("");
    const objs = q.l.map(id=>`<div class="obj"><b>Objective ${esc(id)}</b> ${esc(OBJECTIVES[id]||"")}</div>`).join("");
    fb = `<div class="fb" role="status"><div class="verdict ${ok?"ok":"bad"}">${ok?"Correct.":"Incorrect. The answer is "+L[q.a]+"."}</div>${lines}${objs}${triesLine(cur)}<div class="fbtools"><button class="btn ghost" id="redo">Reset and redo this question</button></div></div>`;
  }
  const pre = (!done && tries[cur].length) ? `<div class="hint">Redo. Your earlier attempts are saved.</div>${triesLine(cur)}` : (!done ? `<div class="hint">Tap ✕ to strike out an option. Right-click works too.</div>` : "");
  const last = cur===N-1;
  $("#main").innerHTML = `<article class="card">
    <div class="chead"><span class="tag">${esc(q.c)}</span><span class="chead-r">${ankiButton(cur)}<span class="qn">${cur+1} of ${N}</span></span></div>
    <p class="stem">${esc(q.p)}</p>
    ${pre}
    <div class="opts">${opts}</div>${fb}
    <div class="nav"><button class="btn ghost" id="prev" ${cur===0?"disabled":""}>Previous</button>
    <button class="btn" id="next" ${done?"":"disabled"}>${last?"See results":"Next"}</button></div>
  </article>`;
  document.querySelectorAll(".opt").forEach(b=>{
    b.onclick=()=>{ const p=+b.dataset.i; ans[cur]=p; tries[cur].push({pick:p, ok:p===q.a, at:new Date().toISOString()}); tries[cur]=tries[cur].slice(-10); strikes[cur]=[]; render(false); persist(); };
    b.oncontextmenu=(e)=>{ if(done) return; e.preventDefault(); toggleStrike(+b.dataset.i); };
  });
  document.querySelectorAll(".strike").forEach(b=>b.onclick=()=>toggleStrike(+b.dataset.s));
  const ab=$("#anki"); if(ab) ab.onclick=()=>ankiToggle(cur);
  const r=$("#redo"); if(r) r.onclick=()=>{ ans[cur]=null; strikes[cur]=[]; render(false); persist(); };
  $("#prev").onclick=()=>{cur--;render();};
  $("#next").onclick=()=>{ if(last){showResults=true;} else cur++; render(); };
}

function toggleStrike(i){
  const s = strikes[cur], k = s.indexOf(i);
  if(k<0) s.push(i); else s.splice(k,1);
  render(false); persist();
}

function renderResults(){
  const s = score(), pct = Math.round(100*s/N);
  const cats = {};
  QUESTIONS.forEach((q,i)=>{ cats[q.c]=cats[q.c]||[0,0]; cats[q.c][1]++; if(ans[i]===q.a) cats[q.c][0]++; });
  const rows = Object.entries(cats).map(([c,[r,t]])=>`<tr><td>${esc(c)}<span class="meter"><i style="width:${Math.round(100*r/t)}%"></i></span></td><td>${r} / ${t}</td></tr>`).join("");
  const missed = {};

  const weeks = Object.keys(missed).sort((x,y)=>parseInt(x.slice(1))-parseInt(y.slice(1)));
  const missHtml = weeks.length ? weeks.map(w=>`<h3>Week ${w.slice(1)}</h3><ul class="miss">${[...missed[w]].map(id=>`<li><code>${esc(id)}</code>${esc(OBJECTIVES[id]||"")}</li>`).join("")}</ul>`).join("") : "<p>No missed objectives.</p>";
  const redone = tries.filter(t=>t.length>1).length;
  const un = N - answered();
  $("#main").innerHTML = `<article class="card">
    <div class="chead"><span class="tag">Results</span><span>${un?un+" unanswered":"Complete"}</span></div>
    <div><div class="big">${s} / ${N}</div><div class="stats"><span><b>${pct}%</b> correct now</span><span>First try <b>${firstTryScore()} / ${firstTryCount()}</b></span><span>Redone <b>${redone}</b></span></div></div>
    <table><thead><tr><th>Topic</th><th>Score</th></tr></thead><tbody>${rows}</tbody></table>
    ${ankiMissedRow()}<h2>Objectives to review</h2><p class="hint">Includes questions you missed on the first try, even if a redo got them right.</p>${missHtml}${history.length?`<h2>Past attempts</h2><table><thead><tr><th>Date</th><th>Score</th></tr></thead><tbody>${history.slice().reverse().map(h=>`<tr><td>${new Date(h.date).toLocaleDateString()}</td><td>${h.score} / ${h.total}</td></tr>`).join("")}</tbody></table>`:""}
    <div class="nav"><button class="btn ghost" id="back">Back to questions</button><button class="btn" id="restart">Restart all</button></div>
  </article>`;
  $("#back").onclick=()=>{showResults=false;render();};
  const am=$("#ankimissed"); if(am) am.onclick=()=>{ ankiAdd(missedIdx()); renderResults(); };
  $("#restart").onclick=()=>{
    if(answered() || tries.some(t=>t.length)){
      history.push({date:new Date().toISOString(), score:score(), answered:answered(), total:N, firstTry:firstTryScore(),
        missed:QUESTIONS.map((q,i)=>ans[i]!==null&&ans[i]!==q.a?"q"+(i+1):null).filter(Boolean)});
      history=history.slice(-20);
    }
    ans.fill(null); tries=QUESTIONS.map(()=>[]); strikes=QUESTIONS.map(()=>[]); cur=0; showResults=false; render(); persist();
  };
}

function setSave(text, cls){ const el=$("#save"); if(el){ el.textContent=text; el.className="save "+(cls||""); } }
function bodyOf(){
  const a = {};
  QUESTIONS.forEach((q,i)=>{
    if(ans[i]===null && !tries[i].length && !strikes[i].length) return;
    a["q"+(i+1)] = {pick:ans[i], ok:ans[i]!==null && ans[i]===q.a, l:q.l, tries:tries[i], strikes:strikes[i]};
  });
  return {answers:a, history, total:N, answered:answered(), score:score(), firstTry:firstTryScore(), updatedAt:new Date().toISOString()};
}
function validPick(i,p){ return Number.isInteger(p) && p>=0 && p<QUESTIONS[i].o.length; }
function applySaved(d){
  if(!d || typeof d!=="object") return;
  ans.fill(null); tries=QUESTIONS.map(()=>[]); strikes=QUESTIONS.map(()=>[]);
  const a = d.answers || {};
  for(const k in a){
    const i = parseInt(k.slice(1),10)-1, row = a[k];
    if(!(i>=0 && i<N) || !row || typeof row!=="object") continue;
    if(validPick(i,row.pick)) ans[i]=row.pick;
    if(Array.isArray(row.tries)) tries[i]=row.tries.filter(t=>t&&validPick(i,t.pick)).map(t=>({pick:t.pick, ok:t.pick===QUESTIONS[i].a, at:String(t.at||"")})).slice(-10);
    else if(ans[i]!==null) tries[i]=[{pick:ans[i], ok:ans[i]===QUESTIONS[i].a, at:""}];
    if(Array.isArray(row.strikes)) strikes[i]=row.strikes.filter(x=>validPick(i,x));
  }
  history = Array.isArray(d.history) ? d.history.slice(-20) : [];
  const first = ans.findIndex(x=>x===null); cur = first<0 ? N-1 : first;
}
function lsLoad(){ try{ return JSON.parse(localStorage.getItem(LS_KEY)||"null"); }catch(e){ return null; } }
function lsSave(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(bodyOf())); }catch(e){} }
async function persist(){
  lsSave();
  if(!db || !uid) return;
  dirty = true; if(writing) return; writing = true;
  while(dirty){
    dirty = false;
    setSave("Saving…");
    try{ await db.doc("attempts/"+uid).set(bodyOf()); setSave("Progress saved to your account.","ok"); }
    catch(e){
      if(e && e.code==="invalid_argument"){ db=null; setSave("Progress saves in this browser only.","bad"); break; }
      setSave("Could not save to your account. Progress saves in this browser.","bad");
    }
  }
  writing = false;
}
async function connect(){
  try{
    if(!window.claude || !window.claude.use) return;
    const [u, d] = await Promise.all([window.claude.use("user"), window.claude.use("db")]);
    if(!u || !d) return;
    const id = await u.id(); if(!id) return;
    db = d; uid = id;
    const snap = await db.doc("attempts/"+uid).get();
    if(snap.exists){ applySaved(snap.data()); render(); setSave("Progress saved to your account.","ok"); }
    else if(answered() || tries.some(t=>t.length)){ persist(); }
    else setSave("Progress saves to your account.","ok");
  }catch(e){ /* keep local-only mode */ }
}

function ankiPut(cards){ try{ localStorage.setItem(ANKI_KEY, JSON.stringify({v:1, cards})); return true; }catch(e){ setSave("Could not save to Anki. Browser storage is full or blocked.","bad"); return false; } }
function ankiId(i){ return SET.slug+"#"+(i+1); }
function ankiCard(i){
  const q=QUESTIONS[i];
  return {id:ankiId(i), slug:SET.slug, set:SET.title, b:SET.b, href:SET.href, n:i+1, c:q.c, p:q.p, o:q.o, a:q.a, e:q.e, l:q.l, obj:q.l.map(x=>OBJECTIVES[x]||"")};
}
function ankiHas(i, cards){ return (cards||ankiAll()).some(c=>c.id===ankiId(i)); }
function ankiButton(i){ const s=ankiHas(i); return `<button class="ankibtn" id="anki" aria-pressed="${s}" title="${s?"Remove from":"Add to"} your Anki list">${s?"Saved to Anki":"Save to Anki"}</button>`; }
function ankiToggle(i){
  let cards=ankiAll();
  if(ankiHas(i,cards)) cards=cards.filter(c=>c.id!==ankiId(i));
  else cards.push(Object.assign(ankiCard(i), {at:new Date().toISOString()}));
  ankiPut(cards); render(false);
}
function ankiAdd(list){
  const cards=ankiAll(), have=new Set(cards.map(c=>c.id)), at=new Date().toISOString();
  list.forEach(i=>{ if(!have.has(ankiId(i))) cards.push(Object.assign(ankiCard(i), {at})); });
  ankiPut(cards);
}
function missedIdx(){ return QUESTIONS.map((q,i)=>((ans[i]!==null && ans[i]!==q.a) || (tries[i].length && !tries[i][0].ok)) ? i : -1).filter(i=>i>=0); }
function ankiMissedRow(){
  const m=missedIdx(); if(!m.length) return "";
  const cards=ankiAll(), left=m.filter(i=>!ankiHas(i,cards)).length;
  return `<div class="ankirow">${left ? `<button class="btn ghost" id="ankimissed">Save ${left} missed question${left===1?"":"s"} to Anki</button>` : `<span class="hint">All ${m.length} missed questions are in your Anki list.</span>`}</div>`;
}
/* Keep saved copies current when a question is corrected, without touching review progress. */
function ankiRefresh(){
  const cards=ankiAll(); let changed=false;
  cards.forEach(c=>{
    if(c.slug!==SET.slug) return;
    const i=c.n-1; if(!(i>=0 && i<N)) return;
    const fresh=ankiCard(i);
    for(const k of ["set","b","href","c","p","o","a","e","l","obj"]) if(JSON.stringify(c[k])!==JSON.stringify(fresh[k])){ c[k]=fresh[k]; changed=true; }
  });
  if(changed) ankiPut(cards);
}
addEventListener("storage", e=>{ if(e.key===ANKI_KEY) render(false); });

function render(top=true){ renderHeader(); showResults?renderResults():renderQ(); if(top) window.scrollTo({top:0}); }
applySaved(lsLoad());
ankiRefresh();
render();
connect();
</script>

</body></html>
