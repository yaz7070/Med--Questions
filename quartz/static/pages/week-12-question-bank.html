<title>Week 12 Question Bank</title>

<style>
/* Nexus quiz page. Matches the site: neutral greys, one typeface, and the block's colour as --accent. */
:root{
  --bg:#f5f6f8;--paper:#ffffff;--ink:#15181d;--muted:#4d5560;--faint:#7b828d;--line:#e0e3e8;
  --accent:#0b7a75;--soft:#eef0f3;
  --ok:#1d7a46;--okw:#e7f4ec;--bad:#b42318;--badw:#fcecea;--tick:#dfe2e7;
  --display:"Atkinson Hyperlegible Next","Segoe UI",system-ui,-apple-system,sans-serif;
  --body:"Atkinson Hyperlegible Next","Segoe UI",system-ui,-apple-system,sans-serif;
  --r:8px;
}
:root[data-b="2"]{--accent:#4f46c8}:root[data-b="3"]{--accent:#a3246b}:root[data-b="4"]{--accent:#a35f08}
:root[data-theme="dark"]{
  --bg:#14161a;--paper:#1b1e24;--ink:#eceef2;--muted:#b3bac5;--faint:#8a919c;--line:#2d323b;
  --accent:#45c2b8;--soft:#252930;
  --ok:#5ccf8f;--okw:#13301f;--bad:#f2877c;--badw:#3a1c1a;--tick:#30353e;color-scheme:dark}
:root[data-theme="dark"][data-b="2"]{--accent:#a49df6}:root[data-theme="dark"][data-b="3"]{--accent:#ef8ec0}:root[data-theme="dark"][data-b="4"]{--accent:#e3a548}
.btn:hover:not(:disabled){filter:brightness(.92)}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55}
.wrap{max-width:820px;margin:0 auto;padding-block:28px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:20px}

/* Header */
header{display:flex;flex-direction:column;gap:10px}
.context{margin:0;color:var(--faint);font-size:14px;font-weight:600}
h1{font-family:var(--display);font-weight:700;font-size:clamp(28px,5vw,40px);line-height:1.05;letter-spacing:-.02em;margin:0;text-wrap:balance}
.stats{display:flex;flex-wrap:wrap;gap:6px 22px;font-size:15px;color:var(--muted);font-variant-numeric:tabular-nums}
.stats b{color:var(--ink);font-weight:700}
.bar{height:6px;border-radius:999px;background:var(--tick);overflow:hidden}
.bar span{display:block;height:100%;width:0;background:var(--accent);border-radius:999px;transition:width .25s ease}
.map summary{cursor:pointer;color:var(--accent);font-weight:600;font-size:14px;width:max-content;list-style:none;padding:2px 0}
.map summary::-webkit-details-marker{display:none}
.map summary::before{content:"▸";display:inline-block;margin-right:6px;transition:transform .15s ease}
.map[open] summary::before{transform:rotate(90deg)}
.map summary:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:4px}
.ticks{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}
.tick{width:14px;height:14px;border:0;border-radius:4px;background:var(--tick);padding:0;cursor:pointer}
.tick:hover{background:var(--faint)}
.tick.ok{background:var(--ok)}.tick.bad{background:var(--bad)}
.tick.cur{outline:2px solid var(--accent);outline-offset:2px}
.tick.redo{box-shadow:inset 0 -3px 0 var(--accent)}
.tick:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.saverow{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.save{font-size:13px;color:var(--faint)}
.resetbtn{font:inherit;font-size:13px;font-weight:700;color:var(--muted);background:none;border:1px solid var(--line);border-radius:6px;padding:3px 10px;cursor:pointer}
.resetbtn:hover{color:var(--bad);border-color:var(--bad)}
.resetbtn.armed{color:#fff;background:var(--bad);border-color:var(--bad)}
.resetbtn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.save.ok{color:var(--ok)}.save.bad{color:var(--bad)}

/* Question card */
.card{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:26px;display:flex;flex-direction:column;gap:18px}
.chead{display:flex;justify-content:space-between;align-items:center;gap:10px}
.tag{font-size:13px;font-weight:700;color:var(--accent);background:var(--soft);padding:3px 9px;border-radius:4px}
.chead-r{display:flex;align-items:center;gap:12px}
.ankibtn{font:inherit;font-size:13.5px;font-weight:700;color:var(--muted);background:transparent;border:1.5px solid var(--line);border-radius:6px;padding:4px 10px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.ankibtn::before{content:"";width:9px;height:11px;background:currentColor;clip-path:polygon(0 0,100% 30%,0 60%);border-left:2px solid currentColor;box-sizing:content-box}
.ankibtn:hover{border-color:var(--accent);color:var(--accent)}
.ankibtn[aria-pressed="true"]{border-color:var(--accent);background:var(--soft);color:var(--accent)}
.ankibtn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ankirow{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.qn{font-family:var(--display);font-weight:700;font-size:15px;color:var(--faint);font-variant-numeric:tabular-nums}
.stem{font-size:18.5px;line-height:1.6;margin:0;white-space:pre-line;max-width:70ch}
.hint{font-size:13px;color:var(--faint)}
.tries{font-size:13px;color:var(--muted)}
.tries .bad{color:var(--bad);font-weight:600}.tries .ok{color:var(--ok);font-weight:600}

/* Options */
.opts{display:flex;flex-direction:column;gap:10px}
.optrow{display:flex;gap:8px;align-items:stretch}
.optrow .opt{flex:1;min-width:0}
.opt{display:flex;gap:14px;align-items:center;text-align:left;width:100%;background:var(--paper);color:var(--ink);border:1.5px solid var(--line);border-radius:var(--r);padding:12px 16px;font:inherit;font-size:16.5px;line-height:1.45;cursor:pointer;transition:border-color .12s ease,background .12s ease}
.opt:hover:not(:disabled){border-color:var(--accent);background:var(--soft)}
.opt:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.opt:disabled{cursor:default}
.opt .k{flex:none;display:inline-grid;place-items:center;width:30px;height:30px;border-radius:6px;background:var(--soft);color:var(--accent);font-family:var(--display);font-weight:700;font-size:14px}
.opt.right{border-color:var(--ok);background:var(--okw)}
.opt.right .k{background:var(--ok);color:var(--paper)}
.opt.wrong{border-color:var(--bad);background:var(--badw)}
.opt.wrong .k{background:var(--bad);color:var(--paper)}
.strike{flex:none;width:44px;border:1.5px solid var(--line);border-radius:var(--r);background:var(--paper);color:var(--faint);font-size:14px;cursor:pointer;display:grid;place-items:center}
.strike:hover{border-color:var(--accent);color:var(--accent)}
.strike:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.strike[aria-pressed="true"]{background:var(--soft);color:var(--ink)}
.optrow.struck .opt > span:last-child{text-decoration:line-through;color:var(--faint)}
.optrow.struck .opt .k{opacity:.45}

/* Feedback */
.fb{background:var(--bg);border-radius:var(--r);padding:18px 20px;display:flex;flex-direction:column;gap:10px}
.verdict{font-family:var(--display);font-weight:700;font-size:18px;display:flex;align-items:center;gap:8px}
.verdict::before{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;font-size:13px;color:var(--paper)}
.verdict.ok{color:var(--ok)}.verdict.ok::before{content:"✓";background:var(--ok)}
.verdict.bad{color:var(--bad)}.verdict.bad::before{content:"✕";background:var(--bad)}
.fb p{margin:0;max-width:72ch}
.fb .why,.fb .alt{display:flex;gap:10px;align-items:baseline}
.fb .why{font-weight:600}
.lk{flex:none;display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--line);color:var(--muted);font-family:var(--display);font-weight:700;font-size:12px;transform:translateY(-1px)}
.lk.ok{background:var(--ok);color:var(--paper)}
.fb .alt{color:var(--muted)}
.fb .take{border-left:3px solid var(--accent);padding:2px 0 2px 12px;color:var(--ink)}
.fb .take b{color:var(--accent)}
.obj{font-size:13.5px;color:var(--faint);line-height:1.5}
.obj b{color:var(--muted)}
.fbtools{display:flex;justify-content:flex-end}
.offrow{display:flex;justify-content:flex-start}
.offbtn{font:inherit;font-size:13.5px;color:var(--faint);background:none;border:0;padding:2px 0;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.offbtn:hover{color:var(--bad)}
.offbtn[aria-pressed="true"]{color:var(--bad);font-weight:700}
.offbtn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* Buttons */
.nav{display:flex;justify-content:space-between;gap:10px}
.btn{font-family:var(--display);font-weight:700;font-size:15px;padding:10px 20px;border:1.5px solid var(--accent);border-radius:6px;background:var(--accent);color:var(--paper);cursor:pointer}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.ghost:hover:not(:disabled){background:var(--soft);color:var(--accent);border-color:var(--accent)}
.btn:disabled{opacity:.35;cursor:default}
.btn:focus-visible{outline:2px solid var(--ink);outline-offset:3px}

/* Results */
.big{font-family:var(--display);font-size:clamp(48px,9vw,72px);font-weight:700;line-height:1;letter-spacing:-.03em;color:var(--accent);font-variant-numeric:tabular-nums}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
td,th{text-align:left;padding:9px 0;border-bottom:1px solid var(--line);font-size:15px;vertical-align:middle}
th{font-size:13px;font-weight:700;color:var(--faint)}
td:last-child,th:last-child{text-align:right;white-space:nowrap;padding-left:12px}
.meter{display:block;height:5px;border-radius:999px;background:var(--tick);margin-top:6px;max-width:320px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent);border-radius:999px}
h2{font-family:var(--display);font-size:21px;font-weight:700;margin:6px 0 0}
h3{font-size:14px;font-weight:700;color:var(--faint);margin:6px 0 0}
.miss{margin:0;padding-left:0;list-style:none;display:flex;flex-direction:column;gap:8px;font-size:15px}
.miss code{font-family:var(--display);font-weight:700;font-size:13px;color:var(--bad);background:var(--badw);padding:1px 7px;border-radius:999px;margin-right:8px}

@media (max-width:560px){.card{padding:18px}.stem{font-size:17.5px}.opt{padding:11px 12px;gap:10px}.strike{width:40px}}
@media (prefers-reduced-motion:no-preference){.fb{animation:in .2s ease-out}@keyframes in{from{opacity:.3;transform:translateY(4px)}to{opacity:1;transform:none}}}
@media (prefers-reduced-motion:reduce){.bar span,.opt,.map summary::before{transition:none}}
</style>

<script>
/* Block colour, and the same light or dark choice as the site's toggle. */

    r.dataset.theme = t || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"); }
  theme(); addEventListener("storage",theme);
})();

<script>
const QUESTIONS = [{"c": "Non-Hodgkin lymphoma", "p": "Jacob, 12, has 3 weeks of a swelling belly, abdominal pain and vomiting. CT shows a large mass in the right lower abdomen. He has lost weight.\n\nHb 118 g/L (ref 115-155)\nWBC 9.6 × 10⁹/L (ref 4-10)\nPlatelets 340 × 10⁹/L (ref 150-450)\nLDH very high\nUric acid high\nBiopsy: sheets of medium-sized B cells with scattered macrophages giving a starry-sky pattern, and very high mitotic activity.\n\nWhat is the most likely diagnosis?", "o": ["Burkitt lymphoma", "Diffuse large B-cell lymphoma", "Acute lymphoblastic leukemia", "Anaplastic large cell lymphoma", "Follicular lymphoma"], "a": 0, "e": "Correct: A. A child with a fast-growing abdominal mass, a very high LDH and a starry-sky pattern has Burkitt lymphoma, from t(8;14) with c-Myc activation.\nB: DLBCL shows sheets of large cells without a starry-sky pattern.\nC: ALL presents with blasts in the blood and marrow failure.\nD: Anaplastic large cell lymphoma has t(2;5) with ALK1.\nE: Follicular lymphoma is indolent and seen in older adults.\nTakeaway: Watch for tumour lysis syndrome when treatment starts.", "l": ["W12 4.6"]}, {"c": "Lymphadenopathy", "p": "Which child most needs further workup for possible malignancy?", "o": ["A 4-year-old with small neck nodes and an ear infection", "A newborn with a 1.5 cm non-tender neck node", "A 5-year-old with tender neck nodes and a sore throat", "A 7-year-old whose 2.5 cm node shrank on antibiotics"], "a": 1, "e": "Correct: B. Non-tender nodes over 1 cm with onset in the neonatal period are a listed concerning feature.\nA: Small nodes with an ear infection fit a reactive cause.\nC: Tender nodes with throat symptoms suggest an infection, and ENT symptoms are reassuring.\nD: Nodes of 2 cm or more are concerning when they grow or fail to resolve after 2 weeks of antibiotics. This one shrank.\nTakeaway: In children, benign causes are more likely the younger the child, except in the neonatal period.", "l": ["W12 3.3", "W12 3.2"]}, {"c": "Biopsy and lab tests", "p": "A fine needle aspirate of an enlarged neck node shows many small lymphocytes. Which limitation of FNA matters most here?", "o": ["It must be done by a surgeon in an operating room", "It is the most expensive of the three sampling methods", "It loses the architecture, so lymphoma cannot be sub-classified", "It carries the highest infection risk of all the sampling options available"], "a": 2, "e": "Correct: C. FNA gives no nodal architecture, so it cannot sub-classify lymphoma. It also cannot separate benign from malignant low grade LPD.\nA: FNA needs no surgeon and no OR.\nB: FNA is the least expensive option.\nD: FNA has a lower risk of infection and complications.\nTakeaway: FNA is easy and cheap but cannot show architecture.", "l": ["W12 1.6"]}, {"c": "Hodgkin lymphoma", "p": "Raymond, 38, noticed a painless lump in his right neck 6 months ago that has grown slowly. He has no fevers, night sweats or weight loss. CT shows only two enlarged nodes in the right neck.\n\nHb 148 g/L (ref 135-170)\nWBC 7.2 × 10⁹/L (ref 4-10)\nPlatelets 260 × 10⁹/L (ref 150-450)\nLDH normal\nNode biopsy: nodular architecture with large cells that have a popcorn appearance, arising from germinal centre B cells.\nStains: CD20 and CD45 positive, CD15 and CD30 negative.\n\nWhat is the most likely diagnosis?", "o": ["Nodular sclerosis Hodgkin lymphoma", "Small lymphocytic lymphoma", "Follicular lymphoma", "Nodular lymphocyte predominant Hodgkin lymphoma", "Diffuse large B-cell lymphoma"], "a": 3, "e": "Correct: D. Popcorn cells that are CD20 and CD45 positive and CD15 and CD30 negative, in a nodular pattern, with early-stage disease and no B symptoms, fit NLPHL, 5% of HL.\nA: Nodular sclerosis shows lacunar cells that are CD15 and CD30 positive and CD20 negative.\nB: SLL is a disease of older adults with smudge cells and blood involvement.\nC: Follicular lymphoma has a follicular pattern without popcorn cells.\nE: DLBCL is a rapidly enlarging mass with loss of node structure.\nTakeaway: NLPHL: mostly early stage, indolent, with an excellent prognosis.", "l": ["W12 4.2", "W12 4.7"]}, {"c": "Staging", "p": "A pathology report calls a lymphoma aggressive. Imaging shows involved nodes on both sides of the diaphragm. Which interpretation is correct?", "o": ["Aggressive describes the stage. Both sides of the diaphragm describes its grade", "Aggressive describes clinical behaviour. Both sides of the diaphragm is stage II", "Aggressive means stage IV. Both sides of the diaphragm confirms bone marrow disease", "Aggressive describes clinical behaviour. Both sides of the diaphragm is stage III"], "a": 3, "e": "Correct: D. Indolent, aggressive and very aggressive describe clinical behaviour. Ann Arbor staging describes spread, and nodes on both sides of the diaphragm is stage III.\nA: This swaps behaviour and stage.\nB: Stage II stays on one side of the diaphragm.\nC: Stage IV means diffuse extralymphatic involvement, and behaviour is not a stage.\nTakeaway: Behaviour describes the tumour. Stage describes where it is.", "l": ["W12 4.3", "W12 5.3"]}, {"c": "Non-Hodgkin lymphoma", "p": "Which statement about prognosis in non-Hodgkin lymphoma is correct?", "o": ["DLBCL of germinal centre type does better than activated B-cell type", "Follicular lymphoma is risk scored with the standard IPI and nothing else", "CLL caught early has a median survival of only 1 to 2 years", "DLBCL is indolent and is usually incurable with treatment"], "a": 0, "e": "Correct: A. DLBCL has a better prognosis if it is of germinal centre B-cell type rather than activated B-cell type.\nB: Follicular lymphoma uses the FLIPI.\nC: Median survival in CLL is 10 to 15 years if caught early.\nD: DLBCL is aggressive but responds well to treatment.\nTakeaway: IPI for DLBCL, FLIPI for follicular.", "l": ["W12 5.4"]}, {"c": "Plasma cell disorders", "p": "Harold, 68, had a serum protein electrophoresis during a workup for mild fatigue, which showed an M protein. He has no bone pain, infections or weight loss.\n\nHb 138 g/L (ref 135-170)\nWBC 6.4 × 10⁹/L (ref 4-10)\nPlatelets 230 × 10⁹/L (ref 150-450)\nCalcium 2.36 mmol/L\nCreatinine 82 µmol/L\nMarrow plasma cells 14%, monoclonal\nSkeletal survey: no lytic lesions.\n\nWhat is the most likely diagnosis?", "o": ["Solitary plasmacytoma", "POEMS syndrome", "Multiple myeloma", "MGUS", "Smoldering myeloma"], "a": 4, "e": "Correct: E. Monoclonal plasma cells of 10% or more in the marrow with no CRAB organ damage and no symptoms is smoldering myeloma.\nA: A plasmacytoma is a single tumour.\nB: POEMS brings neuropathy, organomegaly, endocrine and skin changes.\nC: Multiple myeloma needs organ damage.\nD: MGUS has fewer than 10% plasma cells.\nTakeaway: Smoldering myeloma: close follow-up every 3 to 6 months.", "l": ["W12 7.2", "W12 7.3"]}, {"c": "Plasma cell disorders", "p": "Why is daratumumab, and not rituximab, used as an antibody therapy in multiple myeloma?", "o": ["Rituximab targets CD38, which plasma cells do not carry", "Plasma cells lack CD20, and daratumumab targets CD38", "Plasma cells lack CD38, so only a CD20 antibody works", "Daratumumab targets the CD20 that plasma cells carry"], "a": 1, "e": "Correct: B. Plasma cells do not express CD20, the target of rituximab. Daratumumab targets CD38 and is listed for myeloma.\nA: Rituximab targets CD20.\nC: Plasma cells do not express CD20, so a CD20 antibody would miss them.\nD: Daratumumab targets CD38, and plasma cells do not carry CD20.\nTakeaway: Rituximab is for B-cell lymphomas. Daratumumab is for myeloma.", "l": ["W12 7.1"]}, {"c": "Non-Hodgkin lymphoma", "p": "Arthur, 63, has had painless lumps in his neck, armpits and groin for over a year. They come and go in size. He feels well, with no fevers or weight loss. On exam he has rubbery nodes in all three areas and a palpable spleen.\n\nHb 124 g/L (ref 135-170)\nWBC 4.6 × 10⁹/L (ref 4-10)\nPlatelets 142 × 10⁹/L (ref 150-450)\nLDH normal\nNode biopsy: a follicular pattern of small B cells.\nCytogenetics: t(14;18).\n\nWhat is the most likely diagnosis?", "o": ["Burkitt lymphoma", "Diffuse large B-cell lymphoma", "Mantle cell lymphoma", "Nodular lymphocyte predominant Hodgkin lymphoma", "Follicular lymphoma"], "a": 4, "e": "Correct: E. Widespread painless nodes in an older adult with an indolent course, a follicular pattern and t(14;18) with Bcl-2 activation fit follicular lymphoma, the second most common NHL.\nA: Burkitt has t(8;14) and a starry-sky pattern.\nB: DLBCL grows fast, with large cells and loss of node structure.\nC: Mantle cell lymphoma has t(11;14) with cyclin D1.\nD: NLPHL shows popcorn cells, not t(14;18).\nTakeaway: Follicular lymphoma: watch and wait until symptoms develop.", "l": ["W12 4.6", "W12 5.5"]}, {"c": "Lymphadenopathy", "p": "Which findings in an adult with lymphadenopathy raise concern for malignancy?\ni) Fever for more than 1 week with night sweats\nii) A tender 1 cm neck node with a sore throat\niii) A supraclavicular node\niv) Weight loss of more than 10% of body weight", "o": ["ii), iii) and iv) only", "i) and iv) only", "i), iii) and iv) only", "All of the above"], "a": 2, "e": "Correct: C. Fever over 1 week, night sweats, weight loss over 10% and supraclavicular nodes are listed features concerning for malignancy.\nA: A tender small node with throat symptoms is not a red flag. Absence of ENT symptoms is the concerning feature.\nB: This leaves out the supraclavicular node, a listed red flag.\nD: Statement ii) is not a concerning feature.\nTakeaway: Red flags: B symptoms, supraclavicular, generalized, fixed or matted, abnormal CXR or CBC.", "l": ["W12 2.3"]}, {"c": "Non-Hodgkin lymphoma", "p": "Jacob, 12, has a fast-growing abdominal mass. Biopsy shows a starry-sky pattern. Which genetic change is most likely?", "o": ["t(8;14) with c-Myc activation", "t(11;14) with cyclin D1 overexpression", "t(14;18) with Bcl-2 activation", "t(2;5) with an ALK1 mutation"], "a": 0, "e": "Correct: A. A starry-sky pattern is the mark of Burkitt lymphoma, which carries t(8;14) and c-Myc activation.\nB: t(11;14) with cyclin D1 is mantle cell lymphoma.\nC: t(14;18) with Bcl-2 is follicular lymphoma.\nD: t(2;5) with ALK1 is anaplastic large cell lymphoma.\nTakeaway: Starry sky means Burkitt means t(8;14).", "l": ["W12 4.6"]}, {"c": "Plasma cell disorders", "p": "Ruth, 72, has an M protein found on routine bloodwork. She feels well and has no bone pain, infections or weight loss.\n\nHb 128 g/L (ref 115-160)\nWBC 5.9 × 10⁹/L (ref 4-10)\nPlatelets 250 × 10⁹/L (ref 150-450)\nCalcium 2.31 mmol/L\nCreatinine 74 µmol/L\nMarrow plasma cells 6%\nSkeletal survey: no lytic lesions.\n\nWhat is the most likely diagnosis?", "o": ["Multiple myeloma", "MGUS", "Plasma cell leukemia", "Smoldering myeloma", "AL amyloidosis"], "a": 1, "e": "Correct: B. An asymptomatic M protein with fewer than 10% marrow plasma cells and no organ damage is MGUS, with a 0.5 to 2% yearly risk of myeloma.\nA: Myeloma needs organ damage.\nC: Plasma cell leukemia needs plasma cells in the blood.\nD: Smoldering myeloma needs 10% or more plasma cells.\nE: AL amyloidosis brings organ damage from deposits.\nTakeaway: MGUS: monitor 1 to 2 times a year.", "l": ["W12 7.3", "W12 7.4"]}, {"c": "Radiation", "p": "Which statement about radiation therapy for lymphoma is FALSE?", "o": ["It carries a slight risk of a second cancer years later", "It only treats tumour cells inside the radiation field", "External beam treatment itself is painless", "It damages only cancer cells and spares normal cells"], "a": 3, "e": "Correct: D. Radiation damages the DNA of both normal and cancer cells. So the claim that it spares normal cells is false.\nA: True. There is a slight risk of secondary cancer many years later.\nB: True. Radiation only works on tumour cells in the field.\nC: True. External beam radiation is painless.\nTakeaway: Every tissue has a dose limit. Spinal cord, bowel, kidney and lungs often limit treatment.", "l": ["W12 12.2"]}, {"c": "Lymphadenopathy", "p": "Which statement about lymphadenopathy in children is correct?", "o": ["Lymphoid tissue mass peaks in early childhood", "Palpable nodes are rare between ages 4 and 8", "Benign causes are more likely the younger the child", "Having ear, nose and throat symptoms makes malignancy more likely"], "a": 2, "e": "Correct: C. Lymphadenopathy is common in children, and benign causes are more likely at a younger age.\nA: Lymphoid tissue mass peaks in adolescence.\nB: Lymphadenopathy is found in about 90% of children aged 4 to 8.\nD: The absence of ENT symptoms is the concerning feature.\nTakeaway: Peak lymphoid mass is in adolescence. Nodes are very common in young children.", "l": ["W12 3.1"]}, {"c": "Plasma cell disorders", "p": "Ruth, 72, has MGUS. Which follow-up plan and risk of progression to myeloma match the notes?", "o": ["Monitor 1-2 times a year. Risk of myeloma is 0.5-2%", "Start therapy now. Risk of myeloma is 0.5-2%", "Give high dose chemotherapy as an emergency", "Follow up every 3-6 months. Risk of myeloma is 5-25%"], "a": 0, "e": "Correct: A. MGUS is monitored once or twice a year and carries a 0.5 to 2% risk of myeloma.\nB: MGUS is asymptomatic and is monitored, not treated.\nC: High dose combination chemotherapy is for plasma cell leukemia.\nD: Follow-up every 3 to 6 months with a 5 to 25% risk is smoldering myeloma.\nTakeaway: MGUS is watched. Smoldering is watched more closely. Myeloma is treated.", "l": ["W12 7.3", "W12 7.4"]}, {"c": "Hodgkin lymphoma", "p": "Which statement comparing Hodgkin with non-Hodgkin lymphoma is FALSE?", "o": ["All Hodgkin lymphoma is treated with the aim of cure", "Hodgkin lymphoma often spreads in a non-contiguous pattern", "Hodgkin lymphoma shows RS cells in an inflammatory background", "Hodgkin lymphoma is usually nodal, and extranodal disease is rare"], "a": 1, "e": "Correct: B. Hodgkin lymphoma spreads contiguously, from neck to supraclavicular, thorax and abdomen. Non-Hodgkin lymphoma can spread non-contiguously. So this statement is false.\nA: True. All HL patients must be treated with the aim to cure.\nC: True. RS cells in an inflammatory background are the HL hallmark.\nD: True. HL is nodal, and extranodal disease is rare.\nTakeaway: HL: contiguous, nodal, RS cells, curable. NHL: varied spread, monoclonal.", "l": ["W12 4.8"]}, {"c": "Biopsy and lab tests", "p": "Marcus, 52, has a 3 cm node and suspected lymphoma. Which feature of an excisional biopsy makes it the most informative option?", "o": ["It needs no surgeon and costs the least of the three options", "It is the least invasive option and gives the fastest results", "It shows the nodal architecture and gives no false negatives", "It suits severely sick patients who cannot go to the OR"], "a": 2, "e": "Correct: C. Excisional biopsy is always representative, has no false negatives and shows the architecture. It also gives enough tissue for every study.\nA: No surgeon and lowest cost describe FNA.\nB: Least invasive and fastest describe FNA.\nD: Excisional biopsy cannot be done on severely sick compromised patients.\nTakeaway: Excisional biopsy is the most complete sample but needs a surgeon.", "l": ["W12 4.4"]}, {"c": "Hodgkin lymphoma", "p": "Patient A is a 22-year-old man with nodes that have spread from his neck to his mediastinum in order. Patient B is a 70-year-old woman with a lymphoma in her stomach and scattered nodes. Which type of lymphoma best fits each patient, in order?", "o": ["Both non-Hodgkin", "A non-Hodgkin, B Hodgkin", "Both Hodgkin", "A Hodgkin, B non-Hodgkin"], "a": 3, "e": "Correct: D. Hodgkin lymphoma affects younger patients, mostly males, and spreads contiguously through nodes. Non-Hodgkin lymphoma affects older patients and can be extranodal and non-contiguous.\nA: Patient A is young with contiguous nodal spread, which fits HL.\nB: This reverses the age and spread patterns.\nC: Patient B has extranodal disease in an older adult, which fits NHL.\nTakeaway: Young, nodal and contiguous points to HL. Older and extranodal points to NHL.", "l": ["W12 5.1"]}, {"c": "Radiation", "p": "Which of these effects of radiation is classed as a late effect rather than a subacute one?", "o": ["L'Hermitte's sign", "Hypothyroidism", "Myelosuppression", "Radiation pneumonitis"], "a": 1, "e": "Correct: B. Hypothyroidism is listed as a late effect, and thyroid replacement is recommended.\nA: L'Hermitte's sign is a subacute effect from transient demyelination.\nC: Myelosuppression is subacute, after high volume pelvic marrow radiation.\nD: Radiation pneumonitis is subacute, within 6 to 12 weeks.\nTakeaway: Late effects: hypothyroidism, zoster, infertility, secondary cancers.", "l": ["W12 12.3"]}, {"c": "Lymphadenopathy", "p": "Hana, 45, has enlarged nodes in her neck and in her right axilla. How is her lymphadenopathy best classified?", "o": ["Isolated", "Localized", "Generalized", "Reactive"], "a": 2, "e": "Correct: C. Two separate anatomic areas are involved. More than one area is generalized, which raises concern for malignancy or another systemic condition.\nA: Isolated means a single node.\nB: Localized means one anatomic area.\nD: Reactive is a cause, not a description of extent.\nTakeaway: Isolated is one node, localized is one area, generalized is more than one area.", "l": ["W12 2.2"]}, {"c": "Hodgkin lymphoma", "p": "Chloe, 23, has 2 months of a dry cough, itchy skin and night sweats. She noticed a painless lump above her left collarbone. Chest X-ray shows a large anterior mediastinal mass.\n\nHb 122 g/L (ref 115-160)\nWBC 10.8 × 10⁹/L (ref 4-10)\nEosinophils mildly high\nPlatelets 410 × 10⁹/L (ref 150-450)\nLDH normal\nNode biopsy: Reed-Sternberg cells and lacunar cells in a nodular pattern with collagen bands, in a background of eosinophils, lymphocytes and plasma cells.\nStains: CD15 and CD30 positive, CD20 and CD45 negative.\n\nWhat is the most likely diagnosis?", "o": ["Thymoma", "Lymphoblastic lymphoma", "Nodular lymphocyte predominant Hodgkin lymphoma", "Diffuse large B-cell lymphoma", "Nodular sclerosis Hodgkin lymphoma"], "a": 4, "e": "Correct: E. A young adult with a mediastinal mass, RS and lacunar cells, collagen bands, and a CD15 and CD30 positive, CD20 negative stain has nodular sclerosis HL, 70% of all HL.\nA: Thymoma is a tumour of adults over 40 and is resected without a biopsy.\nB: Lymphoblastic lymphoma comes on over days and shows immature blasts.\nC: NLPHL shows popcorn cells that are CD20 positive and CD15 and CD30 negative, and rarely a mediastinal mass.\nD: DLBCL has no Reed-Sternberg cells or inflammatory background.\nTakeaway: Nodular sclerosis: mostly stage I to II, with a very good to excellent prognosis.", "l": ["W12 4.2", "W12 5.4"]}, {"c": "Mediastinal mass", "p": "Imaging shows a mass in the posterior mediastinum beside the spine. Which category of lesion is most likely?", "o": ["Bronchogenic or pericardial cyst", "Thymoma", "Teratoma", "Neurogenic tumour"], "a": 3, "e": "Correct: D. The posterior paravertebral compartment holds the sympathetic trunk and nerves. Its differential is neurogenic tumours, meningoceles and spine lesions.\nA: Bronchogenic cysts are middle compartment lesions.\nB: Thymoma is an anterior compartment lesion.\nC: Teratoma is an anterior compartment lesion.\nTakeaway: Anterior 5Ts, middle nodes and cysts, posterior nerves.", "l": ["W12 6.1"]}, {"c": "Plasma cell disorders", "p": "Viktor, 66, has 4 months of swelling in his legs and shortness of breath on exertion. Echo shows thick heart walls, and his urine has heavy protein. He has no bone pain.\n\nHb 132 g/L (ref 135-170)\nPlatelets 240 × 10⁹/L (ref 150-450)\nCalcium normal\nCreatinine mildly high\nSerum free light chains monoclonal light chain excess\nFat pad biopsy: deposits of insoluble protein.\nSkeletal survey: no lytic lesions.\n\nWhat is the most likely diagnosis?", "o": ["POEMS syndrome", "Multiple myeloma", "MGUS", "Plasma cell leukemia", "AL amyloidosis"], "a": 4, "e": "Correct: E. An abnormal light chain that becomes insoluble and deposits in the heart and kidneys, proven on biopsy, fits AL amyloidosis.\nA: POEMS brings neuropathy, organomegaly, endocrine and skin changes.\nB: Myeloma needs the CRAB pattern, and he has no lytic lesions, anemia or hypercalcemia.\nC: MGUS has no organ damage.\nD: Plasma cell leukemia needs plasma cells in the blood.\nTakeaway: AL amyloidosis may be idiopathic, primary, or secondary to myeloma.", "l": ["W12 8.1", "W12 7.1"]}, {"c": "Lymphadenopathy", "p": "Jade, 22, has a tender lump in her right armpit for 10 days. Three weeks ago her new kitten scratched her right forearm, and a small bump formed at the scratch. She has a low-grade fever and no night sweats or weight loss. On exam she has one tender, mobile 2.5 cm axillary node and no other nodes or spleen.\n\nHb 134 g/L (ref 115-160)\nWBC 9.8 × 10⁹/L (ref 4-10)\nLymphocytes normal\nPlatelets 270 × 10⁹/L (ref 150-450)\nLDH normal\nFilm: normal.\n\nWhat is the most likely diagnosis?", "o": ["Drug reaction", "Hodgkin lymphoma", "Breast cancer with axillary spread", "Infectious mononucleosis", "Cat-scratch disease"], "a": 4, "e": "Correct: E. A single tender, mobile axillary node draining a recent kitten scratch, with a normal CBC and film, fits cat-scratch disease, a listed cause of axillary nodes.\nA: She takes no new drugs.\nB: Hodgkin lymphoma gives painless nodes that spread in order.\nC: Breast cancer nodes are usually fixed and painless, and she has a clear infectious source.\nD: Mono causes sore throat, neck nodes and atypical lymphocytes.\nTakeaway: Look at the area the node drains.", "l": ["W12 2.1", "W12 2.2"]}, {"c": "Biopsy and lab tests", "p": "Which statement about core needle biopsy of a lymph node is correct?", "o": ["Results are best with 16-18 gauge needles plus flow cytometry", "It is always representative and has no false negative results", "It always yields enough tissue for cytogenetics and molecular work", "It is usually performed by a surgeon in the operating room"], "a": 0, "e": "Correct: A. Core biopsy works best with 16 to 18 gauge needles and a flow cytometry study.\nB: Always representative with no false negatives describes excisional biopsy.\nC: A limited core sample may be insufficient for cytogenetics and molecular studies.\nD: Core biopsy is mostly performed by radiologists.\nTakeaway: Core biopsy is the middle option between FNA and excision.", "l": ["W12 4.5"]}, {"c": "Plasma cell disorders", "p": "Which explanations of myeloma symptoms match the notes?\ni) Bone pain from an imbalance between osteoclasts and osteoblasts\nii) Infections from neutropenia and a weakened immune system\niii) Hypercalcemia from calcium released by damaged bones\niv) Fatigue caused only by high calcium", "o": ["i) and iii) only", "i), ii) and iii) only", "ii), iii) and iv) only", "All of the above"], "a": 1, "e": "Correct: B. Bone pain, infections and hypercalcemia are explained as listed in the notes.\nA: This leaves out infections, which come from neutropenia and weak immunity.\nC: Fatigue has several causes, so iv) is wrong.\nD: Statement iv) is wrong. Fatigue comes from anemia, psychological factors, drugs and infections.\nTakeaway: CRAB features each have a mechanism you should be able to explain.", "l": ["W12 8.3"]}, {"c": "Plasma cell disorders", "p": "Gordon, 59, has 6 months of numbness and weakness in both feet, low libido and darkening of his skin. On exam he has reduced sensation in a stocking pattern, an enlarged liver and spleen, and skin thickening.\n\nHb 142 g/L (ref 135-170)\nPlatelets 420 × 10⁹/L (ref 150-450)\nTestosterone low\nSerum M protein present\nCalcium normal\nCreatinine normal\n\nWhat is the most likely diagnosis?", "o": ["Smoldering myeloma", "AL amyloidosis", "Multiple myeloma", "MGUS", "POEMS syndrome"], "a": 4, "e": "Correct: E. Polyneuropathy, organomegaly, endocrinopathy, an M protein and skin changes spell POEMS syndrome.\nA: Smoldering myeloma has no organ involvement.\nB: AL amyloidosis deposits in organs such as the heart and kidneys, without this endocrine and skin pattern.\nC: Myeloma needs CRAB organ damage, and his calcium, creatinine and Hb are normal.\nD: MGUS has no organ involvement.\nTakeaway: POEMS may be primary or secondary to myeloma.", "l": ["W12 8.1"]}, {"c": "Non-Hodgkin lymphoma", "p": "Which translocation and lymphoma pairs are correct?\ni) t(14;18) and follicular lymphoma\nii) t(11;18) and MALT lymphoma\niii) t(2;5) and Burkitt lymphoma\niv) t(11;14) and mantle cell lymphoma", "o": ["ii), iii) and iv) only", "i) and iv) only", "i), ii) and iv) only", "All of the above"], "a": 2, "e": "Correct: C. Follicular is t(14;18), MALT is t(11;18) and mantle cell is t(11;14). These three pairs are correct.\nA: t(2;5) is anaplastic large cell lymphoma, not Burkitt.\nB: This leaves out the correct MALT pairing.\nD: Statement iii) is wrong. Burkitt is t(8;14).\nTakeaway: Know all five translocations in the notes table.", "l": ["W12 4.6"]}, {"c": "Radiation", "p": "Between radiation fractions, hypoxic tumour cells regain oxygen and become more sensitive to the next dose. Which of the four Rs of radiobiology is this?", "o": ["Repopulation", "Redistribution", "Repair", "Reoxygenation"], "a": 3, "e": "Correct: D. Reoxygenation of hypoxic cells makes them more sensitive to radiation.\nA: Repopulation is regrowth of cells between fractions.\nB: Redistribution moves cells into radiosensitive phases of the cell cycle.\nC: Repair is the fixing of sublethal damage between fractions.\nTakeaway: Repair, repopulation, redistribution, reoxygenation.", "l": ["W12 12.1"]}, {"c": "Plasma cell disorders", "p": "Lionel, 66, has myeloma. Over two days he has developed back pain, weak legs and trouble passing urine. Which management is most urgent?", "o": ["Urgent surgery or radiation for cord compression", "IV hydration with an intravenous bisphosphonate infusion", "Hemodialysis for renal dysfunction", "A planned outpatient vertebroplasty"], "a": 0, "e": "Correct: A. New leg weakness and urinary symptoms with back pain suggest cord compression. It is a medical emergency treated with urgent surgery and or radiation.\nB: Hydration and bisphosphonates treat hypercalcemia.\nC: Hemodialysis is for renal dysfunction.\nD: Vertebroplasty is for bone pain and fractures, not cord compression.\nTakeaway: Myeloma emergencies: cord compression, renal dysfunction, plasma cell leukemia.", "l": ["W12 8.6"]}, {"c": "Biopsy and lab tests", "p": "Walter, 61, has an enlarging node. Flow cytometry on the biopsy shows a monoclonal B-cell population. Which diagnosis does this support?", "o": ["Reactive lymphadenopathy from a viral infection", "Classical Hodgkin lymphoma", "Non-Hodgkin lymphoma", "Nodular lymphocyte predominant Hodgkin lymphoma"], "a": 2, "e": "Correct: C. A monoclonal pattern on flow cytometry is a feature of non-Hodgkin lymphoma.\nA: A reactive node gives a polyclonal population.\nB: Hodgkin lymphoma shows no monoclonal pattern on flow cytometry.\nD: This subtype shows no light chain restriction.\nTakeaway: Monoclonal means one clone. Polyclonal means a reactive mix.", "l": ["W12 4.1"]}, {"c": "Mediastinal mass", "p": "Carol, 55, has drooping eyelids and double vision that get worse through the day, and her arms tire when she brushes her hair. Symptoms have crept up over 2 years. She has no fevers, night sweats or weight loss. CT shows a well-defined anterior mediastinal mass with no lymphadenopathy.\n\nHb 136 g/L (ref 115-160)\nWBC 6.2 × 10⁹/L (ref 4-10)\nPlatelets 240 × 10⁹/L (ref 150-450)\nLDH normal\n\nWhat is the most likely diagnosis?", "o": ["Neurogenic tumour", "Lymphoblastic lymphoma", "Nodular sclerosis Hodgkin lymphoma", "Thymoma", "Non-seminomatous germ cell tumour"], "a": 3, "e": "Correct: D. An adult over 40 with a slowly growing anterior mass and myasthenia gravis, a paraneoplastic syndrome, has a thymoma. It is resected without a biopsy first.\nA: Neurogenic tumours sit in the posterior mediastinum.\nB: Lymphoblastic lymphoma comes on over days.\nC: Hodgkin lymphoma affects younger adults and brings nodes and B symptoms.\nE: Germ cell tumours present quickly in young men.\nTakeaway: Mediastinal masses: rapid onset suggests lymphoma or germ cell tumour, slow onset suggests thymoma or teratoma.", "l": ["W12 6.2", "W12 6.5"]}, {"c": "Mediastinal mass", "p": "A trauma patient has a supine AP chest x-ray. The mediastinum measures 7 cm wide. Using the notes, how should this be read?", "o": ["Not widened, since the supine AP cutoff is 8 cm", "Widened, since any width over 6 cm counts", "Widened, since the supine AP cutoff is 6 cm", "Not widened, since every film uses a 10 cm cutoff"], "a": 0, "e": "Correct: A. A widened mediastinum is over 6 cm on an upright PA film or over 8 cm on a supine AP film. At 7 cm on a supine AP film, it is not widened.\nB: The 6 cm cutoff applies to upright PA films.\nC: This swaps the PA and AP cutoffs.\nD: No 10 cm cutoff is used.\nTakeaway: 6 cm upright PA, 8 cm supine AP.", "l": ["W12 6.3"]}, {"c": "Lymphadenopathy", "p": "George, 64, smokes and has lost weight. You feel a firm node just above his left clavicle. Which regions drain to this node group?", "o": ["Breast, upper limb and the chest wall", "GI tract, GU tract and lungs", "Scalp and the skin of the face", "Oral cavity, teeth and the upper airway"], "a": 1, "e": "Correct: B. A node above the clavicle is supraclavicular. It drains the GI tract, GU tract and lungs, so abdominal and thoracic cancers are on the differential.\nA: Breast, upper limb and chest wall drain to the axillary nodes.\nC: Scalp and skin drain to the preauricular and posterior cervical nodes.\nD: The oral cavity drains to the submandibular nodes.\nTakeaway: Supraclavicular nodes are a red flag for malignancy.", "l": ["W12 2.2"]}, {"c": "Radiation", "p": "Why is radiation therapy given as many small daily fractions over several weeks?", "o": ["Cancer cells repair radiation damage faster than normal cells", "Slow-growing tumours respond fastest when doses are kept small", "Normal tissue repairs damage between fractions better than cancer", "Splitting the dose waits until cells leave the sensitive G2-M phase"], "a": 2, "e": "Correct: C. Fractionation takes advantage of the different repair abilities of normal and malignant tissue. Cancer cells do not repair as well as normal cells.\nA: This reverses the repair difference.\nB: Fast-growing tumours are more radiosensitive and respond more quickly.\nD: Cells are most susceptible in G2-M, not least.\nTakeaway: Fractionation exploits the four Rs.", "l": ["W12 12.1"]}, {"c": "Biopsy and lab tests", "p": "A pathologist suspects a peripheral T-cell lymphoma. Which panel of immunohistochemistry markers identifies T cells?", "o": ["CD3, CD5 and CD7", "CD15 and CD30", "CD19, CD20 and CD79a", "CD20 and CD45"], "a": 0, "e": "Correct: A. Clusters of differentiation identify cell types. T cells carry CD3, CD5 and CD7.\nB: CD15 and CD30 mark the Reed-Sternberg cells of classical Hodgkin lymphoma.\nC: CD19, CD20 and CD79a mark B cells.\nD: CD20 and CD45 are positive in nodular lymphocyte predominant Hodgkin lymphoma.\nTakeaway: B cells CD19, CD20, CD79a. T cells CD3, CD5, CD7.", "l": ["W12 1.5"]}, {"c": "Mediastinal mass", "p": "Which are recognized complications of a large mediastinal mass?\ni) Hoarseness from recurrent laryngeal nerve compression\nii) Ptosis, miosis and anhidrosis from sympathetic chain involvement\niii) Hypotension from compression of the heart\niv) Mydriasis with eyelid retraction from sympathetic chain compression", "o": ["i) and iii) only", "i), ii) and iii) only", "ii), iii) and iv) only", "All of the above"], "a": 1, "e": "Correct: B. Hoarseness, Horner syndrome and hypotension from tamponade physiology are all listed effects of a mediastinal mass.\nA: This leaves out Horner syndrome.\nC: Horner syndrome gives miosis and ptosis, not mydriasis and eyelid retraction.\nD: Statement iv) reverses the Horner findings.\nTakeaway: Horner syndrome is not specific to a mediastinal mass. A Pancoast tumour can cause it.", "l": ["W12 6.4"]}, {"c": "Plasma cell disorders", "p": "Walter, 69, has 3 months of back pain, fatigue and constipation. He is thirsty and urinating often. He had pneumonia twice this year. X-rays show lytic lesions in his spine, pelvis and skull.\n\nHb 86 g/L (ref 135-170)\nWBC 4.0 × 10⁹/L (ref 4-10)\nPlatelets 158 × 10⁹/L (ref 150-450)\nCalcium 2.94 mmol/L\nCreatinine 220 µmol/L\nSerum M protein present\nMarrow plasma cells 35%, monoclonal\nFilm: rouleaux.\n\nWhat is the most likely diagnosis?", "o": ["Plasma cell leukemia", "MGUS", "Smoldering myeloma", "AL amyloidosis", "Multiple myeloma"], "a": 4, "e": "Correct: E. Monoclonal plasma cells over 10% in the marrow with CRAB organ damage (calcium over 2.52, creatinine over 175, Hb under 100, lytic lesions) is overt multiple myeloma.\nA: Plasma cell leukemia needs plasma cells in the blood.\nB: MGUS has fewer than 10% plasma cells and no organ damage.\nC: Smoldering myeloma has no organ damage.\nD: AL amyloidosis deposits light chains in organs, and CRAB with 35% plasma cells defines myeloma.\nTakeaway: Bone pain comes from an imbalance between osteoclasts and osteoblasts.", "l": ["W12 8.2", "W12 8.4"]}, {"c": "Plasma cell disorders", "p": "Which tests belong in the essential workup for suspected multiple myeloma?\ni) Peripheral blood smear for rouleaux\nii) Blood and 24-hour urine protein electrophoresis\niii) Serum free light chain assay\niv) FISH for t(9;22)", "o": ["ii) and iii) only", "i), ii) and iii) only", "i), iii) and iv) only", "All of the above"], "a": 1, "e": "Correct: B. Smear for rouleaux, protein electrophoresis of blood and urine, and the serum free light chain assay are all listed myeloma investigations.\nA: This leaves out the smear, which shows rouleaux.\nC: t(9;22) is not a myeloma FISH target. FISH looks for t(4;14), t(14;16) and del(17p).\nD: Statement iv) is wrong for myeloma.\nTakeaway: Myeloma FISH: t(4;14), t(14;16), del(17p).", "l": ["W12 8.4"]}, {"c": "Non-Hodgkin lymphoma", "p": "Nora, 65, has a painless neck mass that doubled in size over 4 weeks. She has drenching night sweats and lost 8 kg. CT shows enlarged nodes in her neck, chest and abdomen.\n\nHb 114 g/L (ref 115-160)\nWBC 8.4 × 10⁹/L (ref 4-10)\nPlatelets 290 × 10⁹/L (ref 150-450)\nLDH high\nUric acid high\nNode biopsy: loss of normal node structure, sheets of large cells with large nuclei and visible nucleoli, and high mitotic activity.\nFlow cytometry: monoclonal B cells.\n\nWhat is the most likely diagnosis?", "o": ["Burkitt lymphoma", "Follicular lymphoma", "Small lymphocytic lymphoma", "Nodular sclerosis Hodgkin lymphoma", "Diffuse large B-cell lymphoma"], "a": 4, "e": "Correct: E. A painless, rapidly enlarging mass with B symptoms, advanced disease, and large monoclonal B cells that erase the node structure fit DLBCL, the most common NHL.\nA: Burkitt shows a starry-sky pattern and is mostly seen in children.\nB: Follicular lymphoma is indolent, with a follicular pattern.\nC: SLL is indolent, with small cells and smudge cells.\nD: Hodgkin lymphoma shows Reed-Sternberg cells and is not monoclonal on flow.\nTakeaway: DLBCL: CHOP-R, 3 cycles for stage I to II and 6 for stage III to IV.", "l": ["W12 4.2", "W12 5.5"]}];
const OBJECTIVES = {"W12 1.5": "Understand the utility of immunohistochemical stains and flow cytometric study.", "W12 1.6": "Distinguish between different modes of investigating enlarged lymph nodes and splenomegaly.", "W12 2.1": "List the differential diagnoses of lymphadenopathy in adult.", "W12 2.2": "List and interpret critical clinical findings, including an appropriate history and physical examination in a patient with lymphadenopathy.", "W12 2.3": "List and interpret initial investigations, including laboratory and radiological studies, and determine whether there is an indication for a biopsy.", "W12 3.1": "List the differential diagnoses of lymphadenopathy in pediatrics.", "W12 3.2": "List and interpret critical clinical findings, including an appropriate history and physical examination in a patient with lymphadenopathy.", "W12 3.3": "List and interpret initial investigations, including laboratory and radiological studies, determine whether there is an indication for a biopsy.", "W12 4.1": "Differentiate between \"monoclonal\" and \"polyclonal\" populations in confirming the diagnosis of non‐Hodgkin lymphoma.", "W12 4.2": "Correlate the histology and clinical behaviour of different types of non‐ Hodgkin lymphoma.", "W12 4.3": "Differentiate between grade and stage of disease.", "W12 4.4": "Compare and contrast the three procedures used to get a sample of a lymph node for pathology diagnosis.", "W12 4.5": "Discuss advantages and disadvantages of various lab tests for lymphoma diagnosis.", "W12 4.6": "Distinguish between the major subtypes of non-Hodgkin's lymphomas.", "W12 4.7": "Discuss the risk factors for Hodgkin and non‐Hodgkin lymphomas.", "W12 4.8": "Summarize the major differences between Hodgkin and non-Hodgkin lymphomas.", "W12 5.1": "Distinguish the clinical presentations of Hodgkin and non-Hodgkin lymphoma.", "W12 5.3": "Describe the Ann Arbor staging system", "W12 5.4": "List the prognostic factors in patients with lymphoma.", "W12 5.5": "Outline the basic principles of treatment of various lymphomas", "W12 6.1": "List the differential diagnoses for mediastinal mass.", "W12 6.2": "List and interpret critical clinical findings, including an appropriate history and physical examination in a patient with mediastinal mass.", "W12 6.3": "List and interpret relevant investigations, including laboratory and radiological studies, indication for a biopsy.", "W12 6.4": "Explain the possible complications from a large mediastinal mass.", "W12 6.5": "Construct an effective initial management plan.", "W12 7.1": "Understand the role of plasma cells and know how to interpret serum protein electrophoresis.", "W12 7.2": "Review the criteria and differences between monoclonal gammopathy of unknown significance, smoldering myeloma and multiple myeloma.", "W12 7.3": "Discuss the appropriate workup for monoclonal gammopathy.", "W12 7.4": "Understand the prognosis of common disorders associated with monoclonal gammopathy.", "W12 8.1": "Define multiple myeloma and the other plasma cell dyscrasias.", "W12 8.2": "Describe the clinical features of multiple myeloma.", "W12 8.3": "Explain the mechanisms for the disease manifestations.", "W12 8.4": "Outline the essential investigations for multiple myeloma.", "W12 8.6": "Identify and provide initial management of complications", "W12 12.1": "Describe principles of radiation in treatment of hematological malignancies.", "W12 12.2": "Explain the advantages and disadvantages of radiation.", "W12 12.3": "Explain the short-term and long-term side effects of radiation"};
const L = "ABCDE";
const N = QUESTIONS.length;
let cur = 0, showResults = false;
let ans = new Array(N).fill(null);           // current pick per question
let tries = QUESTIONS.map(()=>[]);           // every locked attempt: {pick, ok, at}
let strikes = QUESTIONS.map(()=>[]);         // struck option indexes for the open attempt
let history = [], db = null, uid = null, writing = false, dirty = false;
const MAP=document.getElementById("map"); if(MAP && QUESTIONS.length<=60) MAP.open=true;
const LS_KEY = "differential-week-12-question-bank";
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");

function score(){ return ans.reduce((n,a,i)=>n+(a!==null&&a===QUESTIONS[i].a?1:0),0); }
function answered(){ return ans.filter(a=>a!==null).length; }
function firstTryScore(){ return tries.reduce((n,t)=>n+(t.length&&t[0].ok?1:0),0); }
function firstTryCount(){ return tries.filter(t=>t.length).length; }

function renderHeader(){
  const bf=$("#barfill"); if(bf) bf.style.width=(100*answered()/N)+"%";
  $("#stats").innerHTML = `<span>Question <b>${showResults?"–":cur+1}</b> of <b>${N}</b></span><span>Answered <b>${answered()}</b></span><span>Score <b>${score()} / ${answered()}</b></span>`;
  $("#ticks").innerHTML = QUESTIONS.map((q,i)=>{
    const st = ans[i]===null?"":(ans[i]===q.a?"ok":"bad");
    const redo = tries[i].length>1 || (ans[i]===null && tries[i].length>0);
    return `<button class="tick ${st} ${redo?"redo":""} ${(!showResults&&i===cur)?"cur":""}" data-i="${i}" aria-label="Question ${i+1}"></button>`;
  }).join("");
  document.querySelectorAll(".tick").forEach(b=>b.onclick=()=>{cur=+b.dataset.i;showResults=false;render();});
}

function triesLine(i, includeCurrent){
  const t = includeCurrent ? tries[i] : tries[i];
  if(!t.length) return "";
  const parts = t.map((x,k)=>`<span class="${x.ok?"ok":"bad"}">${k+1}: ${L[x.pick]} ${x.ok?"correct":"wrong"}</span>`).join(" · ");
  return `<div class="tries">Attempts ${parts}</div>`;
}

function fmtLine(t){
  let m;
  if((m=t.match(/^Correct:\s*([A-E])\.?\s*(.*)$/)) || (m=t.match(/^([A-E]) is correct\.?\s*(.*)$/)))
    return `<p class="why"><span class="lk ok">${m[1]}</span><span>${esc(m[2])}</span></p>`;
  if((m=t.match(/^([A-E]):\s*(.*)$/)))
    return `<p class="alt"><span class="lk">${m[1]}</span><span>${esc(m[2])}</span></p>`;
  if((m=t.match(/^(Takeaway|High yield|High-yield|Key point|Clues):\s*(.*)$/i)))
    return `<p class="take"><b>${esc(m[1])}.</b> ${esc(m[2])}</p>`;
  return `<p>${esc(t)}</p>`;
}

function renderQ(){
  const q = QUESTIONS[cur], a = ans[cur], done = a!==null, st = strikes[cur];
  const opts = q.o.map((o,i)=>{
    let c = "";
    if(done){ if(i===q.a) c="right"; else if(i===a) c="wrong"; }
    const struck = !done && st.includes(i);
    const strikeBtn = done ? "" : `<button class="strike" data-s="${i}" aria-pressed="${struck}" aria-label="${struck?"Restore":"Strike out"} option ${L[i]}" title="${struck?"Restore":"Strike out"} option">${struck?"↺":"✕"}</button>`;
    return `<div class="optrow ${struck?"struck":""}"><button class="opt ${c}" data-i="${i}" ${done?"disabled":""}><span class="k">${L[i]}</span><span>${esc(o)}</span></button>${strikeBtn}</div>`;
  }).join("");
  let fb = "";
  if(done){
    const ok = a===q.a;
    const lines = q.e.split("\n").map(fmtLine).join("");
    const objs = q.l.map(id=>`<div class="obj"><b>Objective ${esc(id)}</b> ${esc(OBJECTIVES[id]||"")}</div>`).join("");
    fb = `<div class="fb" role="status"><div class="verdict ${ok?"ok":"bad"}">${ok?"Correct.":"Incorrect. The answer is "+L[q.a]+"."}</div>${lines}${objs}${triesLine(cur)}<div class="fbtools"><button class="btn ghost" id="redo">Reset and redo this question</button></div></div>`;
  }
  const pre = (!done && tries[cur].length) ? `<div class="hint">Redo. Your earlier attempts are saved.</div>${triesLine(cur)}` : (!done ? `<div class="hint">Tap ✕ to strike out an option. Right-click works too.</div>` : "");
  const last = cur===N-1;
  $("#main").innerHTML = `<article class="card">
    <div class="chead"><span class="tag">${esc(q.c)}</span><span class="chead-r">${ankiButton(cur)}<span class="qn">${cur+1} of ${N}</span></span></div>
    <p class="stem">${esc(q.p)}</p>
    ${pre}
    <div class="opts">${opts}</div>
    <div class="offrow">${offButton(cur)}</div>${fb}
    <div class="nav"><button class="btn ghost" id="prev" ${cur===0?"disabled":""}>Previous</button>
    <button class="btn" id="next" ${done?"":"disabled"}>${last?"See results":"Next"}</button></div>
  </article>`;
  document.querySelectorAll(".opt").forEach(b=>{
    b.onclick=()=>{ const p=+b.dataset.i; ans[cur]=p; tries[cur].push({pick:p, ok:p===q.a, at:new Date().toISOString()}); tries[cur]=tries[cur].slice(-10); strikes[cur]=[]; render(false); persist(); };
    b.oncontextmenu=(e)=>{ if(done) return; e.preventDefault(); toggleStrike(+b.dataset.i); };
  });
  document.querySelectorAll(".strike").forEach(b=>b.onclick=()=>toggleStrike(+b.dataset.s));
  const ab=$("#anki"); if(ab) ab.onclick=()=>ankiToggle(cur);
  const ob=$("#off"); if(ob) ob.onclick=()=>offToggle(cur);
  const r=$("#redo"); if(r) r.onclick=()=>{ ans[cur]=null; strikes[cur]=[]; render(false); persist(); };
  $("#prev").onclick=()=>{cur--;render();};
  $("#next").onclick=()=>{ if(last){showResults=true;} else cur++; render(); };
}

function toggleStrike(i){
  const s = strikes[cur], k = s.indexOf(i);
  if(k<0) s.push(i); else s.splice(k,1);
  render(false); persist();
}

function renderResults(){
  const s = score(), pct = Math.round(100*s/N);
  const cats = {};
  QUESTIONS.forEach((q,i)=>{ cats[q.c]=cats[q.c]||[0,0]; cats[q.c][1]++; if(ans[i]===q.a) cats[q.c][0]++; });
  const rows = Object.entries(cats).map(([c,[r,t]])=>`<tr><td>${esc(c)}<span class="meter"><i style="width:${Math.round(100*r/t)}%"></i></span></td><td>${r} / ${t}</td></tr>`).join("");
  const missed = {};
  QUESTIONS.forEach((q,i)=>{ const wrongFirst = tries[i].length && !tries[i][0].ok; if(ans[i]!==q.a || wrongFirst) q.l.forEach(id=>{ const w=id.split(" ")[0]; missed[w]=missed[w]||new Set(); missed[w].add(id); }); });
  const weeks = Object.keys(missed).sort((x,y)=>parseInt(x.slice(1))-parseInt(y.slice(1)));
  const missHtml = weeks.length ? weeks.map(w=>`<h3>Week ${w.slice(1)}</h3><ul class="miss">${[...missed[w]].map(id=>`<li><code>${esc(id)}</code>${esc(OBJECTIVES[id]||"")}</li>`).join("")}</ul>`).join("") : "<p>No missed objectives.</p>";
  const redone = tries.filter(t=>t.length>1).length;
  const un = N - answered();
  $("#main").innerHTML = `<article class="card">
    <div class="chead"><span class="tag">Results</span><span>${un?un+" unanswered":"Complete"}</span></div>
    <div><div class="big">${s} / ${N}</div><div class="stats"><span><b>${pct}%</b> correct now</span><span>First try <b>${firstTryScore()} / ${firstTryCount()}</b></span><span>Redone <b>${redone}</b></span></div></div>
    <table><thead><tr><th>Topic</th><th>Score</th></tr></thead><tbody>${rows}</tbody></table>
    ${ankiMissedRow()}<h2>Objectives to review</h2><p class="hint">Includes questions you missed on the first try, even if a redo got them right.</p>${missHtml}${history.length?`<h2>Past attempts</h2><table><thead><tr><th>Date</th><th>Score</th></tr></thead><tbody>${history.slice().reverse().map(h=>`<tr><td>${new Date(h.date).toLocaleDateString()}</td><td>${h.score} / ${h.total}</td></tr>`).join("")}</tbody></table>`:""}
    <div class="nav"><button class="btn ghost" id="back">Back to questions</button><button class="btn" id="restart">Restart all</button></div>
  </article>`;
  $("#back").onclick=()=>{showResults=false;render();};
  const am=$("#ankimissed"); if(am) am.onclick=()=>{ ankiAdd(missedIdx()); renderResults(); };
  $("#restart").onclick=resetAll;
}
/* Clear every answer, redo and strike-out. The attempt is kept in Past attempts. Flags are not touched. */
function resetAll(){
  if(answered() || tries.some(t=>t.length)){
    history.push({date:new Date().toISOString(), score:score(), answered:answered(), total:N, firstTry:firstTryScore(),
      missed:QUESTIONS.map((q,i)=>ans[i]!==null&&ans[i]!==q.a?"q"+(i+1):null).filter(Boolean)});
    history=history.slice(-20);
  }
  ans.fill(null); tries=QUESTIONS.map(()=>[]); strikes=QUESTIONS.map(()=>[]); cur=0; showResults=false; render(); persist();
}
/* Header button: first tap arms it, second tap within 4 seconds resets. No browser dialog. */
(function(){
  const b=document.getElementById("resetall"); let timer=null;
  const disarm=()=>{ b.classList.remove("armed"); b.textContent="Reset all answers"; clearTimeout(timer); timer=null; };
  b.onclick=()=>{
    if(!b.classList.contains("armed")){ b.classList.add("armed"); b.textContent="Tap again to reset"; timer=setTimeout(disarm,4000); return; }
    disarm(); resetAll(); setSave("All answers cleared. Your score is saved in Past attempts.","ok");
  };
})();

function setSave(text, cls){ const el=$("#save"); if(el){ el.textContent=text; el.className="save "+(cls||""); } }
function bodyOf(){
  const a = {};
  QUESTIONS.forEach((q,i)=>{
    if(ans[i]===null && !tries[i].length && !strikes[i].length) return;
    a["q"+(i+1)] = {pick:ans[i], ok:ans[i]!==null && ans[i]===q.a, l:q.l, tries:tries[i], strikes:strikes[i]};
  });
  return {answers:a, history, total:N, answered:answered(), score:score(), firstTry:firstTryScore(), updatedAt:new Date().toISOString()};
}
function validPick(i,p){ return Number.isInteger(p) && p>=0 && p<QUESTIONS[i].o.length; }
function applySaved(d){
  if(!d || typeof d!=="object") return;
  ans.fill(null); tries=QUESTIONS.map(()=>[]); strikes=QUESTIONS.map(()=>[]);
  const a = d.answers || {};
  for(const k in a){
    const i = parseInt(k.slice(1),10)-1, row = a[k];
    if(!(i>=0 && i<N) || !row || typeof row!=="object") continue;
    if(validPick(i,row.pick)) ans[i]=row.pick;
    if(Array.isArray(row.tries)) tries[i]=row.tries.filter(t=>t&&validPick(i,t.pick)).map(t=>({pick:t.pick, ok:t.pick===QUESTIONS[i].a, at:String(t.at||"")})).slice(-10);
    else if(ans[i]!==null) tries[i]=[{pick:ans[i], ok:ans[i]===QUESTIONS[i].a, at:""}];
    if(Array.isArray(row.strikes)) strikes[i]=row.strikes.filter(x=>validPick(i,x));
  }
  history = Array.isArray(d.history) ? d.history.slice(-20) : [];
  const first = ans.findIndex(x=>x===null); cur = first<0 ? N-1 : first;
}
function lsLoad(){ try{ return JSON.parse(localStorage.getItem(LS_KEY)||"null"); }catch(e){ return null; } }
function lsSave(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(bodyOf())); }catch(e){} }
async function persist(){
  lsSave();
  if(!db || !uid) return;
  dirty = true; if(writing) return; writing = true;
  while(dirty){
    dirty = false;
    setSave("Saving…");
    try{ await db.doc("attempts/"+uid).set(bodyOf()); setSave("Progress saved to your account.","ok"); }
    catch(e){
      if(e && e.code==="invalid_argument"){ db=null; setSave("Progress saves in this browser only.","bad"); break; }
      setSave("Could not save to your account. Progress saves in this browser.","bad");
    }
  }
  writing = false;
}
async function connect(){
  try{
    if(!window.claude || !window.claude.use) return;
    const [u, d] = await Promise.all([window.claude.use("user"), window.claude.use("db")]);
    if(!u || !d) return;
    const id = await u.id(); if(!id) return;
    db = d; uid = id;
    const snap = await db.doc("attempts/"+uid).get();
    if(snap.exists){ applySaved(snap.data()); render(); setSave("Progress saved to your account.","ok"); }
    else if(answered() || tries.some(t=>t.length)){ persist(); }
    else setSave("Progress saves to your account.","ok");
  }catch(e){ /* keep local-only mode */ }
}

/* Flagged: flagged questions live in one shared list ("differential-anki", the key predates the rename)
   that the Flagged tab reads. Each card keeps a copy of its question, so the tab works without loading every quiz. */
const SET = {"slug": "week-12-question-bank", "title": "Week 12 Question Bank", "b": 3, "href": "fom/block-3/question-bank/week-12-question-bank"};
const ANKI_KEY = "differential-anki";
function ankiAll(){ try{ const d=JSON.parse(localStorage.getItem(ANKI_KEY)||"null"); return d && Array.isArray(d.cards) ? d.cards : []; }catch(e){ return []; } }
function ankiPut(cards){ try{ localStorage.setItem(ANKI_KEY, JSON.stringify({v:1, cards})); return true; }catch(e){ setSave("Could not flag. Browser storage is full or blocked.","bad"); return false; } }
function ankiId(i){ return SET.slug+"#"+(i+1); }
function ankiCard(i){
  const q=QUESTIONS[i];
  return {id:ankiId(i), slug:SET.slug, set:SET.title, b:SET.b, href:SET.href, n:i+1, c:q.c, p:q.p, o:q.o, a:q.a, e:q.e, l:q.l, obj:q.l.map(x=>OBJECTIVES[x]||"")};
}
function ankiHas(i, cards){ return (cards||ankiAll()).some(c=>c.id===ankiId(i)); }
function ankiButton(i){ const s=ankiHas(i); return `<button class="ankibtn" id="anki" aria-pressed="${s}" title="${s?"Remove the flag":"Flag this question for review"}">${s?"Flagged":"Flag"}</button>`; }
function ankiToggle(i){
  let cards=ankiAll();
  if(ankiHas(i,cards)) cards=cards.filter(c=>c.id!==ankiId(i));
  else cards.push(Object.assign(ankiCard(i), {at:new Date().toISOString()}));
  ankiPut(cards); render(false);
}
function ankiAdd(list){
  const cards=ankiAll(), have=new Set(cards.map(c=>c.id)), at=new Date().toISOString();
  list.forEach(i=>{ if(!have.has(ankiId(i))) cards.push(Object.assign(ankiCard(i), {at})); });
  ankiPut(cards);
}
function missedIdx(){ return QUESTIONS.map((q,i)=>((ans[i]!==null && ans[i]!==q.a) || (tries[i].length && !tries[i][0].ok)) ? i : -1).filter(i=>i>=0); }
function ankiMissedRow(){
  const m=missedIdx(); if(!m.length) return "";
  const cards=ankiAll(), left=m.filter(i=>!ankiHas(i,cards)).length;
  return `<div class="ankirow">${left ? `<button class="btn ghost" id="ankimissed">Flag ${left} missed question${left===1?"":"s"} for review</button>` : `<span class="hint">All ${m.length} missed questions are flagged.</span>`}</div>`;
}
/* Keep saved copies current when a question is corrected, without touching review progress. */
function ankiRefresh(){
  const cards=ankiAll(); let changed=false;
  cards.forEach(c=>{
    if(c.slug!==SET.slug) return;
    const i=c.n-1; if(!(i>=0 && i<N)) return;
    const fresh=ankiCard(i);
    for(const k of ["set","b","href","c","p","o","a","e","l","obj"]) if(JSON.stringify(c[k])!==JSON.stringify(fresh[k])){ c[k]=fresh[k]; changed=true; }
  });
  if(changed) ankiPut(cards);
}
addEventListener("storage", e=>{ if(e.key===ANKI_KEY || e.key===OFF_KEY) render(false); });

/* Not in course content: questions you report land in "differential-offcontent".
   The Flagged tab lists them with a Copy list button, so they can be sent in for removal. */
const OFF_KEY = "differential-offcontent";
function offAll(){ try{ const d=JSON.parse(localStorage.getItem(OFF_KEY)||"null"); return d && Array.isArray(d.items) ? d.items : []; }catch(e){ return []; } }
function offHas(i){ return offAll().some(x=>x.id===ankiId(i)); }
function offButton(i){ const s=offHas(i); return `<button class="offbtn" id="off" aria-pressed="${s}">${s?"Reported as not in course content. Undo":"Not in course content?"}</button>`; }
function offToggle(i){
  let items=offAll();
  if(offHas(i)) items=items.filter(x=>x.id!==ankiId(i));
  else { const q=QUESTIONS[i]; items.push({id:ankiId(i), slug:SET.slug, set:SET.title, b:SET.b, href:SET.href, n:i+1, c:q.c, p:q.p, key:q.o[q.a], at:new Date().toISOString()}); }
  try{ localStorage.setItem(OFF_KEY, JSON.stringify({v:1, items})); }catch(e){ setSave("Could not save the report. Browser storage is full or blocked.","bad"); }
  render(false);
}

function render(top=true){ renderHeader(); showResults?renderResults():renderQ(); if(top) window.scrollTo({top:0}); }
applySaved(lsLoad());
ankiRefresh();
render();
connect();
</script>
