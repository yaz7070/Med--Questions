<script>
const QUESTIONS = [{"c": "MDS", "p": "Ernest, 74, has MDS. His marrow shows 15% blasts and a complex karyotype, and his IPSS score is high risk. He is fit, plays tennis and wants \"to feel better, not just live longer\". His daughter asks whether transfusions and growth factors alone would be enough.\n\nIn higher-risk MDS, what is the main aim of treatment and the drug class that fits it?", "o": ["Delay any treatment until AML develops", "Cure all subtypes, using lenalidomide", "Improve quality of life, using EPO and G-CSF only", "Slow progression, using hypomethylating agents"], "a": 3, "e": "Correct: D. Higher-risk management aims to alter the course and slow progression with hypomethylating agents such as azacitidine or decitabine, high-dose chemotherapy or stem cell transplant.\nA: Higher-risk disease is treated, not observed.\nB: Lenalidomide is for the del(5q) subtype.\nC: Quality of life with growth factors is the lower-risk approach.\nRed herring: His wish to feel better tempts the quality-of-life approach, which is the lower-risk strategy. Higher-risk MDS is treated to slow progression.\nTakeaway: Lower risk: support. Higher risk: change the course.", "l": ["W9 10.5"]}, {"c": "Hemoglobinopathy", "p": "Sophia, 9, has β-thalassemia major and receives red cells every 3 to 4 weeks. Her ferritin is now 1400 μg/L. She also has mild fatigue between transfusions, and her mother read that iron helps tiredness. Her diet is low in red meat.\n\nWhich addition to her plan is most appropriate?", "o": ["Oral ferrous sulfate to rebuild stores", "Iron chelation with desferoxamine", "Erythropoietin to reduce the transfusions", "Pyridoxine to support heme synthesis"], "a": 1, "e": "Correct: B. Repeated transfusion causes iron overload. A ferritin above 1000 is the chelation threshold, and desferoxamine is the listed chelator in thalassemia.\nA: Her stores are already overloaded, so more iron would cause harm.\nC: EPO is not listed for thalassemia. Its indications include renal failure and MDS.\nD: Pyridoxine is occasionally useful in sideroblastic anemia.\nRed herring: Fatigue and a low-meat diet tempt oral iron. Repeated transfusion has already overloaded her stores, and a ferritin above 1000 calls for chelation.\nTakeaway: Transfused thalassemia needs chelation once ferritin passes 1000.", "l": ["W9 2.3", "W9 1.5"]}, {"c": "Normocytic", "p": "Ruth, 66, had breast cancer treated with surgery and chemotherapy 5 years ago. She now has 2 months of fatigue, low back pain and a 5 kg weight loss. She blames the back pain on gardening. She has rheumatoid arthritis on methotrexate. She drinks 2 glasses of wine a week. She had a normal mammogram 6 months ago.\n\nShe has had no fevers, night sweats or bleeding. Her bowel habits are normal, and she has no cough or headache. She lives with her husband and walks daily. She does not smoke. Her oncologist discharged her to her family doctor last year.\n\nVitals: HR 96, BP 118/72, T 36.8°C.\nExam: Pale. Tender over the lumbar spine. No enlarged spleen or lymph nodes. Swollen MCP joints.\n\nHb 88 g/L (ref 115-160)\nMCV 90 fL (ref 80-100)\nReticulocytes low\nWBC 3.2 × 10⁹/L (ref 4-10)\nPlatelets 96 × 10⁹/L (ref 150-450)\nFerritin normal\nFilm: teardrop cells, nucleated red cells and immature myeloid cells.\n\nWhat is the most likely diagnosis?", "o": ["Myelodysplastic syndrome", "Iron deficiency anemia", "Myelophthisis from metastatic cancer", "Aplastic anemia", "Anemia of chronic inflammation"], "a": 2, "e": "Correct: C. A past solid cancer with bone pain, cytopenias and a leukoerythroblastic film with teardrop cells fits myelophthisis. Metastatic cancer replaces the marrow.\nA: MDS shows dysplasia, not a leukoerythroblastic film.\nB: Her ferritin and MCV are normal.\nD: Aplastic anemia shows a fatty marrow and no leukoerythroblastic picture.\nE: Anemia of chronic inflammation doesn't cause teardrop cells or immature cells.\nRed herring: Methotrexate can suppress the marrow, rheumatoid arthritis tempts anemia of chronic inflammation, and gardening explains the back pain. Only marrow infiltration explains a leukoerythroblastic film with teardrop cells. The normal mammogram does not rule out metastatic spread.\nTakeaway: Teardrop cells: marrow infiltration or myelofibrosis.", "l": ["W9 3.1", "W9 3.4"]}, {"c": "Macrocytic", "p": "Two patients stopped all intake of one vitamin four months ago. Patient A, 52, had a total gastrectomy for cancer and has taken no B12 since. He has mild fatigue and his Hb is low-normal. Patient B, 60, is a heavy drinker who eats almost nothing and takes no folate. Patient A is the older-looking and more unwell of the two.\n\nWho is more likely to be deficient now?", "o": ["Patient B, since folate stores last only months", "Neither, since both stores last several years", "Both, since each vitamin store lasts about four months", "Patient A, since B12 stores last only months"], "a": 0, "e": "Correct: A. Folate stores last about 3 to 6 months, so four months without folate can cause deficiency. B12 stores last 3 to 4 years, so Patient A is not yet deficient.\nB: Folate stores last months, not years.\nC: Only folate stores run out on this timescale.\nD: B12 stores last years, not months.\nRed herring: Patient A looks sicker and has the more dramatic surgery, which tempts you to pick him. B12 stores last years, so he is not yet deficient. Folate stores last only months.\nTakeaway: Folate runs out in months. B12 lasts years.", "l": ["W9 4.1"]}, {"c": "Hemolytic", "p": "Lily, 12, has had yellow eyes on and off for years, worse when she has a cold. She had right upper quadrant pain last month, and ultrasound showed pigment gallstones. Her mother had her spleen removed as a teenager. Lily's family is of Mediterranean descent. She recently took a sulfonamide for a urinary infection. Her periods started 6 months ago and are heavy.\n\nShe has had no dark urine, fevers or abdominal pain since the gallstone episode. She plays soccer and is doing well at school. She takes no medications now. Her father and younger brother are well.\n\nVitals: HR 92, BP 104/64, T 36.7°C.\nExam: Mild jaundice. Spleen palpable 3 cm below the costal margin. No bruising.\n\nHb 102 g/L (ref 115-155)\nMCV 85 fL (ref 80-100)\nReticulocytes high\nWBC 6.8 × 10⁹/L (ref 4-10)\nPlatelets 240 × 10⁹/L (ref 150-450)\nIndirect bilirubin high\nHaptoglobin low\nDAT negative\nFilm: small round red cells without central pallor. No bite cells.\n\nWhat is the most likely diagnosis?", "o": ["β-thalassemia minor", "Sickle cell disease", "Warm autoimmune hemolytic anemia", "G6PD deficiency", "Hereditary spherocytosis"], "a": 4, "e": "Correct: E. Lifelong hemolysis, pigment stones, splenomegaly, an affected parent, spherocytes and a negative DAT fit hereditary spherocytosis, from red cell membrane protein defects.\nA: β-thalassemia minor is microcytic.\nB: Sickle cell disease shows sickle cells.\nC: Warm AIHA has a positive DAT.\nD: G6PD deficiency shows bite cells and is X-linked.\nRed herring: The sulfonamide and Mediterranean background tempt G6PD deficiency, but there are no bite cells and the jaundice is lifelong. Heavy periods tempt iron deficiency, but her MCV is normal. Spherocytes, a negative DAT and an affected mother mean hereditary spherocytosis.\nTakeaway: Confirm with flow cytometry for band 3 protein.", "l": ["W9 6.3", "W9 3.5"]}, {"c": "Hemolytic", "p": "Yusuf, 8, of Middle Eastern descent, develops dark urine and pallor 2 days after eating fava beans. His film shows bite cells and Heinz bodies. His DAT is negative. His father had his spleen removed after a car crash. His cousin has hereditary spherocytosis.\n\nIn G6PD deficiency, which mechanism explains hemolysis with bite cells and Heinz bodies after eating fava beans?", "o": ["Oxidants are not inactivated by glutathione", "IgG antibodies bind his red cells at 37°C", "Defects in spectrin or ankyrin weaken the membrane", "A somatic PIGA mutation leaves cells exposed"], "a": 0, "e": "Correct: A. Bite cells and Heinz bodies after fava beans fit G6PD deficiency. Oxidants that glutathione would normally inactivate denature hemoglobin.\nB: IgG at 37°C is warm autoimmune hemolytic anemia.\nC: Membrane protein defects cause hereditary spherocytosis with spherocytes.\nD: PIGA mutation causes PNH, which is not triggered by food.\nRed herring: The cousin with spherocytosis tempts a membrane defect, but bite cells and Heinz bodies come from oxidant damage to hemoglobin.\nTakeaway: G6PD triggers: infections, antimalarials, sulfonamides, ASA, fava beans.", "l": ["W9 6.1", "W9 6.4"]}, {"c": "MDS", "p": "Mary, 72, has a macrocytic anemia with a high platelet count of 520 × 10⁹/L. Her marrow shows MDS with del(5q). She also has a JAK2 test pending because of the high platelets, and her family doctor wonders about hydroxyurea.\n\nWhich treatment is used for MDS with del(5q)?", "o": ["Azacitidine or decitabine", "Hydroxyurea", "Imatinib", "Lenalidomide"], "a": 3, "e": "Correct: D. MDS with del(5q) gives a macrocytic anemia with thrombocytosis and is treated with lenalidomide (Revlimid).\nA: These hypomethylating agents are for higher-risk MDS.\nB: Hydroxyurea is listed for sickle cell disease.\nC: Imatinib is a tyrosine kinase inhibitor for CML and GIST.\nRed herring: The high platelets tempt a myeloproliferative label and hydroxyurea. Macrocytic anemia with thrombocytosis is the del(5q) picture, treated with lenalidomide.\nTakeaway: del(5q) MDS means lenalidomide.", "l": ["W9 10.5"]}, {"c": "Macrocytic", "p": "Four patients have a macrocytic anemia, and each has one other finding: loss of proprioception, optic atrophy, cold intolerance with weight gain, and loss of smell and taste.\n\nWhich findings point to B12 deficiency rather than another cause of macrocytic anemia?\ni) Loss of proprioception\nii) Optic atrophy\niii) Cold intolerance and weight gain\niv) Anosmia and loss of taste", "o": ["ii), iii) and iv) only", "i) and ii) only", "i), ii) and iv) only", "All of the above"], "a": 2, "e": "Correct: C. Loss of proprioception, optic atrophy, anosmia and loss of taste are listed neurological features of B12 deficiency.\nA: Cold intolerance and weight gain point to hypothyroidism.\nB: This misses anosmia and loss of taste, which are B12 features.\nD: Cold intolerance and weight gain belong to hypothyroidism, not B12 deficiency.\nRed herring: Cold intolerance and weight gain are real findings in a macrocytic patient, but they point to hypothyroidism, a non-megaloblastic cause.\nTakeaway: Neurological signs set B12 deficiency apart from other macrocytic causes.", "l": ["W9 4.3"]}, {"c": "Blood film", "p": "Frank, 70, has back pain, a high total protein and a high ESR. His film shows red cells stacked like a pile of coins. He also had Mycoplasma pneumonia last year, and his notes mention a DAT that was positive for C3 at that time.\n\nWhat causes red cells to stack like a pile of coins on the film in multiple myeloma?", "o": ["IgM tetramers bridge several red cells together into large clusters", "Excess proteins neutralize the charges that keep red cells apart", "Microthrombi break the red cells into fragments", "Excess membrane bulges into the centre of each cell"], "a": 1, "e": "Correct: B. This is rouleaux. Red cells normally repel each other by negative charges. Paraproteins in myeloma neutralize these charges so cells stack.\nA: IgM tetramers cause agglutination, seen in cold AIHA.\nC: Microthrombi form schistocytes.\nD: Excess central membrane forms target cells.\nRed herring: The old Mycoplasma and C3 DAT tempt cold agglutinins, which cause clumping, not stacking. Stacks of coins are rouleaux from excess protein.\nTakeaway: Rouleaux means excess protein. Agglutination means IgM.", "l": ["W9 9.2"]}, {"c": "MDS", "p": "Rita, 76, is newly diagnosed with MDS. Her ferritin is 1200 after many transfusions. Her LDH is high and her spleen is mildly enlarged. Her marrow shows 8% blasts, a single chromosomal abnormality and two low cell lines. Her hematologist calculates her risk score.\n\nThe International Prognostic Scoring System (IPSS) for MDS is based on which features?", "o": ["Marrow blasts, chromosomal abnormalities and cell lines involved", "Ferritin level, monthly transfusion need and peripheral blood counts", "Age, LDH and spleen size", "Albumin and beta-2 microglobulin"], "a": 0, "e": "Correct: A. The IPSS score uses the number of blasts in the marrow, chromosomal abnormalities and the number of cell lines involved.\nB: Ferritin is checked for iron overload, not used in the IPSS.\nC: These are not the IPSS inputs in the notes.\nD: Albumin and beta-2 microglobulin make up the ISS for multiple myeloma.\nRed herring: Her ferritin, LDH and spleen are real findings, but none of them enter the IPSS.\nTakeaway: IPSS: blasts, cytogenetics, number of cytopenias.", "l": ["W9 10.4"]}, {"c": "Macrocytic", "p": "Peter, 45, had 100 cm of terminal ileum removed for Crohn's disease 5 years ago. He takes no supplements. He now has fatigue and tingling feet. He drinks 3 beers a day, and his diet is poor in leafy greens.\n\nWhich lab pattern is associated with B12 deficiency after an ileal resection?", "o": ["High homocysteine with a normal methylmalonic acid", "High methylmalonic acid and high homocysteine", "Normal homocysteine with a high methylmalonic acid", "High haptoglobin with low LDH and low bilirubin"], "a": 1, "e": "Correct: B. Ileal resection blocks B12 absorption. B12 deficiency raises both methylmalonic acid and homocysteine.\nA: Homocysteine alone is high in folate deficiency.\nC: B12 deficiency raises both markers, not methylmalonic acid alone.\nD: Megaloblastic anemia shows low haptoglobin with high LDH and bilirubin.\nRed herring: Alcohol and a poor diet tempt folate deficiency, which raises homocysteine only. Ileal resection blocks B12 absorption, which raises both MMA and homocysteine.\nTakeaway: MMA plus homocysteine means B12. Homocysteine only means folate.", "l": ["W9 4.4", "W9 7.5"]}, {"c": "Hemolytic", "p": "A hematology resident is teaching medical students about acquired hemolysis. She lists marathon running, mechanical heart valves, malaria and paroxysmal nocturnal hemoglobinuria, and asks which of her statements is wrong.\n\nWhich statement about acquired hemolytic anemia is FALSE?", "o": ["Repeated physical trauma such as marathon running can cause hemolysis", "Mechanical heart valves can cause hemolysis with schistocytes", "Malaria merozoites escape by lysing the red cell", "Paroxysmal nocturnal hemoglobinuria is an immune-mediated hemolysis"], "a": 3, "e": "Correct: D. PNH is an acquired clonal disorder from a somatic PIGA mutation and is not immune mediated. So this statement is false.\nA: True. Marathon running and bongo drumming are listed traumatic causes.\nB: True. High shear stress from mechanical valves gives intravascular hemolysis with schistocytes.\nC: True. Merozoites lyse the red cell to escape.\nRed herring: PNH is acquired and causes hemolysis, which makes it sound immune mediated. It is clonal, from a somatic PIGA mutation.\nTakeaway: PNH is clonal and non-immune. Valves and trauma are mechanical.", "l": ["W9 6.1"]}, {"c": "Hemolytic", "p": "Arthur, 67, had a mechanical aortic valve placed 8 years ago, and echo now shows a paravalvular leak. He has 2 months of fatigue and dark urine, worse in the morning. He takes warfarin, and his INR is in range. He had a dental cleaning 6 weeks ago. He has no fever or confusion. His brother has lupus.\n\nHe has had no chest pain, cough, weight loss or night sweats. He walks 30 minutes a day but now stops to rest. He takes warfarin, bisoprolol and atorvastatin. He does not smoke and drinks rarely.\n\nVitals: HR 98, BP 132/58, T 36.9°C.\nExam: Pale with mild scleral icterus. Loud mechanical valve click with a new murmur. No splenomegaly. No petechiae.\n\nHb 96 g/L (ref 135-170)\nReticulocytes high\nWBC 7.0 × 10⁹/L (ref 4-10)\nPlatelets 230 × 10⁹/L (ref 150-450)\nLDH high\nHaptoglobin low\nDAT negative\nFilm: schistocytes.\n\nWhat is the most likely diagnosis?", "o": ["Hereditary spherocytosis", "Paroxysmal nocturnal hemoglobinuria", "Thrombotic thrombocytopenic purpura", "Warm autoimmune hemolytic anemia", "Hemolysis from his mechanical valve"], "a": 4, "e": "Correct: E. Intravascular hemolysis with schistocytes, a normal platelet count and a leaking mechanical valve fits valve-related hemolysis from high shear stress.\nA: Hereditary spherocytosis is lifelong and shows spherocytes.\nB: PNH is a clonal PIGA disorder, and the valve explains his findings.\nC: TTP brings severe thrombocytopenia and a very sick patient.\nD: Warm AIHA has a positive DAT and spherocytes.\nRed herring: Morning dark urine tempts PNH, the dental cleaning tempts endocarditis, and his brother's lupus tempts autoimmune hemolysis. A negative DAT, a normal platelet count, schistocytes and a leaking valve point to mechanical valve hemolysis.\nTakeaway: Schistocytes with a normal platelet count: think of a mechanical cause.", "l": ["W9 6.4", "W9 6.1"]}, {"c": "Microcytic", "p": "Dev, 61, drinks 10 beers a day and started treatment for tuberculosis 2 months ago, including isoniazid. He is now short of breath on exertion. He had a small hemorrhoid bleed last month. He was born in Italy, and his sister has \"small red cells\". He works as a car mechanic and has no known lead exposure.\n\nHe has had no abdominal pain, weight loss or night sweats since starting TB treatment. His cough has improved. He takes rifampin, isoniazid, pyrazinamide and ethambutol daily. He lives alone and smokes 10 cigarettes a day.\n\nVitals: HR 102, BP 124/76.\nExam: Pale. No jaundice. No splenomegaly.\n\nHb 86 g/L (ref 135-170)\nMCV 74 fL (ref 80-100)\nWBC 5.8 × 10⁹/L (ref 4-10)\nPlatelets 210 × 10⁹/L (ref 150-450)\nFerritin normal\nHbA2 normal\nFilm: hypochromic cells, basophilic stippling and Pappenheimer bodies.\nMarrow: iron deposits forming a ring around the nucleus of red cell precursors.\n\nWhat is the most likely diagnosis?", "o": ["Iron deficiency anemia", "β-thalassemia minor", "Lead poisoning", "Anemia of chronic inflammation", "Sideroblastic anemia"], "a": 4, "e": "Correct: E. Anti-TB drugs and heavy alcohol use with a microcytic anemia, normal iron stores, Pappenheimer bodies and ring sideroblasts fit acquired sideroblastic anemia. Iron is present but cannot be built into hemoglobin.\nA: Iron deficiency has a low ferritin.\nB: Thalassemia has a family history and no ring sideroblasts.\nC: Lead also gives stippling, but he has no exposure, and his drugs and alcohol explain it.\nD: Anemia of chronic inflammation does not form ring sideroblasts.\nRed herring: The hemorrhoid bleed tempts iron deficiency, but his ferritin is normal. His sister and Italian origin tempt thalassemia, but his HbA2 is normal and thalassemia does not form ring sideroblasts. Isoniazid and alcohol cause sideroblastic anemia.\nTakeaway: Treat by removing the toxin. Pyridoxine helps some cases.", "l": ["W9 1.1", "W9 1.5"]}, {"c": "Microcytic", "p": "Ana, 35, has a microcytic anemia. She chews ice all day, her legs feel restless at night and her nails are spoon-shaped. Her sister has thalassemia trait. She asks what else her doctor might find.\n\nWhich other finding is listed with iron deficiency anemia?", "o": ["Bone deformities from an overproductive marrow", "Onset of the anemia in early childhood", "Difficulty swallowing from esophageal webs", "Splenomegaly with jaundice and short stature"], "a": 2, "e": "Correct: C. Pica, restless legs and koilonychia point to iron deficiency anemia. Esophageal webs causing difficulty swallowing are listed with it.\nA: Bone deformities from an overproductive marrow are a thalassemia feature.\nB: Onset in early childhood suggests thalassemia.\nD: Splenomegaly, jaundice and short stature are thalassemia features.\nRed herring: Her sister's thalassemia trait tempts thalassemia features such as bone deformities or splenomegaly. Pica, koilonychia and restless legs form the iron deficiency set, with esophageal webs.\nTakeaway: Pica, koilonychia, restless legs and esophageal webs are the iron deficiency set.", "l": ["W9 1.3"]}, {"c": "Macrocytic", "p": "Edward, 78, lives alone, drinks a bottle of wine a day and mostly eats toast and tea. He is tired and has lost 4 kg. He has hypothyroidism on levothyroxine with a TSH that was normal last month. His brother has pernicious anemia. He has mild cirrhosis on ultrasound. He has no numbness, tingling or balance problems.\n\nHe has had no abdominal pain, vomiting or blood in his stool. He stopped seeing his friends after his wife died 2 years ago. He takes levothyroxine and no other medications. He smokes a pipe.\n\nVitals: HR 88, BP 128/76.\nExam: Pale and thin. Normal neurological exam with intact vibration and position sense.\n\nHb 92 g/L (ref 135-170)\nMCV 112 fL (ref 80-100)\nWBC 3.8 × 10⁹/L (ref 4-10)\nPlatelets 132 × 10⁹/L (ref 150-450)\nSerum B12 normal\nMethylmalonic acid normal\nHomocysteine high\nFilm: oval macrocytes and hypersegmented neutrophils.\n\nWhat is the most likely diagnosis?", "o": ["Folate deficiency", "Myelodysplastic syndrome", "B12 deficiency", "Alcohol-related liver disease", "Hypothyroidism"], "a": 0, "e": "Correct: A. Poor diet and alcohol, a megaloblastic film, no neurological signs, and a high homocysteine with a normal MMA fit folate deficiency. Folate stores last only months.\nB: MDS would not raise homocysteine.\nC: B12 deficiency raises the MMA too, and often brings neurological signs.\nD: Liver disease is non-megaloblastic, with large round cells and normal neutrophils.\nE: Hypothyroidism is non-megaloblastic.\nRed herring: His brother's pernicious anemia tempts B12 deficiency, but his MMA is normal. Cirrhosis and hypothyroidism cause non-megaloblastic macrocytosis, but his film is megaloblastic. A high homocysteine with a normal MMA means folate deficiency.\nTakeaway: Treat with oral folate 1 to 5 mg.", "l": ["W9 4.4", "W9 4.2"]}, {"c": "Hemolytic", "p": "Two patients have hemolysis.\n\nPatient A, 71, has CLL and a hemolytic anemia with spherocytes. His DAT is positive for IgG. His fingers go white in the cold.\n\nPatient B, 22, has Mycoplasma pneumonia, and her film shows red cell agglutination with a DAT positive for C3. She has a warm, flushed face from fever.\n\nWhich antibody binding pattern fits each patient, in order?", "o": ["A: IgM binding at 4-30°C. B: IgG binding at 37°C", "A: IgG binding at 37°C. B: IgM binding at 4-30°C", "A: IgG binding at 4-30°C. B: IgM binding at 37°C", "A: IgM binding at 37°C. B: IgG binding at 4-30°C"], "a": 1, "e": "Correct: B. Patient A has warm AIHA, linked to lymphoproliferative disease, with IgG binding at 37°C. Patient B has cold AIHA after Mycoplasma, with complement-fixing IgM binding at 4 to 30°C.\nA: This reverses warm and cold AIHA.\nC: IgG binds at 37°C, and IgM binds in the cold.\nD: This keeps the temperatures but swaps the antibody types.\nRed herring: Patient A's cold fingers and Patient B's fever tempt you to swap the temperatures. The DAT decides: IgG with spherocytes is warm AIHA, and C3 with agglutination is cold AIHA.\nTakeaway: Warm is IgG at body heat. Cold is IgM with C3.", "l": ["W9 6.3", "W9 6.1"]}, {"c": "Normocytic", "p": "Rami, 8, has pancytopenia. He is the shortest in his class, has patchy brown skin pigmentation and had a heart defect repaired as a baby. One thumb has three bones. His older sister has Diamond Blackfan anemia.\n\nWhich hereditary marrow failure syndrome is associated with short stature, a triphalangeal thumb, skin pigmentation and heart defects?", "o": ["Diamond Blackfan anemia", "Sickle cell disease", "Fanconi anemia", "Dyskeratosis congenita"], "a": 2, "e": "Correct: C. Short stature, triphalangeal thumb, skin pigmentation and heart defects are the listed features of Fanconi anemia, a hereditary cause of aplastic anemia.\nA: Diamond Blackfan anemia is a cause of pure red cell aplasia, not pancytopenia.\nB: Sickle cell disease is a hemolytic beta chain disorder, not marrow failure.\nD: Dyskeratosis congenita shows oral leukoplakia, nail dystrophy and lacy pigmentation on the neck and back.\nRed herring: His sister's Diamond Blackfan anemia tempts that diagnosis, but DBA causes pure red cell aplasia, not pancytopenia.\nTakeaway: Thumb and heart defects with short stature point to Fanconi anemia.", "l": ["W9 3.3"]}, {"c": "Normocytic", "p": "Grace, 24, has 1 month of fatigue, gum bleeding after brushing and two bouts of tonsillitis treated with antibiotics. She had hepatitis A from contaminated food 6 months ago that resolved. She takes an oral contraceptive pill and no other drugs. She has no toxic exposures and no family history of blood disorders. Her grandmother had leukemia.\n\nShe has had no weight loss, night sweats or bone pain. She works as a dental hygienist and does not smoke or use drugs. She has no allergies. Her parents and brother are well.\n\nVitals: HR 104, BP 106/66, T 37.5°C.\nExam: Petechiae on her legs. No enlarged nodes, liver or spleen. Normal height. Normal thumbs and skin.\n\nHb 76 g/L (ref 115-160)\nMCV 96 fL (ref 80-100)\nReticulocytes low\nWBC 1.9 × 10⁹/L (ref 4-10)\nANC 0.5 × 10⁹/L (ref 1.5 or more)\nPlatelets 18 × 10⁹/L (ref 150-450)\nFilm: no blasts, no teardrop cells.\nMarrow biopsy: hypocellular, made mostly of fat cells.\n\nWhat is the most likely diagnosis?", "o": ["Pure red cell aplasia", "Acute lymphoblastic leukemia", "Myelophthisis", "Fanconi anemia", "Idiopathic aplastic anemia"], "a": 4, "e": "Correct: E. Pancytopenia with a fatty, hypocellular marrow, no cause and no physical features fits idiopathic aplastic anemia, the most common form.\nA: Pure red cell aplasia lowers only red cells.\nB: ALL shows blasts and a packed marrow.\nC: Myelophthisis shows teardrop cells and a leukoerythroblastic film.\nD: Fanconi anemia brings short stature, triphalangeal thumbs and other features.\nRed herring: Her grandmother's leukemia tempts ALL, but there are no blasts and the marrow is empty, not packed. Normal height and thumbs argue against Fanconi anemia. Pancytopenia with a fatty marrow and no cause found is idiopathic aplastic anemia.\nTakeaway: Aplastic anemia: antithymocyte globulin and cyclosporine, or a marrow transplant if eligible.", "l": ["W9 3.3", "W9 3.5"]}, {"c": "Quality improvement", "p": "A hospital team wants to cut unneeded blood transfusions on the medical ward. A senior resident suggests running it like a randomized trial: one fixed intervention, outliers removed, and data collected only at the start and the end. A QI coach explains how a quality improvement project differs.\n\nWhich statement correctly contrasts quality improvement with conventional research?", "o": ["QI excludes context so results can be generalized", "QI gathers maximum data at a few discrete points", "QI tests one fixed intervention over the project", "QI treats outliers as a source of hypotheses"], "a": 3, "e": "Correct: D. In quality improvement, outliers are a source of hypotheses. In research they are eliminated.\nA: In QI context is important and examined to find root causes.\nB: QI uses just enough data, in small amounts over time.\nC: QI uses many sequential interventions. Research uses one fixed one.\nRed herring: A rigorous trial design sounds better, but QI works differently: many small changes, just enough data over time, and outliers studied for ideas.\nTakeaway: Research creates new knowledge. QI applies existing knowledge to reach a target.", "l": ["W9 13.1"]}, {"c": "Microcytic", "p": "Joseph, 58, has active rheumatoid arthritis and a mild microcytic anemia. His ferritin is high, his serum iron is low and his transferrin is low. He takes no NSAIDs. His rheumatologist explains why his body has iron but cannot use it.\n\nIn anemia of chronic inflammation, which mechanism explains a low serum iron despite a high ferritin?", "o": ["Hepcidin overproduction blocks ferroportin from releasing stored iron", "Iron deposits in mitochondria as a ring around the precursor nucleus", "Low dietary intake slowly depletes the body's iron stores", "A quantitative defect in the synthesis of alpha or beta globin chains"], "a": 0, "e": "Correct: A. Chronic inflammation with high ferritin and low serum iron fits anemia of chronic inflammation. Hepcidin inhibits ferroportin, so iron stays trapped in stores. This is a functional iron deficiency.\nB: Mitochondrial iron rings define sideroblastic anemia.\nC: Low intake causes true iron deficiency with a low ferritin.\nD: Globin chain defects cause thalassemia, which has normal iron studies.\nRed herring: A low serum iron tempts depleted stores, but his ferritin is high. Hepcidin traps iron in stores, a functional iron deficiency.\nTakeaway: Anemia of chronic inflammation is a functional iron deficiency driven by hepcidin.", "l": ["W9 1.1"]}, {"c": "Iron and vitamins", "p": "A hematology nurse reviews four referrals for erythropoietin. Each patient has anemia and asks whether EPO could reduce their need for transfusion.\n\nErythropoietin is an accepted treatment for anemia in each of these patients EXCEPT:", "o": ["A patient with AIDS taking antiviral therapy", "A patient with MDS who needs frequent transfusions", "A man with chronic renal failure on dialysis", "A woman with iron deficiency from heavy periods"], "a": 3, "e": "Correct: D. Iron deficiency from blood loss is treated with iron and by finding the cause. It is not a listed EPO indication.\nA: Anemia in AIDS on antivirals is a listed indication.\nB: EPO is listed in MDS to reduce transfusions.\nC: Chronic renal failure is a listed EPO indication.\nRed herring: Every patient is anemic, which makes all four seem eligible. Iron deficiency is treated with iron and by finding the source, not with EPO.\nTakeaway: EPO indications: renal failure, AIDS on antivirals, chemotherapy, pre-op, MDS.", "l": ["W9 7.4"]}, {"c": "Quality improvement", "p": "A hospital project aims to cut unneeded repeat B12 tests. The main result tracked is the number of repeat tests per month. The team also tracks how often lab staff follow the new ordering rule, and how many true B12 deficiencies are missed after the change.\n\nWhat type of measure is the number of missed B12 deficiencies?", "o": ["Root cause measure", "Process measure", "Balancing measure", "Outcome measure"], "a": 2, "e": "Correct: C. Balancing measures track unintended consequences. Missed diagnoses are a possible harm of cutting tests.\nA: Root cause analysis is a separate step, not part of the family of measures.\nB: Process measures track the means intended to reach the outcome.\nD: The outcome measure is the main result of interest, the number of repeat tests.\nRed herring: Missed diagnoses sound like an outcome, but the main outcome is repeat tests. Tracking an unintended harm of the change is a balancing measure.\nTakeaway: Family of measures: outcome, process, balancing.", "l": ["W9 13.1", "W9 13.3"]}, {"c": "Hemoglobinopathy", "p": "Kwame, 16, has sickle cell disease. In a biology class he learns that his disease comes from a single amino acid change. His friend, who has HbC disease, says they have \"the same mutation\".\n\nWhich statement about sickle cell disease is correct?", "o": ["Polymerization occurs when the hemoglobin is fully oxygenated in the lungs", "Glutamate is replaced by valine at the 6th amino acid of beta globin", "Glutamate is replaced by lysine at the 6th amino acid of beta globin", "The disease is inherited in an X-linked recessive pattern"], "a": 1, "e": "Correct: B. HbS comes from a glutamate to valine change at the 6th amino acid of the beta chain.\nA: Polymerization happens when hemoglobin is deoxygenated.\nC: Glutamate to lysine describes HbC.\nD: Sickle cell disease is autosomal recessive. G6PD deficiency is X-linked.\nRed herring: His friend's HbC is a real disorder at the same position, which tempts you to pick lysine. HbS is glutamate to valine. HbC is glutamate to lysine.\nTakeaway: HbS is Glu to Val. HbC is Glu to Lys.", "l": ["W9 2.1", "W9 9.2"]}, {"c": "Iron and vitamins", "p": "Peter, 45, had 100 cm of terminal ileum removed for Crohn's disease 5 years ago. He now has a megaloblastic anemia, a high MMA and a high homocysteine. He also had heavy rectal bleeding from a Crohn's flare last month, and his ferritin is low-normal.\n\nWhich initial treatment matches B12 deficiency after an ileal resection?", "o": ["IM cobalamin 100 mcg daily for 1 to 2 weeks", "IV iron to correct poor gut absorption", "Folic acid 0.4 mg daily, the same as in pregnancy", "Oral folate 1 to 5 mg daily on its own"], "a": 0, "e": "Correct: A. Listed B12 treatment is IM cobalamin 100 mcg daily for 1 to 2 weeks, with oral B12 1 mg as the other option.\nB: IV iron treats iron deficiency, not B12 deficiency.\nC: 0.4 mg folic acid is the pregnancy dose, not B12 treatment.\nD: Folate alone does not replace B12.\nRed herring: The rectal bleeding and borderline ferritin tempt IV iron, which he may need later, but the question asks how to treat his B12 deficiency.\nTakeaway: Post-resection patients should stay on B12 supplementation.", "l": ["W9 7.6", "W9 4.5"]}, {"c": "Hemoglobinopathy", "p": "Andreas, 14 months, of Greek descent, has grown poorly and become pale and irritable over 2 months. His parents are both known to have \"small red cells\" with no symptoms. He drinks 1 L of cow's milk a day. He had a viral illness with diarrhea 3 weeks ago. He was born at term after an uncomplicated pregnancy.\n\nHis parents say he feeds poorly and sleeps more than his cousins did at the same age. He has had no blood in his stool, bruising or jaundice. His vaccines are up to date. He has no siblings.\n\nVitals: HR 148, RR 32, T 37.0°C.\nExam: Pale. Large liver and spleen. Prominent forehead and cheekbones. Soft flow murmur.\n\nHb 58 g/L (ref 110-140)\nMCV 58 fL (ref 80-100)\nReticulocytes high\nWBC 9.4 × 10⁹/L (ref 4-10)\nPlatelets 330 × 10⁹/L (ref 150-450)\nFerritin normal\nHbF markedly elevated\nFilm: severe hypochromia, target cells, nucleated red cells.\n\nWhat is the most likely diagnosis?", "o": ["HbH disease", "Sickle cell disease", "β-thalassemia minor", "Iron deficiency anemia", "β-thalassemia major"], "a": 4, "e": "Correct: E. Two carrier parents, severe microcytic anemia in early childhood, hepatosplenomegaly and a very high HbF fit β-thalassemia major, the homozygous form. It is common in Mediterraneans.\nA: HbH disease is a form of α-thalassemia, common in Southeast Asia.\nB: Sickle cell disease shows sickle cells on the film.\nC: β-thalassemia minor gives a mild anemia with a high HbA2.\nD: Iron deficiency has a low ferritin.\nRed herring: A litre of milk a day tempts iron deficiency, but his ferritin is normal. Two carrier parents, severe anemia in early childhood, bone changes, organ enlargement and a very high HbF mean β-thalassemia major.\nTakeaway: Transfused thalassemia needs chelation once ferritin passes 1000.", "l": ["W9 2.2", "W9 2.3"]}, {"c": "Macrocytic", "p": "Helen, 63, has vitiligo and treated hypothyroidism. She has 4 months of fatigue, a sore tongue and tingling in her fingers, and she has become unsteady in the dark. She eats meat and dairy daily and has had no bowel surgery. She drinks a glass of wine most evenings. Her TSH was normal last month. She started metformin for diabetes 2 years ago.\n\nShe has had no diarrhea, weight loss or abdominal pain. She has dropped things more often and stumbled twice this month. She lives with her husband, walks daily and does not smoke. Her mother had type 1 diabetes.\n\nVitals: HR 90, BP 126/78.\nExam: Smooth red tongue. Reduced vibration and position sense in her feet. Positive Romberg.\n\nHb 84 g/L (ref 115-160)\nMCV 121 fL (ref 80-100)\nReticulocytes low\nWBC 3.4 × 10⁹/L (ref 4-10)\nPlatelets 118 × 10⁹/L (ref 150-450)\nSerum B12 low\nMethylmalonic acid high\nHomocysteine high\nFilm: oval macrocytes and hypersegmented neutrophils.\n\nWhat is the most likely diagnosis?", "o": ["B12 deficiency from poor diet", "Hypothyroidism", "Pernicious anemia", "Myelodysplastic syndrome", "Folate deficiency"], "a": 2, "e": "Correct: C. An autoimmune background, a good diet, no surgery, neurological signs and a high MMA with high homocysteine point to B12 deficiency from pernicious anemia, a lack of intrinsic factor in the gastric mucosa.\nA: She eats meat and dairy daily.\nB: Hypothyroidism is non-megaloblastic, and hers is treated.\nD: MDS would not raise the MMA or lower the B12.\nE: Folate deficiency raises homocysteine only, with no neurological signs.\nRed herring: Hypothyroidism and wine both cause macrocytosis, but they are non-megaloblastic, and her TSH is normal. Her good diet rules out dietary B12 lack. Autoimmune disease with B12 deficiency points to pernicious anemia.\nTakeaway: MMA plus homocysteine means B12. Homocysteine only means folate.", "l": ["W9 4.1", "W9 4.3"]}, {"c": "Blood film", "p": "Lena, 45, has target cells reported on her blood film. Her doctor checks the usual causes. She drinks heavily, had her spleen removed after a skiing accident, and her brother has thalassemia trait. Her mother has hereditary spherocytosis.\n\nTarget cells on a blood film are associated with each of these conditions EXCEPT:", "o": ["Hyposplenism", "Hereditary spherocytosis", "Thalassemia", "Liver disease from alcohol"], "a": 1, "e": "Correct: B. Target cells come from extra membrane relative to cell volume. Hereditary spherocytosis does the opposite. The membrane is lost and cells become spheres.\nA: Hyposplenism is a listed cause of target cells.\nC: Thalassemia is a listed cause of target cells.\nD: Liver disease and alcohol are listed causes of target cells.\nRed herring: Her mother's hereditary spherocytosis is in the family, which makes it tempting to count. Hereditary spherocytosis loses membrane and forms spheres, the opposite of target cells.\nTakeaway: Target cells: liver disease, hyposplenism, thalassemia, rarely severe iron deficiency.", "l": ["W9 9.3"]}, {"c": "Macrocytic", "p": "Two patients have a macrocytic anemia.\n\nPatient A, 55, drinks heavily and has alcohol-related liver disease. His film shows large round red cells and normal neutrophils. He also eats poorly.\n\nPatient B, 30, is a strict vegan who takes a daily multivitamin without B12. Her film shows oval macrocytes and hypersegmented neutrophils.\n\nHow is each anemia best classified, in order?", "o": ["Both non-megaloblastic", "Both megaloblastic", "A megaloblastic, B non-megaloblastic", "A non-megaloblastic, B megaloblastic"], "a": 3, "e": "Correct: D. Large round red cells with normal neutrophils are non-megaloblastic, as in liver disease. Oval macrocytes with hypersegmented neutrophils are megaloblastic, as in B12 deficiency from a vegan diet.\nA: Patient B has hypersegmented neutrophils, the megaloblastic sign.\nB: Patient A has normal neutrophils and round cells, which is not megaloblastic.\nC: This reverses the two film patterns.\nRed herring: Patient A's poor diet tempts you to call his anemia megaloblastic. His film decides: large round cells with normal neutrophils are non-megaloblastic.\nTakeaway: Hypersegmented neutrophils and oval macrocytes mean a DNA synthesis failure.", "l": ["W9 4.2"]}, {"c": "Hemoglobinopathy", "p": "Ama, 2, has sickle cell disease found on newborn screening. She is well, with no crises yet. Her parents ask about her daily care. Her aunt has hereditary spherocytosis and had her spleen removed. Ama's Hb is 82 g/L with high retics, and her ferritin is normal.\n\nWhich plan matches the routine care of a young child with sickle cell disease?", "o": ["Oral iron and a repeat CBC in three months", "Penicillin prophylaxis until age 5 and folate", "Desferoxamine chelation from the time of diagnosis", "Splenectomy followed by vaccination"], "a": 1, "e": "Correct: B. Listed sickle cell care includes folate supplementation, hydroxyurea and penicillin prophylaxis up to age 5.\nA: Sickle cell disease is hemolytic, not iron deficient.\nC: Chelation is for iron overload, not a routine step at diagnosis.\nD: Splenectomy is listed for severe spherocytosis and G6PD deficiency, not sickle cell disease.\nRed herring: Her aunt's splenectomy tempts splenectomy, which is listed for severe spherocytosis. The low Hb tempts iron, but her ferritin is normal and the anemia is hemolytic.\nTakeaway: Sickle cell in a young child: penicillin to age 5, folate and hydroxyurea.", "l": ["W9 2.3"]}, {"c": "Microcytic", "p": "Chloe, 26, has 6 months of fatigue, bloating and loose, greasy stools. She has light periods because of an IUD and eats red meat several times a week. She has type 1 diabetes, and her sister has thyroid disease. She runs 5 km three times a week. She has no GI bleeding and no chronic inflammatory disease.\n\nShe has had no fevers, joint pain or rash. She works as a teacher. She does not smoke and drinks socially. She takes insulin and a multivitamin without iron. Her mother has anemia that \"never got better with iron pills\".\n\nVitals: HR 96, BP 108/66.\nExam: Pale. Angular cheilitis. Thin, spoon-shaped nails. Mild abdominal distension.\n\nHb 94 g/L (ref 115-160)\nMCV 69 fL (ref 80-100)\nRDW high\nWBC 6.1 × 10⁹/L (ref 4-10)\nPlatelets 470 × 10⁹/L (ref 150-450)\nFerritin low\nTransferrin high\nFilm: hypochromic microcytes with anisocytosis and elliptocytes.\n\nWhat is the most likely diagnosis?", "o": ["Anemia of chronic inflammation", "β-thalassemia minor", "Sideroblastic anemia", "Iron deficiency from menstrual loss", "Iron deficiency from celiac disease"], "a": 4, "e": "Correct: E. Low ferritin, high transferrin, high RDW and koilonychia confirm iron deficiency. With a good diet, light periods and malabsorptive stools, the cause is reduced intestinal absorption, and celiac disease is the listed example.\nA: Anemia of chronic inflammation has a high ferritin and low transferrin.\nB: Thalassemia minor has a normal ferritin and a normal RDW.\nC: Sideroblastic anemia has normal iron stores and basophilic stippling.\nD: Her periods are light, so menstrual loss doesn't explain it.\nRed herring: Running tempts iron loss, and periods tempt menstrual loss, but her periods are light and she runs modest distances. Malabsorptive stools and an autoimmune background point to celiac disease as the cause of her iron deficiency.\nTakeaway: Iron deficiency with a good diet and no blood loss: look for malabsorption.", "l": ["W9 1.2", "W9 1.4"]}, {"c": "MDS", "p": "Harold, 79, has 6 months of fatigue and two chest infections this winter. He had chemotherapy and radiation for lymphoma 8 years ago. He drinks one beer a week and eats well. He takes metformin and ramipril. His wife says he has seemed more forgetful. He had his B12 checked by his family doctor.\n\nHe has had no weight loss, bone pain or night sweats. He has had no bleeding or bruising. He lives with his wife and still drives. He has no history of toxin exposure apart from his past cancer treatment.\n\nVitals: HR 88, BP 130/76, T 36.8°C.\nExam: Pale. No enlarged nodes, liver or spleen. Normal neurological exam.\n\nHb 86 g/L (ref 135-170)\nMCV 106 fL (ref 80-100)\nReticulocytes low\nWBC 2.6 × 10⁹/L (ref 4-10)\nANC 0.9 × 10⁹/L (ref 1.5 or more)\nPlatelets 92 × 10⁹/L (ref 150-450)\nB12 and folate normal\nTSH normal\nFilm: dysplastic neutrophils, no blasts.\nMarrow: dysplasia in more than one cell line, blasts not increased.\n\nWhat is the most likely diagnosis?", "o": ["Myelodysplastic syndrome", "Aplastic anemia", "Acute myeloid leukemia", "B12 deficiency", "Myelophthisis"], "a": 0, "e": "Correct: A. An older man with past chemotherapy and radiation, a macrocytic anemia with other cytopenias, normal B12, folate and TSH, and dysplasia in the marrow fits MDS. It is much more common in the elderly and can follow toxic exposures.\nB: Aplastic anemia shows a hypocellular, fatty marrow without dysplasia.\nC: AML needs increased blasts.\nD: His B12 is normal.\nE: Myelophthisis shows a leukoerythroblastic film with teardrop cells.\nRed herring: Forgetfulness and metformin tempt B12 deficiency, but his B12 is normal. His past lymphoma tempts a relapse. Dysplasia in the marrow without increased blasts, after past chemotherapy, means MDS.\nTakeaway: MDS carries a risk of transformation to AML.", "l": ["W9 10.2", "W9 10.1"]}, {"c": "Hemoglobinopathy", "p": "Kofi, 3, of Ghanaian descent, has had 2 days of painful, swollen hands and feet. He cries when anyone touches his fingers. He has a low-grade fever and a runny nose. His parents say his newborn screen \"showed something\" but they never followed up. His father has sickle cell trait and is well. Kofi had a dog bite on his hand 10 days ago that healed.\n\nHis vaccines are up to date. He has had no recent travel. He has had similar but milder pain once before, which settled in a day. He has an older sister who is well. He goes to daycare.\n\nVitals: HR 136, RR 28, T 38.1°C.\nExam: Pale. Swollen, tender fingers and toes on both hands and feet. No wound infection. Spleen tip palpable.\n\nHb 74 g/L (ref 110-140)\nMCV 84 fL (ref 80-100)\nReticulocytes high\nWBC 13.2 × 10⁹/L (ref 4-10)\nPlatelets 410 × 10⁹/L (ref 150-450)\nIndirect bilirubin high\nLDH high\nFilm: elongated red cells with no central pallor, and target cells.\n\nWhat is the most likely diagnosis?", "o": ["Hereditary spherocytosis", "G6PD deficiency", "Sickle cell disease", "Sickle cell trait", "β-thalassemia major"], "a": 2, "e": "Correct: C. Dactylitis, a hemolytic anemia and sickle cells on the film in a child of African descent fit sickle cell disease. Valine replaces glutamate on β globin, and HbS polymerizes.\nA: Hereditary spherocytosis shows spherocytes.\nB: G6PD deficiency shows bite cells and Heinz bodies.\nD: Sickle trait is usually silent, without crises or anemia.\nE: β-thalassemia major is microcytic, with no sickle cells.\nRed herring: The dog bite tempts a hand infection, but both hands and both feet are swollen. His father's trait tempts sickle trait, which is usually silent. Dactylitis with hemolysis and sickle cells means sickle cell disease.\nTakeaway: Crisis care: oxygen, IV fluids, opiates or NSAIDs, and treat the cause.", "l": ["W9 2.1", "W9 2.3"]}, {"c": "Macrocytic", "p": "June, 58, eats meat daily and has never had bowel surgery. She has vitiligo and Hashimoto thyroiditis. She went fishing in northern lakes last summer and ate the fish she caught. Her B12 is low.\n\nWhich mechanism most likely explains her low B12?", "o": ["Increased demand from active hemolysis", "A past jejunal resection that blocks folate absorption", "A fish tapeworm competing for dietary B12", "Lack of intrinsic factor from the gastric mucosa"], "a": 3, "e": "Correct: D. A meat eater with no surgery and an autoimmune history fits pernicious anemia. A lack of intrinsic factor in the gastric mucosa impairs B12 uptake.\nA: Hemolysis increases folate demand, not B12 loss.\nB: Jejunal resection causes folate malabsorption, and she has had no surgery.\nC: Fish tapeworm is a listed intestinal cause, but nothing in her history suggests it.\nRed herring: Eating lake fish tempts fish tapeworm, a listed intestinal cause. Her autoimmune background makes a lack of intrinsic factor, pernicious anemia, much more likely.\nTakeaway: Pernicious anemia is the gastric cause of B12 deficiency.", "l": ["W9 4.1"]}, {"c": "Microcytic", "p": "A family doctor reviews four patients for iron deficiency risk.\ni) A strict vegan\nii) A woman with celiac disease\niii) A man who runs marathons\niv) A woman with untreated hypothyroidism and fatigue\n\nWhich of these patients belong to a high-risk group for iron deficiency?", "o": ["ii), iii) and iv) only", "i) and ii) only", "i), ii) and iii) only", "All of the above"], "a": 2, "e": "Correct: C. Vegan diet lowers intake, celiac disease lowers absorption and marathon running increases loss. All three are listed causes of iron deficiency.\nA: This drops the vegan diet and adds hypothyroidism, which is a cause of macrocytic anemia.\nB: This leaves out marathon running, a listed source of iron loss.\nD: Hypothyroidism is a macrocytic cause in ABCDEF, not an iron deficiency risk.\nRed herring: Fatigue in the hypothyroid patient sounds like iron deficiency, but hypothyroidism is a cause of macrocytic anemia, not an iron deficiency risk.\nTakeaway: Think intake, absorption, demand and loss when screening for iron deficiency risk.", "l": ["W9 1.2"]}, {"c": "Blood film", "p": "A hematology lab trainee reviews films with inclusions from four patients: one with lead poisoning, one after splenectomy, one with G6PD deficiency after fava beans and one with sideroblastic anemia.\n\nWhich pairing of red cell inclusion and its content is correct?", "o": ["Basophilic stippling: remnants of DNA", "Howell-Jolly bodies: denatured hemoglobin", "Heinz bodies: precipitated RNA granules", "Pappenheimer bodies: granules of iron"], "a": 3, "e": "Correct: D. Pappenheimer bodies are siderotic granules of iron.\nA: Basophilic stippling is made of RNA precipitates.\nB: Howell-Jolly bodies are DNA remnants at the cell edge.\nC: Heinz bodies are denatured and precipitated hemoglobin.\nRed herring: Each inclusion has a matching patient here, which makes the swapped pairs look right. Pappenheimer bodies are iron, Heinz bodies are hemoglobin, Howell-Jolly bodies are DNA and stippling is RNA.\nTakeaway: Howell-Jolly DNA, Heinz hemoglobin, Pappenheimer iron, stippling RNA.", "l": ["W9 9.2"]}, {"c": "Hemolytic", "p": "Liam, 30, has fatigue and yellow eyes. He also drinks heavily, so his doctor wonders if it is liver disease. His Hb is 98 g/L and his reticulocytes are high.\n\nWhich set of results best supports ongoing hemolysis?", "o": ["High LDH, high indirect bilirubin and low haptoglobin", "Low indirect bilirubin, high haptoglobin and high ferritin", "High LDH, low reticulocytes and high haptoglobin", "Low LDH, high indirect bilirubin and high haptoglobin"], "a": 0, "e": "Correct: A. Red cell destruction raises indirect bilirubin, LDH and reticulocytes and lowers haptoglobin.\nB: Indirect bilirubin rises and haptoglobin falls in hemolysis.\nC: Reticulocytes rise and haptoglobin falls in hemolysis.\nD: LDH rises and haptoglobin falls in hemolysis.\nRed herring: Heavy drinking tempts liver disease as the cause of jaundice. A low haptoglobin with high LDH and indirect bilirubin points to red cell destruction.\nTakeaway: Hemolysis labs: LDH up, bilirubin up, retics up, haptoglobin down.", "l": ["W9 6.2"]}, {"c": "Microcytic", "p": "Dev, 61, drinks heavily and started isoniazid for TB 2 months ago. He has a microcytic anemia with Pappenheimer bodies and ring sideroblasts in his marrow. His sister has thalassemia trait, and he had a minor hemorrhoid bleed last month.\n\nWhich statement describes the iron problem in sideroblastic anemia from alcohol or anti-TB drugs?", "o": ["Ferritin is low because the body's iron stores have been fully depleted", "Iron is present in normal amounts but cannot be built into hemoglobin", "HbA2 is raised on hemoglobin electrophoresis", "Hepcidin overproduction traps iron inside storage cells"], "a": 1, "e": "Correct: B. Ring iron in precursors after alcohol and anti-TB drugs fits sideroblastic anemia. Iron is present in normal amounts but cannot be incorporated into hemoglobin.\nA: Depleted stores with a low ferritin describe iron deficiency.\nC: A raised HbA2 marks beta thalassemia.\nD: Hepcidin trapping describes anemia of chronic inflammation.\nRed herring: The bleed tempts depleted stores and his sister tempts thalassemia. In sideroblastic anemia iron is present but cannot be built into hemoglobin.\nTakeaway: Sideroblastic anemia is a heme defect with normal iron that cannot be used.", "l": ["W9 1.1"]}, {"c": "Iron and vitamins", "p": "Nadia, 41, starts oral iron for iron deficiency from heavy periods. She is impatient to feel better and asks when each test will improve. She also wants to know when she can stop. Her doctor plans checks at 1 week, 1 month, 3 months and 6 months.\n\nAfter starting oral iron for iron deficiency anemia, which response timeline matches the notes?", "o": ["Hb rising by 1 week, reticulocytes by 2 to 4 weeks, stores full by 3 months", "Reticulocytes by 1 week, anemia corrected by 2 to 4 weeks, stores full by 6 weeks", "Hb rising by 3 months, reticulocytes by 6 months, stores never fully restored", "Reticulocytes by 1 week, Hb rising by 2 to 4 weeks, anemia corrected by 3 months"], "a": 3, "e": "Correct: D. The listed order is reticulocytes at 1 week, Hb rising at 2 to 4 weeks, anemia corrected by 3 months and stores replenished by 3 to 6 months.\nA: Reticulocytes rise before the Hb, not after.\nB: The anemia takes about 3 months to correct, and stores take 3 to 6 months.\nC: Reticulocytes respond within a week, and stores do refill by 3 to 6 months.\nRed herring: Her eagerness to stop tempts a short timeline. Retics rise first at 1 week, Hb by 2 to 4 weeks, the anemia corrects by 3 months, and stores refill by 3 to 6 months.\nTakeaway: Retics first, then Hb, then stores.", "l": ["W9 7.2"]}, {"c": "Microcytic", "p": "Joseph, 58, has had rheumatoid arthritis for 15 years, with active synovitis in his hands. He is tired. He takes methotrexate and a low dose of prednisone, and he stopped naproxen a year ago. He had black stools once last month after eating blueberries. He eats a mixed diet. His brother has thalassemia trait.\n\nHe has had no weight loss, night sweats or abdominal pain. His appetite is normal. He works as an accountant and walks daily when his joints allow. He does not smoke and drinks 1 to 2 beers a week.\n\nVitals: HR 84, BP 128/80.\nExam: Swollen, tender MCP joints. Mild pallor. No splenomegaly.\n\nHb 106 g/L (ref 135-170)\nMCV 79 fL (ref 80-100)\nRDW normal\nWBC 8.0 × 10⁹/L (ref 4-10)\nPlatelets 410 × 10⁹/L (ref 150-450)\nFerritin high\nSerum iron low\nTransferrin low\n\nWhat is the most likely diagnosis?", "o": ["β-thalassemia minor", "Myelodysplastic syndrome", "Sideroblastic anemia", "Iron deficiency anemia", "Anemia of chronic inflammation"], "a": 4, "e": "Correct: E. Active chronic inflammation with a mild anemia, a high ferritin, a low serum iron and a low transferrin fits anemia of chronic inflammation. Hepcidin blocks ferroportin, so iron stays trapped in stores.\nA: Thalassemia minor has normal iron studies.\nB: MDS is usually normocytic or macrocytic, with dysplasia.\nC: Sideroblastic anemia needs a toxin, drug, B6 deficiency or MDS, and shows ring sideroblasts.\nD: Iron deficiency has a low ferritin and a high transferrin and RDW.\nRed herring: Black stools after blueberries and the old naproxen tempt GI bleeding and iron deficiency, but his ferritin is high and transferrin low. His brother's trait tempts thalassemia, which has normal iron studies. Active inflammation with this pattern means anemia of chronic inflammation.\nTakeaway: Treat the underlying disease. EPO is used in severe cases.", "l": ["W9 1.1", "W9 1.3"]}];
const OBJECTIVES = {"W9 1.1": "Explain the pathophysiology of the major causes of microcytic anemia.", "W9 1.2": "List the high-risk groups for developing iron deficiency.", "W9 1.3": "Compare and contrast the symptoms and signs of iron deficiency anemia and other diseases associated with microcytic anemia.", "W9 1.4": "Using laboratory investigations differentiate iron deficiency anemia and other diseases associated with microcytic anemia.", "W9 1.5": "Explain the rationale for the management options of the 3 most common types of microcytic anemia.", "W9 2.1": "List and interpret critical clinical findings of a patient with hemoglobinopathy.", "W9 2.2": "Appropriately order and interpret critical investigations in patients with hemoglobinopathy.", "W9 2.3": "Construct an effective initial management plan for patients with hemoglobinopathy.", "W9 3.1": "Explain the pathophysiology of the major causes of normocytic anemia.", "W9 3.3": "Compare and contrast the symptoms and signs of diseases associated with normocytic anemia.", "W9 3.4": "Differentiate diseases associated with normocytic anemia by selecting appropriate tests and interpreting results of investigations.", "W9 3.5": "Explain the rationale for the management options of the most common types of normocytic anemia.", "W9 4.1": "Explain the pathophysiology of the major causes of macrocytic anemia.", "W9 4.2": "Differentiate between megaloblastic and non-megaloblastic anemias.", "W9 4.3": "Compare and contrast the symptoms and signs of diseases associated with macrocytic anemia.", "W9 4.4": "Differentiate diseases associated with macrocytic anemia by selecting appropriate tests and interpreting results of investigations.", "W9 4.5": "Explain the rationale for the management options of the most common types of macrocytic anemia.", "W9 6.1": "Explain the pathophysiology of the major causes of hemolytic anemia.", "W9 6.2": "List laboratory tests used to evaluate RBCs breakdown/ destruction.", "W9 6.3": "Differentiate diseases associated with hemolytic anemia by selecting appropriate tests and interpreting results of investigations.", "W9 6.4": "Compare and contrast peripheral blood smear findings in different subtypes of hemolytic anemias.", "W9 7.2": "List changes seen in peripheral blood and bone marrow after receiving iron treatment.", "W9 7.4": "List indications for erythropoietin (EPO) therapy and the side effects that are related to treatment.", "W9 7.5": "Describe laboratory changes related to vitamin B12 and folate deficiencies.", "W9 7.6": "Describe the management of vitamin B12 and folate deficiencies.", "W9 9.2": "Recognize different red cell morphology on blood film.", "W9 9.3": "List the most common conditions associated with each red cell morphology.", "W9 10.1": "Define myelodysplastic syndromes (MDS).", "W9 10.2": "List the signs and symptoms associated with myelodysplastic syndromes (MDS).", "W9 10.4": "List laboratory investigations used to diagnose myelodysplastic syndromes (MDS).", "W9 10.5": "List possible treatment options for myelodysplastic syndromes (MDS).", "W9 13.1": "Describe the key quality improvement concepts.", "W9 13.3": "List practical tools available to improve patient care, processes and outcomes."};
const L = "ABCDE";
const N = QUESTIONS.length;
let cur = 0, showResults = false;
let ans = new Array(N).fill(null);           // current pick per question
let tries = QUESTIONS.map(()=>[]);           // every locked attempt: {pick, ok, at}
let strikes = QUESTIONS.map(()=>[]);         // struck option indexes for the open attempt
let history = [], db = null, uid = null, writing = false, dirty = false;
const MAP=document.getElementById("map"); if(MAP && QUESTIONS.length<=60) MAP.open=true;
const LS_KEY = "differential-week-9-question-bank";
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");

function score(){ return ans.reduce((n,a,i)=>n+(a!==null&&a===QUESTIONS[i].a?1:0),0); }
function answered(){ return ans.filter(a=>a!==null).length; }
function firstTryScore(){ return tries.reduce((n,t)=>n+(t.length&&t[0].ok?1:0),0); }
function firstTryCount(){ return tries.filter(t=>t.length).length; }

function renderHeader(){
  const bf=$("#barfill"); if(bf) bf.style.width=(100*answered()/N)+"%";
  $("#stats").innerHTML = `<span>Question <b>${showResults?"–":cur+1}</b> of <b>${N}</b></span><span>Answered <b>${answered()}</b></span><span>Score <b>${score()} / ${answered()}</b></span>`;
  $("#ticks").innerHTML = QUESTIONS.map((q,i)=>{
    const st = ans[i]===null?"":(ans[i]===q.a?"ok":"bad");
    const redo = tries[i].length>1 || (ans[i]===null && tries[i].length>0);
    return `<button class="tick ${st} ${redo?"redo":""} ${(!showResults&&i===cur)?"cur":""}" data-i="${i}" aria-label="Question ${i+1}"></button>`;
  }).join("");
  document.querySelectorAll(".tick").forEach(b=>b.onclick=()=>{cur=+b.dataset.i;showResults=false;render();});
}

function triesLine(i, includeCurrent){
  const t = includeCurrent ? tries[i] : tries[i];
  if(!t.length) return "";
  const parts = t.map((x,k)=>`<span class="${x.ok?"ok":"bad"}">${k+1}: ${L[x.pick]} ${x.ok?"correct":"wrong"}</span>`).join(" · ");
  return `<div class="tries">Attempts ${parts}</div>`;
}

function fmtLine(t){
  let m;
  if((m=t.match(/^Correct:\s*([A-E])\.?\s*(.*)$/)) || (m=t.match(/^([A-E]) is correct\.?\s*(.*)$/)))
    return `<p class="why"><span class="lk ok">${m[1]}</span><span>${esc(m[2])}</span></p>`;
  if((m=t.match(/^([A-E]):\s*(.*)$/)))
    return `<p class="alt"><span class="lk">${m[1]}</span><span>${esc(m[2])}</span></p>`;
  if((m=t.match(/^(Takeaway|High yield|High-yield|Key point|Clues):\s*(.*)$/i)))
    return `<p class="take"><b>${esc(m[1])}.</b> ${esc(m[2])}</p>`;
  return `<p>${esc(t)}</p>`;
}

function renderQ(){
  const q = QUESTIONS[cur], a = ans[cur], done = a!==null, st = strikes[cur];
  const opts = q.o.map((o,i)=>{
    let c = "";
    if(done){ if(i===q.a) c="right"; else if(i===a) c="wrong"; }
    const struck = !done && st.includes(i);
    const strikeBtn = done ? "" : `<button class="strike" data-s="${i}" aria-pressed="${struck}" aria-label="${struck?"Restore":"Strike out"} option ${L[i]}" title="${struck?"Restore":"Strike out"} option">${struck?"↺":"✕"}</button>`;
    return `<div class="optrow ${struck?"struck":""}"><button class="opt ${c}" data-i="${i}" ${done?"disabled":""}><span class="k">${L[i]}</span><span>${esc(o)}</span></button>${strikeBtn}</div>`;
  }).join("");
  let fb = "";
  if(done){
    const ok = a===q.a;
    const lines = q.e.split("\n").map(fmtLine).join("");
    const objs = q.l.map(id=>`<div class="obj"><b>Objective ${esc(id)}</b> ${esc(OBJECTIVES[id]||"")}</div>`).join("");
    fb = `<div class="fb" role="status"><div class="verdict ${ok?"ok":"bad"}">${ok?"Correct.":"Incorrect. The answer is "+L[q.a]+"."}</div>${lines}${objs}${triesLine(cur)}<div class="fbtools"><button class="btn ghost" id="redo">Reset and redo this question</button></div></div>`;
  }
  const pre = (!done && tries[cur].length) ? `<div class="hint">Redo. Your earlier attempts are saved.</div>${triesLine(cur)}` : (!done ? `<div class="hint">Tap ✕ to strike out an option. Right-click works too.</div>` : "");
  const last = cur===N-1;
  $("#main").innerHTML = `<article class="card">
    <div class="chead"><span class="tag">${esc(q.c)}</span><span class="chead-r">${ankiButton(cur)}<span class="qn">${cur+1} of ${N}</span></span></div>
    <p class="stem">${esc(q.p)}</p>
    ${pre}
    <div class="opts">${opts}</div>
    <div class="offrow">${offButton(cur)}</div>${fb}
    <div class="nav"><button class="btn ghost" id="prev" ${cur===0?"disabled":""}>Previous</button>
    <button class="btn" id="next" ${done?"":"disabled"}>${last?"See results":"Next"}</button></div>
  </article>`;
  document.querySelectorAll(".opt").forEach(b=>{
    b.onclick=()=>{ const p=+b.dataset.i; ans[cur]=p; tries[cur].push({pick:p, ok:p===q.a, at:new Date().toISOString()}); tries[cur]=tries[cur].slice(-10); strikes[cur]=[]; render(false); persist(); };
    b.oncontextmenu=(e)=>{ if(done) return; e.preventDefault(); toggleStrike(+b.dataset.i); };
  });
  document.querySelectorAll(".strike").forEach(b=>b.onclick=()=>toggleStrike(+b.dataset.s));
  const ab=$("#anki"); if(ab) ab.onclick=()=>ankiToggle(cur);
  const ob=$("#off"); if(ob) ob.onclick=()=>offToggle(cur);
  const r=$("#redo"); if(r) r.onclick=()=>{ ans[cur]=null; strikes[cur]=[]; render(false); persist(); };
  $("#prev").onclick=()=>{cur--;render();};
  $("#next").onclick=()=>{ if(last){showResults=true;} else cur++; render(); };
}

function toggleStrike(i){
  const s = strikes[cur], k = s.indexOf(i);
  if(k<0) s.push(i); else s.splice(k,1);
  render(false); persist();
}

function renderResults(){
  const s = score(), pct = Math.round(100*s/N);
  const cats = {};
  QUESTIONS.forEach((q,i)=>{ cats[q.c]=cats[q.c]||[0,0]; cats[q.c][1]++; if(ans[i]===q.a) cats[q.c][0]++; });
  const rows = Object.entries(cats).map(([c,[r,t]])=>`<tr><td>${esc(c)}<span class="meter"><i style="width:${Math.round(100*r/t)}%"></i></span></td><td>${r} / ${t}</td></tr>`).join("");
  const missed = {};
  QUESTIONS.forEach((q,i)=>{ const wrongFirst = tries[i].length && !tries[i][0].ok; if(ans[i]!==q.a || wrongFirst) q.l.forEach(id=>{ const w=id.split(" ")[0]; missed[w]=missed[w]||new Set(); missed[w].add(id); }); });
  const weeks = Object.keys(missed).sort((x,y)=>parseInt(x.slice(1))-parseInt(y.slice(1)));
  const missHtml = weeks.length ? weeks.map(w=>`<h3>Week ${w.slice(1)}</h3><ul class="miss">${[...missed[w]].map(id=>`<li><code>${esc(id)}</code>${esc(OBJECTIVES[id]||"")}</li>`).join("")}</ul>`).join("") : "<p>No missed objectives.</p>";
  const redone = tries.filter(t=>t.length>1).length;
  const un = N - answered();
  $("#main").innerHTML = `<article class="card">
    <div class="chead"><span class="tag">Results</span><span>${un?un+" unanswered":"Complete"}</span></div>
    <div><div class="big">${s} / ${N}</div><div class="stats"><span><b>${pct}%</b> correct now</span><span>First try <b>${firstTryScore()} / ${firstTryCount()}</b></span><span>Redone <b>${redone}</b></span></div></div>
    <table><thead><tr><th>Topic</th><th>Score</th></tr></thead><tbody>${rows}</tbody></table>
    ${ankiMissedRow()}<h2>Objectives to review</h2><p class="hint">Includes questions you missed on the first try, even if a redo got them right.</p>${missHtml}${history.length?`<h2>Past attempts</h2><table><thead><tr><th>Date</th><th>Score</th></tr></thead><tbody>${history.slice().reverse().map(h=>`<tr><td>${new Date(h.date).toLocaleDateString()}</td><td>${h.score} / ${h.total}</td></tr>`).join("")}</tbody></table>`:""}
    <div class="nav"><button class="btn ghost" id="back">Back to questions</button><button class="btn" id="restart">Restart all</button></div>
  </article>`;
  $("#back").onclick=()=>{showResults=false;render();};
  const am=$("#ankimissed"); if(am) am.onclick=()=>{ ankiAdd(missedIdx()); renderResults(); };
  $("#restart").onclick=resetAll;
}
/* Clear every answer, redo and strike-out. The attempt is kept in Past attempts. Flags are not touched. */
function resetAll(){
  if(answered() || tries.some(t=>t.length)){
    history.push({date:new Date().toISOString(), score:score(), answered:answered(), total:N, firstTry:firstTryScore(),
      missed:QUESTIONS.map((q,i)=>ans[i]!==null&&ans[i]!==q.a?"q"+(i+1):null).filter(Boolean)});
    history=history.slice(-20);
  }
  ans.fill(null); tries=QUESTIONS.map(()=>[]); strikes=QUESTIONS.map(()=>[]); cur=0; showResults=false; render(); persist();
}
/* Header button: first tap arms it, second tap within 4 seconds resets. No browser dialog. */
(function(){
  const b=document.getElementById("resetall"); let timer=null;
  const disarm=()=>{ b.classList.remove("armed"); b.textContent="Reset all answers"; clearTimeout(timer); timer=null; };
  b.onclick=()=>{
    if(!b.classList.contains("armed")){ b.classList.add("armed"); b.textContent="Tap again to reset"; timer=setTimeout(disarm,4000); return; }
    disarm(); resetAll(); setSave("All answers cleared. Your score is saved in Past attempts.","ok");
  };
})();

function setSave(text, cls){ const el=$("#save"); if(el){ el.textContent=text; el.className="save "+(cls||""); } }
function bodyOf(){
  const a = {};
  QUESTIONS.forEach((q,i)=>{
    if(ans[i]===null && !tries[i].length && !strikes[i].length) return;
    a["q"+(i+1)] = {pick:ans[i], ok:ans[i]!==null && ans[i]===q.a, l:q.l, tries:tries[i], strikes:strikes[i]};
  });
  return {answers:a, history, total:N, answered:answered(), score:score(), firstTry:firstTryScore(), updatedAt:new Date().toISOString()};
}
function validPick(i,p){ return Number.isInteger(p) && p>=0 && p<QUESTIONS[i].o.length; }
function applySaved(d){
  if(!d || typeof d!=="object") return;
  ans.fill(null); tries=QUESTIONS.map(()=>[]); strikes=QUESTIONS.map(()=>[]);
  const a = d.answers || {};
  for(const k in a){
    const i = parseInt(k.slice(1),10)-1, row = a[k];
    if(!(i>=0 && i<N) || !row || typeof row!=="object") continue;
    if(validPick(i,row.pick)) ans[i]=row.pick;
    if(Array.isArray(row.tries)) tries[i]=row.tries.filter(t=>t&&validPick(i,t.pick)).map(t=>({pick:t.pick, ok:t.pick===QUESTIONS[i].a, at:String(t.at||"")})).slice(-10);
    else if(ans[i]!==null) tries[i]=[{pick:ans[i], ok:ans[i]===QUESTIONS[i].a, at:""}];
    if(Array.isArray(row.strikes)) strikes[i]=row.strikes.filter(x=>validPick(i,x));
  }
  history = Array.isArray(d.history) ? d.history.slice(-20) : [];
  const first = ans.findIndex(x=>x===null); cur = first<0 ? N-1 : first;
}
function lsLoad(){ try{ return JSON.parse(localStorage.getItem(LS_KEY)||"null"); }catch(e){ return null; } }
function lsSave(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(bodyOf())); }catch(e){} }
async function persist(){
  lsSave();
  if(!db || !uid) return;
  dirty = true; if(writing) return; writing = true;
  while(dirty){
    dirty = false;
    setSave("Saving…");
    try{ await db.doc("attempts/"+uid).set(bodyOf()); setSave("Progress saved to your account.","ok"); }
    catch(e){
      if(e && e.code==="invalid_argument"){ db=null; setSave("Progress saves in this browser only.","bad"); break; }
      setSave("Could not save to your account. Progress saves in this browser.","bad");
    }
  }
  writing = false;
}
async function connect(){
  try{
    if(!window.claude || !window.claude.use) return;
    const [u, d] = await Promise.all([window.claude.use("user"), window.claude.use("db")]);
    if(!u || !d) return;
    const id = await u.id(); if(!id) return;
    db = d; uid = id;
    const snap = await db.doc("attempts/"+uid).get();
    if(snap.exists){ applySaved(snap.data()); render(); setSave("Progress saved to your account.","ok"); }
    else if(answered() || tries.some(t=>t.length)){ persist(); }
    else setSave("Progress saves to your account.","ok");
  }catch(e){ /* keep local-only mode */ }
}

/* Flagged: flagged questions live in one shared list ("differential-anki", the key predates the rename)
   that the Flagged tab reads. Each card keeps a copy of its question, so the tab works without loading every quiz. */
const SET = {"slug": "week-9-question-bank", "title": "Week 9 Question Bank", "b": 3, "href": "fom/block-3/question-bank/week-9-question-bank"};
const ANKI_KEY = "differential-anki";
function ankiAll(){ try{ const d=JSON.parse(localStorage.getItem(ANKI_KEY)||"null"); return d && Array.isArray(d.cards) ? d.cards : []; }catch(e){ return []; } }
function ankiPut(cards){ try{ localStorage.setItem(ANKI_KEY, JSON.stringify({v:1, cards})); return true; }catch(e){ setSave("Could not flag. Browser storage is full or blocked.","bad"); return false; } }
function ankiId(i){ return SET.slug+"#"+(i+1); }
function ankiCard(i){
  const q=QUESTIONS[i];
  return {id:ankiId(i), slug:SET.slug, set:SET.title, b:SET.b, href:SET.href, n:i+1, c:q.c, p:q.p, o:q.o, a:q.a, e:q.e, l:q.l, obj:q.l.map(x=>OBJECTIVES[x]||"")};
}
function ankiHas(i, cards){ return (cards||ankiAll()).some(c=>c.id===ankiId(i)); }
function ankiButton(i){ const s=ankiHas(i); return `<button class="ankibtn" id="anki" aria-pressed="${s}" title="${s?"Remove the flag":"Flag this question for review"}">${s?"Flagged":"Flag"}</button>`; }
function ankiToggle(i){
  let cards=ankiAll();
  if(ankiHas(i,cards)) cards=cards.filter(c=>c.id!==ankiId(i));
  else cards.push(Object.assign(ankiCard(i), {at:new Date().toISOString()}));
  ankiPut(cards); render(false);
}
function ankiAdd(list){
  const cards=ankiAll(), have=new Set(cards.map(c=>c.id)), at=new Date().toISOString();
  list.forEach(i=>{ if(!have.has(ankiId(i))) cards.push(Object.assign(ankiCard(i), {at})); });
  ankiPut(cards);
}
function missedIdx(){ return QUESTIONS.map((q,i)=>((ans[i]!==null && ans[i]!==q.a) || (tries[i].length && !tries[i][0].ok)) ? i : -1).filter(i=>i>=0); }
function ankiMissedRow(){
  const m=missedIdx(); if(!m.length) return "";
  const cards=ankiAll(), left=m.filter(i=>!ankiHas(i,cards)).length;
  return `<div class="ankirow">${left ? `<button class="btn ghost" id="ankimissed">Flag ${left} missed question${left===1?"":"s"} for review</button>` : `<span class="hint">All ${m.length} missed questions are flagged.</span>`}</div>`;
}
/* Keep saved copies current when a question is corrected, without touching review progress. */
function ankiRefresh(){
  const cards=ankiAll(); let changed=false;
  cards.forEach(c=>{
    if(c.slug!==SET.slug) return;
    const i=c.n-1; if(!(i>=0 && i<N)) return;
    const fresh=ankiCard(i);
    for(const k of ["set","b","href","c","p","o","a","e","l","obj"]) if(JSON.stringify(c[k])!==JSON.stringify(fresh[k])){ c[k]=fresh[k]; changed=true; }
  });
  if(changed) ankiPut(cards);
}
addEventListener("storage", e=>{ if(e.key===ANKI_KEY || e.key===OFF_KEY) render(false); });

/* Not in course content: questions you report land in "differential-offcontent".
   The Flagged tab lists them with a Copy list button, so they can be sent in for removal. */
const OFF_KEY = "differential-offcontent";
function offAll(){ try{ const d=JSON.parse(localStorage.getItem(OFF_KEY)||"null"); return d && Array.isArray(d.items) ? d.items : []; }catch(e){ return []; } }
function offHas(i){ return offAll().some(x=>x.id===ankiId(i)); }
function offButton(i){ const s=offHas(i); return `<button class="offbtn" id="off" aria-pressed="${s}">${s?"Reported as not in course content. Undo":"Not in course content?"}</button>`; }
function offToggle(i){
  let items=offAll();
  if(offHas(i)) items=items.filter(x=>x.id!==ankiId(i));
  else { const q=QUESTIONS[i]; items.push({id:ankiId(i), slug:SET.slug, set:SET.title, b:SET.b, href:SET.href, n:i+1, c:q.c, p:q.p, key:q.o[q.a], at:new Date().toISOString()}); }
  try{ localStorage.setItem(OFF_KEY, JSON.stringify({v:1, items})); }catch(e){ setSave("Could not save the report. Browser storage is full or blocked.","bad"); }
  render(false);
}

function render(top=true){ renderHeader(); showResults?renderResults():renderQ(); if(top) window.scrollTo({top:0}); }
applySaved(lsLoad());
ankiRefresh();
render();
connect();
</script>

</body></html>
