<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Week 8 Question Bank</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Source+Sans+3:wght@400;600;700&display=swap">
<style>
/* Nexus quiz page. Matches the site: teal accent, Bricolage Grotesque for display, Source Sans 3 for reading. */
:root{
  --bg:#f6f9f8;--paper:#ffffff;--ink:#0f2624;--muted:#3d5452;--faint:#7f9895;--line:#d9e5e3;
  --accent:#0e7c7b;--deep:#0a5f5e;--soft:#e7f1f0;
  --ok:#1d7a46;--okw:#e7f4ec;--bad:#b42318;--badw:#fcecea;--tick:#dde8e6;
  --display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --body:"Source Sans 3","Segoe UI",system-ui,-apple-system,sans-serif;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1716;--paper:#142120;--ink:#ecf4f3;--muted:#c7d8d5;--faint:#7f9895;--line:#24413e;
  --accent:#4fc1b8;--deep:#82d8d0;--soft:#18302e;
  --ok:#5ccf8f;--okw:#13301f;--bad:#f2877c;--badw:#3a1c1a;--tick:#22403c;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1716;--paper:#142120;--ink:#ecf4f3;--muted:#c7d8d5;--faint:#7f9895;--line:#24413e;
  --accent:#4fc1b8;--deep:#82d8d0;--soft:#18302e;
  --ok:#5ccf8f;--okw:#13301f;--bad:#f2877c;--badw:#3a1c1a;--tick:#22403c;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55}
.wrap{max-width:820px;margin:0 auto;padding-block:28px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:20px}

/* Header */
header{display:flex;flex-direction:column;gap:10px}
.context{margin:0;color:var(--faint);font-size:14px;font-weight:600}
h1{font-family:var(--display);font-weight:700;font-size:clamp(28px,5vw,40px);line-height:1.05;letter-spacing:-.02em;margin:0;text-wrap:balance}
.stats{display:flex;flex-wrap:wrap;gap:6px 22px;font-size:15px;color:var(--muted);font-variant-numeric:tabular-nums}
.stats b{color:var(--ink);font-weight:700}
.bar{height:6px;border-radius:999px;background:var(--tick);overflow:hidden}
.bar span{display:block;height:100%;width:0;background:var(--accent);border-radius:999px;transition:width .25s ease}
.map summary{cursor:pointer;color:var(--accent);font-weight:600;font-size:14px;width:max-content;list-style:none;padding:2px 0}
.map summary::-webkit-details-marker{display:none}
.map summary::before{content:"▸";display:inline-block;margin-right:6px;transition:transform .15s ease}
.map[open] summary::before{transform:rotate(90deg)}
.map summary:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:4px}
.ticks{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}
.tick{width:14px;height:14px;border:0;border-radius:4px;background:var(--tick);padding:0;cursor:pointer}
.tick:hover{background:var(--faint)}
.tick.ok{background:var(--ok)}.tick.bad{background:var(--bad)}
.tick.cur{outline:2px solid var(--accent);outline-offset:2px}
.tick.redo{box-shadow:inset 0 -3px 0 var(--accent)}
.tick:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.save{font-size:13px;color:var(--faint)}
.save.ok{color:var(--ok)}.save.bad{color:var(--bad)}

/* Question card */
.card{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:26px;display:flex;flex-direction:column;gap:18px}
.chead{display:flex;justify-content:space-between;align-items:center;gap:10px}
.tag{font-size:13px;font-weight:700;color:var(--accent);background:var(--soft);padding:4px 11px;border-radius:999px}
.qn{font-family:var(--display);font-weight:700;font-size:15px;color:var(--faint);font-variant-numeric:tabular-nums}
.stem{font-size:18.5px;line-height:1.6;margin:0;white-space:pre-line;max-width:70ch}
.hint{font-size:13px;color:var(--faint)}
.tries{font-size:13px;color:var(--muted)}
.tries .bad{color:var(--bad);font-weight:600}.tries .ok{color:var(--ok);font-weight:600}

/* Options */
.opts{display:flex;flex-direction:column;gap:10px}
.optrow{display:flex;gap:8px;align-items:stretch}
.optrow .opt{flex:1;min-width:0}
.opt{display:flex;gap:14px;align-items:center;text-align:left;width:100%;background:var(--paper);color:var(--ink);border:1.5px solid var(--line);border-radius:var(--r);padding:12px 16px;font:inherit;font-size:16.5px;line-height:1.45;cursor:pointer;transition:border-color .12s ease,background .12s ease}
.opt:hover:not(:disabled){border-color:var(--accent);background:var(--soft)}
.opt:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.opt:disabled{cursor:default}
.opt .k{flex:none;display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--soft);color:var(--accent);font-family:var(--display);font-weight:700;font-size:14px}
.opt.right{border-color:var(--ok);background:var(--okw)}
.opt.right .k{background:var(--ok);color:var(--paper)}
.opt.wrong{border-color:var(--bad);background:var(--badw)}
.opt.wrong .k{background:var(--bad);color:var(--paper)}
.strike{flex:none;width:44px;border:1.5px solid var(--line);border-radius:var(--r);background:var(--paper);color:var(--faint);font-size:14px;cursor:pointer;display:grid;place-items:center}
.strike:hover{border-color:var(--accent);color:var(--accent)}
.strike:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.strike[aria-pressed="true"]{background:var(--soft);color:var(--ink)}
.optrow.struck .opt > span:last-child{text-decoration:line-through;color:var(--faint)}
.optrow.struck .opt .k{opacity:.45}

/* Feedback */
.fb{background:var(--bg);border-radius:var(--r);padding:18px 20px;display:flex;flex-direction:column;gap:10px}
.verdict{font-family:var(--display);font-weight:700;font-size:18px;display:flex;align-items:center;gap:8px}
.verdict::before{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;font-size:13px;color:var(--paper)}
.verdict.ok{color:var(--ok)}.verdict.ok::before{content:"✓";background:var(--ok)}
.verdict.bad{color:var(--bad)}.verdict.bad::before{content:"✕";background:var(--bad)}
.fb p{margin:0;max-width:72ch}
.fb .why,.fb .alt{display:flex;gap:10px;align-items:baseline}
.fb .why{font-weight:600}
.lk{flex:none;display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--line);color:var(--muted);font-family:var(--display);font-weight:700;font-size:12px;transform:translateY(-1px)}
.lk.ok{background:var(--ok);color:var(--paper)}
.fb .alt{color:var(--muted)}
.fb .take{border-left:3px solid var(--accent);padding:2px 0 2px 12px;color:var(--ink)}
.fb .take b{color:var(--accent)}
.obj{font-size:13.5px;color:var(--faint);line-height:1.5}
.obj b{color:var(--muted)}
.fbtools{display:flex;justify-content:flex-end}

/* Buttons */
.nav{display:flex;justify-content:space-between;gap:10px}
.btn{font-family:var(--display);font-weight:700;font-size:15px;padding:10px 20px;border:1.5px solid var(--accent);border-radius:999px;background:var(--accent);color:var(--paper);cursor:pointer}
.btn:hover:not(:disabled){background:var(--deep);border-color:var(--deep)}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.ghost:hover:not(:disabled){background:var(--soft);color:var(--accent);border-color:var(--accent)}
.btn:disabled{opacity:.35;cursor:default}
.btn:focus-visible{outline:2px solid var(--ink);outline-offset:3px}

/* Results */
.big{font-family:var(--display);font-size:clamp(48px,9vw,72px);font-weight:700;line-height:1;letter-spacing:-.03em;color:var(--accent);font-variant-numeric:tabular-nums}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
td,th{text-align:left;padding:9px 0;border-bottom:1px solid var(--line);font-size:15px;vertical-align:middle}
th{font-size:13px;font-weight:700;color:var(--faint)}
td:last-child,th:last-child{text-align:right;white-space:nowrap;padding-left:12px}
.meter{display:block;height:5px;border-radius:999px;background:var(--tick);margin-top:6px;max-width:320px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent);border-radius:999px}
h2{font-family:var(--display);font-size:21px;font-weight:700;margin:6px 0 0}
h3{font-size:14px;font-weight:700;color:var(--faint);margin:6px 0 0}
.miss{margin:0;padding-left:0;list-style:none;display:flex;flex-direction:column;gap:8px;font-size:15px}
.miss code{font-family:var(--display);font-weight:700;font-size:13px;color:var(--bad);background:var(--badw);padding:1px 7px;border-radius:999px;margin-right:8px}

@media (max-width:560px){.card{padding:18px;border-radius:14px}.stem{font-size:17.5px}.opt{padding:11px 12px;gap:10px}.strike{width:40px}}
@media (prefers-reduced-motion:no-preference){.fb{animation:in .2s ease-out}@keyframes in{from{opacity:.3;transform:translateY(4px)}to{opacity:1;transform:none}}}
@media (prefers-reduced-motion:reduce){.bar span,.opt,.map summary::before{transition:none}}
</style>

<div class="wrap">
  <header>
    <p class="context">Foundations of Medicine, Block 2, Week 8</p>
    <h1>Week 8 Question Bank</h1>
    <div class="stats" id="stats"></div>
    <div class="bar" aria-hidden="true"><span id="barfill"></span></div>
    <details class="map" id="map"><summary>Question map</summary><div class="ticks" id="ticks" aria-label="Question map"></div></details>
    <div class="save" id="save" role="status">Progress saves in this browser.</div>
  </header>
  <main id="main"></main>
</div>

<script>
const QUESTIONS = [{"c": "Week 8", "p": "In a lab study, an agonist's dose-response curve is recorded alone and then with Drug X added. With Drug X present, the curve shifts to the right, but raising the agonist dose still reaches the same maximal response. Which description of Drug X is correct?", "o": ["A competitive antagonist lowering agonist efficacy", "A non-competitive antagonist lowering efficacy", "A competitive antagonist lowering agonist potency", "A partial agonist raising the agonist's potency"], "a": 2, "e": "C is correct. A right shift with the same Emax means a higher EC50 (lower potency) with unchanged efficacy. That is competitive antagonism.\nA: Competitive antagonists do not change efficacy.\nB: A non-competitive antagonist lowers efficacy, which did not happen.\nD: Higher potency would shift the curve left.\nHigh yield: Competitive: potency down, efficacy same. Non-competitive: efficacy down, potency same.", "l": ["W8 O4", "W8 O6"]}, {"c": "Week 8", "p": "Sam has been on a steady high dose of Drug F, a full agonist at receptor R, with good effect. Drug P, a partial agonist at the same receptor, is then added at a dose that occupies many receptors. What happens to the overall response at receptor R?", "o": ["It falls, as P is an inverse agonist at R", "It falls, as P acts as an antagonist here", "It is unchanged, as P binds an allosteric site", "It rises, as P adds to the effect of F"], "a": 1, "e": "B is correct. A partial agonist acts as an agonist when no full agonist is present, but as an antagonist when a full agonist is present.\nA: An inverse agonist decreases the number of activated receptors, which is a different drug class.\nC: A partial agonist binds the same site as the agonist, not an allosteric one.\nD: P produces less than the full effect, so replacing F lowers the response.\nHigh yield: Your Week 8 quiz tested the same rule as a true statement.", "l": ["W8 O4"]}, {"c": "Week 8", "p": "Dr. Kaur's patient takes 100 mg of a drug every 12 hours and has reached steady state. To simplify the regimen she switches to 200 mg once every 24 hours. Which change is expected?", "o": ["Same Css, with different peak and trough levels", "Half the Css, since doses come half as often", "Same Css, with identical peak and trough levels", "Double the Css, since each dose is twice as large"], "a": 0, "e": "A is correct. The daily dose rate is unchanged at 200 mg per day. With the same daily dose rate, Css is the same, but peak and trough fluctuation differs.\nB: Fewer doses of a larger size keep the same daily dose rate.\nC: Changing the interval changes the peaks and troughs.\nD: Css depends on the daily dose rate, which did not change.\nHigh yield: Steady state takes 3-5 half-lives. Simpler regimens help adherence.", "l": ["W8 O29", "W8 O32"]}, {"c": "Week 8", "p": "Mr. Silva, 68, has taken felodipine for blood pressure for years. He is prescribed erythromycin for pneumonia. Three days later he is admitted with dizziness and a blood pressure of 82/50 mmHg. Which mechanism best explains this?", "o": ["PK interaction, with CYP3A4 induction", "Type B idiosyncratic reaction to erythromycin", "PD interaction, with additive vasodilation", "PK interaction, lower felodipine clearance"], "a": 3, "e": "D is correct. Erythromycin is a potent CYP3A4 inhibitor. It reduces felodipine clearance and raises its concentration about 2.5-fold, causing hypotension.\nA: Induction would lower felodipine levels.\nB: The effect is predictable from known enzyme inhibition.\nC: Erythromycin has no blood pressure effect of its own.\nHigh yield: Altered elimination is the most common cause of adverse drug interactions.", "l": ["W8 O46", "W8 O45"]}, {"c": "Week 8", "p": "Mr. Gill takes simvastatin each night. He drinks a large glass of grapefruit juice every morning and asks whether spacing the two by 12 hours avoids any interaction. Which counselling point is most accurate?", "o": ["No, the juice binds the statin in the gut", "No, its CYP3A4 effect lasts up to 3 days", "Yes, a 12-hour gap prevents the interaction", "Yes, grapefruit affects only warfarin"], "a": 1, "e": "B is correct. A constituent of grapefruit destroys CYP3A4, and the effect lasts up to 3 days after the last serving. Statin levels rise, with a risk of myopathy.\nA: The mechanism is enzyme destruction.\nC: The enzyme stays destroyed for days, so timing does not help.\nD: Warfarin's food interaction is with leafy green vegetables.\nHigh yield: Grapefruit also enhances the hypotensive effect of calcium channel blockers.", "l": ["W8 O51"]}, {"c": "Week 8", "p": "Two patients have reactions to medications. Patient 1 develops dry mouth on a standard dose of an antihistamine. Patient 2, who has G6PD deficiency, develops hemolytic anemia after a standard dose of primaquine. Which classification is correct, in order?", "o": ["Type A predictable, then Type B unpredictable", "Type B unpredictable, then Type A predictable", "Type B unpredictable in both patients", "Type A predictable in both patients"], "a": 0, "e": "A is correct. Dry mouth from antihistamines is a predictable pharmacological side effect (Type A). Hemolysis in G6PD deficiency after primaquine is idiosyncratic and unpredictable (Type B).\nB: This reverses the two.\nC: Dry mouth follows from the drug's known pharmacology.\nD: Hemolysis in G6PD deficiency is idiosyncratic.\nHigh yield: Unpredictable: pseudoallergic, idiosyncratic, intolerance.", "l": ["W8 O43"]}, {"c": "Week 8", "p": "A physician writes an order for 50 mg of a drug, but a misplaced decimal makes it read 500 mg. The pharmacist catches the error before any dose reaches the patient. Which term best describes this event?", "o": ["Adverse drug reaction", "Adverse drug event", "Near miss", "Preventable adverse event"], "a": 2, "e": "C is correct. A near miss is when something bad almost happened.\nA: An ADR happens with the right drug, dose and route.\nB: An ADE needs an injury.\nD: A preventable adverse event needs something bad to happen.\nHigh yield: Error, preventable adverse event and near miss are separate terms.", "l": ["W8 O41"]}, {"c": "Week 8", "p": "A 3-month-old with severe eczema has a strong corticosteroid cream applied twice daily over most of his body for 4 weeks. He develops signs of systemic steroid excess. Which pharmacokinetic factor best explains this?", "o": ["Mature CYP3A4 activity at this age", "High GFR clearing the steroid faster", "Low stomach acid raising enteral uptake", "High skin absorption and surface area per kg"], "a": 3, "e": "D is correct. Infants have increased percutaneous absorption of corticosteroids, and total body surface area per body weight is larger, so systemic exposure (mg/kg) rises.\nA: Phase I CYP activity is low at birth.\nB: GFR is low at birth and faster clearance would reduce exposure.\nC: The cream was applied to skin, so stomach acid is irrelevant.\nHigh yield: Infants: more skin absorption, low GFR, immature phase I and phase II.", "l": ["W8 O37", "W8 O39"]}, {"c": "Week 8", "p": "Mrs. Oyelaran, 77, needs penicillin for an infection. Her creatinine clearance is 32 mL/min. Which dose is most appropriate?", "o": ["The usual full dose", "Avoid penicillin altogether", "75% of the usual dose", "20 to 50% of the usual dose"], "a": 2, "e": "C is correct. Creatinine clearance predicts renal clearance of penicillin. 10-50 mL/min calls for 75% of the usual dose.\nA: The usual dose applies above 50 mL/min.\nB: Reduced renal function calls for dose adjustment.\nD: 20-50% applies below 10 mL/min.\nHigh yield: Monitor renal function routinely in older adults.", "l": ["W8 O34", "W8 O39"]}, {"c": "Week 8", "p": "A new biologic for Crohn's disease receives Health Canada approval. Before drug plans decide on listing, a federal, provincial and territorial body reviews whether it offers value for money. Which body performs this review?", "o": ["Pan-Canadian Pharmaceutical Alliance", "Patented Medicine Prices Review Board", "Therapeutic Products Directorate", "Canadian Agency for Drugs and Technologies in Health"], "a": 3, "e": "D is correct. CADTH evaluates value for money.\nA: The pCPA negotiates the price with the company.\nB: The PMPRB sets price ceilings for patented drugs.\nC: The TPD sits within Health Canada, which already approved the drug.\nHigh yield: Approval, price ceiling, value review, price negotiation, formulary listing.", "l": ["W8 O21"]}, {"c": "Week 8", "p": "Mr. Fontaine, 45, takes a standard dose of codeine after a dental extraction and becomes markedly drowsy. Genotyping shows he is a CYP2D6 ultrarapid metabolizer. Which explanation fits best?", "o": ["Rapid inactivation of codeine by CYP2D6", "Reduced renal clearance of unchanged codeine", "Failure to convert codeine to active morphine", "Excess morphine made from codeine by CYP2D6"], "a": 3, "e": "D is correct. CYP2D6 bioactivates inactive codeine into active morphine. An ultrarapid metabolizer makes more morphine than expected.\nA: CYP2D6 activates codeine. It is a prodrug.\nB: His genotype explains the effect, and nothing suggests renal impairment.\nC: Failed conversion fits a poor metabolizer or CYP2D6 inhibition, as in your Week 8 quiz, and gives no pain relief.\nHigh yield: CYP2D6 phenotypes: poor, intermediate, normal, ultrarapid. For prodrugs, induction and inhibition effects reverse.", "l": ["W8 O36", "W8 O35"]}, {"c": "Week 8", "p": "Dr. Mensah decides a 64-year-old with new hypertension needs an ACE inhibitor as standard therapy. Before prescribing, she reviews his potassium-sparing diuretic, his kidney function, his drug coverage and whether he agrees with the plan. Which WHO step is she completing?", "o": ["Step 6, monitor or stop the treatment", "Step 3b, verify the suitability of treatment", "Step 5, give information and warnings", "Step 2, specify the therapeutic objective"], "a": 1, "e": "B is correct. Step 3b checks the standard choice against this patient: other medications, organ function, cost, access and agreement. ACE inhibitor plus a potassium-sparing diuretic risks hyperkalemia.\nA: Step 6 is follow-up and stopping.\nC: Step 5 follows starting treatment.\nD: Step 2 sets the goal of care.\nHigh yield: Define problem, objective, choose and verify, start, inform, monitor or stop.", "l": ["W8 O10", "W8 O58"]}, {"c": "Week 8", "p": "Two drugs act on different receptor types. Drug 1 is insulin. Drug 2 is an anti-inflammatory steroid with a slow onset that alters gene expression. Which receptor type does each target, in order?", "o": ["G protein-coupled, then ligand-gated", "Ligand-gated, then G protein-coupled", "Enzyme-linked, then intracellular", "Intracellular, then enzyme-linked"], "a": 2, "e": "C is correct. Insulin receptors are enzyme-linked (phosphorylation). Steroid receptors are intracellular, with slow responses through altered gene expression.\nA: G protein-coupled receptors include alpha and beta adrenoceptors. Ligand-gated channels give fast responses.\nB: Ligand-gated channels include nicotinic receptors, and GPCRs include adrenoceptors.\nD: This reverses the two.\nHigh yield: Other targets: enzymes, endogenous molecules, transport proteins such as SGLT2.", "l": ["W8 O3", "W8 O1"]}, {"c": "Week 8", "p": "Rosa, 66, is unconscious and actively vomiting in the emergency department, and IV access has failed. She needs a drug that reaches the systemic circulation, ideally with part of the dose avoiding the liver on first pass. Which route fits best?", "o": ["Oral", "Transdermal", "Rectal", "Pulmonary (inhaled)"], "a": 2, "e": "C is correct. The rectal route is useful when patients are unconscious or vomiting, and a good fraction of the absorbed drug bypasses the portal circulation and liver.\nA: Oral is not usable in an unconscious, vomiting patient, and faces first-pass metabolism.\nB: Transdermal suits prolonged release, not prompt systemic delivery.\nD: Inhaled delivery is best for local actions with low systemic exposure.\nHigh yield: Your Week 8 quiz used the inhaled route for acute asthma, a local target.", "l": ["W8 O9"]}, {"c": "Week 8", "p": "A conjugated, high molecular weight drug moves from the liver into bile and then the duodenum. In the gut it is deconjugated, reabsorbed through the hepatic portal vein and returned to the liver, prolonging its effect. What is this process called?", "o": ["Passive tubular reabsorption", "Enterohepatic recycling", "First-pass metabolism", "Active tubular secretion"], "a": 1, "e": "B is correct. Biliary excretion of conjugated, high molecular weight drugs ends in feces, or in deconjugation and reabsorption through the portal vein (enterohepatic recycling).\nA: Tubular reabsorption occurs in the kidney.\nC: First-pass metabolism lowers bioavailability of oral drugs before they reach the circulation.\nD: Tubular secretion is a renal excretion step.\nHigh yield: Renal excretion: filtration, passive reabsorption, active secretion.", "l": ["W8 O7", "W8 O8"]}, {"c": "Week 8", "p": "Two new drugs are being dosed in clinic. Drug W has a wide therapeutic window and Drug N has a narrow one. Which statement about dosing is correct?", "o": ["Use the ED50 as a starting dose for Drug W", "Titrate Drug W slowly, since its window is wide", "The window spans the effective to lethal dose", "Give Drug N at a fixed dose without monitoring"], "a": 0, "e": "A is correct. With a wide window, the ED50 serves as a starting dose. With a narrow window, titrate the dose.\nB: Titration is for narrow windows.\nC: The window spans the minimum effective dose to the minimum toxic dose.\nD: Narrow windows need titration and monitoring.\nHigh yield: Design regimens to avoid toxicity and lack of efficacy, with convenient intervals.", "l": ["W8 O30", "W8 O31"]}, {"c": "Week 8", "p": "Drugs X and Y have the same clearance. Drug X has a much larger volume of distribution than Drug Y. How do their half-lives compare?", "o": ["X has a longer half-life than Y", "X has a shorter half-life than Y", "Both have the same half-life", "It depends on the dose given"], "a": 0, "e": "A is correct. A larger volume of distribution gives a longer half-life, and higher clearance gives a shorter one. With equal clearance, X lasts longer.\nB: A larger Vd lengthens, not shortens, half-life.\nC: Vd differs, so half-life differs.\nD: Half-life is independent of dose.\nHigh yield: Most drugs are removed after 3-5 half-lives.", "l": ["W8 O29"]}, {"c": "Week 8", "p": "A family physician reviews medication lists to choose who would gain most from deprescribing. Which patient is a target population?", "o": ["A healthy adult starting her first drug", "A patient newly moved to palliative care", "A teen on one stable prescription", "A patient whose guideline has not changed"], "a": 1, "e": "B is correct. Deprescribing targets patients with changes to clinical practice guidelines, new comorbidities, polypharmacy or palliative care.\nA: A first prescription is not polypharmacy.\nC: A single stable drug is not polypharmacy.\nD: Guideline changes, not unchanged guidelines, prompt deprescribing.\nHigh yield: Barriers to deprescribing: awareness, inertia, self-efficacy, feasibility.", "l": ["W8 O52", "W8 O40"]}, {"c": "Week 8", "p": "An interprofessional team works to improve adherence for patients on complex regimens. Who performs medication reconciliation, and then medication review, in order?", "o": ["Pharmacist, then nurse", "Family physician, then the pharmacist", "Nurse or pharmacist, then pharmacist", "Nurse only, then family physician"], "a": 2, "e": "C is correct. Medication reconciliation is done by a nurse or pharmacist. Medicines optimisation and medication review are done by the pharmacist.\nA: Medication review is a pharmacist task.\nB: Reconciliation is listed for the nurse or pharmacist.\nD: Reconciliation also involves pharmacists, and review is by the pharmacist.\nHigh yield: Pharmacists also coach patients on drug therapy.", "l": ["W8 O55", "W8 O54"]}, {"c": "Week 8", "p": "A health policy seminar breaks down who pays for prescription drugs in Canada. Which split of total drug costs is correct?", "o": ["50% public, 50% private plans, 0% individuals", "25% public, 50% private plans, 25% individuals", "50% public, 25% private plans, 25% individuals", "75% public, 15% private plans, 10% individuals"], "a": 2, "e": "C is correct. Public expenditure pays 50% of drug costs, private drug plans 25% and individuals 25%.\nA: Individuals pay 25% directly.\nB: Public expenditure is the largest payer.\nD: Public pays 50%, not 75%.\nHigh yield: Your Week 8 quiz: payment comes from provincial government, private plans and patients.", "l": ["W8 O18", "W8 O16"]}, {"c": "Week 8", "p": "A new diabetes drug was approved after trials. Two years later, reports of a rare liver injury lead to new warnings. In which phase of drug development was this adverse reaction detected?", "o": ["Phase IV", "Phase II", "Phase III", "Phase I"], "a": 0, "e": "A is correct. Phase IV is post-market surveillance, where rare adverse reactions surface in large real-world populations.\nB: Phase II tests the drug in patients.\nC: Phase III compares head-to-head with standard of care.\nD: Phase I typically uses about 20 male volunteers aged 21-30.\nHigh yield: Report new drug and unusual adverse events to Health Canada.", "l": ["W8 O47", "W8 O48"]}, {"c": "Week 8", "p": "A resident asks about the physician-industry relationship in Canada. Which statement is correct?", "o": ["Industry finds marketing to physicians the most efficient", "Physicians refuse patient-suggested drugs more often than not", "No codes of conduct separate physicians from industry", "Direct-to-consumer drug advertising is not legal in Canada"], "a": 3, "e": "D is correct. Direct-to-consumer advertising is not legal in Canada.\nA: Industry has found that, per sale, marketing to physicians is inefficient.\nB: When a patient comes with a suggestion, physicians are less likely to refuse it.\nC: Guidances and codes of conduct set boundaries with industry representatives.\nHigh yield: Historically, industry spent heavily to influence physician behaviour.", "l": ["W8 O22"]}, {"c": "Week 8", "p": "Two children develop adverse drug reactions. Patient 1 is a newborn treated with chloramphenicol. Patient 2 is a child given tetracycline. Which reaction fits each, in order?", "o": ["Grey baby syndrome, then dental staining", "Grey baby syndrome, then Reye syndrome", "Kernicterus, then dental staining", "Gasping syndrome, then severe liver damage"], "a": 0, "e": "A is correct. Chloramphenicol causes grey baby syndrome. Tetracycline causes dental staining.\nB: Reye syndrome follows aspirin.\nC: Kernicterus follows sulfonamides.\nD: Gasping syndrome follows benzyl alcohol, and liver damage follows valproic acid under 4 years.\nHigh yield: Phase II glucuronidation is low at birth, which affects drugs such as chloramphenicol.", "l": ["W8 O38", "W8 O37"]}, {"c": "Week 8", "p": "A prescription reads: \"2 tabs p.o. q.6h prn\" for pain. How should the pharmacist explain it to the patient?", "o": ["Two tablets by mouth six times a day as needed", "Two tablets by mouth every other day as needed", "Two tablets by mouth every 6 hours on schedule", "Two tablets by mouth every 6 hours as needed"], "a": 3, "e": "D is correct. p.o. means orally, q.6h means every six hours, and prn means as needed.\nA: Six times a day is not q.6h.\nB: Every other day is q.o.d.\nC: prn means as needed, not on a fixed schedule.\nHigh yield: b.i.d. twice a day, t.i.d. three times, q.i.d. four times, q.h.s. before bed.", "l": ["W8 O28"]}, {"c": "Enzyme induction and inhibition", "p": "Ms. Haddad takes a drug cleared mainly by CYP3A4, and her condition is well controlled. She starts rifampin for an infection. Two weeks later her symptoms return. What is the most likely explanation?", "o": ["Her drug became a prodrug after rifampin", "Rifampin reduced her renal clearance", "Rifampin inhibited CYP3A4 and raised her drug levels", "Rifampin blocked her drug's receptor directly", "Rifampin induced CYP3A4 and lowered her drug levels"], "a": 4, "e": "E is correct. Rifampin is a potent CYP3A4 inducer. Induction increases clearance of other drugs and lowers their levels, so they lose effect.\nA: A drug does not change into a prodrug.\nB: Rifampin acts on liver metabolism here.\nC: Rifampin is an inducer, and higher levels would cause toxicity, not failure.\nD: This is a pharmacokinetic interaction, not receptor blockade.\nHigh yield: Induction lowers levels. Inhibition raises them.", "l": ["W8 O45", "W8 O34"]}, {"c": "Enzyme induction and inhibition", "p": "Drug P is an inactive prodrug converted to its active form by CYP3A4. A patient stable on Drug P starts carbamazepine, a CYP3A4 inducer. What is expected?", "o": ["Less active drug, since inducers block activation", "More inactive prodrug left in the plasma", "More active drug, with a stronger effect", "No change, since prodrugs avoid CYP enzymes", "Less active drug, with a weaker effect"], "a": 2, "e": "C is correct. For prodrugs the rule reverses. Induction speeds activation, making more active drug and a stronger effect.\nA: Inducers increase enzyme activity.\nB: Faster activation leaves less prodrug, not more.\nD: Prodrugs depend on CYP enzymes for activation.\nE: That is the result for an active drug, not a prodrug.\nHigh yield: Induction lowers drug levels, inhibition raises them, opposite for prodrugs.", "l": ["W8 O45", "W8 O33"]}, {"c": "Enzyme induction and inhibition", "p": "Which of the following are listed as potent CYP inhibitors?\ni) Ketoconazole\nii) Clarithromycin\niii) Rifampin\niv) Fluconazole", "o": ["i) and ii) only", "i), ii) and iv) only", "ii) and iii) only", "i), iii) and iv) only", "All of the above"], "a": 1, "e": "B is correct. Ketoconazole and clarithromycin inhibit CYP3A4. Fluconazole inhibits CYP2C9. Rifampin is an inducer.\nA: Fluconazole is also an inhibitor.\nC: Rifampin is an inducer.\nD: Rifampin is an inducer and clarithromycin is an inhibitor.\nE: Rifampin is an inducer.\nHigh yield: Inducers: rifampin, phenytoin, carbamazepine, St. John's Wort, cigarette smoke, corticosteroids.", "l": ["W8 O45"]}, {"c": "Enzyme induction and inhibition", "p": "Which pairing correctly lists a CYP inducer, then a CYP inhibitor, in order?", "o": ["Erythromycin, then ketoconazole", "Ciprofloxacin, then rifampin", "Phenytoin, then fluoxetine", "St. John's Wort, then carbamazepine", "Fluoxetine, then phenytoin"], "a": 2, "e": "C is correct. Phenytoin induces CYP2C9 and CYP3A4. Fluoxetine inhibits CYP2D6.\nA: Both are inhibitors.\nB: Ciprofloxacin is an inhibitor (CYP1A2) and rifampin an inducer, the reverse order.\nD: Both are inducers.\nE: This reverses the two.\nHigh yield: Cigarette smoke induces CYP1A2, the fact behind your theophylline miss.", "l": ["W8 O45", "W8 O46"]}, {"c": "Lifespan pharmacology", "p": "The same renally cleared antibiotic is dosed in three children: a 3-day-old term newborn, an 8-month-old infant and a 4-year-old. Whose glomerular filtration rate, adjusted for body surface area, is highest?", "o": ["The newborn and infant equally", "All three are equal", "The 4-year-old", "The 3-day-old", "The 8-month-old"], "a": 2, "e": "C is correct. GFR is low at birth, doubles at 1 week and again at 1 month, reaches adult values at 6-12 months and exceeds adult values at 2-6 years.\nA: The newborn's GFR is lower than the infant's.\nB: GFR changes rapidly through early childhood.\nD: GFR is lowest at birth.\nE: At 8 months GFR is near adult values, below the 2-6 year peak.\nHigh yield: Premature newborn GFR: 5-10 mL/min/m2. Term newborn: 10-15.", "l": ["W8 O37"]}, {"c": "Lifespan pharmacology", "p": "Mrs. Varga, 84, takes oral iron for anemia, but her levels barely change. Which age-related change best explains the poor response?", "o": ["Lower stomach acidity altering absorption", "Increased stomach acidity degrading the iron", "Increased liver enzyme activity", "Increased GFR clearing the iron too fast", "Faster gastric emptying shortening contact time"], "a": 0, "e": "A is correct. Older adults have decreased stomach acidity, which alters absorption of iron, ketoconazole and dabigatran.\nB: Stomach acidity falls with age.\nC: Liver function falls with age.\nD: GFR falls with age.\nE: Gastric emptying slows with age.\nHigh yield: Infants also have low stomach acid, which raises penicillin absorption, as in your mock exam.", "l": ["W8 O37", "W8 O39"]}, {"c": "Lifespan pharmacology", "p": "A geriatrician reviews pharmacodynamic changes with aging. Which statement is correct?", "o": ["Older adults are less sensitive to benzodiazepine sedation effects", "Beta-blockers give a smaller heart rate response", "Older adults have lower cardiac sensitivity to digoxin", "Older adults get less pain relief from opioids", "Alpha-1 blockers cause less orthostatic hypotension"], "a": 1, "e": "B is correct. With aging, beta-blockers give a decreased heart rate response.\nA: Sensitivity to benzodiazepine sedation increases.\nC: Cardiac sensitivity to digoxin increases.\nD: Opioids give an increased level and duration of pain relief.\nE: Alpha-1 blockers cause increased orthostatic hypotension.\nHigh yield: Anticholinergics also cause increased falls and altered cognition in older adults.", "l": ["W8 O37", "W8 O38"]}, {"c": "Drug interactions", "p": "Mr. Rossi has been stable on warfarin. He starts eating large leafy green salads daily, and his anticoagulation becomes blunted. How do your notes classify this interaction?", "o": ["Pharmacokinetic elimination interaction", "Type B idiosyncratic reaction", "Drug-disease interaction", "Pharmacodynamic interaction", "Pharmacokinetic absorption interaction"], "a": 3, "e": "D is correct. The notes list warfarin with leafy green vegetables (vitamin K) as a pharmacodynamic interaction that blunts anticoagulation.\nA: Warfarin clearance is unchanged.\nB: The effect is predictable, not idiosyncratic.\nC: Vegetables are food, not a disease.\nE: Nothing changes warfarin's absorption.\nHigh yield: Grapefruit with statins is a food interaction acting through CYP3A4, which is pharmacokinetic.", "l": ["W8 O46"]}, {"c": "Drug interactions", "p": "Which of the following are pharmacokinetic interactions?\ni) Erythromycin raising felodipine levels\nii) Ketoconazole absorption altered by gastric pH\niii) ACE inhibitor with a K+-sparing diuretic causing hyperkalemia\niv) Rifampin lowering levels of a CYP3A4 substrate", "o": ["i) and ii) only", "i), ii) and iv) only", "ii) and iii) only", "i), iii) and iv) only", "All of the above"], "a": 1, "e": "B is correct. PK interactions change drug disposition: elimination (i, iv) or bioavailability (ii). ACE inhibitor with a K+-sparing diuretic is a PD interaction with additive effects.\nA: Statement iv is also PK.\nC: Statement iii is PD.\nD: Statement iii is PD and ii is PK.\nE: Statement iii is PD.\nHigh yield: PK: what the body does to the drug. PD: what the drugs do together.", "l": ["W8 O46", "W8 O45"]}, {"c": "Drug interactions", "p": "Mrs. Kim, 81, takes a tricyclic antidepressant. She starts an antihistamine for sleep and within days becomes confused and agitated. What is the best explanation?", "o": ["A PK interaction lowering antihistamine absorption", "A PD interaction, additive anticholinergic effects", "A drug-food interaction from her large evening meal", "A Type B idiosyncratic allergic reaction", "A PK interaction raising tricyclic plasma levels"], "a": 1, "e": "B is correct. TCAs with antihistamines or neuroleptics produce additive anticholinergic effects and delirium, a pharmacodynamic interaction.\nA: Reduced absorption would weaken, not add, effects.\nC: No food is involved.\nD: The reaction is predictable from the drugs' actions.\nE: The effect comes from combined actions, not raised levels.\nHigh yield: Antihistamines and anticholinergics are also delirium precipitants in DIMESPPP.", "l": ["W8 O46", "W8 O38"]}, {"c": "Drug interactions", "p": "A pharmacology tutor reviews drug interactions. Which statement is correct?", "o": ["PD interactions involve changes in the disposition of a drug", "Enzyme inducers make other drugs more potent and more toxic", "A constituent of grapefruit induces CYP3A4 activity", "Leafy green vegetables raise the efficacy of warfarin", "Altered elimination is the top cause of adverse interactions"], "a": 4, "e": "E is correct. Alteration in drug elimination is the most common cause of adverse drug interactions.\nA: Changes in disposition define PK interactions.\nB: Inducers increase clearance and make other drugs less effective.\nC: Grapefruit destroys CYP3A4, an inhibitory effect.\nD: Their vitamin K decreases warfarin efficacy.\nHigh yield: Risk factors for interactions: polypharmacy, many prescribers, older age, narrow therapeutic window, female sex.", "l": ["W8 O46"]}, {"c": "Drug regulation", "p": "A medical student reviews the bodies involved in bringing a drug to market in Canada. Which statement is correct?", "o": ["PMPRB is a provincial body run by each province", "Health Canada evaluates value for money", "PMPRB sets price ceilings on patented drugs", "pCPA approves drugs for sale in Canada", "CADTH negotiates the price with the company"], "a": 2, "e": "C is correct. The Patented Medicine Prices Review Board is a federal body that sets price ceilings for patented drugs.\nA: PMPRB is federal.\nB: Health Canada evaluates quality, safety and efficacy.\nD: Health Canada approves drugs for sale. The pCPA negotiates the price.\nE: CADTH evaluates value for money.\nHigh yield: Approval: Health Canada. Ceiling: PMPRB. Value: CADTH. Negotiation: pCPA. Listing: drug plans.", "l": ["W8 O21"]}, {"c": "Drug regulation", "p": "A new childhood vaccine is submitted to Health Canada for approval. Which part of the Health Products and Food Branch reviews it?", "o": ["Pan-Canadian Pharmaceutical Alliance", "Canadian Agency for Drugs and Technologies", "Biologic and Genetic Therapies Directorate", "Patented Medicine Prices Review Board", "Therapeutic Products Directorate of Health Canada"], "a": 2, "e": "C is correct. The Biologic and Genetic Therapies Directorate reviews vaccines and biologics. The Therapeutic Products Directorate reviews drugs.\nA: pCPA negotiates prices.\nB: CADTH evaluates value for money.\nD: PMPRB sets price ceilings.\nE: The TPD reviews drugs, not vaccines.\nHigh yield: Both directorates sit in the Health Products and Food Branch of Health Canada.", "l": ["W8 O21"]}, {"c": "Drug regulation", "p": "A trial enrolls patients with the disease and compares a new drug head-to-head with the current standard of care. Which phase of drug development is this?", "o": ["Phase IV", "Phase III", "Pre-clinical", "Phase II", "Phase I"], "a": 1, "e": "B is correct. Phase III is a head-to-head comparison with the standard of care.\nA: Phase IV is post-market surveillance.\nC: Pre-clinical work is chemical, in vitro and animal testing.\nD: Phase II tests the drug in patients, without a head-to-head comparison.\nE: Phase I typically uses about 20 healthy male volunteers aged 21-30.\nHigh yield: Rare adverse reactions surface in Phase IV, after approval.", "l": ["W8 O47"]}, {"c": "Drug regulation", "p": "After the price of a new drug is negotiated, a federal, provincial and territorial body decides whether it goes on the public list of covered drugs and under what conditions. Who does this?", "o": ["The public drug plans", "The Pan-Canadian Pharmaceutical Alliance", "Health Canada's Therapeutic Products Directorate", "Private drug plans", "The Patented Medicine Prices Review Board"], "a": 0, "e": "A is correct. Federal, provincial and territorial drug plans establish drug formularies and reimbursement criteria.\nB: pCPA negotiates the price, the step before listing.\nC: The TPD approves drugs for sale.\nD: Private plans decide coverage for their own clients, not public lists.\nE: PMPRB sets price ceilings.\nHigh yield: A drug formulary is a list of medications approved for use in a hospital or provided by a drug plan.", "l": ["W8 O21", "W8 O16"]}];
const OBJECTIVES = {"W8 O1": "Provide examples of pharmacological targets", "W8 O10": "Outline the 6-steps of the World Health Organization’s framework to rational prescribing", "W8 O16": "Describe the governance and funding models the Canadian healthcare", "W8 O18": "Explain the drug utilization in the Canadian Health Care system", "W8 O21": "Summarize the process and regulatory control of drug development and funding", "W8 O22": "Identify potential conflicts of interest in the Physician-industry relationship as it relates to drug access", "W8 O28": "Describe the terminology used in prescription", "W8 O29": "Define half-life of a drug, therapeutic range, steady state concentration and loading/maintenance dose", "W8 O3": "List the main types of receptors", "W8 O30": "Describe the clinical relevance of the therapeutic window of a drug", "W8 O31": "Describe how the therapeutic window of a drug can affect its dosing interval", "W8 O32": "Explain the effects of pharmacokinetics on drug dose regimen", "W8 O33": "Explain how the interplay between pharmacokinetics and pharmacodynamics affects drug response", "W8 O34": "Apply basic principles of pharmacokinetics and pharmacodynamics to clinical scenarios", "W8 O35": "Explain the human genetic variation in the context of variable drug response", "W8 O36": "Provide examples of how human genetic variation(s) can affect the efficacy and safety of drugs", "W8 O37": "Compare the pharmacokinetics and pharmacodynamics changes across the lifespan", "W8 O38": "Identify factors that lead to adverse drug reactions across the lifespan", "W8 O39": "Identify factors that affect therapeutics in different populations", "W8 O4": "Compare and contrast the actions of an agonist (full, partial and inverse) and antagonist (competitive and noncompetitive)", "W8 O40": "Define polypharmacy", "W8 O41": "Define commonly used patient safety incident terms such as adverse drug event, adverse drug reaction, and side effect.", "W8 O43": "Differentiate between Type A and Type B adverse drug reactions and provide clinical examples of each.", "W8 O45": "Explain the pharmacological basis of adverse drug reactions, including pharmacokinetic and pharmacodynamic mechanisms.", "W8 O46": "Describe potential outcomes of pharmacokinetic and pharmacodynamic drug interactions, including both harmful and beneficial effects.", "W8 O47": "Summarize the phases of drug development and identify how adverse drug reactions are studied and detected at each stage.", "W8 O48": "Describe how adverse drug reactions are monitored in Canada, with reference to systems such as the Canada Vigilance Program.", "W8 O51": "Summarize key instructions, information and warning that should be communicated to patients in order to promote a safe and effective use of medications", "W8 O52": "Define deprescribing and identify the types of patients that benefit most from this strategy", "W8 O54": "Identify barriers to treatment compliance", "W8 O55": "Compare the role of partner health professionals in effective and safe drug therapy", "W8 O58": "Propose approaches to the therapeutic goal with consideration of the suitability to the individual patient with respect to access, efficacy and safety", "W8 O6": "Describe potency and efficacy of drugs", "W8 O7": "Describe the four basic processes of pharmacokinetics: drug absorption, distribution, metabolism and excretion", "W8 O8": "List factors that affect the rate and extent of drug absorption, distribution, metabolism and excretion", "W8 O9": "Compare the different routes of administration with regards to their main advantages and disadvantages"};
const L = "ABCDE";
const N = QUESTIONS.length;
let cur = 0, showResults = false;
let ans = new Array(N).fill(null);           // current pick per question
let tries = QUESTIONS.map(()=>[]);           // every locked attempt: {pick, ok, at}
let strikes = QUESTIONS.map(()=>[]);         // struck option indexes for the open attempt
let history = [], db = null, uid = null, writing = false, dirty = false;
const MAP=document.getElementById("map"); if(MAP && QUESTIONS.length<=60) MAP.open=true;
const LS_KEY = "differential-week-8-question-bank";
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");

function score(){ return ans.reduce((n,a,i)=>n+(a!==null&&a===QUESTIONS[i].a?1:0),0); }
function answered(){ return ans.filter(a=>a!==null).length; }
function firstTryScore(){ return tries.reduce((n,t)=>n+(t.length&&t[0].ok?1:0),0); }
function firstTryCount(){ return tries.filter(t=>t.length).length; }

function renderHeader(){
  const bf=$("#barfill"); if(bf) bf.style.width=(100*answered()/N)+"%";
  $("#stats").innerHTML = `<span>Question <b>${showResults?"–":cur+1}</b> of <b>${N}</b></span><span>Answered <b>${answered()}</b></span><span>Score <b>${score()} / ${answered()}</b></span>`;
  $("#ticks").innerHTML = QUESTIONS.map((q,i)=>{
    const st = ans[i]===null?"":(ans[i]===q.a?"ok":"bad");
    const redo = tries[i].length>1 || (ans[i]===null && tries[i].length>0);
    return `<button class="tick ${st} ${redo?"redo":""} ${(!showResults&&i===cur)?"cur":""}" data-i="${i}" aria-label="Question ${i+1}"></button>`;
  }).join("");
  document.querySelectorAll(".tick").forEach(b=>b.onclick=()=>{cur=+b.dataset.i;showResults=false;render();});
}

function triesLine(i, includeCurrent){
  const t = includeCurrent ? tries[i] : tries[i];
  if(!t.length) return "";
  const parts = t.map((x,k)=>`<span class="${x.ok?"ok":"bad"}">${k+1}: ${L[x.pick]} ${x.ok?"correct":"wrong"}</span>`).join(" · ");
  return `<div class="tries">Attempts ${parts}</div>`;
}

function fmtLine(t){
  let m;
  if((m=t.match(/^Correct:\s*([A-E])\.?\s*(.*)$/)) || (m=t.match(/^([A-E]) is correct\.?\s*(.*)$/)))
    return `<p class="why"><span class="lk ok">${m[1]}</span><span>${esc(m[2])}</span></p>`;
  if((m=t.match(/^([A-E]):\s*(.*)$/)))
    return `<p class="alt"><span class="lk">${m[1]}</span><span>${esc(m[2])}</span></p>`;
  if((m=t.match(/^(Takeaway|High yield|High-yield|Key point|Clues):\s*(.*)$/i)))
    return `<p class="take"><b>${esc(m[1])}.</b> ${esc(m[2])}</p>`;
  return `<p>${esc(t)}</p>`;
}

function renderQ(){
  const q = QUESTIONS[cur], a = ans[cur], done = a!==null, st = strikes[cur];
  const opts = q.o.map((o,i)=>{
    let c = "";
    if(done){ if(i===q.a) c="right"; else if(i===a) c="wrong"; }
    const struck = !done && st.includes(i);
    const strikeBtn = done ? "" : `<button class="strike" data-s="${i}" aria-pressed="${struck}" aria-label="${struck?"Restore":"Strike out"} option ${L[i]}" title="${struck?"Restore":"Strike out"} option">${struck?"↺":"✕"}</button>`;
    return `<div class="optrow ${struck?"struck":""}"><button class="opt ${c}" data-i="${i}" ${done?"disabled":""}><span class="k">${L[i]}</span><span>${esc(o)}</span></button>${strikeBtn}</div>`;
  }).join("");
  let fb = "";
  if(done){
    const ok = a===q.a;
    const lines = q.e.split("\n").map(fmtLine).join("");
    const objs = q.l.map(id=>`<div class="obj"><b>Objective ${esc(id)}</b> ${esc(OBJECTIVES[id]||"")}</div>`).join("");
    fb = `<div class="fb" role="status"><div class="verdict ${ok?"ok":"bad"}">${ok?"Correct.":"Incorrect. The answer is "+L[q.a]+"."}</div>${lines}${objs}${triesLine(cur)}<div class="fbtools"><button class="btn ghost" id="redo">Reset and redo this question</button></div></div>`;
  }
  const pre = (!done && tries[cur].length) ? `<div class="hint">Redo. Your earlier attempts are saved.</div>${triesLine(cur)}` : (!done ? `<div class="hint">Tap ✕ to strike out an option. Right-click works too.</div>` : "");
  const last = cur===N-1;
  $("#main").innerHTML = `<article class="card">
    <div class="chead"><span class="tag">${esc(q.c)}</span><span class="qn">${cur+1} of ${N}</span></div>
    <p class="stem">${esc(q.p)}</p>
    ${pre}
    <div class="opts">${opts}</div>${fb}
    <div class="nav"><button class="btn ghost" id="prev" ${cur===0?"disabled":""}>Previous</button>
    <button class="btn" id="next" ${done?"":"disabled"}>${last?"See results":"Next"}</button></div>
  </article>`;
  document.querySelectorAll(".opt").forEach(b=>{
    b.onclick=()=>{ const p=+b.dataset.i; ans[cur]=p; tries[cur].push({pick:p, ok:p===q.a, at:new Date().toISOString()}); tries[cur]=tries[cur].slice(-10); strikes[cur]=[]; render(false); persist(); };
    b.oncontextmenu=(e)=>{ if(done) return; e.preventDefault(); toggleStrike(+b.dataset.i); };
  });
  document.querySelectorAll(".strike").forEach(b=>b.onclick=()=>toggleStrike(+b.dataset.s));
  const r=$("#redo"); if(r) r.onclick=()=>{ ans[cur]=null; strikes[cur]=[]; render(false); persist(); };
  $("#prev").onclick=()=>{cur--;render();};
  $("#next").onclick=()=>{ if(last){showResults=true;} else cur++; render(); };
}

function toggleStrike(i){
  const s = strikes[cur], k = s.indexOf(i);
  if(k<0) s.push(i); else s.splice(k,1);
  render(false); persist();
}

function renderResults(){
  const s = score(), pct = Math.round(100*s/N);
  const cats = {};
  QUESTIONS.forEach((q,i)=>{ cats[q.c]=cats[q.c]||[0,0]; cats[q.c][1]++; if(ans[i]===q.a) cats[q.c][0]++; });
  const rows = Object.entries(cats).map(([c,[r,t]])=>`<tr><td>${esc(c)}<span class="meter"><i style="width:${Math.round(100*r/t)}%"></i></span></td><td>${r} / ${t}</td></tr>`).join("");
  const missed = {};
  QUESTIONS.forEach((q,i)=>{ const wrongFirst = tries[i].length && !tries[i][0].ok; if(ans[i]!==q.a || wrongFirst) q.l.forEach(id=>{ const w=id.split(" ")[0]; missed[w]=missed[w]||new Set(); missed[w].add(id); }); });
  const weeks = Object.keys(missed).sort((x,y)=>parseInt(x.slice(1))-parseInt(y.slice(1)));
  const missHtml = weeks.length ? weeks.map(w=>`<h3>Week ${w.slice(1)}</h3><ul class="miss">${[...missed[w]].map(id=>`<li><code>${esc(id)}</code>${esc(OBJECTIVES[id]||"")}</li>`).join("")}</ul>`).join("") : "<p>No missed objectives.</p>";
  const redone = tries.filter(t=>t.length>1).length;
  const un = N - answered();
  $("#main").innerHTML = `<article class="card">
    <div class="chead"><span class="tag">Results</span><span>${un?un+" unanswered":"Complete"}</span></div>
    <div><div class="big">${s} / ${N}</div><div class="stats"><span><b>${pct}%</b> correct now</span><span>First try <b>${firstTryScore()} / ${firstTryCount()}</b></span><span>Redone <b>${redone}</b></span></div></div>
    <table><thead><tr><th>Topic</th><th>Score</th></tr></thead><tbody>${rows}</tbody></table>
    <h2>Objectives to review</h2><p class="hint">Includes questions you missed on the first try, even if a redo got them right.</p>${missHtml}${history.length?`<h2>Past attempts</h2><table><thead><tr><th>Date</th><th>Score</th></tr></thead><tbody>${history.slice().reverse().map(h=>`<tr><td>${new Date(h.date).toLocaleDateString()}</td><td>${h.score} / ${h.total}</td></tr>`).join("")}</tbody></table>`:""}
    <div class="nav"><button class="btn ghost" id="back">Back to questions</button><button class="btn" id="restart">Restart all</button></div>
  </article>`;
  $("#back").onclick=()=>{showResults=false;render();};
  $("#restart").onclick=()=>{
    if(answered() || tries.some(t=>t.length)){
      history.push({date:new Date().toISOString(), score:score(), answered:answered(), total:N, firstTry:firstTryScore(),
        missed:QUESTIONS.map((q,i)=>ans[i]!==null&&ans[i]!==q.a?"q"+(i+1):null).filter(Boolean)});
      history=history.slice(-20);
    }
    ans.fill(null); tries=QUESTIONS.map(()=>[]); strikes=QUESTIONS.map(()=>[]); cur=0; showResults=false; render(); persist();
  };
}

function setSave(text, cls){ const el=$("#save"); if(el){ el.textContent=text; el.className="save "+(cls||""); } }
function bodyOf(){
  const a = {};
  QUESTIONS.forEach((q,i)=>{
    if(ans[i]===null && !tries[i].length && !strikes[i].length) return;
    a["q"+(i+1)] = {pick:ans[i], ok:ans[i]!==null && ans[i]===q.a, l:q.l, tries:tries[i], strikes:strikes[i]};
  });
  return {answers:a, history, total:N, answered:answered(), score:score(), firstTry:firstTryScore(), updatedAt:new Date().toISOString()};
}
function validPick(i,p){ return Number.isInteger(p) && p>=0 && p<QUESTIONS[i].o.length; }
function applySaved(d){
  if(!d || typeof d!=="object") return;
  ans.fill(null); tries=QUESTIONS.map(()=>[]); strikes=QUESTIONS.map(()=>[]);
  const a = d.answers || {};
  for(const k in a){
    const i = parseInt(k.slice(1),10)-1, row = a[k];
    if(!(i>=0 && i<N) || !row || typeof row!=="object") continue;
    if(validPick(i,row.pick)) ans[i]=row.pick;
    if(Array.isArray(row.tries)) tries[i]=row.tries.filter(t=>t&&validPick(i,t.pick)).map(t=>({pick:t.pick, ok:t.pick===QUESTIONS[i].a, at:String(t.at||"")})).slice(-10);
    else if(ans[i]!==null) tries[i]=[{pick:ans[i], ok:ans[i]===QUESTIONS[i].a, at:""}];
    if(Array.isArray(row.strikes)) strikes[i]=row.strikes.filter(x=>validPick(i,x));
  }
  history = Array.isArray(d.history) ? d.history.slice(-20) : [];
  const first = ans.findIndex(x=>x===null); cur = first<0 ? N-1 : first;
}
function lsLoad(){ try{ return JSON.parse(localStorage.getItem(LS_KEY)||"null"); }catch(e){ return null; } }
function lsSave(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(bodyOf())); }catch(e){} }
async function persist(){
  lsSave();
  if(!db || !uid) return;
  dirty = true; if(writing) return; writing = true;
  while(dirty){
    dirty = false;
    setSave("Saving…");
    try{ await db.doc("attempts/"+uid).set(bodyOf()); setSave("Progress saved to your account.","ok"); }
    catch(e){
      if(e && e.code==="invalid_argument"){ db=null; setSave("Progress saves in this browser only.","bad"); break; }
      setSave("Could not save to your account. Progress saves in this browser.","bad");
    }
  }
  writing = false;
}
async function connect(){
  try{
    if(!window.claude || !window.claude.use) return;
    const [u, d] = await Promise.all([window.claude.use("user"), window.claude.use("db")]);
    if(!u || !d) return;
    const id = await u.id(); if(!id) return;
    db = d; uid = id;
    const snap = await db.doc("attempts/"+uid).get();
    if(snap.exists){ applySaved(snap.data()); render(); setSave("Progress saved to your account.","ok"); }
    else if(answered() || tries.some(t=>t.length)){ persist(); }
    else setSave("Progress saves to your account.","ok");
  }catch(e){ /* keep local-only mode */ }
}

function render(top=true){ renderHeader(); showResults?renderResults():renderQ(); if(top) window.scrollTo({top:0}); }
applySaved(lsLoad());
render();
connect();
</script>

</body></html>
