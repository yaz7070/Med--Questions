<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Block 2 Practice Exam</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;600;700&display=swap">
<style>
/* Nexus quiz page. Matches the site: neutral greys, one typeface, and the block's colour as --accent. */
:root{
  --bg:#f5f6f8;--paper:#ffffff;--ink:#15181d;--muted:#4d5560;--faint:#7b828d;--line:#e0e3e8;
  --accent:#0b7a75;--soft:#eef0f3;
  --ok:#1d7a46;--okw:#e7f4ec;--bad:#b42318;--badw:#fcecea;--tick:#dfe2e7;
  --display:"Atkinson Hyperlegible Next","Segoe UI",system-ui,-apple-system,sans-serif;
  --body:"Atkinson Hyperlegible Next","Segoe UI",system-ui,-apple-system,sans-serif;
  --r:8px;
}
:root[data-b="2"]{--accent:#4f46c8}:root[data-b="3"]{--accent:#a3246b}:root[data-b="4"]{--accent:#a35f08}
:root[data-theme="dark"]{
  --bg:#14161a;--paper:#1b1e24;--ink:#eceef2;--muted:#b3bac5;--faint:#8a919c;--line:#2d323b;
  --accent:#45c2b8;--soft:#252930;
  --ok:#5ccf8f;--okw:#13301f;--bad:#f2877c;--badw:#3a1c1a;--tick:#30353e;color-scheme:dark}
:root[data-theme="dark"][data-b="2"]{--accent:#a49df6}:root[data-theme="dark"][data-b="3"]{--accent:#ef8ec0}:root[data-theme="dark"][data-b="4"]{--accent:#e3a548}
.btn:hover:not(:disabled){filter:brightness(.92)}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55}
.wrap{max-width:820px;margin:0 auto;padding-block:28px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:20px}

/* Header */
header{display:flex;flex-direction:column;gap:10px}
.context{margin:0;color:var(--faint);font-size:14px;font-weight:600}
h1{font-family:var(--display);font-weight:700;font-size:clamp(28px,5vw,40px);line-height:1.05;letter-spacing:-.02em;margin:0;text-wrap:balance}
.stats{display:flex;flex-wrap:wrap;gap:6px 22px;font-size:15px;color:var(--muted);font-variant-numeric:tabular-nums}
.stats b{color:var(--ink);font-weight:700}
.bar{height:6px;border-radius:999px;background:var(--tick);overflow:hidden}
.bar span{display:block;height:100%;width:0;background:var(--accent);border-radius:999px;transition:width .25s ease}
.map summary{cursor:pointer;color:var(--accent);font-weight:600;font-size:14px;width:max-content;list-style:none;padding:2px 0}
.map summary::-webkit-details-marker{display:none}
.map summary::before{content:"▸";display:inline-block;margin-right:6px;transition:transform .15s ease}
.map[open] summary::before{transform:rotate(90deg)}
.map summary:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:4px}
.ticks{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}
.tick{width:14px;height:14px;border:0;border-radius:4px;background:var(--tick);padding:0;cursor:pointer}
.tick:hover{background:var(--faint)}
.tick.ok{background:var(--ok)}.tick.bad{background:var(--bad)}
.tick.cur{outline:2px solid var(--accent);outline-offset:2px}
.tick.redo{box-shadow:inset 0 -3px 0 var(--accent)}
.tick:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.save{font-size:13px;color:var(--faint)}
.save.ok{color:var(--ok)}.save.bad{color:var(--bad)}

/* Question card */
.card{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:26px;display:flex;flex-direction:column;gap:18px}
.chead{display:flex;justify-content:space-between;align-items:center;gap:10px}
.tag{font-size:13px;font-weight:700;color:var(--accent);background:var(--soft);padding:3px 9px;border-radius:4px}
.qn{font-family:var(--display);font-weight:700;font-size:15px;color:var(--faint);font-variant-numeric:tabular-nums}
.stem{font-size:18.5px;line-height:1.6;margin:0;white-space:pre-line;max-width:70ch}
.hint{font-size:13px;color:var(--faint)}
.tries{font-size:13px;color:var(--muted)}
.tries .bad{color:var(--bad);font-weight:600}.tries .ok{color:var(--ok);font-weight:600}

/* Options */
.opts{display:flex;flex-direction:column;gap:10px}
.optrow{display:flex;gap:8px;align-items:stretch}
.optrow .opt{flex:1;min-width:0}
.opt{display:flex;gap:14px;align-items:center;text-align:left;width:100%;background:var(--paper);color:var(--ink);border:1.5px solid var(--line);border-radius:var(--r);padding:12px 16px;font:inherit;font-size:16.5px;line-height:1.45;cursor:pointer;transition:border-color .12s ease,background .12s ease}
.opt:hover:not(:disabled){border-color:var(--accent);background:var(--soft)}
.opt:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.opt:disabled{cursor:default}
.opt .k{flex:none;display:inline-grid;place-items:center;width:30px;height:30px;border-radius:6px;background:var(--soft);color:var(--accent);font-family:var(--display);font-weight:700;font-size:14px}
.opt.right{border-color:var(--ok);background:var(--okw)}
.opt.right .k{background:var(--ok);color:var(--paper)}
.opt.wrong{border-color:var(--bad);background:var(--badw)}
.opt.wrong .k{background:var(--bad);color:var(--paper)}
.strike{flex:none;width:44px;border:1.5px solid var(--line);border-radius:var(--r);background:var(--paper);color:var(--faint);font-size:14px;cursor:pointer;display:grid;place-items:center}
.strike:hover{border-color:var(--accent);color:var(--accent)}
.strike:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.strike[aria-pressed="true"]{background:var(--soft);color:var(--ink)}
.optrow.struck .opt > span:last-child{text-decoration:line-through;color:var(--faint)}
.optrow.struck .opt .k{opacity:.45}

/* Feedback */
.fb{background:var(--bg);border-radius:var(--r);padding:18px 20px;display:flex;flex-direction:column;gap:10px}
.verdict{font-family:var(--display);font-weight:700;font-size:18px;display:flex;align-items:center;gap:8px}
.verdict::before{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;font-size:13px;color:var(--paper)}
.verdict.ok{color:var(--ok)}.verdict.ok::before{content:"✓";background:var(--ok)}
.verdict.bad{color:var(--bad)}.verdict.bad::before{content:"✕";background:var(--bad)}
.fb p{margin:0;max-width:72ch}
.fb .why,.fb .alt{display:flex;gap:10px;align-items:baseline}
.fb .why{font-weight:600}
.lk{flex:none;display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--line);color:var(--muted);font-family:var(--display);font-weight:700;font-size:12px;transform:translateY(-1px)}
.lk.ok{background:var(--ok);color:var(--paper)}
.fb .alt{color:var(--muted)}
.fb .take{border-left:3px solid var(--accent);padding:2px 0 2px 12px;color:var(--ink)}
.fb .take b{color:var(--accent)}
.obj{font-size:13.5px;color:var(--faint);line-height:1.5}
.obj b{color:var(--muted)}
.fbtools{display:flex;justify-content:flex-end}

/* Buttons */
.nav{display:flex;justify-content:space-between;gap:10px}
.btn{font-family:var(--display);font-weight:700;font-size:15px;padding:10px 20px;border:1.5px solid var(--accent);border-radius:6px;background:var(--accent);color:var(--paper);cursor:pointer}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.ghost:hover:not(:disabled){background:var(--soft);color:var(--accent);border-color:var(--accent)}
.btn:disabled{opacity:.35;cursor:default}
.btn:focus-visible{outline:2px solid var(--ink);outline-offset:3px}

/* Results */
.big{font-family:var(--display);font-size:clamp(48px,9vw,72px);font-weight:700;line-height:1;letter-spacing:-.03em;color:var(--accent);font-variant-numeric:tabular-nums}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
td,th{text-align:left;padding:9px 0;border-bottom:1px solid var(--line);font-size:15px;vertical-align:middle}
th{font-size:13px;font-weight:700;color:var(--faint)}
td:last-child,th:last-child{text-align:right;white-space:nowrap;padding-left:12px}
.meter{display:block;height:5px;border-radius:999px;background:var(--tick);margin-top:6px;max-width:320px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent);border-radius:999px}
h2{font-family:var(--display);font-size:21px;font-weight:700;margin:6px 0 0}
h3{font-size:14px;font-weight:700;color:var(--faint);margin:6px 0 0}
.miss{margin:0;padding-left:0;list-style:none;display:flex;flex-direction:column;gap:8px;font-size:15px}
.miss code{font-family:var(--display);font-weight:700;font-size:13px;color:var(--bad);background:var(--badw);padding:1px 7px;border-radius:999px;margin-right:8px}

@media (max-width:560px){.card{padding:18px}.stem{font-size:17.5px}.opt{padding:11px 12px;gap:10px}.strike{width:40px}}
@media (prefers-reduced-motion:no-preference){.fb{animation:in .2s ease-out}@keyframes in{from{opacity:.3;transform:translateY(4px)}to{opacity:1;transform:none}}}
@media (prefers-reduced-motion:reduce){.bar span,.opt,.map summary::before{transition:none}}
</style>

    r.dataset.theme = t || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"); }
  theme(); addEventListener("storage",theme);
})();

    <div class="bar" aria-hidden="true"><span id="barfill"></span></div>
    <details class="map" id="map"><summary>Question map</summary><div class="ticks" id="ticks" aria-label="Question map"></div></details>

<script>
const QUESTIONS = [{"c": "Week 5", "p": "Ana, 24, sprints for a bus and her adrenal medulla releases epinephrine. What happens to the arterioles in her working leg muscles, and to arterioles in blood vessels throughout the rest of her body, in order?", "o": ["Dilate via beta-2 receptors, then constrict via alpha", "Dilate in skeletal muscle and dilate throughout the body", "Constrict via alpha receptors, then dilate via beta-2", "Constrict in skeletal muscle and constrict throughout"], "a": 0, "e": "A is correct. Epinephrine on beta-2 receptors in skeletal muscle, cardiac muscle and liver vessels causes vasodilation. On alpha receptors in vessels throughout the body it causes vasoconstriction.\nB: Alpha receptors elsewhere constrict, not dilate.\nC: This reverses the receptor effects.\nD: Beta-2 receptors in skeletal muscle dilate, not constrict.\nHigh yield: AC/BD: vasoconstrictors are epinephrine (alpha), angiotensin II, ADH. Vasodilators are epinephrine (beta-2), ANP.", "l": ["W5 9.2"]}, {"c": "Week 5", "p": "At a periodic health encounter, Mr. Lam's blood pressure is 130/85 mmHg. Using the formula in your notes, what is his mean arterial pressure?", "o": ["95 mmHg", "107.5 mmHg", "115 mmHg", "93 mmHg", "100 mmHg"], "a": 4, "e": "E is correct. MAP = DP + 1/3(SP minus DP) = 85 + 1/3(45) = 85 + 15 = 100 mmHg.\nA: 95 adds one third of diastolic minus 85, a misapplied formula.\nB: 107.5 is the simple average of systolic and diastolic. Diastole lasts longer, so it carries more weight.\nC: 115 subtracts one third of the pulse pressure from systolic instead of adding it to diastolic.\nD: 93 mmHg is the MAP for a BP of 120/80.\nHigh yield: MAP = CO x TPR. CO = HR x SV.", "l": ["W5 9.3"]}, {"c": "Week 5", "p": "A home care nurse draws blood from Mrs. Vu, 70, at 9 am. The tubes sit in a hot car until 4 pm before reaching the lab. Several results come back far outside her usual values. Which category of error best explains this?", "o": ["Analytical random error", "A sample mix-up by the lab", "Pre-analytical error", "Post-analytical transcription error", "An inappropriate reference interval"], "a": 2, "e": "C is correct. Extreme temperature or storage conditions and delayed transportation happen before analysis, so they are pre-analytical errors.\nA: Random error happens during the analysis itself.\nB: A sample mix-up by the lab is an analytical explanation, and nothing suggests it here.\nD: Transcription errors happen after analysis, when results are reported.\nE: An inappropriate reference interval is a post-analytical problem with interpretation, not the sample.\nHigh yield: Your Week 5 quiz tested another pre-analytical error: K-EDTA contamination from the wrong tube.", "l": ["W5 7.3"]}, {"c": "Week 5", "p": "A lab compares two screening tests using receiver operating characteristic (ROC) curves. Which statement is correct?", "o": ["Pretest probability has no effect on the PPV", "More area under the curve means a better test", "The y-axis plots the false positive rate", "The x-axis plots specificity on its own", "The x-axis plots the sensitivity of the test"], "a": 1, "e": "B is correct. An ROC curve plots the false positive rate (1 minus specificity) on the x-axis against the true positive rate (sensitivity) on the y-axis. More area under the curve means a more effective test.\nA: A higher pretest probability gives a higher PPV.\nC: The false positive rate sits on the x-axis.\nD: The x-axis is 1 minus specificity, not specificity.\nE: Sensitivity sits on the y-axis.\nHigh yield: Prevalence changes predictive values, not sensitivity or specificity.", "l": ["W5 7.1"]}, {"c": "Week 5", "p": "At his periodic health encounter, Raj, 38, says he smokes a pack a day. You have asked about his tobacco use and advised him to quit. Which step comes next?", "o": ["Assist with the quit attempt", "Ask again about his tobacco use", "Assess his readiness to quit", "Arrange follow-up care"], "a": 2, "e": "C is correct. The steps for smoking are ask, advise, assess readiness, assist with the quit attempt, then arrange follow-up.\nA: Assisting follows the readiness assessment.\nB: Asking is already done.\nD: Arranging follow-up is the last step.\nHigh yield: Smoking is screened for everyone at every PHE.", "l": ["W5 11.2", "W5 1.2"]}, {"c": "Week 5", "p": "A cancer screening program reports longer survival in screened patients. Analysts find the screened group holds a much larger share of slow-growing, symptom-free tumours, while fast-growing tumours mostly appear with symptoms between screens. Which explanation fits best?", "o": ["Length bias", "A true drop in disease-specific mortality", "Lead-time bias", "Publication bias"], "a": 0, "e": "A is correct. Length bias overestimates survival in screened groups because screening disproportionately finds slowly progressing, asymptomatic cases, while fast cases appear with symptoms.\nB: A true benefit is shown by lower disease-specific mortality, which the stem does not show.\nC: Lead-time bias comes from earlier diagnosis of the same tumours, not a different tumour mix.\nD: Publication bias affects which studies are published.\nHigh yield: Judge screening benefit by disease-specific mortality.", "l": ["W5 6.4"]}, {"c": "Week 5", "p": "Greg, 45, completes the AUDIT at his periodic health encounter and scores 18. Which interpretation and advice match his score?", "o": ["High risk, cut down or stop drinking", "Medium risk, try to cut down or stop drinking", "Addiction likely, medication and counselling", "High suspicion for alcoholism on CAGE scoring", "Low risk, continue drinking in moderation"], "a": 0, "e": "A is correct. An AUDIT of 16-19 is high risk, with advice to cut down or stop drinking completely.\nB: 8-15 is medium risk.\nC: 20 or more means addiction is likely.\nD: CAGE is a separate 4-question tool. A CAGE score of 2-3 gives high suspicion.\nE: 0-7 is low risk.\nHigh yield: Your Week 5 quiz used CAGE for alcohol, PHQ-9 for depression and DAST-10 for drugs.", "l": ["W5 3.2"]}, {"c": "Week 5", "p": "After a large meal, Omar, 30, relaxes on the couch. His parasympathetic activity rises, and his arterioles dilate. What is the mechanism of the vasodilation?", "o": ["ANP released from stretched atrial muscle cells", "Epinephrine acting on alpha receptors in vessels", "Withdrawal of tonic sympathetic activity to arterioles", "Increased ADH secretion acting on the vessels", "Parasympathetic fibres releasing transmitter onto arterioles"], "a": 2, "e": "C is correct. The PNS does not innervate blood vessels. When the PNS is activated the SNS is shut off, and with less sympathetic tone the vessels dilate.\nA: ANP dilates vessels when atria stretch, but it is not the mechanism here.\nB: Alpha receptors cause vasoconstriction.\nD: ADH promotes water reabsorption and is grouped with vasoconstrictors.\nE: Parasympathetic fibres do not reach blood vessels.\nHigh yield: The SNS changes TPR in both directions by changing tonic activity to arterioles.", "l": ["W5 9.2", "W5 9.7"]}, {"c": "Week 5", "p": "Two patients show cellular adaptation. Patient 1 has long-standing hypertension, and his cardiac muscle cells have enlarged. Patient 2 has worn a leg cast for 6 weeks, and her thigh muscle has shrunk. Which adaptation fits each, in order?", "o": ["Hypertrophy, then atrophy", "Hyperplasia, then atrophy", "Hyperplasia, then hypertrophy", "Hypertrophy, then metaplasia"], "a": 0, "e": "A is correct. Cardiac myocytes are permanent cells, so they adapt by getting larger (hypertrophy), not by dividing. Disuse shrinks cells (atrophy).\nB: Permanent cells cannot use hyperplasia.\nC: Permanent cells cannot use hyperplasia, and disuse causes atrophy.\nD: Metaplasia is a change of cell type, not shrinkage.\nHigh yield: Atrophy causes: low blood supply, disuse, low hormones, poor nutrition, pressure, denervation.", "l": ["W5 9.9", "W5 9.8"]}, {"c": "Week 5", "p": "A seminar reviews how the poorest fifth of Canadians fare in health care compared with the richest fifth. Which of the following statements is FALSE?", "o": ["The poorest fifth make more specialist visits", "The poorest fifth have more avoidable deaths", "The poorest fifth face longer wait times", "The poorest fifth have more emergency hospitalizations", "The poorest fifth use cancer screening less often"], "a": 0, "e": "A is correct. The poorest fifth have fewer specialist visits, not more.\nB: True. They have more avoidable deaths.\nC: True. They face longer wait times.\nD: True. They have higher rates of emergency hospitalizations.\nE: True. They are less likely to use cancer screening services.\nHigh yield: Life expectancy in full health is about 11 years shorter in the poorest fifth.", "l": ["W5 4.1", "W5 4.2"]}, {"c": "Week 6", "p": "Clinical Scenario: Part 1 of 2\n\nJoan, 64, noticed a breast lump 2 months ago. On examination there is a firm, fixed, painless mass. The overlying skin is thickened and dimpled like orange peel. How should this presentation be categorized in your breast mass differential?", "o": ["Life-threatening: metastasis compressing the cord", "Benign neoplasm: a fibroadenoma", "Urgent: cancer involving the skin or lymphatics", "Cyst: fibrocystic change", "Infection: a breast abscess"], "a": 2, "e": "C is correct. Firm, fixed and painless is the typical description of a carcinoma. Skin changes like orange peel (peau d'orange) put it in the urgent category: cancer in skin or lymphatics, inflammatory cancer.\nA: Life-threatening presentations involve metastases compressing the spinal cord or major vessels.\nB: A fibroadenoma is mobile and well circumscribed.\nD: Fibrocystic change gives lumpy breasts that vary with the menstrual cycle.\nE: An abscess is a painful collection of pus with acute inflammation.\nHigh yield: Your Week 6 quiz: a carcinoma mass is firm, fixed and painless.", "l": ["W6 2.4", "W6 1.6"]}, {"c": "Week 6", "p": "Clinical Scenario: Part 2 of 2\n\nJoan's core needle biopsy confirms invasive carcinoma. Which imaging is used next to stage her cancer for distant spread?", "o": ["Repeat diagnostic mammogram", "Breast MRI alone", "Breast tomosynthesis", "Targeted breast ultrasound", "Full body CT"], "a": 4, "e": "E is correct. Full body CT is performed after biopsy for cancer staging. It is not used in the workup or screening.\nA: Mammography is used for screening and diagnosis.\nB: Breast MRI stages local disease, not distant spread.\nC: Tomosynthesis creates 3D breast images for screening and diagnosis.\nD: Ultrasound is the first test for a palpable lump, not staging.\nHigh yield: Staging guides treatment and estimates prognosis.", "l": ["W6 3.2", "W6 6.4"]}, {"c": "Week 6", "p": "Dr. Chan reviews the pathology report for a resected colon cancer. Which description matches the synoptic report?", "o": ["A concise checklist of key findings that guides treatment", "The gross description with the ink and section codes", "The ACMG classification of any genetic variant found", "The clinical history copied from the requisition", "An overall summary listing only the final diagnosis"], "a": 0, "e": "A is correct. The synoptic report is a concise cancer summary and checklist of the most important findings. It covers the specimen, tumour, margins, lymph nodes and stage, predicts outcomes and guides treatment and testing.\nB: The gross description has the ink and section codes.\nC: ACMG classes appear in the cancer genetic report.\nD: Clinical information is a separate section.\nE: The overall summary is the Diagnosis section.\nHigh yield: Biomarker reports (ER, PR, Her2) sit within the microscopic description.", "l": ["W6 4.4", "W6 4.5"]}, {"c": "Week 6", "p": "Three tumours are examined. Tumour 1 arises from the lining epithelium of the colon. Tumour 2 arises from muscle in the thigh. Tumour 3 arises from immune cells in a lymph node. Which cancer type fits each, in order?", "o": ["Carcinoma, sarcoma, melanoma", "Carcinoma, sarcoma, lymphoma", "Sarcoma, carcinoma, lymphoma", "Carcinoma, lymphoma, sarcoma"], "a": 1, "e": "B is correct. Carcinomas come from epithelial cells. Sarcomas come from connective tissue, nerves and muscle. Lymphomas and leukemias come from immune and blood cells.\nA: Melanoma comes from melanocytes, not immune cells.\nC: This swaps carcinoma and sarcoma.\nD: This swaps sarcoma and lymphoma.\nHigh yield: Melanoma: melanocytic cells.", "l": ["W6 4.1", "W6 7.2"]}, {"c": "Week 6", "p": "Mr. Torres, 41, has longstanding HIV with a low CD4 count. He develops purple skin lesions, and biopsy confirms Kaposi sarcoma. Which virus is linked to this cancer?", "o": ["Human herpesvirus 8", "Human T-lymphotropic virus 1", "Human papillomavirus", "Epstein-Barr virus", "Hepatitis B virus"], "a": 0, "e": "A is correct. HHV8 (Kaposi sarcoma-associated herpesvirus) causes Kaposi sarcoma, typically in people with HIV.\nB: HTLV-1 causes adult T-cell lymphoma.\nC: HPV causes cervical, anal and oropharyngeal cancers.\nD: EBV causes nasopharyngeal cancer, Burkitt lymphoma, Hodgkin lymphoma and post-transplant lymphoproliferative disorder.\nE: HBV causes hepatocellular carcinoma.\nHigh yield: HIV-related immunosuppression also raises the risk of non-Hodgkin lymphoma.", "l": ["W6 7.7"]}, {"c": "Week 6", "p": "Sandra, 55, feels well and has no bowel symptoms. Her father was diagnosed with colorectal cancer at 60. She asks about the colorectal screening program. Which statement is correct?", "o": ["Flexible sigmoidoscopy every 2 years applies", "FIT every 2 years applies, as for any adult 50-74", "She is outside the average-risk FIT program", "FIT every year applies until age 74", "No screening, since she has no symptoms"], "a": 2, "e": "C is correct. A first-degree relative with colorectal cancer places her outside the average-risk FIT program for adults 50-74.\nA: Flexible sigmoidoscopy is every 10 years.\nB: FIT every 2 years is for asymptomatic adults not at high risk.\nD: FIT is every 2 years, not yearly.\nE: Screening targets people without symptoms.\nHigh yield: Also out: previous CRC or adenomatous polyps, IBD, symptoms such as anemia or bowel changes.", "l": ["W6 7.11"]}, {"c": "Week 6", "p": "A family physician reviews four family histories for possible hereditary cancer. Which history LEAST suggests a hereditary cancer syndrome?", "o": ["A sister with breast cancer diagnosed at 38", "One aunt with breast cancer diagnosed at 72", "Ashkenazi Jewish ancestry with family breast cancer", "A mother with ovarian cancer diagnosed at 52", "A cousin with bilateral breast cancer"], "a": 1, "e": "B is correct. A single late-onset breast cancer in one relative has none of the red flags. Most cancers are sporadic (70-85%).\nA: Breast cancer under 50 is early onset.\nC: BRCA1/2 variants are more common in the Ashkenazi Jewish population.\nD: Ovarian cancer under 60 is early onset.\nE: Bilateral breast cancer counts as multiple primary cancers.\nHigh yield: Red flags: early onset, multiple primaries, many relatives on the same side, overall pattern, ethnic background.", "l": ["W6 6.3"]}, {"c": "Week 6", "p": "Two cancer drugs are described. Drug 1 blocks PD-L1 so that T-cells resume killing tumour cells. Drug 2 is a tyrosine kinase inhibitor aimed at the BCR-ABL fusion in CML. Which category fits each, in order?", "o": ["Cytotoxic chemotherapy, then endocrine therapy", "Targeted therapy, then immunotherapy", "Cancer vaccine, then cytotoxic chemotherapy", "Immunotherapy, then targeted therapy"], "a": 3, "e": "D is correct. Immune checkpoint inhibitors that block PD-L1 are immunotherapy. Imatinib, a tyrosine kinase inhibitor for CML, is targeted therapy.\nA: Neither drug is cytotoxic or endocrine.\nB: This reverses the two.\nC: Neither drug is a vaccine or cytotoxic.\nHigh yield: CML: the BCR-ABL1 fusion turns the ABL proto-oncogene into an oncogene.", "l": ["W6 6.1"]}, {"c": "Week 6", "p": "You have set up a private room, asked Mr. Haddad what he understands, and he has asked you to tell him everything. You now give a warning shot, avoid medical jargon and share the biopsy result in small chunks. Which SPIKES step are you performing?", "o": ["Strategy and summary", "Empathy", "Perception", "Invitation", "Knowledge"], "a": 4, "e": "E is correct. Knowledge means giving a warning, avoiding jargon, using the patient's language and sharing information in small chunks.\nA: Strategy and summary comes last, with concerns and a clear plan.\nB: Empathy responds to emotions as they arise.\nC: Perception was asking what he understands.\nD: Invitation was his request to hear everything.\nHigh yield: Your Week 6 quiz asked for the full SPIKES order.", "l": ["W6 5.5"]}, {"c": "Week 7", "p": "Mr. Stein, 70, a retired engineer, has noticed subtle trouble remembering names over the past year. He still manages all his own affairs. Which screening test is best suited to pick up mild cognitive impairment in him?", "o": ["Mini-Cog", "GDS-15", "4-AT", "MoCA", "MMSE"], "a": 3, "e": "D is correct. The MoCA tests executive function and language and is better at detecting MCI and mild dementia.\nA: The Mini-Cog is a quick screen with recall and a clock draw.\nB: The GDS-15 screens for depression.\nC: The 4-AT screens for delirium.\nE: The MMSE is not sensitive for mild dementia or MCI.\nHigh yield: MoCA under 26 suggests cognitive impairment. MMSE under 24.", "l": ["W7 4.1"]}, {"c": "Week 7", "p": "Two older adults are assessed for cognitive change. Patient 1 has declined slowly over 2 years, with good and bad days, normal alertness and normal attention. Patient 2 became confused over one day, drifts in and out of alertness and cannot list the months backwards. Which diagnosis fits each, in order?", "o": ["Depression, then delirium", "Delirium, then dementia", "Dementia, then delirium", "Dementia, then depression"], "a": 2, "e": "C is correct. Dementia has an insidious onset over months to years, with good and bad days and normal consciousness until late stages. Delirium is acute, with fluctuating consciousness and poor attention.\nA: Depression has onset over weeks to months, and Patient 1 fits dementia.\nB: This reverses the two.\nD: Patient 2's acute fluctuating course is delirium.\nHigh yield: Delirium: reversible. Dementia: irreversible.", "l": ["W7 8.1"]}, {"c": "Week 7", "p": "Ravi, 48, asks how to lower his future risk of dementia. Which of the following is a mid-life risk factor for dementia?", "o": ["Air pollution", "Hearing loss", "Social isolation", "Less education", "Physical inactivity"], "a": 1, "e": "B is correct. Mid-life risk factors are hearing loss, traumatic brain injury, hypertension, alcohol over 21 units a week and obesity.\nA: Air pollution is a later-life factor.\nC: Social isolation is a later-life factor.\nD: Less education is an early-life factor.\nE: Physical inactivity is a later-life factor.\nHigh yield: About 40% of dementia risk is potentially modifiable.", "l": ["W7 7.2"]}, {"c": "Week 7", "p": "During a geriatric assessment, you ask Mrs. O'Neill, 87, what is most important to her. She says staying in her own home matters more to her than living longer. Which of the Geriatric 5Ms are you addressing?", "o": ["Multi-complexity", "Mobility", "Medications", "Matters most", "Mind"], "a": 3, "e": "D is correct. Matters most asks what the patient values and prioritizes.\nA: Multi-complexity addresses control and impact of medical conditions.\nB: Mobility addresses function and movement at home.\nC: Medications addresses the medication history.\nE: Mind addresses memory concerns.\nHigh yield: Patient-centred goals guide every later decision.", "l": ["W7 2.1"]}, {"c": "Week 7", "p": "Mrs. Ferreira, 66, is healthy and up to date on routine screening. Which set of preventive measures is due at her periodic health exam?", "o": ["Bone density test only, plus tetanus every 5 years", "Pneumovax only, as Shingrix starts at age 70", "Shingrix two doses and a screening chest X-ray", "Shingrix two doses, Pneumovax, bone density", "Shingrix one dose, plus a screening thyroid test"], "a": 3, "e": "D is correct. Shingrix is 2 injections 2-6 months apart for adults 65-70. Pneumovax is for adults 65 and over. Bone mineral density is for women 65 and over.\nA: Tetanus is every 10 years.\nB: Shingrix starts at 65.\nC: CXR is not ordered for routine screening.\nE: Shingrix needs 2 doses, and thyroid screening is not recommended without symptoms.\nHigh yield: Influenza vaccine yearly. Tetanus every 10 years.", "l": ["W7 2.3", "W7 2.6"]}, {"c": "Week 7", "p": "Mr. Kaur, 59, has 2 weeks of arm weakness confined to the muscles of a single myotome. Those muscles are wasted, the matching tendon reflex is reduced and the plantar response is flexor. Where is the lesion?", "o": ["Neuromuscular junction", "Spinal root", "Thoracic spinal cord", "Brainstem", "Muscle"], "a": 1, "e": "B is correct. LMN signs limited to a single myotome match the distribution of one root.\nA: The NMJ affects eyes and swallowing.\nC: A cord lesion gives UMN signs below it.\nD: The brainstem is a UMN site with cranial nerve findings.\nE: Muscle disease gives generalized proximal weakness.\nHigh yield: LMN patterns: single myotome (root), single nerve, multiple nerves.", "l": ["W7 6.4", "W7 6.3"]}, {"c": "Week 7", "p": "Which of the following age-related changes in volume regulation increase an older adult's risk of dehydration?\ni) Decreased thirst drive\nii) Decreased ability to concentrate urine\niii) Increased sensitivity to ADH\niv) Change in the body water to fat ratio", "o": ["i) and ii) only", "i), ii) and iv) only", "ii) and iii) only", "i), iii) and iv) only", "All of the above"], "a": 1, "e": "B is correct. Aging brings decreased thirst drive, decreased sensitivity to ADH, a change in the body water to fat ratio and decreased ability to concentrate urine.\nA: Statement iv is also true.\nC: Statement iii is false and i is true.\nD: Statement iii is false and ii is true.\nE: Statement iii is false. ADH sensitivity falls with age.\nHigh yield: Your Week 7 quiz tested the related change: decreased ability to thermoregulate.", "l": ["W7 1.6"]}, {"c": "Week 7", "p": "After a stroke, Mr. Dumont, 72, has paralysis of his right arm. He is no longer able to dress himself, and his employer refuses to let him return as a cashier because of his disability. Using the ICF framework, how do you classify his trouble dressing and the employer's refusal, in order?", "o": ["Participation restriction, then activity limitation", "Impairment, then an activity limitation of function", "Impairment, then a participation restriction", "Activity limitation, then participation restriction"], "a": 3, "e": "D is correct. Activity limitations are difficulties executing activities such as walking or eating. Participation restrictions are problems with involvement in life, such as discrimination in employment. The paralysis itself is the impairment.\nA: This reverses the two.\nB: Trouble dressing is an activity limitation, not an impairment.\nC: The impairment is the paralysis, not the trouble dressing.\nHigh yield: Disability is the interaction between a health condition and personal and environmental factors.", "l": ["W7 9.3"]}, {"c": "Week 7", "p": "Mr. Hughes, 79, denies feeling sad. His daughter reports he sleeps poorly, eats much less and has stopped his weekly card game. His PHQ-2 score is 4. What is the most appropriate interpretation and next step?", "o": ["Positive screen, confirm with a clinical exam", "Positive screen, which confirms major depression", "Negative screen, since he denies sadness", "Diagnose depression and start an SSRI today", "Screen for delirium with the 4-AT instead"], "a": 0, "e": "A is correct. A PHQ-2 at or above the cut-off of 3 is a positive screen. Older adults often deny sadness and present with appetite and sleep changes. Screening tools alone do not diagnose depression.\nB: Screening tools alone are not adequate to diagnose depression, as in your Week 7 quiz.\nC: Lack of sadness is a typical presentation in older adults.\nD: A screen needs a clinical assessment before diagnosis.\nE: Nothing suggests an acute fluctuating change.\nHigh yield: PHQ-9 cut-off is 10.", "l": ["W7 5.3", "W7 5.4"]}, {"c": "Week 8", "p": "Mr. Patel needs a drug with a long half-life to reach a therapeutic plasma concentration quickly. Waiting 3-5 half-lives on the maintenance dose would take too long. What is the best approach?", "o": ["Double the maintenance dose each day for a week", "Give a loading dose above the maintenance dose", "Give the same dose more often with no loading dose", "Switch to a drug with an even longer half-life", "Keep the maintenance dose and wait 3-5 half-lives"], "a": 1, "e": "B is correct. A loading dose is larger than the maintenance dose and reaches therapeutic concentrations more rapidly. The maintenance dose then keeps levels in range.\nA: Doubling the daily dose raises the steady state and risks toxicity.\nC: Time to steady state depends on half-life, not dose frequency alone.\nD: A longer half-life takes even longer to reach steady state.\nE: Waiting is what the scenario needs to avoid.\nHigh yield: Maintenance dose keeps the peak below toxic and the trough above effective.", "l": ["W8 O29", "W8 O32"]}, {"c": "Week 8", "p": "A drug needs an oral dose ten times larger than the IV dose to give the same plasma level. Which explanation best accounts for the difference?", "o": ["Higher plasma protein binding when oral", "Faster renal clearance after IV dosing", "Better blood brain barrier entry by IV", "Enterohepatic recycling of the IV dose", "Poor absorption and first-pass metabolism"], "a": 4, "e": "E is correct. Bioavailability is the proportion of the parent drug that reaches the systemic circulation unaltered. Oral drugs face limited absorption and first-pass metabolism, while IV drugs need no absorption.\nA: Protein binding affects distribution, not how much drug enters the circulation.\nB: Clearance does not depend on the route of administration.\nC: BBB entry affects distribution to the brain, not plasma level.\nD: Recycling would raise, not lower, the IV level.\nHigh yield: Your Week 8 quiz: IV bioavailability is complete, but IV costs more and carries infection risk.", "l": ["W8 O7", "W8 O9"]}, {"c": "Week 8", "p": "Mrs. Rossi, 84, takes diazepam at the same dose she used at 50. She is now drowsy most of the day. Which change with age best explains the longer half-life of diazepam?", "o": ["Faster gastric emptying with higher absorption", "Lower clearance with a larger distribution volume", "Increased clearance with decreased volume of distribution", "Increased liver mass with faster metabolism", "Increased renal blood flow with faster elimination"], "a": 1, "e": "B is correct. In older adults, diazepam half-life increases because clearance falls and volume of distribution rises, with more body fat and less albumin.\nA: Gastric emptying slows with age.\nC: Higher clearance would shorten half-life.\nD: Liver function and blood flow fall with age.\nE: Renal blood flow and GFR fall with age.\nHigh yield: Older adults also have increased sensitivity to benzodiazepine sedation.", "l": ["W8 O37", "W8 O33"]}, {"c": "Week 8", "p": "A pharmacology tutor reviews drug actions at receptors. Which statement is correct?", "o": ["A partial agonist produces complete activation of the receptor", "A positive allosteric modulator prevents agonist binding", "A non-competitive antagonist always binds reversibly", "A competitive antagonist has intrinsic activity of its own", "An inverse agonist lowers the number of active receptors"], "a": 4, "e": "E is correct. An inverse agonist decreases the number of activated receptors.\nA: A partial agonist produces less than the full effect.\nB: A positive allosteric modulator enhances agonist binding. A negative one prevents it.\nC: Non-competitive antagonists include irreversible binders.\nD: Antagonists have no intrinsic activity.\nHigh yield: Full agonists produce complete activation of the receptor.", "l": ["W8 O4"]}, {"c": "Week 8", "p": "A drug trial plots the percentage of patients who show a response against the log of the dose. Which statement about this type of curve is correct?", "o": ["A quantal curve that gives a population ED50", "The LD50 on it measures the drug's potency", "Doubling the dose on it doubles the effect", "Its ED50 equals the drug's maximal efficacy", "It is a graded curve that describes one patient"], "a": 0, "e": "A is correct. A quantal dose-response curve shows an all-or-none effect in a population of patients and gives the ED50, TD50 and LD50.\nB: Potency is the EC50 or ED50. LD50 is the lethal dose, as your Week 8 quiz tested.\nC: Doubling the dose does not double the effect.\nD: Efficacy is the maximal response (Emax).\nE: A graded curve describes one patient.\nHigh yield: Lower EC50 means a more potent drug.", "l": ["W8 O5", "W8 O6"]}, {"c": "Week 8", "p": "Mr. Ahmed, 58, takes theophylline and has smoked for 30 years. He quits smoking abruptly. What is expected to happen to his theophylline level?", "o": ["It stays the same, as smoke affects only CYP3A4", "It rises because cigarette smoke inhibits CYP1A2", "It falls as his renal clearance increases", "It rises as CYP1A2 induction wears off", "It falls as smoking cessation inhibits CYP1A2"], "a": 3, "e": "D is correct. Theophylline is a CYP1A2 substrate. Cigarette smoke induces CYP1A2, and induction lowers drug levels. When induction stops, metabolism slows and levels rise.\nA: Cigarette smoke is a CYP1A2 inducer.\nB: Smoke is an inducer, not an inhibitor.\nC: Theophylline here is cleared by CYP1A2 metabolism.\nE: Quitting removes induction rather than inhibiting the enzyme.\nHigh yield: Enzyme induction lowers drug levels. Inhibition raises them. Reverse both for prodrugs.", "l": ["W8 O34", "W8 O39"]}, {"c": "Week 8", "p": "An infant absorbs more of an oral penicillin dose than an adult given the same dose per kilogram. Which difference best explains this?", "o": ["Higher stomach acid, which speeds absorption", "Higher GFR at birth that recycles the drug", "Larger skin surface area per kilogram of weight", "Mature CYP3A4 that activates the penicillin", "Lower stomach acid degrades less penicillin"], "a": 4, "e": "E is correct. Infants produce less stomach acid, so less penicillin is degraded by acid and more is absorbed.\nA: Infants have lower, not higher, stomach acid.\nB: GFR is low at birth.\nC: Skin surface area affects topical drugs, not oral absorption.\nD: CYP activity is low at birth.\nHigh yield: Infants also have higher gut motility and immature enzyme and transporter function.", "l": ["W8 O37"]}, {"c": "Week 8", "p": "Two drug interactions are described. In Case 1, a patient on an MAOI takes an over-the-counter cold medicine and develops severe hypertension. In Case 2, ketoconazole is absorbed poorly because another drug changes gastric pH. Which type of interaction is each, in order?", "o": ["Pharmacodynamic in both of the two cases", "Pharmacodynamic, then pharmacokinetic", "Pharmacokinetic, then pharmacodynamic", "Pharmacokinetic in both of the two cases"], "a": 1, "e": "B is correct. An MAOI with cold medicine causes hypertension through combined drug effects, a pharmacodynamic interaction. A change in gastric pH alters bioavailability, a pharmacokinetic interaction.\nA: Case 2 alters absorption, which is pharmacokinetic.\nC: This reverses the two.\nD: Case 1 involves combined effects, not altered drug handling.\nHigh yield: Altered elimination is the most common cause of adverse drug interactions.", "l": ["W8 O46", "W8 O45"]}, {"c": "Week 8", "p": "Mrs. Leung takes a narrow therapeutic window drug cleared by liver metabolism, and her levels have been stable for a year. She develops influenza and, within days, shows signs of toxicity at her usual dose. Which explanation fits best?", "o": ["Poor adherence during her illness", "Enzyme induction by the virus raising clearance", "Type B idiosyncratic reaction to the drug", "Drug-disease interaction, slower metabolism", "Drug-food interaction from a change in diet"], "a": 3, "e": "D is correct. Viral infections such as influenza alter drug metabolism, typically by inhibition, which raises levels and leads to toxicity.\nA: Missed doses would lower levels.\nB: Induction would lower levels, not cause toxicity.\nC: The effect is predictable from slowed metabolism.\nE: Nothing in the stem suggests a food change.\nHigh yield: Narrow window drugs are highest risk for interactions.", "l": ["W8 O45", "W8 O38"]}, {"c": "Week 8", "p": "Mr. Diaz cannot afford his brand-name blood pressure pill. You review his insurance coverage and switch him to the generic version. Which STEPS factor are you addressing?", "o": ["Tolerability", "Effectiveness", "Price", "Simplicity", "Safety"], "a": 2, "e": "C is correct. Price means clarifying medical insurance coverage and choosing affordable medications, such as generics over brand names.\nA: Tolerability is the patient's tolerance and quality of life.\nB: Effectiveness is the evidence that a drug helps the patient live longer.\nD: Simplicity makes the regimen as simple as possible, such as once a day.\nE: Safety covers ADRs, toxicity and drug monitoring.\nHigh yield: Your Week 8 quiz tested Simplicity: switching to a once-daily pill.", "l": ["W8 O58", "W8 O20"]}, {"c": "Week 8", "p": "Mrs. Chen, 82, has advanced heart failure. You ask what she hopes for, and together you agree to focus on symptom relief rather than prolonging life. Which WHO rational prescribing step is this?", "o": ["Step 4, start the treatment", "Step 1, define the patient's problem", "Step 3a, choose standard treatment", "Step 6, monitor or stop treatment", "Step 2, specify the objective"], "a": 4, "e": "E is correct. Step 2 is patient-centred: ask about goals of care and choose curative or palliative aims.\nA: Step 4 checks the patient understands and starts treatment.\nB: Step 1 uses the diagnostic pathway to define the problem.\nC: Step 3a weighs efficacy and safety of a standard treatment.\nD: Step 6 is follow-up and stopping treatment.\nHigh yield: Palliative care focuses on managing symptoms.", "l": ["W8 O12", "W8 O57"]}, {"c": "Week 8", "p": "A newly approved cancer drug moves toward public coverage. Body 1 sets the maximum price for this patented drug. Body 2 later negotiates the actual price with the company for federal, provincial and territorial plans. Which bodies are these, in order?", "o": ["CADTH, then pCPA", "pCPA, then PMPRB", "PMPRB, then pCPA", "Health Canada, then CADTH"], "a": 2, "e": "C is correct. The Patented Medicine Prices Review Board sets price ceilings. The pan-Canadian Pharmaceutical Alliance negotiates the price with the company.\nA: CADTH evaluates value for money, not price ceilings.\nB: This reverses the two.\nD: Health Canada approves drugs on quality, safety and efficacy.\nHigh yield: Drug plans then set formularies and reimbursement criteria.", "l": ["W8 O21"]}];

const N = QUESTIONS.length;
let cur = 0, showResults = false;
let ans = new Array(N).fill(null);           // current pick per question
let tries = QUESTIONS.map(()=>[]);           // every locked attempt: {pick, ok, at}
let strikes = QUESTIONS.map(()=>[]);         // struck option indexes for the open attempt
let history = [], db = null, uid = null, writing = false, dirty = false;

const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");

function score(){ return ans.reduce((n,a,i)=>n+(a!==null&&a===QUESTIONS[i].a?1:0),0); }
function answered(){ return ans.filter(a=>a!==null).length; }
function firstTryScore(){ return tries.reduce((n,t)=>n+(t.length&&t[0].ok?1:0),0); }
function firstTryCount(){ return tries.filter(t=>t.length).length; }

function renderHeader(){
  const bf=$("#barfill"); if(bf) bf.style.width=(100*answered()/N)+"%";
  $("#stats").innerHTML = `<span>Question <b>${showResults?"–":cur+1}</b> of <b>${N}</b></span><span>Answered <b>${answered()}</b></span><span>Score <b>${score()} / ${answered()}</b></span>`;
  $("#ticks").innerHTML = QUESTIONS.map((q,i)=>{
    const st = ans[i]===null?"":(ans[i]===q.a?"ok":"bad");
    const redo = tries[i].length>1 || (ans[i]===null && tries[i].length>0);
    return `<button class="tick ${st} ${redo?"redo":""} ${(!showResults&&i===cur)?"cur":""}" data-i="${i}" aria-label="Question ${i+1}"></button>`;
  }).join("");
  document.querySelectorAll(".tick").forEach(b=>b.onclick=()=>{cur=+b.dataset.i;showResults=false;render();});
}

function triesLine(i, includeCurrent){
  const t = includeCurrent ? tries[i] : tries[i];
  if(!t.length) return "";
  const parts = t.map((x,k)=>`<span class="${x.ok?"ok":"bad"}">${k+1}: ${L[x.pick]} ${x.ok?"correct":"wrong"}</span>`).join(" · ");
  return `<div class="tries">Attempts ${parts}</div>`;
}

function fmtLine(t){
  let m;
  if((m=t.match(/^Correct:\s*([A-E])\.?\s*(.*)$/)) || (m=t.match(/^([A-E]) is correct\.?\s*(.*)$/)))
    return `<p class="why"><span class="lk ok">${m[1]}</span><span>${esc(m[2])}</span></p>`;
  if((m=t.match(/^([A-E]):\s*(.*)$/)))
    return `<p class="alt"><span class="lk">${m[1]}</span><span>${esc(m[2])}</span></p>`;
  if((m=t.match(/^(Takeaway|High yield|High-yield|Key point|Clues):\s*(.*)$/i)))
    return `<p class="take"><b>${esc(m[1])}.</b> ${esc(m[2])}</p>`;
  return `<p>${esc(t)}</p>`;
}

function renderQ(){
  const q = QUESTIONS[cur], a = ans[cur], done = a!==null, st = strikes[cur];
  const opts = q.o.map((o,i)=>{
    let c = "";
    if(done){ if(i===q.a) c="right"; else if(i===a) c="wrong"; }
    const struck = !done && st.includes(i);
    const strikeBtn = done ? "" : `<button class="strike" data-s="${i}" aria-pressed="${struck}" aria-label="${struck?"Restore":"Strike out"} option ${L[i]}" title="${struck?"Restore":"Strike out"} option">${struck?"↺":"✕"}</button>`;
    return `<div class="optrow ${struck?"struck":""}"><button class="opt ${c}" data-i="${i}" ${done?"disabled":""}><span class="k">${L[i]}</span><span>${esc(o)}</span></button>${strikeBtn}</div>`;
  }).join("");
  let fb = "";
  if(done){
    const ok = a===q.a;
    const lines = q.e.split("\n").map(fmtLine).join("");
    const objs = q.l.map(id=>`<div class="obj"><b>Objective ${esc(id)}</b> ${esc(OBJECTIVES[id]||"")}</div>`).join("");
    fb = `<div class="fb" role="status"><div class="verdict ${ok?"ok":"bad"}">${ok?"Correct.":"Incorrect. The answer is "+L[q.a]+"."}</div>${lines}${objs}${triesLine(cur)}<div class="fbtools"><button class="btn ghost" id="redo">Reset and redo this question</button></div></div>`;
  }
  const pre = (!done && tries[cur].length) ? `<div class="hint">Redo. Your earlier attempts are saved.</div>${triesLine(cur)}` : (!done ? `<div class="hint">Tap ✕ to strike out an option. Right-click works too.</div>` : "");
  const last = cur===N-1;
  $("#main").innerHTML = `<article class="card">
    <div class="chead"><span class="tag">${esc(q.c)}</span><span class="qn">${cur+1} of ${N}</span></div>
    <p class="stem">${esc(q.p)}</p>
    ${pre}
    <div class="opts">${opts}</div>${fb}
    <div class="nav"><button class="btn ghost" id="prev" ${cur===0?"disabled":""}>Previous</button>
    <button class="btn" id="next" ${done?"":"disabled"}>${last?"See results":"Next"}</button></div>
  </article>`;
  document.querySelectorAll(".opt").forEach(b=>{
    b.onclick=()=>{ const p=+b.dataset.i; ans[cur]=p; tries[cur].push({pick:p, ok:p===q.a, at:new Date().toISOString()}); tries[cur]=tries[cur].slice(-10); strikes[cur]=[]; render(false); persist(); };
    b.oncontextmenu=(e)=>{ if(done) return; e.preventDefault(); toggleStrike(+b.dataset.i); };
  });
  document.querySelectorAll(".strike").forEach(b=>b.onclick=()=>toggleStrike(+b.dataset.s));
  const r=$("#redo"); if(r) r.onclick=()=>{ ans[cur]=null; strikes[cur]=[]; render(false); persist(); };
  $("#prev").onclick=()=>{cur--;render();};
  $("#next").onclick=()=>{ if(last){showResults=true;} else cur++; render(); };
}

function toggleStrike(i){
  const s = strikes[cur], k = s.indexOf(i);
  if(k<0) s.push(i); else s.splice(k,1);
  render(false); persist();
}

function renderResults(){
  const s = score(), pct = Math.round(100*s/N);
  const cats = {};
  QUESTIONS.forEach((q,i)=>{ cats[q.c]=cats[q.c]||[0,0]; cats[q.c][1]++; if(ans[i]===q.a) cats[q.c][0]++; });
  const rows = Object.entries(cats).map(([c,[r,t]])=>`<tr><td>${esc(c)}<span class="meter"><i style="width:${Math.round(100*r/t)}%"></i></span></td><td>${r} / ${t}</td></tr>`).join("");
  const missed = {};
  QUESTIONS.forEach((q,i)=>{ const wrongFirst = tries[i].length && !tries[i][0].ok; if(ans[i]!==q.a || wrongFirst) q.l.forEach(id=>{ const w=id.split(" ")[0]; missed[w]=missed[w]||new Set(); missed[w].add(id); }); });
  const weeks = Object.keys(missed).sort((x,y)=>parseInt(x.slice(1))-parseInt(y.slice(1)));
  const missHtml = weeks.length ? weeks.map(w=>`<h3>Week ${w.slice(1)}</h3><ul class="miss">${[...missed[w]].map(id=>`<li><code>${esc(id)}</code>${esc(OBJECTIVES[id]||"")}</li>`).join("")}</ul>`).join("") : "<p>No missed objectives.</p>";
  const redone = tries.filter(t=>t.length>1).length;
  const un = N - answered();
  $("#main").innerHTML = `<article class="card">
    <div class="chead"><span class="tag">Results</span><span>${un?un+" unanswered":"Complete"}</span></div>
    <div><div class="big">${s} / ${N}</div><div class="stats"><span><b>${pct}%</b> correct now</span><span>First try <b>${firstTryScore()} / ${firstTryCount()}</b></span><span>Redone <b>${redone}</b></span></div></div>
    <table><thead><tr><th>Topic</th><th>Score</th></tr></thead><tbody>${rows}</tbody></table>
    <h2>Objectives to review</h2><p class="hint">Includes questions you missed on the first try, even if a redo got them right.</p>${missHtml}${history.length?`<h2>Past attempts</h2><table><thead><tr><th>Date</th><th>Score</th></tr></thead><tbody>${history.slice().reverse().map(h=>`<tr><td>${new Date(h.date).toLocaleDateString()}</td><td>${h.score} / ${h.total}</td></tr>`).join("")}</tbody></table>`:""}
    <div class="nav"><button class="btn ghost" id="back">Back to questions</button><button class="btn" id="restart">Restart all</button></div>
  </article>`;
  $("#back").onclick=()=>{showResults=false;render();};
  $("#restart").onclick=()=>{
    if(answered() || tries.some(t=>t.length)){
      history.push({date:new Date().toISOString(), score:score(), answered:answered(), total:N, firstTry:firstTryScore(),
        missed:QUESTIONS.map((q,i)=>ans[i]!==null&&ans[i]!==q.a?"q"+(i+1):null).filter(Boolean)});
      history=history.slice(-20);
    }
    ans.fill(null); tries=QUESTIONS.map(()=>[]); strikes=QUESTIONS.map(()=>[]); cur=0; showResults=false; render(); persist();
  };
}

function setSave(text, cls){ const el=$("#save"); if(el){ el.textContent=text; el.className="save "+(cls||""); } }
function bodyOf(){
  const a = {};
  QUESTIONS.forEach((q,i)=>{
    if(ans[i]===null && !tries[i].length && !strikes[i].length) return;
    a["q"+(i+1)] = {pick:ans[i], ok:ans[i]!==null && ans[i]===q.a, l:q.l, tries:tries[i], strikes:strikes[i]};
  });
  return {answers:a, history, total:N, answered:answered(), score:score(), firstTry:firstTryScore(), updatedAt:new Date().toISOString()};
}
function validPick(i,p){ return Number.isInteger(p) && p>=0 && p<QUESTIONS[i].o.length; }
function applySaved(d){
  if(!d || typeof d!=="object") return;
  ans.fill(null); tries=QUESTIONS.map(()=>[]); strikes=QUESTIONS.map(()=>[]);
  const a = d.answers || {};
  for(const k in a){
    const i = parseInt(k.slice(1),10)-1, row = a[k];
    if(!(i>=0 && i<N) || !row || typeof row!=="object") continue;
    if(validPick(i,row.pick)) ans[i]=row.pick;
    if(Array.isArray(row.tries)) tries[i]=row.tries.filter(t=>t&&validPick(i,t.pick)).map(t=>({pick:t.pick, ok:t.pick===QUESTIONS[i].a, at:String(t.at||"")})).slice(-10);
    else if(ans[i]!==null) tries[i]=[{pick:ans[i], ok:ans[i]===QUESTIONS[i].a, at:""}];
    if(Array.isArray(row.strikes)) strikes[i]=row.strikes.filter(x=>validPick(i,x));
  }
  history = Array.isArray(d.history) ? d.history.slice(-20) : [];
  const first = ans.findIndex(x=>x===null); cur = first<0 ? N-1 : first;
}
function lsLoad(){ try{ return JSON.parse(localStorage.getItem(LS_KEY)||"null"); }catch(e){ return null; } }
function lsSave(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(bodyOf())); }catch(e){} }
async function persist(){
  lsSave();
  if(!db || !uid) return;
  dirty = true; if(writing) return; writing = true;
  while(dirty){
    dirty = false;
    setSave("Saving…");
    try{ await db.doc("attempts/"+uid).set(bodyOf()); setSave("Progress saved to your account.","ok"); }
    catch(e){
      if(e && e.code==="invalid_argument"){ db=null; setSave("Progress saves in this browser only.","bad"); break; }
      setSave("Could not save to your account. Progress saves in this browser.","bad");
    }
  }
  writing = false;
}
async function connect(){
  try{
    if(!window.claude || !window.claude.use) return;
    const [u, d] = await Promise.all([window.claude.use("user"), window.claude.use("db")]);
    if(!u || !d) return;
    const id = await u.id(); if(!id) return;
    db = d; uid = id;
    const snap = await db.doc("attempts/"+uid).get();
    if(snap.exists){ applySaved(snap.data()); render(); setSave("Progress saved to your account.","ok"); }
    else if(answered() || tries.some(t=>t.length)){ persist(); }
    else setSave("Progress saves to your account.","ok");
  }catch(e){ /* keep local-only mode */ }
}

function render(top=true){ renderHeader(); showResults?renderResults():renderQ(); if(top) window.scrollTo({top:0}); }
applySaved(lsLoad());
render();
connect();
</script>

</body></html>
