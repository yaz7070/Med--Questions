<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Week 6 Question Bank</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Source+Sans+3:wght@400;600;700&display=swap">
<style>
/* Differential quiz page. Matches the site: teal accent, Bricolage Grotesque for display, Source Sans 3 for reading. */
:root{
  --bg:#f6f9f8;--paper:#ffffff;--ink:#0f2624;--muted:#3d5452;--faint:#7f9895;--line:#d9e5e3;
  --accent:#0e7c7b;--deep:#0a5f5e;--soft:#e7f1f0;
  --ok:#1d7a46;--okw:#e7f4ec;--bad:#b42318;--badw:#fcecea;--tick:#dde8e6;
  --display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --body:"Source Sans 3","Segoe UI",system-ui,-apple-system,sans-serif;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1716;--paper:#142120;--ink:#ecf4f3;--muted:#c7d8d5;--faint:#7f9895;--line:#24413e;
  --accent:#4fc1b8;--deep:#82d8d0;--soft:#18302e;
  --ok:#5ccf8f;--okw:#13301f;--bad:#f2877c;--badw:#3a1c1a;--tick:#22403c;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1716;--paper:#142120;--ink:#ecf4f3;--muted:#c7d8d5;--faint:#7f9895;--line:#24413e;
  --accent:#4fc1b8;--deep:#82d8d0;--soft:#18302e;
  --ok:#5ccf8f;--okw:#13301f;--bad:#f2877c;--badw:#3a1c1a;--tick:#22403c;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55}
.wrap{max-width:820px;margin:0 auto;padding-block:28px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:20px}

/* Header */
header{display:flex;flex-direction:column;gap:10px}
.context{margin:0;color:var(--faint);font-size:14px;font-weight:600}
h1{font-family:var(--display);font-weight:700;font-size:clamp(28px,5vw,40px);line-height:1.05;letter-spacing:-.02em;margin:0;text-wrap:balance}
.stats{display:flex;flex-wrap:wrap;gap:6px 22px;font-size:15px;color:var(--muted);font-variant-numeric:tabular-nums}
.stats b{color:var(--ink);font-weight:700}
.bar{height:6px;border-radius:999px;background:var(--tick);overflow:hidden}
.bar span{display:block;height:100%;width:0;background:var(--accent);border-radius:999px;transition:width .25s ease}
.map summary{cursor:pointer;color:var(--accent);font-weight:600;font-size:14px;width:max-content;list-style:none;padding:2px 0}
.map summary::-webkit-details-marker{display:none}
.map summary::before{content:"▸";display:inline-block;margin-right:6px;transition:transform .15s ease}
.map[open] summary::before{transform:rotate(90deg)}
.map summary:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:4px}
.ticks{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}
.tick{width:14px;height:14px;border:0;border-radius:4px;background:var(--tick);padding:0;cursor:pointer}
.tick:hover{background:var(--faint)}
.tick.ok{background:var(--ok)}.tick.bad{background:var(--bad)}
.tick.cur{outline:2px solid var(--accent);outline-offset:2px}
.tick.redo{box-shadow:inset 0 -3px 0 var(--accent)}
.tick:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.save{font-size:13px;color:var(--faint)}
.save.ok{color:var(--ok)}.save.bad{color:var(--bad)}

/* Question card */
.card{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:26px;display:flex;flex-direction:column;gap:18px}
.chead{display:flex;justify-content:space-between;align-items:center;gap:10px}
.tag{font-size:13px;font-weight:700;color:var(--accent);background:var(--soft);padding:4px 11px;border-radius:999px}
.qn{font-family:var(--display);font-weight:700;font-size:15px;color:var(--faint);font-variant-numeric:tabular-nums}
.stem{font-size:18.5px;line-height:1.6;margin:0;white-space:pre-line;max-width:70ch}
.hint{font-size:13px;color:var(--faint)}
.tries{font-size:13px;color:var(--muted)}
.tries .bad{color:var(--bad);font-weight:600}.tries .ok{color:var(--ok);font-weight:600}

/* Options */
.opts{display:flex;flex-direction:column;gap:10px}
.optrow{display:flex;gap:8px;align-items:stretch}
.optrow .opt{flex:1;min-width:0}
.opt{display:flex;gap:14px;align-items:center;text-align:left;width:100%;background:var(--paper);color:var(--ink);border:1.5px solid var(--line);border-radius:var(--r);padding:12px 16px;font:inherit;font-size:16.5px;line-height:1.45;cursor:pointer;transition:border-color .12s ease,background .12s ease}
.opt:hover:not(:disabled){border-color:var(--accent);background:var(--soft)}
.opt:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.opt:disabled{cursor:default}
.opt .k{flex:none;display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--soft);color:var(--accent);font-family:var(--display);font-weight:700;font-size:14px}
.opt.right{border-color:var(--ok);background:var(--okw)}
.opt.right .k{background:var(--ok);color:var(--paper)}
.opt.wrong{border-color:var(--bad);background:var(--badw)}
.opt.wrong .k{background:var(--bad);color:var(--paper)}
.strike{flex:none;width:44px;border:1.5px solid var(--line);border-radius:var(--r);background:var(--paper);color:var(--faint);font-size:14px;cursor:pointer;display:grid;place-items:center}
.strike:hover{border-color:var(--accent);color:var(--accent)}
.strike:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.strike[aria-pressed="true"]{background:var(--soft);color:var(--ink)}
.optrow.struck .opt > span:last-child{text-decoration:line-through;color:var(--faint)}
.optrow.struck .opt .k{opacity:.45}

/* Feedback */
.fb{background:var(--bg);border-radius:var(--r);padding:18px 20px;display:flex;flex-direction:column;gap:10px}
.verdict{font-family:var(--display);font-weight:700;font-size:18px;display:flex;align-items:center;gap:8px}
.verdict::before{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;font-size:13px;color:var(--paper)}
.verdict.ok{color:var(--ok)}.verdict.ok::before{content:"✓";background:var(--ok)}
.verdict.bad{color:var(--bad)}.verdict.bad::before{content:"✕";background:var(--bad)}
.fb p{margin:0;max-width:72ch}
.fb .why,.fb .alt{display:flex;gap:10px;align-items:baseline}
.fb .why{font-weight:600}
.lk{flex:none;display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--line);color:var(--muted);font-family:var(--display);font-weight:700;font-size:12px;transform:translateY(-1px)}
.lk.ok{background:var(--ok);color:var(--paper)}
.fb .alt{color:var(--muted)}
.fb .take{border-left:3px solid var(--accent);padding:2px 0 2px 12px;color:var(--ink)}
.fb .take b{color:var(--accent)}
.obj{font-size:13.5px;color:var(--faint);line-height:1.5}
.obj b{color:var(--muted)}
.fbtools{display:flex;justify-content:flex-end}

/* Buttons */
.nav{display:flex;justify-content:space-between;gap:10px}
.btn{font-family:var(--display);font-weight:700;font-size:15px;padding:10px 20px;border:1.5px solid var(--accent);border-radius:999px;background:var(--accent);color:var(--paper);cursor:pointer}
.btn:hover:not(:disabled){background:var(--deep);border-color:var(--deep)}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.ghost:hover:not(:disabled){background:var(--soft);color:var(--accent);border-color:var(--accent)}
.btn:disabled{opacity:.35;cursor:default}
.btn:focus-visible{outline:2px solid var(--ink);outline-offset:3px}

/* Results */
.big{font-family:var(--display);font-size:clamp(48px,9vw,72px);font-weight:700;line-height:1;letter-spacing:-.03em;color:var(--accent);font-variant-numeric:tabular-nums}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
td,th{text-align:left;padding:9px 0;border-bottom:1px solid var(--line);font-size:15px;vertical-align:middle}
th{font-size:13px;font-weight:700;color:var(--faint)}
td:last-child,th:last-child{text-align:right;white-space:nowrap;padding-left:12px}
.meter{display:block;height:5px;border-radius:999px;background:var(--tick);margin-top:6px;max-width:320px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent);border-radius:999px}
h2{font-family:var(--display);font-size:21px;font-weight:700;margin:6px 0 0}
h3{font-size:14px;font-weight:700;color:var(--faint);margin:6px 0 0}
.miss{margin:0;padding-left:0;list-style:none;display:flex;flex-direction:column;gap:8px;font-size:15px}
.miss code{font-family:var(--display);font-weight:700;font-size:13px;color:var(--bad);background:var(--badw);padding:1px 7px;border-radius:999px;margin-right:8px}

@media (max-width:560px){.card{padding:18px;border-radius:14px}.stem{font-size:17.5px}.opt{padding:11px 12px;gap:10px}.strike{width:40px}}
@media (prefers-reduced-motion:no-preference){.fb{animation:in .2s ease-out}@keyframes in{from{opacity:.3;transform:translateY(4px)}to{opacity:1;transform:none}}}
@media (prefers-reduced-motion:reduce){.bar span,.opt,.map summary::before{transition:none}}
</style>

  <header>
    <p class="context">Foundations of Medicine, Block 2, Week 6</p>
    <h1>Week 6 Question Bank</h1>
    <div class="stats" id="stats"></div>
    <div class="bar" aria-hidden="true"><span id="barfill"></span></div>
    <details class="map" id="map"><summary>Question map</summary><div class="ticks" id="ticks" aria-label="Question map"></div></details>
    <div class="save" id="save" role="status">Progress saves in this browser.</div>

<script>
const QUESTIONS = [{"c": "Week 6", "p": "Grace, 48, has a 1.4 cm breast carcinoma excised with sentinel node biopsy. The report reads poorly differentiated invasive ductal carcinoma, 0 of 3 lymph nodes positive. Staging CT shows no distant spread. Which statement best describes her tumour?", "o": ["Advanced stage with an aggressive, high grade", "Early stage with an aggressive, high grade", "Early stage with an indolent, low grade", "Advanced stage with an indolent, low grade"], "a": 1, "e": "B is correct. Stage describes size and spread. A small tumour with N0 and M0 is early stage. Grade describes how cells look. Poorly differentiated is grade III, aggressive.\nA: Grade is right, but N0 M0 at 1.4 cm is not advanced.\nC: The stage is right, but poorly differentiated cells are high grade.\nD: No nodes or metastases rules out advanced stage, and poor differentiation rules out low grade.\nHigh yield: Grade and stage are separate. Both inform prognosis and treatment.", "l": ["W6 4.2", "W6 6.4"]}, {"c": "Week 6", "p": "Two families attend a cancer genetics clinic. In Family 1, a single activating mutation in one allele of RET drives medullary thyroid cancer. In Family 2, a child inherits one mutated Rb allele and develops cancer after a second mutation. Which classification of each gene is correct, in order?", "o": ["Oncogene in both of the two families", "Tumour suppressor in both of the families", "Oncogene, then tumour suppressor gene", "Tumour suppressor gene, then oncogene"], "a": 2, "e": "C is correct. RET is a proto-oncogene, and a single hit in one allele makes it an oncogene (gain of function). Rb is a tumour suppressor gene that needs two hits (loss of function), and an inherited first hit raises risk.\nA: Rb needs two hits, the hallmark of a tumour suppressor.\nB: RET needs only one hit, the hallmark of an oncogene.\nD: This reverses the two mechanisms.\nHigh yield: One hit: Ras, c-myc, Her2-neu, RET. Two hits: p53, Rb, PTEN, BRCA1/2.", "l": ["W6 7.9"]}, {"c": "Week 6", "p": "Ahmed, 47, grew up in rural Egypt and had a parasitic infection as a child that was never treated. He now has painless blood in his urine, and cystoscopy shows a bladder mass. Which organism most likely contributed to his cancer?", "o": ["Helicobacter pylori", "Human T-lymphotropic virus 1", "Southeast Asian liver fluke", "Schistosoma blood flukes"], "a": 3, "e": "D is correct. Schistosoma (blood flukes) is linked to bladder cancer.\nA: H. pylori causes gastric cancer.\nB: HTLV-1 causes adult T-cell lymphoma.\nC: The Southeast Asian liver fluke causes cholangiocarcinoma.\nHigh yield: HPV: cervical, anal, oropharyngeal. HBV and HCV: hepatocellular. EBV: nasopharyngeal, Burkitt, Hodgkin. HHV8: Kaposi sarcoma.", "l": ["W6 7.7"]}, {"c": "Week 6", "p": "A cervical biopsy from Mei, 33, shows dysplastic cells spanning the full thickness of the squamous epithelium. The basement membrane is intact throughout and no dysplastic cells are seen beneath it. Which term and implication fit best?", "o": ["Carcinoma in situ, not yet a malignant neoplasm", "Invasive carcinoma, at risk of nodal spread", "Metaplasia, a reversible adaptive change", "Metastasis, spread from a distant primary"], "a": 0, "e": "A is correct. Dysplastic cells involving the entire epithelial thickness and pushing against an intact basement membrane define carcinoma in situ (high grade dysplasia), which is pre-malignant.\nB: A malignant neoplasm needs cells past the basement membrane.\nC: Metaplasia is a change of cell type without dysplasia.\nD: Metastasis is spread to and invasion of other tissues.\nHigh yield: Pap testing screens for this pre-cancer stage.", "l": ["W6 4.1", "W6 7.4"]}, {"c": "Week 6", "p": "Chloe, 24, notices a new lump in her left breast. On exam there is a 2 cm smooth, firm, mobile, non-tender mass with no skin or nipple changes and no palpable axillary nodes. Which is the most appropriate first imaging test?", "o": ["Breast ultrasound", "Staging CT of the chest", "Contrast breast MRI", "Diagnostic mammogram"], "a": 0, "e": "A is correct. Ultrasound is the first modality for a palpable lump and for women under 30.\nB: CT is for staging after biopsy and is not used in the workup.\nC: MRI is for high-risk screening, high breast density and local staging.\nD: Mammography is not the first modality for a palpable lump in a woman under 30.\nHigh yield: Firm, mobile, well-circumscribed fits fibroadenoma, a benign neoplasm.", "l": ["W6 3.2", "W6 1.3"]}, {"c": "Week 6", "p": "Hannah, 32, tested positive for a pathogenic BRCA1 variant after her mother's ovarian cancer diagnosis. She has no breast symptoms and a normal clinical breast exam. Which breast screening plan fits?", "o": ["Annual mammogram alone, from age 40", "Mammogram every 2 years, from age 50", "Annual MRI and mammogram, from now", "Clinical breast exams only until 35"], "a": 2, "e": "C is correct. BRCA carriers have an annual mammogram from 30 and breast MRI from 30 to 69. She is 32, so screening applies now.\nA: Mammogram alone misses MRI, and 40 is too late.\nB: Every 2 years from 50 is the average-risk program.\nD: Clinical exams alone are not the plan. Age 35 is the BRCA1 prophylactic surgery milestone.\nHigh yield: Prophylactic surgery: age 35 for BRCA1, age 40 for BRCA2.", "l": ["W6 7.11"]}, {"c": "Week 6", "p": "Ruth, 66, has a breast mass that radiology rates as highly suspicious for malignancy. Her core needle biopsy returns as benign breast tissue. What is the most appropriate next step?", "o": ["Reassure her and return to routine screening", "Repeat a screening mammogram in 2 years", "Discuss the discordance with the pathologist", "Refer for mastectomy without further review"], "a": 2, "e": "C is correct. Clinical-pathological non-concordance is a reason to communicate directly, beyond the requisition.\nA: Reassurance ignores imaging and pathology that disagree.\nB: Routine interval screening ignores a suspicious lesion.\nD: Surgery skips resolving the discordance.\nHigh yield: Other triggers: unusual or ambiguous result, missing information, rare diagnosis, urgent result needed.", "l": ["W6 3.6"]}, {"c": "Week 6", "p": "Three patients attend a breast cancer clinic. Patient 1 receives chemotherapy before surgery to shrink a 6 cm tumour. Patient 2 receives radiation after surgery for micro-metastatic disease. Patient 3 receives radiation to relieve pain from a spinal metastasis. Which intent applies to each, in order?", "o": ["Adjuvant, palliative, neoadjuvant", "Neoadjuvant, adjuvant, palliative", "Neoadjuvant, adjuvant, curative", "Adjuvant, neoadjuvant, palliative"], "a": 1, "e": "B is correct. Before surgery to shrink a tumour is neoadjuvant. After surgery for micro-metastatic disease is adjuvant. Radiation to relieve symptoms of metastatic disease is palliative.\nA: Patient 2 is post-surgical (adjuvant) and Patient 3 is palliative.\nC: Symptom relief for a metastasis is palliative, not curative.\nD: This swaps the first two.\nHigh yield: Radiation oncology aims to reduce local recurrence or metastasis, or to relieve symptoms.", "l": ["W6 6.2", "W6 6.1"]}, {"c": "Week 6", "p": "Tamara, 41, carries a pathogenic BRCA2 variant. She asks you to order the same test for her healthy 12-year-old daughter so the family has time to plan. Which response best follows the ethics of cancer genetic testing?", "o": ["Test only if the daughter develops breast changes", "Defer testing until she is an adult and chooses", "Test now, since results will guide her screening", "Test now, since a parent holds full decision rights"], "a": 1, "e": "B is correct. Avoid testing children for adult-onset conditions because of stigmatization, anxiety and vulnerable child parenting. Autonomy makes testing each person's own choice.\nA: Symptoms call for diagnostic workup, not predictive testing of a minor.\nC: BRCA surveillance starts at 30, so a result guides nothing in childhood.\nD: The decision belongs to the person tested, under autonomy.\nHigh yield: Confirm a mutation in an affected relative before testing unaffected relatives.", "l": ["W6 9.1"]}, {"c": "Week 6", "p": "Jonah, 39, tests positive for a pathogenic variant causing Lynch syndrome. He does not want his sister told, citing a long family conflict. Which approach best reflects the ethics of sharing genetic results?", "o": ["Contact his sister directly, since beneficence wins", "Insist results be shared with all first-degree relatives", "Withhold further counselling until he agrees to share", "Respect his choice and explain the benefit to relatives"], "a": 3, "e": "D is correct. Under autonomy, it is the patient's right to choose who knows his results. Beneficence supports explaining that relatives have the option of surveillance.\nA: Disclosure without consent violates his autonomy.\nB: No rule makes sharing mandatory.\nC: Withholding counselling breaches non-maleficence and justice.\nHigh yield: Autonomy, beneficence, non-maleficence and justice all apply to genetic testing.", "l": ["W6 9.2"]}, {"c": "Week 6", "p": "Regarding cancer statistics in Canada, which of the following statements are true?\ni) Colorectal cancer is the second leading cause of cancer death\nii) Breast cancer is the leading cause of cancer death in women\niii) About 1 in 2 Canadians will develop cancer in their lifetime\niv) Prostate cancer is the most often diagnosed cancer overall", "o": ["i) and ii) only", "ii) and iv) only", "i), iii) and iv) only", "i) and iii) only", "All of the above"], "a": 3, "e": "D is correct. Canadian cancer mortality ranks lung, colorectum, then pancreas. 1 in 2 Canadians develop cancer and 1 in 4 die of it.\nA: Lung leads cancer deaths in women. Breast is second.\nB: Statements ii and iv are both false.\nC: Lung is the most diagnosed cancer overall. Prostate is first in men only.\nE: Statements ii and iv are false.\nHigh yield: High-income countries have higher incidence and lower mortality.", "l": ["W6 7.1"]}, {"c": "Week 6", "p": "You meet Mr. Laurent, 70, to discuss biopsy results confirming metastatic pancreatic cancer. When you ask what he understands so far, he says the scan showed a cyst and he expects to be back at work next week. Within SPIKES, which step are you in, and what is the best approach?", "o": ["Perception, do not confront his denial at this visit", "Knowledge, correct his understanding with all details", "Empathy, name his emotion before checking understanding", "Invitation, ask permission before sharing information"], "a": 0, "e": "A is correct. Asking what he knows before you tell is Perception. If a patient is in denial, do not confront the denial at the first interview.\nB: Knowledge comes later, with a warning, no jargon and small chunks.\nC: Empathy responds to emotions as they arise after news is given.\nD: Invitation follows Perception and asks how much he wants to know.\nHigh yield: Setting, Perception, Invitation, Knowledge, Empathy, Strategy and summary.", "l": ["W6 5.5"]}, {"c": "Week 6", "p": "Doug, 63, smoked for decades and has a 45 pack-year history. He quit 18 years ago. He feels well and has no symptoms. He asks about lung cancer screening. Which response is correct?", "o": ["He qualifies for a screening chest X-ray each year", "He qualifies for annual low-dose CT, up to 3 times", "He is not eligible, since he quit over 15 years ago", "He qualifies, since pack-years alone define eligibility"], "a": 2, "e": "C is correct. Lung screening covers adults 55-74 with a 30 pack-year history who currently smoke or quit less than 15 years ago. Quitting 18 years ago excludes him.\nA: CXR is not ordered for routine screening.\nB: He meets age and pack-years but fails the quit-time criterion.\nD: Eligibility needs age, pack-years and quit time together.\nHigh yield: Check every criterion, not only the most striking one.", "l": ["W6 7.11"]}, {"c": "Week 6", "p": "Lena, 58, has metastatic breast cancer. Over one week she has had back pain, and now both legs are weak with brisk reflexes and upgoing plantar responses. Her arms are normal. Which cancer emergency is most likely?", "o": ["Superior vena cava obstruction", "Spinal cord compression", "Hypercalcemia", "Brain metastasis with edema"], "a": 1, "e": "B is correct. UMN signs in both legs with normal arms (paraparesis) localize to the thoracic cord. In a patient with cancer this fits spinal cord compression, a listed cancer emergency.\nA: SVC obstruction does not cause leg weakness with UMN signs.\nC: Hypercalcemia does not produce a cord-level UMN pattern.\nD: A brain lesion gives a hemibody pattern, not weakness of both legs with normal arms.\nHigh yield: Life-threatening: metastases compressing the spinal cord or major vessels.", "l": ["W6 1.6"]}, {"c": "Week 6", "p": "Priya, 34, reports lumpy, nodular breasts on both sides. The lumps become tender in the days before her period and settle afterward. Exam shows no dominant mass, skin change or nipple change. Which diagnosis fits best?", "o": ["Fibrocystic change", "Breast abscess", "Single fibroadenoma", "Simple cyst"], "a": 0, "e": "A is correct. Fibrocystic change gives lumpy, nodular breasts with pain and tenderness that varies through the menstrual cycle.\nB: An abscess is a collection of pus from bacterial infection, with acute inflammation.\nC: A fibroadenoma is a single, well-circumscribed, firm, mobile nodule.\nD: A cyst is a single sac that collapses when fluid is removed.\nHigh yield: VITAMIN C&D for a breast mass: infection, trauma, neoplasm, cyst.", "l": ["W6 2.4", "W6 2.3"]}, {"c": "Week 6", "p": "Dana, 45, had a car accident 3 weeks ago and still has a seatbelt bruise across her chest. She now feels a firm lump in the breast under the bruise. Using the VITAMIN C&D approach, which cause best fits?", "o": ["Cyst, from fibrocystic change", "Infection, with an abscess", "Trauma, with fat necrosis", "Neoplasm, as a fibroadenoma"], "a": 2, "e": "C is correct. The trauma category of VITAMIN C&D for a breast mass is fat necrosis. The recent blunt injury at the same site is the clue.\nA: Fibrocystic change varies with the menstrual cycle.\nB: An abscess follows infection, with acute inflammation.\nD: A fibroadenoma is a benign neoplasm unrelated to injury.\nHigh yield: Increasing age raises the likelihood of cancer, so a persistent mass still needs workup.", "l": ["W6 2.2", "W6 2.1"]}, {"c": "Week 6", "p": "A family physician is building a workup for a new palpable breast mass in a 52-year-old. Which investigation has no role in diagnosing the type of breast mass?", "o": ["Diagnostic mammography views", "A blood tumour marker panel", "Image-guided core biopsy", "Targeted breast ultrasound"], "a": 1, "e": "B is correct. No blood or urine test helps identify the type of breast mass, so lab medicine has no role in diagnosis.\nA: Mammography is used in screening and diagnosis.\nC: Biopsy under ultrasound or stereotactic guidance gives the tissue diagnosis.\nD: Ultrasound is a primary diagnostic tool for a palpable lump.\nHigh yield: Your Week 6 quiz listed tumour markers as a distractor for the same reason.", "l": ["W6 3.1", "W6 3.3"]}, {"c": "Week 6", "p": "A surgeon completes the pathology requisition for a lumpectomy specimen. Which item belongs on the requisition rather than in the pathology report?", "o": ["The ACMG classification of a variant", "The time the specimen went into formalin", "The synoptic summary of the margins", "The ER, PR and Her2 biomarker test results"], "a": 1, "e": "B is correct. The requisition carries patient ID, ischemic time, date and time of procurement and formalin, exact sites and clinical information.\nA: ACMG classification appears in the cancer genetic report.\nC: The synoptic report is part of the microscopic description in the pathology report.\nD: ER, PR and Her2 results appear in the pathology report.\nHigh yield: Clinical information on the requisition: history, imaging, reason for test, DDx, pitfalls, ancillary tests.", "l": ["W6 3.4"]}, {"c": "Week 6", "p": "Four core biopsy reports use different phrases. Which phrase signals the greatest concern for cancer while stopping short of a definite malignant diagnosis?", "o": ["Atypia present, cannot exclude malignancy", "Atypia present, favour reactive", "Suspicious for malignancy", "Negative for malignancy"], "a": 2, "e": "C is correct. The narrative scale runs: positive, suspicious, atypia that cannot exclude malignancy, atypia favouring reactive, negative. Suspicious sits directly below positive.\nA: This sits one step below suspicious.\nB: This leans toward a benign, reactive process.\nD: This rules out malignancy.\nHigh yield: An ambiguous result is a reason to talk to the pathologist directly.", "l": ["W6 3.5"]}, {"c": "Week 6", "p": "Helen, 44, has a hereditary cancer panel. The report lists one variant with an ACMG classification of 3. How should this result be described to her?", "o": ["Variant of uncertain significance", "Pathogenic variant", "A likely pathogenic variant that raises risk", "Likely benign variant"], "a": 0, "e": "A is correct. ACMG classes: 1 pathogenic, 2 likely pathogenic, 3 VUS, 4 likely benign, 5 benign.\nB: Pathogenic is class 1.\nC: Likely pathogenic is class 2.\nD: Likely benign is class 4.\nHigh yield: The panel tests 37 genes on a blood sample.", "l": ["W6 4.5"]}, {"c": "Week 6", "p": "Regarding the drawbacks of cancer genetic testing, which of the following statements are true?\ni) Results include false positives and false negatives\nii) Current tests identify all inherited gene changes linked to cancer\niii) Effective risk reduction or early detection methods might not exist\niv) A positive result often leads to more worry, appointments and tests", "o": ["i), iii) and iv) only", "i) and iv) only", "ii) and iii) only", "i), ii) and iii) only", "All of the above"], "a": 0, "e": "A is correct. Drawbacks include false results, tests that miss some inherited changes, a lack of effective risk reduction for some cancers, and more worry and procedures after a positive result.\nB: Statement iii is also true.\nC: Statement ii is false.\nD: Statement ii is false and iv is true.\nE: Statement ii is false.\nHigh yield: Benefits: better risk prediction, relief of uncertainty, testing options for relatives, earlier detection.", "l": ["W6 6.3"]}, {"c": "Week 6", "p": "In culture, cells from a patient's tumour keep dividing well past 70 divisions without stopping, and their telomeres stay long. Which hallmark of cancer does this show?", "o": ["Self-sufficiency in growth signals", "Sustained angiogenesis", "Limitless replicative potential", "Evasion of apoptosis"], "a": 2, "e": "C is correct. Cancer cells produce telomerase, which lengthens telomeres and overcomes the Hayflick limit of 60-70 divisions.\nA: Self-sufficiency involves making their own growth factors and always-on receptors.\nB: Sustained angiogenesis involves the angiogenic switch.\nD: Evasion of apoptosis most often involves p53 mutations.\nHigh yield: Emerging hallmarks: immune evasion, tumour-promoting inflammation, genome instability, deregulated energetics.", "l": ["W6 7.8", "W6 7.2"]}, {"c": "Week 6", "p": "In the two stage clonal expansion model, a genetic alteration has produced premalignant cells, and these cells are now proliferating. Which stage comes next?", "o": ["Angiogenic switch", "Initiation", "Progression", "Transformation"], "a": 3, "e": "D is correct. The model runs initiation, promotion, transformation, then progression. After premalignant cells proliferate (promotion), a second rapid alteration produces a malignant cell (transformation).\nA: The angiogenic switch is a hallmark of cancer, not a stage of this model.\nB: Initiation already happened when the premalignant cell formed.\nC: Progression follows transformation, from malignant cell to clinical cancer.\nHigh yield: Cancer is usually a cascade of mutations, not one.", "l": ["W6 7.3", "W6 7.4"]}, {"c": "Week 6", "p": "During a breast cancer risk review, two factors are noted for Amira, 47: early menarche and never breastfeeding, and then regular tanning bed use. How is each risk factor classified, in order?", "o": ["Modifiable in both of the cases", "Non-modifiable, then modifiable", "Non-modifiable in both of the cases", "Modifiable, then non-modifiable"], "a": 1, "e": "B is correct. Reproductive history (breastfeeding, menarche, menopause) is a non-modifiable factor in GGRAPES. Tanning beds are a modifiable factor.\nA: Reproductive history is non-modifiable.\nC: Tanning bed use is modifiable.\nD: This reverses the two.\nHigh yield: GGRAPES: geography, genetic susceptibility, reproductive history, age, precursor lesions, ethnicity, sex.", "l": ["W6 8.3", "W6 7.5"]}, {"c": "Week 6", "p": "An Indigenous patient with a strong family history of breast cancer meets two team members. Member 1 does her risk assessment, takes informed consent for genetic testing and plans screening of her relatives. Member 2 helps her navigate the health care system and provides counselling. Who are they, in order?", "o": ["Genetics counsellor, then Indigenous health navigator", "Medical oncologist, then social worker", "Primary care physician, then palliative care physician", "Social worker, then genetics counsellor"], "a": 0, "e": "A is correct. The genetics counsellor does risk assessment, consent for genetic testing and screening of family members. The Indigenous health navigator advocates by helping navigate the health care system, plus counselling.\nB: The medical oncologist gives systemic therapies.\nC: Primary care does screening, symptom relief and referrals. Palliative care relieves suffering.\nD: The social worker helps navigate the journey to recovery, and does not take consent for genetic testing.\nHigh yield: Gynecological surgeon: fertility and pregnancy options, prophylactic surgery.", "l": ["W6 12.1"]}, {"c": "Week 6", "p": "A staging report reads T2 N1 M1. The N and M categories each describe a route of cancer spread. Which routes do they capture, in order?", "o": ["Hematogenous, then lymphatic", "Lymphatic, then direct", "Direct, then lymphatic", "Lymphatic, then hematogenous"], "a": 3, "e": "D is correct. T reflects direct local growth, N reflects lymphatic spread to regional nodes, and M reflects hematogenous metastasis.\nA: This reverses the two.\nB: M captures hematogenous spread, not direct growth.\nC: Direct growth is captured by T.\nHigh yield: M1 means stage IV: spread to at least one other organ.", "l": ["W6 7.10", "W6 6.4"]}, {"c": "Pathology reports", "p": "Two sections of a surgical pathology report are described. Section 1 gives the location and type of the tissue sample. Section 2 is the overall summary of the most important findings and influences management. Which sections are these, in order?", "o": ["Specimen, then Diagnosis", "Clinical information, then Diagnosis", "Specimen, then Synoptic report", "Gross description, then Synoptic report"], "a": 0, "e": "A is correct. The Specimen section gives the location and type of tissue. The Diagnosis section is the overall summary of the most important findings, and it influences management.\nB: Clinical information carries the history from the requisition.\nC: The synoptic report is a checklist, not the overall summary.\nD: The gross description covers the specimen's appearance, ink and section codes. The synoptic report is the checklist within the microscopic description.\nHigh yield: Your mock exam miss: the synoptic report is the checklist, and the Diagnosis section is the summary.", "l": ["W6 4.4"]}, {"c": "Pathology reports", "p": "An oncologist needs the margin status, lymph node findings and stage classification for a resected breast cancer. In which part of the pathology report are these found?", "o": ["The specimen section", "The Diagnosis section summary", "The clinical information section", "The gross description of the whole specimen", "The synoptic report, microscopic section"], "a": 4, "e": "E is correct. The synoptic report, within the microscopic description, lists specimen, tumour, margins, lymph nodes, stage classification, additional findings and comments.\nA: The specimen section gives location and type of tissue.\nB: The Diagnosis is an overall summary, not the full checklist.\nC: Clinical information comes from the requisition.\nD: The gross description gives specimen, main findings, ink code and section code.\nHigh yield: ER, PR and Her2 biomarker results also sit in the microscopic description.", "l": ["W6 4.5", "W6 6.4"]}, {"c": "Pathology reports", "p": "Helen's hereditary cancer genetic report is marked ABNORMAL. Which statement about this type of report is correct?", "o": ["Its Interpretation gives significance from ClinVar", "The hereditary cancer panel tests 5 genes", "A variant of uncertain significance is ACMG class 2", "Its specimen is tumour tissue from the biopsy site", "An ACMG class 5 variant is pathogenic"], "a": 0, "e": "A is correct. The Interpretation section states the result, the findings (type of mutation, exon, gene) and the clinical significance from ClinVar and the literature.\nB: The multi-gene panel tests 37 genes.\nC: A VUS is class 3. Class 2 is likely pathogenic.\nD: The specimen is blood.\nE: Class 5 is benign. Class 1 is pathogenic.\nHigh yield: ACMG: 1 pathogenic, 2 likely pathogenic, 3 VUS, 4 likely benign, 5 benign.", "l": ["W6 4.5", "W6 6.3"]}, {"c": "Cancer screening", "p": "A medical student lists screening intervals for average-risk adults. Which interval is correct?", "o": ["FIT every year", "Flexible sigmoidoscopy every 5 years", "Prostate PSA every year from age 55", "Mammogram every year from age 50", "Pap test every 3 years"], "a": 4, "e": "E is correct. Cervical screening with a Pap test is every 3 years for women 25-70.\nA: FIT is every 2 years.\nB: Flexible sigmoidoscopy or colonoscopy is every 10 years.\nC: PSA for men 55-69 is every 2-4 years.\nD: Average-risk mammograms are every 2 years from 50 to 74.\nHigh yield: Your first-try miss on the mock: sigmoidoscopy is every 10 years, not 2.", "l": ["W6 7.11"]}, {"c": "Cancer screening", "p": "Mrs. Leclerc, 71, is healthy and has had three negative Pap tests in a row over the last 10 years. She asks whether she still needs cervical screening. What is the best answer?", "o": ["Continue Pap tests every 3 years for life", "Continue Pap tests every 3 years until age 74", "She has aged out of cervical screening", "Switch to mammograms in place of Pap tests", "Switch to a yearly Pap test after age 70"], "a": 2, "e": "C is correct. Cervical screening runs ages 25-70. Women over 70 with 3 or more successive negative tests in the last 10 years are out.\nA: Screening stops at 70 with a negative history.\nB: 74 is the stop age for breast and colorectal screening, not cervical.\nD: Mammograms screen for breast cancer, not cervical cancer.\nE: No yearly Pap test is recommended after 70.\nHigh yield: Stop ages: cervical 70, breast 74, colorectal 74, prostate 69.", "l": ["W6 7.11"]}, {"c": "Cancer screening", "p": "Mr. Becker, 74, feels well and asks his family doctor to start yearly PSA tests for prostate cancer screening. Which response fits the screening guidance?", "o": ["He is outside the PSA group at age 70+", "Order a low-dose CT scan instead", "Start PSA because everyone over 55 qualifies", "Start a yearly PSA with a yearly DRE", "Start PSA every 2-4 years until age 80"], "a": 0, "e": "A is correct. PSA screening is for men 55-69 every 2-4 years. Men 70 and over are out.\nB: Low-dose CT screens for lung cancer.\nC: The window is 55-69, not everyone over 55.\nD: Yearly PSA and DRE from 45 is for BRCA-positive men.\nE: Screening ends at 69.\nHigh yield: Of 1,000 men tested, about 1 escapes death, which is why PSA screening is controversial.", "l": ["W6 7.11"]}];
const OBJECTIVES = {"W6 1.3": "Modify the approach to a breast mass based on age groups (20-55 years), symptoms, past & family history, prior risk factors and what risk factors and diseases are common", "W6 1.6": "List common urgent presentations of cancer", "W6 12.1": "Demonstrate an understanding of the roles of the interprofessional health care team in the treatment and follow-up of cancer patients including end of life care", "W6 2.1": "Outline the process of creating a differential diagnosis for a mass in general and a breast mass specifically", "W6 2.2": "Develop a list of problems that can lead to a differential diagnosis of a mass based on knowledge of anatomy, cell and tissue types, and general pathologic processes", "W6 2.3": "Identify relevant information in history & physical examination to build a differential diagnosis of a mass in general and a breast mass specifically", "W6 2.4": "Identify clues in history & physical examination to narrow differential diagnosis of a mass in general and a breast mass specifically", "W6 3.1": "Build an approach to selecting investigation", "W6 3.2": "Select appropriate investigations from a diagnostic toolkit using a Choosing Wisely approach", "W6 3.3": "Apply Choosing Wisely principles to reduce inappropriate test utilization & unnecessary testing", "W6 3.4": "Demonstrate how to appropriately complete a pathology requisition", "W6 3.5": "Interpret common phrases pathologists use to communicate uncertainty in pathology reports", "W6 3.6": "List examples of scenarios when clinicians and pathologists should communicate directly with one another (i.e. communication “above & beyond” the requisition, pathology report)", "W6 4.1": "Explain common pathology terminology", "W6 4.2": "Explain terminology related to neoplasia in order to interpret investigation outcomes", "W6 4.4": "Explain meaning of a pathology report", "W6 4.5": "Interpret a cancer synoptic report and cancer genetics test report", "W6 5.5": "Use a framework for breaking bad news and disclosing a diagnosis of cancer", "W6 6.1": "Describe the basic categories of cancer therapy (chemotherapy, radiation and hormonal therapy)", "W6 6.2": "Demonstrate a basic understanding of treatment approaches for cancer patients and intent (curative, adjuvant, neoadjuvant and palliative)", "W6 6.3": "Explain benefits of referral for cancer genetic counseling, including risk assessment, informed consent for genetic testing, and screening of additional family members", "W6 6.4": "Explain how cancer staging and molecular pathology can be used to inform prognosis and treatment", "W6 7.1": "Compare & contrast Canadian versus global cancer health burden statistics", "W6 7.10": "Describe potential anatomical routes for cancer spread", "W6 7.11": "Use knowledge of cancer screening programs in Canada to prepare cancer screening plans for adults with diverse risk profiles", "W6 7.2": "Describe the macroscopic, histologic, genetic and molecular features of cancer", "W6 7.3": "Outline general principles of carcinogenesis", "W6 7.4": "Describe the basic steps of carcinogenesis from premalignant cell to invasive cancer", "W6 7.5": "Outline risk factors for development of cancer", "W6 7.7": "Match important viral/microbial carcinogens with their corresponding cancers", "W6 7.8": "List and discuss the molecular hallmarks of cancer", "W6 7.9": "Define oncogene, proto-oncogene and tumour suppressor gene", "W6 8.3": "List several non-modifiable and lifestyle risk factors associated with cancer", "W6 9.1": "Describe ethics principles related to cancer genetic screening of family member", "W6 9.2": "Explain the ethics concepts regarding disclosure of cancer genetic results to family"};
const L = "ABCDE";
const N = QUESTIONS.length;
let cur = 0, showResults = false;
let ans = new Array(N).fill(null);           // current pick per question
let tries = QUESTIONS.map(()=>[]);           // every locked attempt: {pick, ok, at}
let strikes = QUESTIONS.map(()=>[]);         // struck option indexes for the open attempt
let history = [], db = null, uid = null, writing = false, dirty = false;
const MAP=document.getElementById("map"); if(MAP && QUESTIONS.length<=60) MAP.open=true;
const LS_KEY = "differential-week-6-question-bank";
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");

function score(){ return ans.reduce((n,a,i)=>n+(a!==null&&a===QUESTIONS[i].a?1:0),0); }
function answered(){ return ans.filter(a=>a!==null).length; }
function firstTryScore(){ return tries.reduce((n,t)=>n+(t.length&&t[0].ok?1:0),0); }
function firstTryCount(){ return tries.filter(t=>t.length).length; }

function renderHeader(){
  const bf=$("#barfill"); if(bf) bf.style.width=(100*answered()/N)+"%";
  $("#stats").innerHTML = `<span>Question <b>${showResults?"–":cur+1}</b> of <b>${N}</b></span><span>Answered <b>${answered()}</b></span><span>Score <b>${score()} / ${answered()}</b></span>`;
  $("#ticks").innerHTML = QUESTIONS.map((q,i)=>{
    const st = ans[i]===null?"":(ans[i]===q.a?"ok":"bad");
    const redo = tries[i].length>1 || (ans[i]===null && tries[i].length>0);
    return `<button class="tick ${st} ${redo?"redo":""} ${(!showResults&&i===cur)?"cur":""}" data-i="${i}" aria-label="Question ${i+1}"></button>`;
  }).join("");
  document.querySelectorAll(".tick").forEach(b=>b.onclick=()=>{cur=+b.dataset.i;showResults=false;render();});
}

function triesLine(i, includeCurrent){
  const t = includeCurrent ? tries[i] : tries[i];
  if(!t.length) return "";
  const parts = t.map((x,k)=>`<span class="${x.ok?"ok":"bad"}">${k+1}: ${L[x.pick]} ${x.ok?"correct":"wrong"}</span>`).join(" · ");
  return `<div class="tries">Attempts ${parts}</div>`;
}

function fmtLine(t){
  let m;
  if((m=t.match(/^Correct:\s*([A-E])\.?\s*(.*)$/)) || (m=t.match(/^([A-E]) is correct\.?\s*(.*)$/)))
    return `<p class="why"><span class="lk ok">${m[1]}</span><span>${esc(m[2])}</span></p>`;
  if((m=t.match(/^([A-E]):\s*(.*)$/)))
    return `<p class="alt"><span class="lk">${m[1]}</span><span>${esc(m[2])}</span></p>`;
  if((m=t.match(/^(Takeaway|High yield|High-yield|Key point|Clues):\s*(.*)$/i)))
    return `<p class="take"><b>${esc(m[1])}.</b> ${esc(m[2])}</p>`;
  return `<p>${esc(t)}</p>`;
}

function renderQ(){
  const q = QUESTIONS[cur], a = ans[cur], done = a!==null, st = strikes[cur];
  const opts = q.o.map((o,i)=>{
    let c = "";
    if(done){ if(i===q.a) c="right"; else if(i===a) c="wrong"; }
    const struck = !done && st.includes(i);
    const strikeBtn = done ? "" : `<button class="strike" data-s="${i}" aria-pressed="${struck}" aria-label="${struck?"Restore":"Strike out"} option ${L[i]}" title="${struck?"Restore":"Strike out"} option">${struck?"↺":"✕"}</button>`;
    return `<div class="optrow ${struck?"struck":""}"><button class="opt ${c}" data-i="${i}" ${done?"disabled":""}><span class="k">${L[i]}</span><span>${esc(o)}</span></button>${strikeBtn}</div>`;
  }).join("");
  let fb = "";
  if(done){
    const ok = a===q.a;
    const lines = q.e.split("\n").map(fmtLine).join("");
    const objs = q.l.map(id=>`<div class="obj"><b>Objective ${esc(id)}</b> ${esc(OBJECTIVES[id]||"")}</div>`).join("");
    fb = `<div class="fb" role="status"><div class="verdict ${ok?"ok":"bad"}">${ok?"Correct.":"Incorrect. The answer is "+L[q.a]+"."}</div>${lines}${objs}${triesLine(cur)}<div class="fbtools"><button class="btn ghost" id="redo">Reset and redo this question</button></div></div>`;
  }
  const pre = (!done && tries[cur].length) ? `<div class="hint">Redo. Your earlier attempts are saved.</div>${triesLine(cur)}` : (!done ? `<div class="hint">Tap ✕ to strike out an option. Right-click works too.</div>` : "");
  const last = cur===N-1;
  $("#main").innerHTML = `<article class="card">
    <div class="chead"><span class="tag">${esc(q.c)}</span><span class="qn">${cur+1} of ${N}</span></div>
    <p class="stem">${esc(q.p)}</p>
    ${pre}
    <div class="opts">${opts}</div>${fb}
    <div class="nav"><button class="btn ghost" id="prev" ${cur===0?"disabled":""}>Previous</button>
    <button class="btn" id="next" ${done?"":"disabled"}>${last?"See results":"Next"}</button></div>
  </article>`;
  document.querySelectorAll(".opt").forEach(b=>{
    b.onclick=()=>{ const p=+b.dataset.i; ans[cur]=p; tries[cur].push({pick:p, ok:p===q.a, at:new Date().toISOString()}); tries[cur]=tries[cur].slice(-10); strikes[cur]=[]; render(false); persist(); };
    b.oncontextmenu=(e)=>{ if(done) return; e.preventDefault(); toggleStrike(+b.dataset.i); };
  });
  document.querySelectorAll(".strike").forEach(b=>b.onclick=()=>toggleStrike(+b.dataset.s));
  const r=$("#redo"); if(r) r.onclick=()=>{ ans[cur]=null; strikes[cur]=[]; render(false); persist(); };
  $("#prev").onclick=()=>{cur--;render();};
  $("#next").onclick=()=>{ if(last){showResults=true;} else cur++; render(); };
}

function toggleStrike(i){
  const s = strikes[cur], k = s.indexOf(i);
  if(k<0) s.push(i); else s.splice(k,1);
  render(false); persist();
}

function renderResults(){
  const s = score(), pct = Math.round(100*s/N);
  const cats = {};
  QUESTIONS.forEach((q,i)=>{ cats[q.c]=cats[q.c]||[0,0]; cats[q.c][1]++; if(ans[i]===q.a) cats[q.c][0]++; });
  const rows = Object.entries(cats).map(([c,[r,t]])=>`<tr><td>${esc(c)}<span class="meter"><i style="width:${Math.round(100*r/t)}%"></i></span></td><td>${r} / ${t}</td></tr>`).join("");
  const missed = {};
  QUESTIONS.forEach((q,i)=>{ const wrongFirst = tries[i].length && !tries[i][0].ok; if(ans[i]!==q.a || wrongFirst) q.l.forEach(id=>{ const w=id.split(" ")[0]; missed[w]=missed[w]||new Set(); missed[w].add(id); }); });
  const weeks = Object.keys(missed).sort((x,y)=>parseInt(x.slice(1))-parseInt(y.slice(1)));
  const missHtml = weeks.length ? weeks.map(w=>`<h3>Week ${w.slice(1)}</h3><ul class="miss">${[...missed[w]].map(id=>`<li><code>${esc(id)}</code>${esc(OBJECTIVES[id]||"")}</li>`).join("")}</ul>`).join("") : "<p>No missed objectives.</p>";
  const redone = tries.filter(t=>t.length>1).length;
  const un = N - answered();
  $("#main").innerHTML = `<article class="card">
    <div class="chead"><span class="tag">Results</span><span>${un?un+" unanswered":"Complete"}</span></div>
    <div><div class="big">${s} / ${N}</div><div class="stats"><span><b>${pct}%</b> correct now</span><span>First try <b>${firstTryScore()} / ${firstTryCount()}</b></span><span>Redone <b>${redone}</b></span></div></div>
    <table><thead><tr><th>Topic</th><th>Score</th></tr></thead><tbody>${rows}</tbody></table>
    <h2>Objectives to review</h2><p class="hint">Includes questions you missed on the first try, even if a redo got them right.</p>${missHtml}${history.length?`<h2>Past attempts</h2><table><thead><tr><th>Date</th><th>Score</th></tr></thead><tbody>${history.slice().reverse().map(h=>`<tr><td>${new Date(h.date).toLocaleDateString()}</td><td>${h.score} / ${h.total}</td></tr>`).join("")}</tbody></table>`:""}
    <div class="nav"><button class="btn ghost" id="back">Back to questions</button><button class="btn" id="restart">Restart all</button></div>
  </article>`;
  $("#back").onclick=()=>{showResults=false;render();};
  $("#restart").onclick=()=>{
    if(answered() || tries.some(t=>t.length)){
      history.push({date:new Date().toISOString(), score:score(), answered:answered(), total:N, firstTry:firstTryScore(),
        missed:QUESTIONS.map((q,i)=>ans[i]!==null&&ans[i]!==q.a?"q"+(i+1):null).filter(Boolean)});
      history=history.slice(-20);
    }
    ans.fill(null); tries=QUESTIONS.map(()=>[]); strikes=QUESTIONS.map(()=>[]); cur=0; showResults=false; render(); persist();
  };
}

function setSave(text, cls){ const el=$("#save"); if(el){ el.textContent=text; el.className="save "+(cls||""); } }
function bodyOf(){
  const a = {};
  QUESTIONS.forEach((q,i)=>{
    if(ans[i]===null && !tries[i].length && !strikes[i].length) return;
    a["q"+(i+1)] = {pick:ans[i], ok:ans[i]!==null && ans[i]===q.a, l:q.l, tries:tries[i], strikes:strikes[i]};
  });
  return {answers:a, history, total:N, answered:answered(), score:score(), firstTry:firstTryScore(), updatedAt:new Date().toISOString()};
}
function validPick(i,p){ return Number.isInteger(p) && p>=0 && p<QUESTIONS[i].o.length; }
function applySaved(d){
  if(!d || typeof d!=="object") return;
  ans.fill(null); tries=QUESTIONS.map(()=>[]); strikes=QUESTIONS.map(()=>[]);
  const a = d.answers || {};
  for(const k in a){
    const i = parseInt(k.slice(1),10)-1, row = a[k];
    if(!(i>=0 && i<N) || !row || typeof row!=="object") continue;
    if(validPick(i,row.pick)) ans[i]=row.pick;
    if(Array.isArray(row.tries)) tries[i]=row.tries.filter(t=>t&&validPick(i,t.pick)).map(t=>({pick:t.pick, ok:t.pick===QUESTIONS[i].a, at:String(t.at||"")})).slice(-10);
    else if(ans[i]!==null) tries[i]=[{pick:ans[i], ok:ans[i]===QUESTIONS[i].a, at:""}];
    if(Array.isArray(row.strikes)) strikes[i]=row.strikes.filter(x=>validPick(i,x));
  }
  history = Array.isArray(d.history) ? d.history.slice(-20) : [];
  const first = ans.findIndex(x=>x===null); cur = first<0 ? N-1 : first;
}
function lsLoad(){ try{ return JSON.parse(localStorage.getItem(LS_KEY)||"null"); }catch(e){ return null; } }
function lsSave(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(bodyOf())); }catch(e){} }
async function persist(){
  lsSave();
  if(!db || !uid) return;
  dirty = true; if(writing) return; writing = true;
  while(dirty){
    dirty = false;
    setSave("Saving…");
    try{ await db.doc("attempts/"+uid).set(bodyOf()); setSave("Progress saved to your account.","ok"); }
    catch(e){
      if(e && e.code==="invalid_argument"){ db=null; setSave("Progress saves in this browser only.","bad"); break; }
      setSave("Could not save to your account. Progress saves in this browser.","bad");
    }
  }
  writing = false;
}
async function connect(){
  try{
    if(!window.claude || !window.claude.use) return;
    const [u, d] = await Promise.all([window.claude.use("user"), window.claude.use("db")]);
    if(!u || !d) return;
    const id = await u.id(); if(!id) return;
    db = d; uid = id;
    const snap = await db.doc("attempts/"+uid).get();
    if(snap.exists){ applySaved(snap.data()); render(); setSave("Progress saved to your account.","ok"); }
    else if(answered() || tries.some(t=>t.length)){ persist(); }
    else setSave("Progress saves to your account.","ok");
  }catch(e){ /* keep local-only mode */ }
}

function render(top=true){ renderHeader(); showResults?renderResults():renderQ(); if(top) window.scrollTo({top:0}); }
applySaved(lsLoad());
render();
connect();
</script>

</body></html>
