<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Week 2 Question Bank</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Source+Sans+3:wght@400;600;700&display=swap">
<style>
/* Differential quiz page. Matches the site: teal accent, Bricolage Grotesque for display, Source Sans 3 for reading. */
:root{
  --bg:#f6f9f8;--paper:#ffffff;--ink:#0f2624;--muted:#3d5452;--faint:#7f9895;--line:#d9e5e3;
  --accent:#0e7c7b;--deep:#0a5f5e;--soft:#e7f1f0;
  --ok:#1d7a46;--okw:#e7f4ec;--bad:#b42318;--badw:#fcecea;--tick:#dde8e6;
  --display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --body:"Source Sans 3","Segoe UI",system-ui,-apple-system,sans-serif;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1716;--paper:#142120;--ink:#ecf4f3;--muted:#c7d8d5;--faint:#7f9895;--line:#24413e;
  --accent:#4fc1b8;--deep:#82d8d0;--soft:#18302e;
  --ok:#5ccf8f;--okw:#13301f;--bad:#f2877c;--badw:#3a1c1a;--tick:#22403c;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1716;--paper:#142120;--ink:#ecf4f3;--muted:#c7d8d5;--faint:#7f9895;--line:#24413e;
  --accent:#4fc1b8;--deep:#82d8d0;--soft:#18302e;
  --ok:#5ccf8f;--okw:#13301f;--bad:#f2877c;--badw:#3a1c1a;--tick:#22403c;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55}
.wrap{max-width:820px;margin:0 auto;padding-block:28px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:20px}

/* Header */
header{display:flex;flex-direction:column;gap:10px}
.context{margin:0;color:var(--faint);font-size:14px;font-weight:600}
h1{font-family:var(--display);font-weight:700;font-size:clamp(28px,5vw,40px);line-height:1.05;letter-spacing:-.02em;margin:0;text-wrap:balance}
.stats{display:flex;flex-wrap:wrap;gap:6px 22px;font-size:15px;color:var(--muted);font-variant-numeric:tabular-nums}
.stats b{color:var(--ink);font-weight:700}
.bar{height:6px;border-radius:999px;background:var(--tick);overflow:hidden}
.bar span{display:block;height:100%;width:0;background:var(--accent);border-radius:999px;transition:width .25s ease}
.map summary{cursor:pointer;color:var(--accent);font-weight:600;font-size:14px;width:max-content;list-style:none;padding:2px 0}
.map summary::-webkit-details-marker{display:none}
.map summary::before{content:"▸";display:inline-block;margin-right:6px;transition:transform .15s ease}
.map[open] summary::before{transform:rotate(90deg)}
.map summary:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:4px}
.ticks{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}
.tick{width:14px;height:14px;border:0;border-radius:4px;background:var(--tick);padding:0;cursor:pointer}
.tick:hover{background:var(--faint)}
.tick.ok{background:var(--ok)}.tick.bad{background:var(--bad)}
.tick.cur{outline:2px solid var(--accent);outline-offset:2px}
.tick.redo{box-shadow:inset 0 -3px 0 var(--accent)}
.tick:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.save{font-size:13px;color:var(--faint)}
.save.ok{color:var(--ok)}.save.bad{color:var(--bad)}

/* Question card */
.card{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:26px;display:flex;flex-direction:column;gap:18px}
.chead{display:flex;justify-content:space-between;align-items:center;gap:10px}
.tag{font-size:13px;font-weight:700;color:var(--accent);background:var(--soft);padding:4px 11px;border-radius:999px}
.qn{font-family:var(--display);font-weight:700;font-size:15px;color:var(--faint);font-variant-numeric:tabular-nums}
.stem{font-size:18.5px;line-height:1.6;margin:0;white-space:pre-line;max-width:70ch}
.hint{font-size:13px;color:var(--faint)}
.tries{font-size:13px;color:var(--muted)}
.tries .bad{color:var(--bad);font-weight:600}.tries .ok{color:var(--ok);font-weight:600}

/* Options */
.opts{display:flex;flex-direction:column;gap:10px}
.optrow{display:flex;gap:8px;align-items:stretch}
.optrow .opt{flex:1;min-width:0}
.opt{display:flex;gap:14px;align-items:center;text-align:left;width:100%;background:var(--paper);color:var(--ink);border:1.5px solid var(--line);border-radius:var(--r);padding:12px 16px;font:inherit;font-size:16.5px;line-height:1.45;cursor:pointer;transition:border-color .12s ease,background .12s ease}
.opt:hover:not(:disabled){border-color:var(--accent);background:var(--soft)}
.opt:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.opt:disabled{cursor:default}
.opt .k{flex:none;display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--soft);color:var(--accent);font-family:var(--display);font-weight:700;font-size:14px}
.opt.right{border-color:var(--ok);background:var(--okw)}
.opt.right .k{background:var(--ok);color:var(--paper)}
.opt.wrong{border-color:var(--bad);background:var(--badw)}
.opt.wrong .k{background:var(--bad);color:var(--paper)}
.strike{flex:none;width:44px;border:1.5px solid var(--line);border-radius:var(--r);background:var(--paper);color:var(--faint);font-size:14px;cursor:pointer;display:grid;place-items:center}
.strike:hover{border-color:var(--accent);color:var(--accent)}
.strike:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.strike[aria-pressed="true"]{background:var(--soft);color:var(--ink)}
.optrow.struck .opt > span:last-child{text-decoration:line-through;color:var(--faint)}
.optrow.struck .opt .k{opacity:.45}

/* Feedback */
.fb{background:var(--bg);border-radius:var(--r);padding:18px 20px;display:flex;flex-direction:column;gap:10px}
.verdict{font-family:var(--display);font-weight:700;font-size:18px;display:flex;align-items:center;gap:8px}
.verdict::before{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;font-size:13px;color:var(--paper)}
.verdict.ok{color:var(--ok)}.verdict.ok::before{content:"✓";background:var(--ok)}
.verdict.bad{color:var(--bad)}.verdict.bad::before{content:"✕";background:var(--bad)}
.fb p{margin:0;max-width:72ch}
.fb .why,.fb .alt{display:flex;gap:10px;align-items:baseline}
.fb .why{font-weight:600}
.lk{flex:none;display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--line);color:var(--muted);font-family:var(--display);font-weight:700;font-size:12px;transform:translateY(-1px)}
.lk.ok{background:var(--ok);color:var(--paper)}
.fb .alt{color:var(--muted)}
.fb .take{border-left:3px solid var(--accent);padding:2px 0 2px 12px;color:var(--ink)}
.fb .take b{color:var(--accent)}
.obj{font-size:13.5px;color:var(--faint);line-height:1.5}
.obj b{color:var(--muted)}
.fbtools{display:flex;justify-content:flex-end}

/* Buttons */
.nav{display:flex;justify-content:space-between;gap:10px}
.btn{font-family:var(--display);font-weight:700;font-size:15px;padding:10px 20px;border:1.5px solid var(--accent);border-radius:999px;background:var(--accent);color:var(--paper);cursor:pointer}
.btn:hover:not(:disabled){background:var(--deep);border-color:var(--deep)}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.ghost:hover:not(:disabled){background:var(--soft);color:var(--accent);border-color:var(--accent)}
.btn:disabled{opacity:.35;cursor:default}
.btn:focus-visible{outline:2px solid var(--ink);outline-offset:3px}

/* Results */
.big{font-family:var(--display);font-size:clamp(48px,9vw,72px);font-weight:700;line-height:1;letter-spacing:-.03em;color:var(--accent);font-variant-numeric:tabular-nums}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
td,th{text-align:left;padding:9px 0;border-bottom:1px solid var(--line);font-size:15px;vertical-align:middle}
th{font-size:13px;font-weight:700;color:var(--faint)}
td:last-child,th:last-child{text-align:right;white-space:nowrap;padding-left:12px}
.meter{display:block;height:5px;border-radius:999px;background:var(--tick);margin-top:6px;max-width:320px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent);border-radius:999px}
h2{font-family:var(--display);font-size:21px;font-weight:700;margin:6px 0 0}
h3{font-size:14px;font-weight:700;color:var(--faint);margin:6px 0 0}
.miss{margin:0;padding-left:0;list-style:none;display:flex;flex-direction:column;gap:8px;font-size:15px}
.miss code{font-family:var(--display);font-weight:700;font-size:13px;color:var(--bad);background:var(--badw);padding:1px 7px;border-radius:999px;margin-right:8px}

@media (max-width:560px){.card{padding:18px;border-radius:14px}.stem{font-size:17.5px}.opt{padding:11px 12px;gap:10px}.strike{width:40px}}
@media (prefers-reduced-motion:no-preference){.fb{animation:in .2s ease-out}@keyframes in{from{opacity:.3;transform:translateY(4px)}to{opacity:1;transform:none}}}
@media (prefers-reduced-motion:reduce){.bar span,.opt,.map summary::before{transition:none}}
</style>

<script>
const QUESTIONS = [{"c": "Biomolecules", "p": "Cells build four classes of organic macromolecules from smaller subunits. Which item below is a macromolecule and not one of those subunits?", "o": ["Nucleotide", "Protein", "Amino acid", "Fatty acid", "Monosaccharide"], "a": 1, "e": "Correct: B. A protein is a polymer of amino acids. The four organic macromolecule classes are carbohydrates, proteins, lipids and nucleic acids.\nA: Nucleotides are the subunits of nucleic acids. It would be correct if the question asked for the building block of DNA or RNA.\nC: Amino acids are the subunits of proteins. It would be correct if the question asked for the building block of a protein.\nD: Fatty acids are small molecules that serve as components of many lipids. It would be correct if the question asked for a micromolecule that builds lipids.\nE: Monosaccharides are the subunits of carbohydrates. It would be correct if the question asked for the building block of a polysaccharide.\nClues: \"not one of those subunits\" points to Look for the assembled class member, not its building block. \"four classes of organic macromolecules\" points to Carbohydrates, proteins, lipids and nucleic acids.", "l": []}, {"c": "Biomolecules", "p": "A reaction proceeds on its own but slowly. A cell adds an enzyme and the reaction speeds up. Which statement best explains what the enzyme does?", "o": ["It lowers the activation energy of the reaction.", "It supplies the energy needed to reach the transition state.", "It changes the end products so the reaction proceeds in a new direction.", "It is used up as the reaction proceeds."], "a": 0, "e": "Correct: A. Enzymes lower the activation energy. They do not change the reactants, the end products or the direction of a spontaneous reaction.\nB: Enzymes do not supply energy. This would describe coupling to ATP hydrolysis in a reaction that is not spontaneous.\nC: Enzymes leave the reactants and end products unchanged. A change in products would mean a different reaction.\nD: Enzymes are reusable. Substrates are the molecules consumed.\nClues: \"proceeds on its own but slowly\" points to A spontaneous reaction with a high barrier. An enzyme lowers the barrier. \"speeds up\" points to Rate changes, but the products do not.", "l": []}, {"c": "Histology basics", "p": "In an H&E section, nuclei stain blue-purple and much of the cytoplasm stains pink. Which statement explains the staining?", "o": ["Hematoxylin is basic and binds basic structures. Eosin is acidic and binds acidic structures.", "Hematoxylin and eosin are both basic dyes that differ only in colour.", "Hematoxylin is acidic and binds basic structures. Eosin is basic and binds acidic structures.", "Hematoxylin is basic and binds acidic structures such as nucleic acids. Eosin is acidic and binds basic structures such as many cytoplasmic proteins."], "a": 3, "e": "Correct: D. Each dye binds structures of the opposite charge. Nucleic acids are acidic, so they take up the basic dye hematoxylin and appear blue.\nA: Dyes bind structures of opposite charge, not like charge.\nB: The two dyes have opposite charges, which is why they stain different structures.\nC: The dye charges are reversed. This would be correct only if nuclei were basic, which they are not.\nClues: \"nuclei stain blue-purple\" points to Acidic nucleic acids bind the basic dye hematoxylin. \"cytoplasm stains pink\" points to Basic proteins bind the acidic dye eosin.", "l": []}, {"c": "Cell biology", "p": "Which cell specialization is NOT possible?", "o": ["A B cell expands its rough endoplasmic reticulum to make large amounts of antibody.", "A lens fibre cell loses its nucleus so light passes without disruption.", "An intestinal epithelial cell forms microvilli to increase its absorptive surface area.", "Skeletal muscle cells fuse to form large multinucleated fibres.", "A cell keeps permanently open pores in its surface so that small and large molecules pass freely."], "a": 4, "e": "Correct: E. Correct, because this is not possible. Constantly open pores destroy the integrity of the cytoplasm and the cell dies. Cells use channels that selectively regulate passage instead.\nA: This is possible, so it is not the answer. Cells that secrete large amounts of protein have extensive rough ER. It would be the answer only if it said such cells lose their ER.\nB: This is possible, so it is not the answer. Lens fibre cells lose their nuclei.\nC: This is possible, so it is not the answer. Microvilli increase surface area for absorption.\nD: This is possible, so it is not the answer. Skeletal muscle fibres are multinucleated cells.\nClues: \"NOT possible\" points to The true statements are the distractors. \"permanently open pores\" points to A cell needs selective control of what crosses its membrane.", "l": []}, {"c": "Evidence-based medicine", "p": "Which statement best describes evidence-based medicine (EBM)?", "o": ["Clinicians give every patient the same treatment regardless of preference.", "Clinicians follow expert opinion first and use evidence only when experts disagree.", "Clinicians integrate the best available evidence with clinical expertise and patient values and preferences.", "Clinicians use scientific evidence exclusively and set aside clinical judgment."], "a": 2, "e": "Correct: C. EBM combines evidence, expertise and patient values. It also aims to reduce unwarranted variation in care.\nA: EBM reduces unwarranted variation but still incorporates patient preferences.\nB: Expert opinion is the lowest tier of evidence. This would describe opinion-based practice.\nD: EBM does not exclude judgment. This would describe a rigid protocol approach.\nClues: \"best available evidence\" points to EBM uses the best evidence, not evidence exclusively. \"patient values and preferences\" points to Patient preferences are part of the decision.", "l": []}, {"c": "Evidence-based medicine", "p": "You search for randomized trials of mRNA vaccination in children, compared with placebo, that measure symptomatic infection. In the PICO framework, which letter matches 'placebo'?", "o": ["P", "I", "C", "O"], "a": 2, "e": "Correct: C. C is the comparator or control, here placebo.\nA: P is the population, here children. It would be correct if the question asked about 'children'.\nB: I is the intervention, here mRNA vaccination. It would be correct if the question asked about 'mRNA vaccination'.\nD: O is the outcome, here symptomatic infection. It would be correct if the question asked about 'symptomatic infection'.\nClues: \"compared with placebo\" points to The comparison group is the comparator.", "l": []}, {"c": "Evidence-based medicine", "p": "In 2026, investigators review company personnel files from 1990 to 2015 to score employees' asbestos exposure by work location and duration. They then use tumour registries to find who developed mesothelioma. They did not assign exposure. Which design is this?", "o": ["Randomized controlled trial", "Case-control", "Cross-sectional", "Prospective cohort", "Retrospective cohort"], "a": 4, "e": "Correct: E. Exposure was not assigned, so the design is observational. Groups were defined by exposure, so it is a cohort. Records from the past were used, so it is retrospective.\nA: An RCT assigns exposure by randomization. It would be correct if the investigators had allocated exposure.\nB: A case-control study starts with people who have the outcome and compares their past exposure with controls. It would be correct if the investigators had started with patients who had mesothelioma.\nC: A cross-sectional study measures exposure and outcome at one point in time. It would be correct if a single survey measured both.\nD: A prospective cohort enrols people now and follows them forward. It would be correct if the investigators had started in 2026 and waited for outcomes.\nClues: \"did not assign exposure\" points to Observational design. \"score employees' exposure ... then find who developed\" points to Exposure first, outcome second. This is a cohort. \"personnel files from 1990 to 2015\" points to Past records make it retrospective.", "l": []}, {"c": "Evidence-based medicine", "p": "Which statement about trial design is correct?", "o": ["A larger sample size removes confounding.", "Blinding reduces confounding by unknown factors. Randomization reduces bias in outcome assessment.", "Matching balances known and unknown confounders equally.", "Randomization reduces confounding by known and unknown factors. Blinding reduces bias in outcome assessment and reporting."], "a": 3, "e": "Correct: D. Randomization is the technique that attempts to balance both known and unknown confounders across groups. Blinding limits knowledge of allocation, which reduces bias.\nA: A larger sample improves precision but does not remove confounding.\nB: The roles are swapped. It would be correct if the two terms were exchanged.\nC: Matching addresses only confounders you know and measure.\nClues: \"known and unknown\" points to Only randomization balances unknown confounders.", "l": []}, {"c": "Evidence-based medicine", "p": "A large trial reports that a drug lowers systolic blood pressure by 1 mmHg with p = 0.03. The alpha level was 0.05. Which conclusion is best?", "o": ["The result is statistically significant, but that does not show the effect is clinically significant.", "You fail to reject the null hypothesis because p is below alpha.", "The result should change practice because p is below 0.05.", "There is a 3 percent probability that the null hypothesis is true."], "a": 0, "e": "Correct: A. A p-value below alpha means you reject the null hypothesis. A 1 mmHg change is unlikely to matter to patients, so statistical significance does not equal clinical significance.\nB: A p-value below alpha leads to rejecting the null. Failing to reject applies when p is above alpha.\nC: Practice change depends on effect size, harms, cost and patient values. It would be correct only if the effect were also clinically meaningful.\nD: A p-value is the probability of data at least as extreme as observed if the null hypothesis is true. It is not the probability that the null hypothesis is true.\nClues: \"1 mmHg\" points to A tiny effect size. Statistical significance does not guarantee clinical value. \"p = 0.03, alpha 0.05\" points to Below alpha means reject the null.", "l": []}, {"c": "Epithelia", "p": "Epithelial cells lining the gut must stop fluid from leaking between neighbouring cells. Cardiac muscle cells must pass electrical signals directly to their neighbours. Which pairing of junction types is correct?", "o": ["Hemidesmosome, then tight junction", "Tight junction, then gap junction", "Desmosome, then adherens junction", "Gap junction, then tight junction"], "a": 1, "e": "Correct: B. Tight junctions seal the space between cells to form a barrier. Gap junctions connect cytoplasm and carry electrical signals for synchronized contraction.\nA: Hemidesmosomes anchor epithelial cells to the basement membrane, not to neighbouring cells.\nC: Both give mechanical attachment. Desmosomes resist shear through intermediate filaments and adherens junctions link actin. It would be correct for a question about mechanical strength.\nD: The functions are reversed. It would be correct if the barrier role belonged to gap junctions.\nClues: \"stop fluid from leaking between neighbouring cells\" points to Barrier function belongs to tight junctions. \"pass electrical signals directly\" points to Communication belongs to gap junctions.", "l": []}, {"c": "Epithelia", "p": "Which statement about epithelial tissue is FALSE?", "o": ["Epithelium forms a selective barrier.", "Epithelium lacks innervation.", "Epithelial cells are polar, with distinct apical and basal surfaces.", "Epithelium is avascular and receives nutrients by diffusion from underlying connective tissue."], "a": 1, "e": "Correct: B. Correct, because this statement is false. Epithelial tissue is innervated.\nA: This is true, so it is not the answer. It would be false if it said epithelium lets everything pass.\nC: This is true, so it is not the answer. It would be false if it said the surfaces are identical.\nD: This is true, so it is not the answer. It would be false if it said epithelium has its own blood vessels.\nClues: \"FALSE\" points to True statements are the distractors.", "l": []}, {"c": "Connective tissue", "p": "Which statement about connective tissue is correct?", "o": ["Dense connective tissue is typically enriched in elastic fibres.", "Marfan syndrome is typically rooted in collagen gene mutations.", "Fibroblasts synthesize collagen but not elastin.", "All connective tissues are built from cells, fibres and non-fibre components in different proportions."], "a": 3, "e": "Correct: D. Dense regular connective tissue is packed with fibres and has few cells. Other types have more cells or more ground substance.\nA: Dense connective tissue is typically enriched in collagen. Elastic fibres dominate specialized tissues such as the aorta and skin.\nB: Marfan syndrome is commonly rooted in fibrillin gene mutations. Ehlers-Danlos syndrome is the one linked to collagen genes.\nC: Fibroblasts synthesize and secrete both collagen and elastin.\nClues: \"all connective tissues\" points to A universal statement must hold for every type, and only the three-component statement does. \"Marfan\" points to Fibrillin, not collagen.", "l": []}, {"c": "Cartilage", "p": "Which pairing of cartilage type and location is correct?", "o": ["Hyaline cartilage: epiglottis", "Hyaline cartilage: intervertebral discs and menisci", "Elastic cartilage: epiglottis, larynx and external ear", "Fibrocartilage: growth plates and ribs"], "a": 2, "e": "Correct: C. Elastic cartilage is enriched in the same type of elastic fibre found in the aorta.\nA: The epiglottis contains elastic cartilage. Hyaline would be correct for the respiratory tract cartilages such as the trachea.\nB: Discs and menisci contain fibrocartilage. Hyaline would be correct for growth plates and ribs.\nD: Growth plates and ribs contain hyaline cartilage. Fibrocartilage would be correct for discs and menisci.\nClues: \"epiglottis, larynx and external ear\" points to Flexible structures rich in elastic fibres.", "l": []}, {"c": "Bone", "p": "Which pairing correctly identifies the cell that secretes osteoid and the cell that resorbs mineralized bone?", "o": ["Osteoblast secretes osteoid. Osteoclast resorbs bone.", "Osteoprogenitor secretes osteoid. Osteocyte resorbs bone.", "Osteocyte secretes osteoid. Osteoblast resorbs bone.", "Osteoclast secretes osteoid. Osteoblast resorbs bone."], "a": 0, "e": "Correct: A. Osteoblasts secrete osteoid. Osteoclasts are multinucleated cells derived from monocytes that resorb bone.\nB: Osteoprogenitors are stem cells that give rise to osteoblasts. Osteocytes do not resorb bone.\nC: Osteocytes are mature cells embedded in bone that maintain the matrix. Osteoblasts make osteoid.\nD: The roles are reversed. It would be correct if the cell names were swapped.\nClues: \"secretes osteoid\" points to Osteoblast. \"resorbs mineralized bone\" points to Multinucleated osteoclast derived from monocytes.", "l": []}, {"c": "Muscle", "p": "During contraction of a skeletal muscle fibre, which sarcomere component does NOT shorten?", "o": ["Distance between adjacent Z-lines", "H-zone", "I-band", "A-band"], "a": 3, "e": "Correct: D. The A-band is the length of the thick filaments, which does not change.\nA: This distance is the sarcomere, and it shortens during contraction.\nB: The H-zone, the central region with only thick filaments, shortens as thin filaments approach. It would be correct if the question asked what shortens.\nC: The I-band, which contains only thin filaments, shortens as thin filaments slide inward. It would be correct if the question asked what shortens.\nClues: \"does NOT shorten\" points to Only the thick filament span stays constant.", "l": []}, {"c": "Muscle", "p": "After acetylcholine binds nicotinic receptors on the motor end plate, which sequence of events leads to muscle contraction?", "o": ["End plate potential, then calcium binding to troponin, then calcium release from the sarcoplasmic reticulum, then T-tubule depolarization, then myosin attachment to actin", "End plate potential, then muscle action potential spreads along the sarcolemma and down T-tubules, then calcium release from the sarcoplasmic reticulum, then calcium binding to troponin, then myosin attachment to actin", "End plate potential, then T-tubule depolarization, then myosin attachment to actin, then calcium release, then calcium binding to troponin", "Calcium release from the sarcoplasmic reticulum, then end plate potential, then T-tubule depolarization, then calcium binding to troponin, then myosin attachment to actin"], "a": 1, "e": "Correct: B. This follows the signal path from the end plate to the contractile proteins.\nA: Calcium must be released before it binds troponin.\nC: Myosin attaches only after calcium binds troponin and exposes the binding sites.\nD: Calcium release does not come first because the end plate potential and T-tubule signal trigger it.\nClues: \"After acetylcholine binds\" points to The sequence begins at the end plate. \"contraction\" points to Cross-bridge formation comes last.", "l": []}, {"c": "Muscle", "p": "Which statement about skeletal muscle contraction and relaxation is correct?", "o": ["Calcium is released from T-tubules during contraction.", "Calcium binds tropomyosin, which makes troponin roll off actin.", "Relaxation occurs when calcium diffuses passively back into the sarcoplasmic reticulum.", "Contraction occurs because thin and thick filaments shorten.", "Calcium binds troponin, which moves tropomyosin off the myosin-binding sites on actin."], "a": 4, "e": "Correct: E. Troponin is the calcium sensor. Its shift moves tropomyosin and exposes the binding sites.\nA: Calcium is released from the sarcoplasmic reticulum. T-tubules carry the depolarization.\nB: The proteins are swapped. Calcium binds troponin.\nC: Calcium returns by an active pump, the calcium ATPase, which uses ATP.\nD: Filaments slide past one another. Their length does not change.\nClues: \"moves tropomyosin\" points to Troponin shifts tropomyosin, not the reverse. \"passively\" points to Reuptake is active and needs ATP.", "l": []}, {"c": "Nervous tissue", "p": "Which statement about glial cells and myelination is correct?", "o": ["Schwann cells myelinate axons in both the CNS and the PNS.", "Astrocytes form the ciliated lining of the ventricles and spinal canal.", "One Schwann cell myelinates segments of several axons.", "Microglia are the myelinating cells of the CNS.", "One oligodendrocyte myelinates segments of several axons in the CNS."], "a": 4, "e": "Correct: E. Oligodendrocytes myelinate CNS axons and each cell serves several axons.\nA: Schwann cells myelinate PNS axons only. This would be correct for oligodendrocytes and the CNS.\nB: Ependymal cells form that ciliated lining. Astrocytes form a scaffold, bridge axons and blood vessels and support the blood brain barrier.\nC: A Schwann cell myelinates one segment of a single axon.\nD: Microglia are phagocytic cells that activate after CNS injury.\nClues: \"several axons\" points to A hallmark of oligodendrocytes. \"ciliated lining\" points to Ependymal cells.", "l": []}, {"c": "Nervous tissue", "p": "Which statement about neuronal structure and transport is correct?", "o": ["Nissl bodies are stacks of rough endoplasmic reticulum in neuronal cell bodies.", "Synaptic vesicles travel to the terminal bouton along intermediate filaments.", "Nissl bodies are stacks of mitochondria.", "Schmidt-Lantermann clefts are the gaps where the action potential is regenerated."], "a": 0, "e": "Correct: A. Nissl bodies reflect the heavy protein synthesis in neurons.\nB: Vesicles travel along microtubules using motor proteins.\nC: Mitochondria are separate organelles. This would describe a mitochondrial cluster.\nD: Those gaps are the nodes of Ranvier. Schmidt-Lantermann clefts are cytoplasmic channels in the myelin sheath that contain gap junctions.\nClues: \"Nissl bodies\" points to Rough endoplasmic reticulum. \"travel ... along\" points to Motor proteins use microtubules.", "l": []}, {"c": "Nervous tissue", "p": "A patient with multiple sclerosis has slowed conduction in affected central pathways. Which explanation is best?", "o": ["The immune system attacks Schwann cells in peripheral nerves.", "Loss of myelin prevents the release of neurotransmitter at the terminal.", "Loss of myelin removes saltatory conduction and lets current leak across the axon membrane.", "Loss of myelin increases membrane resistance."], "a": 2, "e": "Correct: C. Myelin raises membrane resistance and lets the signal jump between nodes. Without it, conduction slows and weakens.\nA: In multiple sclerosis the immune system attacks oligodendrocytes, so central axons are affected.\nB: Myelin does not control neurotransmitter release.\nD: Myelin increases membrane resistance, so losing it decreases resistance.\nClues: \"multiple sclerosis\" points to Oligodendrocytes and CNS myelin. \"slowed conduction\" points to Loss of saltatory conduction.", "l": []}, {"c": "Nervous system", "p": "Classify these four signals in order: pain from the skin, a stomach ache, an efferent signal to gluteus maximus, and an efferent signal to a gland. Which option is correct?", "o": ["Visceral sensory, somatosensory, autonomic motor, somatic motor", "Somatosensory, visceral sensory, somatic motor, autonomic motor", "Somatic motor, autonomic motor, somatosensory, visceral sensory", "Somatosensory, somatosensory, somatic motor, somatic motor"], "a": 1, "e": "Correct: B. Skin pain is somatosensory. A stomach ache comes from an organ, so it is visceral sensory. Skeletal muscle is served by somatic motor neurons. Glands are served by autonomic motor neurons.\nA: The categories are swapped. It would fit if the pain came from an organ and the motor targets were reversed.\nC: Sensory and motor categories are mixed up.\nD: Organ sensation and gland control use the visceral and autonomic categories.\nClues: \"stomach ache\" points to Organ sensation is visceral sensory. \"gland\" points to Autonomic motor output.", "l": []}, {"c": "Homeostasis", "p": "An 80 kg adult has total body water equal to 60 percent of body weight. Using the standard fractions, which set of volumes is correct?", "o": ["ICF 32 L, ECF 16 L, plasma 12 L", "ICF 48 L, ECF 16 L, plasma 4 L", "ICF 16 L, ECF 32 L, plasma 8 L", "ICF 32 L, ECF 16 L, plasma 4 L"], "a": 3, "e": "Correct: D. Total body water is 48 L. ICF is two thirds, so 32 L. ECF is one third, so 16 L. Plasma is one quarter of ECF, so 4 L.\nA: Twelve litres is the interstitial fluid, three quarters of ECF. Plasma is one quarter.\nB: This treats all body water as ICF. Total body water of 48 L is split into ICF and ECF.\nC: The ICF and ECF fractions are swapped. It would be correct if ECF held two thirds of body water.\nClues: \"60 percent of body weight\" points to Start from total body water. \"standard fractions\" points to Two thirds ICF, one third ECF, one quarter of ECF as plasma.", "l": []}, {"c": "Homeostasis", "p": "A person drinks 2 L of distilled water. After osmotic equilibrium but before the kidneys respond, what happens to the fluid compartments?", "o": ["ECF and ICF volumes both increase and the osmolality of both decreases.", "ECF volume increases, ICF volume decreases and osmolality of both increases.", "ECF volume increases with no change in osmolality and ICF is unchanged.", "ECF and ICF volumes both decrease and osmolality of both increases."], "a": 0, "e": "Correct: A. Distilled water is hypotonic to body fluids. Total body water rises and osmolality falls. Water then moves into cells until both compartments match.\nB: This is the response to salt loading, such as eating salty chips without water.\nC: This is the response to drinking an isotonic solution.\nD: This is the response to dehydration.\nClues: \"distilled water\" points to Hypotonic, with no solute. \"before the kidneys respond\" points to Ask for the equilibrium response only.", "l": []}, {"c": "Membrane transport", "p": "The renal SGLT transporter moves sodium and glucose into a cell in the same direction. Which classification is correct?", "o": ["Primary active transport, because it binds ATP directly", "Facilitated diffusion, because glucose moves down its gradient with no energy", "Secondary active transport, powered by the sodium gradient that the Na-K ATPase maintains", "Antiport carrier, because two solutes cross together"], "a": 2, "e": "Correct: C. SGLT is a symporter that does not use ATP directly. It depends on the sodium gradient built by the primary active Na-K ATPase.\nA: Primary active transporters such as the Na-K ATPase use ATP directly. SGLT does not.\nB: Sodium moves with its gradient, and glucose is pulled in against its gradient by coupling. Facilitated diffusion has no coupling to an ion gradient.\nD: Antiporters move solutes in opposite directions. SGLT moves both in the same direction, so it is a symporter.\nClues: \"same direction\" points to Symport, not antiport. \"sodium and glucose\" points to Sodium gradient drives glucose uptake.", "l": []}, {"c": "Cell signaling", "p": "Somatostatin from D cells acts on neighbouring G cells. Gastrin from G cells travels through the blood to act on cells elsewhere in the stomach. Histamine acts on nearby cells. Which classification is correct, in that order?", "o": ["Endocrine, autocrine, paracrine", "Paracrine, paracrine, paracrine", "Autocrine, paracrine, endocrine", "Paracrine, endocrine, paracrine"], "a": 3, "e": "Correct: D. Local action on nearby targets is paracrine. Gastrin uses the circulation to reach distant targets, so it is endocrine.\nA: Somatostatin acts locally, not through the blood.\nB: Gastrin travels through the circulation, which makes it endocrine.\nC: Autocrine signals target the cell that released them. Somatostatin acts on a neighbouring cell.\nClues: \"neighbouring G cells\" points to Local target, paracrine. \"through the blood\" points to Long distance, endocrine.", "l": []}, {"c": "Genetics", "p": "A father is diagnosed with Huntington disease at age 42 and his son at age 31. In a different family, a mutated collagen alpha chain disrupts the orderly coiling of the normal chains. Which two phenomena do these describe, in order?", "o": ["Incomplete penetrance, then dominant negative effect", "Reduced expressivity, then gain of function", "Anticipation, then dominant negative effect", "Anticipation, then loss of function"], "a": 2, "e": "Correct: C. Earlier onset in each generation is anticipation. A mutant chain that disrupts the function of normal chains is a dominant negative effect.\nA: Incomplete penetrance means some carriers never develop disease. Both patients here have the disease, with earlier onset in the son.\nB: Neither example describes milder symptoms, and the collagen case describes interference, not a new function.\nD: Loss of function means the mutant allele makes no working product. Here the mutant chain interferes with normal chains.\nClues: \"42 ... son at age 31\" points to Earlier onset in the next generation. \"disrupts the orderly coiling of the normal chains\" points to The mutant product interferes with the normal product.", "l": []}, {"c": "Membrane potential", "p": "Which statement about ion movement and membrane potential is correct?", "o": ["Na+ entry and Ca2+ entry depolarize the membrane. K+ exit and Cl- entry hyperpolarize it.", "K+ exit depolarizes the membrane and Na+ entry hyperpolarizes it.", "The resting membrane potential reflects only potassium movement, so it equals the K+ equilibrium potential.", "Cl- entry depolarizes the membrane and Ca2+ entry hyperpolarizes it."], "a": 0, "e": "Correct: A. Positive charge entering depolarizes. Positive charge leaving or negative charge entering hyperpolarizes.\nB: The effects are reversed. K+ leaving removes positive charge.\nC: The resting potential of about -70 mV also reflects other ions. The K+ equilibrium potential is closer to -90 mV.\nD: Cl- entry adds negative charge and Ca2+ entry adds positive charge.\nClues: \"ion movement and membrane potential\" points to Track charge direction. \"only potassium\" points to The resting potential reflects several ions.", "l": []}, {"c": "Membrane potential", "p": "Which sequence correctly describes an action potential?", "o": ["Threshold reached, then K+ channels open first, then Na+ channels open, then hyperpolarization.", "Threshold reached, then voltage-gated Na+ channels open (depolarization), then Na+ channels inactivate as K+ channels open (repolarization), then K+ exit overshoots (hyperpolarization).", "Threshold reached, then depolarization, then hyperpolarization, then repolarization.", "The Na-K ATPase opens to cause the rising phase."], "a": 1, "e": "Correct: B. Sodium entry drives the rising phase. Sodium inactivation with potassium exit drives the falling phase. Slow closure of potassium channels produces the undershoot.\nA: Sodium channels open first and drive depolarization. Potassium channels open more slowly.\nC: Repolarization comes before the undershoot.\nD: The pump restores gradients over time. It does not cause the spike.\nClues: \"sequence\" points to Order matters: depolarization, repolarization, hyperpolarization. \"Na-K ATPase\" points to The pump maintains gradients and is not the cause of the spike.", "l": []}, {"c": "Membrane potential", "p": "A patient has a plasma potassium concentration of 7 mM (reference range 3.8 to 5.0 mM). Which change in neuronal excitability best fits?", "o": ["Excitability is unchanged because action potentials depend only on sodium.", "The membrane hyperpolarizes, so a stronger stimulus is needed.", "The resting potential moves closer to threshold, so a stimulus that is normally subthreshold might trigger an action potential.", "The neuron fires for every stimulus and never stops."], "a": 2, "e": "Correct: C. A higher extracellular K+ level reduces the gradient for K+ exit, so positive charge builds inside and the membrane depolarizes toward threshold. Hyperkalemia is life threatening because it disturbs cardiac excitability.\nA: Extracellular K+ shapes the resting potential and so affects excitability.\nB: This fits hypokalemia, where the K+ gradient for exit is larger.\nD: Refractory periods still limit firing, and the shift moves the membrane closer to threshold without removing threshold.\nClues: \"7 mM\" points to Above the upper limit of 5.0 mM, so hyperkalemia. \"neuronal excitability\" points to Think about the resting potential.", "l": []}, {"c": "Neuromuscular junction", "p": "In Lambert-Eaton myasthenic syndrome, antibodies attack voltage-gated calcium channels on the motor nerve terminal. Which is the most direct consequence at the neuromuscular junction?", "o": ["End plate potentials become larger.", "Nicotinic receptors on the end plate are blocked.", "The motor neuron fails to generate an action potential.", "Less acetylcholine is released."], "a": 3, "e": "Correct: D. Calcium entry triggers vesicle fusion. Fewer channels mean fewer vesicles fuse, so less acetylcholine is released and end plate potentials are smaller.\nA: Less acetylcholine gives smaller end plate potentials.\nB: The receptors are postsynaptic. The defect is presynaptic.\nC: The affected channels sit at the terminal, downstream of action potential generation.\nClues: \"calcium channels on the motor nerve terminal\" points to Presynaptic defect. \"most direct consequence\" points to Pick the first event affected.", "l": []}, {"c": "Organ systems", "p": "Excess interstitial fluid leaks from capillaries. Which system returns it to the circulation, and what is the fluid called once it enters that system's vessels?", "o": ["Lymphatic system, lymph", "Cardiovascular system, plasma", "Urinary system, filtrate", "Endocrine system, interstitial fluid"], "a": 0, "e": "Correct: A. Lymphatic vessels collect the surplus interstitial fluid and return it to the blood. Inside those vessels it is called lymph.\nB: Plasma is the fluid part of blood. Capillaries leak fluid but do not return the excess.\nC: The urinary system filters blood and forms urine. It does not drain interstitial fluid.\nD: The endocrine system regulates body function through hormones.\nClues: \"Excess interstitial fluid\" points to Lymphatic drainage. \"once it enters\" points to The fluid takes a new name inside lymphatic vessels.", "l": []}, {"c": "Anatomical language", "p": "In anatomical position, which statement is correct?", "o": ["The pelvis is superior to the skull.", "The elbow is distal to the wrist.", "The muscles are superficial to the skin.", "The heart is inferior to the diaphragm.", "The thumb is lateral to the index finger."], "a": 4, "e": "Correct: E. With palms facing forward, the thumb lies on the lateral side of the hand.\nA: The pelvis is inferior to the skull.\nB: The elbow is proximal to the wrist. Distal means farther from the point of attachment.\nC: Muscles are deep to the skin. Superficial means closer to the surface.\nD: The heart is superior to the diaphragm.\nClues: \"anatomical position\" points to Palms forward, so the thumb is on the lateral side.", "l": []}, {"c": "Anatomical language", "p": "Three planes divide the body. One passes from front to back and divides the body into left and right. One divides it into anterior and posterior. One divides it into superior and inferior. Which set names them in order?", "o": ["Transverse, coronal, sagittal", "Sagittal, coronal, transverse (axial)", "Coronal, sagittal, transverse", "Sagittal, transverse, coronal"], "a": 1, "e": "Correct: B. A sagittal plane gives left and right portions. A coronal plane gives front and back. A transverse plane gives upper and lower.\nA: The first and last are swapped.\nC: The first two are swapped.\nD: The last two are swapped.\nClues: \"left and right\" points to Sagittal. \"anterior and posterior\" points to Coronal. \"superior and inferior\" points to Transverse or axial.", "l": []}, {"c": "Anatomical language", "p": "Which set correctly names the position of a person doing push-ups, the elbow movement used to scratch the head, and the foot movement of pointing the toes down?", "o": ["Supine, flexion, plantarflexion", "Prone, flexion, plantarflexion", "Prone, extension, plantarflexion", "Supine, extension, dorsiflexion"], "a": 1, "e": "Correct: B. Face down is prone. Bending the elbow to bring the hand to the head is flexion. Pointing the toes down is plantarflexion.\nA: A person doing push-ups faces down, so the position is prone.\nC: Reaching the head needs elbow flexion, not extension.\nD: Supine means lying on the back. Extension straightens a joint and dorsiflexion pulls the toes up.\nClues: \"push-ups\" points to Face down is prone. \"scratch the head\" points to Decreasing the elbow angle is flexion.", "l": []}, {"c": "Study Design", "p": "In 2012, researchers want to study whether shift work increases risk of type 2 diabetes. They identify a group of nurses currently free of diabetes, record each nurse's shift pattern (day vs rotating night shift), and follow them forward for 15 years to see who develops diabetes. This design is best described as which of the following?", "o": ["Cross sectional", "Retrospective cohort", "Case-control", "Case series", "Prospective cohort"], "a": 4, "e": "Correct: E. The investigators did not assign shift pattern, so this is observational. Exposure status is known before outcomes occur and the cohort is followed forward in time from the present, so this is a prospective cohort design.", "l": []}, {"c": "Study Design", "p": "A study identifies 200 patients with pancreatic cancer and 200 similar patients without pancreatic cancer, then looks backward at each group's smoking history to compare exposure rates. This design is best described as which of the following?", "o": ["Cross sectional", "Prospective cohort", "Ecological study", "Randomized controlled trial", "Case-control"], "a": 4, "e": "Correct: E. Participants are selected based on outcome status (cancer vs no cancer) and exposure history is assessed retrospectively. Starting from outcome and looking back at exposure is the defining feature of a case-control study.", "l": []}, {"c": "Study Design", "p": "Which of the following best explains why double-blinding is used in a randomized controlled trial?", "o": ["It reduces observer and participant bias in outcome assessment", "It guarantees external validity", "It eliminates the need for a control group", "It balances known and unknown confounders between groups", "It increases statistical power"], "a": 0, "e": "Correct: A. Blinding prevents participants and assessors from knowing group assignment, which reduces performance and detection bias. Randomization, not blinding, is what balances confounders between groups.", "l": []}, {"c": "Study Design", "p": "In a cohort study of 1,000 exposed and 1,000 unexposed workers, 40 exposed and 10 unexposed workers develop a disease over the study period. What is the relative risk of disease in the exposed group compared to the unexposed group?", "o": ["0.25", "40", "4", "2.5", "0.4"], "a": 2, "e": "Correct: C. Risk in exposed = 40/1000 = 0.04. Risk in unexposed = 10/1000 = 0.01. Relative risk = 0.04/0.01 = 4. Cohort studies allow direct calculation of relative risk because incidence in each group is known.", "l": []}, {"c": "Gross Anatomy", "p": "A transverse (axial) cut is made through a patient's abdomen at the level of the umbilicus. This plane divides the body into which of the following?", "o": ["Left and right portions", "Anterior and posterior portions", "Medial and lateral portions", "Superior and inferior portions", "Proximal and distal portions"], "a": 3, "e": "Correct: D. A transverse plane is a horizontal plane that divides the body into upper (superior) and lower (inferior) portions, commonly used in CT and MRI cross-sections.", "l": []}, {"c": "Gross Anatomy", "p": "A patient is described as being in the anatomical position. Which of the following correctly describes this position?", "o": ["Standing upright with arms crossed over the chest", "Lying prone with arms at the sides", "Lying supine with palms facing down", "Standing upright, feet together, palms facing posteriorly", "Standing upright, feet apart, palms facing anteriorly"], "a": 4, "e": "Correct: E. Anatomical position is standing erect, face forward, feet together, arms at the sides, and palms facing forward (anteriorly). All directional terms are defined relative to this reference position.", "l": []}, {"c": "Gross Anatomy", "p": "Which pair of terms correctly describes the elbow's position relative to the wrist and the shoulder, respectively?", "o": ["Distal to the wrist, proximal to the shoulder", "Proximal to the wrist, distal to the shoulder", "Distal to both the wrist and shoulder", "Proximal to both the wrist and shoulder", "Medial to the wrist, lateral to the shoulder"], "a": 1, "e": "Correct: B. Proximal and distal describe position relative to the point of attachment of a limb to the trunk. The elbow is closer to the trunk than the wrist (proximal to the wrist) but farther from the trunk than the shoulder (distal to the shoulder).", "l": []}, {"c": "Gross Anatomy", "p": "A patient turns their palm from facing anterior to facing posterior by rotating the radius over the ulna. Which of the following best describes this forearm movement?", "o": ["Circumduction", "Flexion", "Supination", "Pronation", "Abduction"], "a": 3, "e": "Correct: D. Pronation is the rotation of the forearm that turns the palm from facing anteriorly to facing posteriorly, achieved by the radius crossing over the ulna. Supination is the reverse movement.", "l": []}, {"c": "Gross Anatomy", "p": "A swimmer raises both arms out to the sides, away from the midline of the body, until they are overhead. This movement is best described as which of the following?", "o": ["Rotation", "Pronation", "Abduction", "Extension", "Adduction"], "a": 2, "e": "Correct: C. Abduction is movement of a limb away from the midline of the body in the coronal plane. Adduction is the return movement toward the midline.", "l": []}, {"c": "Imaging", "p": "A radiologist reviews a scan in which bone appears bright white, air appears black, and soft tissues appear in shades of grey based on density, with no distinction of soft tissue detail beyond density differences. Which imaging modality was most likely used?", "o": ["PET", "Fluoroscopy only", "MRI", "Ultrasound", "CT"], "a": 4, "e": "Correct: E. CT images tissue density using x-ray attenuation. Dense tissue such as bone appears white, air appears black, and soft tissue shades of grey are based on density rather than the tissue-specific contrast seen on MRI.", "l": []}, {"c": "Imaging", "p": "Which of the following patients would be the most appropriate candidate for MRI without additional precaution?", "o": ["A patient with a titanium hip replacement", "A patient with an implanted insulin pump not rated MRI-safe", "A patient with retained metallic shrapnel near the eye", "A patient with a non-MRI-conditional cardiac pacemaker", "A patient with a cochlear implant"], "a": 0, "e": "Correct: A. Modern titanium hip replacements are generally non-ferromagnetic and MRI-conditional. Pacemakers, cochlear implants, ferromagnetic shrapnel near the eye, and non-rated implanted pumps are contraindications or require special precaution because of the magnetic field and heating risk.", "l": []}, {"c": "Imaging", "p": "A clinician wants to visualize fetal development during pregnancy without exposing the fetus to ionizing radiation. Which imaging modality is most appropriate?", "o": ["CT", "Ultrasound", "PET", "Fluoroscopy", "Plain radiograph"], "a": 1, "e": "Correct: B. Ultrasound uses high-frequency sound waves rather than ionizing radiation, making it the preferred modality for routine fetal imaging.", "l": []}, {"c": "Imaging", "p": "On a plain radiograph, which of the following tissues would appear the darkest (most radiolucent)?", "o": ["Metal implant", "Muscle", "Fat", "Air in the lungs", "Cortical bone"], "a": 3, "e": "Correct: D. Radiolucent structures allow more x-rays to pass through and appear darker on film. Air has the lowest density of the choices listed and appears darkest, while dense structures like metal and bone appear white (radiopaque).", "l": []}, {"c": "Histology", "p": "A biopsy shows a single layer of flattened cells lining a surface where rapid diffusion of gases occurs. Where would this epithelium most likely be found?", "o": ["Lining of the stomach", "Skin epidermis", "Alveoli of the lungs", "Lining of the urinary bladder", "Lining of the trachea"], "a": 2, "e": "Correct: C. Simple squamous epithelium is a single layer of flattened cells that minimizes diffusion distance, making it ideal for the gas exchange surface of the alveoli.", "l": []}, {"c": "Histology", "p": "A skin biopsy shows multiple layers of cells, with flattened, keratinized cells at the surface and cuboidal cells at the base. This best describes which type of epithelium?", "o": ["Simple columnar", "Simple cuboidal", "Transitional", "Pseudostratified columnar", "Stratified squamous, keratinized"], "a": 4, "e": "Correct: E. The epidermis is stratified squamous epithelium. Because it is exposed to the external environment, the surface layer is keratinized to provide a tough, protective barrier.", "l": []}, {"c": "Histology", "p": "A biopsy of the trachea shows a single layer of cells of varying heights, all resting on the basement membrane, with cilia on the apical surface. This best describes which type of epithelium?", "o": ["Pseudostratified ciliated columnar", "Simple squamous", "Transitional epithelium", "Stratified columnar", "Simple cuboidal"], "a": 0, "e": "Correct: A. Pseudostratified ciliated columnar epithelium appears layered because nuclei sit at different heights, but every cell contacts the basement membrane. It lines the trachea and large airways, where cilia sweep mucus and trapped particles.", "l": []}, {"c": "Histology", "p": "A biopsy of the urinary bladder wall, taken while the bladder was empty, shows rounded epithelial cells that would flatten and stretch as the organ fills. This best describes which type of epithelium?", "o": ["Transitional epithelium", "Simple squamous", "Simple columnar", "Stratified squamous, non-keratinized", "Pseudostratified columnar"], "a": 0, "e": "Correct: A. Transitional epithelium lines organs that stretch considerably, such as the bladder and ureters. Its cells change shape from rounded (relaxed) to flattened (distended) to accommodate changes in volume without tearing.", "l": []}, {"c": "Connective Tissue", "p": "Which of the following best describes the primary function of loose (areolar) connective tissue?", "o": ["Providing high tensile strength along a single axis", "Producing antibodies", "Cushioning and insulating the body", "Forming the majority of the skeleton", "Binding and supporting structures while allowing diffusion of nutrients and waste"], "a": 4, "e": "Correct: E. Loose areolar connective tissue has a loose arrangement of fibers and cells in a semi-fluid matrix, which binds structures together while permitting diffusion of nutrients, gases, and waste between blood vessels and tissues.", "l": []}, {"c": "Connective Tissue", "p": "A tendon connecting muscle to bone is biopsied and shows tightly packed collagen fibers running in parallel bundles, with few cells scattered between them. This is most consistent with which tissue type?", "o": ["Loose areolar connective tissue", "Hyaline cartilage", "Dense regular connective tissue", "Dense irregular connective tissue", "Elastic cartilage"], "a": 2, "e": "Correct: C. Dense regular connective tissue has collagen fibers arranged in parallel bundles along the direction of mechanical stress, giving tendons and ligaments high tensile strength in a single direction.", "l": []}, {"c": "Connective Tissue", "p": "Which of the following connective tissue types provides a smooth, low-friction surface at the ends of long bones within synovial joints?", "o": ["Dense regular connective tissue", "Hyaline cartilage", "Elastic cartilage", "Bone", "Fibrocartilage"], "a": 1, "e": "Correct: B. Hyaline cartilage covers the articular surfaces of long bones, providing a smooth, resilient, low-friction surface that reduces wear at joints.", "l": []}, {"c": "Connective Tissue", "p": "Which of the following is the primary function of white adipose tissue?", "o": ["Contraction to generate movement", "Filtration of blood", "Production of collagen fibers", "Energy storage and cushioning", "Conduction of electrical impulses"], "a": 3, "e": "Correct: D. White adipose tissue stores energy as triglycerides within lipid droplets and also cushions and insulates organs and the body surface.", "l": []}, {"c": "Bone", "p": "Which of the following best describes the function of osteoblasts?", "o": ["Mature bone cells embedded within lacunae that maintain bone tissue", "Cells that store bone marrow fat", "Multinucleated cells that resorb bone matrix", "Mononuclear cells that synthesize and deposit new bone matrix", "Cells derived from monocytes that break down bone"], "a": 3, "e": "Correct: D. Osteoblasts are bone-forming cells that synthesize and secrete osteoid, the organic matrix of bone, which subsequently mineralizes. Once surrounded by matrix, an osteoblast becomes an osteocyte.", "l": []}, {"c": "Bone", "p": "Mature bone cells housed within small spaces in mineralized bone matrix, which communicate with one another through canaliculi, are called which of the following?", "o": ["Osteoclasts", "Fibroblasts", "Osteocytes", "Chondrocytes", "Osteoblasts"], "a": 2, "e": "Correct: C. Osteocytes are mature osteoblasts that have become entrapped within the bone matrix they produced. They reside in lacunae and maintain the surrounding bone through cytoplasmic processes in canaliculi.", "l": []}, {"c": "Bone", "p": "In osteoporosis, bone resorption outpaces bone formation, leading to decreased bone density. This imbalance is best explained by which of the following?", "o": ["Failure of chondrocytes to proliferate", "Increased osteoclast activity relative to osteoblast activity", "Increased osteoblast activity relative to osteoclast activity", "Decreased collagen synthesis by fibroblasts", "Increased mineralization of osteoid"], "a": 1, "e": "Correct: B. Bone remodeling normally balances osteoblast-driven formation and osteoclast-driven resorption. In osteoporosis, resorption by osteoclasts exceeds formation by osteoblasts, resulting in net bone loss.", "l": []}, {"c": "Neurophysiology", "p": "A peripheral nerve is completely severed in a laceration injury. Which of the following is required for the distal muscle to eventually regain function?", "o": ["Astrocytes must migrate into the injury site", "Microglia must phagocytose the entire neuron", "The neuron cell body must divide to form new neurons", "Oligodendrocytes must proliferate and remyelinate the axon", "Schwann cells must proliferate and the axon must regrow along the resulting conduit"], "a": 4, "e": "Correct: E. In the peripheral nervous system, Schwann cells proliferate to form a conduit (band of Büngner) that guides regrowth of the severed axon toward its original target. Neurons do not divide, and oligodendrocytes and astrocytes are CNS glial cells.", "l": []}, {"c": "Neurophysiology", "p": "Why does axonal injury in the central nervous system generally have a much poorer prognosis for regeneration than a comparable injury in the peripheral nervous system?", "o": ["Oligodendrocytes and the CNS environment are inhibitory to axon regrowth, unlike Schwann cells in the PNS", "The CNS lacks a blood supply", "PNS neurons are able to divide while CNS neurons cannot", "CNS neurons cannot generate action potentials", "CNS axons lack neurofilaments needed for growth"], "a": 0, "e": "Correct: A. Unlike Schwann cells, CNS oligodendrocytes and the surrounding glial scar produce factors that inhibit axon regrowth, which is a major reason CNS injuries have a much poorer capacity for functional regeneration than PNS injuries.", "l": []}, {"c": "Neurophysiology", "p": "During the rising (depolarizing) phase of a neuronal action potential, which of the following occurs?", "o": ["The Na+/K+ pump is maximally active", "Ca++ is released from the sarcoplasmic reticulum", "K+ channels open and K+ exits the cell", "Cl- enters the cell down its concentration gradient", "Na+ channels open and Na+ enters the cell"], "a": 4, "e": "Correct: E. Depolarization occurs when voltage-gated Na+ channels open, allowing Na+ to flow down its concentration and electrical gradient into the cell, rapidly driving the membrane potential toward the Na+ equilibrium potential.", "l": []}, {"c": "Neurophysiology", "p": "Immediately following an action potential, a neuron cannot generate another action potential no matter how strong the stimulus. This period is best described as which of the following?", "o": ["The absolute refractory period", "Summation", "Facilitation", "The relative refractory period", "Hyperpolarization only"], "a": 0, "e": "Correct: A. During the absolute refractory period, voltage-gated Na+ channels are inactivated and cannot reopen regardless of stimulus strength, preventing a new action potential until they reset.", "l": []}, {"c": "Neurophysiology", "p": "The resting membrane potential of a typical neuron is close to, but not exactly equal to, the equilibrium potential for which ion?", "o": ["Na+", "K+", "Ca++", "Mg++", "Cl-"], "a": 1, "e": "Correct: B. At rest, the membrane is far more permeable to K+ than to other ions because of K+ leak channels, so the resting membrane potential lies close to the K+ equilibrium potential, though not exactly at it due to small Na+ leak and pump contributions.", "l": []}, {"c": "Neurophysiology", "p": "At a chemical synapse, depolarization of the presynaptic terminal opens voltage-gated channels that allow which ion to enter and trigger neurotransmitter release?", "o": ["Cl-", "Mg++", "Ca++", "K+", "Na+"], "a": 2, "e": "Correct: C. Depolarization of the presynaptic terminal opens voltage-gated Ca++ channels. The resulting influx of Ca++ triggers synaptic vesicles to fuse with the presynaptic membrane and release neurotransmitter into the synaptic cleft.", "l": []}, {"c": "Muscle Physiology", "p": "At the neuromuscular junction, acetylcholine released from the motor neuron binds to receptors on the motor end plate, causing which of the following?", "o": ["Release of Ca++ directly from the T-tubules", "Hyperpolarization of the muscle fiber", "Direct contraction of the sarcomere", "Opening of ligand-gated ion channels and generation of an end plate potential", "Inactivation of voltage-gated Na+ channels"], "a": 3, "e": "Correct: D. Acetylcholine binds nicotinic receptors on the motor end plate, which are ligand-gated cation channels. Their opening depolarizes the end plate, generating an end plate potential that can trigger a muscle action potential.", "l": []}, {"c": "Muscle Physiology", "p": "During skeletal muscle contraction, which of the following changes occurs within the sarcomere?", "o": ["The I band and H zone shorten as thin filaments slide over thick filaments", "The M line disappears entirely", "The thick and thin filaments themselves shorten", "The A band shortens as thick filaments shorten", "The Z lines move farther apart"], "a": 0, "e": "Correct: A. During contraction, thin filaments slide over thick filaments (sliding filament mechanism). The filaments themselves do not change length, but the I band and H zone narrow as the Z lines are pulled closer together and the sarcomere shortens.", "l": []}, {"c": "Muscle Physiology", "p": "Calcium released from the sarcoplasmic reticulum binds to which protein to initiate the cross-bridge cycle in skeletal muscle?", "o": ["Tropomyosin", "Actin directly", "Myosin light chain kinase only", "Titin", "Troponin"], "a": 4, "e": "Correct: E. Ca++ binds troponin, causing a conformational change that shifts tropomyosin away from the myosin-binding sites on actin, allowing cross-bridge formation between actin and myosin.", "l": []}, {"c": "Muscle Physiology", "p": "Cardiac muscle differs structurally from skeletal muscle most notably in which of the following ways?", "o": ["Cardiac muscle fibers are multinucleated like skeletal muscle", "Cardiac muscle lacks mitochondria", "Cardiac muscle is not striated", "Cardiac muscle fibers are connected by intercalated discs containing gap junctions", "Cardiac muscle contracts voluntarily"], "a": 3, "e": "Correct: D. Cardiac muscle cells are joined end to end by intercalated discs, which contain gap junctions that electrically couple cells and allow coordinated, involuntary contraction of the heart. Skeletal muscle fibers, by contrast, are multinucleated and not connected this way.", "l": []}, {"c": "Muscle Physiology", "p": "Which of the following best characterizes smooth muscle compared to skeletal muscle?", "o": ["Smooth muscle is striated and voluntary", "Smooth muscle contracts only via the neuromuscular junction", "Smooth muscle cells are spindle-shaped, single-nucleated, and involuntary", "Smooth muscle cells are multinucleated and fast-contracting", "Smooth muscle lacks actin and myosin"], "a": 2, "e": "Correct: C. Smooth muscle cells are spindle-shaped with a single, central nucleus, lack the organized striations of skeletal muscle, and are under involuntary (autonomic) control.", "l": []}, {"c": "Fluid & Electrolytes", "p": "A patient drinks a large volume of pure water rapidly. What is the expected effect on the osmolality of the extracellular fluid (ECF) and the volume of the intracellular fluid (ICF) after equilibration?", "o": ["ECF osmolality increases, ICF volume decreases", "ECF osmolality decreases, ICF volume increases", "ECF osmolality increases, ICF volume increases", "ECF osmolality decreases, ICF volume decreases", "Neither compartment changes"], "a": 1, "e": "Correct: B. Pure water dilutes the ECF, decreasing its osmolality. Water then moves by osmosis into cells along the new concentration gradient, increasing ICF volume until osmotic equilibrium is reached.", "l": []}, {"c": "Fluid & Electrolytes", "p": "Compared to interstitial fluid, plasma has a distinctly higher concentration of which of the following?", "o": ["Chloride", "Water", "Plasma proteins", "Sodium", "Potassium"], "a": 2, "e": "Correct: C. Plasma and interstitial fluid have similar small-ion composition because they are separated only by a capillary wall freely permeable to small ions. Plasma proteins, however, are largely too large to cross into the interstitium and remain concentrated in plasma.", "l": []}, {"c": "Fluid & Electrolytes", "p": "A patient develops peripheral edema due to reduced plasma protein levels. Which mechanism best explains this finding?", "o": ["Increased arterial blood pressure alone causes edema", "Decreased plasma oncotic pressure reduces the pull of fluid back into capillaries", "Increased lymphatic drainage overwhelms the interstitium", "Increased plasma osmolality draws fluid out of cells", "Decreased capillary hydrostatic pressure pushes fluid into the interstitium"], "a": 1, "e": "Correct: B. Plasma proteins generate oncotic pressure that draws fluid back into capillaries at the venous end. When plasma protein levels fall, this reabsorptive force weakens, and excess fluid remains in the interstitial space, causing edema.", "l": []}, {"c": "Homeostasis", "p": "In the negative feedback control of blood glucose, insulin release is triggered by rising blood glucose and works to lower it back toward normal. In this system, blood glucose itself is best described as which component?", "o": ["The integrating center", "The effector", "The sensor", "The stimulus source only, not part of the loop", "The controlled variable"], "a": 4, "e": "Correct: E. The controlled variable is the parameter being regulated, in this case blood glucose. Sensors detect its level, an integrating center compares it to a set point, and effectors (such as insulin-secreting cells) act to restore it toward normal.", "l": []}, {"c": "Homeostasis", "p": "During childbirth, stretching of the cervix stimulates oxytocin release, which increases uterine contractions, further stretching the cervix and releasing more oxytocin. This is best described as which of the following?", "o": ["Positive feedback", "Negative feedback", "Feedforward control", "A reflex arc with no feedback", "Homeostatic set-point adjustment"], "a": 0, "e": "Correct: A. Positive feedback amplifies the original stimulus rather than reversing it. In labor, cervical stretch and oxytocin release continue to escalate uterine contractions until delivery ends the stimulus, unlike the self-correcting nature of negative feedback.", "l": []}, {"c": "Homeostasis", "p": "During a fever, pyrogens act on the hypothalamus to raise the body's temperature set point. Which of the following would be expected before the new, higher set point is reached?", "o": ["Sweating and vasodilation to lose heat", "Immediate return to the original set point", "Suppression of the hypothalamic control center", "Shivering and vasoconstriction to generate and conserve heat", "No change in thermoregulatory effector activity"], "a": 3, "e": "Correct: D. When the hypothalamic set point rises, the current body temperature is sensed as too low relative to the new target, triggering heat-generating and heat-conserving responses such as shivering and vasoconstriction until the new set point is reached.", "l": []}, {"c": "Cell Biology", "p": "A pancreatic cell that secretes large amounts of digestive enzymes would be expected to have a particularly well-developed which of the following organelles?", "o": ["Peroxisomes", "Smooth endoplasmic reticulum", "Lysosomes only", "Rough endoplasmic reticulum", "Cytoskeleton only"], "a": 3, "e": "Correct: D. The rough endoplasmic reticulum, studded with ribosomes, is the primary site of synthesis for proteins destined for secretion, such as digestive enzymes. Smooth ER is more associated with lipid synthesis and detoxification.", "l": []}, {"c": "Cell Biology", "p": "Which organelle is primarily responsible for generating ATP through oxidative phosphorylation?", "o": ["Smooth endoplasmic reticulum", "Mitochondrion", "Nucleolus", "Golgi apparatus", "Lysosome"], "a": 1, "e": "Correct: B. Mitochondria contain the enzymes of the electron transport chain and ATP synthase on their inner membrane, making them the principal site of ATP production via oxidative phosphorylation.", "l": []}, {"c": "Cell Biology", "p": "A cell type that must digest and recycle worn-out organelles and engulfed extracellular material would be expected to be particularly rich in which organelle?", "o": ["Lysosomes", "Golgi apparatus", "Centrioles", "Peroxisomes", "Ribosomes"], "a": 0, "e": "Correct: A. Lysosomes contain hydrolytic enzymes that break down worn-out organelles (via autophagy) and engulfed material (via phagocytosis), making them the cell's primary digestive and recycling compartment.", "l": []}, {"c": "Cell Biology", "p": "Within the nucleus, ribosomal RNA is synthesized and ribosomal subunits are partially assembled at which structure?", "o": ["Nuclear envelope", "Nuclear pore complex", "Nucleolus", "Chromatin", "Nuclear lamina"], "a": 2, "e": "Correct: C. The nucleolus is a dense region within the nucleus specialized for transcription of ribosomal RNA and initial assembly of ribosomal subunits, which are then exported to the cytoplasm for final assembly.", "l": []}, {"c": "Biochemistry", "p": "Which of the following is the basic building block (monomer) of carbohydrates?", "o": ["Glycerol", "Fatty acids", "Amino acids", "Nucleotides", "Monosaccharides"], "a": 4, "e": "Correct: E. Monosaccharides, such as glucose, are the simplest units of carbohydrates and are linked together by glycosidic bonds to form disaccharides and polysaccharides.", "l": []}, {"c": "Biochemistry", "p": "Triglycerides, a major class of lipid, are formed from which of the following building blocks?", "o": ["Three fatty acids and one glycerol molecule", "Three monosaccharides", "One nucleotide and two fatty acids", "Glycerol and phosphate only", "Two amino acids and one fatty acid"], "a": 0, "e": "Correct: A. A triglyceride consists of one glycerol backbone esterified to three fatty acid chains, which is the primary storage form of lipid energy in adipose tissue.", "l": []}, {"c": "Biochemistry", "p": "Which of the following best describes the structure of DNA?", "o": ["A folded sheet of monosaccharide chains", "A single circular strand found only in mitochondria", "A branched polymer of amino acids", "A single strand of ribonucleotides", "A double helix of deoxyribonucleotides held together by complementary base pairing"], "a": 4, "e": "Correct: E. DNA is composed of two antiparallel strands of deoxyribonucleotides wound into a double helix, with strands held together by hydrogen bonds between complementary base pairs (A-T and G-C).", "l": []}, {"c": "Biochemistry", "p": "Which of the following correctly orders the steps of the central dogma of molecular biology, from gene to functional product?", "o": ["Transcription of protein into mRNA, then translation into DNA", "Replication of DNA, then direct folding into protein", "Transcription of DNA to mRNA, then translation of mRNA to protein", "Translation of DNA directly into protein without an RNA intermediate", "Translation, then transcription, then protein folding"], "a": 2, "e": "Correct: C. In the central dogma, DNA is first transcribed into messenger RNA in the nucleus, and that mRNA is then translated by ribosomes into a sequence of amino acids forming a protein.", "l": []}, {"c": "Biochemistry", "p": "A newly identified virus is found to store its genetic information as a molecule that contains ribose sugar and the base uracil instead of thymine. This molecule is best classified as which of the following?", "o": ["A phospholipid", "A protein", "A polysaccharide", "RNA", "DNA"], "a": 3, "e": "Correct: D. Ribose as the sugar and uracil in place of thymine are defining features of RNA. RNA can serve as the genetic material in some viruses, whereas DNA uses deoxyribose and thymine.", "l": []}, {"c": "The Outbreak Team", "p": "You're part of a public health unit investigating whether a workplace exposure raises cancer risk in a manufacturing town. Two different study teams propose two different designs, and a screening test is being validated for the follow-up survey.\n\nTeam A enrols disease-free workers, records their exposure level, and follows them forward 15 years. What design is this?", "o": ["Cross-sectional", "Prospective cohort", "Retrospective cohort", "Case series", "Case-control"], "a": 1, "e": "Correct: B. Exposure is defined before outcomes occur and the group is followed forward in time, a prospective cohort.", "l": []}, {"c": "The Outbreak Team", "p": "You're part of a public health unit investigating whether a workplace exposure raises cancer risk in a manufacturing town. Two different study teams propose two different designs, and a screening test is being validated for the follow-up survey.\n\nTeam B instead compares smoking history in 200 cases and 200 controls, looking backward. What design is this?", "o": ["Ecological study", "Prospective cohort", "Cross-sectional", "Case-control", "Randomized trial"], "a": 3, "e": "Correct: D. Selecting participants by outcome status and looking back at exposure defines a case-control study.", "l": []}, {"c": "The Outbreak Team", "p": "You're part of a public health unit investigating whether a workplace exposure raises cancer risk in a manufacturing town. Two different study teams propose two different designs, and a screening test is being validated for the follow-up survey.\n\nWhy does the follow-up trial use double-blinding?", "o": ["Guarantees external validity", "Increases statistical power", "Removes the need for a control group", "Balances confounders between groups", "Reduces participant/assessor bias"], "a": 4, "e": "Correct: E. Blinding limits performance and detection bias. Randomization, not blinding, balances confounders.", "l": []}, {"c": "The Outbreak Team", "p": "You're part of a public health unit investigating whether a workplace exposure raises cancer risk in a manufacturing town. Two different study teams propose two different designs, and a screening test is being validated for the follow-up survey.\n\nExposed risk is 40/1000, unexposed risk is 10/1000. What's the relative risk?", "o": ["4", "40", "2.5", "0.25", "0.4"], "a": 0, "e": "Correct: A. RR = 0.04 / 0.01 = 4.", "l": []}, {"c": "The Outbreak Team", "p": "You're part of a public health unit investigating whether a workplace exposure raises cancer risk in a manufacturing town. Two different study teams propose two different designs, and a screening test is being validated for the follow-up survey.\n\nThe new screening test correctly flags 95 of 100 people who truly have the disease. What does this describe?", "o": ["Specificity", "Prevalence", "Sensitivity", "Positive predictive value", "Negative predictive value"], "a": 2, "e": "Correct: C. Sensitivity is the proportion of true positives correctly identified, true positives / (true positives + false negatives).", "l": []}, {"c": "Trauma Bay", "p": "A 24-year-old man arrives after a motor vehicle collision. The trauma team is describing his injuries using standard terms and ordering imaging.\n\nA CT is cut at the umbilicus in the transverse plane. What does this plane divide the body into?", "o": ["Medial and lateral", "Superior and inferior", "Anterior and posterior", "Proximal and distal", "Left and right"], "a": 1, "e": "Correct: B. A transverse (axial) plane is horizontal, dividing the body into upper and lower portions.", "l": []}, {"c": "Trauma Bay", "p": "A 24-year-old man arrives after a motor vehicle collision. The trauma team is describing his injuries using standard terms and ordering imaging.\n\nThe resident documents findings relative to standard anatomical position. What is this position?", "o": ["Standing, palms facing posteriorly", "Standing, feet together, palms facing anteriorly", "Supine, palms down", "Prone, arms at sides", "Standing with arms crossed"], "a": 1, "e": "Correct: B. Anatomical position: standing erect, facing forward, feet together, palms facing anteriorly. All directional terms are defined relative to it.", "l": []}, {"c": "Trauma Bay", "p": "A 24-year-old man arrives after a motor vehicle collision. The trauma team is describing his injuries using standard terms and ordering imaging.\n\nHis elbow injury is described relative to the wrist and shoulder. Which pairing is correct?", "o": ["Proximal to both", "Distal to wrist, proximal to shoulder", "Medial to wrist, lateral to shoulder", "Distal to both", "Proximal to wrist, distal to shoulder"], "a": 4, "e": "Correct: E. Proximal/distal are relative to the trunk attachment point. The elbow is closer to the trunk than the wrist, farther than the shoulder.", "l": []}, {"c": "Trauma Bay", "p": "A 24-year-old man arrives after a motor vehicle collision. The trauma team is describing his injuries using standard terms and ordering imaging.\n\nHe rotates his forearm so his palm turns from facing forward to facing backward. What movement is this?", "o": ["Supination", "Circumduction", "Flexion", "Pronation", "Abduction"], "a": 3, "e": "Correct: D. Pronation turns the palm posteriorly as the radius crosses over the ulna.", "l": []}, {"c": "Trauma Bay", "p": "A
