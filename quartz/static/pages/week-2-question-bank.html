24-year-old man arrives after a motor vehicle collision. The trauma team is describing his injuries using standard terms and ordering imaging.\n\nHe raises both arms away from the midline overhead. What movement is this?", "o": ["Abduction", "Rotation", "Extension", "Adduction", "Pronation"], "a": 0, "e": "Correct: A. Abduction moves a limb away from the midline in the coronal plane.", "l": []}, {"c": "Trauma Bay", "p": "A 24-year-old man arrives after a motor vehicle collision. The trauma team is describing his injuries using standard terms and ordering imaging.\n\nOn his CT, bone is bright white, air is black, and soft tissue is shaded by density. What modality is this?", "o": ["PET", "MRI", "CT", "Fluoroscopy", "Ultrasound"], "a": 2, "e": "Correct: C. CT images tissue by x-ray attenuation (density), bone is dense and appears white, air appears black.", "l": []}, {"c": "Trauma Bay", "p": "A 24-year-old man arrives after a motor vehicle collision. The trauma team is describing his injuries using standard terms and ordering imaging.\n\nHe has a cochlear implant. Why is this a concern before ordering an MRI?", "o": ["The magnetic field can damage or displace the implant", "The dye used is nephrotoxic", "It requires general anesthesia", "It doubles his radiation exposure", "It cannot be scheduled urgently"], "a": 0, "e": "Correct: A. MRI's strong magnetic field can damage, move, or heat implanted metal devices such as cochlear implants and non-MRI-conditional pacemakers.", "l": []}, {"c": "Trauma Bay", "p": "A 24-year-old man arrives after a motor vehicle collision. The trauma team is describing his injuries using standard terms and ordering imaging.\n\nThe team wants to check for free abdominal fluid without radiation. What modality fits best?", "o": ["PET", "Plain radiograph", "Ultrasound", "CT", "Fluoroscopy"], "a": 2, "e": "Correct: C. Ultrasound (as in a FAST exam) uses sound waves, not ionizing radiation, and is fast at bedside.", "l": []}, {"c": "Trauma Bay", "p": "A 24-year-old man arrives after a motor vehicle collision. The trauma team is describing his injuries using standard terms and ordering imaging.\n\nOn his chest X-ray, which structure appears darkest?", "o": ["Muscle", "A metal fragment", "Cortical bone", "Air in the lungs", "Fat"], "a": 3, "e": "Correct: D. Radiolucent structures let more x-rays pass through and appear darker, air has the lowest density of the options.", "l": []}, {"c": "The Pathology Bench", "p": "You're rotating through pathology, reviewing a set of biopsy specimens sent from different patients across the hospital.\n\nA biopsy shows one layer of flattened cells lining a gas-exchange surface. Where is this from?", "o": ["Stomach lining", "Alveoli", "Trachea lining", "Skin epidermis", "Bladder lining"], "a": 1, "e": "Correct: B. Simple squamous epithelium minimizes diffusion distance, fitting the alveolar gas-exchange surface.", "l": []}, {"c": "The Pathology Bench", "p": "You're rotating through pathology, reviewing a set of biopsy specimens sent from different patients across the hospital.\n\nA skin biopsy shows several layers, keratinized and flat at the surface. What epithelium is this?", "o": ["Transitional", "Simple columnar", "Pseudostratified columnar", "Simple cuboidal", "Stratified squamous, keratinized"], "a": 4, "e": "Correct: E. The epidermis is stratified squamous, keratinized to form a tough protective barrier.", "l": []}, {"c": "The Pathology Bench", "p": "You're rotating through pathology, reviewing a set of biopsy specimens sent from different patients across the hospital.\n\nA bladder biopsy (bladder empty) shows rounded cells expected to flatten on stretching. What epithelium is this?", "o": ["Stratified squamous, non-keratinized", "Simple columnar", "Simple squamous", "Pseudostratified columnar", "Transitional epithelium"], "a": 4, "e": "Correct: E. Transitional epithelium lines organs that stretch, such as the bladder, changing shape from rounded to flattened.", "l": []}, {"c": "The Pathology Bench", "p": "You're rotating through pathology, reviewing a set of biopsy specimens sent from different patients across the hospital.\n\nA sample of loose connective tissue is sent for review. What is its main function?", "o": ["Forming most of the skeleton", "Binding structures while allowing diffusion", "High tensile strength in one direction", "Cushioning and insulation only", "Producing antibodies"], "a": 1, "e": "Correct: B. Loose areolar tissue binds structures together while its loose matrix allows diffusion of nutrients and waste.", "l": []}, {"c": "The Pathology Bench", "p": "You're rotating through pathology, reviewing a set of biopsy specimens sent from different patients across the hospital.\n\nA tendon biopsy shows tightly packed parallel collagen bundles with few cells. What tissue is this?", "o": ["Elastic cartilage", "Dense irregular connective tissue", "Loose areolar tissue", "Dense regular connective tissue", "Hyaline cartilage"], "a": 3, "e": "Correct: D. Parallel collagen bundles along the line of stress give dense regular connective tissue its tensile strength, typical of tendons.", "l": []}, {"c": "The Pathology Bench", "p": "You're rotating through pathology, reviewing a set of biopsy specimens sent from different patients across the hospital.\n\nA joint surface biopsy shows smooth, resilient cartilage. What type is this?", "o": ["Hyaline cartilage", "Dense regular connective tissue", "Fibrocartilage", "Bone", "Elastic cartilage"], "a": 0, "e": "Correct: A. Hyaline cartilage covers articular surfaces, providing a smooth, low-friction joint surface.", "l": []}, {"c": "The Pathology Bench", "p": "You're rotating through pathology, reviewing a set of biopsy specimens sent from different patients across the hospital.\n\nA fat pad biopsy is reviewed. What is the primary function of this tissue?", "o": ["Electrical conduction", "Collagen production", "Energy storage and cushioning", "Contraction for movement", "Blood filtration"], "a": 2, "e": "Correct: C. White adipose tissue stores triglycerides for energy and cushions and insulates surrounding structures.", "l": []}, {"c": "The Pathology Bench", "p": "You're rotating through pathology, reviewing a set of biopsy specimens sent from different patients across the hospital.\n\nA bone biopsy shows mononuclear cells actively laying down new matrix. What are these cells?", "o": ["Monocyte-derived cells", "Osteoblasts", "Mature osteocytes", "Osteoclasts", "Adipocytes"], "a": 1, "e": "Correct: B. Osteoblasts synthesize and secrete osteoid, the organic bone matrix, before it mineralizes.", "l": []}, {"c": "The Pathology Bench", "p": "You're rotating through pathology, reviewing a set of biopsy specimens sent from different patients across the hospital.\n\nCells embedded singly in lacunae, connected by canaliculi, are seen in this bone section. What are they?", "o": ["Osteocytes", "Fibroblasts", "Chondrocytes", "Osteoclasts", "Osteoblasts"], "a": 0, "e": "Correct: A. Osteocytes are former osteoblasts trapped within the matrix they made, living in lacunae and linked by canaliculi.", "l": []}, {"c": "The Pathology Bench", "p": "You're rotating through pathology, reviewing a set of biopsy specimens sent from different patients across the hospital.\n\nThis patient's bone biopsy shows resorption outpacing formation, as in osteoporosis. What best explains this?", "o": ["Osteoid over-mineralizes", "Fibroblasts stop making collagen", "Osteoclast activity exceeds osteoblast activity", "Osteoblast activity exceeds osteoclast activity", "Chondrocytes fail to proliferate"], "a": 2, "e": "Correct: C. Bone remodeling balances osteoblast formation and osteoclast resorption, osteoporosis reflects resorption outpacing formation.", "l": []}, {"c": "Neurology Consult", "p": "You're asked to see two patients on the same afternoon: one with a lacerated peripheral nerve, and one with a suspected muscle disorder being worked up on the same ward.\n\nHis hand laceration severed a peripheral nerve. What must happen for the nerve to regrow?", "o": ["Microglia phagocytose the neuron", "Oligodendrocytes remyelinate the axon", "The neuron cell body divides", "Schwann cells proliferate and the axon regrows through the conduit", "Astrocytes migrate into the wound"], "a": 3, "e": "Correct: D. In the PNS, proliferating Schwann cells form a conduit that guides axon regrowth back to its target.", "l": []}, {"c": "Neurology Consult", "p": "You're asked to see two patients on the same afternoon: one with a lacerated peripheral nerve, and one with a suspected muscle disorder being worked up on the same ward.\n\nIf this injury had occurred in his spinal cord instead, why would recovery be far less likely?", "o": ["CNS neurons can't fire action potentials", "CNS axons lack neurofilaments", "Only PNS neurons can divide", "The CNS has no blood supply", "Oligodendrocytes and the CNS environment inhibit regrowth"], "a": 4, "e": "Correct: E. CNS oligodendrocytes and the glial scar release factors that inhibit axon regrowth, unlike the permissive PNS environment.", "l": []}, {"c": "Neurology Consult", "p": "You're asked to see two patients on the same afternoon: one with a lacerated peripheral nerve, and one with a suspected muscle disorder being worked up on the same ward.\n\nOn nerve conduction testing, what drives the rising phase of his action potentials?", "o": ["Na+ channels open, Na+ enters", "Cl- enters the cell", "Ca++ releases from the SR", "K+ channels open, K+ exits", "Na+/K+ pump activity peaks"], "a": 0, "e": "Correct: A. Depolarization results from voltage-gated Na+ channels opening and Na+ flowing into the cell.", "l": []}, {"c": "Neurology Consult", "p": "You're asked to see two patients on the same afternoon: one with a lacerated peripheral nerve, and one with a suspected muscle disorder being worked up on the same ward.\n\nRight after firing, the axon can't fire again no matter the stimulus. What period is this?", "o": ["Summation", "Absolute refractory period", "Hyperpolarization only", "Facilitation", "Relative refractory period"], "a": 1, "e": "Correct: B. During the absolute refractory period, inactivated Na+ channels can't reopen regardless of stimulus strength.", "l": []}, {"c": "Neurology Consult", "p": "You're asked to see two patients on the same afternoon: one with a lacerated peripheral nerve, and one with a suspected muscle disorder being worked up on the same ward.\n\nThe second patient's biopsy shows muscle fibers joined by discs containing gap junctions. What tissue is this?", "o": ["Tendon", "Nerve fiber", "Cardiac muscle", "Skeletal muscle", "Smooth muscle"], "a": 2, "e": "Correct: C. Intercalated discs with gap junctions electrically couple cardiac muscle cells for coordinated contraction.", "l": []}, {"c": "Neurology Consult", "p": "You're asked to see two patients on the same afternoon: one with a lacerated peripheral nerve, and one with a suspected muscle disorder being worked up on the same ward.\n\nAt his neuromuscular junction, acetylcholine binding to the end plate causes what?", "o": ["Direct sarcomere contraction", "Ca++ release from T-tubules directly", "Hyperpolarization of the fiber", "Na+ channel inactivation", "Opening of ligand-gated channels, an end plate potential"], "a": 4, "e": "Correct: E. ACh binds nicotinic receptors, ligand-gated cation channels, depolarizing the end plate and generating an end plate potential.", "l": []}, {"c": "Neurology Consult", "p": "You're asked to see two patients on the same afternoon: one with a lacerated peripheral nerve, and one with a suspected muscle disorder being worked up on the same ward.\n\nOn his muscle biopsy during contraction, which sarcomere change is expected?", "o": ["The filaments themselves shorten", "The M line disappears", "Z lines move farther apart", "The I band and H zone narrow", "The A band shortens"], "a": 3, "e": "Correct: D. Thin filaments slide over thick filaments, the filaments don't shorten, but the I band and H zone narrow as Z lines are pulled closer.", "l": []}, {"c": "Neurology Consult", "p": "You're asked to see two patients on the same afternoon: one with a lacerated peripheral nerve, and one with a suspected muscle disorder being worked up on the same ward.\n\nWhich protein does calcium bind to trigger this sliding?", "o": ["Titin", "Troponin", "Myosin light chain kinase only", "Actin directly", "Tropomyosin"], "a": 1, "e": "Correct: B. Ca++ binds troponin, shifting tropomyosin off the myosin-binding sites on actin, allowing cross-bridge formation.", "l": []}, {"c": "Neurology Consult", "p": "You're asked to see two patients on the same afternoon: one with a lacerated peripheral nerve, and one with a suspected muscle disorder being worked up on the same ward.\n\nHis biopsy also shows spindle-shaped, single-nucleated, involuntary fibers. What tissue is this?", "o": ["Smooth muscle", "Skeletal muscle", "Cardiac muscle", "Dense connective tissue", "Nerve tissue"], "a": 0, "e": "Correct: A. Smooth muscle cells are spindle-shaped, single-nucleated, non-striated, and under involuntary control.", "l": []}, {"c": "ICU Overnight", "p": "An elderly patient is admitted overnight with a fluid and electrolyte disturbance, and the team is discussing feedback control of her vital signs on rounds.\n\nShe rapidly drinks a large volume of pure water. What happens to ECF osmolality and ICF volume after equilibration?", "o": ["ECF osmolality up, ICF volume down", "ECF osmolality down, ICF volume up", "Both decrease", "Both increase", "Neither changes"], "a": 1, "e": "Correct: B. Pure water dilutes the ECF, lowering its osmolality, water then shifts into cells, raising ICF volume.", "l": []}, {"c": "ICU Overnight", "p": "An elderly patient is admitted overnight with a fluid and electrolyte disturbance, and the team is discussing feedback control of her vital signs on rounds.\n\nHer labs show plasma has a much higher protein concentration than her interstitial fluid. Why?", "o": ["Potassium is higher in plasma", "Chloride is higher in plasma", "Sodium is higher in plasma", "Plasma proteins are too large to cross the capillary wall", "Plasma has less water"], "a": 3, "e": "Correct: D. Plasma and interstitial fluid share similar small-ion levels, but plasma proteins are largely retained in plasma because they can't cross the capillary wall.", "l": []}, {"c": "ICU Overnight", "p": "An elderly patient is admitted overnight with a fluid and electrolyte disturbance, and the team is discussing feedback control of her vital signs on rounds.\n\nHer low albumin is causing peripheral edema. What's the main mechanism?", "o": ["Increased lymphatic drainage", "Decreased capillary hydrostatic pressure", "Increased arterial pressure alone", "Increased plasma osmolality pulling water from cells", "Decreased plasma oncotic pressure"], "a": 4, "e": "Correct: E. Plasma proteins generate oncotic pressure that pulls fluid back into capillaries, low protein weakens this pull, causing fluid to remain in tissue.", "l": []}, {"c": "ICU Overnight", "p": "An elderly patient is admitted overnight with a fluid and electrolyte disturbance, and the team is discussing feedback control of her vital signs on rounds.\n\nHer glucose is regulated by insulin release when it rises. In this loop, blood glucose itself is the:", "o": ["Integrating center", "Sensor", "Controlled variable", "Effector", "Stimulus, not part of the loop"], "a": 2, "e": "Correct: C. The controlled variable is what's regulated. Sensors detect it, a center compares it to a set point, and effectors correct it.", "l": []}, {"c": "ICU Overnight", "p": "An elderly patient is admitted overnight with a fluid and electrolyte disturbance, and the team is discussing feedback control of her vital signs on rounds.\n\nA separate patient in labor has escalating contractions as oxytocin release increases with cervical stretch. What kind of loop is this?", "o": ["No feedback, a simple reflex", "Feedforward control", "Negative feedback", "A change in set point", "Positive feedback"], "a": 4, "e": "Correct: E. Positive feedback amplifies the original stimulus. Cervical stretch and oxytocin release escalate until delivery ends the cycle.", "l": []}, {"c": "ICU Overnight", "p": "An elderly patient is admitted overnight with a fluid and electrolyte disturbance, and the team is discussing feedback control of her vital signs on rounds.\n\nHer fever is thought to reflect a raised hypothalamic set point. What would you expect before it's reached?", "o": ["No change in effector activity", "Immediate drop to baseline", "Sweating and vasodilation", "Shivering and vasoconstriction", "Suppression of the hypothalamus"], "a": 3, "e": "Correct: D. A raised set point makes current temperature seem too low, triggering heat-generating and heat-conserving responses like shivering and vasoconstriction.", "l": []}, {"c": "The Genetics and Cell Biology Lab", "p": "You're spending an afternoon in a research lab that studies cell organelle function and is also characterizing a newly discovered virus.\n\nTriglycerides are built from glycerol plus which other component?", "o": ["Three fatty acids", "Phosphate only", "A nucleotide and two fatty acids", "Two amino acids and a fatty acid", "Three monosaccharides"], "a": 0, "e": "Correct: A. A triglyceride is glycerol esterified to three fatty acid chains, the main lipid energy-storage form.", "l": []}, {"c": "The Genetics and Cell Biology Lab", "p": "You're spending an afternoon in a research lab that studies cell organelle function and is also characterizing a newly discovered virus.\n\nWhat is the correct order of the central dogma?", "o": ["Translation, then transcription", "DNA replicates directly into protein", "Transcription (DNA to mRNA), then translation (mRNA to protein)", "Protein is transcribed into mRNA", "Translation skips RNA entirely"], "a": 2, "e": "Correct: C. DNA is transcribed into mRNA, which is then translated by ribosomes into protein.", "l": []}, {"c": "The Genetics and Cell Biology Lab", "p": "You're spending an afternoon in a research lab that studies cell organelle function and is also characterizing a newly discovered virus.\n\nThe lab's new virus stores genetic material with ribose sugar and uracil instead of thymine. What is this molecule?", "o": ["A phospholipid", "RNA", "A polysaccharide", "DNA", "A protein"], "a": 1, "e": "Correct: B. Ribose and uracil (instead of deoxyribose and thymine) are defining features of RNA.", "l": []}, {"c": "The Outbreak Team", "p": "You're part of a public health unit investigating whether a workplace chemical exposure raises solid-tumor cancer risk in a manufacturing town.\n\nA second, faster-moving team instead identifies 200 workers who already have the cancer and 200 disease-free coworkers, then looks back at each group's exposure records.\n\nWhat design is Team B using?", "o": ["Cross-sectional", "Prospective cohort", "Case-control", "Randomized trial", "Ecological study"], "a": 2, "e": "Correct: C. Selecting participants by outcome status and looking back at exposure defines a case-control study.", "l": []}, {"c": "The Outbreak Team", "p": "You're part of a public health unit investigating whether a workplace chemical exposure raises solid-tumor cancer risk in a manufacturing town.\n\nLeadership commissions a randomized trial of a workplace intervention (improved ventilation) to confirm causality, and wants results free of investigator or participant bias.\n\nWhy does this trial use double-blinding?", "o": ["Balances confounders between groups", "Removes the need for a control group", "Guarantees external validity", "Reduces participant/assessor bias", "Increases statistical power"], "a": 3, "e": "Correct: D. Blinding limits performance and detection bias. Randomization, not blinding, balances confounders.", "l": []}, {"c": "The Outbreak Team", "p": "You're part of a public health unit investigating whether a workplace chemical exposure raises solid-tumor cancer risk in a manufacturing town.\n\nBefore the intervention is rolled out sitewide, the team pilots a new screening blood test. In validation, it correctly flags 95 of the 100 workers who truly have early disease.\n\nWhat test property does this describe?", "o": ["Positive predictive value", "Specificity", "Prevalence", "Negative predictive value", "Sensitivity"], "a": 4, "e": "Correct: E. Sensitivity is the proportion of true positives correctly identified, true positives / (true positives + false negatives).", "l": []}, {"c": "Trauma Bay", "p": "A 24-year-old man arrives after a motor vehicle collision. GCS 14, hemodynamically stable. The team begins its primary survey.\n\nWhile reviewing his chart, you notice he has a cochlear implant from childhood meningitis. An MRI of his elbow is being considered.\n\nWhy is this a concern before ordering the MRI?", "o": ["The magnetic field can damage or displace the implant", "The contrast dye is nephrotoxic", "It requires general anesthesia", "It can't be scheduled urgently", "It doubles his radiation exposure"], "a": 0, "e": "Correct: A. MRI's strong magnetic field can damage, move, or heat implanted metal devices such as cochlear implants and non-MRI-conditional pacemakers.", "l": []}, {"c": "The Pathology Bench", "p": "You're at the pathology bench this afternoon, working through today's specimens with the attending one at a time.\n\nThe attending pulls a slide of the loose tissue just beneath one of today's skin biopsies.\n\nWhat is this tissue's main function?", "o": ["Producing antibodies", "Forming most of the skeleton", "Binding structures while allowing diffusion", "Cushioning and insulation only", "High tensile strength in one direction"], "a": 2, "e": "Correct: C. Loose areolar tissue binds structures together while its loose matrix allows diffusion of nutrients and waste.", "l": []}, {"c": "The Pathology Bench", "p": "You're at the pathology bench this afternoon, working through today's specimens with the attending one at a time.\n\nThe attending mentions this patient's DEXA scan shows osteoporosis and asks you to explain the underlying imbalance.\n\nWhich imbalance best explains her increased fracture risk?", "o": ["Fibroblasts stop making collagen", "Chondrocytes fail to proliferate", "Osteoblast activity exceeds osteoclast activity", "Osteoid over-mineralizes", "Osteoclast activity exceeds osteoblast activity"], "a": 4, "e": "Correct: E. Bone remodeling balances osteoblast formation and osteoclast resorption, osteoporosis reflects resorption outpacing formation.", "l": []}, {"c": "Neurology Consult", "p": "You're paged to see two patients this afternoon. The first, a carpenter, lacerated his hand on a table saw an hour ago, the nerve is completely severed.\n\nWhat must happen for the nerve to eventually regrow?", "o": ["Oligodendrocytes remyelinate the axon", "Astrocytes migrate into the wound", "Microglia phagocytose the neuron", "Schwann cells proliferate and the axon regrows through the conduit", "The neuron cell body divides"], "a": 3, "e": "Correct: D. In the PNS, proliferating Schwann cells form a conduit that guides axon regrowth back to its target.", "l": []}, {"c": "Neurology Consult", "p": "You're paged to see two patients this afternoon. The first, a carpenter, lacerated his hand on a table saw an hour ago, the nerve is completely severed.\n\nYour second patient is a 68-year-old with weakness that worsens through the day and improves with rest. A neuromuscular junction problem is suspected.\n\nAt the neuromuscular junction, what does acetylcholine binding to the end plate cause?", "o": ["Na+ channel inactivation", "Opening of ligand-gated channels, an end plate potential", "Direct sarcomere contraction", "Ca++ release from T-tubules directly", "Hyperpolarization of the fiber"], "a": 1, "e": "Correct: B. ACh binds nicotinic receptors, ligand-gated cation channels, depolarizing the end plate and generating an end plate potential.", "l": []}, {"c": "Neurology Consult", "p": "You're paged to see two patients this afternoon. The first, a carpenter, lacerated his hand on a table saw an hour ago, the nerve is completely severed.\n\nHer muscle biopsy, taken to rule out a primary myopathy, is reviewed during a contracted phase of the fiber.\n\nWhich sarcomere change is expected during contraction?", "o": ["The I band and H zone narrow", "Z lines move farther apart", "The A band shortens", "The filaments themselves shorten", "The M line disappears"], "a": 0, "e": "Correct: A. Thin filaments slide over thick filaments, the filaments don't shorten, but the I band and H zone narrow as Z lines are pulled closer.", "l": []}, {"c": "Neurology Consult", "p": "You're paged to see two patients this afternoon. The first, a carpenter, lacerated his hand on a table saw an hour ago, the nerve is completely severed.\n\nThe pathologist points to a regulatory protein on immunostaining, the one calcium binds to trigger this sliding.\n\nWhich protein is this?", "o": ["Titin", "Myosin light chain kinase only", "Actin directly", "Troponin", "Tropomyosin"], "a": 3, "e": "Correct: D. Ca++ binds troponin, shifting tropomyosin off the myosin-binding sites on actin, allowing cross-bridge formation.", "l": []}, {"c": "Neurology Consult", "p": "You're paged to see two patients this afternoon. The first, a carpenter, lacerated his hand on a table saw an hour ago, the nerve is completely severed.\n\nHer cardiac monitor strip is also reviewed, the myocardium's fibers are joined end-to-end by discs containing gap junctions.\n\nWhat best describes this arrangement?", "o": ["Typical of cardiac muscle", "Typical of smooth muscle", "Typical of nerve fiber", "Typical of tendon", "Typical of skeletal muscle"], "a": 0, "e": "Correct: A. Intercalated discs with gap junctions electrically couple cardiac muscle cells for coordinated contraction.", "l": []}, {"c": "ICU Overnight", "p": "An 82-year-old woman is admitted overnight, confused and hypotensive, after several days of poor oral intake. She's started on IV fluids.\n\nHer labs show a low albumin, and she develops new swelling in both legs.\n\nPlasma protein is much higher than interstitial fluid protein in a healthy person. Why?", "o": ["Chloride is higher in plasma", "Plasma proteins are too large to cross the capillary wall", "Potassium is higher in plasma", "Plasma has less water", "Sodium is higher in plasma"], "a": 1, "e": "Correct: B. Plasma and interstitial fluid share similar small-ion levels, but plasma proteins are largely retained in plasma because they can't cross the capillary wall.", "l": []}, {"c": "ICU Overnight", "p": "An 82-year-old woman is admitted overnight, confused and hypotensive, after several days of poor oral intake. She's started on IV fluids.\n\nHer labs show a low albumin, and she develops new swelling in both legs.\n\nGiven her low albumin, what's driving her new leg edema?", "o": ["Increased arterial pressure alone", "Increased lymphatic drainage", "Decreased plasma oncotic pressure", "Increased plasma osmolality pulling water from cells", "Decreased capillary hydrostatic pressure"], "a": 2, "e": "Correct: C. Plasma proteins generate oncotic pressure that pulls fluid back into capillaries, low protein weakens this pull, causing fluid to remain in tissue.", "l": []}, {"c": "ICU Overnight", "p": "An 82-year-old woman is admitted overnight, confused and hypotensive, after several days of poor oral intake. She's started on IV fluids.\n\nHer glucose readings are being tracked on a sliding scale, prompting a teaching question from the attending about feedback regulation.\n\nIn the insulin-glucose loop, blood glucose itself is the:", "o": ["Sensor", "Integrating center", "Effector", "Stimulus, not part of the loop", "Controlled variable"], "a": 4, "e": "Correct: E. The controlled variable is what's regulated. Sensors detect it, a center compares it to a set point, and effectors correct it.", "l": []}, {"c": "ICU Overnight", "p": "An 82-year function score(){ return ans.reduce((n,a,i)=>n+(a!==null&&a===QUESTIONS[i].a?1:0),0); }
function answered(){ return ans.filter(a=>a!==null).length; }
function firstTryScore(){ return tries.reduce((n,t)=>n+(t.length&&t[0].ok?1:0),0); }
function firstTryCount(){ return tries.filter(t=>t.length).length; }

function renderHeader(){

  $("#ticks").innerHTML = QUESTIONS.map((q,i)=>{
    const st = ans[i]===null?"":(ans[i]===q.a?"ok":"bad");
    const redo = tries[i].length>1 || (ans[i]===null && tries[i].length>0);
    return `<button class="tick ${st} ${redo?"redo":""} ${(!showResults&&i===cur)?"cur":""}" data-i="${i}" aria-label="Question ${i+1}"></button>`;
  }).join("");
  document.querySelectorAll(".tick").forEach(b=>b.onclick=()=>{cur=+b.dataset.i;showResults=false;render();});
}

function triesLine(i, includeCurrent){
  const t = includeCurrent ? tries[i] : tries[i];
  if(!t.length) return "";
  const parts = t.map((x,k)=>`<span class="${x.ok?"ok":"bad"}">${k+1}: ${L[x.pick]} ${x.ok?"correct":"wrong"}</span>`).join(" · ");
  return `<div class="tries">Attempts ${parts}</div>`;
}

function fmtLine(t){
  let m;
  if((m=t.match(/^Correct:\s*([A-E])\.?\s*(.*)$/)) || (m=t.match(/^([A-E]) is correct\.?\s*(.*)$/)))
    return `<p class="why"><span class="lk ok">${m[1]}</span><span>${esc(m[2])}</span></p>`;
  if((m=t.match(/^([A-E]):\s*(.*)$/)))
    return `<p class="alt"><span class="lk">${m[1]}</span><span>${esc(m[2])}</span></p>`;
  if((m=t.match(/^(Takeaway|High yield|High-yield|Key point|Clues):\s*(.*)$/i)))
    return `<p class="take"><b>${esc(m[1])}.</b> ${esc(m[2])}</p>`;
  return `<p>${esc(t)}</p>`;
}

function renderQ(){

  const opts = q.o.map((o,i)=>{
    let c = "";

    const strikeBtn = done ? "" : `<button class="strike" data-s="${i}" aria-pressed="${struck}" aria-label="${struck?"Restore":"Strike out"} option ${L[i]}" title="${struck?"Restore":"Strike out"} option">${struck?"↺":"✕"}</button>`;
    return `<div class="optrow ${struck?"struck":""}"><button class="opt ${c}" data-i="${i}" ${done?"disabled":""}><span class="k">${L[i]}</span><span>${esc(o)}</span></button>${strikeBtn}</div>`;
  }).join("");

    const ok = a===q.a;
    const lines = q.e.split("\n").map(fmtLine).join("");

    fb = `<div class="fb" role="status"><div class="verdict ${ok?"ok":"bad"}">${ok?"Correct.":"Incorrect. The answer is "+L[q.a]+"."}</div>${lines}${objs}${triesLine(cur)}<div class="fbtools"><button class="btn ghost" id="redo">Reset and redo this question</button></div></div>`;

    <div class="opts">${opts}</div>${fb}
    <div class="nav"><button class="btn ghost" id="prev" ${cur===0?"disabled":""}>Previous</button>

  </article>`;
  document.querySelectorAll(".opt").forEach(b=>{
    b.onclick=()=>{ const p=+b.dataset.i; ans[cur]=p; tries[cur].push({pick:p, ok:p===q.a, at:new Date().toISOString()}); tries[cur]=tries[cur].slice(-10); strikes[cur]=[]; render(false); persist(); };

}

function toggleStrike(i){
  const s = strikes[cur], k = s.indexOf(i);
  if(k<0) s.push(i); else s.splice(k,1);
  render(false); persist();
}

function renderResults(){

  const rows = Object.entries(cats).map(([c,[r,t]])=>`<tr><td>${esc(c)}<span class="meter"><i style="width:${Math.round(100*r/t)}%"></i></span></td><td>${r} / ${t}</td></tr>`).join("");
  const missed = {};

    <div class="chead"><span class="tag">Results</span><span>${un?un+" unanswered":"Complete"}</span></div>

    <table><thead><tr><th>Topic</th><th>Score</th></tr></thead><tbody>${rows}</tbody></table>
    <h2>Objectives to review</h2><p class="hint">Includes questions you missed on the first try, even if a redo got them right.</p>${missHtml}${history.length?`<h2>Past attempts</h2><table><thead><tr><th>Date</th><th>Score</th></tr></thead><tbody>${history.slice().reverse().map(h=>`<tr><td>${new Date(h.date).toLocaleDateString()}</td><td>${h.score} / ${h.total}</td></tr>`).join("")}</tbody></table>`:""}
    <div class="nav"><button class="btn ghost" id="back">Back to questions</button><button class="btn" id="restart">Restart all</button></div>

  $("#back").onclick=()=>{showResults=false;render();};

}

function setSave(text, cls){ const el=$("#save"); if(el){ el.textContent=text; el.className="save "+(cls||""); } }
function bodyOf(){
  const a = {};
  QUESTIONS.forEach((q,i)=>{
    if(ans[i]===null && !tries[i].length && !strikes[i].length) return;
    a["q"+(i+1)] = {pick:ans[i], ok:ans[i]!==null && ans[i]===q.a, l:q.l, tries:tries[i], strikes:strikes[i]};
  });
  return {answers:a, history, total:N, answered:answered(), score:score(), firstTry:firstTryScore(), updatedAt:new Date().toISOString()};
}
function validPick(i,p){ return Number.isInteger(p) && p>=0 && p<QUESTIONS[i].o.length; }

    if(validPick(i,row.pick)) ans[i]=row.pick;
    if(Array.isArray(row.tries)) tries[i]=row.tries.filter(t=>t&&validPick(i,t.pick)).map(t=>({pick:t.pick, ok:t.pick===QUESTIONS[i].a, at:String(t.at||"")})).slice(-10);
    else if(ans[i]!==null) tries[i]=[{pick:ans[i], ok:ans[i]===QUESTIONS[i].a, at:""}];
    if(Array.isArray(row.strikes)) strikes[i]=row.strikes.filter(x=>validPick(i,x));
  }
  history = Array.isArray(d.history) ? d.history.slice(-20) : [];
  const first = ans.findIndex(x=>x===null); cur = first<0 ? N-1 : first;
}
function lsLoad(){ try{ return JSON.parse(localStorage.getItem(LS_KEY)||"null"); }catch(e){ return null; } }
function lsSave(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(bodyOf())); }catch(e){} }
async function persist(){
  lsSave();
  if(!db || !uid) return;
  dirty = true; if(writing) return; writing = true;
  while(dirty){
    dirty = false;
    setSave("Saving…");
    try{ await db.doc("attempts/"+uid).set(bodyOf()); setSave("Progress saved to your account.","ok"); }
    catch(e){
      if(e && e.code==="invalid_argument"){ db=null; setSave("Progress saves in this browser only.","bad"); break; }
      setSave("Could not save to your account. Progress saves in this browser.","bad");
    }
  }
  writing = false;
}
async function connect(){
  try{
    if(!window.claude || !window.claude.use) return;
    const [u, d] = await Promise.all([window.claude.use("user"), window.claude.use("db")]);
    if(!u || !d) return;
    const id = await u.id(); if(!id) return;
    db = d; uid = id;
    const snap = await db.doc("attempts/"+uid).get();
    if(snap.exists){ applySaved(snap.data()); render(); setSave("Progress saved to your account.","ok"); }
    else if(answered() || tries.some(t=>t.length)){ persist(); }
    else setSave("Progress saves to your account.","ok");
  }catch(e){ /* keep local-only mode */ }
}

function render(top=true){ renderHeader(); showResults?renderResults():renderQ(); if(top) window.scrollTo({top:0}); }
applySaved(lsLoad());
render();
connect();
</script>
