"Lateral geniculate nucleus", "Primary visual cortex"], "a": 2, "e": "C is correct. The visual pathway runs retina, optic nerves, optic chiasm, optic tract, lateral geniculate nucleus, optic radiation, then primary visual cortex.\nA: The basal ganglia integrate movement and are not on the visual pathway.\nB: The optic radiation follows the LGN.\nD: The primary visual cortex is the final stop.\nHigh yield: The occipital lobe gives meaning to visual stimulation.", "l": ["W7 6.2"]}, {"c": "Visual pathway", "p": "Two patients have visual field testing. Patient 1 has lost all vision in the right eye, and the left eye has full fields. Patient 2 has lost the left half of the visual field in both eyes. Which pairing of lesion sites fits, in order?", "o": ["Optic chiasm, then left optic radiation", "Right optic nerve, then right optic tract", "Right optic nerve, then left optic tract", "Right optic tract, then right optic nerve"], "a": 1, "e": "B is correct. A lesion before the chiasm affects one eye only, so Patient 1 has a right optic nerve lesion. Left hemifield information from both eyes runs in the right optic tract, so Patient 2 fits a right tract lesion.\nA: A chiasm lesion involves both eyes, and the left radiation carries the right hemifield.\nC: The left optic tract carries the right hemifield.\nD: This reverses the two.\nHigh yield: One eye affected: in front of the chiasm. Same hemifield in both eyes: behind it.", "l": ["W7 6.4", "W7 6.2"]}, {"c": "Lobes and grey matter", "p": "Mrs. Lavoie, 67, is right-hand dominant. After a stroke she follows complex spoken commands correctly but speaks in halting, effortful fragments and struggles to produce words. Where is the lesion most likely located?", "o": ["Occipital lobe, dominant hemisphere", "Inferior frontal lobe, dominant hemisphere", "Parietal lobe, non-dominant hemisphere", "Posterior temporal lobe, dominant hemisphere"], "a": 1, "e": "B is correct. She understands language but cannot produce it. Motor or expressive language sits in the inferior frontal lobe of the dominant hemisphere.\nA: The occipital lobe handles vision.\nC: The parietal lobe handles sensation, orientation and attention, not speech production.\nD: The posterior temporal lobe holds receptive language, which is intact here.\nHigh yield: Expressive: inferior frontal. Receptive: posterior temporal.", "l": ["W7 6.4", "W7 6.1"]}, {"c": "Lobes and grey matter", "p": "Mr. Osei, 72, speaks fluently after a stroke, but he cannot follow simple spoken instructions and his answers do not match the questions asked. His strength is normal. Which region is most likely affected?", "o": ["Posterior temporal lobe, dominant hemisphere", "Cerebellar hemispheres on both sides", "Inferior frontal lobe, dominant hemisphere", "Primary motor cortex, dominant hemisphere"], "a": 0, "e": "A is correct. Fluent speech with poor understanding is a receptive language problem, which localizes to the posterior temporal lobe of the dominant hemisphere.\nB: The cerebellum coordinates speech but does not affect understanding.\nC: The inferior frontal lobe holds expressive language, which is preserved here.\nD: A motor cortex lesion causes contralateral weakness, and his strength is normal.\nHigh yield: The temporal lobe handles auditory processing, language understanding and memory.", "l": ["W7 6.4", "W7 6.1"]}, {"c": "Lobes and grey matter", "p": "Two patients have head injuries. Patient 1 is no longer able to plan his day, solve simple problems or switch flexibly between tasks. Patient 2 loses track of where she is and has trouble attending to time and space. Which lobes are affected, in order?", "o": ["Temporal, then occipital", "Frontal, then temporal", "Frontal, then parietal", "Parietal, then frontal"], "a": 2, "e": "C is correct. Executive function (planning, problem solving, cognitive flexibility) is frontal. Orientation and attention in time and space are parietal.\nA: Temporal handles auditory processing and memory, and occipital handles vision.\nB: Orientation and attention in time and space are parietal, not temporal.\nD: This reverses the two.\nHigh yield: Frontal: motor, speech production, executive function.", "l": ["W7 6.1", "W7 6.4"]}, {"c": "Lobes and grey matter", "p": "Two deep grey matter structures are described. Structure 1 integrates cortical activity into a single movement. Structure 2 is a relay centre that integrates and processes sensory and motor information. Which pairing is correct, in order?", "o": ["Basal ganglia, then thalamus", "Basal ganglia, then limbic system", "Thalamus, then basal ganglia", "Cerebellum, then thalamus"], "a": 0, "e": "A is correct. The basal ganglia are deep nuclei that integrate cortical activity into a single movement. The thalamus is a relay centre for sensory and motor information.\nB: The limbic system (hippocampus, amygdala, cingulate) handles emotions and memory.\nC: This reverses the two.\nD: The cerebellum improves movement accuracy and coordination.\nHigh yield: Brain grey matter sits outside (cortex) and in deep nuclei.", "l": ["W7 6.1"]}, {"c": "Lobes and grey matter", "p": "A student reviews a brain specimen in the anatomy lab. Which statement about brain grey and white matter is correct?", "o": ["White matter lies on the outside of the brain, with grey inside", "Grey matter holds the axon tracts linking regions of the CNS", "The limbic system is a white matter tract that controls movement", "Cortex looks darker from dense neurons and little myelin"], "a": 3, "e": "D is correct. The cortex is darker because of its density of neurons and paucity of myelin. White matter is lighter because of myelin.\nA: In the brain, grey matter is outside and white matter inside. The cord is the reverse.\nB: Axon tracts make up white matter. Grey matter holds neuron cell bodies.\nC: The limbic system is grey matter (hippocampus, amygdala, cingulate) for emotions and memory.\nHigh yield: Cortical neurons are folded into gyri.", "l": ["W7 6.1"]}, {"c": "Motor control loops", "p": "Which sequence correctly traces a voluntary motor command from the brain to a muscle in the leg?", "o": ["Motor cortex, internal capsule, brainstem, pyramids, ventral grey horn", "Motor cortex, internal capsule, pyramids, brainstem, dorsal grey horn", "Cerebellum, internal capsule, brainstem, pyramids, ventral grey horn", "Motor cortex, brainstem, internal capsule, pyramids, ventral grey horn"], "a": 0, "e": "A is correct. Motor axons descend from the motor cortex through the internal capsule to the brainstem, cross in the pyramids of the medulla, descend in the cord to the ventral grey horn, then exit to the spinal nerve, peripheral nerve, NMJ and muscle.\nB: The pyramids sit in the medulla, part of the brainstem, and motor neurons sit in the ventral grey horn.\nC: Movement is planned in the motor cortex. The cerebellum refines it through feedback.\nD: The internal capsule comes before the brainstem.\nHigh yield: Motor cortex sits in the frontal lobe and plans movement for the contralateral side.", "l": ["W7 6.2"]}, {"c": "Motor control loops", "p": "A resident explains how movement is refined. Which statement is correct?", "o": ["Cerebellum and basal ganglia loop feedback back to the motor cortex", "The cerebellum controls timing and the basal ganglia improve accuracy", "The motor cortex sits in the parietal lobe of the brain", "Motor axons cross the midline within the internal capsule"], "a": 0, "e": "A is correct. Input from the cerebellum (improves accuracy) and the basal ganglia (control, integration, timing) loops back to the motor cortex to refine movement.\nB: This swaps the two roles.\nC: The motor cortex is in the frontal lobe.\nD: Motor axons cross in the pyramids of the medulla.\nHigh yield: Neither cerebellar nor basal ganglia lesions cause weakness.", "l": ["W7 6.2", "W7 6.1"]}, {"c": "Motor control loops", "p": "Mr. Kowalski, 59, has 6 months of slurred speech, choking on liquids and an unsteady, wide-based gait. Strength is full in all limbs, reflexes are normal and plantar responses are flexor. Where is the lesion most likely located?", "o": ["Neuromuscular junction", "Motor cortex", "Basal ganglia", "Cerebellum"], "a": 3, "e": "D is correct. The cerebellum coordinates speech, swallowing, limbs and gait. Its lesions cause problems with coordination without weakness.\nA: The NMJ affects eyes and swallowing but causes weakness, and strength is full here.\nB: A motor cortex lesion causes contralateral weakness with UMN signs.\nC: Basal ganglia problems cause slowness, rigidity or excess movement, not loss of coordination of speech and gait.\nHigh yield: Chronic course: think degenerative or hereditary.", "l": ["W7 6.4", "W7 6.3"]}, {"c": "Motor control loops", "p": "Mrs. Ito, 61, has developed brief, involuntary, dance-like jerks of her limbs. Strength, reflexes and coordination testing are normal. Which statement about the most likely site of dysfunction is correct?", "o": ["It causes the wide-based gait seen with poor coordination", "It sits in the occipital lobe and limbic system", "It also causes slowness and rigidity in other patients", "It causes contralateral weakness with brisk reflexes"], "a": 2, "e": "C is correct. Excessive movements such as chorea come from basal ganglia dysfunction. The same structures cause difficulty initiating movement, slowness and rigidity (parkinsonism). Neither pattern includes weakness.\nA: Poor coordination of gait is cerebellar.\nB: The basal ganglia are deep nuclei, not occipital or limbic structures.\nD: Basal ganglia dysfunction does NOT cause weakness.\nHigh yield: Basal ganglia excess movements: chorea, dystonia, athetosis, hemiballismus.", "l": ["W7 6.2", "W7 6.5"]}, {"c": "Localization", "p": "Ms. Brandt, 45, has double vision and difficulty swallowing. She also has weakness of the right arm and leg with hyperactive reflexes and an extensor plantar response on the right. Where is the lesion most likely located?", "o": ["Cerebellum", "Cervical spinal cord", "Neuromuscular junction", "Brainstem"], "a": 3, "e": "D is correct. The brainstem houses all cranial nerve nuclei and carries the motor tracts. Cranial nerve signs plus UMN limb signs place the lesion there.\nA: Cerebellar lesions do not cause weakness.\nB: A cord lesion spares the cranial nerves.\nC: The NMJ affects eyes and swallowing, but the brisk reflexes and extensor plantar are UMN signs.\nHigh yield: Eyes and swallowing with LMN signs: NMJ. With UMN signs: brainstem.", "l": ["W7 6.4", "W7 6.3"]}, {"c": "Localization", "p": "A small stroke damages Mr. Ruiz's right thalamus. Both the dorsal column and the spinothalamic pathways pass through it. Which sensory loss is expected?", "o": ["Left side pain, with right side vibration", "Right side, for vibration and for pain", "Left side, for vibration and for pain", "Right side pain, with left side vibration"], "a": 2, "e": "C is correct. The spinothalamic tract crosses at entry to the cord and the dorsal column crosses in the medulla. By the thalamus, both carry the opposite side of the body, so a right thalamic lesion affects all modalities on the left.\nA: This split pattern only arises in the spinal cord, before the dorsal column crosses.\nB: Both tracts have crossed below the thalamus.\nD: This split also needs a cord lesion, on the opposite side.\nHigh yield: Sensory pathway: nerves, roots, cord, brainstem, thalamus, white matter, primary sensory cortex.", "l": ["W7 6.2", "W7 6.4"]}, {"c": "Localization", "p": "A patient has right-sided weakness with hyperactive reflexes, spasticity and an extensor plantar response. Which additional finding most specifically places this UMN lesion in the brain rather than the spinal cord?", "o": ["Word-finding and language impairment", "No fasciculations on examination", "Absence of muscle atrophy on the right side", "Hyperactive reflexes in both legs"], "a": 0, "e": "A is correct. Language lives in the frontal and temporal lobes, so language impairment places a UMN lesion in the brain. Neglect is another brain clue.\nB: Absent fasciculations is a general UMN sign.\nC: Absent atrophy is a general UMN sign and does not separate brain from cord.\nD: Hyperactive reflexes are a general UMN sign found with brain or cord lesions.\nHigh yield: More specific UMN clues: language impairment, neglect, bladder symptoms.", "l": ["W7 6.4", "W7 6.3"]}, {"c": "Localization", "p": "Two patients present with left arm weakness. Patient 1's weakness came on over a few seconds while gardening. Patient 2's weakness has crept up slowly over 2 years, and her mother had a similar illness. Which time-course category and leading cause fits each, in order?", "o": ["Hyperacute trauma, then subacute toxic", "Hyperacute stroke, then chronic hereditary", "Subacute inflammation, then chronic stroke", "Acute infection, then subacute tumour growth"], "a": 1, "e": "B is correct. Seconds to minutes is hyperacute, which includes stroke. Many months to years is chronic, which includes degenerative and hereditary causes. The family history favours hereditary.\nA: Nothing suggests trauma, and 2 years is chronic, not subacute.\nC: Stroke is hyperacute, not chronic.\nD: Acute is hours to days, and subacute is days to weeks.\nHigh yield: Hyperacute: stroke, migraine aura, trauma. Chronic: degenerative, hereditary.", "l": ["W7 6.5"]}, {"c": "Localization", "p": "Mr. Bianchi, 78, has 8 months of a shuffling gait disturbance, new urinary incontinence and worsening memory. He takes no anticoagulants and has no cancer history. What is the most appropriate next step and the structural concern?", "o": ["MoCA only, as imaging is reserved for age under 60", "No imaging, as this is a typical slow memory decline", "Neuroimaging, for hydrocephalus from blocked CSF flow", "Neuroimaging, for a lesion of the occipital lobe"], "a": 2, "e": "C is correct. Gait disturbance with urinary incontinence suggests normal pressure hydrocephalus, an indication for neuroimaging. Hydrocephalus results when CSF flow through the ventricles is blocked.\nA: Age under 60 is one indication. NPH is a separate one.\nB: Gait disturbance with incontinence is not typical memory decline.\nD: The occipital lobe handles vision, which is not affected here.\nHigh yield: BRAIN: bleeding risk, abnormal presentation, intracranial lesion, NPH.", "l": ["W7 7.5", "W7 6.1"]}, {"c": "Cranial autonomics", "p": "A tutor reviews the cranial part of the parasympathetic system that drives lacrimation and salivation. Which statement is correct?", "o": ["Pre-synaptic fibres arise from the nuclei of CN V", "Post-synaptic fibres travel with CN V to their targets", "Its ganglia lie far from targets, beside the spinal cord", "Its pre-synaptic neurons are short and post-synaptic long"], "a": 1, "e": "B is correct. Pre-synaptic fibres from CN III, VII and IX reach the ciliary, pterygopalatine, otic and submandibular ganglia. Post-synaptic fibres then travel with CN V to the target.\nA: CN V carries the post-synaptic fibres. The pre-synaptic fibres come from CN III, VII and IX.\nC: Parasympathetic ganglia lie close to the target.\nD: Parasympathetic pre-synaptic neurons are long and post-synaptic short.\nHigh yield: Craniosacral outflow: CN III, VII, IX, vagus (from the medulla) and pelvic splanchnics (S2-4).", "l": ["W5 9.7"]}, {"c": "Cranial autonomics", "p": "Which pairing correctly matches the division of the autonomic nervous system to each effect, in order: dilation of the pupils, then increased salivation?", "o": ["Parasympathetic for both of the effects", "Sympathetic for both of the effects", "Parasympathetic, then sympathetic", "Sympathetic, then parasympathetic"], "a": 3, "e": "D is correct. Fight or flight (SNS) dilates the pupils. Rest and digest (PNS) drives lacrimation, salivation, urination, digestion and defecation.\nA: Pupil dilation is a fight or flight function.\nB: Salivation is a rest and digest function.\nC: This reverses the two.\nHigh yield: The vagus carries parasympathetic output to thoracic and abdominal viscera from the medulla.", "l": ["W5 9.7", "W5 9.2"]}];

  $("#stats").innerHTML = `<span>Item <b>${showResults?"–":cur+1}</b> of <b>${N}</b></span><span>Answered <b>${answered()}</b></span><span>Score <b>${score()} / ${answered()}</b></span>`;
  $("#ticks").innerHTML = QUESTIONS.map((q,i)=>{
    const st = ans[i]===null?"":(ans[i]===q.a?"ok":"bad");
    const redo = tries[i].length>1 || (ans[i]===null && tries[i].length>0);
    return `<button class="tick ${st} ${redo?"redo":""} ${(!showResults&&i===cur)?"cur":""}" data-i="${i}" aria-label="Question ${i+1}"></button>`;
  }).join("");
  document.querySelectorAll(".tick").forEach(b=>b.onclick=()=>{cur=+b.dataset.i;showResults=false;render();});
}

function triesLine(i, includeCurrent){
  const t = includeCurrent ? tries[i] : tries[i];
  if(!t.length) return "";
  const parts = t.map((x,k)=>`<span class="${x.ok?"ok":"bad"}">${k+1}: ${L[x.pick]} ${x.ok?"correct":"wrong"}</span>`).join(" · ");
  return `<div class="tries">Attempts ${parts}</div>`;
}

function renderQ(){
  const q = QUESTIONS[cur], a = ans[cur], done = a!==null, st = strikes[cur];
  const opts = q.o.map((o,i)=>{
    let c = "";
    if(done){ if(i===q.a) c="right"; else if(i===a) c="wrong"; }
    const struck = !done && st.includes(i);
    const strikeBtn = done ? "" : `<button class="strike" data-s="${i}" aria-pressed="${struck}" aria-label="${struck?"Restore":"Strike out"} option ${L[i]}" title="${struck?"Restore":"Strike out"} option">${struck?"↺":"✕"}</button>`;
    return `<div class="optrow ${struck?"struck":""}"><button class="opt ${c}" data-i="${i}" ${done?"disabled":""}><span class="k">${L[i]}</span><span>${esc(o)}</span></button>${strikeBtn}</div>`;
  }).join("");
  let fb = "";
  if(done){
    const ok = a===q.a;
    const lines = q.e.split("\n").map(t=>`<p>${esc(t)}</p>`).join("");
    const objs = q.l.map(id=>`<div class="obj">Objective: ${esc(id)}. ${esc(OBJECTIVES[id]||"")}</div>`).join("");
    fb = `<div class="fb" role="status"><div class="verdict ${ok?"ok":"bad"}">${ok?"Correct.":"Incorrect. The answer is "+L[q.a]+"."}</div>${lines}${objs}${triesLine(cur)}<div class="fbtools"><button class="btn ghost" id="redo">Reset and redo this question</button></div></div>`;
  }
  const pre = (!done && tries[cur].length) ? `<div class="hint">Redo. Your earlier attempts are saved.</div>${triesLine(cur)}` : (!done ? `<div class="hint">Tap ✕ to strike out an option. Right-click works too.</div>` : "");
  const last = cur===N-1;
  $("#main").innerHTML = `<article class="card">
    <div class="chead"><span class="tag">${esc(q.c)}</span><span>Q${cur+1}</span></div>
    <p class="stem">${esc(q.p)}</p>
    ${pre}
    <div class="opts">${opts}</div>${fb}
    <div class="nav"><button class="btn ghost" id="prev" ${cur===0?"disabled":""}>Previous</button>
    <button class="btn" id="next" ${done?"":"disabled"}>${last?"See results":"Next"}</button></div>
  </article>`;
  document.querySelectorAll(".opt").forEach(b=>{
    b.onclick=()=>{ const p=+b.dataset.i; ans[cur]=p; tries[cur].push({pick:p, ok:p===q.a, at:new Date().toISOString()}); tries[cur]=tries[cur].slice(-10); strikes[cur]=[]; render(false); persist(); };
    b.oncontextmenu=(e)=>{ if(done) return; e.preventDefault(); toggleStrike(+b.dataset.i); };
  });
  document.querySelectorAll(".strike").forEach(b=>b.onclick=()=>toggleStrike(+b.dataset.s));
  const r=$("#redo"); if(r) r.onclick=()=>{ ans[cur]=null; strikes[cur]=[]; render(false); persist(); };
  $("#prev").onclick=()=>{cur--;render();};
  $("#next").onclick=()=>{ if(last){showResults=true;} else cur++; render(); };
}

function toggleStrike(i){
  const s = strikes[cur], k = s.indexOf(i);
  if(k<0) s.push(i); else s.splice(k,1);
  render(false); persist();
}

function renderResults(){
  const s = score(), pct = Math.round(100*s/N);
  const cats = {};
  QUESTIONS.forEach((q,i)=>{ cats[q.c]=cats[q.c]||[0,0]; cats[q.c][1]++; if(ans[i]===q.a) cats[q.c][0]++; });
  const rows = Object.entries(cats).map(([c,[r,t]])=>`<tr><td>${esc(c)}</td><td>${r} / ${t}</td></tr>`).join("");
  const missed = {};
  QUESTIONS.forEach((q,i)=>{ const wrongFirst = tries[i].length && !tries[i][0].ok; if(ans[i]!==q.a || wrongFirst) q.l.forEach(id=>{ const w=id.split(" ")[0]; missed[w]=missed[w]||new Set(); missed[w].add(id); }); });
  const weeks = Object.keys(missed).sort((x,y)=>parseInt(x.slice(1))-parseInt(y.slice(1)));
  const missHtml = weeks.length ? weeks.map(w=>`<h3>Week ${w.slice(1)}</h3><ul class="miss">${[...missed[w]].map(id=>`<li><code>${esc(id)}</code>${esc(OBJECTIVES[id]||"")}</li>`).join("")}</ul>`).join("") : "<p>No missed objectives.</p>";
  const redone = tries.filter(t=>t.length>1).length;
  const un = N - answered();
  $("#main").innerHTML = `<article class="card">
    <div class="chead"><span class="tag">Results</span><span>${un?un+" unanswered":"Complete"}</span></div>
    <div><div class="big">${s} / ${N}</div><div class="stats"><span><b>${pct}%</b> correct now</span><span>First try <b>${firstTryScore()} / ${firstTryCount()}</b></span><span>Redone <b>${redone}</b></span></div></div>
    <table><thead><tr><th>Category</th><th>Score</th></tr></thead><tbody>${rows}</tbody></table>
    <h2>Objectives to review</h2><p class="hint">Includes questions you missed on the first try, even if a redo got them right.</p>${missHtml}${history.length?`<h2>Past attempts</h2><table><thead><tr><th>Date</th><th>Score</th></tr></thead><tbody>${history.slice().reverse().map(h=>`<tr><td>${new Date(h.date).toLocaleDateString()}</td><td>${h.score} / ${h.total}</td></tr>`).join("")}</tbody></table>`:""}
    <div class="nav"><button class="btn ghost" id="back">Back to questions</button><button class="btn" id="restart">Restart all</button></div>
  </article>`;
  $("#back").onclick=()=>{showResults=false;render();};
  $("#restart").onclick=()=>{
    if(answered() || tries.some(t=>t.length)){
      history.push({date:new Date().toISOString(), score:score(), answered:answered(), total:N, firstTry:firstTryScore(),
        missed:QUESTIONS.map((q,i)=>ans[i]!==null&&ans[i]!==q.a?"q"+(i+1):null).filter(Boolean)});
      history=history.slice(-20);
    }
    ans.fill(null); tries=QUESTIONS.map(()=>[]); strikes=QUESTIONS.map(()=>[]); cur=0; showResults=false; render(); persist();
  };
}

function setSave(text, cls){ const el=$("#save"); if(el){ el.textContent=text; el.className="save "+(cls||""); } }
function bodyOf(){
  const a = {};
  QUESTIONS.forEach((q,i)=>{
    if(ans[i]===null && !tries[i].length && !strikes[i].length) return;
    a["q"+(i+1)] = {pick:ans[i], ok:ans[i]!==null && ans[i]===q.a, l:q.l, tries:tries[i], strikes:strikes[i]};
  });
  return {answers:a, history, total:N, answered:answered(), score:score(), firstTry:firstTryScore(), updatedAt:new Date().toISOString()};
}
function validPick(i,p){ return Number.isInteger(p) && p>=0 && p<QUESTIONS[i].o.length; }
function applySaved(d){
  if(!d || typeof d!=="object") return;
  ans.fill(null); tries=QUESTIONS.map(()=>[]); strikes=QUESTIONS.map(()=>[]);
  const a = d.answers || {};
  for(const k in a){
    const i = parseInt(k.slice(1),10)-1, row = a[k];
    if(!(i>=0 && i<N) || !row || typeof row!=="object") continue;
    if(validPick(i,row.pick)) ans[i]=row.pick;
    if(Array.isArray(row.tries)) tries[i]=row.tries.filter(t=>t&&validPick(i,t.pick)).map(t=>({pick:t.pick, ok:t.pick===QUESTIONS[i].a, at:String(t.at||"")})).slice(-10);
    else if(ans[i]!==null) tries[i]=[{pick:ans[i], ok:ans[i]===QUESTIONS[i].a, at:""}];
    if(Array.isArray(row.strikes)) strikes[i]=row.strikes.filter(x=>validPick(i,x));
  }
  history = Array.isArray(d.history) ? d.history.slice(-20) : [];
  const first = ans.findIndex(x=>x===null); cur = first<0 ? N-1 : first;
}
function lsLoad(){ try{ return JSON.parse(localStorage.getItem(LS_KEY)||"null"); }catch(e){ return null; } }
function lsSave(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(bodyOf())); }catch(e){} }
async function persist(){
  lsSave();
  if(!db || !uid) return;
  dirty = true; if(writing) return; writing = true;
  while(dirty){
    dirty = false;
    setSave("Saving…");
    try{ await db.doc("attempts/"+uid).set(bodyOf()); setSave("Progress saved to your account.","ok"); }
    catch(e){
      if(e && e.code==="invalid_argument"){ db=null; setSave("Progress saves in this browser only.","bad"); break; }
      setSave("Could not save to your account. Progress saves in this browser.","bad");
    }
  }
  writing = false;
}
async function connect(){
  try{
    if(!window.claude || !window.claude.use) return;
    const [u, d] = await Promise.all([window.claude.use("user"), window.claude.use("db")]);
    if(!u || !d) return;
    const id = await u.id(); if(!id) return;
    db = d; uid = id;
    const snap = await db.doc("attempts/"+uid).get();
    if(snap.exists){ applySaved(snap.data()); render(); setSave("Progress saved to your account.","ok"); }
    else if(answered() || tries.some(t=>t.length)){ persist(); }
    else setSave("Progress saves to your account.","ok");
  }catch(e){ /* keep local-only mode */ }
}

function render(top=true){ renderHeader(); showResults?renderResults():renderQ(); if(top) window.scrollTo({top:0}); }
applySaved(lsLoad());
render();
connect();
</script>

</body></html>
