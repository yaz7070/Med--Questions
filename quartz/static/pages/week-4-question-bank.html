<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Week 4 Question Bank</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;600;700&display=swap">
<style>
/* Nexus quiz page. Matches the site: neutral greys, one typeface, and the block's colour as --accent. */
:root{
  --bg:#f5f6f8;--paper:#ffffff;--ink:#15181d;--muted:#4d5560;--faint:#7b828d;--line:#e0e3e8;
  --accent:#0b7a75;--soft:#eef0f3;
  --ok:#1d7a46;--okw:#e7f4ec;--bad:#b42318;--badw:#fcecea;--tick:#dfe2e7;
  --display:"Atkinson Hyperlegible Next","Segoe UI",system-ui,-apple-system,sans-serif;
  --body:"Atkinson Hyperlegible Next","Segoe UI",system-ui,-apple-system,sans-serif;
  --r:8px;
}
:root[data-b="2"]{--accent:#4f46c8}:root[data-b="3"]{--accent:#a3246b}:root[data-b="4"]{--accent:#a35f08}
:root[data-theme="dark"]{
  --bg:#14161a;--paper:#1b1e24;--ink:#eceef2;--muted:#b3bac5;--faint:#8a919c;--line:#2d323b;
  --accent:#45c2b8;--soft:#252930;
  --ok:#5ccf8f;--okw:#13301f;--bad:#f2877c;--badw:#3a1c1a;--tick:#30353e;color-scheme:dark}
:root[data-theme="dark"][data-b="2"]{--accent:#a49df6}:root[data-theme="dark"][data-b="3"]{--accent:#ef8ec0}:root[data-theme="dark"][data-b="4"]{--accent:#e3a548}
.btn:hover:not(:disabled){filter:brightness(.92)}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55}
.wrap{max-width:820px;margin:0 auto;padding-block:28px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:20px}

/* Header */
header{display:flex;flex-direction:column;gap:10px}
.context{margin:0;color:var(--faint);font-size:14px;font-weight:600}
h1{font-family:var(--display);font-weight:700;font-size:clamp(28px,5vw,40px);line-height:1.05;letter-spacing:-.02em;margin:0;text-wrap:balance}
.stats{display:flex;flex-wrap:wrap;gap:6px 22px;font-size:15px;color:var(--muted);font-variant-numeric:tabular-nums}
.stats b{color:var(--ink);font-weight:700}
.bar{height:6px;border-radius:999px;background:var(--tick);overflow:hidden}
.bar span{display:block;height:100%;width:0;background:var(--accent);border-radius:999px;transition:width .25s ease}
.map summary{cursor:pointer;color:var(--accent);font-weight:600;font-size:14px;width:max-content;list-style:none;padding:2px 0}
.map summary::-webkit-details-marker{display:none}
.map summary::before{content:"▸";display:inline-block;margin-right:6px;transition:transform .15s ease}
.map[open] summary::before{transform:rotate(90deg)}
.map summary:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:4px}
.ticks{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}
.tick{width:14px;height:14px;border:0;border-radius:4px;background:var(--tick);padding:0;cursor:pointer}
.tick:hover{background:var(--faint)}
.tick.ok{background:var(--ok)}.tick.bad{background:var(--bad)}
.tick.cur{outline:2px solid var(--accent);outline-offset:2px}
.tick.redo{box-shadow:inset 0 -3px 0 var(--accent)}
.tick:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.save{font-size:13px;color:var(--faint)}
.save.ok{color:var(--ok)}.save.bad{color:var(--bad)}

/* Question card */
.card{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:26px;display:flex;flex-direction:column;gap:18px}
.chead{display:flex;justify-content:space-between;align-items:center;gap:10px}
.tag{font-size:13px;font-weight:700;color:var(--accent);background:var(--soft);padding:3px 9px;border-radius:4px}
.qn{font-family:var(--display);font-weight:700;font-size:15px;color:var(--faint);font-variant-numeric:tabular-nums}
.stem{font-size:18.5px;line-height:1.6;margin:0;white-space:pre-line;max-width:70ch}
.hint{font-size:13px;color:var(--faint)}
.tries{font-size:13px;color:var(--muted)}
.tries .bad{color:var(--bad);font-weight:600}.tries .ok{color:var(--ok);font-weight:600}

/* Options */
.opts{display:flex;flex-direction:column;gap:10px}
.optrow{display:flex;gap:8px;align-items:stretch}
.optrow .opt{flex:1;min-width:0}
.opt{display:flex;gap:14px;align-items:center;text-align:left;width:100%;background:var(--paper);color:var(--ink);border:1.5px solid var(--line);border-radius:var(--r);padding:12px 16px;font:inherit;font-size:16.5px;line-height:1.45;cursor:pointer;transition:border-color .12s ease,background .12s ease}
.opt:hover:not(:disabled){border-color:var(--accent);background:var(--soft)}
.opt:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.opt:disabled{cursor:default}
.opt .k{flex:none;display:inline-grid;place-items:center;width:30px;height:30px;border-radius:6px;background:var(--soft);color:var(--accent);font-family:var(--display);font-weight:700;font-size:14px}
.opt.right{border-color:var(--ok);background:var(--okw)}
.opt.right .k{background:var(--ok);color:var(--paper)}
.opt.wrong{border-color:var(--bad);background:var(--badw)}
.opt.wrong .k{background:var(--bad);color:var(--paper)}
.strike{flex:none;width:44px;border:1.5px solid var(--line);border-radius:var(--r);background:var(--paper);color:var(--faint);font-size:14px;cursor:pointer;display:grid;place-items:center}
.strike:hover{border-color:var(--accent);color:var(--accent)}
.strike:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.strike[aria-pressed="true"]{background:var(--soft);color:var(--ink)}
.optrow.struck .opt > span:last-child{text-decoration:line-through;color:var(--faint)}
.optrow.struck .opt .k{opacity:.45}

/* Feedback */
.fb{background:var(--bg);border-radius:var(--r);padding:18px 20px;display:flex;flex-direction:column;gap:10px}
.verdict{font-family:var(--display);font-weight:700;font-size:18px;display:flex;align-items:center;gap:8px}
.verdict::before{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;font-size:13px;color:var(--paper)}
.verdict.ok{color:var(--ok)}.verdict.ok::before{content:"✓";background:var(--ok)}
.verdict.bad{color:var(--bad)}.verdict.bad::before{content:"✕";background:var(--bad)}
.fb p{margin:0;max-width:72ch}
.fb .why,.fb .alt{display:flex;gap:10px;align-items:baseline}
.fb .why{font-weight:600}
.lk{flex:none;display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--line);color:var(--muted);font-family:var(--display);font-weight:700;font-size:12px;transform:translateY(-1px)}
.lk.ok{background:var(--ok);color:var(--paper)}
.fb .alt{color:var(--muted)}
.fb .take{border-left:3px solid var(--accent);padding:2px 0 2px 12px;color:var(--ink)}
.fb .take b{color:var(--accent)}
.obj{font-size:13.5px;color:var(--faint);line-height:1.5}
.obj b{color:var(--muted)}
.fbtools{display:flex;justify-content:flex-end}

/* Buttons */
.nav{display:flex;justify-content:space-between;gap:10px}
.btn{font-family:var(--display);font-weight:700;font-size:15px;padding:10px 20px;border:1.5px solid var(--accent);border-radius:6px;background:var(--accent);color:var(--paper);cursor:pointer}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.ghost:hover:not(:disabled){background:var(--soft);color:var(--accent);border-color:var(--accent)}
.btn:disabled{opacity:.35;cursor:default}
.btn:focus-visible{outline:2px solid var(--ink);outline-offset:3px}

/* Results */
.big{font-family:var(--display);font-size:clamp(48px,9vw,72px);font-weight:700;line-height:1;letter-spacing:-.03em;color:var(--accent);font-variant-numeric:tabular-nums}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
td,th{text-align:left;padding:9px 0;border-bottom:1px solid var(--line);font-size:15px;vertical-align:middle}
th{font-size:13px;font-weight:700;color:var(--faint)}
td:last-child,th:last-child{text-align:right;white-space:nowrap;padding-left:12px}
.meter{display:block;height:5px;border-radius:999px;background:var(--tick);margin-top:6px;max-width:320px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent);border-radius:999px}
h2{font-family:var(--display);font-size:21px;font-weight:700;margin:6px 0 0}
h3{font-size:14px;font-weight:700;color:var(--faint);margin:6px 0 0}
.miss{margin:0;padding-left:0;list-style:none;display:flex;flex-direction:column;gap:8px;font-size:15px}
.miss code{font-family:var(--display);font-weight:700;font-size:13px;color:var(--bad);background:var(--badw);padding:1px 7px;border-radius:999px;margin-right:8px}

@media (max-width:560px){.card{padding:18px}.stem{font-size:17.5px}.opt{padding:11px 12px;gap:10px}.strike{width:40px}}
@media (prefers-reduced-motion:no-preference){.fb{animation:in .2s ease-out}@keyframes in{from{opacity:.3;transform:translateY(4px)}to{opacity:1;transform:none}}}
@media (prefers-reduced-motion:reduce){.bar span,.opt,.map summary::before{transition:none}}
</style>

<script>
/* Block colour, and the same light or dark choice as the site's toggle. */
(function(){
  const r=document.documentElement; r.dataset.b="1";
  function theme(){ let t=null; try{ t=localStorage.getItem("theme"); }catch(e){}
    r.dataset.theme = t || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"); }
  theme(); addEventListener("storage",theme);
})();
</script>

<script>
const QUESTIONS = [{"c": "Immunology & Vaccines", "p": "A researcher describes a first-time immune response to a novel virus in an unvaccinated person: it begins within hours, is triggered by generic molecular patterns rather than a specific antigen, and creates no lasting memory. Contrast this with what happens after immunization against the same virus. Which pairing correctly matches these descriptions to their immune categories?", "o": ["This is adaptive immunity, a vaccine instead triggers innate immunity, which is slower but longer lasting", "This is innate immunity, recognizing PAMPs/DAMPs via pattern recognition receptors without immunologic memory, a vaccine engages adaptive immunity, which is antigen-specific and produces memory B and T cells", "Both descriptions describe adaptive immunity at different time points", "Both descriptions describe innate immunity, since vaccines only stimulate innate pathways"], "a": 1, "e": "Correct: B. Rapid, non-specific, memory-less response to generic danger signals is innate immunity. Vaccines work by engaging the adaptive system, which is antigen-specific, takes time to develop, and produces lasting memory B and T cells.", "l": []}, {"c": "Immunology & Vaccines", "p": "A pathologist examines a lymph node biopsy and notes dendritic cells presenting peptides derived from an extracellular bacterium to CD4 T-helper cells, using a specific class of surface molecule. Which MHC class and antigen-processing pathway does this describe?", "o": ["MHC Class II, presenting exogenous peptides taken up by phagocytosis to CD4 T-cells", "MHC Class I, presenting endogenous cytosolic peptides to CD8 T-cells", "MHC Class II, expressed on all nucleated cells and presenting to CD8 T-cells", "MHC Class I, presenting peptides to CD4 T-cells"], "a": 0, "e": "Correct: A. MHC Class II presents exogenous antigen (taken up by phagocytosis) to CD4 T-cells, and is expressed mainly on antigen-presenting immune cells like dendritic cells and macrophages, unlike MHC Class I, which is on all nucleated cells and presents endogenous peptides to CD8 T-cells.", "l": []}, {"c": "Immunology & Vaccines", "p": "A virally infected cell displays altered self-peptides on a receptor expressed on essentially all nucleated cells, these are recognized by cytotoxic T-cells, which then release perforin and granzyme to kill the infected cell. Which molecule is responsible for presenting these peptides?", "o": ["A Toll-like receptor", "MHC Class II", "A B-cell receptor", "MHC Class I"], "a": 3, "e": "Correct: D. MHC Class I is expressed on all nucleated cells and presents endogenous (often self or intracellular pathogen-derived) peptides, allowing CD8 cytotoxic T-cells to recognize and kill infected cells.", "l": []}, {"c": "Immunology & Vaccines", "p": "A child receives pooled human antibodies immediately after a high-risk exposure to hepatitis A, while another child receives a vaccine series months before travel to an endemic country. Which statement correctly distinguishes these two forms of protection?", "o": ["Both provide long-lasting, memory-based protection", "The vaccine provides passive immunity, while the antibody preparation provides active immunity", "The antibody preparation provides passive immunity that is immediate but short-lived, while the vaccine provides active immunity that takes time to develop but can last years", "Both are examples of innate immunity"], "a": 2, "e": "Correct: C. Immunoglobulin transfer is passive immunity: immediate protection that fades without producing memory. Vaccination is active immunity: slower to develop since it requires the body to mount its own response, but capable of lasting years via memory B and T cells.", "l": []}, {"c": "Immunology & Vaccines", "p": "A 4-year-old with a diagnosed T-cell immunodeficiency is due for her MMR and varicella vaccines. Her physician holds off on giving them. Which principle explains this decision?", "o": ["MMR and varicella are inactivated vaccines and pose no risk to this child", "All vaccines are equally safe regardless of immune status", "Inactivated vaccines are contraindicated in immunocompromised patients", "Live attenuated vaccines are contraindicated in immunocompromised patients due to the risk of vaccine-strain disease"], "a": 3, "e": "Correct: D. MMR and varicella are live attenuated vaccines. In an immunocompromised host, the weakened pathogen can potentially replicate enough to cause vaccine-strain disease, so these are generally contraindicated in that population.", "l": []}, {"c": "Immunology & Vaccines", "p": "A public health team is planning vaccination coverage targets for a highly transmissible respiratory virus with a very high basic reproduction number (R0), such as measles, compared to a less transmissible disease. What does this imply about the vaccination coverage needed to achieve herd immunity?", "o": ["A lower proportion of the population needs to be immunized to interrupt transmission", "Herd immunity cannot be achieved for any disease with a high R0", "A higher proportion of the population needs to be immunized to interrupt transmission, since more susceptible contacts must be protected to break chains of spread", "Herd immunity is unaffected by R0 and depends only on vaccine safety"], "a": 2, "e": "Correct: C. The immunization coverage required for herd immunity rises with transmissibility (R0). Highly infectious diseases like measles require higher population immunity to interrupt spread than less transmissible diseases.", "l": []}, {"c": "Immunology & Vaccines", "p": "A vaccine researcher compares two candidate vaccines: one uses a killed whole bacterium, and the other uses a live, weakened viral strain. Which statement correctly contrasts their general properties?", "o": ["The killed vaccine produces broader, longer-lasting immunity than the live vaccine", "The live attenuated vaccine tends to produce a stronger, more durable immune response resembling natural infection, but requires careful storage and is contraindicated in immunocompromised or pregnant patients, the inactivated vaccine is safer in these groups but may need adjuvants and booster doses", "Both vaccine types carry an identical risk of causing vaccine-strain disease", "Inactivated vaccines cannot be used in healthy patients"], "a": 1, "e": "Correct: B. Live attenuated vaccines mimic natural infection and often give broader, longer immunity, but are unstable and contraindicated in immunocompromised or pregnant patients. Inactivated vaccines are safer in those groups but generally produce a less robust response, often needing adjuvants and boosters.", "l": []}, {"c": "Immunology & Vaccines", "p": "A 9-month-old, unvaccinated against measles, is exposed to a confirmed case within the household yesterday. She is otherwise healthy and immunocompetent. Which post-exposure option is most appropriate for her, given her age and the timing of exposure?", "o": ["MMR vaccine, since she is over 6 months of age, immunocompetent, and within the 72-hour window", "No post-exposure prophylaxis exists for measles", "Immunoglobulin only, since she is under 12 months and therefore too young for vaccine-based post-exposure prophylaxis", "Immunoglobulin is contraindicated in infants and cannot be used"], "a": 0, "e": "Correct: A. Measles post-exposure vaccine is appropriate for immunocompetent contacts over 6 months of age within 72 hours of exposure. Immunoglobulin is reserved for immunocompromised patients, pregnant women, and infants under 6 months, this child is 9 months old and immunocompetent, so vaccine is the correct choice.", "l": []}, {"c": "Immunology & Vaccines", "p": "A previously unvaccinated hiker sustains a bite from a bat while spelunking. What is the appropriate post-exposure approach for rabies?", "o": ["Vaccine only, no immunoglobulin is needed", "Immunoglobulin as soon as possible, plus a 4-dose vaccine primary series (5 doses if immunosuppressed), both started as soon as possible", "Wait 30 days before starting any prophylaxis", "No prophylaxis is needed unless symptoms develop"], "a": 1, "e": "Correct: B. For an unvaccinated person with a high-risk rabies exposure, post-exposure prophylaxis includes immunoglobulin as soon as possible plus a vaccine primary series started immediately (4 doses, or 5 if immunosuppressed).", "l": []}, {"c": "Immunology & Vaccines", "p": "Which vaccine is the only oral vaccine included in the routine Canadian immunization schedule, and what is a key counselling point for caregivers of a recently vaccinated infant?", "o": ["Oral polio vaccine, caregivers should isolate the infant for 1 month", "Oral typhoid vaccine, shedding lasts only 24 hours", "BCG vaccine, no viral shedding occurs with this vaccine", "Rotavirus vaccine, healthy vaccinated children can shed vaccine virus in stool for up to 1 month, which matters for hygiene around immunocompromised household contacts"], "a": 3, "e": "Correct: D. Rotavirus is the only oral vaccine on the routine Canadian schedule. Healthy vaccinated infants can shed vaccine virus in stool for up to a month, which is relevant when there are immunocompromised contacts in the household.", "l": []}, {"c": "Immunology & Vaccines", "p": "A teenager who completed his full childhood vaccination series develops a prolonged cough and is diagnosed with pertussis. He never received his adolescent booster. Which explanation best accounts for this breakthrough infection?", "o": ["Waning immunity from the inactivated bacterial vaccine, which does not confer lifelong protection without booster doses", "A new pertussis strain that evades all vaccine-induced immunity", "The original diagnosis in childhood must have been incorrect", "Primary vaccine failure at the time of initial vaccination"], "a": 0, "e": "Correct: A. Pertussis immunity from the inactivated (acellular) vaccine wanes over time. Without an adolescent Tdap booster, previously vaccinated individuals can lose enough protection to become susceptible again.", "l": []}, {"c": "Immunology & Vaccines", "p": "An antibody binds to the surface of a circulating pathogen, physically blocking it from attaching to and entering a host cell, without directly killing the pathogen or requiring other immune cells. Which antibody function does this describe?", "o": ["Opsonization", "Complement activation", "Neutralization", "Antibody-dependent cellular cytotoxicity"], "a": 2, "e": "Correct: C. Neutralization is the direct blocking of a pathogen's ability to interact with or enter host cells by antibody binding, distinct from opsonization (facilitating phagocytosis) or complement activation.", "l": []}, {"c": "Childhood Behaviour & ADHD", "p": "A 6-week-old infant cries inconsolably for more than 3 hours a day, more than 3 days a week, for the past 3 weeks, worst in the evenings. She is gaining weight well and has a normal exam. Her exhausted parents ask if something is medically wrong. What is the most appropriate next step?", "o": ["Start an acid-suppressive medication empirically", "Order an abdominal ultrasound to rule out obstruction", "Diagnose colic based on this classic pattern, evaluate for other causes of discomfort, and provide reassurance and caregiver support", "Refer urgently to pediatric gastroenterology"], "a": 2, "e": "Correct: C. This history (crying >3h/day, >3 days/week, >3 weeks, worse in evenings, normal growth and exam) is the classic definition of colic. Management is reassurance, evaluating for other causes of discomfort, and supporting caregivers, not empiric medication or urgent referral.", "l": []}, {"c": "Childhood Behaviour & ADHD", "p": "An 18-month-old repeatedly bangs his head against the crib rail when he doesn't get his way, but is otherwise developmentally on track with no other concerning findings. What does this behaviour most likely represent, and what is the most appropriate first-line management?", "o": ["A seizure disorder, obtain an EEG", "Abuse or neglect, this mandates an immediate child protection referral", "A neurologic emergency requiring urgent neuroimaging", "Attention-seeking, avoidant, or self-soothing behaviour, manage with a \"connect then redirect\" approach after a careful history and exam to exclude red flags"], "a": 3, "e": "Correct: D. Headbanging under age 2 is typically attention-seeking, avoidant, or self-soothing, especially with normal development and no other red flags. First-line management is validating the emotion, then redirecting to a safer behaviour, after excluding concerning features on history and exam.", "l": []}, {"c": "Childhood Behaviour & ADHD", "p": "A 14-month-old has episodic rocking, thigh squeezing, and facial flushing that stop immediately when she is distracted, with no loss of consciousness or postictal state. Her parents are convinced these are seizures. What features argue against a seizure diagnosis, and what is actually being described?", "o": ["Preserved consciousness and cessation with distraction argue against seizure, this is infant masturbation, a benign self-soothing behaviour", "The presence of rhythmic movement confirms a seizure disorder requiring anticonvulsants", "This requires urgent MRI regardless of the clinical picture", "Facial flushing alone is diagnostic of an autonomic seizure"], "a": 0, "e": "Correct: A. Preserved consciousness, stopping with distraction, and absence of a postictal state all argue against seizure. This pattern is classic for infant masturbation, which is often mistaken for a movement disorder or seizures but is benign.", "l": []}, {"c": "Childhood Behaviour & ADHD", "p": "A 2-year-old has tantrums lasting 3-4 minutes several times a week when frustrated, recovering quickly afterward, with otherwise normal development. Which feature, if present instead, would be the strongest reason to consider this atypical rather than a normal developmental stage?", "o": ["Tantrums that occur only when the child is tired", "Tantrums lasting more than 15 minutes, or tantrums associated with aggression or injury", "Tantrums that occur at daycare as well as at home", "Occasional breath-holding during a tantrum"], "a": 1, "e": "Correct: B. Brief tantrums under about 5 minutes are typical for this age. Recognized red flags for atypical tantrums include prolonged duration (over about 15 minutes) and tantrums associated with aggression or injury.", "l": []}, {"c": "Childhood Behaviour & ADHD", "p": "An 8-year-old boy complains of a stomachache every school morning but is symptom-free on weekends and once allowed to stay home, he has a shy temperament and a history of difficulty separating from his mother at drop-off. Extensive investigations for organic causes have been unremarkable. What is the most likely contributing factor, and what is a key management principle?", "o": ["An undiagnosed GI condition, further invasive work-up is the priority", "Malingering to avoid schoolwork, no further action is needed", "Conduct disorder, behavioural therapy targeting rule-breaking is the priority", "Separation anxiety manifesting with somatic symptoms, management centers on gradual, reinforced return to school rather than continued avoidance"], "a": 3, "e": "Correct: D. This pattern (weekday-only somatic symptoms, shy temperament, separation difficulty, normal work-up) is classic for separation-anxiety-related school avoidance. Continued avoidance reinforces the anxiety, so management focuses on gradual, supported return to school.", "l": []}, {"c": "Childhood Behaviour & ADHD", "p": "A physician assesses a child's disruptive behaviour using a structured history that captures what happened right before the behaviour, what the behaviour itself looked like, and what happened immediately afterward. What is this framework called, and why is it useful?", "o": ["SNAP-IV, a rating scale specific to ADHD", "HEADSS, used for adolescent psychosocial screening", "ABC (antecedent, behaviour, consequence), which helps identify triggers and reinforcing consequences driving a behaviour", "DSM-5 criteria, used only for formal diagnosis, not behavioural analysis"], "a": 2, "e": "Correct: C. The ABC framework (antecedent, behaviour, consequence) is a core part of the general approach to childhood behaviours, helping identify what triggers a behaviour and what reinforces it.", "l": []}, {"c": "Childhood Behaviour & ADHD", "p": "A teacher reports that an 8-year-old boy is inattentive and fidgety only in the classroom, with no concerns at home or during extracurricular activities, and symptoms began only this school year. Using formal diagnostic criteria, why would this presentation NOT be sufficient on its own to diagnose ADHD?", "o": ["ADHD requires symptoms across 2 or more settings, with several symptoms present before age 12, symptoms confined to a single, newly emerged setting are less consistent with these criteria", "ADHD only requires symptoms in one setting, so this presentation could still be diagnosed as-is", "ADHD requires a formal IQ test before any diagnosis can be considered", "ADHD cannot be diagnosed in boys under age 10"], "a": 0, "e": "Correct: A. Diagnostic criteria for ADHD require symptoms across 2 or more settings (e.g., home, school, with peers) and several symptoms present before age 12. Symptoms isolated to one new setting do not meet this cross-setting requirement.", "l": []}, {"c": "Childhood Behaviour & ADHD", "p": "A family is told their son meets full diagnostic criteria for ADHD. They ask about first-line treatment and what \"multimodal\" management means. Which statement is most accurate?", "o": ["Medication alone is sufficient, behavioural strategies add little benefit", "Multimodal treatment combines psychoeducation, behavioural/parent training, school accommodations, and medication, with stimulants as first-line pharmacotherapy and a high proportion of children responding", "Non-stimulant medications should always be tried before stimulants", "School accommodations are not part of standard ADHD management"], "a": 1, "e": "Correct: B. ADHD treatment is multimodal: psychoeducation, behavioural/parent training, school accommodations, and medication. Stimulants are first-line pharmacotherapy, with the large majority of children showing a good response.", "l": []}, {"c": "Childhood Behaviour & ADHD", "p": "A 2-year-old who previously spoke about 10 words and made good eye contact has, over the past 2 months, stopped speaking entirely and now avoids eye contact. Compared to a child who has simply never developed more than a few words by age 2, why is this new history more concerning?", "o": ["It is not more concerning, both children should be managed identically", "Only motor regression, not language regression, warrants urgent assessment", "Loss of previously acquired skills (regression) is a distinct and more urgent red flag than an isolated delay, and is strongly associated with autism spectrum disorder and neurologic conditions", "Regression is a normal part of toddlerhood and requires no further action"], "a": 2, "e": "Correct: C. Regression, the loss of previously acquired skills, is a major red flag distinct from an isolated static delay, and is strongly associated with autism spectrum disorder and neurologic conditions, warranting urgent assessment.", "l": []}, {"c": "Childhood Behaviour & ADHD", "p": "A 2-year-old is suspected of having autism spectrum disorder based on screening, but the formal diagnostic assessment is not scheduled for several months. What is the most appropriate next step while awaiting formal diagnosis?", "o": ["Refer now for early intervention and developmental support services (such as speech, occupational therapy, and behavioural therapy), since early intervention improves long-term outcomes and should not be delayed by the diagnostic process", "Reassure the family and reassess only if symptoms worsen", "Start pharmacologic treatment empirically", "Wait for the diagnosis to be confirmed before starting any services"], "a": 0, "e": "Correct: A. Early intervention services should begin as soon as a concern is identified, without waiting for formal diagnostic confirmation, since early therapy substantially improves long-term outcomes.", "l": []}, {"c": "School-Age Development & Readiness", "p": "A kindergarten teacher notes that a 5-year-old struggles to sit through story time, frequently interrupts, and has difficulty following two-step instructions, though his language and motor skills are age-appropriate. Which domain of school readiness does this best reflect?", "o": ["Cultural readiness", "Academic readiness", "Physical readiness", "Attentional readiness"], "a": 3, "e": "Correct: D. Sitting and attending, knowing when to interrupt, and assimilating verbal information describe attentional readiness, distinct from academic, cultural, or physical readiness.", "l": []}, {"c": "School-Age Development & Readiness", "p": "A child cannot tolerate being away from her parents at drop-off, struggles to accept correction from her teacher, and has not yet formed friendships, though she can count and knows her letters. Which readiness domain is most impaired?", "o": ["Attitude and motivation", "Emotional readiness", "Cognitive readiness", "Academic readiness"], "a": 1, "e": "Correct: B. Tolerating separation from parents, accepting correction, and forming friendships are components of emotional readiness, which is impaired here despite intact academic skills.", "l": []}, {"c": "School-Age Development & Readiness", "p": "A 7-year-old is reading and doing arithmetic roughly two grade levels behind expectations, despite normal vision, hearing, and overall cognitive ability. What threshold is generally used to define a specific learning disability in this context?", "o": ["Learning disabilities cannot be identified until high school", "A deficit only becomes significant if it has been present since preschool", "Any deficit below the class average", "A significant academic deficit, generally about 2 grades below expectations for age"], "a": 3, "e": "Correct: D. Diagnosing a specific learning disability generally requires a \"significant\" academic deficit, defined as roughly 2 grades below expectation, matching this child's presentation.", "l": []}, {"c": "School-Age Development & Readiness", "p": "A 6-year-old's teacher notices the child still believes his parents' divorce happened because he \"was naughty.\" Which developmental feature of pre-school/early school-age thinking best explains this kind of misconception?", "o": ["This indicates a mood disorder requiring treatment", "Concrete operational reasoning", "Semi-logical, egocentric thinking typical of the pre-school years, which can lead to self-blaming misconceptions about unrelated events", "Formal operational reasoning"], "a": 2, "e": "Correct: C. Semi-logical thinking in the pre-school years can lead to egocentric misconceptions, such as a child believing an unrelated family event happened because of their own behaviour.", "l": []}, {"c": "Social Determinants of Health", "p": "A public health team designs a national policy change to redistribute wealth and reduce income inequality, aiming to address the root causes of health disparities rather than treat their downstream effects. Which level of intervention does this represent?", "o": ["Downstream", "Upstream", "Individual-level clinical intervention", "Midstream"], "a": 1, "e": "Correct: B. Upstream interventions target the fundamental social and economic structures (macro policy level) that distribute wealth, power, and opportunity, diminishing the \"causes of the causes\" of health disparities.", "l": []}, {"c": "Social Determinants of Health", "p": "A community health worker helps a family enroll in a local subsidized health clinic to improve their access to care. Which level of intervention does this best represent, and how does it differ from a policy aimed at improving neighbourhood housing conditions?", "o": ["This is a downstream/service-level intervention improving individual access, the housing policy would be a midstream intervention targeting material living conditions at a community level", "Both are examples of upstream interventions", "This is an upstream intervention, the housing policy is downstream", "There is no meaningful distinction between these levels"], "a": 0, "e": "Correct: A. Downstream interventions increase individual or family-level access to services. Midstream interventions improve material living/working conditions or reduce hazard exposure at a community level, a distinct, broader target than individual service access.", "l": []}, {"c": "Social Determinants of Health", "p": "A child experiences chronic early-life stress due to poverty and unstable housing. Years later, as an adult with stable finances, this same individual develops stress-related chronic disease despite the improved circumstances. Which model of the life-course effects of adversity does this best illustrate?", "o": ["Acculturation model", "Accumulation model", "Pathways model", "Latency model"], "a": 3, "e": "Correct: D. The latency model describes an exposure at one point in life having a health effect years to decades later, regardless of intervening improvements in circumstances, as seen here.", "l": []}, {"c": "Social Determinants of Health", "p": "A child faces early poverty, then unstable housing, then poor educational access, each adversity increasing the likelihood of encountering the next one in a compounding sequence over the life course. Which model of life-course health effects does this best describe?", "o": ["Latency model", "Pathways model", "A single accumulation exposure", "Herd immunity"], "a": 1, "e": "Correct: B. The pathways model describes a sequence in which an exposure at one life stage increases the probability of further adverse exposures later, a compounding chain, rather than a single delayed effect (latency) or multiple unrelated exposures simply adding up (accumulation).", "l": []}, {"c": "Social Determinants of Health", "p": "Comparing two children with similar chronic early adversity, one experienced a single significant traumatic event while the other faced multiple different adverse exposures throughout childhood (poverty, unstable housing, and family conflict). Which concept explains why the second child is expected to have a greater cumulative health impact?", "o": ["Latency", "Pathways", "Accumulation, multiple exposures over the life course combine to create a more significant health effect than any one alone", "Herd immunity"], "a": 2, "e": "Correct: C. The accumulation model holds that multiple exposures over the life course each have individual effects, but also combine to produce a greater overall health impact than a single exposure alone.", "l": []}, {"c": "Adolescent Development", "p": "A 13-year-old girl asks to be seen alone for part of her visit to discuss a personal concern. Her mother is reluctant to leave the room. What is the most appropriate approach, and why?", "o": ["Allow private time with a clear explanation of confidentiality and its limits (such as risk of harm to self or others), since this improves disclosure of risk behaviours and engagement in care", "Refuse to see the patient without a parent present", "Insist the mother remain present throughout, since the patient is a minor", "Simply document the mother's objection and end the visit"], "a": 0, "e": "Correct: A. Adolescent care should include private time with explained confidentiality and its limits. This approach improves disclosure of risk behaviours and overall engagement with care.", "l": []}, {"c": "Adolescent Development", "p": "A clinician uses a structured interview covering home life, education/employment, activities, drug use, sexuality, and suicide/depression screening with a 16-year-old patient. What is this framework called, and what is its purpose?", "o": ["The ABCs, used for behavioural analysis in young children", "CRAFFT, used only for substance use screening", "Rourke Baby Record, used for infant well-child visits", "HEADSS, a comprehensive adolescent psychosocial risk assessment"], "a": 3, "e": "Correct: D. HEADSS (Home, Education/employment, Activities, Drugs, Sexuality, Suicide/depression) is the structured psychosocial interview framework for adolescents.", "l": []}, {"c": "Adolescent Development", "p": "A 15-year-old boy has begun a growth spurt with increasing shoulder width and muscle gain, alongside testicular enlargement that started roughly a year earlier. Comparing this to a typical female peer, which statement correctly contrasts the pubertal timeline between sexes?", "o": ["Females' first pubertal sign is menarche", "Females typically begin their growth spurt earlier (around 10.5 years) than males (around 12.5 years), with males also reaching peak growth velocity later", "Males' growth spurt always precedes the onset of testicular enlargement", "Males and females begin puberty at exactly the same average age"], "a": 1, "e": "Correct: B. Females typically begin their growth spurt around age 10.5 (peak velocity ~12 years), while males begin later, around 12.5 years (peak velocity ~14 years). Testicular enlargement, not the growth spurt, is typically the first sign of male puberty.", "l": []}, {"c": "Adolescent Development", "p": "A 14-year-old comes in accompanied by a parent who insists on staying for the entire visit and answering all questions on the teen's behalf. According to the developmental approach to adolescent care, what should the clinician do?", "o": ["Aim to interview the adolescent alone at some point in the visit, encouraging parental collaboration when possible and safe, while directing open-ended, jargon-free questions to the teen", "Refuse to proceed with the visit until the parent leaves entirely", "Allow this to continue, since parental involvement is always required for minors", "Direct all questions only to the parent, since the patient is still a minor"], "a": 0, "e": "Correct: A. The developmental approach to adolescent care includes interviewing the adolescent alone when possible, encouraging (rather than excluding) parental collaboration, and using open-ended, jargon-free questions directed at the teen themselves.", "l": []}, {"c": "Adolescent Development", "p": "According to Freud's psychosexual stages, a 4-year-old boy described by his parents as unusually attached to his mother and less interested in his father would, in this framework, be understood to be in which stage?", "o": ["Latency", "Anal", "Phallic", "Oral"], "a": 2, "e": "Correct: C. The phallic stage (roughly ages 3-6) is classically described, in Freud's framework, as a period when boys are more attached to their mother and girls more attached to their father.", "l": []}, {"c": "Adolescent Development", "p": "An immigrant adolescent fully adopts the customs, language, and values of her new country while letting go of her family's heritage culture and traditions. Which acculturation strategy does this represent?", "o": ["Integration", "Separation", "Marginalization", "Assimilation"], "a": 3, "e": "Correct: D. Assimilation describes accepting the receiving culture while rejecting the heritage culture, the opposite pattern from separation (rejecting the receiving culture, keeping heritage culture).", "l": []}, {"c": "Adolescent Development", "p": "Another adolescent from the same family maintains strong ties to their heritage culture's traditions and language while also actively participating in and adopting aspects of the new receiving culture. Which acculturation strategy is this?", "o": ["Integration, accepting the receiving culture while also retaining the heritage culture", "Marginalization", "Assimilation", "Reactive ethnicity"], "a": 0, "e": "Correct: A. Integration describes accepting the receiving culture while also retaining the heritage culture, distinct from assimilation (accepting receiving culture only) or separation (retaining heritage culture only).", "l": []}, {"c": "Adolescent Development", "p": "A teenager from a minority ethnic background reports that repeated experiences of discrimination from the broader community have made them cling more tightly to their own cultural group and avoid engaging with the receiving culture altogether. Which concept describes this response?", "o": ["Assimilation", "Integration", "Reactive ethnicity, discrimination from another culture leading an individual to remain separated and hold more tightly to their heritage culture", "Herd immunity"], "a": 2, "e": "Correct: C. Reactive ethnicity describes how discrimination from the broader culture can push ethnic minorities toward remaining separated and holding even more tightly to their heritage culture.", "l": []}, {"c": "Genetic & Medical Conditions", "p": "A newborn has hypotonia and later develops hypogonadism and obesity in early childhood. Genetic testing shows a deletion of the paternally inherited 15q11-q13 region. Which condition is this, and what would be expected if the same region were deleted from the maternal copy instead?", "o": ["This deletion has no described phenotype regardless of parental origin", "Prader-Willi syndrome, the maternal deletion instead causes Angelman syndrome, with seizures, a happy demeanor, and severe developmental delay", "Both parental origins cause an identical phenotype", "Angelman syndrome, the maternal deletion would cause Prader-Willi syndrome"], "a": 1, "e": "Correct: B. Paternal deletion of 15q11-q13 causes Prader-Willi syndrome (hypotonia, hypogonadism, obesity), the same region deleted maternally causes Angelman syndrome (small head, seizures, happy demeanor, absent speech), a classic imprinting example.", "l": []}, {"c": "Genetic & Medical Conditions", "p": "A child has hypermobile joints and hyperelastic skin, with a defect affecting collagen fibril alignment involving lysyl hydroxylase. Which condition is this, and how does it differ mechanistically from a connective tissue disorder caused by a fibrillin-1 mutation?", "o": ["Marfan syndrome, Ehlers-Danlos syndrome involves fibrillin-1", "Ehlers-Danlos syndrome (collagen fibril misalignment), Marfan syndrome instead involves fibrillin-1, affecting elastic fiber organization and TGF-beta binding, with cardiovascular and skeletal features", "Both conditions are caused by the identical gene mutation", "Osteogenesis imperfecta, unrelated to either collagen or fibrillin"], "a": 1, "e": "Correct: B. Ehlers-Danlos syndrome involves misaligned collagen fibrils (e.g., lysyl hydroxylase or procollagen peptidase defects), causing joint hypermobility and skin hyperelasticity. Marfan syndrome, by contrast, involves a fibrillin-1 mutation affecting elastic fiber organization and TGF-beta binding, with cardiovascular and skeletal features.", "l": []}, {"c": "Genetic & Medical Conditions", "p": "An infant has recurrent lung infections, salty-tasting skin, and poor weight gain. Which gene and defect are responsible for this presentation, and what is the inheritance pattern?", "o": ["Dystrophin frameshift mutation, X-linked", "Fibrillin-1 mutation, autosomal dominant", "CFTR gene mutation causing impaired chloride transport, autosomal recessive (cystic fibrosis)", "FGFR3 gain-of-function mutation, autosomal dominant"], "a": 2, "e": "Correct: C. This is cystic fibrosis, caused by an autosomal recessive CFTR gene mutation (commonly ΔF508) that impairs chloride transport, producing thick secretions, recurrent lung infections, and poor growth.", "l": []}, {"c": "Genetic & Medical Conditions", "p": "Two boys in the same extended family both have progressive muscle weakness. One has a frameshift mutation in the dystrophin gene and is not expected to survive to adulthood, the other has an in-frame mutation in the same gene with a much milder, non-lethal course. Which conditions do these two boys have, respectively?", "o": ["Duchenne muscular dystrophy (frameshift, genetic lethal), Becker muscular dystrophy (in-frame, not genetic lethal)", "Becker muscular dystrophy (frameshift, lethal), Duchenne muscular dystrophy (in-frame, milder)", "Both boys have Duchenne muscular dystrophy, severity is unrelated to mutation type", "This mutation pattern describes Charcot-Marie-Tooth disease in both boys"], "a": 0, "e": "Correct: A. A dystrophin frameshift mutation causes Duchenne muscular dystrophy (severe, genetic lethal), while an in-frame mutation in the same gene causes the milder, non-lethal Becker muscular dystrophy, both X-linked.", "l": []}, {"c": "Genetic & Medical Conditions", "p": "A child has short stature with disproportionately short limbs. Genetic testing shows a gain-of-function mutation in a fibroblast growth factor receptor gene that excessively inhibits cartilage growth. Which condition is this, and what is its inheritance pattern?", "o": ["Turner syndrome, chromosomal", "Osteogenesis imperfecta, autosomal dominant, type I collagen", "Marfan syndrome, autosomal dominant, fibrillin-1", "Achondroplasia, autosomal dominant, FGFR3 gain-of-function"], "a": 3, "e": "Correct: D. Achondroplasia is caused by an autosomal dominant FGFR3 gain-of-function mutation, which excessively inhibits cartilage growth and abnormal endochondral ossification, producing short stature with disproportionately short limbs.", "l": []}, {"c": "Genetic & Medical Conditions", "p": "An infant found on newborn screening to have elevated phenylalanine is started on a diet that eliminates phenylalanine intake. If left untreated, which combination of features would this infant be at risk for?", "o": ["Webbed neck and short stature, due to a 45,X karyotype", "Learning disability, musty body odor, eczema, and fair skin/blue eyes, due to a PAH gene mutation", "Salty skin and recurrent lung infections, due to a CFTR mutation", "Progressive muscle weakness, due to a dystrophin mutation"], "a": 1, "e": "Correct: B. This describes phenylketonuria (PKU), caused by a PAH gene mutation. Untreated, it leads to learning disability, a musty odor, eczema, and fair skin/blue eyes, which is why dietary phenylalanine restriction, guided by newborn screening, is essential.", "l": []}, {"c": "Genetic & Medical Conditions", "p": "A newborn girl has puffy hands and feet and a webbed neck. As she grows, she has short stature and, later, primary amenorrhea, but normal intelligence. Which karyotype is most consistent with this presentation, and which cardiac lesion is classically associated with it?", "o": ["47,XXY, atrial septal defect", "45,X/46,XY mosaic, hypertrophic cardiomyopathy", "47,XX,+21, atrioventricular septal defect", "45,X, coarctation of the aorta"], "a": 3, "e": "Correct: D. This presentation (puffy hands/feet, webbed neck, short stature, primary amenorrhea, normal intelligence) is classic Turner syndrome, karyotype 45,X, classically associated with coarctation of the aorta.", "l": []}, {"c": "Genetic & Medical Conditions", "p": "A child has multiple café-au-lait macules, axillary freckling, and Lisch nodules on eye exam, with a family history of similar findings inherited in an autosomal dominant pattern. Which gene is implicated, and which serious complication should be monitored for given this diagnosis?", "o": ["NF1 mutation, optic glioma should be monitored for", "CFTR mutation, recurrent pulmonary infection should be monitored for", "FGFR3 mutation, short stature should be monitored for", "FBN1 mutation, aortic root dilation should be monitored for"], "a": 0, "e": "Correct: A. Café-au-lait macules, axillary freckling, and Lisch nodules describe neurofibromatosis type 1 (NF1 mutation), for which optic glioma is an important associated complication to monitor for.", "l": []}, {"c": "Genetic & Medical Conditions", "p": "A malnourished child has significant muscle wasting with a \"skin and bones\" appearance and no edema, in contrast to another child from the same region who has a swollen abdomen and peripheral edema despite a similar total caloric intake. What best distinguishes these two presentations?", "o": ["Marasmus always presents with edema, unlike kwashiorkor", "Both presentations are kwashiorkor at different stages of the same disease", "Marasmus (first child) reflects inadequate total caloric intake causing global wasting without edema, kwashiorkor (second child) reflects inadequate protein intake specifically, causing edema from low plasma protein despite adequate calories", "These are two names for the identical clinical entity"], "a": 2, "e": "Correct: C. Marasmus results from inadequate total caloric intake, producing global wasting without edema. Kwashiorkor results from inadequate protein intake specifically (even with adequate total calories), causing edema from low plasma oncotic pressure.", "l": []}, {"c": "Genetic & Medical Conditions", "p": "A newborn is found to have a duplication of the 17p11.2 region, presenting with global developmental delay, dysmorphic features, and a congenital heart defect. How does this compare conceptually to a 22q11.2 deletion causing DiGeorge syndrome?", "o": ["Both illustrate that copy number changes, a duplication or a deletion of dosage-sensitive genetic material, not just single-gene point mutations, can cause a recognizable multi-system syndrome", "Duplications never cause clinical phenotypes, only deletions do", "These two conditions have identical genetic mechanisms and clinical features", "Only deletions, never duplications, are detectable on chromosomal microarray"], "a": 0, "e": "Correct: A. Potocki-Lupski syndrome (17p11.2 duplication) and DiGeorge syndrome (22q11.2 deletion) both illustrate how copy number changes, gains or losses of dosage-sensitive genetic material, can each produce a recognizable multi-system syndrome, and both are detectable on chromosomal microarray.", "l": []}, {"c": "Immunology & Vaccines", "p": "A vaccine trial under controlled research conditions shows 95% protection against illness. Two years later, population-level surveillance shows 80% protection in real-world use. Which term applies to each measurement, in order?", "o": ["Immunogenicity, herd immunity", "Efficacy, effectiveness", "Effectiveness, efficacy", "Safety, efficacy"], "a": 1, "e": "Correct: B. Efficacy is measured under controlled study conditions, effectiveness is measured under real-world conditions, and is typically somewhat lower.", "l": []}, {"c": "Immunology & Vaccines", "p": "Which of the following vaccines is NOT part of Canada's routine immunization schedule?", "o": ["Meningococcal C conjugate", "Rotavirus", "Hepatitis B", "Pneumococcal 23-valent polysaccharide"], "a": 3, "e": "Correct: D. The 23-valent pneumococcal polysaccharide vaccine is not part of the routine Canadian schedule, unlike pneumococcal conjugate vaccine. Rotavirus, MenC conjugate, and Hepatitis B are all routine.", "l": []}, {"c": "Immunology & Vaccines", "p": "A 4-year-old with a T-cell immunodeficiency is due for her MMR and Hepatitis B vaccines. Which pairing of vaccine classification and appropriateness for this patient is correct?", "o": ["MMR (live attenuated), contraindicated, Hepatitis B (subunit), appropriate", "MMR (subunit), appropriate, Hepatitis B (live attenuated), contraindicated", "Both vaccines (inactivated whole-cell), appropriate", "Both vaccines (live attenuated), appropriate, since neither can replicate"], "a": 0, "e": "Correct: A. MMR is a live attenuated vaccine and is contraindicated in T-cell immunodeficiency due to the risk of vaccine-strain disease. Hepatitis B is a subunit (protein-based) vaccine and is safe in this population.", "l": []}, {"c": "Immunology & Vaccines", "p": "Two household contacts of a confirmed measles case are assessed within 24 hours of exposure: a 4-month-old infant, and an unvaccinated, immunocompetent 8-month-old. Which post-exposure management is correct for each, respectively?", "o": ["Vaccine within 72h (the 4-month-old), immunoglobulin (the 8-month-old)", "Vaccine within 72h for both infants", "Immunoglobulin for both infants", "Immunoglobulin (the 4-month-old), vaccine within 72h (the 8-month-old)"], "a": 3, "e": "Correct: D. Immunoglobulin is used for infants under 6 months, too young for vaccine-based PEP. Vaccine within 72 hours is appropriate for immunocompetent contacts over 6 months of age.", "l": []}, {"c": "Immunology & Vaccines", "p": "A pregnant woman without varicella immunity, and a non-pregnant immunocompetent adult without varicella immunity, are both exposed to chickenpox at the same time. Which post-exposure management is correct for each, respectively?", "o": ["Immunoglobulin within 96h for both", "Vaccine within 3-5 days for both", "Immunoglobulin within 96h (the pregnant woman), vaccine within 3-5 days (the non-pregnant adult)", "Vaccine within 3-5 days (the pregnant woman), immunoglobulin within 96h (the non-pregnant adult)"], "a": 2, "e": "Correct: C. Live varicella vaccine is contraindicated in pregnancy, so immunoglobulin within 96 hours is used instead. A non-pregnant, immunocompetent adult should receive the vaccine within 3-5 days.", "l": []}, {"c": "Immunology & Vaccines", "p": "Conjugate vaccines (e.g., Hib, pneumococcal conjugate) were developed to overcome which specific limitation of plain polysaccharide vaccines in young children?", "o": ["Excessive reactogenicity requiring a reduced dose", "Poor T-cell-dependent response, producing weak and short-lived immunity", "Risk of causing vaccine-strain disease", "Inability to be stored without refrigeration"], "a": 1, "e": "Correct: B. Plain polysaccharide antigens are T-cell-independent and poorly immunogenic in young children. Conjugating the polysaccharide to a protein carrier recruits T-cell help, producing a stronger and more durable response.", "l": []}, {"c": "Childhood Behaviour", "p": "Which pairing correctly matches the age range most classically associated with an infant first biting during excitement, versus the age range most associated with first clearly displaying anger?", "o": ["Biting: 6 months, anger display: 8-12 months", "Biting: 12-18 months, anger display: 3 months", "Biting: 8-12 months, anger display: 6 months", "Biting: 3 months, anger display: 12-18 months"], "a": 2, "e": "Correct: C. Infants typically display anger around 6 months and bite in excitement between 8 and 12 months, anger recognition even earlier, around 3 months.", "l": []}, {"c": "Childhood Behaviour", "p": "Which feature would most strongly reclassify an otherwise typical toddler tantrum as atypical?", "o": ["Duration under 5 minutes", "Duration over 15 minutes", "Occasional breath-holding during the episode", "Occurrence at both home and daycare"], "a": 1, "e": "Correct: B. Tantrums lasting more than about 15 minutes are a recognized red flag for an atypical tantrum. Brief duration, occasional breath-holding, and occurring in more than one setting are all within the typical range.", "l": []}, {"c": "Childhood Behaviour", "p": "Regarding the typical function of childhood aggression, which statement correctly contrasts behaviour before versus after age 6?", "o": ["Before 6: typically used to obtain something, after 6: more typically used to retaliate", "Before 6: typically used to retaliate, after 6: more typically used to obtain something", "Aggression used to obtain something only appears after age 6", "The typical function of aggression does not change with age"], "a": 0, "e": "Correct: A. The expected developmental pattern is that aggression to obtain something is more typical under age 6, shifting toward aggression to retaliate over age 6.", "l": []}, {"c": "Childhood Behaviour", "p": "Which statement about recommended daily physical activity and the variability of activity level in young children is correct?", "o": ["60 minutes/day is recommended, low variability is expected among healthy children", "30 minutes/day is recommended, high activity level always indicates ADHD", "There is no recommended activity level for children under age 5", "60 minutes/day is recommended, activity level is highly variable among healthy children"], "a": 3, "e": "Correct: D. About 60 minutes per day is the general activity recommendation, and activity level is recognized as highly variable among healthy children.", "l": []}, {"c": "Childhood Behaviour", "p": "A 13-month-old wakes twice nightly and is soothed with a bottle each time. Which management step is specifically recommended around this age?", "o": ["Refer for polysomnography at this age", "Eliminate the bottle only after 24 months", "Eliminate the bottle around 12 months, alongside sleep hygiene and limit setting", "Continue the bottle indefinitely to avoid distress"], "a": 2, "e": "Correct: C. Recommended management of night waking includes sleep hygiene, appropriate limit setting, and eliminating the bottle around 12 months of age.", "l": []}, {"c": "ADHD", "p": "A child has 5 inattentive symptoms and 4 hyperactive-impulsive symptoms, persisting 8 months, present across 2 settings, with clear functional impairment. Does this meet the symptom-count threshold for ADHD?", "o": ["No, neither domain individually reaches the required 6-symptom threshold", "Yes, the combined total of 9 symptoms across both domains is sufficient", "Yes, cross-setting impairment alone is sufficient regardless of symptom count", "No, the 8-month duration is insufficient regardless of symptom count"], "a": 0, "e": "Correct: A. Diagnostic criteria require 6 or more symptoms within at least one domain individually, 5 and 4 in the two domains, without either reaching 6, technically falls short of threshold.", "l": []}, {"c": "ADHD", "p": "Which onset pattern is LEAST consistent with a primary ADHD diagnosis?", "o": ["Several symptoms present before age 12, across 2 or more settings", "Symptoms present since preschool, worsening as academic demands increase", "Clearly new-onset inattention at age 14 with no prior history, coinciding with an acute stressor", "Symptoms present at both home and school si const OBJECTIVES = {};
const L = "ABCDE";
const N = QUESTIONS.length;
let cur = 0, showResults = false;
let ans = new Array(N).fill(null);           // current pick per question
let tries = QUESTIONS.map(()=>[]);           // every locked attempt: {pick, ok, at}
let strikes = QUESTIONS.map(()=>[]);         // struck option indexes for the open attempt
let history = [], db = null, uid = null, writing = false, dirty = false;
const MAP=document.getElementById("map"); if(MAP && QUESTIONS.length<=60) MAP.open=true;
const LS_KEY = "differential-week-4-question-bank";
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");

function score(){ return ans.reduce((n,a,i)=>n+(a!==null&&a===QUESTIONS[i].a?1:0),0); }
function answered(){ return ans.filter(a=>a!==null).length; }
function firstTryScore(){ return tries.reduce((n,t)=>n+(t.length&&t[0].ok?1:0),0); }
function firstTryCount(){ return tries.filter(t=>t.length).length; }

function renderHeader(){
  const bf=$("#barfill"); if(bf) bf.style.width=(100*answered()/N)+"%";
  $("#stats").innerHTML = `<span>Question <b>${showResults?"–":cur+1}</b> of <b>${N}</b></span><span>Answered <b>${answered()}</b></span><span>Score <b>${score()} / ${answered()}</b></span>`;
  $("#ticks").innerHTML = QUESTIONS.map((q,i)=>{
    const st = ans[i]===null?"":(ans[i]===q.a?"ok":"bad");
    const redo = tries[i].length>1 || (ans[i]===null && tries[i].length>0);
    return `<button class="tick ${st} ${redo?"redo":""} ${(!showResults&&i===cur)?"cur":""}" data-i="${i}" aria-label="Question ${i+1}"></button>`;
  }).join("");
  document.querySelectorAll(".tick").forEach(b=>b.onclick=()=>{cur=+b.dataset.i;showResults=false;render();});
}

function triesLine(i, includeCurrent){
  const t = includeCurrent ? tries[i] : tries[i];
  if(!t.length) return "";
  const parts = t.map((x,k)=>`<span class="${x.ok?"ok":"bad"}">${k+1}: ${L[x.pick]} ${x.ok?"correct":"wrong"}</span>`).join(" · ");
  return `<div class="tries">Attempts ${parts}</div>`;
}

function fmtLine(t){
  let m;
  if((m=t.match(/^Correct:\s*([A-E])\.?\s*(.*)$/)) || (m=t.match(/^([A-E]) is correct\.?\s*(.*)$/)))
    return `<p class="why"><span class="lk ok">${m[1]}</span><span>${esc(m[2])}</span></p>`;
  if((m=t.match(/^([A-E]):\s*(.*)$/)))
    return `<p class="alt"><span class="lk">${m[1]}</span><span>${esc(m[2])}</span></p>`;
  if((m=t.match(/^(Takeaway|High yield|High-yield|Key point|Clues):\s*(.*)$/i)))
    return `<p class="take"><b>${esc(m[1])}.</b> ${esc(m[2])}</p>`;
  return `<p>${esc(t)}</p>`;
}

function renderQ(){
  const q = QUESTIONS[cur], a = ans[cur], done = a!==null, st = strikes[cur];
  const opts = q.o.map((o,i)=>{
    let c = "";
    if(done){ if(i===q.a) c="right"; else if(i===a) c="wrong"; }
    const struck = !done && st.includes(i);
    const strikeBtn = done ? "" : `<button class="strike" data-s="${i}" aria-pressed="${struck}" aria-label="${struck?"Restore":"Strike out"} option ${L[i]}" title="${struck?"Restore":"Strike out"} option">${struck?"↺":"✕"}</button>`;
    return `<div class="optrow ${struck?"struck":""}"><button class="opt ${c}" data-i="${i}" ${done?"disabled":""}><span class="k">${L[i]}</span><span>${esc(o)}</span></button>${strikeBtn}</div>`;
  }).join("");
  let fb = "";
  if(done){
    const ok = a===q.a;
    const lines = q.e.split("\n").map(fmtLine).join("");
    const objs = q.l.map(id=>`<div class="obj"><b>Objective ${esc(id)}</b> ${esc(OBJECTIVES[id]||"")}</div>`).join("");
    fb = `<div class="fb" role="status"><div class="verdict ${ok?"ok":"bad"}">${ok?"Correct.":"Incorrect. The answer is "+L[q.a]+"."}</div>${lines}${objs}${triesLine(cur)}<div class="fbtools"><button class="btn ghost" id="redo">Reset and redo this question</button></div></div>`;
  }
  const pre = (!done && tries[cur].length) ? `<div class="hint">Redo. Your earlier attempts are saved.</div>${triesLine(cur)}` : (!done ? `<div class="hint">Tap ✕ to strike out an option. Right-click works too.</div>` : "");
  const last = cur===N-1;
  $("#main").innerHTML = `<article class="card">
    <div class="chead"><span class="tag">${esc(q.c)}</span><span class="qn">${cur+1} of ${N}</span></div>
    <p class="stem">${esc(q.p)}</p>
    ${pre}
    <div class="opts">${opts}</div>${fb}
    <div class="nav"><button class="btn ghost" id="prev" ${cur===0?"disabled":""}>Previous</button>
    <button class="btn" id="next" ${done?"":"disabled"}>${last?"See results":"Next"}</button></div>
  </article>`;
  document.querySelectorAll(".opt").forEach(b=>{
    b.onclick=()=>{ const p=+b.dataset.i; ans[cur]=p; tries[cur].push({pick:p, ok:p===q.a, at:new Date().toISOString()}); tries[cur]=tries[cur].slice(-10); strikes[cur]=[]; render(false); persist(); };
    b.oncontextmenu=(e)=>{ if(done) return; e.preventDefault(); toggleStrike(+b.dataset.i); };
  });
  document.querySelectorAll(".strike").forEach(b=>b.onclick=()=>toggleStrike(+b.dataset.s));
  const r=$("#redo"); if(r) r.onclick=()=>{ ans[cur]=null; strikes[cur]=[]; render(false); persist(); };
  $("#prev").onclick=()=>{cur--;render();};
  $("#next").onclick=()=>{ if(last){showResults=true;} else cur++; render(); };
}

function toggleStrike(i){
  const s = strikes[cur], k = s.indexOf(i);
  if(k<0) s.push(i); else s.splice(k,1);
  render(false); persist();
}

function renderResults(){
  const s = score(), pct = Math.round(100*s/N);
  const cats = {};
  QUESTIONS.forEach((q,i)=>{ cats[q.c]=cats[q.c]||[0,0]; cats[q.c][1]++; if(ans[i]===q.a) cats[q.c][0]++; });
  const rows = Object.entries(cats).map(([c,[r,t]])=>`<tr><td>${esc(c)}<span class="meter"><i style="width:${Math.round(100*r/t)}%"></i></span></td><td>${r} / ${t}</td></tr>`).join("");
  const missed = {};
  QUESTIONS.forEach((q,i)=>{ const wrongFirst = tries[i].length && !tries[i][0].ok; if(ans[i]!==q.a || wrongFirst) q.l.forEach(id=>{ const w=id.split(" ")[0]; missed[w]=missed[w]||new Set(); missed[w].add(id); }); });
  const weeks = Object.keys(missed).sort((x,y)=>parseInt(x.slice(1))-parseInt(y.slice(1)));
  const missHtml = weeks.length ? weeks.map(w=>`<h3>Week ${w.slice(1)}</h3><ul class="miss">${[...missed[w]].map(id=>`<li><code>${esc(id)}</code>${esc(OBJECTIVES[id]||"")}</li>`).join("")}</ul>`).join("") : "<p>No missed objectives.</p>";
  const redone = tries.filter(t=>t.length>1).length;
  const un = N - answered();
  $("#main").innerHTML = `<article class="card">
    <div class="chead"><span class="tag">Results</span><span>${un?un+" unanswered":"Complete"}</span></div>
    <div><div class="big">${s} / ${N}</div><div class="stats"><span><b>${pct}%</b> correct now</span><span>First try <b>${firstTryScore()} / ${firstTryCount()}</b></span><span>Redone <b>${redone}</b></span></div></div>
    <table><thead><tr><th>Topic</th><th>Score</th></tr></thead><tbody>${rows}</tbody></table>
    <h2>Objectives to review</h2><p class="hint">Includes questions you missed on the first try, even if a redo got them right.</p>${missHtml}${history.length?`<h2>Past attempts</h2><table><thead><tr><th>Date</th><th>Score</th></tr></thead><tbody>${history.slice().reverse().map(h=>`<tr><td>${new Date(h.date).toLocaleDateString()}</td><td>${h.score} / ${h.total}</td></tr>`).join("")}</tbody></table>`:""}
    <div class="nav"><button class="btn ghost" id="back">Back to questions</button><button class="btn" id="restart">Restart all</button></div>
  </article>`;
  $("#back").onclick=()=>{showResults=false;render();};
  $("#restart").onclick=()=>{
    if(answered() || tries.some(t=>t.length)){
      history.push({date:new Date().toISOString(), score:score(), answered:answered(), total:N, firstTry:firstTryScore(),
        missed:QUESTIONS.map((q,i)=>ans[i]!==null&&ans[i]!==q.a?"q"+(i+1):null).filter(Boolean)});
      history=history.slice(-20);
    }
    ans.fill(null); tries=QUESTIONS.map(()=>[]); strikes=QUESTIONS.map(()=>[]); cur=0; showResults=false; render(); persist();
  };
}

function setSave(text, cls){ const el=$("#save"); if(el){ el.textContent=text; el.className="save "+(cls||""); } }
function bodyOf(){
  const a = {};
  QUESTIONS.forEach((q,i)=>{
    if(ans[i]===null && !tries[i].length && !strikes[i].length) return;
    a["q"+(i+1)] = {pick:ans[i], ok:ans[i]!==null && ans[i]===q.a, l:q.l, tries:tries[i], strikes:strikes[i]};
  });
  return {answers:a, history, total:N, answered:answered(), score:score(), firstTry:firstTryScore(), updatedAt:new Date().toISOString()};
}
function validPick(i,p){ return Number.isInteger(p) && p>=0 && p<QUESTIONS[i].o.length; }
function applySaved(d){
  if(!d || typeof d!=="object") return;
  ans.fill(null); tries=QUESTIONS.map(()=>[]); strikes=QUESTIONS.map(()=>[]);
  const a = d.answers || {};
  for(const k in a){
    const i = parseInt(k.slice(1),10)-1, row = a[k];
    if(!(i>=0 && i<N) || !row || typeof row!=="object") continue;
    if(validPick(i,row.pick)) ans[i]=row.pick;
    if(Array.isArray(row.tries)) tries[i]=row.tries.filter(t=>t&&validPick(i,t.pick)).map(t=>({pick:t.pick, ok:t.pick===QUESTIONS[i].a, at:String(t.at||"")})).slice(-10);
    else if(ans[i]!==null) tries[i]=[{pick:ans[i], ok:ans[i]===QUESTIONS[i].a, at:""}];
    if(Array.isArray(row.strikes)) strikes[i]=row.strikes.filter(x=>validPick(i,x));
  }
  history = Array.isArray(d.history) ? d.history.slice(-20) : [];
  const first = ans.findIndex(x=>x===null); cur = first<0 ? N-1 : first;
}
function lsLoad(){ try{ return JSON.parse(localStorage.getItem(LS_KEY)||"null"); }catch(e){ return null; } }
function lsSave(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(bodyOf())); }catch(e){} }
async function persist(){
  lsSave();
  if(!db || !uid) return;
  dirty = true; if(writing) return; writing = true;
  while(dirty){
    dirty = false;
    setSave("Saving…");
    try{ await db.doc("attempts/"+uid).set(bodyOf()); setSave("Progress saved to your account.","ok"); }
    catch(e){
      if(e && e.code==="invalid_argument"){ db=null; setSave("Progress saves in this browser only.","bad"); break; }
      setSave("Could not save to your account. Progress saves in this browser.","bad");
    }
  }
  writing = false;
}
async function connect(){
  try{
    if(!window.claude || !window.claude.use) return;
    const [u, d] = await Promise.all([window.claude.use("user"), window.claude.use("db")]);
    if(!u || !d) return;
    const id = await u.id(); if(!id) return;
    db = d; uid = id;
    const snap = await db.doc("attempts/"+uid).get();
    if(snap.exists){ applySaved(snap.data()); render(); setSave("Progress saved to your account.","ok"); }
    else if(answered() || tries.some(t=>t.length)){ persist(); }
    else setSave("Progress saves to your account.","ok");
  }catch(e){ /* keep local-only mode */ }
}

function render(top=true){ renderHeader(); showResults?renderResults():renderQ(); if(top) window.scrollTo({top:0}); }
applySaved(lsLoad());
render();
connect();
</script>
