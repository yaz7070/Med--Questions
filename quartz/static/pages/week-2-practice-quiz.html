<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Foundations of Medicine Week 2 practice</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&display=swap">
<style>
:root {
  --paper: #EAF0F2;
  --card: #F8FBFC;
  --ink: #14262E;
  --slate: #4C6069;
  --line: #C5D3D9;
  --teal: #0F6E73;
  --teal-soft: #D5EAEA;
  --ok: #1E7A4B;
  --ok-soft: #DAEFE3;
  --bad: #B0344C;
  --bad-soft: #F7DDE2;
  --mark: rgba(243, 217, 107, 0.85);
  --serif: "Literata", Georgia, "Times New Roman", serif;
  --sans: "Figtree", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0F1B20;
    --card: #16272E;
    --ink: #E4EEF1;
    --slate: #9DB2BA;
    --line: #2C444E;
    --teal: #5CC2C6;
    --teal-soft: #1B3A3F;
    --ok: #5FCB92;
    --ok-soft: #173A2A;
    --bad: #F08AA0;
    --bad-soft: #40202A;
    --mark: rgba(214, 181, 60, 0.4);
  }
}
:root[data-theme="dark"] {
  --paper: #0F1B20;
  --card: #16272E;
  --ink: #E4EEF1;
  --slate: #9DB2BA;
  --line: #2C444E;
  --teal: #5CC2C6;
  --teal-soft: #1B3A3F;
  --ok: #5FCB92;
  --ok-soft: #173A2A;
  --bad: #F08AA0;
  --bad-soft: #40202A;
  --mark: rgba(214, 181, 60, 0.4);
}
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
*, *::before, *::after { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 1rem;
  line-height: 1.5;
}
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--teal); outline-offset: 2px; }

.app {
  display: grid;
  grid-template-columns: 250px minmax(0, 1fr);
  gap: 2.5rem;
  max-width: 1120px;
  margin: 0 auto;
  padding: 2rem 1.5rem 4rem;
}

/* Rail */
.rail {
  position: sticky;
  top: 2rem;
  align-self: start;
}
.brand h1 {
  font-family: var(--serif);
  font-size: 1.5rem;
  line-height: 1.2;
  margin: 0 0 0.25rem;
  font-weight: 600;
}
.brand p { margin: 0; color: var(--slate); font-size: 0.95rem; }
.count { margin: 1.25rem 0 0.6rem; font-weight: 600; font-size: 0.95rem; }
.grid {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 0.4rem;
}
.num {
  position: relative;
  min-height: 44px;
  border: 1.5px solid var(--line);
  background: var(--card);
  border-radius: 8px;
  font-weight: 600;
}
.num.right { background: var(--ok-soft); border-color: var(--ok); color: var(--ok); }
.num.wrong { background: var(--bad-soft); border-color: var(--bad); color: var(--bad); }
.num.shown { border-style: dashed; border-color: var(--teal); color: var(--teal); }
.num.right::after, .num.wrong::after {
  position: absolute;
  top: 1px;
  right: 4px;
  font-size: 0.65rem;
}
.num.right::after { content: "\2713"; }
.num.wrong::after { content: "\2715"; }
.num.cur { box-shadow: 0 0 0 3px var(--teal); }
.links { display: flex; gap: 0.5rem; margin-top: 1rem; flex-wrap: wrap; }
.link {
  min-height: 40px;
  padding: 0 0.9rem;
  border: 1.5px solid var(--line);
  border-radius: 8px;
  background: transparent;
  font-weight: 600;
}
.link.cur { border-color: var(--teal); background: var(--teal-soft); }
.hint { margin: 1.25rem 0 0; color: var(--slate); font-size: 0.85rem; }

/* Card */
.card {
  background: var(--card);
  border: 1.5px solid var(--line);
  border-radius: 14px;
  padding: 2rem 2.25rem;
}
main:focus { outline: none; }
.meta {
  display: flex;
  justify-content: space-between;
  gap: 1rem;
  flex-wrap: wrap;
  color: var(--slate);
  font-size: 0.92rem;
  margin: 0 0 1rem;
}
.stem {
  font-family: var(--serif);
  font-weight: 400;
  font-size: 1.3rem;
  line-height: 1.6;
  margin: 0 0 1.5rem;
  max-width: 68ch;
}
.opts { display: grid; gap: 0.6rem; }
.opt {
  display: grid;
  grid-template-columns: 2rem 1fr auto;
  align-items: start;
  gap: 0.75rem;
  width: 100%;
  min-height: 52px;
  padding: 0.75rem 1rem;
  text-align: left;
  background: var(--card);
  border: 1.5px solid var(--line);
  border-radius: 10px;
  line-height: 1.45;
}
.opt:hover:not(:disabled) { border-color: var(--teal); }
.opt[aria-checked="true"] { border-color: var(--teal); background: var(--teal-soft); }
.opt:disabled { cursor: default; color: inherit; }
.opt .k {
  display: grid;
  place-items: center;
  width: 1.9rem;
  height: 1.9rem;
  border: 1.5px solid currentColor;
  border-radius: 50%;
  font-weight: 700;
  font-size: 0.9rem;
}
.multi .opt .k { border-radius: 6px; }
.opt .tag { font-size: 0.85rem; font-weight: 600; white-space: nowrap; padding-top: 0.15rem; }
.opt.is-correct { border-color: var(--ok); background: var(--ok-soft); }
.opt.is-correct .tag, .opt.is-correct .k { color: var(--ok); }
.opt.is-wrong { border-color: var(--bad); background: var(--bad-soft); }
.opt.is-wrong .tag, .opt.is-wrong .k { color: var(--bad); }

.actions, .nav { display: flex; gap: 0.75rem; flex-wrap: wrap; margin-top: 1.5rem; }
.btn {
  min-height: 46px;
  padding: 0 1.25rem;
  border-radius: 10px;
  border: 1.5px solid var(--teal);
  background: transparent;
  color: var(--teal);
  font-weight: 700;
}
.btn.primary { background: var(--teal); color: var(--card); }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.nav { justify-content: space-between; margin-top: 2rem; padding-top: 1.5rem; border-top: 1.5px solid var(--line); }

.banner {
  margin-top: 1.5rem;
  padding: 1rem 1.25rem;
  border-radius: 10px;
  border: 1.5px solid;
}
.banner strong { font-size: 1.1rem; }
.banner p { margin: 0.2rem 0 0; }
.banner.ok { background: var(--ok-soft); border-color: var(--ok); }
.banner.bad { background: var(--bad-soft); border-color: var(--bad); }
.banner.info { background: var(--teal-soft); border-color: var(--teal); }

.detail h3 {
  font-family: var(--serif);
  font-size: 1.15rem;
  margin: 2rem 0 0.75rem;
  font-weight: 600;
}
.detail ol { margin: 0; padding-left: 1.4rem; max-width: 68ch; }
.detail ol li { margin-bottom: 0.4rem; }
.clue { margin: 0 0 0.9rem; max-width: 68ch; }
.clue mark {
  background: linear-gradient(transparent 50%, var(--mark) 50%);
  color: inherit;
  padding: 0 0.15em;
  font-weight: 600;
}
.clue span { display: block; color: var(--slate); margin-top: 0.15rem; }
.why {
  border-left: 4px solid var(--line);
  padding: 0.1rem 0 0.1rem 1rem;
  margin: 0 0 1.1rem;
  max-width: 68ch;
}
.why.good { border-left-color: var(--ok); }
.why.miss { border-left-color: var(--bad); }
.why h4 { margin: 0 0 0.25rem; font-size: 1rem; }
.why h4 em { font-style: normal; font-weight: 700; margin-left: 0.4rem; }
.why.good h4 em { color: var(--ok); }
.why.miss h4 em { color: var(--bad); }
.why p { margin: 0; }
.final {
  margin-top: 2rem;
  padding: 1rem 1.25rem;
  border-radius: 10px;
  background: var(--teal-soft);
  border: 1.5px solid var(--teal);
}
.final h3 { margin: 0 0 0.4rem; }
.final p { margin: 0.15rem 0; }

/* Score and key review */
.rows { display: grid; gap: 0.5rem; margin-top: 1.25rem; }
.row {
  display: grid;
  grid-template-columns: 2.2rem 1fr auto;
  gap: 0.75rem;
  align-items: center;
  padding: 0.6rem 0.8rem;
  border: 1.5px solid var(--line);
  border-radius: 10px;
}
.row .st { font-weight: 600; font-size: 0.9rem; }
.row .st.right { color: var(--ok); }
.row .st.wrong { color: var(--bad); }
.row .st.shown { color: var(--teal); }
.row button { min-height: 40px; padding: 0 0.9rem; border-radius: 8px; border: 1.5px solid var(--teal); background: transparent; color: var(--teal); font-weight: 600; }
.card h2 { font-family: var(--serif); font-size: 1.6rem; margin: 0 0 0.5rem; font-weight: 600; }
.lead { max-width: 62ch; color: var(--slate); margin: 0 0 1rem; }
.flag { margin: 0 0 1.4rem; max-width: 68ch; border-left: 4px solid var(--teal); padding-left: 1rem; }
.flag h4 { margin: 0 0 0.3rem; font-size: 1.02rem; }
.flag p { margin: 0; }

@media (max-width: 860px) {
  .app { display: block; padding: 0 0 3rem; }
  .rail {
    position: sticky;
    top: env(safe-area-inset-top, 0px);
    z-index: 5;
    background: var(--paper);
    border-bottom: 1.5px solid var(--line);
    padding: 0.6rem 1rem 0.7rem;
  }
  .brand { display: flex; align-items: baseline; justify-content: space-between; gap: 0.75rem; }
  .brand h1 { font-size: 1.1rem; }
  .brand p { display: none; }
  .count { margin: 0.2rem 0 0.4rem; font-size: 0.85rem; }
  .grid { display: flex; overflow-x: auto; gap: 0.4rem; padding-bottom: 0.3rem; }
  .num { flex: 0 0 44px; }
  .links { margin-top: 0.4rem; }
  .hint { display: none; }
  main { padding: 1rem; }
  .card { padding: 1.25rem 1.1rem; border-radius: 12px; }
  .stem { font-size: 1.15rem; }
  .opt { grid-template-columns: 2rem 1fr; }
  .opt .tag { grid-column: 2; }
  .nav .btn { flex: 1; }
}
@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; animation: none !important; scroll-behavior: auto !important; }
}
</style>
</head>
<body>
<div class="app">
  <aside class="rail" id="rail" aria-label="Question navigation"></aside>
  <main id="main" tabindex="-1"></main>
</div>

<script>
const Q = [
 {
  "t": "Biomolecules",
  "m": false,
  "s": "Cells build four classes of organic macromolecules from smaller subunits. Which item below is a macromolecule and not one of those subunits?",
  "o": [
   [
    "A",
    "Amino acid",
    false,
    "Wrong. Amino acids are the subunits of proteins. It would be correct if the question asked for the building block of a protein."
   ],
   [
    "B",
    "Nucleotide",
    false,
    "Wrong. Nucleotides are the subunits of nucleic acids. It would be correct if the question asked for the building block of DNA or RNA."
   ],
   [
    "C",
    "Protein",
    true,
    "Correct. A protein is a polymer of amino acids. The four organic macromolecule classes are carbohydrates, proteins, lipids and nucleic acids."
   ],
   [
    "D",
    "Fatty acid",
    false,
    "Wrong. Fatty acids are small molecules that serve as components of many lipids. It would be correct if the question asked for a micromolecule that builds lipids."
   ],
   [
    "E",
    "Monosaccharide",
    false,
    "Wrong. Monosaccharides are the subunits of carbohydrates. It would be correct if the question asked for the building block of a polysaccharide."
   ]
  ],
  "st": [
   "Recall the four macromolecule classes: carbohydrates, proteins, lipids and nucleic acids.",
   "Sort each option as a subunit or an assembled polymer.",
   "Choose the polymer."
  ],
  "cl": [
   [
    "not one of those subunits",
    "Look for the assembled class member, not its building block."
   ],
   [
    "four classes of organic macromolecules",
    "Carbohydrates, proteins, lipids and nucleic acids."
   ]
  ]
 },
 {
  "t": "Biomolecules",
  "m": true,
  "s": "Which statements comparing DNA and RNA are true? Select all that apply.",
  "o": [
   [
    "A",
    "DNA contains uracil and RNA contains thymine.",
    false,
    "False. The bases are reversed. The statement would be true only if the two nucleic acids were swapped."
   ],
   [
    "B",
    "DNA is double stranded and relatively stable.",
    true,
    "True. The double-stranded structure gives DNA the stability needed for long-term storage of genetic information."
   ],
   [
    "C",
    "RNA contains uracil where DNA contains thymine.",
    true,
    "True. Uracil replaces thymine in RNA."
   ],
   [
    "D",
    "RNA is usually single stranded and is degraded quickly.",
    true,
    "True. Rapid turnover lets a cell adjust which proteins it makes."
   ],
   [
    "E",
    "DNA is translated directly into protein.",
    false,
    "False. Messenger RNA is translated into protein. The statement would be true only if it named mRNA."
   ]
  ],
  "st": [
   "Recall the base difference: DNA uses thymine and RNA uses uracil.",
   "Recall structure and stability: DNA is double stranded and stable, RNA is single stranded and short lived.",
   "Recall the flow of information: mRNA, not DNA, is translated."
  ],
  "cl": [
   [
    "translated directly",
    "Translation reads mRNA, so a claim about DNA translation is a trap."
   ],
   [
    "swapped",
    "Reversed base assignments are false."
   ]
  ]
 },
 {
  "t": "Biomolecules",
  "m": false,
  "s": "A reaction proceeds on its own but slowly. A cell adds an enzyme and the reaction speeds up. Which statement best explains what the enzyme does?",
  "o": [
   [
    "A",
    "It supplies the energy needed to reach the transition state.",
    false,
    "Wrong. Enzymes do not supply energy. This would describe coupling to ATP hydrolysis in a reaction that is not spontaneous."
   ],
   [
    "B",
    "It lowers the activation energy of the reaction.",
    true,
    "Correct. Enzymes lower the activation energy. They do not change the reactants, the end products or the direction of a spontaneous reaction."
   ],
   [
    "C",
    "It changes the end products so the reaction proceeds in a new direction.",
    false,
    "Wrong. Enzymes leave the reactants and end products unchanged. A change in products would mean a different reaction."
   ],
   [
    "D",
    "It is used up as the reaction proceeds.",
    false,
    "Wrong. Enzymes are reusable. Substrates are the molecules consumed."
   ]
  ],
  "st": [
   "Note that the reaction is spontaneous but slow.",
   "Ask what limits the rate. The activation energy barrier does.",
   "Choose the option that lowers the barrier and leaves reactants and products unchanged."
  ],
  "cl": [
   [
    "proceeds on its own but slowly",
    "A spontaneous reaction with a high barrier. An enzyme lowers the barrier."
   ],
   [
    "speeds up",
    "Rate changes, but the products do not."
   ]
  ]
 },
 {
  "t": "Histology basics",
  "m": false,
  "s": "In an H&E section, nuclei stain blue-purple and much of the cytoplasm stains pink. Which statement explains the staining?",
  "o": [
   [
    "A",
    "Hematoxylin is acidic and binds basic structures. Eosin is basic and binds acidic structures.",
    false,
    "Wrong. The dye charges are reversed. This would be correct only if nuclei were basic, which they are not."
   ],
   [
    "B",
    "Hematoxylin and eosin are both basic dyes that differ only in colour.",
    false,
    "Wrong. The two dyes have opposite charges, which is why they stain different structures."
   ],
   [
    "C",
    "Hematoxylin is basic and binds basic structures. Eosin is acidic and binds acidic structures.",
    false,
    "Wrong. Dyes bind structures of opposite charge, not like charge."
   ],
   [
    "D",
    "Hematoxylin is basic and binds acidic structures such as nucleic acids. Eosin is acidic and binds basic structures such as many cytoplasmic proteins.",
    true,
    "Correct. Each dye binds structures of the opposite charge. Nucleic acids are acidic, so they take up the basic dye hematoxylin and appear blue."
   ]
  ],
  "st": [
   "Note that nucleic acids are acidic.",
   "A basic dye binds acidic structures, so hematoxylin stains nuclei blue.",
   "Eosin is acidic and stains basic components pink."
  ],
  "cl": [
   [
    "nuclei stain blue-purple",
    "Acidic nucleic acids bind the basic dye hematoxylin."
   ],
   [
    "cytoplasm stains pink",
    "Basic proteins bind the acidic dye eosin."
   ]
  ]
 },
 {
  "t": "Cell biology",
  "m": false,
  "s": "Which cell specialization is NOT possible?",
  "o": [
   [
    "A",
    "A cell keeps permanently open pores in its surface so that small and large molecules pass freely.",
    true,
    "Correct, because this is not possible. Constantly open pores destroy the integrity of the cytoplasm and the cell dies. Cells use channels that selectively regulate passage instead."
   ],
   [
    "B",
    "A B cell expands its rough endoplasmic reticulum to make large amounts of antibody.",
    false,
    "This is possible, so it is not the answer. Cells that secrete large amounts of protein have extensive rough ER. It would be the answer only if it said such cells lose their ER."
   ],
   [
    "C",
    "An intestinal epithelial cell forms microvilli to increase its absorptive surface area.",
    false,
    "This is possible, so it is not the answer. Microvilli increase surface area for absorption."
   ],
   [
    "D",
    "A lens fibre cell loses its nucleus so light passes without disruption.",
    false,
    "This is possible, so it is not the answer. Lens fibre cells lose their nuclei."
   ],
   [
    "E",
    "Skeletal muscle cells fuse to form large multinucleated fibres.",
    false,
    "This is possible, so it is not the answer. Skeletal muscle fibres are multinucleated cells."
   ]
  ],
  "st": [
   "Read the stem. You are looking for the impossible specialization.",
   "Test each option against known examples: B cells, enterocytes, lens fibre cells, muscle fibres.",
   "Spot the option that removes selective control of the membrane."
  ],
  "cl": [
   [
    "NOT possible",
    "The true statements are the distractors."
   ],
   [
    "permanently open pores",
    "A cell needs selective control of what crosses its membrane."
   ]
  ]
 },
 {
  "t": "Evidence-based medicine",
  "m": false,
  "s": "Which statement best describes evidence-based medicine (EBM)?",
  "o": [
   [
    "A",
    "Clinicians use scientific evidence exclusively and set aside clinical judgment.",
    false,
    "Wrong. EBM does not exclude judgment. This would describe a rigid protocol approach."
   ],
   [
    "B",
    "Clinicians integrate the best available evidence with clinical expertise and patient values and preferences.",
    true,
    "Correct. EBM combines evidence, expertise and patient values. It also aims to reduce unwarranted variation in care."
   ],
   [
    "C",
    "Clinicians follow expert opinion first and use evidence only when experts disagree.",
    false,
    "Wrong. Expert opinion is the lowest tier of evidence. This would describe opinion-based practice."
   ],
   [
    "D",
    "Clinicians give every patient the same treatment regardless of preference.",
    false,
    "Wrong. EBM reduces unwarranted variation but still incorporates patient preferences."
   ]
  ],
  "st": [
   "Recall the three inputs to an EBM decision: best evidence, clinical expertise and patient values.",
   "Reject statements that use one input alone.",
   "Choose the integrated statement."
  ],
  "cl": [
   [
    "best available evidence",
    "EBM uses the best evidence, not evidence exclusively."
   ],
   [
    "patient values and preferences",
    "Patient preferences are part of the decision."
   ]
  ]
 },
 {
  "t": "Evidence-based medicine",
  "m": false,
  "s": "You search for randomized trials of mRNA vaccination in children, compared with placebo, that measure symptomatic infection. In the PICO framework, which letter matches 'placebo'?",
  "o": [
   [
    "A",
    "P",
    false,
    "Wrong. P is the population, here children. It would be correct if the question asked about 'children'."
   ],
   [
    "B",
    "I",
    false,
    "Wrong. I is the intervention, here mRNA vaccination. It would be correct if the question asked about 'mRNA vaccination'."
   ],
   [
    "C",
    "C",
    true,
    "Correct. C is the comparator or control, here placebo."
   ],
   [
    "D",
    "O",
    false,
    "Wrong. O is the outcome, here symptomatic infection. It would be correct if the question asked about 'symptomatic infection'."
   ]
  ],
  "st": [
   "Split the stem into parts: children, mRNA vaccination, placebo, symptomatic infection.",
   "Assign each part: population, intervention, comparator, outcome.",
   "Choose the letter for the comparator."
  ],
  "cl": [
   [
    "compared with placebo",
    "The comparison group is the comparator."
   ]
  ]
 },
 {
  "t": "Evidence-based medicine",
  "m": false,
  "s": "In 2026, investigators review company personnel files from 1990 to 2015 to score employees' asbestos exposure by work location and duration. They then use tumour registries to find who developed mesothelioma. They did not assign exposure. Which design is this?",
  "o": [
   [
    "A",
    "Retrospective cohort",
    true,
    "Correct. Exposure was not assigned, so the design is observational. Groups were defined by exposure, so it is a cohort. Records from the past were used, so it is retrospective."
   ],
   [
    "B",
    "Case-control",
    false,
    "Wrong. A case-control study starts with people who have the outcome and compares their past exposure with controls. It would be correct if the investigators had started with patients who had mesothelioma."
   ],
   [
    "C",
    "Prospective cohort",
    false,
    "Wrong. A prospective cohort enrols people now and follows them forward. It would be correct if the investigators had started in 2026 and waited for outcomes."
   ],
   [
    "D",
    "Cross-sectional",
    false,
    "Wrong. A cross-sectional study measures exposure and outcome at one point in time. It would be correct if a single survey measured both."
   ],
   [
    "E",
    "Randomized controlled trial",
    false,
    "Wrong. An RCT assigns exposure by randomization. It would be correct if the investigators had allocated exposure."
   ]
  ],
  "st": [
   "Ask whether exposure was assigned. It was not, so the study is observational.",
   "Ask how groups were formed. By exposure, so it is a cohort.",
   "Ask when the data were gathered. From past records, so it is retrospective."
  ],
  "cl": [
   [
    "did not assign exposure",
    "Observational design."
   ],
   [
    "score employees' exposure ... then find who developed",
    "Exposure first, outcome second. This is a cohort."
   ],
   [
    "personnel files from 1990 to 2015",
    "Past records make it retrospective."
   ]
  ]
 },
 {
  "t": "Evidence-based medicine",
  "m": false,
  "s": "Which statement about trial design is correct?",
  "o": [
   [
    "A",
    "Blinding reduces confounding by unknown factors. Randomization reduces bias in outcome assessment.",
    false,
    "Wrong. The roles are swapped. It would be correct if the two terms were exchanged."
   ],
   [
    "B",
    "Matching balances known and unknown confounders equally.",
    false,

const state = { view: "quiz", i: 0, a: Q.map(() => ({ sel: [], checked: false, shown: false })) };
const rail = document.getElementById("rail");
const main = document.getElementById("main");
const LABEL = { open: "not answered", right: "correct", wrong: "incorrect", shown: "answer shown" };

function el(tag, props) {
  const n = document.createElement(tag);
  if (props) {
    for (const k in props) {
      const v = props[k];
      if (v === null || v === undefined || v === false) continue;
      if (k === "class") n.className = v;
      else if (k === "text") n.textContent = v;
      else if (k.startsWith("on")) n.addEventListener(k.slice(2), v);
      else n.setAttribute(k, v === true ? "" : v);
    }
  }
  for (let i = 2; i < arguments.length; i++) {
    const kids = [].concat(arguments[i]);
    kids.forEach(function (c) {
      if (c === null || c === undefined || c === false) return;
      n.append(c.nodeType ? c : document.createTextNode(c));
    });
  }
  return n;
}

function correctKeys(q) { return q.o.filter(function (x) { return x[2]; }).map(function (x) { return x[0]; }); }
function sameSet(a, b) { return a.length === b.length && a.every(function (x) { return b.indexOf(x) !== -1; }); }
function status(i) {
  const a = state.a[i];
  if (a.checked) return sameSet(a.sel, correctKeys(Q[i])) ? "right" : "wrong";
  if (a.shown) return "shown";
  return "open";
}

function go(i) {
  state.view = "quiz";
  state.i = i;
  render();
  window.scrollTo(0, 0);
  main.focus({ preventScroll: true });
}
function showView(v) {
  state.view = v;
  render();
  window.scrollTo(0, 0);
  main.focus({ preventScroll: true });
}

function renderRail() {
  rail.innerHTML = "";
  const checked = state.a.filter(function (x) { return x.checked; }).length;
  rail.append(
    el("div", { class: "brand" },
      el("h1", { text: "Week 2 practice" }),
      el("p", { text: "Foundations of Medicine, Block 1" })),
    el("p", { class: "count", text: checked + " of " + Q.length + " checked" }),
    el("div", { class: "grid" }, Q.map(function (q, i) {
      const s = status(i);
      const cur = state.view === "quiz" && state.i === i;
      return el("button", {
        class: "num " + s + (cur ? " cur" : ""),
        type: "button",
        "aria-label": "Question " + (i + 1) + ", " + LABEL[s],
        "aria-current": cur ? "true" : null,
        onclick: function () { go(i); },
        text: String(i + 1)
      });
    })),
    el("div", { class: "links" },
      el("button", { class: "link" + (state.view === "score" ? " cur" : ""), type: "button", onclick: function () { showView("score"); }, text: "Score" }),
      el("button", { class: "link" + (state.view === "key" ? " cur" : ""), type: "button", onclick: function () { showView("key"); }, text: "Key review" })),
    el("p", { class: "hint", text: "Keys A to F pick an option. Arrow keys move between questions." })
  );
}

  const card = el("article", { class: "card" });

  card.append(el("div", { class: "meta" },
    el("span", { text: "Question " + (state.i + 1) + " of " + Q.length + ", " + q.t }),
    el("span", { text: q.m ? "Select all that apply" : "Select one" })));
  card.append(el("h2", { class: "stem", text: q.s }));

  const opts = el("div", { class: "opts" + (q.m ? " multi" : ""), role: q.m ? "group" : "radiogroup", "aria-label": "Answer options" });
  q.o.forEach(function (o) {
    const on = a.sel.indexOf(o[0]) !== -1;
    let cls = "opt";
    let tag = "";
    if (done) {
      if (o[2]) {
        cls += " is-correct";
        tag = on ? "Your choice, correct" : (a.checked ? "Correct answer" : "Correct answer");
        if (!on && a.checked && q.m) tag = "Missed";
      } else if (on) {
        cls += " is-wrong";
        tag = "Your choice, wrong";
      }
    }
    opts.append(el("button", {
      class: cls,
      type: "button",
      role: q.m ? "checkbox" : "radio",
      "aria-checked": on ? "true" : "false",
      disabled: done ? true : null,
      onclick: function () { pick(o[0]); }
    }, el("span", { class: "k", text: o[0] }), el("span", { class: "tx", text: o[1] }), tag ? el("span", { class: "tag", text: tag }) : null));
  });
  card.append(opts);

  if (!done) {
    card.append(el("div", { class: "actions" },
      el("button", { class: "btn primary", type: "button", disabled: a.sel.length ? null : true, onclick: check, text: "Check answer" }),
      el("button", { class: "btn", type: "button", onclick: showAnswer, text: "Show answer" })));
  } else {
    const ok = a.checked && sameSet(a.sel, ck);
    let bClass = "banner info", head = "Answer shown", body = "Correct: " + ck.join(", ") + ".";
    if (a.checked) {
      bClass = ok ? "banner ok" : "banner bad";
      head = ok ? "Correct" : "Not quite";
      body = "Correct answer: " + ck.join(", ") + ". You chose " + a.sel.join(", ") + ".";
    }
    card.append(el("div", { class: bClass, role: "status" }, el("strong", { text: head }), el("p", { text: body })));

    const d = el("div", { class: "detail" });
    d.append(el("h3", { text: "Step by step" }), el("ol", null, q.st.map(function (s) { return el("li", { text: s }); })));
    d.append(el("h3", { text: "High-yield clues" }), ...q.cl.map(function (c) {
      return el("p", { class: "clue" }, el("mark", { text: c[0] }), el("span", { text: "Indicates: " + c[1] }));
    }));
    d.append(el("h3", { text: "Why each option is right or wrong" }), ...q.o.map(function (o) {
      return el("div", { class: "why " + (o[2] ? "good" : "miss") },
        el("h4", null, o[0] + ". " + o[1], el("em", { text: o[2] ? "Correct" : "Incorrect" })),
        el("p", { text: o[3] }));
    }));
    d.append(el("div", { class: "final" },
      el("h3", { text: "Final answer" }),
      q.o.filter(function (o) { return o[2]; }).map(function (o) { return el("p", { text: o[0] + ". " + o[1] }); })));
    card.append(d);
  }

  card.append(el("div", { class: "nav" },
    el("button", { class: "btn", type: "button", disabled: state.i === 0 ? true : null, onclick: function () { go(state.i - 1); }, text: "Previous" }),
    el("button", { class: "btn primary", type: "button", onclick: function () { if (state.i < Q.length - 1) go(state.i + 1); else showView("score"); }, text: state.i < Q.length - 1 ? "Next question" : "See score" })));

  main.append(card);
}

function pick(k) {
  const q = Q[state.i], a = state.a[state.i];
  if (a.checked || a.shown) return;
  if (q.m) {
    const at = a.sel.indexOf(k);
    if (at === -1) a.sel.push(k); else a.sel.splice(at, 1);
    a.sel.sort();
  } else {
    a.sel = [k];
  }
  render();
}
function check() {
  const a = state.a[state.i];
  if (!a.sel.length) return;
  a.checked = true;
  render();
}
function showAnswer() {
  state.a[state.i].shown = true;
  render();
}

function renderScore() {
  const right = Q.filter(function (q, i) { return status(i) === "right"; }).length;
  const checked = state.a.filter(function (x) { return x.checked; }).length;
  const shown = state.a.filter(function (x) { return x.shown && !x.checked; }).length;
  const open = Q.length - checked - shown;
  const card = el("article", { class: "card" });
  card.append(el("h2", { text: "Score" }));
  card.append(el("p", { class: "lead", text: "You answered " + right + " of " + checked + " checked questions correctly. " + shown + " had the answer shown and " + open + " remain open. Multiple-choice questions with several answers need every correct option and no wrong ones." }));
  card.append(el("div", { class: "rows" }, Q.map(function (q, i) {
    const s = status(i);
    return el("div", { class: "row" },
      el("span", { text: String(i + 1) }),
      el("span", null, q.t, " ", el("span", { class: "st " + s, text: "(" + LABEL[s] + ")" })),
      el("button", { type: "button", onclick: function () { go(i); }, text: "Open" }));
  })));
  card.append(el("div", { class: "actions" }, el("button", { class: "btn", type: "button", onclick: restart, text: "Restart all questions" })));
  main.append(card);
}

function restart() {
  state.a = Q.map(function () { return { sel: [], checked: false, shown: false }; });
  go(0);
}

function renderKey() {
  const card = el("article", { class: "card" });
  card.append(el("h2", { text: "Notes on the original answer key" }));
  card.append(el("p", { class: "lead", text: "I reviewed every Week 2 answer while writing these questions. Most keys hold up. These eight items deserve a second look before you rely on them." }));
  KEY.forEach(function (k) {
    card.append(el("div", { class: "flag" }, el("h4", { text: k[0] }), el("p", { text: k[1] })));
  });
  main.append(card);
}

function render() {
  main.innerHTML = "";
  renderRail();
  if (state.view === "quiz") renderQuestion();
  else if (state.view === "score") renderScore();
  else renderKey();
}

document.addEventListener("keydown", function (e) {
  if (e.metaKey || e.ctrlKey || e.altKey || state.view !== "quiz") return;
  if (e.key === "ArrowRight" && state.i < Q.length - 1) { go(state.i + 1); return; }
  if (e.key === "ArrowLeft" && state.i > 0) { go(state.i - 1); return; }
  const k = e.key.toUpperCase();
  if (k.length === 1 && Q[state.i].o.some(function (o) { return o[0] === k; })) pick(k);
});

render();
</script>
</body>
</html>
