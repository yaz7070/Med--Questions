<script>
const QUESTIONS = [{"c": "Somatic pathways", "p": "Aisha, 26, steps on a tack while barefoot. Pain fibres from the skin of her sole carry the signal toward her spinal cord. Which sequence correctly traces the signal from the skin to its first synapse?", "o": ["Ramus, DRG, spinal nerve, dorsal root, ventral grey horn", "Ramus, spinal nerve, ventral root, DRG, dorsal grey horn", "Ramus, spinal nerve, DRG, dorsal root, dorsal grey horn", "Spinal nerve, ramus, dorsal root, DRG, dorsal grey horn"], "a": 2, "e": "C is correct. The general somatic pathway runs from the general sensory neuron to the ramus, spinal nerve, DRG, dorsal root and dorsal grey horn, where it meets the secondary neuron to the brain.\nA: The DRG sits after the spinal nerve, and sensory fibres end in the dorsal, not ventral, grey horn.\nB: Sensory fibres enter through the dorsal root. The ventral root carries motor fibres out.\nD: The ramus comes before the spinal nerve, and the DRG comes before the dorsal root.\nHigh yield: Sensory = afferent, in through the dorsal root. Motor = efferent, out through the ventral root.", "l": ["W5 9.7"]}, {"c": "Somatic pathways", "p": "A neurology tutor tests reflexes on a healthy volunteer and asks the group about reflex arc anatomy. Which statement is correct?", "o": ["The patellar reflex arc is polysynaptic via an interneuron", "Reflex arc motor fibres leave the cord in the dorsal root", "Reflex arc sensory fibres end in the ventral grey horn", "The Achilles reflex arc has no interneuron in the cord"], "a": 3, "e": "D is correct. Most reflex arcs pass through an interneuron (polysynaptic). The patellar and Achilles reflex arcs have no interneuron (monosynaptic).\nA: The patellar arc is monosynaptic, like the Achilles arc.\nB: Motor fibres leave through the ventral root.\nC: Sensory fibres enter the dorsal grey horn. The general motor neuron sits in the ventral grey horn.\nHigh yield: Reflex arc: sensory neuron, DRG, dorsal root, dorsal grey horn, interneuron, ventral grey horn, motor neuron, ventral root.", "l": ["W5 9.7"]}, {"c": "Somatic pathways", "p": "Marco, 31, burns his fingertip on a stove. Your Week 5 quiz established that the dorsal root ganglion holds the cell bodies of general sensory neurons. Where does the pain signal from his finger make its first synapse?", "o": ["Dorsal root ganglion", "Dorsal grey horn of the spinal cord", "Sympathetic chain ganglion", "Ventral grey horn of the spinal cord"], "a": 1, "e": "B is correct. The general sensory neuron passes through the DRG without synapsing and enters the dorsal grey horn, where it synapses with the secondary neuron to the brain.\nA: The DRG holds cell bodies of unipolar sensory neurons and has no synapses.\nC: Sympathetic chain ganglia hold post-synaptic sympathetic cell bodies, not somatic sensory synapses.\nD: The ventral grey horn holds the LMN. Sensory fibres reach it only through an interneuron or the monosynaptic patellar and Achilles arcs.\nHigh yield: No synapses in the DRG. Synapses do occur in sympathetic chain ganglia.", "l": ["W5 9.6", "W5 9.7"]}, {"c": "Somatic pathways", "p": "Which statement about the organization of the nervous system is correct?", "o": ["Somatic motor fibres act on smooth muscle and cardiac muscle", "Somatic fibres travel in all spinal nerves and 12 cranial nerves", "The PNS includes 31 spinal nerve pairs, 8 of them cervical", "The CNS includes the brain, spinal cord and 12 cranial nerves"], "a": 2, "e": "C is correct. The PNS has 12 cranial nerve pairs and 31 spinal nerve pairs: 8 cervical, 12 thoracic, 5 lumbar, 5 sacral and 1 coccygeal.\nA: Smooth muscle, cardiac muscle, viscera and glands receive visceral motor (autonomic) fibres. Somatic motor fibres go to skeletal muscle.\nB: The somatic system is conveyed by all spinal nerves and only 4 cranial nerves.\nD: Cranial nerves belong to the PNS. The CNS is the brain and spinal cord.\nHigh yield: Somatic sensory carries pain, proprioception, temperature, pressure and touch from the body wall.", "l": ["W5 9.6", "W5 9.7"]}, {"c": "Autonomic pathways", "p": "During a dissection lab, a student finds a spinal nerve with both a white ramus communicans and a grey ramus communicans joining the sympathetic chain. At which level was this spinal nerve most likely taken?", "o": ["T8", "S3", "C6", "L5"], "a": 0, "e": "A is correct. Pre-synaptic sympathetic fibres enter the chain through the white ramus only at T1-L2/3. Post-synaptic fibres exit through the grey ramus to all spinal nerves. Only a nerve between T1 and L2/3 has both.\nB: S3 has a grey ramus only. Its parasympathetic fibres leave as pelvic splanchnics, not through a ramus to the chain.\nC: C6 has a grey ramus, since all spinal nerves do, but no white ramus.\nD: L5 lies below L2/3, so it has a grey ramus only.\nHigh yield: Sympathetic outflow is thoracolumbar. Parasympathetic outflow is craniosacral.", "l": ["W5 9.7"]}, {"c": "Autonomic pathways", "p": "A pre-synaptic sympathetic neuron with its cell body at T7 sends a fibre that reduces peristalsis in the stomach. Where does this fibre synapse with its post-synaptic neuron?", "o": ["A ganglion outside the sympathetic chain", "A chain ganglion at the T7 level", "The intermediolateral grey horn at T7", "The superior cervical ganglion"], "a": 0, "e": "A is correct. For abdominopelvic viscera, the pre-synaptic neuron (long) passes through the chain with no synapse, travels in an abdominopelvic splanchnic nerve (T5-L2/3) and synapses in a ganglion outside the sympathetic chain. The post-synaptic neuron is short.\nB: Synapse at the same-level chain ganglion is the trunk pathway, for body wall targets.\nC: The intermediolateral grey horn holds the pre-synaptic cell body, not the synapse.\nD: The superior cervical ganglion serves the head.\nHigh yield: Trunk: synapse in the chain at the same level. Head and limbs: ascend or descend in the chain. Abdominopelvic viscera: no synapse in the chain.", "l": ["W5 9.7"]}, {"c": "Autonomic pathways", "p": "During exercise, Ben's heart rate rises from 70 to 150 bpm through sympathetic stimulation. Along which route do post-synaptic sympathetic fibres reach his heart?", "o": ["Vagus nerve fibres from the medulla", "Cardiopulmonary splanchnic nerves from T1-T4", "Abdominopelvic splanchnic nerves from T5-L2/3", "Pelvic splanchnic nerves from S2-S4"], "a": 1, "e": "B is correct. Thoracic viscera receive sympathetic fibres from chain ganglia at the same or different levels through the cardiopulmonary splanchnic nerves (T1-4).\nA: The vagus is parasympathetic and lowers heart rate.\nC: Abdominopelvic splanchnics serve abdominal and pelvic viscera.\nD: Pelvic splanchnics are parasympathetic, from S2-4.\nHigh yield: SNS raises HR and force of contraction. PNS lowers both.", "l": ["W5 9.7", "W5 9.2"]}, {"c": "Autonomic pathways", "p": "A tumour at the apex of the lung damages the sympathetic chain near T1, cutting off pre-synaptic fibres that ascend the chain toward the head. In which ganglion do the post-synaptic neurons to the head normally have their cell bodies?", "o": ["Intermediolateral grey horn", "Superior cervical ganglion", "Stellate ganglion", "Ciliary ganglion"], "a": 1, "e": "B is correct. For the head, pre-synaptic fibres enter the chain at T1 and ascend to synapse in the superior cervical ganglion.\nA: The intermediolateral grey horn holds pre-synaptic cell bodies, not post-synaptic ones.\nC: The stellate ganglion is the inferior cervical ganglion fused with the T1 ganglion. It is not the ganglion named for the head.\nD: The ciliary ganglion is parasympathetic and receives fibres from CN III.\nHigh yield: Head: superior cervical ganglion. Upper limb: cervical ganglion. Lower limb: L2-S3.", "l": ["W5 9.7"]}, {"c": "Autonomic pathways", "p": "A student summarizes the autonomic supply of the forearm. Which of her statements is FALSE?", "o": ["Parasympathetic fibres do not innervate blood vessels", "Pre-synaptic sympathetic cell bodies lie in the lateral horn", "Post-synaptic sympathetic fibres join every spinal nerve", "Parasympathetic fibres reach forearm skin in spinal nerves", "Sympathetic fibres activate sweat secretion in the skin"], "a": 3, "e": "D is correct. Spinal nerves carry no parasympathetic component, and there is no parasympathetic input to the skin or extremities.\nA: True. The PNS does not innervate blood vessels. Vessels dilate when sympathetic tone is shut off.\nB: True. Pre-synaptic sympathetic cell bodies sit in the intermediolateral grey horn.\nC: True. Post-synaptic fibres exit through the grey ramus to all spinal nerves.\nE: True. The SNS activates sweat secretion.\nHigh yield: Sympathetic control of arterioles changes TPR in both directions by changing tonic activity.", "l": ["W5 9.7", "W5 9.2"]}, {"c": "Visceral afferents", "p": "Regarding visceral afferents and referred pain, which of the following statements are true?\ni) Visceral afferents return through the sympathetic chain and white ramus to the DRG\nii) The brain misreads visceral pain as body wall pain from the same spinal levels\niii) Referred visceral pain is sharp and well localized\niv) Pain from viscera below the pelvic pain line follows parasympathetics to S2-4", "o": ["i) and ii) only", "ii) and iii) only", "i), ii) and iii) only", "i), ii) and iv) only", "All of the above"], "a": 3, "e": "D is correct. Visceral afferents travel through splanchnic nerves, the sympathetic chain, the WRC, spinal nerve and DRG to the dorsal grey horn. The brain misinterprets this pain as body wall pain at those spinal levels. Below the pelvic pain line, pain follows parasympathetics to S2-4.\nA: Statement iv is also true.\nB: Statement iii is false. Referred pain is diffuse, non-specific and achy.\nC: Statement iii is false and statement iv is true.\nE: Statement iii is false.\nHigh yield: Above the pelvic pain line, follow sympathetics to T1-L3.", "l": ["W5 9.5"]}, {"c": "Visceral afferents", "p": "Victor, 45, has a stone lodged in his left kidney. He reports a dull ache in his lower abdomen and proximal medial thigh, with no back or shoulder pain. To which spinal levels does his brain attribute this visceral pain?", "o": ["C3-C5", "T1-T4", "T12-L1", "S2-S4"], "a": 2, "e": "C is correct. Visceral sensory fibres from the kidney come from the T12-L1 levels, so pain refers to the lower abdomen and proximal medial thigh, as in your Week 5 quiz.\nA: C3-C5 is the phrenic nerve level. Diaphragm irritation refers to the shoulder.\nB: T1-T4 carries sympathetic supply to thoracic viscera.\nD: S2-S4 serves viscera below the pelvic pain line.\nHigh yield: Referred pain maps visceral afferents onto the body wall supplied by the same spinal levels.", "l": ["W5 9.5"]}, {"c": "Tracts and cord structure", "p": "An MRI shows a lesion confined to one region of the spinal cord. The radiology resident reviews cord anatomy. Which statement is correct?", "o": ["The spinal cord ends at L5, with cauda equina below", "Cord grey matter carries ascending and descending tracts", "Cord grey matter is inside, with white matter tracts outside", "Cord white matter holds the neuronal cell bodies"], "a": 2, "e": "C is correct. The spinal cord has grey matter (neuronal cell bodies) inside and white matter (ascending sensory and descending motor tracts) outside. The brain is the reverse.\nA: The cord ends at L1, with the cauda equina (lumbar roots) below L1.\nB: The tracts run in the outer white matter.\nD: Cell bodies sit in grey matter. White matter holds axon tracts.\nHigh yield: Brain: grey outside, white inside. Cord: grey inside, white outside.", "l": ["W7 6.1"]}, {"c": "Tracts and cord structure", "p": "A neuroanatomy tutor asks where two sensory pathways cross the midline. Which pairing is correct for the vibration and proprioception pathway, then the pain and temperature pathway, in order?", "o": ["Thalamus, then at entry to the spinal cord", "At entry to the spinal cord, then medulla", "Medulla for both of the two pathways", "Medulla, then at entry to the spinal cord"], "a": 3, "e": "D is correct. The dorsal column (vibration and proprioception) runs ipsilateral in the dorsal cord and crosses in the medulla. The spinothalamic tract (pain and temperature) crosses at entry to the cord and runs contralateral in the lateral cord.\nA: The thalamus is a relay station on both pathways, not the crossing point.\nB: This reverses the two tracts.\nC: Spinothalamic fibres cross as soon as they enter the cord.\nHigh yield: Sensory pathway: nerves, roots, cord, brainstem, thalamus, white matter, primary sensory cortex.", "l": ["W7 6.2"]}, {"c": "Tracts and cord structure", "p": "Mr. Haddad, 70, develops sudden weakness of his left arm, left leg and the left side of his face over a few minutes. He has brisk reflexes and an extensor plantar response on the left. Where is the lesion?", "o": ["Left cervical spinal cord", "Right cerebral hemisphere", "Right cervical spinal cord", "Left cerebral hemisphere"], "a": 1, "e": "B is correct. Face involvement with arm and leg weakness (hemibody pattern) places the lesion in the brain. Motor fibres cross in the medullary pyramids, so left-sided weakness comes from the right hemisphere. A hyperacute onset over minutes points to stroke.\nA: A cord lesion spares the face, and the left cord affects the left limbs below it without facial weakness.\nC: A cord lesion spares the face.\nD: The left hemisphere controls the right side of the body.\nHigh yield: Motor cortex plans movement for the contralateral side.", "l": ["W7 6.2", "W7 6.4"]}, {"c": "Localization", "p": "Jordan, 22, is rear-ended and hits his neck. He now has weakness in both arms and both legs, hyperactive reflexes in all four limbs and bilateral extensor plantar responses. His face, speech, eye movements and swallowing are normal. Where is the lesion?", "o": ["Thoracic spinal cord", "Cervical spinal cord", "Brainstem", "Neuromuscular junction"], "a": 1, "e": "B is correct. UMN signs in all four limbs (quadriparesis) with normal cranial nerves localize to the cervical spinal cord.\nA: A thoracic lesion causes paraparesis and spares the arms.\nC: Brainstem lesions involve cranial nerves, which are normal here.\nD: The NMJ gives LMN-type weakness with eye and swallowing involvement.\nHigh yield: Hyperacute onset after trauma fits the trauma category of the time course.", "l": ["W7 6.3", "W7 6.4"]}, {"c": "Localization", "p": "Leon, 58, has weak, wasted muscles of his right hand. The examiner sees fasciculations, reduced tendon reflexes and a flexor plantar response, with normal tone. Which localization is LEAST consistent with these findings?", "o": ["Brainstem", "Peripheral nerve", "Anterior horn cell", "Spinal root"], "a": 0, "e": "A is correct. Atrophy, fasciculations, reduced reflexes and normal tone are LMN signs. The brainstem is a UMN localization.\nB: A peripheral nerve is an LMN site.\nC: The anterior horn cell is an LMN site, and fasciculations fit.\nD: A spinal root is an LMN site.\nHigh yield: UMN: brain, brainstem, spinal cord. LMN: anterior horn cell, root, nerve, NMJ, muscle.", "l": ["W7 6.3", "W7 6.4"]}, {"c": "Localization", "p": "Grace, 64, has 3 weeks of progressive weakness in both legs. Her arms are normal. Her leg muscles are wasted, ankle and knee reflexes are absent and plantar responses are flexor. Where is the lesion?", "o": ["Lumbar roots below L1", "Thoracic spinal cord", "Cervical spinal cord", "Neuromuscular junction"], "a": 0, "e": "A is correct. Weakness in both legs (paraparesis) arises in the thoracic cord or the lumbar roots. LMN signs (wasting, absent reflexes, flexor plantars) point below L1, where the cord has ended and only roots remain.\nB: A thoracic cord lesion gives UMN signs, as in the 65-year-old in your Week 7 quiz.\nC: A cervical lesion weakens all four limbs.\nD: NMJ weakness involves the eyes and swallowing.\nHigh yield: Paraparesis plus UMN signs means thoracic cord. Paraparesis plus LMN signs means lumbar roots.", "l": ["W7 6.3", "W7 6.4"]}, {"c": "Localization", "p": "Two patients have full strength on testing. Patient 1 overshoots when reaching for a cup and walks with an unsteady gait. Patient 2 struggles to start walking, moves slowly and has rigid limbs. Which pairing of structures is affected, in order?", "o": ["Motor cortex, then cerebellum", "Basal ganglia, then cerebellum", "Cerebellum, then basal ganglia", "Cerebellum, then motor cortex"], "a": 2, "e": "C is correct. Cerebellar lesions cause problems with coordination without weakness. Basal ganglia dysfunction causes difficulty initiating movement, slow movement and rigidity without weakness.\nA: A motor cortex lesion causes contralateral weakness.\nB: This reverses the two.\nD: Patient 2 shows parkinsonism from the basal ganglia, and a motor cortex lesion would cause weakness.\nHigh yield: Cerebellum improves accuracy. Basal ganglia control timing and integrate movement.", "l": ["W7 6.2", "W7 6.1"]}, {"c": "Localization", "p": "Farah, 52, has right leg weakness with hyperactive reflexes that has worsened steadily over the past 3 weeks. Based on the time course alone, which group of causes belongs at the top of her differential?", "o": ["Inflammation, infection, tumour or toxic", "Degenerative or hereditary disease", "Stroke, migraine aura or trauma", "Inflammation or infection only"], "a": 0, "e": "A is correct. Onset over days to weeks is subacute, with a differential of inflammation, infection, tumour and toxic causes.\nB: Degenerative and hereditary causes are chronic, over many months to years.\nC: Stroke, migraine aura and trauma are hyperacute, over seconds to minutes.\nD: Inflammation and infection alone are the acute list, over hours to a couple of days.\nHigh yield: Use VITAMINS C&D after localizing to build the full differential.", "l": ["W7 6.5"]}, {"c": "Localization", "p": "A clerk presents a patient with leg weakness and summarizes the symptoms and examination findings. Following the approach to weakness and lesion differential diagnosis, which step comes next?", "o": ["Determine the differential diagnosis", "Rate the onset and progression", "Plan investigations and management", "Localize the lesion"], "a": 3, "e": "D is correct. The approach is: describe the problem, localize the lesion, determine the differential, then plan investigations and management.\nA: The differential comes after localization.\nB: Rate of onset is part of building the differential, after localization.\nC: Planning is the final step.\nHigh yield: Describe, localize, differential, plan.", "l": ["W7 6.4"]}];
const OBJECTIVES = {"W5 9.7": "Describe the general organization and pathways of the somatic and autonomic nervous system", "W5 9.6": "Compare the structure and function of central and peripheral nervous systems", "W5 9.2": "Explain the basic mechanisms of neuronal and endocrine regulation of cardiovascular and renal systems", "W5 9.5": "Discuss the importance of understanding referred pain and outline the general pathway of visceral afferents", "W7 6.1": "Discuss organization of the nervous system", "W7 6.2": "Describe the basic motor, sensory and visual pathways within the nervous system", "W7 6.4": "Develop an approach to localization of lesions in the nervous system", "W7 6.3": "Distinguish between upper motor neuron vs lower motor neuron signs", "W7 6.5": "Apply an approach to differential diagnosis of lesions within the nervous system in case scenarios"};
const L = "ABCDE";
const N = QUESTIONS.length;
let cur = 0, showResults = false;
let ans = new Array(N).fill(null);           // current pick per question
let tries = QUESTIONS.map(()=>[]);           // every locked attempt: {pick, ok, at}
let strikes = QUESTIONS.map(()=>[]);         // struck option indexes for the open attempt
let history = [], db = null, uid = null, writing = false, dirty = false;
const LS_KEY = "quiz-progress-v2";
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");

function score(){ return ans.reduce((n,a,i)=>n+(a!==null&&a===QUESTIONS[i].a?1:0),0); }
function answered(){ return ans.filter(a=>a!==null).length; }
function firstTryScore(){ return tries.reduce((n,t)=>n+(t.length&&t[0].ok?1:0),0); }
function firstTryCount(){ return tries.filter(t=>t.length).length; }

function renderHeader(){
  $("#stats").innerHTML = `<span>Item <b>${showResults?"–":cur+1}</b> of <b>${N}</b></span><span>Answered <b>${answered()}</b></span><span>Score <b>${score()} / ${answered()}</b></span>`;
  $("#ticks").innerHTML = QUESTIONS.map((q,i)=>{
    const st = ans[i]===null?"":(ans[i]===q.a?"ok":"bad");
    const redo = tries[i].length>1 || (ans[i]===null && tries[i].length>0);
    return `<button class="tick ${st} ${redo?"redo":""} ${(!showResults&&i===cur)?"cur":""}" data-i="${i}" aria-label="Question ${i+1}"></button>`;
  }).join("");
  document.querySelectorAll(".tick").forEach(b=>b.onclick=()=>{cur=+b.dataset.i;showResults=false;render();});
}

function triesLine(i, includeCurrent){
  const t = includeCurrent ? tries[i] : tries[i];
  if(!t.length) return "";
  const parts = t.map((x,k)=>`<span class="${x.ok?"ok":"bad"}">${k+1}: ${L[x.pick]} ${x.ok?"correct":"wrong"}</span>`).join(" · ");
  return `<div class="tries">Attempts ${parts}</div>`;
}

function renderQ(){
  const q = QUESTIONS[cur], a = ans[cur], done = a!==null, st = strikes[cur];
  const opts = q.o.map((o,i)=>{
    let c = "";
    if(done){ if(i===q.a) c="right"; else if(i===a) c="wrong"; }
    const struck = !done && st.includes(i);
    const strikeBtn = done ? "" : `<button class="strike" data-s="${i}" aria-pressed="${struck}" aria-label="${struck?"Restore":"Strike out"} option ${L[i]}" title="${struck?"Restore":"Strike out"} option">${struck?"↺":"✕"}</button>`;
    return `<div class="optrow ${struck?"struck":""}"><button class="opt ${c}" data-i="${i}" ${done?"disabled":""}><span class="k">${L[i]}</span><span>${esc(o)}</span></button>${strikeBtn}</div>`;
  }).join("");
  let fb = "";
  if(done){
    const ok = a===q.a;
    const lines = q.e.split("\n").map(t=>`<p>${esc(t)}</p>`).join("");
    const objs = q.l.map(id=>`<div class="obj">Objective: ${esc(id)}. ${esc(OBJECTIVES[id]||"")}</div>`).join("");
    fb = `<div class="fb" role="status"><div class="verdict ${ok?"ok":"bad"}">${ok?"Correct.":"Incorrect. The answer is "+L[q.a]+"."}</div>${lines}${objs}${triesLine(cur)}<div class="fbtools"><button class="btn ghost" id="redo">Reset and redo this question</button></div></div>`;
  }
  const pre = (!done && tries[cur].length) ? `<div class="hint">Redo. Your earlier attempts are saved.</div>${triesLine(cur)}` : (!done ? `<div class="hint">Tap ✕ to strike out an option. Right-click works too.</div>` : "");
  const last = cur===N-1;
  $("#main").innerHTML = `<article class="card">
    <div class="chead"><span class="tag">${esc(q.c)}</span><span>Q${cur+1}</span></div>
    <p class="stem">${esc(q.p)}</p>
    ${pre}
    <div class="opts">${opts}</div>${fb}
    <div class="nav"><button class="btn ghost" id="prev" ${cur===0?"disabled":""}>Previous</button>
    <button class="btn" id="next" ${done?"":"disabled"}>${last?"See results":"Next"}</button></div>
  </article>`;
  document.querySelectorAll(".opt").forEach(b=>{
    b.onclick=()=>{ const p=+b.dataset.i; ans[cur]=p; tries[cur].push({pick:p, ok:p===q.a, at:new Date().toISOString()}); tries[cur]=tries[cur].slice(-10); strikes[cur]=[]; render(false); persist(); };
    b.oncontextmenu=(e)=>{ if(done) return; e.preventDefault(); toggleStrike(+b.dataset.i); };
  });
  document.querySelectorAll(".strike").forEach(b=>b.onclick=()=>toggleStrike(+b.dataset.s));
  const r=$("#redo"); if(r) r.onclick=()=>{ ans[cur]=null; strikes[cur]=[]; render(false); persist(); };
  $("#prev").onclick=()=>{cur--;render();};
  $("#next").onclick=()=>{ if(last){showResults=true;} else cur++; render(); };
}

function toggleStrike(i){
  const s = strikes[cur], k = s.indexOf(i);
  if(k<0) s.push(i); else s.splice(k,1);
  render(false); persist();
}

function renderResults(){
  const s = score(), pct = Math.round(100*s/N);
  const cats = {};
  QUESTIONS.forEach((q,i)=>{ cats[q.c]=cats[q.c]||[0,0]; cats[q.c][1]++; if(ans[i]===q.a) cats[q.c][0]++; });
  const rows = Object.entries(cats).map(([c,[r,t]])=>`<tr><td>${esc(c)}</td><td>${r} / ${t}</td></tr>`).join("");
  const missed = {};
  QUESTIONS.forEach((q,i)=>{ const wrongFirst = tries[i].length && !tries[i][0].ok; if(ans[i]!==q.a || wrongFirst) q.l.forEach(id=>{ const w=id.split(" ")[0]; missed[w]=missed[w]||new Set(); missed[w].add(id); }); });
  const weeks = Object.keys(missed).sort((x,y)=>parseInt(x.slice(1))-parseInt(y.slice(1)));
  const missHtml = weeks.length ? weeks.map(w=>`<h3>Week ${w.slice(1)}</h3><ul class="miss">${[...missed[w]].map(id=>`<li><code>${esc(id)}</code>${esc(OBJECTIVES[id]||"")}</li>`).join("")}</ul>`).join("") : "<p>No missed objectives.</p>";
  const redone = tries.filter(t=>t.length>1).length;
  const un = N - answered();
  $("#main").innerHTML = `<article class="card">
    <div class="chead"><span class="tag">Results</span><span>${un?un+" unanswered":"Complete"}</span></div>
    <div><div class="big">${s} / ${N}</div><div class="stats"><span><b>${pct}%</b> correct now</span><span>First try <b>${firstTryScore()} / ${firstTryCount()}</b></span><span>Redone <b>${redone}</b></span></div></div>
    <table><thead><tr><th>Category</th><th>Score</th></tr></thead><tbody>${rows}</tbody></table>
    <h2>Objectives to review</h2><p class="hint">Includes questions you missed on the first try, even if a redo got them right.</p>${missHtml}${history.length?`<h2>Past attempts</h2><table><thead><tr><th>Date</th><th>Score</th></tr></thead><tbody>${history.slice().reverse().map(h=>`<tr><td>${new Date(h.date).toLocaleDateString()}</td><td>${h.score} / ${h.total}</td></tr>`).join("")}</tbody></table>`:""}
    <div class="nav"><button class="btn ghost" id="back">Back to questions</button><button class="btn" id="restart">Restart all</button></div>
  </article>`;
  $("#back").onclick=()=>{showResults=false;render();};
  $("#restart").onclick=()=>{
    if(answered() || tries.some(t=>t.length)){
      history.push({date:new Date().toISOString(), score:score(), answered:answered(), total:N, firstTry:firstTryScore(),
        missed:QUESTIONS.map((q,i)=>ans[i]!==null&&ans[i]!==q.a?"q"+(i+1):null).filter(Boolean)});
      history=history.slice(-20);
    }
    ans.fill(null); tries=QUESTIONS.map(()=>[]); strikes=QUESTIONS.map(()=>[]); cur=0; showResults=false; render(); persist();
  };
}

function setSave(text, cls){ const el=$("#save"); if(el){ el.textContent=text; el.className="save "+(cls||""); } }
function bodyOf(){
  const a = {};
  QUESTIONS.forEach((q,i)=>{
    if(ans[i]===null && !tries[i].length && !strikes[i].length) return;
    a["q"+(i+1)] = {pick:ans[i], ok:ans[i]!==null && ans[i]===q.a, l:q.l, tries:tries[i], strikes:strikes[i]};
  });
  return {answers:a, history, total:N, answered:answered(), score:score(), firstTry:firstTryScore(), updatedAt:new Date().toISOString()};
}
function validPick(i,p){ return Number.isInteger(p) && p>=0 && p<QUESTIONS[i].o.length; }
function applySaved(d){
  if(!d || typeof d!=="object") return;
  ans.fill(null); tries=QUESTIONS.map(()=>[]); strikes=QUESTIONS.map(()=>[]);
  const a = d.answers || {};
  for(const k in a){
    const i = parseInt(k.slice(1),10)-1, row = a[k];
    if(!(i>=0 && i<N) || !row || typeof row!=="object") continue;
    if(validPick(i,row.pick)) ans[i]=row.pick;
    if(Array.isArray(row.tries)) tries[i]=row.tries.filter(t=>t&&validPick(i,t.pick)).map(t=>({pick:t.pick, ok:t.pick===QUESTIONS[i].a, at:String(t.at||"")})).slice(-10);
    else if(ans[i]!==null) tries[i]=[{pick:ans[i], ok:ans[i]===QUESTIONS[i].a, at:""}];
    if(Array.isArray(row.strikes)) strikes[i]=row.strikes.filter(x=>validPick(i,x));
  }
  history = Array.isArray(d.history) ? d.history.slice(-20) : [];
  const first = ans.findIndex(x=>x===null); cur = first<0 ? N-1 : first;
}
function lsLoad(){ try{ return JSON.parse(localStorage.getItem(LS_KEY)||"null"); }catch(e){ return null; } }
function lsSave(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(bodyOf())); }catch(e){} }
async function persist(){
  lsSave();
  if(!db || !uid) return;
  dirty = true; if(writing) return; writing = true;
  while(dirty){
    dirty = false;
    setSave("Saving…");
    try{ await db.doc("attempts/"+uid).set(bodyOf()); setSave("Progress saved to your account.","ok"); }
    catch(e){
      if(e && e.code==="invalid_argument"){ db=null; setSave("Progress saves in this browser only.","bad"); break; }
      setSave("Could not save to your account. Progress saves in this browser.","bad");
    }
  }
  writing = false;
}
async function connect(){
  try{
    if(!window.claude || !window.claude.use) return;
    const [u, d] = await Promise.all([window.claude.use("user"), window.claude.use("db")]);
    if(!u || !d) return;
    const id = await u.id(); if(!id) return;
    db = d; uid = id;
    const snap = await db.doc("attempts/"+uid).get();
    if(snap.exists){ applySaved(snap.data()); render(); setSave("Progress saved to your account.","ok"); }
    else if(answered() || tries.some(t=>t.length)){ persist(); }
    else setSave("Progress saves to your account.","ok");
  }catch(e){ /* keep local-only mode */ }
}

function render(top=true){ renderHeader(); showResults?renderResults():renderQ(); if(top) window.scrollTo({top:0}); }
applySaved(lsLoad());
render();
connect();
</script>

</body></html>
