<style>

}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#171C18;--paper:#1F251F;--ink:#EDEFE9;--muted:#9BA79C;--line:#333A32;
  --accent:#6FBBA3;--wash:#24302A;--ok:#6FBB8B;--okw:#1F3226;--bad:#E28C79;--badw:#3A2420;--tick:#3E463D;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#171C18;--paper:#1F251F;--ink:#EDEFE9;--muted:#9BA79C;--line:#333A32;
  --accent:#6FBBA3;--wash:#24302A;--ok:#6FBB8B;--okw:#1F3226;--bad:#E28C79;--badw:#3A2420;--tick:#3E463D;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.55}
.wrap{max-width:760px;margin:0 auto;padding-block:28px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px}
header{display:flex;flex-direction:column;gap:12px}
.eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
h1{font-family:var(--serif);font-weight:600;font-size:clamp(26px,5vw,34px);line-height:1.15;margin:0;text-wrap:balance}
.stats{display:flex;flex-wrap:wrap;gap:8px 22px;font-family:var(--mono);font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.stats b{color:var(--ink);font-weight:500}
.save{font-family:var(--mono);font-size:12px;color:var(--muted)}
.save.ok{color:var(--ok)}.save.bad{color:var(--bad)}
.ticks{display:flex;flex-wrap:wrap;gap:4px}
.tick{width:16px;height:16px;border:0;background:var(--tick);padding:0;cursor:pointer}
.tick.ok{background:var(--ok)}.tick.bad{background:var(--bad)}
.tick.cur{outline:2px solid var(--ink);outline-offset:1px}
.tick:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.card{background:var(--paper);border:1px solid var(--line);padding:22px;display:flex;flex-direction:column;gap:16px}
.chead{display:flex;justify-content:space-between;gap:10px;font-family:var(--mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.tag{color:var(--accent);background:var(--wash);padding:2px 8px}
.stem{font-family:var(--serif);font-size:18px;line-height:1.55;margin:0;white-space:pre-line}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;background:var(--paper);color:var(--ink);border:1px solid var(--line);padding:12px 14px;font:inherit;cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--accent);background:var(--wash)}
.opt:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.opt:disabled{cursor:default}
.opt .k{font-family:var(--mono);font-weight:500;color:var(--muted);min-width:1.2em}
.opt.right{border-color:var(--ok);background:var(--okw)}.opt.right .k{color:var(--ok)}
.opt.wrong{border-color:var(--bad);background:var(--badw)}.opt.wrong .k{color:var(--bad)}

.big{font-family:var(--serif);font-size:44px;font-weight:600;line-height:1;font-variant-numeric:tabular-nums}

td,th{text-align:left;padding:6px 0;border-bottom:1px solid var(--line);font-size:14px}

td:last-child,th:last-child{text-align:right}
h2{font-family:var(--serif);font-size:20px;font-weight:600;margin:0}

.miss{margin:0;padding-left:0;list-style:none;display:flex;flex-direction:column;gap:6px;font-size:14px}
.miss code{font-family:var(--mono);color:var(--bad);margin-right:6px}
.optrow{display:flex;gap:6px;align-items:stretch}
.optrow .opt{flex:1;min-width:0}
.strike{flex:0 0 auto;width:40px;border:1px solid var(--line);background:var(--paper);color:var(--muted);font-family:var(--mono);font-size:13px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.strike:hover{border-color:var(--accent);color:var(--accent)}
.strike:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.strike[aria-pressed="true"]{background:var(--wash);color:var(--ink)}
.optrow.struck .opt > span:last-child{text-decoration:line-through;color:var(--muted)}
.optrow.struck .opt .k{color:var(--line)}
.tries{font-family:var(--mono);font-size:12px;color:var(--muted)}
.tries .bad{color:var(--bad)}.tries .ok{color:var(--ok)}
.hint{font-family:var(--mono);font-size:12px;color:var(--muted)}
.fbtools{display:flex;justify-content:flex-end}
.tick.redo{box-shadow:inset 0 -3px 0 var(--accent)}
@media (prefers-reduced-motion:no-preference){.fb{animation:in .18s ease-out}@keyframes in{from{opacity:.4;transform:translateY(3px)}to{opacity:1;transform:none}}}

<div class="wrap">
  <header>
    <div class="eyebrow">Foundations of Medicine · Block 2 · Weeks 5 to 8 · Set 2</div>
    <h1>Screening, Cancer, Aging and Prescribing</h1>
    <div class="stats" id="stats"></div>
    <div class="save" id="save" role="status">Progress saves in this browser.</div>

<script>
const QUESTIONS = [{"c": "Week 5", "p": "Kofi, 34, books his first periodic health encounter with you. He has no complaints, takes no medications and wants to know which tests he needs. Following the PHE diagnostic pathway for a young, healthy patient, what comes first?", "o": ["Perform a full head-to-toe physical exam", "Take a history focused on his risk factors", "Order a standard screening blood panel", "Confirm he is stable and check his vitals"], "a": 3, "e": "D is correct. The pathway starts with stability and vitals (airway, breathing, circulation, BP, HR, RR, temperature, O2 saturation). History of risk factors, a focused exam and investigations follow.\nA: There is little evidence for exam maneuvers beyond BMI and vitals unless a specific concern exists.\nB: The risk-factor history is the second step.\nC: There is no one-size-fits-all panel. Investigations depend on risk factors, symptoms and guidelines.\nHigh yield: PHE exam: BMI and vitals. Other maneuvers only for specific concerns.", "l": ["W5 1.1", "W5 1.2"]}, {"c": "Week 5", "p": "Mr. Petrov, 52, has no symptoms. A non-fasting lipid panel and the Framingham risk score place his 10-year cardiovascular risk at 14%. Which management plan fits?", "o": ["Lifestyle changes plus a moderate-potency statin", "Lifestyle, a high-potency statin, consider aspirin", "A high-potency statin with no lifestyle changes", "Lifestyle changes, then retest risk in 5 years"], "a": 0, "e": "A is correct. A risk of 10-19% is medium. Management is lifestyle interventions plus a moderate-potency statin.\nB: A high-potency statin with consideration of aspirin fits a high risk of 20% or more.\nC: Lifestyle interventions apply at every risk level.\nD: Lifestyle and retesting in 5 years fits a low risk under 10%.\nHigh yield: Lipid screening: men 40+, women 50+ or postmenopausal, every 5 years.", "l": ["W5 2.2", "W5 11.1"]}, {"c": "Week 5", "p": "A quality team reviews two causes of test overuse. In Case 1, a physician orders extra imaging mainly out of fear of being sued. In Case 2, a patient demands a full-body scan after reading online that more testing is always better. Which stakeholder group does each driver belong to, in order?", "o": ["Patient, then physician", "Laboratory, then health system", "Health system, then patient", "Physician, then patient"], "a": 3, "e": "D is correct. Malpractice fear is a physician driver. A belief that more is better and Dr. Google are patient drivers.\nA: This reverses the two.\nB: Lab drivers are revenue, poor quality programs and lack of expertise. Neither case fits.\nC: Health system drivers are poor quality management, inadequate resources and historical practice.\nHigh yield: Other physician drivers: patient pressure, incentives, fee for service.", "l": ["W5 6.6", "W5 6.9"]}, {"c": "Week 5", "p": "Regarding inappropriate use of laboratory tests, which of the following statements are true?\ni) It leads to unnecessary procedures and treatment\nii) It risks inappropriate care or patient harm\niii) It increases the cost burden on the health care system\niv) Choosing Wisely targets overutilization only, never underutilization", "o": ["i) and iii) only", "ii) and iv) only", "i), ii) and iii) only", "i), ii) and iv) only", "All of the above"], "a": 2, "e": "C is correct. Inappropriate test use drives unnecessary procedures and treatment, inappropriate care or harm, and higher system costs. Appropriate use balances both underutilization and overutilization.\nA: Statement ii is also true.\nB: Statement iv is false.\nD: Statement iv is false and iii is true.\nE: Statement iv is false.\nHigh yield: Choosing Wisely recommendations are evidence-based and made by multi-disciplinary stakeholders.", "l": ["W5 6.8", "W5 6.7"]}, {"c": "Week 5", "p": "A community hospital lab plans to adopt the manufacturer's reference interval for a new assay instead of building its own. To verify the interval, which approach is correct?", "o": ["Test over 20 local patients without checking the source population", "Recruit over 120 healthy local subjects per partition and derive a new RI", "Adopt the RI as printed, since the manufacturer validated it", "Check the source population fits, then test over 20 locals per partition"], "a": 3, "e": "D is correct. Verifying an RI starts by determining if the patient population source is appropriate, then testing the local population with more than 20 patients per partition.\nA: The first verification step is checking the source population.\nB: More than 120 per partition is for establishing a new RI, not verifying one.\nC: Verification needs local testing.\nHigh yield: Establish: define population, test, analyze, over 120 per partition. Verify: check source, test locals, over 20 per partition.", "l": ["W5 7.2.5", "W5 7.2.6"]}, {"c": "Week 5", "p": "A lab runs a control sample with a true potassium of 5.0 mmol/L four times. The analyzer returns 5.5, 5.5, 5.6 and 5.5 mmol/L. How do you describe this analyzer's performance?", "o": ["Accurate but not precise", "Precise but not accurate", "Both accurate and precise", "Neither accurate nor precise"], "a": 1, "e": "B is correct. The values sit close to each other (precise) but miss the true value of 5.0 (not accurate).\nA: Accuracy means matching the true value, which these results miss.\nC: The results miss the true value.\nD: The results cluster tightly, so precision is good.\nHigh yield: Accuracy: match the true value. Precision: spread of the data.", "l": ["W5 7.1"]}, {"c": "Week 5", "p": "A screening program lowers the cut-point of its blood test so that more results count as positive. Which change in test performance is expected?", "o": ["Higher specificity, lower sensitivity", "Higher sensitivity and specificity", "Higher sensitivity, lower specificity", "No change in sensitivity or specificity"], "a": 2, "e": "C is correct. Lowering a screening cut-point increases sensitivity but lowers specificity.\nA: This is the effect of raising the cut-point.\nB: Moving the cut-point trades one against the other.\nD: Moving the cut-point always shifts the balance.\nHigh yield: Use a highly sensitive screen in asymptomatic people, then a highly specific test for diagnosis.", "l": ["W5 6.4", "W5 7.1"]}, {"c": "Week 5", "p": "Hours after Sam, 19, gets a wood splinter in his thumb, leukocytes and plasma proteins have been recruited from the circulation to the site. Following the 5 Rs of the inflammatory response, which step comes next?", "o": ["Recognition", "Removal", "Resolution", "Regulation"], "a": 1, "e": "B is correct. The 5 Rs run Recognition, Recruitment, Removal, Regulation, Resolution. After recruitment, leukocytes and plasma proteins are activated and destroy and eliminate the offending agent.\nA: Recognition comes first, before recruitment.\nC: Resolution, the repair of damaged tissue, is last.\nD: Regulation, which controls and terminates the reaction, follows removal.\nHigh yield: Celsus: rubor, calor, dolor, tumor. Virchow added functio laesa.", "l": ["W5 9.10"]}, {"c": "Week 5", "p": "Mr. Obi, 61, has had poorly controlled hypertension for 20 years. Which of the following are listed complications of hypertension?\ni) Aortic dissection\nii) Multi-infarct dementia\niii) Renal failure\niv) Cardiac hypertrophy and heart failure", "o": ["i), ii) and iii) only", "i) and iv) only", "ii) and iii) only", "iii) and iv) only", "All of the above"], "a": 4, "e": "E is correct. Hypertension complications include atherosclerosis (MI), cardiac hypertrophy and heart failure, multi-infarct dementia, aortic dissection, cerebrovascular hemorrhage and renal failure. All four are listed.\nA: Statement iv is also a complication.\nB: Statements ii and iii are also complications.\nC: Statements i and iv are also complications.\nD: Statements i and ii are also complications.\nHigh yield: Your Week 5 quiz flipped this: liver cirrhosis is not a complication.", "l": ["W5 9.13", "W5 9.14"]}, {"c": "Week 5", "p": "Two patients develop lymphatic blockage. Patient 1 has swelling of the right arm. Patient 2 has swelling of the left leg. Which lymphatic channel normally drains each region, in order?", "o": ["Thoracic duct, then right lymphatic duct", "Thoracic duct for both of the regions", "Right lymphatic duct for both regions", "Right lymphatic duct, then thoracic duct"], "a": 3, "e": "D is correct. The right lymphatic duct drains the right head, neck, thorax and upper limb. The thoracic duct drains the other three quarters of the body, including the lower body.\nA: This reverses the two.\nB: The right upper limb drains to the right lymphatic duct.\nC: The lower body drains to the thoracic duct.\nHigh yield: Any blockage of lymphatic vessels causes swelling of that region (edema).", "l": ["W5 9.1"]}, {"c": "Week 5", "p": "A coronary artery plaque removed at autopsy from a 66-year-old smoker shows lipid-filled foam cells in the intima. From which cells did these foam cells most likely arise?", "o": ["Endothelial cells that line the arterial lumen", "Monocytes that migrated into the intima", "Platelets adhering to the endothelium", "T-cells recruited into the vessel wall"], "a": 1, "e": "B is correct. In atherosclerosis, monocytes adhere to the endothelium, migrate into the intima and transform into macrophages and foam cells.\nA: Endothelial dysfunction starts the process but endothelial cells do not become foam cells.\nC: Platelets adhere and release factors that recruit smooth muscle.\nD: T-cells are recruited later but do not become foam cells.\nHigh yield: First step: endothelial dysfunction, with raised permeability, leukocyte adhesion and thrombosis.", "l": ["W5 9.14", "W5 9.8"]}, {"c": "Week 5", "p": "Jamal, 29, completes the DAST-10 at a periodic health encounter. Answering about the past 12 months, he scores 4. Which response matches his score?", "o": ["Feedback and advice", "Intensive assessment and referral", "Feedback and counselling", "Encouragement and education"], "a": 2, "e": "C is correct. A DAST-10 of 3-5 is a moderate level of problems, managed with feedback and counselling.\nA: Feedback and advice fits 1-2, a low level.\nB: Intensive assessment and referral fits 6-8, a substantial level.\nD: Encouragement and education fits 0, no problems.\nHigh yield: DAST-10 is the Drug Abuse Screening Tool, as your Week 5 quiz noted.", "l": ["W5 3.2"]}, {"c": "Week 5", "p": "Marie, 40, is brought in by police after an arrest at a political protest. Her family worries her activism signals a mental illness. She sleeps well, works full time and shows no dysfunction in thinking, mood or behaviour. How is her behaviour best classified?", "o": ["Not a mental disorder, with no individual dysfunction", "A mental disorder, since she is in conflict with society", "A mental disorder, since the behaviour is socially deviant", "Not a disorder only because it lasted under 2 weeks"], "a": 0, "e": "A is correct. Socially deviant behaviour (political, religious, sexual) and conflicts between the individual and society are not mental disorders unless they result from a dysfunction in the individual.\nB: Conflict with society alone does not define a disorder.\nC: Social deviance alone does not define a disorder.\nD: Duration is not the reason here. The absence of dysfunction is.\nHigh yield: A disorder reflects dysfunction, judged by duration and interference with functioning.", "l": ["W5 3.1"]}, {"c": "Week 6", "p": "Lena, 58, has metastatic breast cancer. Over one week she has had back pain, and now both legs are weak with brisk reflexes and upgoing plantar responses. Her arms are normal. Which cancer emergency is most likely?", "o": ["Superior vena cava obstruction", "Spinal cord compression", "Hypercalcemia", "Brain metastasis with edema"], "a": 1, "e": "B is correct. UMN signs in both legs with normal arms (paraparesis) localize to the thoracic cord. In a patient with cancer this fits spinal cord compression, a listed cancer emergency.\nA: SVC obstruction does not cause leg weakness with UMN signs.\nC: Hypercalcemia does not produce a cord-level UMN pattern.\nD: A brain lesion gives a hemibody pattern, not weakness of both legs with normal arms.\nHigh yield: Life-threatening: metastases compressing the spinal cord or major vessels.", "l": ["W6 1.6"]}, {"c": "Week 6", "p": "Priya, 34, reports lumpy, nodular breasts on both sides. The lumps become tender in the days before her period and settle afterward. Exam shows no dominant mass, skin change or nipple change. Which diagnosis fits best?", "o": ["Fibrocystic change", "Breast abscess", "Single fibroadenoma", "Simple cyst"], "a": 0, "e": "A is correct. Fibrocystic change gives lumpy, nodular breasts with pain and tenderness that varies through the menstrual cycle.\nB: An abscess is a collection of pus from bacterial infection, with acute inflammation.\nC: A fibroadenoma is a single, well-circumscribed, firm, mobile nodule.\nD: A cyst is a single sac that collapses when fluid is removed.\nHigh yield: VITAMIN C&D for a breast mass: infection, trauma, neoplasm, cyst.", "l": ["W6 2.4", "W6 2.3"]}, {"c": "Week 6", "p": "Dana, 45, had a car accident 3 weeks ago and still has a seatbelt bruise across her chest. She now feels a firm lump in the breast under the bruise. Using the VITAMIN C&D approach, which cause best fits?", "o": ["Cyst, from fibrocystic change", "Infection, with an abscess", "Trauma, with fat necrosis", "Neoplasm, as a fibroadenoma"], "a": 2, "e": "C is correct. The trauma category of VITAMIN C&D for a breast mass is fat necrosis. The recent blunt injury at the same site is the clue.\nA: Fibrocystic change varies with the menstrual cycle.\nB: An abscess follows infection, with acute inflammation.\nD: A fibroadenoma is a benign neoplasm unrelated to injury.\nHigh yield: Increasing age raises the likelihood of cancer, so a persistent mass still needs workup.", "l": ["W6 2.2", "W6 2.1"]}, {"c": "Week 6", "p": "A family physician is building a workup for a new palpable breast mass in a 52-year-old. Which investigation has no role in diagnosing the type of breast mass?", "o": ["Diagnostic mammography views", "A blood tumour marker panel", "Image-guided core biopsy", "Targeted breast ultrasound"], "a": 1, "e": "B is correct. No blood or urine test helps identify the type of breast mass, so lab medicine has no role in diagnosis.\nA: Mammography is used in screening and diagnosis.\nC: Biopsy under ultrasound or stereotactic guidance gives the tissue diagnosis.\nD: Ultrasound is a primary diagnostic tool for a palpable lump.\nHigh yield: Your Week 6 quiz listed tumour markers as a distractor for the same reason.", "l": ["W6 3.1", "W6 3.3"]}, {"c": "Week 6", "p": "A surgeon completes the pathology requisition for a lumpectomy specimen. Which item belongs on the requisition rather than in the pathology report?", "o": ["The ACMG classification of a variant", "The time the specimen went into formalin", "The synoptic summary of the margins", "The ER, PR and Her2 biomarker test results"], "a": 1, "e": "B is correct. The requisition carries patient ID, ischemic time, date and time of procurement and formalin, exact sites and clinical information.\nA: ACMG classification appears in the cancer genetic report.\nC: The synoptic report is part of the microscopic description in the pathology report.\nD: ER, PR and Her2 results appear in the pathology report.\nHigh yield: Clinical information on the requisition: history, imaging, reason for test, DDx, pitfalls, ancillary tests.", "l": ["W6 3.4"]}, {"c": "Week 6", "p": "Four core biopsy reports use different phrases. Which phrase signals the greatest concern for cancer while stopping short of a definite malignant diagnosis?", "o": ["Atypia present, cannot exclude malignancy", "Atypia present, favour reactive", "Suspicious for malignancy", "Negative for malignancy"], "a": 2, "e": "C is correct. The narrative scale runs: positive, suspicious, atypia that cannot exclude malignancy, atypia favouring reactive, negative. Suspicious sits directly below positive.\nA: This sits one step below suspicious.\nB: This leans toward a benign, reactive process.\nD: This rules out malignancy.\nHigh yield: An ambiguous result is a reason to talk to the pathologist directly.", "l": ["W6 3.5"]}, {"c": "Week 6", "p": "Helen, 44, has a hereditary cancer panel. The report lists one variant with an ACMG classification of 3. How should this result be described to her?", "o": ["Variant of uncertain significance", "Pathogenic variant", "A likely pathogenic variant that raises risk", "Likely benign variant"], "a": 0, "e": "A is correct. ACMG classes: 1 pathogenic, 2 likely pathogenic, 3 VUS, 4 likely benign, 5 benign.\nB: Pathogenic is class 1.\nC: Likely pathogenic is class 2.\nD: Likely benign is class 4.\nHigh yield: The panel tests 37 genes on a blood sample.", "l": ["W6 4.5"]}, {"c": "Week 6", "p": "Regarding the drawbacks of cancer genetic testing, which of the following statements are true?\ni) Results include false positives and false negatives\nii) Current tests identify all inherited gene changes linked to cancer\niii) Effective risk reduction or early detection methods might not exist\niv) A positive result often leads to more worry, appointments and tests", "o": ["i), iii) and iv) only", "i) and iv) only", "ii) and iii) only", "i), ii) and iii) only", "All of the above"], "a": 0, "e": "A is correct. Drawbacks include false results, tests that miss some inherited changes, a lack of effective risk reduction for some cancers, and more worry and procedures after a positive result.\nB: Statement iii is also true.\nC: Statement ii is false.\nD: Statement ii is false and iv is true.\nE: Statement ii is false.\nHigh yield: Benefits: better risk prediction, relief of uncertainty, testing options for relatives, earlier detection.", "l": ["W6 6.3"]}, {"c": "Week 6", "p": "In culture, cells from a patient's tumour keep dividing well past 70 divisions without stopping, and their telomeres stay long. Which hallmark of cancer does this show?", "o": ["Self-sufficiency in growth signals", "Sustained angiogenesis", "Limitless replicative potential", "Evasion of apoptosis"], "a": 2, "e": "C is correct. Cancer cells produce telomerase, which lengthens telomeres and overcomes the Hayflick limit of 60-70 divisions.\nA: Self-sufficiency involves making their own growth factors and always-on receptors.\nB: Sustained angiogenesis involves the angiogenic switch.\nD: Evasion of apoptosis most often involves p53 mutations.\nHigh yield: Emerging hallmarks: immune evasion, tumour-promoting inflammation, genome instability, deregulated energetics.", "l": ["W6 7.8", "W6 7.2"]}, {"c": "Week 6", "p": "In the two stage clonal expansion model, a genetic alteration has produced premalignant cells, and these cells are now proliferating. Which stage comes next?", "o": ["Angiogenic switch", "Initiation", "Progression", "Transformation"], "a": 3, "e": "D is correct. The model runs initiation, promotion, transformation, then progression. After premalignant cells proliferate (promotion), a second rapid alteration produces a malignant cell (transformation).\nA: The angiogenic switch is a hallmark of cancer, not a stage of this model.\nB: Initiation already happened when the premalignant cell formed.\nC: Progression follows transformation, from malignant cell to clinical cancer.\nHigh yield: Cancer is usually a cascade of mutations, not one.", "l": ["W6 7.3", "W6 7.4"]}, {"c": "Week 6", "p": "During a breast cancer risk review, two factors are noted for Amira, 47: early menarche and never breastfeeding, and then regular tanning bed use. How is each risk factor classified, in order?", "o": ["Modifiable in both of the cases", "Non-modifiable, then modifiable", "Non-modifiable in both of the cases", "Modifiable, then non-modifiable"], "a": 1, "e": "B is correct. Reproductive history (breastfeeding, menarche, menopause) is a non-modifiable factor in GGRAPES. Tanning beds are a modifiable factor.\nA: Reproductive history is non-modifiable.\nC: Tanning bed use is modifiable.\nD: This reverses the two.\nHigh yield: GGRAPES: geography, genetic susceptibility, reproductive history, age, precursor lesions, ethnicity, sex.", "l": ["W6 8.3", "W6 7.5"]}, {"c": "Week 6", "p": "An Indigenous patient with a strong family history of breast cancer meets two team members. Member 1 does her risk assessment, takes informed consent for genetic testing and plans screening of her relatives. Member 2 helps her navigate the health care system and provides counselling. Who are they, in order?", "o": ["Genetics counsellor, then Indigenous health navigator", "Medical oncologist, then social worker", "Primary care physician, then palliative care physician", "Social worker, then genetics counsellor"], "a": 0, "e": "A is correct. The genetics counsellor does risk assessment, consent for genetic testing and screening of family members. The Indigenous health navigator advocates by helping navigate the health care system, plus counselling.\nB: The medical oncologist gives systemic therapies.\nC: Primary care does screening, symptom relief and referrals. Palliative care relieves suffering.\nD: The social worker helps navigate the journey to recovery, and does not take consent for genetic testing.\nHigh yield: Gynecological surgeon: fertility and pregnancy options, prophylactic surgery.", "l": ["W6 12.1"]}, {"c": "Week 6", "p": "A staging report reads T2 N1 M1. The N and M categories each describe a route of cancer spread. Which routes do they capture, in order?", "o": ["Hematogenous, then lymphatic", "Lymphatic, then direct", "Direct, then lymphatic", "Lymphatic, then hematogenous"], "a": 3, "e": "D is correct. T reflects direct local growth, N reflects lymphatic spread to regional nodes, and M reflects hematogenous metastasis.\nA: This reverses the two.\nB: M captures hematogenous spread, not direct growth.\nC: Direct growth is captured by T.\nHigh yield: M1 means stage IV: spread to at least one other organ.", "l": ["W6 7.10", "W6 6.4"]}, {"c": "Week 7", "p": "A geriatrics tutor lists factors linked to living past 100. Which of the following is NOT one of the factors associated with centenarians?", "o": ["A first-degree relative who lived to an advanced age", "Naturally having a child after age 40", "A non-smoking history in a lean male", "High neuroticism with low extraversion"], "a": 3, "e": "D is correct. Centenarians tend to show low neuroticism and high extraversion, the reverse of this option.\nA: A first-degree relative of advanced age is a factor, as in your Week 7 quiz.\nB: Women who naturally have a child after 40 are listed.\nC: Lean males with no smoking history are listed.\nHigh yield: Healthy aging: no smoking, Mediterranean diet, BMI 24-30, 7-8 hours of sleep, limited alcohol, exercise, social engagement.", "l": ["W7 1.1"]}, {"c": "Week 7", "p": "Mrs. Duval, 83, fell at home twice this month. Her review notes poor vision, leg weakness, a new sleeping pill, a loose hallway carpet and a glass of wine each night. Which pair are both intrinsic causes of falls?", "o": ["Visual impairment and leg weakness", "Loose carpet and the sleeping pill", "Visual impairment and loose carpet", "Nightly alcohol and leg weakness"], "a": 0, "e": "A is correct. Intrinsic causes include poor balance, weakness, chronic illness, visual and cognitive impairment. Medications, alcohol and loose carpets are extrinsic.\nB: Both are extrinsic causes.\nC: The loose carpet is extrinsic.\nD: Alcohol is extrinsic.\nHigh yield: Falls are almost always multifactorial. Never call one mechanical.", "l": ["W7 1.7", "W7 9.7"]}, {"c": "Week 7", "p": "Mr. Ali, 80, dresses, eats, walks, uses the toilet and bathes on his own. Over the past year his daughter has taken over paying his bills and buying his groceries. Which functional domain and items are affected?", "o": ["IADLs: telephone and food preparation", "ADLs: ambulating and toileting", "IADLs: accounting and shopping", "ADLs: hygiene and dressing"], "a": 2, "e": "C is correct. IADLs follow SHAFT: shopping, housework, accounting, food preparation, telephone. Bills (accounting) and groceries (shopping) are IADLs.\nA: Telephone and food preparation are IADLs but are not described as affected.\nB: He walks and toilets on his own.\nD: He manages hygiene and dressing on his own.\nHigh yield: ADLs follow DEATH: dressing, eating, ambulating, toileting, hygiene.", "l": ["W7 3.1"]}, {"c": "Week 7", "p": "Mrs. Kim, 78, lists amoxicillin as an allergy in her medication history. On questioning, she had loose stools starting on day 5 of a course, with no rash, swelling or breathing trouble. How is this reaction best classified?", "o": ["Drug intolerance, from a gut microbiome change", "Type-1 hypersensitivity allergy to the drug class", "Anaphylaxis from the first few doses", "Pseudoallergic reaction to the drug"], "a": 0, "e": "A is correct. Drug intolerances are usually caused by changes in the gut microbiome and include nausea, diarrhea and delirium. Allergies are type-1 hypersensitivity reactions that range from rash to anaphylaxis and start after the first few doses.\nB: A type-1 allergy produces rash or anaphylaxis, not isolated diarrhea.\nC: Anaphylaxis is a life-threatening allergy with no features here.\nD: Pseudoallergic reactions are anaphylactoid, as after radiocontrast media.\nHigh yield: Your Week 7 quiz asked the reverse: wheezing and hypotension mean true allergy.", "l": ["W7 3.5"]}, {"c": "Week 7", "p": "Mr. Grant, 81, tells you he is fine and has no problems at home. His MoCA is 19/30, and his wife, sitting beside him, looks worried and shakes her head. What is the most appropriate next step?", "o": ["Take a collateral history from his wife", "Refer him directly for brain neuroimaging", "Accept his account as the full history", "Repeat the MoCA in 12 months"], "a": 0, "e": "A is correct. Collateral history matters in patients with cognitive problems, unintentional minimization and difficulties with insight. His wife knows him well.\nB: Imaging needs a specific indication, and the history is not yet complete.\nC: His cognitive impairment and minimization make his account incomplete.\nD: Delaying review misses current safety and function concerns.\nHigh yield: Collateral source: someone who knows the patient well, such as a spouse, child, caregiver or friend.", "l": ["W7 3.4"]}, {"c": "Week 7", "p": "Mr. Walsh, 77, is a white man who lives alone since his wife died last year. He has chronic back pain and has been drinking more. He screens positive for depression and admits to thoughts of death. Which factor is the strongest predictor of the course of his suicidal ideation?", "o": ["Chronic pain with disability", "Living alone after bereavement", "Being a white male over 65", "The severity of his depression"], "a": 3, "e": "D is correct. Each of these is a suicide risk factor in older adults, but severity of depression is the strongest predictor of the course of suicidal ideation.\nA: Pain and disability are risk factors, not the strongest predictor.\nB: Living alone and recent loss are risk factors, not the strongest predictor.\nC: Demographics are risk factors, not the strongest predictor.\nHigh yield: Suicide is almost twice as frequent in older adults and more lethal.", "l": ["W7 5.2", "W7 5.4"]}, {"c": "Week 7", "p": "Mrs. Ng, 86, has moderate dementia and lives in long-term care. Staff report she has become withdrawn, eats less and no longer joins activities. Which tool is best suited to screen her for depression?", "o": ["Geriatric Depression Scale-15 self-report", "4-AT Delirium Assessment Tool", "Cornell Scale for Depression in Dementia", "Patient Health Questionnaire-9"], "a": 2, "e": "C is correct. The Cornell Scale (19 items) is the depression screen designed for people with dementia.\nA: The GDS-15 is a yes/no self-report scale.\nB: The 4-AT screens for delirium, not depression.\nD: The PHQ-9 is a self-report tool that does not account for dementia.\nHigh yield: Screen everyone over 60 and anyone newly admitted to long-term care for depression.", "l": ["W7 5.3"]}, {"c": "Week 7", "p": "Mr. Fischer, 74, has 18 months of progressive memory loss. You order bloodwork to rule out mimickers of dementia. Which of the following is NOT part of that standard workup?", "o": ["Vitamin B12 level", "Hemoglobin A1C", "TSH", "Complete blood count", "Calcium with albumin"], "a": 1, "e": "B is correct. The workup is CBC, TSH, electrolytes, calcium (with albumin), glucose and vitamin B12. Glucose is listed, but HbA1c is not.\nA: B12 deficiency is a listed mimicker.\nC: TSH screens for thyroid dysfunction.\nD: CBC is listed.\nE: Calcium with albumin is listed.\nHigh yield: Mimickers: delirium, depression, drugs, metabolic causes such as B12, liver or thyroid dysfunction.", "l": ["W7 7.4"]}, {"c": "Week 7", "p": "Mr. Lopez, 84, has Alzheimer's dementia and lives in a nursing home. Over three days he has become agitated and keeps pacing at night. Which is the most appropriate first step?", "o": ["Start a benzodiazepine for night sleep", "Start an antipsychotic to control the agitation", "Start an SSRI for behavioural symptoms", "Look for triggers such as pain or constipation"], "a": 3, "e": "D is correct. Non-pharmacologic management of BPSD comes first: look for triggers such as pain, medications, constipation and urinary retention, and use distraction.\nA: Benzodiazepines are not first choice for agitation in older adults.\nB: Antipsychotics are a last resort and not first choice for BPSD.\nC: SSRIs are a pharmacologic option after triggers are addressed.\nHigh yield: DICE: describe, investigate, create a plan, evaluate.", "l": ["W7 7.6"]}, {"c": "Week 7", "p": "Mrs. Bauer, 80, has a Clinical Frailty Scale score of 4. She wants to avoid becoming frail. Which plan best fits the prevention strategies in the notes?", "o": ["Limit her walking to lower her risk of falling at home", "Exercise, Mediterranean diet and protein supplements", "Weight loss diet to bring BMI below 24", "Start a benzodiazepine to improve sleep"], "a": 1, "e": "B is correct. Non-pharmacologic prevention of frailty includes exercise, avoiding immobility, a Mediterranean diet, protein supplementation and a comprehensive geriatric assessment.\nA: Limiting activity promotes immobility, which prevention avoids.\nC: Healthy aging targets a BMI of 24-30.\nD: Benzodiazepines are high-risk drugs that cause falls and cognitive change.\nHigh yield: Frailty is not the same as comorbidity, disability or aging.", "l": ["W7 9.5", "W7 9.1"]}, {"c": "Week 7", "p": "Two members of the team caring for Mr. Bell, 85, are described. Member 1 assesses his risk of falls, his need for a gait aid and his fear of falling. Member 2 sets up blister packs for his medications. Who are they, in order?", "o": ["Physiotherapist, then dietitian", "Physiotherapist, then pharmacist", "Occupational therapist, then pharmacist", "Occupational therapist, then social worker"], "a": 1, "e": "B is correct. The physiotherapist assesses falls risk, gait aid needs and fear of falling. The pharmacist helps with medication aids such as dosettes or blister packs.\nA: The dietitian assesses nutrition and protein needs.\nC: The OT assesses function, mobility, cognition and safety at home, not gait aid suitability.\nD: The social worker helps with caregiver burden and future planning.\nHigh yield: Speech and language pathology: word-finding and swallowing problems in dementia.", "l": ["W7 10.1", "W7 10.2"]}, {"c": "Week 7", "p": "Mrs. Taylor, 88, has recently come home from hospital. Her son asks how to arrange OHIP-funded nursing and physiotherapy at her home. Which resource fits, and who is able to make the referral?", "o": ["Parkwood driving program, by family request", "Home and Community Care, by the family physician's referral only", "Alzheimer Society First Link, by LHIN referral", "Home and Community Care, by physician, patient or caregiver"], "a": 3, "e": "D is correct. Home and Community Care by the LHIN provides OHIP-funded nursing, OT, PT, SW and personal support at home. The physician, patient or caregiver makes the referral.\nA: Parkwood assesses driving competency.\nB: Referrals are not limited to the physician.\nC: First Link offers dementia education and support groups.\nHigh yield: It also coordinates pay-per-service supports such as meal delivery and LTC admission.", "l": ["W7 10.3"]}, {"c": "Week 8", "p": "Two drugs act on different receptor types. Drug 1 is insulin. Drug 2 is an anti-inflammatory steroid with a slow onset that alters gene expression. Which receptor type does each target, in order?", "o": ["G protein-coupled, then ligand-gated", "Ligand-gated, then G protein-coupled", "Enzyme-linked, then intracellular", "Intracellular, then enzyme-linked"], "a": 2, "e": "C is correct. Insulin receptors are enzyme-linked (phosphorylation). Steroid receptors are intracellular, with slow responses through altered gene expression.\nA: G protein-coupled receptors include alpha and beta adrenoceptors. Ligand-gated channels give fast responses.\nB: Ligand-gated channels include nicotinic receptors, and GPCRs include adrenoceptors.\nD: This reverses the two.\nHigh yield: Other targets: enzymes, endogenous molecules, transport proteins such as SGLT2.", "l": ["W8 O3", "W8 O1"]}, {"c": "Week 8", "p": "Rosa, 66, is unconscious and actively vomiting in the emergency department, and IV access has failed. She needs a drug that reaches the systemic circulation, ideally with part of the dose avoiding the liver on first pass. Which route fits best?", "o": ["Oral", "Transdermal", "Rectal", "Pulmonary (inhaled)"], "a": 2, "e": "C is correct. The rectal route is useful when patients are unconscious or vomiting, and a good fraction of the absorbed drug bypasses the portal circulation and liver.\nA: Oral is not usable in an unconscious, vomiting patient, and faces first-pass metabolism.\nB: Transdermal suits prolonged release, not prompt systemic delivery.\nD: Inhaled delivery is best for local actions with low systemic exposure.\nHigh yield: Your Week 8 quiz used the inhaled route for acute asthma, a local target.", "l": ["W8 O9"]}, {"c": "Week 8", "p": "A conjugated, high molecular weight drug moves from the liver into bile and then the duodenum. In the gut it is deconjugated, reabsorbed through the hepatic portal vein and returned to the liver, prolonging its effect. What is this process called?", "o": ["Passive tubular reabsorption", "Enterohepatic recycling", "First-pass metabolism", "Active tubular secretion"], "a": 1, "e": "B is correct. Biliary excretion of conjugated, high molecular weight drugs ends in feces, or in deconjugation and reabsorption through the portal vein (enterohepatic recycling).\nA: Tubular reabsorption occurs in the kidney.\nC: First-pass metabolism lowers bioavailability of oral drugs before they reach the circulation.\nD: Tubular secretion is a renal excretion step.\nHigh yield: Renal excretion: filtration, passive reabsorption, active secretion.", "l": ["W8 O7", "W8 O8"]}, {"c": "Week 8", "p": "Two new drugs are being dosed in clinic. Drug W has a wide therapeutic window and Drug N has a narrow one. Which statement about dosing is correct?", "o": ["Use the ED50 as a starting dose for Drug W", "Titrate Drug W slowly, since its window is wide", "The window spans the effective to lethal dose", "Give Drug N at a fixed dose without monitoring"], "a": 0, "e": "A is correct. With a wide window, the ED50 serves as a starting dose. With a narrow window, titrate the dose.\nB: Titration is for narrow windows.\nC: The window spans the minimum effective dose to the minimum toxic dose.\nD: Narrow windows need titration and monitoring.\nHigh yield: Design regimens to avoid toxicity and lack of efficacy, with convenient intervals.", "l": ["W8 O30", "W8 O31"]}, {"c": "Week 8", "p": "Drugs X and Y have the same clearance. Drug X has a much larger volume of distribution than Drug Y. How do their half-lives compare?", "o": ["X has a longer half-life than Y", "X has a shorter half-life than Y", "Both have the same half-life", "It depends on the dose given"], "a": 0, "e": "A is correct. A larger volume of distribution gives a longer half-life, and higher clearance gives a shorter one. With equal clearance, X lasts longer.\nB: A larger Vd lengthens, not shortens, half-life.\nC: Vd differs, so half-life differs.\nD: Half-life is independent of dose.\nHigh yield: Most drugs are removed after 3-5 half-lives.", "l": ["W8 O29"]}, {"c": "Week 8", "p": "A family physician reviews medication lists to choose who would gain most from deprescribing. Which patient is a target population?", "o": ["A healthy adult starting her first drug", "A patient newly moved to palliative care", "A teen on one stable prescription", "A patient whose guideline has not changed"], "a": 1, "e": "B is correct. Deprescribing targets patients with changes to clinical practice guidelines, new comorbidities, polypharmacy or palliative care.\nA: A first prescription is not polypharmacy.\nC: A single stable drug is not polypharmacy.\nD: Guideline changes, not unchanged guidelines, prompt deprescribing.\nHigh yield: Barriers to deprescribing: awareness, inertia, self-efficacy, feasibility.", "l": ["W8 O52", "W8 O40"]}, {"c": "Week 8", "p": "An interprofessional team works to improve adherence for patients on complex regimens. Who performs medication reconciliation, and then medication review, in order?", "o": ["Pharmacist, then nurse", "Family physician, then the pharmacist", "Nurse or pharmacist, then pharmacist", "Nurse only, then family physician"], "a": 2, "e": "C is correct. Medication reconciliation is done by a nurse or pharmacist. Medicines optimisation and medication review are done by the pharmacist.\nA: Medication review is a pharmacist task.\nB: Reconciliation is listed for the nurse or pharmacist.\nD: Reconciliation also involves pharmacists, and review is by the pharmacist.\nHigh yield: Pharmacists also coach patients on drug therapy.", "l": ["W8 O55", "W8 O54"]}, {"c": "Week 8", "p": "A health policy seminar breaks down who pays for prescription drugs in Canada. Which split of total drug costs is correct?", "o": ["50% public, 50% private plans, 0% individuals", "25% public, 50% private plans, 25% individuals", "50% public, 25% private plans, 25% individuals", "75% public, 15% private plans, 10% individuals"], "a": 2, "e": "C is correct. Public expenditure pays 50% of drug costs, private drug plans 25% and individuals 25%.\nA: Individuals pay 25% directly.\nB: Public expenditure is the largest payer.\nD: Public pays 50%, not 75%.\nHigh yield: Your Week 8 quiz: payment comes from provincial government, private plans and patients.", "l": ["W8 O18", "W8 O16"]}, {"c": "Week 8", "p": "A new diabetes drug was approved after trials. Two years later, reports of a rare liver injury lead to new warnings. In which phase of drug development was this adverse reaction detected?", "o": ["Phase IV", "Phase II", "Phase III", "Phase I"], "a": 0, "e": "A is correct. Phase IV is post-market surveillance, where rare adverse reactions surface in large real-world populations.\nB: Phase II tests the drug in patients.\nC: Phase III compares head-to-head with standard of care.\nD: Phase I typically uses about 20 male volunteers aged 21-30.\nHigh yield: Report new drug and unusual adverse events to Health Canada.", "l": ["W8 O47", "W8 O48"]}, {"c": "Week 8", "p": "A resident asks about the physician-industry relationship in Canada. Which statement is correct?", "o": ["Industry finds marketing to physicians the most efficient", "Physicians refuse patient-suggested drugs more often than not", "No codes of conduct separate physicians from industry", "Direct-to-consumer drug advertising is not legal in Canada"], "a": 3, "e": "D is correct. Direct-to-consumer advertising is not legal in Canada.\nA: Industry has found that, per sale, marketing to physicians is inefficient.\nB: When a patient comes with a suggestion, physicians are less likely to refuse it.\nC: Guidances and codes of conduct set boundaries with industry representatives.\nHigh yield: Historically, industry spent heavily to influence physician behaviour.", "l": ["W8 O22"]}, {"c": "Week 8", "p": "Two children develop adverse drug reactions. Patient 1 is a newborn treated with chloramphenicol. Patient 2 is a child given tetracycline. Which reaction fits each, in order?", "o": ["Grey baby syndrome, then dental staining", "Grey baby syndrome, then Reye syndrome", "Kernicterus, then dental staining", "Gasping syndrome, then severe liver damage"], "a": 0, "e": "A is correct. Chloramphenicol causes grey baby syndrome. Tetracycline causes dental staining.\nB: Reye syndrome follows aspirin.\nC: Kernicterus follows sulfonamides.\nD: Gasping syndrome follows benzyl alcohol, and liver damage follows valproic acid under 4 years.\nHigh yield: Phase II glucuronidation is low at birth, which affects drugs such as chloramphenicol.", "l": ["W8 O38", "W8 O37"]}, {"c": "Week 8", "p": "A prescription reads: \"2 tabs p.o. q.6h prn\" for pain. How should the pharmacist explain it to the patient?", "o": ["Two tablets by mouth six times a day as needed", "Two tablets by mouth every other day as needed", "Two tablets by mouth every 6 hours on schedule", "Two tablets by mouth every 6 hours as needed"], "a": 3, "e": "D is correct. p.o. means orally, q.6h means every six hours, and prn means as needed.\nA: Six times a day is not q.6h.\nB: Every other day is q.o.d.\nC: prn means as needed, not on a fixed schedule.\nHigh yield: b.i.d. twice a day, t.i.d. three times, q.i.d. four times, q.h.s. before bed.", "l": ["W8 O28"]}];

.1": "Identify stressors and differentiate situational stress from a true anxiety disorder", "W6 1.6": "List common urgent presentations of cancer", "W6 2.4": "Identify clues in history & physical examination to narrow differential diagnosis of a mass in general and a breast mass specifically", "W6 2.3": "Identify relevant information in history & physical examination to build a differential diagnosis of a mass in general and a breast mass specifically", "W6 2.2": "Develop a list of problems that can lead to a differential diagnosis of a mass based on knowledge of anatomy, cell and tissue types, and general pathologic processes", "W6 2.1": "Outline the process of creating a differential diagnosis for a mass in general and a breast mass specifically", "W6 3.1": "Build an approach to selecting investigation", "W6 3.3": "Apply Choosing Wisely principles to reduce inappropriate test utilization & unnecessary testing", "W6 3.4": "Demonstrate how to appropriately complete a pathology requisition", "W6 3.5": "Interpret common phrases pathologists use to communicate uncertainty in pathology reports", "W6 4.5": "Interpret a cancer synoptic report and cancer genetics test report", "W6 6.3": "Explain benefits of referral for cancer genetic counseling, including risk assessment, informed consent for genetic testing, and screening of additional family members", "W6 7.8": "List and discuss the molecular hallmarks of cancer", "W6 7.2": "Describe the macroscopic, histologic, genetic and molecular features of cancer", "W6 7.3": "Outline general principles of carcinogenesis", "W6 7.4": "Describe the basic steps of carcinogenesis from premalignant cell to invasive cancer", "W6 8.3": "List several non-modifiable and lifestyle risk factors associated with cancer", "W6 7.5": "Outline risk factors for development of cancer", "W6 12.1": "Demonstrate an understanding of the roles of the interprofessional health care team in the treatment and follow-up of cancer patients including end of life care", "W6 7.10": "Describe potential anatomical routes for cancer spread", "W6 6.4": "Explain how cancer staging and molecular pathology can be used to inform prognosis and treatment", "W7 1.1": "Define healthy aging and the factors and behaviours associated with healthy aging and longevity", "W7 1.7": "Explain how age-related changes increase an older adult's risk of falls", "W7 9.7": "Identify the morbidity and mortality associated with falls and that they are often multifactorial in etiology", "W7 3.1": "Explain a Functional History by exploring all Activities of Daily Living (ADLs) & Instrumental Activities of Daily Living (IADLs)", "W7 3.5": "List the components of a comprehensive geriatric medication history including adherence, understanding of medications, use of medication aids, prescription & non-prescription medications, insurance coverage, immunizations and allergies", "W7 3.4": "Identify the importance of collateral history taking in the assessment of an older patient", "W7 5.2": "Evaluate the major risk factors for late-life depression", "W7 5.4": "Identify the unique features of how late life depression presents compared to younger adults", "W7 5.3": "Select an appropriate standardized tool to screen for late-life depression", "W7 7.4": "List lab investigations suggested by Canadian Consensus Conference on Dementia guidelines for the workup of dementia", "W7 7.6": "Describe basic approaches for the management of mild cognitive impairment and dementia", "W7 9.5": "Discuss ways to prevent frailty in an older adult", "W7 9.1": "Describe how frailty differs from comorbidity", "W7 10.1": "Describe the roles of interdisciplinary team members in caring for an older adult", "W7 10.2": "Create a plan for collaborating with other health professions in order to provide comprehensive and inclusive care to older adults", "W7 10.3": "Recommend appropriate community resources to older adults taking into account the unique needs of the older individual, and the mandate, cost, and entry criteria of the agency", "W8 O3": "List the main types of receptors", "W8 O1": "Provide examples of pharmacological targets", "W8 O9": "Compare the different routes of administration with regards to their main advantages and disadvantages", "W8 O7": "Describe the four basic processes of pharmacokinetics: drug absorption, distribution, metabolism and excretion", "W8 O8": "List factors that affect the rate and extent of drug absorption, distribution, metabolism and excretion", "W8 O30": "Describe the clinical relevance of the therapeutic window of a drug", "W8 O31": "Describe how the therapeutic window of a drug can affect its dosing interval", "W8 O29": "Define half-life of a drug, therapeutic range, steady state concentration and loading/maintenance dose", "W8 O52": "Define deprescribing and identify the types of patients that benefit most from this strategy", "W8 O40": "Define polypharmacy", "W8 O55": "Compare the role of partner health professionals in effective and safe drug therapy", "W8 O54": "Identify barriers to treatment compliance", "W8 O18": "Explain the drug utilization in the Canadian Health Care system", "W8 O16": "Describe the governance and funding models the Canadian healthcare", "W8 O47": "Summarize the phases of drug development and identify how adverse drug reactions are studied and detected at each stage.", "W8 O48": "Describe how adverse drug reactions are monitored in Canada, with reference to systems such as the Canada Vigilance Program.", "W8 O22": "Identify potential conflicts of interest in the Physician-industry relationship as it relates to drug access", "W8 O38": "Identify factors that lead to adverse drug reactions across the lifespan", "W8 O37": "Compare the pharmacokinetics and pharmacodynamics changes across the lifespan", "W8 O28": "Describe the terminology used in prescription"};
const L = "ABCDE";
const N = QUESTIONS.length;
let cur = 0, showResults = false;
let ans = new Array(N).fill(null);           // current pick per question
let tries = QUESTIONS.map(()=>[]);           // every locked attempt: {pick, ok, at}
let strikes = QUESTIONS.map(()=>[]);         // struck option indexes for the open attempt
let history = [], db = null, uid = null, writing = false, dirty = false;
const LS_KEY = "quiz-progress-v2";
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");

function score(){ return ans.reduce((n,a,i)=>n+(a!==null&&a===QUESTIONS[i].a?1:0),0); }
function answered(){ return ans.filter(a=>a!==null).length; }
function firstTryScore(){ return tries.reduce((n,t)=>n+(t.length&&t[0].ok?1:0),0); }
function firstTryCount(){ return tries.filter(t=>t.length).length; }

function renderHeader(){
  $("#stats").innerHTML = `<span>Item <b>${showResults?"–":cur+1}</b> of <b>${N}</b></span><span>Answered <b>${answered()}</b></span><span>Score <b>${score()} / ${answered()}</b></span>`;
  $("#ticks").innerHTML = QUESTIONS.map((q,i)=>{
    const st = ans[i]===null?"":(ans[i]===q.a?"ok":"bad");
    const redo = tries[i].length>1 || (ans[i]===null && tries[i].length>0);
    return `<button class="tick ${st} ${redo?"redo":""} ${(!showResults&&i===cur)?"cur":""}" data-i="${i}" aria-label="Question ${i+1}"></button>`;
  }).join("");
  document.querySelectorAll(".tick").forEach(b=>b.onclick=()=>{cur=+b.dataset.i;showResults=false;render();});
}

function triesLine(i, includeCurrent){
  const t = includeCurrent ? tries[i] : tries[i];
  if(!t.length) return "";
  const parts = t.map((x,k)=>`<span class="${x.ok?"ok":"bad"}">${k+1}: ${L[x.pick]} ${x.ok?"correct":"wrong"}</span>`).join(" · ");
  return `<div class="tries">Attempts ${parts}</div>`;
}

function renderQ(){
  const q = QUESTIONS[cur], a = ans[cur], done = a!==null, st = strikes[cur];
  const opts = q.o.map((o,i)=>{
    let c = "";
    if(done){ if(i===q.a) c="right"; else if(i===a) c="wrong"; }
    const struck = !done && st.includes(i);
    const strikeBtn = done ? "" : `<button class="strike" data-s="${i}" aria-pressed="${struck}" aria-label="${struck?"Restore":"Strike out"} option ${L[i]}" title="${struck?"Restore":"Strike out"} option">${struck?"↺":"✕"}</button>`;
    return `<div class="optrow ${struck?"struck":""}"><button class="opt ${c}" data-i="${i}" ${done?"disabled":""}><span class="k">${L[i]}</span><span>${esc(o)}</span></button>${strikeBtn}</div>`;
  }).join("");
  let fb = "";
  if(done){
    const ok = a===q.a;
    const lines = q.e.split("\n").map(t=>`<p>${esc(t)}</p>`).join("");
    const objs = q.l.map(id=>`<div class="obj">Objective: ${esc(id)}. ${esc(OBJECTIVES[id]||"")}</div>`).join("");
    fb = `<div class="fb" role="status"><div class="verdict ${ok?"ok":"bad"}">${ok?"Correct.":"Incorrect. The answer is "+L[q.a]+"."}</div>${lines}${objs}${triesLine(cur)}<div class="fbtools"><button class="btn ghost" id="redo">Reset and redo this question</button></div></div>`;
  }
  const pre = (!done && tries[cur].length) ? `<div class="hint">Redo. Your earlier attempts are saved.</div>${triesLine(cur)}` : (!done ? `<div class="hint">Tap ✕ to strike out an option. Right-click works too.</div>` : "");
  const last = cur===N-1;
  $("#main").innerHTML = `<article class="card">
    <div class="chead"><span class="tag">${esc(q.c)}</span><span>Q${cur+1}</span></div>
    <p class="stem">${esc(q.p)}</p>
    ${pre}
    <div class="opts">${opts}</div>${fb}
    <div class="nav"><button class="btn ghost" id="prev" ${cur===0?"disabled":""}>Previous</button>
    <button class="btn" id="next" ${done?"":"disabled"}>${last?"See results":"Next"}</button></div>
  </article>`;
  document.querySelectorAll(".opt").forEach(b=>{
    b.onclick=()=>{ const p=+b.dataset.i; ans[cur]=p; tries[cur].push({pick:p, ok:p===q.a, at:new Date().toISOString()}); tries[cur]=tries[cur].slice(-10); strikes[cur]=[]; render(false); persist(); };
    b.oncontextmenu=(e)=>{ if(done) return; e.preventDefault(); toggleStrike(+b.dataset.i); };
  });
  document.querySelectorAll(".strike").forEach(b=>b.onclick=()=>toggleStrike(+b.dataset.s));
  const r=$("#redo"); if(r) r.onclick=()=>{ ans[cur]=null; strikes[cur]=[]; render(false); persist(); };
  $("#prev").onclick=()=>{cur--;render();};
  $("#next").onclick=()=>{ if(last){showResults=true;} else cur++; render(); };
}

function toggleStrike(i){
  const s = strikes[cur], k = s.indexOf(i);
  if(k<0) s.push(i); else s.splice(k,1);
  render(false); persist();
}

function renderResults(){
  const s = score(), pct = Math.round(100*s/N);
  const cats = {};
  QUESTIONS.forEach((q,i)=>{ cats[q.c]=cats[q.c]||[0,0]; cats[q.c][1]++; if(ans[i]===q.a) cats[q.c][0]++; });
  const rows = Object.entries(cats).map(([c,[r,t]])=>`<tr><td>${esc(c)}</td><td>${r} / ${t}</td></tr>`).join("");
  const missed = {};
  QUESTIONS.forEach((q,i)=>{ const wrongFirst = tries[i].length && !tries[i][0].ok; if(ans[i]!==q.a || wrongFirst) q.l.forEach(id=>{ const w=id.split(" ")[0]; missed[w]=missed[w]||new Set(); missed[w].add(id); }); });
  const weeks = Object.keys(missed).sort((x,y)=>parseInt(x.slice(1))-parseInt(y.slice(1)));
  const missHtml = weeks.length ? weeks.map(w=>`<h3>Week ${w.slice(1)}</h3><ul class="miss">${[...missed[w]].map(id=>`<li><code>${esc(id)}</code>${esc(OBJECTIVES[id]||"")}</li>`).join("")}</ul>`).join("") : "<p>No missed objectives.</p>";
  const redone = tries.filter(t=>t.length>1).length;
  const un = N - answered();
  $("#main").innerHTML = `<article class="card">
    <div class="chead"><span class="tag">Results</span><span>${un?un+" unanswered":"Complete"}</span></div>
    <div><div class="big">${s} / ${N}</div><div class="stats"><span><b>${pct}%</b> correct now</span><span>First try <b>${firstTryScore()} / ${firstTryCount()}</b></span><span>Redone <b>${redone}</b></span></div></div>
    <table><thead><tr><th>Category</th><th>Score</th></tr></thead><tbody>${rows}</tbody></table>
    <h2>Objectives to review</h2><p class="hint">Includes questions you missed on the first try, even if a redo got them right.</p>${missHtml}${history.length?`<h2>Past attempts</h2><table><thead><tr><th>Date</th><th>Score</th></tr></thead><tbody>${history.slice().reverse().map(h=>`<tr><td>${new Date(h.date).toLocaleDateString()}</td><td>${h.score} / ${h.total}</td></tr>`).join("")}</tbody></table>`:""}
    <div class="nav"><button class="btn ghost" id="back">Back to questions</button><button class="btn" id="restart">Restart all</button></div>
  </article>`;
  $("#back").onclick=()=>{showResults=false;render();};
  $("#restart").onclick=()=>{
    if(answered() || tries.some(t=>t.length)){
      history.push({date:new Date().toISOString(), score:score(), answered:answered(), total:N, firstTry:firstTryScore(),
        missed:QUESTIONS.map((q,i)=>ans[i]!==null&&ans[i]!==q.a?"q"+(i+1):null).filter(Boolean)});
      history=history.slice(-20);
    }
    ans.fill(null); tries=QUESTIONS.map(()=>[]); strikes=QUESTIONS.map(()=>[]); cur=0; showResults=false; render(); persist();
  };
}

function setSave(text, cls){ const el=$("#save"); if(el){ el.textContent=text; el.className="save "+(cls||""); } }
function bodyOf(){
  const a = {};
  QUESTIONS.forEach((q,i)=>{
    if(ans[i]===null && !tries[i].length && !strikes[i].length) return;
    a["q"+(i+1)] = {pick:ans[i], ok:ans[i]!==null && ans[i]===q.a, l:q.l, tries:tries[i], strikes:strikes[i]};
  });
  return {answers:a, history, total:N, answered:answered(), score:score(), firstTry:firstTryScore(), updatedAt:new Date().toISOString()};
}
function validPick(i,p){ return Number.isInteger(p) && p>=0 && p<QUESTIONS[i].o.length; }
function applySaved(d){
  if(!d || typeof d!=="object") return;
  ans.fill(null); tries=QUESTIONS.map(()=>[]); strikes=QUESTIONS.map(()=>[]);
  const a = d.answers || {};
  for(const k in a){
    const i = parseInt(k.slice(1),10)-1, row = a[k];
    if(!(i>=0 && i<N) || !row || typeof row!=="object") continue;
    if(validPick(i,row.pick)) ans[i]=row.pick;
    if(Array.isArray(row.tries)) tries[i]=row.tries.filter(t=>t&&validPick(i,t.pick)).map(t=>({pick:t.pick, ok:t.pick===QUESTIONS[i].a, at:String(t.at||"")})).slice(-10);
    else if(ans[i]!==null) tries[i]=[{pick:ans[i], ok:ans[i]===QUESTIONS[i].a, at:""}];
    if(Array.isArray(row.strikes)) strikes[i]=row.strikes.filter(x=>validPick(i,x));
  }
  history = Array.isArray(d.history) ? d.history.slice(-20) : [];
  const first = ans.findIndex(x=>x===null); cur = first<0 ? N-1 : first;
}
function lsLoad(){ try{ return JSON.parse(localStorage.getItem(LS_KEY)||"null"); }catch(e){ return null; } }
function lsSave(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(bodyOf())); }catch(e){} }
async function persist(){
  lsSave();
  if(!db || !uid) return;
  dirty = true; if(writing) return; writing = true;
  while(dirty){
    dirty = false;
    setSave("Saving…");
    try{ await db.doc("attempts/"+uid).set(bodyOf()); setSave("Progress saved to your account.","ok"); }
    catch(e){
      if(e && e.code==="invalid_argument"){ db=null; setSave("Progress saves in this browser only.","bad"); break; }
      setSave("Could not save to your account. Progress saves in this browser.","bad");
    }
  }
  writing = false;
}
async function connect(){
  try{
    if(!window.claude || !window.claude.use) return;
    const [u, d] = await Promise.all([window.claude.use("user"), window.claude.use("db")]);
    if(!u || !d) return;
    const id = await u.id(); if(!id) return;
    db = d; uid = id;
    const snap = await db.doc("attempts/"+uid).get();
    if(snap.exists){ applySaved(snap.data()); render(); setSave("Progress saved to your account.","ok"); }
    else if(answered() || tries.some(t=>t.length)){ persist(); }
    else setSave("Progress saves to your account.","ok");
  }catch(e){ /* keep local-only mode */ }
}

function render(top=true){ renderHeader(); showResults?renderResults():renderQ(); if(top) window.scrollTo({top:0}); }
applySaved(lsLoad());
render();
connect();
</script>
